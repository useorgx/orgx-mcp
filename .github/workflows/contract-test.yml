name: Contract Test

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly Monday 9am UTC
  workflow_dispatch:

concurrency:
  group: mcp-contract-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ORGX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.ORGX_CI_RUNNER && 140 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.18.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify main app API is reachable
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' https://useorgx.com/api/health || true)"
          if [ "$STATUS" != "200" ]; then
            echo "Main app API unreachable (HTTP $STATUS)"
            exit 1
          fi
          echo "Main app API healthy"

      - name: Verify MCP server is healthy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            https://mcp.useorgx.com/healthz >/dev/null
          echo "MCP server healthy"

      - name: Verify OAuth discovery
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            https://mcp.useorgx.com/.well-known/oauth-authorization-server \
            | jq -e '.token_endpoint' >/dev/null
          echo "OAuth discovery OK"

      - name: Verify local entity type catalog is populated
        run: node scripts/check-entity-type-catalog.mjs

      - name: Install Chromium for browser contract checks
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing Chromium (attempt $attempt/3)"
            if pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} --only-shell chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Chromium download failed; retrying"
              sleep 5
            fi
          done
          echo "::error::Unable to install Chromium after 3 attempts"
          exit 1

      - name: Verify widget rendering in supported host variants
        run: pnpm widget:verify-rendering

      - name: Verify widget payload semantics and interactions
        run: pnpm widget:verify-payloads
