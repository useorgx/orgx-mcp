name: Collect encrypted Cloudflare warning sample

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-encrypted-warning-sample
  cancel-in-progress: false

jobs:
  sample:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'useorgx/orgx-mcp' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    steps:
      - name: Verify trusted source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'useorgx/orgx-mcp'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Encrypt bounded warning sample
        timeout-minutes: 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/cloudflare-encrypted-warning-sample.mjs

      - name: Preserve ciphertext-only sample
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-warning-sample-encrypted
          path: artifacts/qa/cloudflare-warning-sample/encrypted-sample.json
          if-no-files-found: ignore
          retention-days: 1
