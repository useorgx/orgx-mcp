name: Deploy MCP Server

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_registry:
        description: "Publish to MCP Registry after deploy"
        type: boolean
        default: false
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - production
          - preview
        default: production
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: mcp-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs get the validation gate, but never deploy a shared preview.
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/validate

  # Main, release, and manual production/preview deploys validate in the same
  # job that deploys. This avoids a second checkout and dependency install.
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      url: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'preview' && 'https://mcp-staging.useorgx.com' || 'https://mcp.useorgx.com' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/validate
        with:
          wrangler-environment: ${{ env.DEPLOY_ENV }}

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            VERSION="$RELEASE_TAG"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-${COMMIT_SHA:0:7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Update server.json version
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$RELEASE_VERSION" '.version = $v' \
            server.json > tmp.json && mv tmp.json server.json

      - name: Sync production Worker secrets
        if: ${{ env.DEPLOY_ENV == 'production' }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          python3 - <<'PY' > "$secrets_file"
          import json
          import os

          payload = {
              "ORGX_SERVICE_KEY": os.environ.get("ORGX_SERVICE_KEY"),
              "OAUTH_CLIENT_ID": os.environ.get("OAUTH_CLIENT_ID"),
              "OAUTH_CLIENT_SECRET": os.environ.get("OAUTH_CLIENT_SECRET"),
              "MCP_JWT_SECRET": os.environ.get("MCP_JWT_SECRET"),
              "ORGX_INTERNAL_SECRET": os.environ.get("ORGX_INTERNAL_SECRET"),
              "MCP_REGISTRY_PUBKEY": os.environ.get("MCP_REGISTRY_PUBKEY"),
              "COOKIE_ENCRYPTION_KEY": os.environ.get("COOKIE_ENCRYPTION_KEY"),
              "SENTRY_DSN": os.environ.get("SENTRY_DSN"),
          }
          print(json.dumps({k: v for k, v in payload.items() if v}))
          PY
          pnpm wrangler secret bulk "$secrets_file" --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ORGX_SERVICE_KEY: ${{ secrets.ORGX_SERVICE_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.ORGX_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.ORGX_OAUTH_CLIENT_SECRET }}
          MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET }}
          ORGX_INTERNAL_SECRET: ${{ secrets.ORGX_INTERNAL_SECRET }}
          MCP_REGISTRY_PUBKEY: ${{ secrets.MCP_REGISTRY_PUBKEY }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.MCP_COOKIE_ENCRYPTION_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Sync preview Worker secrets
        if: ${{ env.DEPLOY_ENV == 'preview' }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          python3 - <<'PY' > "$secrets_file"
          import json
          import os

          payload = {
              "ORGX_SERVICE_KEY": os.environ.get("ORGX_SERVICE_KEY"),
              "OAUTH_CLIENT_ID": os.environ.get("OAUTH_CLIENT_ID"),
              "OAUTH_CLIENT_SECRET": os.environ.get("OAUTH_CLIENT_SECRET"),
              "MCP_JWT_SECRET": os.environ.get("MCP_JWT_SECRET"),
              "ORGX_INTERNAL_SECRET": os.environ.get("ORGX_INTERNAL_SECRET"),
              "SENTRY_DSN": os.environ.get("SENTRY_DSN"),
          }
          print(json.dumps({k: v for k, v in payload.items() if v}))
          PY
          pnpm wrangler secret bulk "$secrets_file" --env preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ORGX_SERVICE_KEY: ${{ secrets.ORGX_SERVICE_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.ORGX_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.ORGX_OAUTH_CLIENT_SECRET }}
          MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET }}
          ORGX_INTERNAL_SECRET: ${{ secrets.ORGX_INTERNAL_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          SENTRY_RELEASE: ${{ steps.version.outputs.version }}
        run: >-
          pnpm wrangler deploy --env "$DEPLOY_ENV" --outdir dist
          --upload-source-maps --var "SENTRY_RELEASE:$SENTRY_RELEASE"

      - name: Upload Sentry source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.version.outputs.version }}
        run: pnpm sentry:sourcemaps

      - name: Sync Worker triggers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        run: pnpm wrangler triggers deploy --env "$DEPLOY_ENV"

      - name: Verify deployment
        env:
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          sleep 5
          if [[ "$DEPLOY_ENV" == "preview" ]]; then
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              https://mcp-staging.useorgx.com/healthz >/dev/null
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              https://mcp-staging.useorgx.com/.well-known/oauth-authorization-server \
              | jq -e '.token_endpoint' >/dev/null
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              https://mcp-staging.useorgx.com/.well-known/oauth-protected-resource \
              | jq -e '.authorization_servers' >/dev/null
            echo "Preview deployment health and OAuth metadata passed"
          else
            ./scripts/smoke-endpoints.sh https://mcp.useorgx.com https://useorgx.com
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Publish to MCP Registry (releases or manual production trigger)
  # ──────────────────────────────────────────────────────────────────────────
  publish-registry:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: deploy
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish_registry &&
       inputs.environment == 'production')
    environment:
      name: mcp-registry
    steps:
      - uses: actions/checkout@v6

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Update server.json version
        env:
          PUBLISHED_VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$PUBLISHED_VERSION" '.version = $v' \
            server.json > tmp.json && mv tmp.json server.json
          jq '{name, version, description}' server.json

      - name: Login to MCP Registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          registry_private_key="$({
            printf '%s\n' "$MCP_REGISTRY_PRIVATE_KEY" \
              | grep -v '^[[:space:]]*#' \
              | tr -d '[:space:]'
          })"

          if [[ -z "$registry_private_key" ]]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY resolved to an empty value after stripping comments/whitespace"
            exit 1
          fi

          mcp-publisher login dns \
            --domain=useorgx.com \
            --private-key="$registry_private_key"

      - name: Validate and publish
        run: |
          set -euo pipefail
          mcp-publisher validate
          mcp-publisher publish
          echo "Published to MCP Registry"
