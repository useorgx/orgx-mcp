<!DOCTYPE html>
<html lang="en" data-accent="iris">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Operation Prism: Real-Time MCP Widgets</title>
<link rel="stylesheet" href="shared/kit/ox-tokens.css" />
<script src="shared/kit/ox-elements-core.js"></script>
<script src="shared/kit/ox-elements-avatar.js"></script>
<script src="shared/agent-identity.js"></script>
<script src="shared/orgx-icons.js"></script>
<script src="shared/mcp-apps-sdk.umd.js"></script>
<script src="shared/widget-runtime.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/*
 * Scaffold streaming (demo): watch an initiative's plan arrive, workstream by
 * workstream. Surfaces, type and focus come from the shared theme; this sheet
 * only lays the card out. One card, flat sections, no card inside the card.
 */
:root{
  --ox-primary:#6366f1;--ox-primary-rgb:99, 102, 241;
  --ox-success-rgb:34,197,94;
  --ox-ease-standard:cubic-bezier(0.16,1,0.3,1);
  --ox-ease-entry:cubic-bezier(0,0,0.2,1);
  --ox-ease-morph:cubic-bezier(0.4,0,0.2,1);
  --ox-dur-fast:150ms;--ox-dur-base:250ms;--ox-dur-slow:400ms;--ox-dur-slower:600ms;
}
html,body{background:var(--ox-bg);color:var(--ox-text);font-family:var(--ox-font-sans);font-size:14px;line-height:1.5;min-height:100%}
html body{padding:10px;max-width:640px;margin:0 auto}

/* Shell: the one card. */
.shell{
  position:relative;overflow:hidden;border-radius:16px;
  border:1px solid var(--ox-border);background-color:var(--ox-panel);box-shadow:var(--ox-shadow);
}
.shell::after{
  content:'';position:absolute;top:0;left:16px;right:16px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(var(--ox-primary-rgb),.6),transparent);
}

/* Hero: what is being built, how far it got. */
.hero{padding:16px 18px 14px}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eyebrow .ox-icon{color:var(--ox-iris)}
.live-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ox-iris);box-shadow:0 0 0 3px rgba(var(--ox-primary-rgb),.16);animation:ldot 2.2s ease-in-out infinite}
.live-dot.done{animation:none;background:var(--ox-success);box-shadow:0 0 0 3px var(--ox-good-surface)}
.live-dot.error{animation:none;background:var(--ox-warning);box-shadow:0 0 0 3px var(--ox-warning-surface)}
@keyframes ldot{0%,100%{opacity:1}50%{opacity:.35}}
.hero-title{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.hero-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;
  font-size:12px;font-weight:600;color:var(--ox-iris);
  background:var(--ox-info-surface);border:1px solid rgba(var(--ox-primary-rgb),.24);
}
.status-pill.done{color:var(--ox-success);background:var(--ox-good-surface);border-color:rgba(var(--ox-success-rgb),.28)}
.status-pill.warn{color:var(--ox-warning);background:var(--ox-warning-surface);border-color:rgba(251,191,36,.3)}
.s-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.wbs-count{font-size:12.5px;color:var(--ox-text-muted);font-variant-numeric:tabular-nums}

/* Progress: a real bar with a track, not a hairline. */
.prog-wrap{height:6px;margin-top:12px;border-radius:999px;background:var(--ox-surface-subtle);box-shadow:inset 0 0 0 1px var(--ox-border);overflow:hidden}
.prog-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,rgba(var(--ox-primary-rgb),.75),rgb(var(--ox-primary-rgb)));transition:width var(--ox-dur-slow) var(--ox-ease-morph)}
.prog-fill.done{background:var(--ox-success)}

/* Workstreams: flat sections under one label. */
.wbs-wrap{border-top:1px solid var(--ox-border)}
.wbs-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0}
.skeleton{display:flex;flex-direction:column;gap:10px;padding:12px 18px 16px}
.sk-card{height:64px;border-radius:10px;background:var(--ox-skeleton-low);animation:shimmer 1.5s ease infinite}
.sk-card:nth-child(2){opacity:.7}.sk-card:nth-child(3){opacity:.45}
@keyframes shimmer{50%{background:var(--ox-skeleton-high)}}
.ws-stack{display:flex;flex-direction:column;padding:4px 18px 8px}
.ws-card{
  position:relative;padding:12px 0 10px;border-top:1px solid var(--ox-border);
  opacity:0;transform:translateY(8px);
  transition:opacity var(--ox-dur-slow) var(--ox-ease-entry),transform var(--ox-dur-slow) var(--ox-ease-entry);
}
.ws-card:first-child{border-top:0}
.ws-card.show{opacity:1;transform:none}
/* The workstream being written: a short accent on its left edge. */
.ws-card-accent{position:absolute;left:-18px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:rgb(var(--ws-rgb,var(--ox-primary-rgb)));opacity:0;transition:opacity var(--ox-dur-base) var(--ox-ease-standard)}
.ws-card.active-receive .ws-card-accent{opacity:1;animation:accent-pulse 1.2s ease-in-out infinite}
@keyframes accent-pulse{50%{opacity:.4}}
.ws-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px}
.ws-copy{display:flex;flex-direction:column;gap:1px;min-width:0}
.ws-title{font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ws-domain{font-size:12px;color:var(--ox-text-muted)}
.ws-count{font-size:12px;color:var(--ox-text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ws-body{display:flex;flex-direction:column;margin:6px 0 0 42px}
.ms-row,.task-row{display:flex;align-items:flex-start;gap:8px;opacity:0;transform:translateX(-4px);transition:opacity var(--ox-dur-base) var(--ox-ease-entry),transform var(--ox-dur-base) var(--ox-ease-entry)}
.ms-row.show,.task-row.show{opacity:1;transform:none}
.ms-row{padding:5px 0 3px}
.ms-icon{flex:none;margin-top:2px;color:var(--ox-warning)}
.ms-title{font-size:13.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.task-row{padding:3px 0 3px 22px}
.task-icon{flex:none;margin-top:2px;color:var(--ox-text-muted)}
.task-title{font-size:13px;line-height:1.4;color:var(--ox-text-2,var(--ox-text-muted));overflow-wrap:anywhere}
@keyframes item-appear{0%{background:rgba(var(--ox-primary-rgb),.1)}100%{background:transparent}}
.ms-row.flash,.task-row.flash{animation:item-appear .65s ease-out;border-radius:6px}

/* Done: one line that says what exists now, and the way to it. */
.banner{display:none;align-items:center;gap:10px;margin:0 18px 12px;padding:10px 12px;border-radius:12px;background:var(--ox-good-surface);color:var(--ox-text)}
.banner.show{display:flex;animation:bpop var(--ox-dur-slow) var(--ox-ease-entry)}
@keyframes bpop{from{opacity:0;transform:translateY(4px)}}
.banner-icon{flex:none;color:var(--ox-success)}
.banner-body{flex:1;min-width:0}
.banner-title{display:block;font-size:13.5px;font-weight:500;line-height:1.4}
.err-banner{display:none;margin:0 18px 14px;padding:10px 12px;border-radius:12px;background:var(--ox-warning-surface);color:var(--ox-text);font-size:13px;line-height:1.45}
.err-banner.show{display:block}
.err-banner b{color:var(--ox-warning-text)}

/* Footer: state on the left, the way into OrgX on the right. */
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:4px 10px 4px 18px;border-top:1px solid var(--ox-border);background:var(--ox-surface-subtle)}
.foot-meta{font-size:12.5px;color:var(--ox-text-muted)}
.foot-link{padding:0 8px}
button[data-oxhref]:not(.ox-open){background:none;border:0;font:inherit;cursor:pointer}

.stream-empty{display:grid;gap:6px;padding:18px 18px 20px}
.stream-empty .ox-icon{color:var(--ox-text-muted);margin-bottom:2px}
.stream-empty strong{font-size:15px;font-weight:650}
.stream-empty span{max-width:46ch;font-size:13px;line-height:1.5;color:var(--ox-text-muted)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:420px){body{padding:6px}.hero{padding:14px 14px 12px}.wbs-header{padding:12px 14px 0}.ws-stack{padding:4px 14px 8px}.ws-card-accent{left:-14px}.ws-body{margin-left:0}.banner,.err-banner{margin:0 14px 12px}.foot{padding-left:14px}}
</style>
<link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
<div class="shell ox-surface">

  <!-- What is being built, and how far it got -->
  <div class="hero">
    <div class="eyebrow"><span class="live-dot" id="ldot"></span><span id="etext">Building initiative</span></div>
    <div class="hero-title" id="heroTitle">Operation Prism: Real-Time MCP Widgets</div>
    <div class="hero-meta">
      <span class="status-pill" id="statusPill"><span class="s-dot"></span><span id="statusText">Building…</span></span>
      <span class="wbs-count" id="wbsCount"></span>
    </div>
    <div class="prog-wrap" aria-hidden="true"><div class="prog-fill" id="prog"></div></div>
  </div>

  <!-- Needs you: right under the identity, before the detail -->
  <div class="err-banner" id="errBanner" role="status"></div>

  <!-- Workstreams as they arrive -->
  <div class="wbs-wrap">
    <div class="wbs-header"><span class="wbs-label ox-eyebrow">Workstreams</span></div>
    <div class="skeleton" id="skeleton">
      <div class="sk-card"></div>
      <div class="sk-card"></div>
      <div class="sk-card"></div>
    </div>
    <div class="ws-stack" id="wsStack" style="display:none" aria-live="polite"></div>
  </div>

  <div class="banner" id="banner" role="status">
    <svg class="banner-icon" width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
      <path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="banner-body"><strong class="banner-title" id="bannerTitle">Initiative created</strong></div>
  </div>

  <div class="foot">
    <span class="foot-meta" id="footMeta">Connecting…</span>
    <button type="button" class="foot-link ox-open" id="footLink">Open live view</button>
  </div>
</div>

<script>
(function(){
  var SESSION_ID = "demo-session";
  var STREAM_URL = "https://mcp.useorgx.com/scaffold/demo-session/stream";
  var LIVE_URL   = window.OrgXLinks.live("07f49477-6807-449c-b46c-5bc71a1219da");
  document.getElementById('footLink').setAttribute('data-oxhref', LIVE_URL);
  var ICONS = window.OrgXIcons;

  /* ── Host-owned external navigation ── */
  function openExtLink(url) {
    return window.OrgXWidgetRuntime.openWidgetLink(url);
  }
  document.addEventListener('click', function(e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-oxhref]') : null;
    if (el) { e.preventDefault(); openExtLink(el.getAttribute('data-oxhref')); }
  });

  /* ── DOM refs ── */
  var shell      = document.querySelector('.shell');
  var ldot       = document.getElementById('ldot');
  var etext      = document.getElementById('etext');
  var heroTitle  = document.getElementById('heroTitle');
  var statusPill = document.getElementById('statusPill');
  var statusText = document.getElementById('statusText');
  var prog       = document.getElementById('prog');
  var wbsCount   = document.getElementById('wbsCount');
  var skeleton   = document.getElementById('skeleton');
  var wsStack    = document.getElementById('wsStack');
  var banner     = document.getElementById('banner');
  var bannerTitle = document.getElementById('bannerTitle');
  var errBanner  = document.getElementById('errBanner');
  var footMeta   = document.getElementById('footMeta');

  /* ── State ── */
  var entityCount   = 0;
  var totalExpected = 0;
  var wsCount       = 0;   /* workstream counter (WS 1, WS 2…) */
  var isDone        = false;
  var lastEventTs   = 0;
  var retryDelay    = 1000;
  var es            = null;

  /* Current workstream card + its body element */
  var curWsCard      = null; /* the .ws-card element currently receiving entities */
  var curWsBody      = null; /* its .ws-body element */
  var curMsRow       = null; /* last milestone row */
  var curWsEntityCount = 0; /* entities received into current workstream */

  /* Domain → CSS rgb variable name */
  var DOMAIN_RGB = {
    engineering:  '6,182,212',
    product:      '22,163,74',
    marketing:    '249,115,22',
    design:       '236,72,153',
    sales:        '168,85,247',
    operations:   '245,158,11',
    ops:          '245,158,11',
    orchestration:'0,201,167',
  };

  function domainRgb(d) {
    return DOMAIN_RGB[(d||'').toLowerCase()] || '0,201,167';
  }

  /* Icons come from the shared set; the task icon is a work card, never a checkbox. */
  function milestoneIcon() { return ICONS ? ICONS.icon('milestone', 16) : ''; }
  function taskIcon() { return ICONS ? ICONS.icon('task', 15) : ''; }

  /* ── Helpers ── */
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function setProgress(pct) {
    prog.style.width = Math.min(100, Math.round(pct)) + '%';
  }
  function showStack() {
    skeleton.style.display = 'none';
    wsStack.style.display = 'flex';
  }
  function resetAll() {
    wsStack.innerHTML = '';
    entityCount = 0;
    totalExpected = 0;
    wsCount = 0;
    curWsCard = null;
    curWsBody = null;
    curMsRow = null;
    wbsCount.textContent = '';
    prog.classList.remove('done');
    setProgress(2);
    showStack();
    if (shell) { shell.classList.remove('streaming'); shell.classList.remove('done'); }
    curWsEntityCount = 0;
  }
  function animateIn(el) {
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { el.classList.add('show'); });
    });
  }
  function flashItem(el) {
    /* Brief iris-primary glow + left-edge stripe on new rows */
    el.classList.add('flash');
    el.addEventListener('animationend', function() {
      el.classList.remove('flash');
    }, { once: true });
  }
  // Each workstream says how much of it has arrived ("1 milestone · 3 tasks").
  function updateWsRing() {
    if (!curWsCard) return;
    var ms = +curWsCard.getAttribute('data-ms') || 0;
    var tasks = +curWsCard.getAttribute('data-tasks') || 0;
    var el = curWsCard.querySelector('.ws-count');
    if (el) el.textContent = tasks ? tasks + (tasks === 1 ? ' task' : ' tasks') : ms ? ms + (ms === 1 ? ' milestone' : ' milestones') : '';
  }
  function bump(attr) {
    if (!curWsCard) return;
    curWsCard.setAttribute(attr, (+curWsCard.getAttribute(attr) || 0) + 1);
    updateWsRing();
  }

  /* ── Entity builders ── */
  function addInitiative(entity) {
    heroTitle.textContent = entity.title || entity.name || 'Initiative';
  }

  function addWorkstream(entity) {
    wsCount++;
    var domain = ((entity.metadata && (entity.metadata.domain || entity.metadata.agent_domain)) || entity.domain || '').toLowerCase();
    var rgb    = domainRgb(domain);
    var label  = entity.title || entity.name || 'Workstream';

    var card = document.createElement('div');
    card.className = 'ws-card';
    card.style.cssText = '--ws-rgb:' + rgb;

    /* Top accent bar */
    var accent = document.createElement('div');
    accent.className = 'ws-card-accent';
    card.appendChild(accent);

    /* Header: the owning agent's face (hover card), the name, the domain. */
    var identity = window.OrgXAgentIdentity;
    var who = identity ? identity.profile(domain) : null;
    var head = document.createElement('div');
    head.className = 'ws-head';
    head.innerHTML =
      (identity ? identity.agentCard({ agent: domain, name: who ? who.name : label, size: 'row', state: 'running', task: label }) : '<span></span>') +
      '<span class="ws-copy"><span class="ws-title">' + esc(label) + '</span>' +
      (domain ? '<span class="ws-domain">' + esc((who ? who.name + ' · ' : '') + domain.charAt(0).toUpperCase() + domain.slice(1)) + '</span>' : '') +
      '</span>' +
      '<span class="ws-count"></span>';
    card.appendChild(head);

    /* Body (milestones + tasks will go here) */
    var body = document.createElement('div');
    body.className = 'ws-body';
    card.appendChild(body);

    /* Complete the previous card's ring */
    if (curWsCard) curWsCard.classList.remove('active-receive');

    wsStack.appendChild(card);
    animateIn(card);
    card.classList.add('active-receive');

    curWsCard        = card;
    curWsBody        = body;
    curMsRow         = null;
    curWsEntityCount = 0;
  }

  function addMilestone(entity) {
    var label = entity.title || entity.name || 'Milestone';
    var target = curWsBody || wsStack;

    var row = document.createElement('div');
    row.className = 'ms-row';
    row.innerHTML =
      '<span class="ms-icon">' + milestoneIcon() + '</span>' +
      '<span class="ms-title">' + esc(label) + '</span>';

    target.appendChild(row);
    animateIn(row);
    setTimeout(function() { flashItem(row); }, 60);
    bump('data-ms');
    curMsRow = row;
  }

  function addTask(entity) {
    var label  = entity.title || entity.name || 'Task';
    var target = curWsBody || wsStack;

    var row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML =
      '<span class="task-icon">' + taskIcon() + '</span>' +
      '<span class="task-title">' + esc(label) + '</span>';

    target.appendChild(row);
    animateIn(row);
    setTimeout(function() { flashItem(row); }, 60);
    bump('data-tasks');
  }

  function addEntity(entityType, entity) {
    switch (entityType) {
      case 'initiative':  addInitiative(entity); break;
      case 'workstream':  addWorkstream(entity); break;
      case 'milestone':   addMilestone(entity);  break;
      case 'task':
      default:            addTask(entity);        break;
    }
  }

  /* ── Event handlers ── */
  function onSessionStart(data) {
    if (data.title) heroTitle.textContent = data.title;
    etext.textContent = 'Building initiative';
    statusText.textContent = 'Building…';
    statusPill.classList.remove('done', 'warn');
    resetAll();
    ldot.className = 'live-dot';
  }

  function onEntityCreated(data) {
    entityCount++;
    totalExpected = data.total || totalExpected;
    /* Start shell pulse on very first entity */
    if (entityCount === 1 && shell) shell.classList.add('streaming');
    addEntity(data.entityType || 'task', data.entity || {});
    var pct = totalExpected > 0 ? 5 + (entityCount / totalExpected) * 85 : 50;
    setProgress(pct);
    wbsCount.textContent = entityCount + (totalExpected ? ' of ' + totalExpected : '') + ' created';
  }

  function onComplete(data) {
    isDone = true;
    setProgress(100);
    if (curWsCard) curWsCard.classList.remove('active-receive');
    prog.classList.add('done');
    /* Shell celebration: swap streaming pulse for success glow */
    if (shell) { shell.classList.remove('streaming'); shell.classList.add('done'); }
    ldot.className = 'live-dot done';
    etext.textContent = 'Initiative ready';
    var total = data.totalEntities || entityCount;
    statusText.textContent = 'Ready';
    statusPill.classList.add('done');
    wbsCount.textContent = total + ' of ' + total + ' created';
    footMeta.textContent = 'Synced just now';

    bannerTitle.textContent = wsCount + ' workstreams, ' + total + ' items in OrgX. Owners can start.';
    var liveLink = window.OrgXLinks.normalize(data.liveUrl) || LIVE_URL;
    document.getElementById('footLink').setAttribute('data-oxhref', liveLink);
    banner.classList.add('show');

    if (es) { try { es.close(); } catch(_){} }
  }

  function onError(data) {
    ldot.className = 'live-dot error';
    statusText.textContent = 'Stopped';
    statusPill.classList.add('warn');
    errBanner.textContent = 'The build stopped: ' + window.OrgXWidgetRuntime.getErrorMessage(data.error, 'the scaffold failed') + '. What arrived is kept below.';
    errBanner.classList.add('show');
    if (es) { try { es.close(); } catch(_){} }
  }

  function handleEvent(data) {
    if (data.ts) lastEventTs = data.ts;
    switch (data.type) {
      case 'session.start':     return onSessionStart(data);
      case 'entity.created':    return onEntityCreated(data);
      case 'scaffold.complete': return onComplete(data);
      case 'scaffold.error':    return onError(data);
    }
  }

  /* ── SSE with exponential backoff ── */
  function connect() {
    if (isDone) return;
    if (es) { try { es.close(); } catch(_){} }
    var url = STREAM_URL + (lastEventTs ? '?since=' + lastEventTs : '');

    if (entityCount === 0) {
      skeleton.style.display = 'flex';
      wsStack.style.display = 'none';
      statusText.textContent = 'Connecting…';
    } else {
      statusText.textContent = 'Reconnecting…';
    }

    es = new EventSource(url);

    es.onopen = function() {
      ldot.className = 'live-dot';
      statusText.textContent = entityCount > 0 ? 'Resuming…' : 'Building…';
      footMeta.textContent = 'Live';
      retryDelay = 1000;
    };

    es.onmessage = function(ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch(_) { return; }
      handleEvent(data);
    };

    es.onerror = function() {
      if (isDone) return;
      try { es.close(); } catch(_) {}
      var wait = Math.round(retryDelay / 1000);
      statusText.textContent = 'Retrying in ' + wait + 's';
      footMeta.textContent = 'Connection dropped';
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    };
  }

  /* ── Demo mode: simulate scaffold stream without SSE ── */
  var DEMO = [
      {type:'session.start', title:'Operation Prism: Real-Time MCP Widgets'},
      {type:'entity.created', entityType:'initiative', total:18, entity:{title:'Operation Prism: Real-Time MCP Widgets'}},
      {type:'entity.created', entityType:'workstream', total:18, entity:{title:'SSE Infrastructure', domain:'engineering'}},
      {type:'entity.created', entityType:'milestone',  total:18, entity:{title:'LiveFeedDO shipped'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Alarm-based polling (10s cycle)'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Secure stream tokens (HMAC-SHA256)'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Fan-out to EventSource clients'}},
      {type:'entity.created', entityType:'workstream', total:18, entity:{title:'Widget Polish', domain:'design'}},
      {type:'entity.created', entityType:'milestone',  total:18, entity:{title:'Production visual parity'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Card layout + WBS badges'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Radial progress rings'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Domain avatar images'}},
      {type:'entity.created', entityType:'workstream', total:18, entity:{title:'Go-to-Market', domain:'marketing'}},
      {type:'entity.created', entityType:'milestone',  total:18, entity:{title:'Product Hunt launch'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Tweet thread'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'LinkedIn announcement'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Product Hunt submission'}},
      {type:'scaffold.complete', totalEntities:18, liveUrl:'https://useorgx.com/live/07f49477-6807-449c-b46c-5bc71a1219da'}
    ];
  function runDemo() {
    var DELAYS = [500,200,450,380,360,360,360,500,420,360,360,360,500,420,360,360,360,900];
    var idx = 0;
    ldot.className = 'live-dot';
    statusText.textContent = 'Building…';
    footMeta.textContent = 'Live';
    function fireNext() {
      if (idx >= DEMO.length) return;
      handleEvent(DEMO[idx]);
      var delay = DELAYS[idx] || 360;
      idx++;
      if (idx < DEMO.length) setTimeout(fireNext, delay);
    }
    setTimeout(fireNext, 700);
  }

  function showIdleState() {
    ldot.className = 'live-dot done';
    etext.textContent = 'Scaffold';
    heroTitle.textContent = 'No scaffold running';
    statusText.textContent = 'Idle';
    statusPill.classList.remove('done', 'warn');
    footMeta.textContent = 'Not connected';
    // No session means no live view to open yet.
    document.getElementById('footLink').hidden = true;
    skeleton.style.display = 'none';
    document.querySelector('.prog-wrap').style.display = 'none';
    document.querySelector('.wbs-header').style.display = 'none';
    wsStack.style.display = 'block';
    wsStack.innerHTML = '<div class="stream-empty">' + (ICONS ? ICONS.icon('initiative', 22) : '') +
      '<strong>Start a scaffold to watch it build here.</strong>' +
      '<span>Ask for an initiative to be planned, and its workstreams, milestones and tasks appear here as OrgX creates them.</span></div>';
  }

  /*
   * Gallery states replay the demo stream at once, so every state shows the
   * hierarchy that exists: all of it when complete, what arrived so far when
   * paused or out of date. Nothing renders as an empty card.
   */
  function showDemoState(mode) {
    if (mode === 'empty') {
      showIdleState();
      return;
    }
    var done = mode === 'completed' || mode === 'resolved';
    var upto = done ? DEMO.length : 12;
    for (var i = 0; i < upto; i++) handleEvent(DEMO[i]);
    Array.prototype.forEach.call(document.querySelectorAll('.ws-card,.ms-row,.task-row'), function (el) {
      el.classList.add('show');
      el.classList.remove('flash');
    });
    if (shell) shell.classList.remove('streaming');
    if (done) return;
    if (curWsCard) curWsCard.classList.remove('active-receive');
    statusPill.classList.add('warn');
    ldot.className = 'live-dot error';
    if (mode === 'blocked' || mode === 'error') {
      etext.textContent = 'Paused';
      statusText.textContent = 'Needs you';
      footMeta.textContent = 'Paused at ' + entityCount + ' of ' + totalExpected;
      errBanner.innerHTML = '<b>Waiting on an approval.</b> The next workstream needs a decision before OrgX creates it. What exists so far is below.';
    } else {
      etext.textContent = 'Out of date';
      statusText.textContent = 'Last update 14m ago';
      footMeta.textContent = 'Live updates stopped';
      errBanner.innerHTML = '<b>This may have moved on.</b> The last update is older than the live window; open the live view for the current plan.';
    }
    errBanner.classList.add('show');
  }

  var _params = new URLSearchParams(location.search);
  var _demo = _params.get('demo') === 'true';
  var _live = _params.get('live') === 'true';
  var _loading = _params.get('loading') === 'true';
  var _state = _params.get('state') || '';
  if (_demo && ['completed', 'resolved', 'blocked', 'error', 'stale', 'degraded', 'empty'].indexOf(_state) >= 0) {
    showDemoState(_state);
  } else if (_demo) {
    runDemo();
  } else if (_live) {
    connect();
  } else if (_loading) {
    statusText.textContent = 'Connecting…';
    footMeta.textContent = 'Waiting for the stream';
  } else {
    showIdleState();
  }
})();
</script>
