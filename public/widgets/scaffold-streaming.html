<!DOCTYPE html>
<html lang="en" data-accent="iris">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Operation Prism: Real-Time MCP Widgets</title>
<script src="shared/mcp-apps-sdk.umd.js"></script>
<script src="shared/widget-runtime.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── OrgX Token System ─────────────────────────────────── */
/* Light mode is the default (matches production widgets) */
:root,:root[data-theme="light"]{
  --ox-bg:#f8fafc;
  --ox-panel:#ffffff;
  --ox-card:#f1f5f9;
  --ox-border:rgba(0,0,0,.08);
  --ox-border-strong:rgba(0,0,0,.15);
  --ox-text:#0f172a;
  --ox-text-muted:#64748b;
  --ox-text-sub:#94a3b8;
  --ox-well:#f1f5f9;
  --ox-shadow:0 12px 32px -12px rgba(0,0,0,.1),0 2px 6px rgba(0,0,0,.04);
  --ox-grid:rgba(0,0,0,.03);
}
/* Dark mode via media query */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ox-bg:#02040a;
    --ox-panel:rgba(8,12,20,.96);
    --ox-card:rgba(14,19,30,.9);
    --ox-border:rgba(255,255,255,.07);
    --ox-border-strong:rgba(255,255,255,.14);
    --ox-text:#f2f7ff;
    --ox-text-muted:rgba(255,255,255,.46);
    --ox-text-sub:rgba(255,255,255,.28);
    --ox-well:rgba(0,0,0,.3);
    --ox-shadow:0 28px 56px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);
    --ox-grid:rgba(255,255,255,.02);
  }
}
/* Explicit dark theme override */
:root[data-theme="dark"]{
  --ox-bg:#02040a;
  --ox-panel:rgba(8,12,20,.96);
  --ox-card:rgba(14,19,30,.9);
  --ox-border:rgba(255,255,255,.07);
  --ox-border-strong:rgba(255,255,255,.14);
  --ox-text:#f2f7ff;
  --ox-text-muted:rgba(255,255,255,.46);
  --ox-text-sub:rgba(255,255,255,.28);
  --ox-well:rgba(0,0,0,.3);
  --ox-shadow:0 28px 56px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);
  --ox-grid:rgba(255,255,255,.02);
}
/* Invariant tokens */
:root{
  --ox-primary:#6366f1;--ox-primary-rgb:99, 102, 241;
  --ox-success:#22c55e;--ox-success-rgb:34,197,94;
  --ox-danger:#f43f5e;
  --ox-warn:#fbbf24;--ox-warn-rgb:251,191,36;
  --ox-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --ox-font:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  /* ── Canonical motion vocabulary (standalone — must declare its own) ── */
  --ox-ease-standard:cubic-bezier(0.16,1,0.3,1); /* settled UI / hover / press */
  --ox-ease-entry:cubic-bezier(0,0,0.2,1);       /* arriving */
  --ox-ease-exit:cubic-bezier(0.4,0,1,1);        /* leaving */
  --ox-ease-morph:cubic-bezier(0.4,0,0.2,1);     /* shape/state change in place */
  --ox-dur-instant:50ms;
  --ox-dur-fast:150ms;
  --ox-dur-base:250ms;
  --ox-dur-slow:400ms;
  --ox-dur-slower:600ms;
  /* domain rgb palette */
  --rgb-engineering:6,182,212;
  --rgb-product:22,163,74;
  --rgb-marketing:249,115,22;
  --rgb-design:236,72,153;
  --rgb-sales:168,85,247;
  --rgb-operations:245,158,11;
  --rgb-ops:245,158,11;
  --rgb-orchestration:0,201,167;
  --rgb-default:99,102,241;
}

html,body{
  background:var(--ox-bg);color:var(--ox-text);
  font-family:var(--ox-font);font-size:13px;line-height:1.5;min-height:100%;
}
body{padding:14px 14px 20px;max-width:580px;margin:0 auto}

/* ── Shell (main card) ─────────────────────────────────── */
.shell{
  border-radius:18px;overflow:hidden;
  border:1px solid rgba(var(--ox-primary-rgb),.12);
  background:linear-gradient(180deg,rgba(var(--ox-primary-rgb),.05),transparent 40%),var(--ox-panel);
  box-shadow:var(--ox-shadow);
  position:relative;
}
/* Top shine line */
.shell::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ox-primary-rgb),.55),transparent);
  pointer-events:none;
}

/* ── Initiative Hero ───────────────────────────────────── */
.hero{padding:18px 20px 14px}
.eyebrow{
  display:flex;align-items:center;gap:7px;
  font-family:var(--ox-mono);font-size:.56rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ox-text-muted);
  margin-bottom:10px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:var(--ox-primary);
  box-shadow:0 0 14px rgba(var(--ox-primary-rgb),.55);
  animation:ldot 2.2s ease-in-out infinite;
}
.live-dot.done{animation:none;background:var(--ox-success);box-shadow:0 0 10px rgba(var(--ox-success-rgb),.5)}
.live-dot.error{animation:none;background:var(--ox-danger);box-shadow:none}
@keyframes ldot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.68)}}

.hero-title{
  font-size:clamp(15px,3.5vw,20px);font-weight:700;
  letter-spacing:-.03em;color:var(--ox-text);line-height:1.2;
  word-break:break-word;
}
.hero-meta{
  display:flex;align-items:center;gap:8px;
  margin-top:10px;flex-wrap:wrap;
}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;
  font-family:var(--ox-mono);font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  border:1px solid rgba(var(--ox-primary-rgb),.22);
  background:rgba(var(--ox-primary-rgb),.1);
  color:var(--ox-primary);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.status-pill.done{
  border-color:rgba(var(--ox-success-rgb),.22);
  background:rgba(var(--ox-success-rgb),.1);
  color:var(--ox-success);
}
.s-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.status-pill:not(.done) .s-dot{animation:sdot .8s ease-in-out infinite;box-shadow:0 0 5px currentColor}
@keyframes sdot{0%,100%{opacity:1}50%{opacity:.3}}

/* Progress bar */
.prog-wrap{
  height:2px;background:var(--ox-border);border-radius:2px;
  margin-top:12px;overflow:hidden;
}
.prog-fill{
  height:100%;background:var(--ox-primary);border-radius:2px;width:0%;
  transition:width var(--ox-dur-slow) var(--ox-ease-morph);
  box-shadow:0 0 8px rgba(var(--ox-primary-rgb),.5);
}

/* ── WBS Section ───────────────────────────────────────── */
.wbs-wrap{border-top:1px solid var(--ox-border)}
.wbs-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 20px;
}
.wbs-label{
  font-family:var(--ox-mono);font-size:.54rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ox-text-sub);
}
.wbs-count{
  font-family:var(--ox-mono);font-size:.6rem;font-weight:600;
  color:var(--ox-text-muted);letter-spacing:.04em;
}

/* ── Skeleton ──────────────────────────────────────────── */
.skeleton{display:flex;flex-direction:column;gap:8px;padding:12px 16px 14px}
.sk-card{
  height:72px;border-radius:10px;
  background:linear-gradient(90deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.09) 50%,rgba(0,0,0,.05) 75%);
  background-size:200% 100%;animation:shimmer 1.5s ease infinite;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .sk-card{
    background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);
    background-size:200% 100%;
  }
}
:root[data-theme="dark"] .sk-card{
  background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);
  background-size:200% 100%;
}
.sk-card:nth-child(2){opacity:.7}
.sk-card:nth-child(3){opacity:.5}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Workstream Stack ──────────────────────────────────── */
.ws-stack{
  display:flex;flex-direction:column;gap:8px;
  padding:10px 14px 14px;
}

/* ── Per-workstream progress ring ──────────────────────── */
.ws-ring{
  position:relative;width:28px;height:28px;flex-shrink:0;
  margin-left:auto;  /* pushes ring to right of card header */
}
.ws-ring svg{
  width:100%;height:100%;display:block;
  transform:rotate(-90deg);
}
.ws-ring-track{
  fill:none;
  stroke:rgba(var(--ws-rgb,var(--ox-primary-rgb)),.14);
  stroke-width:2.5;
}
.ws-ring-bar{
  fill:none;
  stroke:rgb(var(--ws-rgb,var(--ox-primary-rgb)));
  stroke-width:2.5;stroke-linecap:round;
  transition:stroke-dashoffset var(--ox-dur-base) var(--ox-ease-morph),opacity var(--ox-dur-base) var(--ox-ease-morph);
}
.ws-ring__val{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--ox-mono);font-size:.45rem;font-weight:700;
  color:rgb(var(--ws-rgb,var(--ox-primary-rgb)));
  letter-spacing:-.02em;
}

/* ── Agent avatar (workstream card) ────────────────────── */
.ws-agent{
  position:relative;width:30px;height:30px;flex-shrink:0;
}
.ws-avatar{
  width:30px;height:30px;border-radius:9px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:rgba(var(--ws-rgb,var(--ox-primary-rgb)),.12);
  border:1px solid rgba(var(--ws-rgb,var(--ox-primary-rgb)),.22);
  color:rgb(var(--ws-rgb,var(--ox-primary-rgb)));
  font-family:var(--ox-mono);font-size:.7rem;font-weight:700;
  box-shadow:0 8px 16px -12px rgba(var(--ws-rgb,var(--ox-primary-rgb)),.5),
             inset 0 1px 0 rgba(255,255,255,.05);
}
.ws-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ws-domain-badge{
  position:absolute;right:-3px;bottom:-3px;
  width:14px;height:14px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  background:var(--ox-panel);
  border:1px solid var(--ox-border);
  color:rgb(var(--ws-rgb,var(--ox-primary-rgb)));
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.ws-domain-badge svg{width:8px;height:8px}

/* ── Workstream Card ───────────────────────────────────── */
.ws-card{
  border-radius:12px;overflow:hidden;
  border:1px solid var(--ox-border);
  background:var(--ox-card);
  position:relative; /* needed for scan-line pseudo */
  /* Controlled emergence: workstream cards arrive on the entry curve. */
  opacity:0;transform:translateY(10px);
  transition:opacity var(--ox-dur-slow) var(--ox-ease-entry),
             transform var(--ox-dur-slow) var(--ox-ease-entry),
             border-color var(--ox-dur-base) var(--ox-ease-standard),
             box-shadow var(--ox-dur-slow) var(--ox-ease-standard);
}
.ws-card.show{opacity:1;transform:translateY(0)}

/* Active-receive: domain-colored glow + accent pulse */
.ws-card.active-receive{
  border-color:rgba(var(--ws-rgb,var(--ox-primary-rgb)),.28);
  box-shadow:
    0 0 0 1px rgba(var(--ws-rgb,var(--ox-primary-rgb)),.06) inset,
    0 8px 28px -8px rgba(var(--ws-rgb,var(--ox-primary-rgb)),.14),
    0 16px 40px -20px rgba(0,0,0,.5);
}
/* Animated scan-line sweep across the active card */
.ws-card.active-receive::before{
  content:'';position:absolute;
  left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(var(--ws-rgb,var(--ox-primary-rgb)),.07),transparent);
  animation:scan-sweep 1.6s ease-in-out infinite;
  pointer-events:none;z-index:0;
}
@keyframes scan-sweep{
  0%{top:-50%;opacity:1}
  70%{opacity:.5}
  100%{top:110%;opacity:0}
}
/* Pulse the domain-colored accent while receiving */
.ws-card.active-receive .ws-card-accent{
  animation:accent-pulse 1.2s ease-in-out infinite;
}
@keyframes accent-pulse{0%,100%{opacity:1}50%{opacity:.38}}

/* Domain-colored top accent bar */
.ws-card-accent{
  height:2px;
  background:linear-gradient(90deg,rgb(var(--ws-rgb,var(--ox-primary-rgb))),transparent 70%);
  position:relative;z-index:1;
}

/* Card header row */
.ws-head{
  display:flex;align-items:center;gap:7px;
  padding:9px 12px 8px;position:relative;z-index:1;
}
.ws-num{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--ox-mono);font-size:.58rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;
  background:rgba(var(--ws-rgb,var(--ox-primary-rgb)),.12);
  border:1px solid rgba(var(--ws-rgb,var(--ox-primary-rgb)),.22);
  color:rgb(var(--ws-rgb,var(--ox-primary-rgb)));
  flex-shrink:0;white-space:nowrap;
}
.ws-num svg{opacity:.8}
.ws-title{
  flex:1;min-width:0;
  font-size:12px;font-weight:600;color:var(--ox-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ws-domain{
  font-family:var(--ox-mono);font-size:.54rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--ox-text-sub);flex-shrink:0;white-space:nowrap;
}

/* Divider below card header */
.ws-body{border-top:1px solid var(--ox-border)}

/* ── Milestone Rows ────────────────────────────────────── */
.ms-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 12px;
  border-bottom:1px solid var(--ox-border);
  opacity:0;transform:translateX(-6px);
  transition:opacity var(--ox-dur-base) var(--ox-ease-entry),transform var(--ox-dur-base) var(--ox-ease-entry);
}
.ms-row.show{opacity:1;transform:translateX(0)}
.ms-icon{
  width:18px;height:18px;border-radius:5px;flex-shrink:0;margin-top:1px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(var(--ox-warn-rgb),.14);
  border:1px solid rgba(var(--ox-warn-rgb),.24);
  color:var(--ox-warn);
  box-shadow:0 2px 6px -2px rgba(var(--ox-warn-rgb),.3);
}
.ms-icon svg{width:10px;height:10px}
.ms-title{flex:1;min-width:0;font-size:11.5px;font-weight:500;color:var(--ox-text);line-height:1.4}

/* ── Task Rows ─────────────────────────────────────────── */
.task-row{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px 5px 16px;
  opacity:0;transform:translateX(-4px);
  transition:opacity var(--ox-dur-fast) var(--ox-ease-entry),transform var(--ox-dur-fast) var(--ox-ease-entry);
}
.task-row.show{opacity:1;transform:translateX(0)}
.task-icon{
  width:14px;height:14px;flex-shrink:0;
  color:var(--ox-text-sub);
  display:inline-flex;align-items:center;justify-content:center;
}
.task-icon svg{width:12px;height:12px}
.task-title{flex:1;min-width:0;font-size:11px;color:var(--ox-text-muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Completion Banner ─────────────────────────────────── */
.banner{
  display:none;margin:0 14px 12px;padding:12px 14px;border-radius:10px;
  background:linear-gradient(135deg,rgba(var(--ox-primary-rgb),.1),rgba(var(--ox-primary-rgb),.04));
  border:1px solid rgba(var(--ox-primary-rgb),.22);
  position:relative;overflow:hidden;
}
.banner::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ox-primary-rgb),.6),transparent);
}
.banner.show{display:flex;align-items:flex-start;gap:10px;animation:bpop var(--ox-dur-slow) var(--ox-ease-entry)}
@keyframes bpop{0%{opacity:0;transform:translateY(6px) scale(.98)}100%{opacity:1;transform:none}}
.banner-icon{flex-shrink:0;color:var(--ox-primary);margin-top:1px}
.banner-body{flex:1;min-width:0}
.banner-title{display:block;font-weight:700;font-size:12px;color:var(--ox-text);margin-bottom:3px}
.banner-link{
  color:var(--ox-primary);text-decoration:none;font-size:11px;font-family:var(--ox-mono);
  letter-spacing:.02em;display:inline-flex;align-items:center;gap:3px;
}
.banner-link:hover{text-decoration:underline}

/* ── Footer ────────────────────────────────────────────── */
.foot{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px 14px;
  border-top:1px solid var(--ox-border);
  flex-wrap:wrap;gap:8px;
  margin-top:2px;
}
.foot-meta{
  font-family:var(--ox-mono);font-size:.58rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ox-text-sub);
}
.foot-link{
  font-family:var(--ox-mono);font-size:.62rem;font-weight:600;
  letter-spacing:.03em;color:var(--ox-primary);text-decoration:none;
  display:inline-flex;align-items:center;gap:4px;
  min-height:44px;
  padding:5px 11px;border-radius:7px;
  border:1px solid rgba(var(--ox-primary-rgb),.22);
  background:rgba(var(--ox-primary-rgb),.07);
  transition:background var(--ox-dur-fast) var(--ox-ease-standard),border-color var(--ox-dur-fast) var(--ox-ease-standard);white-space:nowrap;
}
.foot-link:hover{background:rgba(var(--ox-primary-rgb),.14);border-color:rgba(var(--ox-primary-rgb),.32)}

/* ── Link bridge: button resets so data-oxhref buttons look like links ── */
button[data-oxhref]:not(.foot-link){background:none;border:none;padding:0;font:inherit;cursor:pointer;text-align:left}

/* ── Error state ───────────────────────────────────────── */
.err-banner{
  display:none;margin:0 14px 12px;padding:10px 14px;border-radius:8px;
  background:rgba(244,63,94,.06);border:1px solid rgba(244,63,94,.2);
  font-size:11px;color:#fb7185;line-height:1.4;font-family:var(--ox-mono);
}
.err-banner.show{display:block}

/* ── Item flash: iris-primary glow on arrival ─────────── */
@keyframes item-appear{
  0%  {background:rgba(var(--ox-primary-rgb),.09);
       box-shadow:inset 0 0 0 1px rgba(var(--ox-primary-rgb),.28)}
  100%{background:transparent;box-shadow:none}
}
.ms-row.flash,.task-row.flash{animation:item-appear .65s ease-out}

/* ── Shell: subtle border pulse while streaming ────────── */
@keyframes stream-pulse{
  0%,100%{border-color:rgba(var(--ox-primary-rgb),.12)}
  50%    {border-color:rgba(var(--ox-primary-rgb),.28)}
}
.shell.streaming{animation:stream-pulse 2.4s ease-in-out infinite}

/* ── Shell done celebration ────────────────────────────── */
@keyframes done-pulse{
  0%  {border-color:rgba(var(--ox-primary-rgb),.12);
       box-shadow:var(--ox-shadow)}
  35% {border-color:rgba(var(--ox-success-rgb),.5);
       box-shadow:var(--ox-shadow),
                  0 0 0 2px rgba(var(--ox-success-rgb),.1),
                  0 0 56px -8px rgba(var(--ox-success-rgb),.22)}
  100%{border-color:rgba(var(--ox-success-rgb),.22);
       box-shadow:var(--ox-shadow),
                  0 0 0 1px rgba(var(--ox-success-rgb),.05)}
}
.shell.done{animation:done-pulse var(--ox-dur-slower) var(--ox-ease-standard) forwards}

/* ── Accessibility: reduced-motion guard (standalone widget) ──────────
 * Don't kill animations outright — collapse their duration so `forwards`
 * states still settle visibly and ambient effects degrade gracefully.
 */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}

.stream-empty {
  display: grid;
  gap: 6px;
  padding: 22px 20px 24px;
  border-top: 1px solid var(--ox-border);
  color: var(--ox-text-muted);
}
.stream-empty strong {
  color: var(--ox-text);
  font-size: .92rem;
  font-weight: 600;
}
.stream-empty span {
  max-width: 46ch;
  font-size: .82rem;
  line-height: 1.55;
}
</style>
<link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
<div class="shell">

  <!-- Initiative hero -->
  <div class="hero">
    <div class="eyebrow">
      <div class="live-dot" id="ldot"></div>
      <svg width="11px" height="11px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--ox-primary);opacity:.7;flex-shrink:0"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.1"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle></svg>
      <span id="etext">INITIATIVE SCAFFOLDED</span>
    </div>
    <div class="hero-title" id="heroTitle">Operation Prism: Real-Time MCP Widgets</div>
    <div class="hero-meta">
      <span class="status-pill" id="statusPill">
        <span class="s-dot"></span>
        <span id="statusText">BUILDING…</span>
      </span>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  </div>

  <!-- WBS section -->
  <div class="wbs-wrap">
    <div class="wbs-header">
      <span class="wbs-label">WORK BREAKDOWN STRUCTURE</span>
      <span class="wbs-count" id="wbsCount"></span>
    </div>

    <!-- Skeleton (while connecting) -->
    <div class="skeleton" id="skeleton">
      <div class="sk-card"></div>
      <div class="sk-card"></div>
      <div class="sk-card"></div>
    </div>

    <!-- Live workstream cards -->
    <div class="ws-stack" id="wsStack" style="display:none"></div>
  </div>

  <!-- Completion banner -->
  <div class="banner" id="banner">
    <svg class="banner-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
      <path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="banner-body">
      <strong class="banner-title" id="bannerTitle">Initiative created</strong>
      <span id="bannerSub"></span>
    </div>
  </div>

  <div class="err-banner" id="errBanner"></div>

  <!-- Footer -->
  <div class="foot">
    <span class="foot-meta" id="footMeta">SYNCING…</span>
    <button class="foot-link" data-oxhref="https://useorgx.com/live/07f49477-6807-449c-b46c-5bc71a1219da">Open Live View ↗</button>
  </div>
</div>

<script>
(function(){
  var SESSION_ID = "demo-session";
  var STREAM_URL = "https://mcp.useorgx.com/scaffold/demo-session/stream";
  var LIVE_URL   = "https://useorgx.com/live/07f49477-6807-449c-b46c-5bc71a1219da";

  /* ── Host-owned external navigation ── */
  function openExtLink(url) {
    return window.OrgXWidgetRuntime.openWidgetLink(url);
  }
  document.addEventListener('click', function(e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-oxhref]') : null;
    if (el) { e.preventDefault(); openExtLink(el.getAttribute('data-oxhref')); }
  });

  /* ── DOM refs ── */
  var shell      = document.querySelector('.shell');
  var ldot       = document.getElementById('ldot');
  var etext      = document.getElementById('etext');
  var heroTitle  = document.getElementById('heroTitle');
  var statusPill = document.getElementById('statusPill');
  var statusText = document.getElementById('statusText');
  var prog       = document.getElementById('prog');
  var wbsCount   = document.getElementById('wbsCount');
  var skeleton   = document.getElementById('skeleton');
  var wsStack    = document.getElementById('wsStack');
  var banner     = document.getElementById('banner');
  var bannerTitle = document.getElementById('bannerTitle');
  var bannerSub  = document.getElementById('bannerSub');
  var errBanner  = document.getElementById('errBanner');
  var footMeta   = document.getElementById('footMeta');
  var footLinkSlot = document.getElementById('footLinkSlot');

  /* ── State ── */
  var entityCount   = 0;
  var totalExpected = 0;
  var wsCount       = 0;   /* workstream counter (WS 1, WS 2…) */
  var isDone        = false;
  var lastEventTs   = 0;
  var retryDelay    = 1000;
  var es            = null;

  /* Current workstream card + its body element */
  var curWsCard      = null; /* the .ws-card element currently receiving entities */
  var curWsBody      = null; /* its .ws-body element */
  var curMsRow       = null; /* last milestone row */
  var curWsRingBar   = null; /* <circle class="ws-ring-bar"> for current card */
  var curWsRingVal   = null; /* .ws-ring__val text node */
  var curWsEntityCount = 0; /* entities received into current workstream */
  var WS_RING_R      = 11;  /* ring radius (px, viewBox 28×28 center at 14,14) */
  var WS_RING_CIRC   = +(2 * Math.PI * WS_RING_R).toFixed(2);
  var WS_RING_FULL   = 8;   /* treat 8 entities as "full" ring */

  /* Domain → CSS rgb variable name */
  var DOMAIN_RGB = {
    engineering:  '6,182,212',
    product:      '22,163,74',
    marketing:    '249,115,22',
    design:       '236,72,153',
    sales:        '168,85,247',
    operations:   '245,158,11',
    ops:          '245,158,11',
    orchestration:'0,201,167',
  };

  var ASSET_BASE = 'https://mcp.useorgx.com/widgets/shared/';
  var DOMAIN_AVATAR = {
    engineering:  ASSET_BASE + 'engineering_autopilot.png',
    product:      ASSET_BASE + 'product_orchestrator.png',
    marketing:    ASSET_BASE + 'launch_captain.png',
    sales:        ASSET_BASE + 'pipeline_intelligence.png',
    operations:   ASSET_BASE + 'control_tower.png',
    ops:          ASSET_BASE + 'control_tower.png',
    design:       ASSET_BASE + 'design_codex.png',
    orchestration:ASSET_BASE + 'xandy_orchestrator.png',
  };

  function domainRgb(d) {
    return DOMAIN_RGB[(d||'').toLowerCase()] || '0,201,167';
  }

  /* ── SVG icon helpers ── */
  function _svg(content, size) {
    var s = typeof size === 'number' ? size + 'px' : (size || '1em');
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + content + '</svg>';
  }
  var DOMAIN_ICON = {
    engineering:  function(){ return _svg('<polyline points="9 8 5 12 9 16"></polyline><polyline points="15 8 19 12 15 16"></polyline>', 9); },
    product:      function(){ return _svg('<circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.1"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>', 9); },
    marketing:    function(){ return _svg('<path d="M3 11v2"></path><path d="M6 10v4"></path><path d="M9 9v6"></path><path d="M9 10c5 0 8-4 8-4v12s-3-4-8-4"></path>', 9); },
    design:       function(){ return _svg('<path d="m12 4 1.3 4.2L17.5 9.5l-4.2 1.3L12 15l-1.3-4.2L6.5 9.5l4.2-1.3z" fill="currentColor" stroke="none"></path>', 9); },
    sales:        function(){ return _svg('<path d="M5 15 10 10 13 13 19 7"></path><path d="M15 7h4v4"></path>', 9); },
    operations:   function(){ return _svg('<circle cx="12" cy="12" r="3"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>', 9); },
  };
  function domainIcon(d) {
    var fn = DOMAIN_ICON[d] || DOMAIN_ICON['engineering'];
    /* default: nodes icon */
    if (!DOMAIN_ICON[d]) return _svg('<circle cx="6" cy="12" r="2" fill="currentColor" stroke="none"></circle><circle cx="18" cy="7" r="2" fill="currentColor" stroke="none"></circle><circle cx="18" cy="17" r="2" fill="currentColor" stroke="none"></circle><path d="M8 12h6"></path><path d="M16.2 8.3 12.8 11"></path><path d="M16.2 15.7 12.8 13"></path>', 9);
    return fn();
  }
  function milestoneIcon() {
    return _svg('<path d="M5 3v18"></path><path d="m5 4 12 1-2 4 2 4-12-1z" fill="currentColor" fill-opacity="0.15"></path>', 10);
  }
  function taskIcon() {
    return _svg('<rect x="4" y="4" width="16" height="16" rx="4" fill="currentColor" fill-opacity="0.12"></rect><path d="M9 12.2 11 14.2 15.2 10"></path>', 12);
  }
  function initiativeIcon(s) {
    return _svg('<circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.1"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>', s || 14);
  }
  function workstreamIcon(s) {
    return _svg('<rect x="2" y="2" width="20" height="20" rx="6" fill="currentColor" fill-opacity="0.1" stroke="none"></rect><path d="M6 6c3 0 5 6 8 6"></path><path d="M6 18c3 0 5-6 8-6"></path><path d="M6 12h12"></path><path d="m14 8 4 4-4 4"></path><circle cx="6" cy="6" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="6" cy="12" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="6" cy="18" r="1.5" fill="currentColor" stroke="none"></circle>', s || 13);
  }

  /* ── Helpers ── */
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function setProgress(pct) {
    prog.style.width = Math.min(100, Math.round(pct)) + '%';
  }
  function showStack() {
    skeleton.style.display = 'none';
    wsStack.style.display = 'flex';
  }
  function resetAll() {
    wsStack.innerHTML = '';
    entityCount = 0;
    totalExpected = 0;
    wsCount = 0;
    curWsCard = null;
    curWsBody = null;
    curMsRow = null;
    wbsCount.textContent = '';
    setProgress(2);
    showStack();
    if (shell) { shell.classList.remove('streaming'); shell.classList.remove('done'); }
    curWsRingBar     = null;
    curWsRingVal     = null;
    curWsEntityCount = 0;
  }
  function animateIn(el) {
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { el.classList.add('show'); });
    });
  }
  function flashItem(el) {
    /* Brief iris-primary glow + left-edge stripe on new rows */
    el.classList.add('flash');
    el.addEventListener('animationend', function() {
      el.classList.remove('flash');
    }, { once: true });
  }
  function updateWsRing(fill100) {
    if (!curWsRingBar) return;
    var pct   = fill100 ? 1 : Math.min(1, curWsEntityCount / WS_RING_FULL);
    var offset = +(WS_RING_CIRC * (1 - pct)).toFixed(2);
    curWsRingBar.style.strokeDashoffset = offset;
    if (curWsRingVal) curWsRingVal.textContent = Math.round(pct * 100) + '%';
  }

  /* ── Entity builders ── */
  function addInitiative(entity) {
    heroTitle.textContent = entity.title || entity.name || 'Initiative';
  }

  function addWorkstream(entity) {
    wsCount++;
    var domain = ((entity.metadata && (entity.metadata.domain || entity.metadata.agent_domain)) || entity.domain || '').toLowerCase();
    var rgb    = domainRgb(domain);
    var label  = entity.title || entity.name || 'Workstream';

    var card = document.createElement('div');
    card.className = 'ws-card';
    card.style.cssText = '--ws-rgb:' + rgb;

    /* Top accent bar */
    var accent = document.createElement('div');
    accent.className = 'ws-card-accent';
    card.appendChild(accent);

    /* Header */
    var avatarUrl = DOMAIN_AVATAR[domain] || '';
    var initial   = label.charAt(0).toUpperCase() || '?';
    var avatarImg = avatarUrl
      ? '<img src="' + esc(avatarUrl) + '" alt="' + esc(label) + '" loading="lazy" onerror="this.style.display=&apos;none&apos;" />'
      : esc(initial);
    var head = document.createElement('div');
    head.className = 'ws-head';
    head.innerHTML =
      '<div class="ws-agent">' +
        '<div class="ws-avatar">' + avatarImg + '</div>' +
        '<div class="ws-domain-badge">' + domainIcon(domain) + '</div>' +
      '</div>' +
      '<span class="ws-num">' + workstreamIcon(9) + ' WS ' + wsCount + '</span>' +
      '<span class="ws-title">' + esc(label) + '</span>' +
      (domain ? '<span class="ws-domain">' + esc(domain.toUpperCase()) + '</span>' : '') +
      '<div class="ws-ring" aria-hidden="true">' +
        '<svg viewBox="0 0 28 28">' +
          '<circle class="ws-ring-track" cx="14" cy="14" r="' + WS_RING_R + '"></circle>' +
          '<circle class="ws-ring-bar" cx="14" cy="14" r="' + WS_RING_R + '"' +
            ' style="stroke-dasharray:' + WS_RING_CIRC + ';stroke-dashoffset:' + WS_RING_CIRC + ';"></circle>' +
        '</svg>' +
        '<div class="ws-ring__val">0%</div>' +
      '</div>';
    card.appendChild(head);

    /* Body (milestones + tasks will go here) */
    var body = document.createElement('div');
    body.className = 'ws-body';
    card.appendChild(body);

    /* Complete the previous card's ring */
    if (curWsCard) {
      curWsCard.classList.remove('active-receive');
      updateWsRing(true); /* fill to 100% */
    }

    wsStack.appendChild(card);
    animateIn(card);
    card.classList.add('active-receive');

    curWsCard        = card;
    curWsBody        = body;
    curMsRow         = null;
    curWsEntityCount = 0;
    curWsRingBar     = head.querySelector('.ws-ring-bar');
    curWsRingVal     = head.querySelector('.ws-ring__val');
  }

  function addMilestone(entity) {
    var label = entity.title || entity.name || 'Milestone';
    var target = curWsBody || wsStack;

    var row = document.createElement('div');
    row.className = 'ms-row';
    row.innerHTML =
      '<span class="ms-icon">' + milestoneIcon() + '</span>' +
      '<span class="ms-title">' + esc(label) + '</span>';

    target.appendChild(row);
    animateIn(row);
    setTimeout(function() { flashItem(row); }, 60);
    curWsEntityCount++;
    updateWsRing(false);
    curMsRow = row;
  }

  function addTask(entity) {
    var label  = entity.title || entity.name || 'Task';
    var target = curWsBody || wsStack;

    var row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML =
      '<span class="task-icon">' + taskIcon() + '</span>' +
      '<span class="task-title">' + esc(label) + '</span>';

    target.appendChild(row);
    animateIn(row);
    setTimeout(function() { flashItem(row); }, 60);
    curWsEntityCount++;
    updateWsRing(false);
  }

  function addEntity(entityType, entity) {
    switch (entityType) {
      case 'initiative':  addInitiative(entity); break;
      case 'workstream':  addWorkstream(entity); break;
      case 'milestone':   addMilestone(entity);  break;
      case 'task':
      default:            addTask(entity);        break;
    }
  }

  /* ── Event handlers ── */
  function onSessionStart(data) {
    if (data.title) heroTitle.textContent = data.title;
    etext.textContent = 'INITIATIVE SCAFFOLDED';
    statusText.textContent = 'BUILDING…';
    statusPill.classList.remove('done');
    resetAll();
    ldot.className = 'live-dot';
  }

  function onEntityCreated(data) {
    entityCount++;
    totalExpected = data.total || totalExpected;
    /* Start shell pulse on very first entity */
    if (entityCount === 1 && shell) shell.classList.add('streaming');
    addEntity(data.entityType || 'task', data.entity || {});
    var pct = totalExpected > 0 ? 5 + (entityCount / totalExpected) * 85 : 50;
    setProgress(pct);
    wbsCount.textContent = entityCount + ' / ' + (totalExpected || '?');
  }

  function onComplete(data) {
    isDone = true;
    setProgress(100);
    if (curWsCard) {
      curWsCard.classList.remove('active-receive');
      updateWsRing(true); /* fill last card's ring to 100% */
    }
    /* Shell celebration: swap streaming pulse for success glow */
    if (shell) { shell.classList.remove('streaming'); shell.classList.add('done'); }
    ldot.className = 'live-dot done';
    etext.textContent = 'INITIATIVE SCAFFOLDED';
    var total = data.totalEntities || entityCount;
    statusText.textContent = total + ' ENTITIES';
    statusPill.classList.add('done');
    wbsCount.textContent = total + ' / ' + total;
    footMeta.textContent = 'SYNCED';

    bannerTitle.textContent = total + ' entities created successfully';
    var liveLink = data.liveUrl || LIVE_URL;
    if (liveLink) {
      var bl = document.createElement('button');
      bl.className = 'banner-link';
      bl.setAttribute('data-oxhref', liveLink);
      bl.textContent = 'Open live view ↗';
      bannerSub.appendChild(bl);
    }
    banner.classList.add('show');

    /* Inject footer link if not already hardcoded */
    if (footLinkSlot && liveLink) {
      var btn = document.createElement('button');
      btn.className = 'foot-link';
      btn.setAttribute('data-oxhref', liveLink);
      btn.textContent = 'Open Live View ↗';
      footLinkSlot.replaceWith(btn);
      footLinkSlot = null;
    }

    if (es) { try { es.close(); } catch(_){} }
  }

  function onError(data) {
    ldot.className = 'live-dot error';
    statusText.textContent = 'ERROR';
    errBanner.textContent = 'Error: ' + window.OrgXWidgetRuntime.getErrorMessage(data.error, 'scaffold failed');
    errBanner.classList.add('show');
    if (es) { try { es.close(); } catch(_){} }
  }

  function handleEvent(data) {
    if (data.ts) lastEventTs = data.ts;
    switch (data.type) {
      case 'session.start':     return onSessionStart(data);
      case 'entity.created':    return onEntityCreated(data);
      case 'scaffold.complete': return onComplete(data);
      case 'scaffold.error':    return onError(data);
    }
  }

  /* ── SSE with exponential backoff ── */
  function connect() {
    if (isDone) return;
    if (es) { try { es.close(); } catch(_){} }
    var url = STREAM_URL + (lastEventTs ? '?since=' + lastEventTs : '');

    if (entityCount === 0) {
      skeleton.style.display = 'flex';
      wsStack.style.display = 'none';
      statusText.textContent = 'CONNECTING…';
    } else {
      statusText.textContent = 'RECONNECTING…';
    }

    es = new EventSource(url);

    es.onopen = function() {
      ldot.className = 'live-dot';
      statusText.textContent = entityCount > 0 ? 'RESUMING…' : 'BUILDING…';
      footMeta.textContent = 'LIVE';
      retryDelay = 1000;
    };

    es.onmessage = function(ev) {
      var data;
      try { data = JSON.parse(ev.data); } catch(_) { return; }
      handleEvent(data);
    };

    es.onerror = function() {
      if (isDone) return;
      try { es.close(); } catch(_) {}
      var wait = Math.round(retryDelay / 1000);
      statusText.textContent = 'PAUSED ' + wait + 's…';
      footMeta.textContent = 'RECONNECTING…';
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    };
  }

  /* ── Demo mode: simulate scaffold stream without SSE ── */
  function runDemo() {
    var DEMO = [
      {type:'session.start', title:'Operation Prism: Real-Time MCP Widgets'},
      {type:'entity.created', entityType:'initiative', total:18, entity:{title:'Operation Prism: Real-Time MCP Widgets'}},
      {type:'entity.created', entityType:'workstream', total:18, entity:{title:'SSE Infrastructure', domain:'engineering'}},
      {type:'entity.created', entityType:'milestone',  total:18, entity:{title:'LiveFeedDO shipped'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Alarm-based polling (10s cycle)'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Secure stream tokens (HMAC-SHA256)'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Fan-out to EventSource clients'}},
      {type:'entity.created', entityType:'workstream', total:18, entity:{title:'Widget Polish', domain:'design'}},
      {type:'entity.created', entityType:'milestone',  total:18, entity:{title:'Production visual parity'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Card layout + WBS badges'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Radial progress rings'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Domain avatar images'}},
      {type:'entity.created', entityType:'workstream', total:18, entity:{title:'Go-to-Market', domain:'marketing'}},
      {type:'entity.created', entityType:'milestone',  total:18, entity:{title:'Product Hunt launch'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Tweet thread'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'LinkedIn announcement'}},
      {type:'entity.created', entityType:'task',       total:18, entity:{title:'Product Hunt submission'}},
      {type:'scaffold.complete', totalEntities:18, liveUrl:'https://useorgx.com/live/07f49477-6807-449c-b46c-5bc71a1219da'}
    ];
    var DELAYS = [500,200,450,380,360,360,360,500,420,360,360,360,500,420,360,360,360,900];
    var idx = 0;
    ldot.className = 'live-dot';
    statusText.textContent = 'BUILDING…';
    footMeta.textContent = 'LIVE';
    function fireNext() {
      if (idx >= DEMO.length) return;
      handleEvent(DEMO[idx]);
      var delay = DELAYS[idx] || 360;
      idx++;
      if (idx < DEMO.length) setTimeout(fireNext, delay);
    }
    setTimeout(fireNext, 700);
  }

  function showIdleState() {
    ldot.className = 'live-dot';
    etext.textContent = 'SCAFFOLD STREAM';
    heroTitle.textContent = 'No scaffold stream attached';
    statusText.textContent = 'IDLE';
    footMeta.textContent = 'NOT CONNECTED';
    skeleton.style.display = 'none';
    wsStack.style.display = 'block';
    wsStack.innerHTML = '<div class="stream-empty"><strong>Start a scaffold to watch it build here.</strong><span>Live updates connect only when this widget receives an explicit live session.</span></div>';
  }

  function showDemoState(mode) {
    if (mode === 'empty') {
      showIdleState();
      return;
    }
    resetAll();
    var config = mode === 'completed' || mode === 'resolved'
      ? {
          eyebrow: 'INITIATIVE SCAFFOLDED',
          title: 'Scaffold complete — proof attached',
          status: 'COMPLETE',
          meta: 'SYNCED',
          progress: 100,
          count: '18 / 18',
          tone: 'done',
          detail: 'All workstreams, milestones, and tasks are visible with a verified live-view link.'
        }
      : mode === 'blocked' || mode === 'error'
      ? {
          eyebrow: 'INITIATIVE SCAFFOLDED',
          title: 'Scaffold paused at an evidence gate',
          status: 'BLOCKED',
          meta: 'ACTION NEEDED',
          progress: 62,
          count: '11 / 18',
          tone: 'error',
          detail: 'The stream is intact, but the next receipt is waiting on an approval or a recoverable execution error.'
        }
      : {
          eyebrow: 'INITIATIVE SCAFFOLDED',
          title: 'Scaffold needs a fresh sync',
          status: 'STALE',
          meta: 'REFRESH TO RESUME',
          progress: 62,
          count: '11 / 18',
          tone: 'stale',
          detail: 'The last stream update is outside the live window. Refresh before treating this hierarchy as current.'
        };
    etext.textContent = config.eyebrow;
    heroTitle.textContent = config.title;
    statusText.textContent = config.status;
    footMeta.textContent = config.meta;
    wbsCount.textContent = config.count;
    setProgress(config.progress);
    ldot.className = 'live-dot' + (config.tone === 'error' ? ' error' : config.tone === 'done' ? ' done' : '');
    statusPill.classList.toggle('done', config.tone === 'done');
    wsStack.style.display = 'block';
    wsStack.innerHTML = '<div class="stream-empty"><strong>' + esc(config.title) + '</strong><span>' + esc(config.detail) + '</span></div>';
    banner.classList.remove('show');
    if (errBanner) {
      errBanner.classList.toggle('show', config.tone === 'error');
      errBanner.textContent = config.tone === 'error' ? 'This demo state is blocked; no work was submitted.' : '';
    }
  }

  var _params = new URLSearchParams(location.search);
  var _demo = _params.get('demo') === 'true';
  var _live = _params.get('live') === 'true';
  var _loading = _params.get('loading') === 'true';
  var _state = _params.get('state') || '';
