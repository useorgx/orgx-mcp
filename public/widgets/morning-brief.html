  <style>
    /* Canvas: F6 (digest now, events later) and F2 (calm). Surfaces, text and status
       colors come from the kit tokens and the widget theme; this sheet lays the brief out. */
    :root { --ox-primary-rgb: 0, 201, 167; }

    /* The kit's primaries are its action lime (--ox-action) in every widget. */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ox-font);
      background: var(--ox-bg);
      color: var(--ox-text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button { font: inherit; color: inherit; }

    .container { max-width: 640px; margin: 0 auto; }

    @keyframes briefIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-in { animation: briefIn var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out) both; }

    .widget-shell-card { margin: 0; }
    .brief-shell .ox-card {
      position: relative;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      overflow: hidden;
      --edge-rgb: var(--ox-edge-teal-rgb);
    }
    .brief-shell .ox-card::after {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), 0.75), transparent);
    }
    .brief-shell .ox-card[data-edge="amber"] { --edge-rgb: var(--ox-edge-amber-rgb); }
    .brief-shell .ox-card[data-edge="red"] { --edge-rgb: var(--ox-edge-red-rgb); }
    .brief-shell .ox-card[data-edge="mute"] { --edge-rgb: var(--ox-edge-mute-rgb); }

    .brief-head { border-bottom: 1px solid var(--ox-border); --ox-attention-padding: 0 20px; }

    /* The digest: what waits on you now, then what landed. */
    .brief-digest { padding: 16px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
    .brief-summary { font-size: 14px; line-height: 1.5; color: var(--ox-text-2); text-wrap: pretty; }

    .brief-shell .app-action-stack { display: flex; flex-direction: column; gap: 0; }
    .brief-shell .app-action-card {
      display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px;
      padding: 10px 0; margin: 0; border: 0; border-top: 1px solid var(--ox-border); border-radius: 0;
      background: transparent; box-shadow: none; color: var(--ox-text); text-decoration: none;
      transform: none; overflow: visible; cursor: pointer;
    }
    .brief-shell .app-action-card:first-child { border-top: 0; }
    .brief-shell .app-action-card::before { display: none; }
    .brief-shell .app-action-card:hover { transform: none; box-shadow: none; }
    .brief-shell .app-action-card:hover .app-action-card-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ox-border-strong); }
    .ev-dot { width: 7px; height: 7px; border-radius: 999px; flex: none; background: var(--ox-warning); }
    .app-action-card[data-tone="attention"] .ev-dot { background: var(--ox-danger); }
    .brief-shell .app-action-card-body { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
    .brief-shell .app-action-card-title { font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--ox-text); white-space: nowrap; }
    .brief-shell .app-action-card-detail { margin: 0; font-size: 12.5px; color: var(--ox-text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .brief-shell .app-action-card-cta {
      display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 0; padding: 0;
      border: 0; border-radius: 0; background: none; color: var(--ox-text-muted);
      font: 500 11.5px/1.3 var(--ox-mono); letter-spacing: 0; text-transform: none;
    }
    .brief-shell .app-action-card-cta svg { width: 12px; height: 12px; }

    .landed { display: flex; flex-direction: column; }

    /* Detail on demand: the four sections, opened from the rail or their own row. */
    .brief-shell .app-metric-rail {
      display: flex; flex-wrap: wrap; gap: 0 4px; padding: 0 14px; min-height: 44px; align-items: stretch;
      border-top: 1px solid var(--ox-border); background: none; border-radius: 0;
    }
    .brief-shell .app-metric-button {
      display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 8px;
      border: 0; border-bottom: 2px solid transparent; border-radius: 0; margin-bottom: -1px;
      background: transparent; color: var(--ox-text-muted); cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .brief-shell .app-metric-button:hover { color: var(--ox-text); background: none; }
    .brief-shell .app-metric-button[aria-pressed="true"] { color: var(--ox-text); border-bottom-color: var(--ox-text-2); background: none; }
    .metric-value { font: 600 12px/1 var(--ox-mono); color: var(--ox-text-2); font-variant-numeric: tabular-nums; }
    .metric-label { order: -1; }
    .brief-shell .app-metric-button.is-empty { opacity: 0.6; }

    .brief-shell .app-accordion-section { border-top: 1px solid var(--ox-border); }
    .brief-shell .app-accordion-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
      min-height: 44px; padding: 0 22px; background: transparent; border: 0; cursor: pointer; text-align: left;
    }
    .brief-shell .app-accordion-trigger:hover { background: var(--ox-hover); }
    .brief-shell .app-accordion-trigger-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brief-shell .app-accordion-trigger-title { font-size: 13px; font-weight: 600; color: var(--ox-text-2); }
    .brief-shell .app-accordion-trigger-badge {
      min-height: 0; padding: 0; border-radius: 0; background: none;
      font: 500 11.5px/1.3 var(--ox-mono); color: var(--ox-text-muted);
    }
    .brief-shell .app-accordion-chevron { width: 14px; height: 14px; color: var(--ox-text-muted); display: grid; place-items: center; }
    .brief-shell .app-accordion-body { padding: 0 22px; }
    .brief-shell .app-accordion-section.is-open .app-accordion-body { padding: 0 22px 14px; max-height: 1200px; }
    .brief-shell .app-accordion-section.is-open .app-accordion-trigger-title { color: var(--ox-text); }

    .brief-shell .app-list-row { padding: 10px 0; gap: 10px; }
    .brief-shell .app-list-row + .app-list-row { border-top: 1px solid var(--ox-border); }
    .brief-shell .app-list-row-title { font-size: 13.5px; font-weight: 600; color: var(--ox-text); }
    .brief-shell .app-list-row-detail { font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); }

    .priority-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; }
    .priority-row + .priority-row { border-top: 1px solid var(--ox-border); }
    .priority-who { width: 32px; height: 32px; display: grid; place-items: center; color: var(--ox-text-muted); }
    .priority-domain { font: 500 11.5px/1.3 var(--ox-mono); color: var(--ox-text-muted); }
    /* Priority headline: the title's first sentence, about three lines; the rest reads as body text. */
    .priority-title {
      font-size: 13.5px; font-weight: 600; line-height: 1.35; margin-top: 1px; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
    }
    .priority-note { font-size: 12.5px; line-height: 1.45; color: var(--ox-text-2); margin-top: 2px; overflow-wrap: anywhere; }
    .priority-more { font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); margin-top: 2px; overflow-wrap: anywhere; }

    /* One honest degraded notice, inside the card: which source is missing, and what that means. */
    .brief-partial {
      display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 8px 10px; border-radius: 10px;
      background: var(--ox-warning-surface, rgba(161, 98, 7, 0.09)); color: var(--ox-text-2);
      font-size: 12.5px; line-height: 1.45;
    }
    .brief-partial b { color: var(--ox-text); font-weight: 650; }
    .brief-partial .ev-dot { margin-top: 5px; }

    .output-row { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
    .output-meta { display: flex; align-items: center; gap: 6px; font: 500 11.5px/1.3 var(--ox-mono); color: var(--ox-text-muted); margin-top: 2px; }
    .output-meta ox-avatar { margin-right: 2px; }
    .output-link {
      min-height: 44px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--ox-border-strong);
      background: transparent; color: var(--ox-text); font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap;
    }
    .output-link:hover { background: var(--ox-hover); }

    .value-line { font: 500 11.5px/1.5 var(--ox-mono); color: var(--ox-text-muted); padding-top: 8px; font-variant-numeric: tabular-nums; }

    .attention-row { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
    .attention-row .ev-dot { margin-top: 6px; }
    .attention-row[data-tone="attention"] .ev-dot { background: var(--ox-danger); }
    .attention-chip { font: 500 11.5px/1.3 var(--ox-mono); color: var(--ox-text-muted); padding-top: 2px; white-space: nowrap; }
    .narrative-note { font-size: 12.5px; color: var(--ox-text-muted); padding-top: 8px; }

    .brief-calm { padding: 16px 22px 18px; display: flex; flex-direction: column; gap: 4px; }
    .brief-calm-title { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; }
    .brief-calm-copy { font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); }

    .sk { display: block; border-radius: 6px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.12)); }

    .focusable:focus-visible, .app-action-card:focus-visible, .app-metric-button:focus-visible, .app-accordion-trigger:focus-visible, .output-link:focus-visible {
      outline: 2px solid var(--ox-focus); outline-offset: -2px; border-radius: 8px;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .brief-digest, .brief-calm { padding: 14px 16px 16px; }
      .brief-head { --ox-attention-padding: 0 16px; }
      .brief-shell .app-accordion-trigger { padding: 0 16px; }
      .brief-shell .app-accordion-body, .brief-shell .app-accordion-section.is-open .app-accordion-body { padding-left: 16px; padding-right: 16px; }
      .brief-shell .app-metric-rail { padding: 0 8px; gap: 0; }
      .brief-shell .app-metric-button { padding: 0 5px; gap: 5px; font-size: 12.5px; }
      .brief-shell .app-action-card-body { flex-direction: column; gap: 1px; align-items: stretch; }
      .brief-shell .app-action-card-title { white-space: normal; }
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-in { animation: none; }
      .brief-shell .app-accordion-body { transition: none; }
    }
  </style>

<body>
  <div class="container" id="content"></div>

  <script>
    const icons = window.OrgXWidgetIcons;
    const escapeHtml = (value) => {
      if (value === null || value === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    };

    const { detectProtocol, initWidget, openWidgetLink } = window.OrgXWidgetRuntime;


    // Previews served next to the widgets read avatars from the same origin;
    // host sandboxes use the kit default (mcp.useorgx.com).
    if (window.OrgXElements && detectProtocol() === 'standalone') {
      window.OrgXElements.avatarConfig.baseUrl = new URL('shared/avatars', window.location.href).toString();
    }

    const params = new URLSearchParams(window.location.search);
    const requestedTheme = params.get('theme');
    if (requestedTheme) {
      document.documentElement.setAttribute('data-theme', requestedTheme);
    }

    // Gallery previews (?gallery=true&state=…) read the same fixtures as ?demo=true.
    const isDemo = params.get('demo') === 'true' || params.get('gallery') === 'true';
    const isLoadingOverride = params.get('loading') === 'true' || params.get('state') === 'loading';
    const bootStartedAt = Date.now();
    const MIN_LOADING_MS = 220;
    const FALLBACK_REVIEW_URL = window.OrgXLinks.live();

    const state = {
      brief: null,
      isLoading: !isDemo || isLoadingOverride,
      activeSection: null,
      error: false,
    };

    const content = document.getElementById('content');
    content.addEventListener('click', handleActionClick);

    const demoBrief = {
      generated_at: new Date().toISOString(),
      session_summary: {
        session_type: 'overnight',
        receipts_produced: 6,
        completed: 4,
        failed: 1,
      },
      value_dashboard: {
        value_delivered_usd: 1840,
        roi_display: '610%',
        decisions_resolved: 3,
        completed_this_week: 5,
        initiatives_completed: 2,
        estimated_time_saved_hours: 15.3,
      },
      workspace_pulse: {
        stats: {
          activeInitiatives: 5,
          pendingDecisions: 2,
          blockedWorkstreams: 1,
        },
      },
      summary:
        'Two approvals are still blocking the Q4 launch. Engineering is clear to move, while marketing copy and the inspector test plan both need an operator call today.',
      top_priorities: [
        {
          domain: 'Engineering',
          title: 'Review database strategy',
          reason: 'Blocks sprint 3 deliverables and the environment promotion sequence.',
        },
        {
          domain: 'Marketing',
          title: 'Approve email sequence',
          reason: 'Launch is in 4 days and scheduling must happen today.',
        },
        {
          domain: 'Product',
          title: 'Scope v2 follow-ups',
          reason: 'The draft PRD is ready and can unblock the next planning sprint.',
        },
      ],
      top_receipts: [
        {
          intent: 'Closed launch QA loop',
          attributed_value_usd: 420,
        },
        {
          intent: 'Resolved routing regression',
          attributed_value_usd: 310,
        },
      ],
      artifacts_produced: [
        {
          id: 'artifact-1',
          name: 'server.json manifest',
          status: 'approved',
          artifact_type: 'eng.config',
          created_by_name: 'Eli',
          summary: 'Manifest drafted and validated for registry submission.',
          primary_url: 'https://useorgx.com/artifacts/artifact-1',
          primary_label: 'Open artifact',
        },
        {
          id: 'artifact-2',
          name: 'MCP Inspector test plan',
          status: 'in_review',
          artifact_type: 'eng.report',
          created_by_name: 'Eli',
          summary: 'Manual and automated checks packaged for review.',
          primary_url: 'https://useorgx.com/artifacts/artifact-2',
          primary_label: 'Review in OrgX',
        },
        {
          id: 'artifact-3',
          name: 'Connector description',
          status: 'in_review',
          artifact_type: 'mktg.copy',
          created_by_name: 'Mark',
          summary: 'Marketplace copy drafted for founder approval.',
          primary_url: 'https://useorgx.com/artifacts/artifact-3',
          primary_label: 'Review in OrgX',
        },
      ],
      review_items: [
        {
          id: 'artifact-2',
          name: 'MCP Inspector test plan',
          status: 'in_review',
          artifact_type: 'eng.report',
          created_by_name: 'Eli',
          primary_url: 'https://useorgx.com/artifacts/artifact-2',
          primary_label: 'Review in OrgX',
        },
        {
          id: 'artifact-3',
          name: 'Connector description',
          status: 'in_review',
          artifact_type: 'mktg.copy',
          created_by_name: 'Mark',
          primary_url: 'https://useorgx.com/artifacts/artifact-3',
          primary_label: 'Review in OrgX',
        },
      ],
      exceptions: [{ exception_type: 'budget_guardrail' }],
      brief_markdown: '# Morning Brief',
    };

    const demoState = params.get('state') || 'populated';
    const demoError = isDemo && demoState === 'error';
    let demoBriefVariant = demoBrief;
    if (isDemo && demoState !== 'populated') {
      demoBriefVariant = JSON.parse(JSON.stringify(demoBrief));
      if (demoState === 'completed' || demoState === 'resolved' || demoState === 'calm') {
        demoBriefVariant.summary = 'All planned work closed cleanly. The latest receipts are attached and there is nothing waiting on you.';
        demoBriefVariant.session_summary.completed = 6;
        demoBriefVariant.session_summary.failed = 0;
        demoBriefVariant.workspace_pulse.stats.pendingDecisions = 0;
        demoBriefVariant.workspace_pulse.stats.blockedWorkstreams = 0;
        demoBriefVariant.top_priorities = [];
        demoBriefVariant.suppress_priorities = true;
        demoBriefVariant.review_items = [];
        demoBriefVariant.artifacts_produced = demoBriefVariant.artifacts_produced.map((artifact) => ({ ...artifact, status: 'approved', primary_label: 'Open artifact' }));
        demoBriefVariant.exceptions = [];
      } else if (demoState === 'blocked') {
        demoBriefVariant.summary = 'Execution is paused at one evidence gate. Review the blocked workstream before dispatching more work.';
        demoBriefVariant.session_summary.failed = 2;
        demoBriefVariant.workspace_pulse.stats.blockedWorkstreams = 2;
        demoBriefVariant.top_priorities[0].reason = 'Needs an operator decision before the deploy proof can be accepted.';
      } else if (demoState === 'progressing') {
        demoBriefVariant.summary = 'Two agents are working now. This brief will update as the next receipts land.';
        demoBriefVariant.session_summary.completed = 3;
        demoBriefVariant.session_summary.receipts_produced = 4;
      } else if (demoState === 'partial') {
        // A brief built while one source was down (live QA, 2026-10-02).
        demoBriefVariant.degraded = ['workspace_pulse_unavailable'];
        demoBriefVariant.degraded_reason = 'workspace_pulse_timeout';
        demoBriefVariant.top_priorities[0] = {
          domain: 'Engineering',
          title: 'Production verification of MCP PR #424: admission, privacy and plan compatibility changes are deployed as f9c40d233e4e13809d9f901b005fe3410b37a4b0. A green deployment alone does not approve broad plugin marketing. Verification marker: orgx-prod-e2e-20260930-1525.',
          reason: 'Blocks plugin marketing until the remaining checks are accepted.',
        };
      } else if (demoState === 'stale' || demoState === 'degraded') {
        demoBriefVariant.generated_at = new Date(Date.now() - 1000 * 60 * 14).toISOString();
        demoBriefVariant.summary = 'This readout is outside the live window. Refresh before acting on priorities or agent status.';
        demoBriefVariant.exceptions = [{ exception_type: 'stale_brief' }];
      }
    }

    state.error = demoError;


    function asArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function asObject(value) {
      return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    }

    function asNumber(value) {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      if (typeof value === 'string') {
        const parsed = Number(value);
        if (Number.isFinite(parsed)) return parsed;
      }
      return null;
    }

    function titleCase(value) {
      return String(value || '')
        .replace(/[_-]+/g, ' ')
        .replace(/\b\w/g, (char) => char.toUpperCase())
        .trim();
    }

    function pluralize(count, singular, plural = `${singular}s`) {
      return `${count} ${count === 1 ? singular : plural}`;
    }

    function formatCurrency(value) {
      const number = asNumber(value);
      if (number === null) return null;
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: number >= 100 ? 0 : 2,
      }).format(number);
    }

    function formatCompactCurrency(value) {
      const number = asNumber(value);
      if (number === null) return '0';
      if (Math.abs(number) < 1000) return formatCurrency(number) || '0';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        notation: 'compact',
        maximumFractionDigits: 1,
      }).format(number);
    }

    // Dates and times in the viewer's locale and zone (shared formatter).
    const T = window.OrgXTime;

    function formatDayLabel(value) {
      const date = T.toDate(value) || new Date();
      return date.toLocaleDateString(T.locale(), { weekday: 'short', month: 'short', day: 'numeric', timeZone: T.timeZone() });
    }

    function formatTimeLabel(value) {
      const date = T.toDate(value) || new Date();
      return `Generated ${T.clock(date)}`;
    }

    function formatShortDay(value) {
      return T.day(T.toDate(value) || new Date());
    }

    function formatClock(value) {
      return T.clock(T.toDate(value) || new Date());
    }

    function isOlderThan(value, hours) {
      const time = value ? new Date(value).getTime() : NaN;
      return Number.isFinite(time) && Date.now() - time > hours * 3600 * 1000;
    }

    function extractMetricDisplay(rawValue) {
      const raw = String(rawValue || '').trim();
      if (!raw) return { valueText: 'N/A', suffix: '', numeric: null };
      const match = raw.match(/^(-?[\d,.]+)/);
      if (!match) return { valueText: raw, suffix: '', numeric: null };
      const numeric = Number(match[1].replace(/,/g, ''));
      return {
        valueText: match[1],
        suffix: raw.slice(match[1].length).trim(),
        numeric: Number.isFinite(numeric) ? numeric : null,
      };
    }

    function compactList(items, maxItems = 2) {
      const filtered = asArray(items)
        .map((item) => String(item || '').trim())
        .filter(Boolean);
      if (!filtered.length) return '';
      const visible = filtered.slice(0, maxItems);
      const remainder = filtered.length - visible.length;
      if (remainder > 0) {
        visible.push(`+${remainder} more`);
      }
      return visible.join(' / ');
    }

    function artifactUrl(artifact) {
      const row = asObject(artifact);
      return window.OrgXLinks.normalize(row.primary_url) || window.OrgXLinks.normalize(row.live_url) || null;
    }

    function artifactLabel(artifact, fallback) {
      const row = asObject(artifact);
      return typeof row.primary_label === 'string' && row.primary_label
        ? row.primary_label
        : fallback;
    }

    function isReviewable(artifact, reviewIds) {
      const row = asObject(artifact);
      const status = String(row.status || '').toLowerCase();
      return (
        reviewIds.has(String(row.id || '')) ||
        status === 'draft' ||
        status === 'in_review' ||
        status === 'review'
      );
    }

    function buildHeroMetric(roiDisplay, valueDelivered) {
      const roiParts = extractMetricDisplay(roiDisplay);
      if (roiParts.numeric !== null) {
        return {
          label: 'ROI this cycle',
          valueText: roiParts.valueText,
          suffix: roiParts.suffix || '%',
          numeric: roiParts.numeric,
        };
      }

      const valueDisplay = formatCurrency(valueDelivered);
      if (valueDisplay) {
        return {
          label: 'Value delivered',
          valueText: valueDisplay,
          suffix: '',
          numeric: null,
        };
      }

      return {
        label: 'Signals captured',
        valueText: '0',
        suffix: '',
        numeric: 0,
      };
    }

    // Which sources a partial brief is missing, in words. The payload names them in degraded,
    // dataGaps or degraded_reason (codes like workspace_pulse_unavailable).
    const SOURCE_NAMES = {
      workspace_pulse: 'the workspace pulse', pulse: 'the workspace pulse', value_dashboard: 'value numbers', value: 'value numbers',
      decisions: 'decisions', pending_decisions: 'decisions', receipts: 'receipts', top_receipts: 'receipts',
      artifacts: 'overnight output', artifacts_produced: 'overnight output', review_items: 'review items', proof_cards: 'overnight output',
      chronicle: 'activity history', intelligence: 'learning stats', outcome_attribution: 'outcome attribution', goals: 'goals',
      session_summary: 'the session summary', exceptions: 'guardrail flags', next_actions: 'next actions', priorities: 'priorities',
    };
    function sourceName(raw) {
      const code = String(raw || '').trim().toLowerCase()
        .replace(/[\s-]+/g, '_')
        .replace(/_(?:unavailable|failed|failure|error|errored|timeout|timed_out|missing|stale|skipped|degraded)$/, '');
      if (!code || !/^[a-z][a-z0-9_]*$/.test(code)) return '';
      return SOURCE_NAMES[code] || code.replace(/_/g, ' ');
    }
    function missingSources(payload) {
      const names = [];
      [...asArray(payload.degraded), ...asArray(payload.dataGaps), payload.degraded_reason].forEach((item) => {
        const name = sourceName(typeof item === 'string' ? item : asObject(item).source || asObject(item).name);
        if (name && !names.includes(name)) names.push(name);
      });
      return names.slice(0, 3);
    }
    function joinWords(list) {
      if (list.length <= 1) return list[0] || '';
      return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
    }
    function partialNotice(payload) {
      const names = missingSources(payload);
      return names.length
        ? `Couldn’t load ${joinWords(names)} for this brief. Counts may be low until the next refresh.`
        : 'Some sources didn’t load for this brief. Counts may be low until the next refresh.';
    }

    // Priority headlines: the title's first sentence, about three lines; the rest stays as body text.
    const HEADLINE_MAX = 96;
    const NOT_A_SENTENCE_END = /(?:\b(?:e\.g|i\.e|vs|etc|approx|incl|No|Mr|Ms|Dr|St|Inc|Ltd)|\b[A-Z])$/;
    function splitHeadline(text) {
      const full = String(text || '').replace(/\s+/g, ' ').trim();
      let head = full;
      let rest = '';
      const re = /[.!?](?=\s+["“(]?[A-Z0-9])/g;
      let match;
      while ((match = re.exec(full))) {
        const end = match.index + 1;
        if (end < 12 || NOT_A_SENTENCE_END.test(full.slice(0, match.index))) continue;
        head = full.slice(0, end).trim();
        rest = full.slice(end).trim();
        break;
      }
      if (head.length > HEADLINE_MAX) {
        const cut = head.slice(0, HEADLINE_MAX);
        const space = cut.lastIndexOf(' ');
        const at = space > HEADLINE_MAX * 0.6 ? space : HEADLINE_MAX;
        rest = '…' + head.slice(at).trim() + (rest ? ' ' + rest : '');
        head = head.slice(0, at).replace(/[\s,;:–—-]+$/, '') + '…';
      }
      return { headline: head, body: rest };
    }

    function normalizeBrief(payload) {
      if (!payload || typeof payload !== 'object') return null;

      const isPartial = payload.degraded === true || asArray(payload.degraded).length > 0;
      const sessionSummary = asObject(payload.session_summary);
      const valueDashboard = asObject(payload.value_dashboard);
      const workspacePulse = asObject(payload.workspace_pulse);
      const workspaceStats = asObject(workspacePulse.stats);
      const topReceipts = asArray(payload.top_receipts);
      const proofCards = asArray(payload.proof_cards);
      const artifactsProduced = asArray(payload.artifacts_produced).length
        ? asArray(payload.artifacts_produced)
        : proofCards;
      const reviewItems = asArray(payload.review_items).length
        ? asArray(payload.review_items)
        : proofCards.filter((item) => {
            const record = asObject(item);
            const status = String(record.status || '').toLowerCase();
            return (
              Boolean(record.needs_review) ||
              status === 'draft' ||
              status === 'in_review' ||
              status === 'review' ||
              status === 'changes_requested'
            );
          });
      const exceptions = asArray(payload.exceptions);
      const nextActions = asArray(payload.next_actions).length
        ? asArray(payload.next_actions)
        : asArray(payload.recommended_actions);

      const suppressPriorities = payload.suppress_priorities === true;
      let priorities = asArray(payload.top_priorities);
      if (!suppressPriorities && !priorities.length && nextActions.length) {
        priorities = nextActions.slice(0, 3).map((action) => ({
          domain: action.domain || action.type || 'Execution',
          title: action.title || action.label || 'Recommended follow-up',
          reason:
            action.reason ||
            action.summary ||
            action.message ||
            'OrgX marked this as the next best move.',
        }));
      }
      if (!suppressPriorities && !priorities.length && topReceipts.length) {
        priorities = topReceipts.slice(0, 3).map((receipt) => ({
          domain: 'Execution',
          title: receipt.intent || 'Recent execution receipt',
          reason:
            formatCurrency(receipt.attributed_value_usd)
              ? `Attributed value: ${formatCurrency(receipt.attributed_value_usd)}`
              : 'Captured as part of the latest brief.',
        }));
      }

      const pendingDecisions = asNumber(
        payload.pending_decisions ??
          workspaceStats.pendingDecisions ??
          workspaceStats.pending_decisions
      ) || 0;
      const blockedWork = asNumber(
        payload.blocked_workstreams ??
          payload.blocked_items ??
          workspaceStats.blockedWorkstreams ??
          workspaceStats.blocked_workstreams
      ) || 0;
      const activeInitiatives = asNumber(
        workspaceStats.activeInitiatives ?? workspaceStats.active_initiatives
      ) || 0;
      const completedThisWeek = asNumber(valueDashboard.completed_this_week) || 0;
      const initiativesCompleted = asNumber(valueDashboard.initiatives_completed) || 0;
      const decisionsResolved = asNumber(valueDashboard.decisions_resolved) || 0;
      const valueDelivered = asNumber(valueDashboard.value_delivered_usd);
      const timeSaved = asNumber(valueDashboard.estimated_time_saved_hours);
      const roiDisplay =
        typeof valueDashboard.roi_display === 'string' && valueDashboard.roi_display
          ? valueDashboard.roi_display
          : 'N/A';

      const reviewIds = new Set(
        reviewItems.map((item) => String(asObject(item).id || '')).filter(Boolean)
      );
      const outputRows = artifactsProduced.length ? artifactsProduced : reviewItems;
      const reviewableOutputs = outputRows.filter((artifact) =>
        isReviewable(artifact, reviewIds)
      );

      const summary =
        typeof payload.summary === 'string' && payload.summary.trim()
          ? payload.summary.trim()
          : typeof payload.message === 'string' && payload.message.trim()
            ? payload.message.trim()
            : `${titleCase(sessionSummary.session_type || 'recent')} session: ${pluralize(
                asNumber(sessionSummary.receipts_produced) || 0,
                'receipt'
              )} produced, ${pluralize(
                asNumber(sessionSummary.completed) || 0,
                'completion'
              )}, ${pluralize(asNumber(sessionSummary.failed) || 0, 'failure')}.`;

      const attentionSignals = [];
      if (pendingDecisions > 0) {
        attentionSignals.push({
          tone: 'warning',
          title: `${pluralize(pendingDecisions, 'pending decision')}`,
          description:
            'Operator approval is still required before downstream work can continue.',
          meta: 'Decision queue',
        });
      }
      if (blockedWork > 0) {
        attentionSignals.push({
          tone: 'attention',
          title: `${pluralize(blockedWork, 'blocked workstream')}`,
          description:
            'Execution is blocked in the latest workspace pulse and should be cleared today.',
          meta: 'Workspace pulse',
        });
      }
      if (exceptions.length > 0) {
        attentionSignals.push({
          tone: 'attention',
          title: `${pluralize(exceptions.length, 'exception')} flagged`,
          description:
            compactList(
              exceptions.map((item) => titleCase(item.exception_type || item.type || 'Review')),
              3
            ) || 'Guardrails or budget exceptions were recorded in the latest autonomous session.',
          meta: 'Guardrails',
        });
      }

      const reviewActionUrl =
        artifactUrl(reviewItems[0]) || artifactUrl(reviewableOutputs[0]) || null;
      const outputActionUrl =
        artifactUrl(outputRows[0]) || reviewActionUrl || FALLBACK_REVIEW_URL;
      const footerUrl = reviewActionUrl || outputActionUrl;

      const actions = [];
      if (reviewItems.length > 0) {
        actions.push({
          tone: 'review',
          icon: icons.eye(15),
          title: `${pluralize(reviewItems.length, 'artifact')} need review`,
          detail:
            compactList(
              reviewItems.map((item) => item.name || item.title || 'Review item'),
              2
            ) || 'Agent output is waiting for an operator call.',
          cta: 'Review in OrgX',
          url: reviewActionUrl,
          section: 'output',
        });
      }

      if (pendingDecisions > 0 || blockedWork > 0 || exceptions.length > 0) {
        actions.push({
          tone: 'attention',
          icon: icons.warning(15),
          title:
            pendingDecisions > 0
              ? `${pluralize(pendingDecisions, 'decision')} need a call`
              : blockedWork > 0
                ? `${pluralize(blockedWork, 'blocked workstream')} need clearance`
                : `${pluralize(exceptions.length, 'exception')} need attention`,
          detail:
            blockedWork > 0
              ? `${pluralize(blockedWork, 'blocked workstream')} surfaced in the workspace pulse.`
              : exceptions.length > 0
                ? `${pluralize(exceptions.length, 'guardrail exception')} surfaced in the latest session.`
                : 'Review the flagged items before the next autonomous run starts.',
          cta: 'Resolve',
          url: null,
          section: 'attention',
        });
      }

      return {
        dateLabel: formatDayLabel(payload.generated_at || payload.created_at || workspacePulse.generatedAt),
        timeLabel: formatTimeLabel(payload.generated_at || payload.created_at || workspacePulse.generatedAt),
        summary,
        heroMetric: isPartial ? { label: 'Partial report', valueText: '—', suffix: '', numeric: null } : buildHeroMetric(roiDisplay, valueDelivered),
        heroSupportLine: isPartial ? 'Source data is refreshing' : valueDelivered
          ? `${formatCurrency(valueDelivered)} value delivered`
          : 'Value signals updated',
        heroSupportMeta: isPartial ? 'Available results shown below' : timeSaved
          ? `${timeSaved.toFixed(timeSaved >= 10 ? 0 : 1)} hours saved modeled`
          : decisionsResolved > 0
            ? `${pluralize(decisionsResolved, 'decision')} resolved in 30d`
            : 'No attributable value reported',
        heroPills: isPartial ? ['Partial report'] : [
          `${pluralize(outputRows.length, 'output')} shown`,
          `${pluralize(decisionsResolved, 'decision')} resolved`,
          activeInitiatives > 0
            ? `${pluralize(activeInitiatives, 'active initiative')}`
            : completedThisWeek > 0
              ? `${pluralize(completedThisWeek, 'completion')} this week`
              : `${pluralize(initiativesCompleted, 'initiative')} closed`,
        ].filter(Boolean),
        actions,
        priorities,
        outputRows,
        topReceipts,
        attentionSignals,
        reviewItems,
        exceptions,
        narrativeAvailable:
          typeof payload.brief_markdown === 'string' && payload.brief_markdown.trim().length > 0,
        footerUrl,
        footerLabel: reviewActionUrl ? 'Review queue' : 'Latest output',
        pendingDecisions,
        blockedWork,
        isPartial,
        partialNotice: isPartial ? partialNotice(payload) : '',
        isStale: exceptions.some((item) => String(asObject(item).exception_type || asObject(item).type || '').toLowerCase().includes('stale')) || isOlderThan(payload.generated_at || payload.created_at || workspacePulse.generatedAt, 18),
        shortDateLabel: formatShortDay(payload.generated_at || payload.created_at || workspacePulse.generatedAt),
        clockLabel: formatClock(payload.generated_at || payload.created_at || workspacePulse.generatedAt),
        acceptedOutputs: outputRows.filter((artifact) => !isReviewable(artifact, reviewIds)),
        doneLine: [
          asNumber(sessionSummary.completed) ? `${asNumber(sessionSummary.completed)} done overnight` : '',
          asNumber(sessionSummary.receipts_produced) ? pluralize(asNumber(sessionSummary.receipts_produced), 'receipt') : '',
          asNumber(sessionSummary.failed) ? `${asNumber(sessionSummary.failed)} failed` : '',
        ].filter(Boolean).join(' · '),
        valueLine: isPartial ? '' : [
          valueDelivered ? `${formatCurrency(valueDelivered)} value delivered` : '',
          timeSaved ? `${timeSaved.toFixed(timeSaved >= 10 ? 0 : 1)} hours saved (modeled)` : '',
          roiDisplay !== 'N/A' ? `ROI ${roiDisplay}` : '',
          decisionsResolved > 0 ? `${pluralize(decisionsResolved, 'decision')} resolved` : '',
        ].filter(Boolean).join(' · '),
        counts: {
          priorities: priorities.length,
          output: outputRows.length,
          receipts: topReceipts.length,
          attention: attentionSignals.length,
        },
        metricDisplays: {
          priorities: isPartial && !priorities.length ? '—' : String(priorities.length || 0),
          output: isPartial && !outputRows.length ? '—' : String(outputRows.length || 0),
          receipts: topReceipts.length
            ? formatCompactCurrency(
                topReceipts.reduce((total, receipt) => {
                  return total + (asNumber(receipt.attributed_value_usd) || 0);
                }, 0)
              )
            : isPartial ? '—' : '0',
          attention: isPartial && !attentionSignals.length ? '—' : String(attentionSignals.length || 0),
        },
      };
    }


    function sectionAvailability(brief) {
      return {
        priorities: brief.priorities.length > 0,
        output: brief.outputRows.length > 0,
        receipts: brief.topReceipts.length > 0,
        attention: brief.attentionSignals.length > 0,
      };
    }

    // F6: the digest leads; the sections stay closed until asked for.
    function ensureActiveSection(brief) {
      const availability = sectionAvailability(brief);
      if (!state.activeSection || availability[state.activeSection]) return;
      state.activeSection = null;
    }

    function agentFor(...values) {
      const identity = window.OrgXAgentIdentity;
      return identity && identity.resolveAgentKey ? identity.resolveAgentKey(...values) : null;
    }

    // An agent's headshot in its hover card (state, task, Open in OrgX); the
    // OrgX mark for OrgX/system work; initials for a person.
    function avatarHtml(agentKey, name, size = 'inline', extra = {}) {
      return window.OrgXAgentIdentity.agentCard({ agent: agentKey || name, name, size, ...extra });
    }

    function renderSkeleton() {
      content.innerHTML = `
        <div class="brief-shell widget-shell-card" aria-busy="true">
          <div class="ox-card ox-surface">
            <div class="brief-head" style="height:44px;display:flex;align-items:center;gap:10px;padding:0 20px">
              <span class="sk" style="width:8px;height:8px;border-radius:50%"></span>
              <span class="sk" style="width:42%;height:12px"></span>
            </div>
            <div class="brief-digest">
              <span class="sk" style="width:92%;height:13px"></span>
              <span class="sk" style="width:74%;height:13px"></span>
              <span class="sk" style="width:60%;height:14px;margin-top:8px"></span>
              <span class="sk" style="width:52%;height:14px"></span>
            </div>
            <ox-footer variant="reads" state="loading"></ox-footer>
          </div>
        </div>
      `;
    }

    function renderEmptyState() {
      content.innerHTML = `
        <div class="brief-shell widget-shell-card animate-in">
          <div class="ox-card ox-surface" data-edge="teal">
            <div class="brief-head"><ox-attention-line tone="calm" count="0"><span>No brief yet</span></ox-attention-line></div>
            <div class="brief-calm">
              <div class="brief-calm-title">Nothing needs you</div>
              <div class="brief-calm-copy">No brief has landed yet. When the next autonomous session finishes, the morning readout will appear here.</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPriorityRows(brief) {
      if (!brief.priorities.length) {
        return '<div class="app-list-row-detail">No priority follow-ups were captured in this brief.</div>';
      }

      return brief.priorities
        .map((priority) => {
          const domain = titleCase(priority.domain || 'Execution');
          const agentKey = agentFor(priority.agent_name, priority.domain);
          const head = splitHeadline(priority.title || 'Priority item');
          return `
            <div class="priority-row">
              <div class="priority-who">${avatarHtml(agentKey, agentKey ? '' : (priority.agent_name || 'OrgX'), 'row', { task: head.headline })}</div>
              <div class="priority-body">
                <div class="priority-domain">${escapeHtml(domain)}</div>
                <div class="priority-title">${escapeHtml(head.headline)}</div>
                ${head.body ? `<div class="priority-more">${escapeHtml(head.body)}</div>` : ''}
                <div class="priority-note">${escapeHtml(priority.reason || 'No rationale provided.')}</div>
              </div>
            </div>
          `;
        })
        .join('');
    }

    function renderOutputRows(brief) {
      if (!brief.outputRows.length) {
        return '<div class="app-list-row-detail">No overnight output was attached to this brief.</div>';
      }

      const reviewIds = new Set(
        brief.reviewItems.map((item) => String(asObject(item).id || '')).filter(Boolean)
      );

      return brief.outputRows
        .map((artifact) => {
          const row = asObject(artifact);
          const status = String(row.status || 'draft').toLowerCase();
          const url = artifactUrl(row);
          const reviewable = isReviewable(row, reviewIds);
          const type = titleCase(String(row.artifact_type || row.type || 'artifact')).replace(/\s+/g, '.');
          const summary =
            row.summary ||
            row.description ||
            (reviewable
              ? 'Ready for an operator review before execution continues.'
              : 'Captured as proof from the latest autonomous run.');
          const actionLabel = artifactLabel(row, reviewable ? 'Review' : 'Open');
          const author = row.created_by_name || row.created_by || 'OrgX agent';
          const agentKey = agentFor(author);
          const chip = reviewable
            ? '<ox-state-chip state="needs_you" label="Your review"></ox-state-chip>'
            : status === 'approved' || status === 'accepted' || status === 'done'
              ? '<ox-state-chip state="succeeded" label="Accepted"></ox-state-chip>'
              : `<ox-state-chip state="${escapeHtml(status)}"></ox-state-chip>`;

          return `
            <div class="app-list-row output-row">
              <div class="app-list-row-body">
                <div class="app-list-row-title">${escapeHtml(row.title || row.name || 'Untitled artifact')}</div>
                <div class="app-list-row-detail">${escapeHtml(summary)}</div>
                <div class="output-meta">${avatarHtml(agentKey, author, 'inline', { task: row.title || row.name, state: reviewable ? 'needs_you' : '', statusLabel: reviewable ? 'Your review' : '', label: `<span>${escapeHtml(author)}</span>` })}<span aria-hidden="true">·</span><span>${escapeHtml(type)}</span></div>
              </div>
              ${
                reviewable && url
                  ? `<button type="button" class="output-link focusable" data-action="open-link" data-url="${escapeHtml(url)}">${escapeHtml(actionLabel)} ↗</button>`
                  : chip
              }
            </div>
          `;
        })
        .join('');
    }

    function renderReceiptRows(brief) {
      if (!brief.topReceipts.length) {
        return '<div class="app-list-row-detail">No attributed receipts were included in this cycle.</div>';
      }

      const rows = brief.topReceipts
        .map((receipt) => {
          const value = formatCurrency(receipt.attributed_value_usd) || 'Captured';
          const url = typeof receipt.url === 'string' && receipt.url ? receipt.url : '';
          return `<ox-receipt-row status="met" label="${escapeHtml(receipt.intent || 'Execution receipt')}" value="${escapeHtml(value)}"${url ? ` href="${escapeHtml(url)}"` : ''}></ox-receipt-row>`;
        })
        .join('');
      return `<div class="receipt-stack" role="list">${rows}</div>${brief.valueLine ? `<div class="value-line">${escapeHtml(brief.valueLine)}</div>` : ''}`;
    }

    function renderAttentionRows(brief) {
      const rows = brief.attentionSignals
        .map((item) => {
          const tone = item.tone === 'warning' ? 'review' : 'attention';
          return `
            <div class="app-list-row attention-row" data-tone="${tone}">
              <span class="ev-dot" aria-hidden="true"></span>
              <div class="app-list-row-body">
                <div class="app-list-row-title">${escapeHtml(item.title)}</div>
                <div class="app-list-row-detail">${escapeHtml(item.description)}</div>
              </div>
              <div class="attention-chip">${escapeHtml(item.meta || 'Attention')}</div>
            </div>
          `;
        })
        .join('');

      const narrative = brief.narrativeAvailable
        ? `<div class="narrative-note">The full written brief is available to the assistant in this conversation.</div>`
        : '';

      if (!rows && !narrative) {
        return '<div class="app-list-row-detail">No escalations or review blockers are active right now.</div>';
      }

      return rows + narrative;
    }

    // The opening line: amber when something waits on you, red when work is blocked, calm otherwise.
    function attentionLine(brief) {
      const parts = [];
      if (brief.pendingDecisions > 0) parts.push(pluralize(brief.pendingDecisions, 'decision'));
      if (brief.reviewItems.length > 0) parts.push(pluralize(brief.reviewItems.length, 'review'));
      const single = parts.length === 1 && brief.pendingDecisions + brief.reviewItems.length === 1;
      const waiting = parts.length ? `${parts.join(' and ')} ${single ? 'waits' : 'wait'} on you` : '';
      const blocked = brief.blockedWork > 0 ? `${brief.blockedWork} blocked` : '';
      const flagged = !waiting && !blocked && brief.exceptions.length > 0 ? `${pluralize(brief.exceptions.length, 'exception')} flagged` : '';
      const sentence = [waiting, blocked, flagged].filter(Boolean).join(' · ');
      const count = brief.pendingDecisions + brief.reviewItems.length + brief.blockedWork + (flagged ? brief.exceptions.length : 0);
      if (!sentence) return { tone: 'calm', count: 0, sentence: '', edge: 'teal' };
      return { tone: brief.blockedWork > 0 ? 'blocking' : 'needs-you', count, sentence, edge: brief.blockedWork > 0 ? 'red' : 'amber' };
    }

    // SM3 reads footer: when the brief was read, and the one place to go next.
    function footerFor(brief, line) {
      const action = brief.footerUrl ? `${brief.footerLabel} ↗` : '';
      if (brief.isPartial) {
        // The notice in the digest says what is missing; the footer only says when.
        return { state: 'stale', heading: `Generated ${brief.clockLabel}`, detail: brief.doneLine || `as of ${brief.shortDateLabel}`, action };
      }
      if (brief.isStale) {
        return { state: 'stale', heading: 'Out of date', detail: `as of ${brief.clockLabel}`, action };
      }
      if (line.tone === 'calm') {
        // The caught-up frame has no text action; fresh carries the same check and keeps the link.
        return { state: action ? 'fresh' : 'caught-up', heading: 'Nothing waits on you', detail: brief.doneLine || brief.timeLabel.toLowerCase(), action };
      }
      return { state: 'fresh', heading: `Generated ${brief.clockLabel}`, detail: brief.doneLine || 'up to date', action };
    }

    function renderBrief(brief) {
      ensureActiveSection(brief);
      const line = attentionLine(brief);
      const footer = footerFor(brief, line);
      const landed = brief.acceptedOutputs.slice(0, 2);
      // Every section keeps its control (owner requirement); empty ones render dimmed.
      const has = sectionAvailability(brief);
      const available = { priorities: true, output: true, receipts: true, attention: true };

      content.innerHTML = `
        <div class="brief-shell widget-shell-card animate-in">
          <div class="ox-card app-flat-card" data-edge="${line.edge}">
            <div class="brief-head">
              <ox-attention-line tone="${line.tone}" count="${line.count}">${
                line.sentence ? `<span>${escapeHtml(line.sentence)}</span>` : ''
              }<span slot="meta">${escapeHtml(brief.shortDateLabel)} · ${escapeHtml(brief.clockLabel)}</span></ox-attention-line>
            </div>

            <div class="brief-digest">
              ${brief.partialNotice ? `<p class="brief-partial" role="status"><span class="ev-dot" aria-hidden="true"></span><span><b>Partial brief.</b> ${escapeHtml(brief.partialNotice)}</span></p>` : ''}
              <p class="brief-summary">${escapeHtml(brief.summary)}</p>
              ${
                brief.actions.length
                  ? `
                    <div class="action-strip app-action-stack">
                      ${brief.actions
                        .map((action) => {
                          const href = action.url || `#section-${action.section}`;
                          const dataAction = action.url ? 'open-link' : 'open-section';
                          const extraAttrs = action.url
                            ? `data-url="${escapeHtml(action.url)}"`
                            : `data-section="${escapeHtml(action.section)}" aria-controls="panel-${escapeHtml(action.section)}"`;
                          return `
                            <a href="${escapeHtml(href)}" class="action-card app-action-card focusable" data-tone="${escapeHtml(action.tone)}" data-action="${dataAction}" ${extraAttrs}>
                              <span class="ev-dot" aria-hidden="true"></span>
                              <span class="app-action-card-body">
                                <span class="app-action-card-title">${escapeHtml(action.title)}</span>
                                <span class="app-action-card-detail">${escapeHtml(action.detail)}</span>
                              </span>
                              <span class="app-action-card-cta">${escapeHtml(action.cta)} ${action.url ? '<span aria-hidden="true">↗</span>' : icons.chevronDown(12)}</span>
                            </a>
                          `;
                        })
                        .join('')}
                    </div>
                  `
                  : ''
              }
              ${
                landed.length
                  ? `<div class="landed" role="list" aria-label="Landed overnight">${landed
                      .map((artifact) => {
                        const row = asObject(artifact);
                        const url = artifactUrl(row);
                        const status = String(row.status || '').toLowerCase();
                        const verb = status === 'approved' || status === 'accepted' ? 'accepted' : titleCase(status || 'landed').toLowerCase();
                        return `<ox-receipt-row status="met" label="${escapeHtml((row.title || row.name || 'Artifact') + ' · ' + verb)}" value="${escapeHtml(row.created_by_name || '')}"${url ? ` href="${escapeHtml(url)}"` : ''}></ox-receipt-row>`;
                      })
                      .join('')}</div>`
                  : ''
              }
            </div>

            <div class="metric-rail app-metric-rail" aria-label="Brief sections">${
              available.priorities ? `<button type="button" class="app-metric-button focusable${has.priorities ? '' : ' is-empty'}" data-action="open-section" data-section="priorities" aria-pressed="${state.activeSection === 'priorities'}" aria-controls="panel-priorities"><span class="metric-value">${escapeHtml(brief.metricDisplays.priorities)}</span><span class="metric-label">Priorities</span></button>` : ''}${
              available.output ? `<button type="button" class="app-metric-button focusable${has.output ? '' : ' is-empty'}" data-action="open-section" data-section="output" aria-pressed="${state.activeSection === 'output'}" aria-controls="panel-output"><span class="metric-value">${escapeHtml(brief.metricDisplays.output)}</span><span class="metric-label">Output</span></button>` : ''}${
              available.receipts ? `<button type="button" class="app-metric-button focusable${has.receipts ? '' : ' is-empty'}" data-action="open-section" data-section="receipts" aria-pressed="${state.activeSection === 'receipts'}" aria-controls="panel-receipts"><span class="metric-value">${escapeHtml(brief.metricDisplays.receipts)}</span><span class="metric-label">Receipts</span></button>` : ''}${
              available.attention ? `<button type="button" class="app-metric-button focusable${has.attention ? '' : ' is-empty'}" data-action="open-section" data-section="attention" aria-pressed="${state.activeSection === 'attention'}" aria-controls="panel-attention"><span class="metric-value">${escapeHtml(brief.metricDisplays.attention)}</span><span class="metric-label">Flags</span></button>` : ''}</div>

            ${available.priorities ? sectionHtml('priorities', 'Top priorities', String(brief.counts.priorities), `<div class="priority-list">${renderPriorityRows(brief)}</div>`) : ''}
            ${available.output ? sectionHtml('output', 'Overnight output', String(brief.counts.output), `<div class="output-list app-list-stack">${renderOutputRows(brief)}</div>`) : ''}
            ${available.receipts ? sectionHtml('receipts', 'Value receipts', brief.metricDisplays.receipts, `<div class="receipt-list app-list-stack">${renderReceiptRows(brief)}</div>`) : ''}
            ${available.attention ? sectionHtml('attention', 'Needs attention', String(brief.counts.attention), `<div class="attention-list app-list-stack">${renderAttentionRows(brief)}</div>`) : ''}

            <ox-footer variant="reads" class="brief-footer" state="${footer.state}" heading="${escapeHtml(footer.heading)}" detail="${escapeHtml(footer.detail)}" action-label="${escapeHtml(footer.action)}"${
              brief.footerUrl ? ` data-url="${escapeHtml(brief.footerUrl)}"` : ''
            }></ox-footer>
          </div>
        </div>
      `;
    }

    function sectionHtml(section, title, badge, body) {
      const open = state.activeSection === section;
      return `
            <section class="brief-section app-accordion-section ${open ? 'is-open' : ''}" id="section-${section}">
              <button type="button" class="app-accordion-trigger focusable" id="trigger-${section}" data-action="toggle-section" data-section="${section}" aria-expanded="${open}" aria-controls="panel-${section}">
                <span class="app-accordion-trigger-left">
                  <span class="app-accordion-trigger-title">${escapeHtml(title)}</span>
                  <span class="app-accordion-trigger-badge">${escapeHtml(badge)}</span>
                </span>
                <span class="app-accordion-chevron">${icons.chevronDown(14)}</span>
              </button>
              <div class="app-accordion-body" id="panel-${section}" role="region" aria-labelledby="trigger-${section}" aria-hidden="${!open}">
                ${body}
              </div>
            </section>`;
    }

    function renderErrorState() {
      content.innerHTML = `
        <div class="brief-shell widget-shell-card animate-in">
          <div class="ox-card ox-surface" data-edge="red">
            <div class="brief-calm" role="alert">
              <div class="brief-calm-title">Morning brief unavailable</div>
              <div class="brief-calm-copy">The latest brief could not be loaded. Open live view to retry when the workspace is reachable.</div>
            </div>
            <ox-footer variant="reads" class="brief-footer" state="failed" heading="Couldn’t load" detail="nothing was changed" action-label="Live view ↗" data-url="${FALLBACK_REVIEW_URL}"></ox-footer>
          </div>
        </div>
      `;
    }

    function render() {
      if (state.isLoading) {
        renderSkeleton();
        return;
      }
      if (state.error) {
        renderErrorState();
        return;
      }

      const brief = normalizeBrief(state.brief);
      if (!brief) {
        renderEmptyState();
        return;
      }

      renderBrief(brief);
    }

    function setActiveSection(section, options = {}) {
      state.activeSection = section;

      content.querySelectorAll('.app-accordion-section').forEach((sectionElement) => {
        const sectionId = sectionElement.id.replace('section-', '');
        const isOpen = sectionId === section;
        sectionElement.classList.toggle('is-open', isOpen);

        const trigger = sectionElement.querySelector('.app-accordion-trigger');
        const panel = sectionElement.querySelector('.app-accordion-body');
        if (trigger) trigger.setAttribute('aria-expanded', String(isOpen));
        if (panel) panel.setAttribute('aria-hidden', String(!isOpen));
      });

      content.querySelectorAll('.app-metric-button[data-section]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.section === section));
      });

      if (section && options.scroll) {
        document
          .getElementById(`section-${section}`)
          ?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function handleActionClick(event) {
      const trigger = event.target.closest('[data-action]');
      if (!trigger) return;

      const action = trigger.dataset.action;
      if (action === 'open-section') {
        event.preventDefault();
        setActiveSection(trigger.dataset.section || state.activeSection, { scroll: true });
        return;
      }

      if (action === 'toggle-section') {
        event.preventDefault();
        const section = trigger.dataset.section;
        setActiveSection(state.activeSection === section ? null : section);
        return;
      }

      if (action === 'open-link') {
        openWidgetLink(trigger.dataset.url, event);
      }
    }

    // The footer's text action (Open review queue, Open live view) leaves through the host.
    function openFooterLink(event) {
      const footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-url]') : null;
      if (!footer) return;
      const url = footer.getAttribute('data-url');
      if (openWidgetLink(url, event) === false) return;
      try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (_) { /* host owns recovery */ }
    }
    content.addEventListener('ox-action', openFooterLink);

    // Receipt rows route through the host instead of navigating the sandbox.
    content.addEventListener('ox-open', (event) => {
      if (event.detail && event.detail.href) openWidgetLink(event.detail.href, event);
    });

    function settleBrief(payload) {
      const commit = () => {
        state.brief = payload || state.brief;
        state.isLoading = false;
        render();
      };

      const delay = Math.max(0, MIN_LOADING_MS - (Date.now() - bootStartedAt));
      window.setTimeout(commit, delay);
    }

    render();

    if (isDemo && !isLoadingOverride) {
      state.brief = demoError || demoState === 'empty' ? null : demoBriefVariant;
      state.isLoading = false;
      render();
    } else if (!isLoadingOverride) {
      const protocol = detectProtocol();
      initWidget({
        // The partial notice lives inside the card; no second banner above it.
        dataAvailabilityNotice: false,
        live: { anchor: '#content', widget: 'morning-brief', emptyLabel: 'No agents running' },
        render: (payload) => {
          if (payload) {
            settleBrief(payload);
            return;
          }
          // ChatGPT supplies null when a completed tool call has no brief
          // payload. Treat that as an empty state instead of leaving a
          // permanent skeleton. MCP Apps hosts render null before their async
          // tool-result notification, so they must remain in loading state.
          if (
            protocol === 'standalone' ||
            (protocol === 'chatgpt' && payload === null)
          ) {
            settleBrief(null);
          }
        },
      });
    }
  </script>
</body>
</html>
