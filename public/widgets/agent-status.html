<!DOCTYPE html>
<html lang="en" data-accent="lime">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Status - OrgX</title>
  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/components/domain-accent.css" />
  <script src="shared/kit/ox-elements-core.js"></script>
  <script src="shared/kit/ox-elements-footer.js"></script>
  <script src="shared/kit/ox-elements-avatar.js"></script>
  <script src="shared/agent-identity.js"></script>
  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/widget-state.js"></script>
  <script src="shared/interaction-kit.js"></script>
  <script src="shared/components/domain-accent.js"></script>
  <script src="shared/components/liveness-indicator.js"></script>
  <script src="shared/live-machine.js"></script>
  <script src="shared/live-store.js"></script>
  <script src="shared/live-panel.js"></script>
  <style>
    /* Canvas: F2 (calm) and Z1 (who is on it). One card: the attention line, one row
       per agent with its avatar in the form its state calls for, the selected agent's
       focus, and the SM3 footer. Surfaces and status colors come from the kit tokens. */
    :root { --ox-primary-rgb: 191, 255, 0; }

    /* The kit's primaries are its action lime (--ox-action) in every widget. */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ox-font);
      background: var(--ox-bg);
      color: var(--ox-text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button { font: inherit; color: inherit; }

    .agent-board { max-width: 640px; margin: 0 auto; }
    .skeleton-wrapper { transition: opacity 200ms ease; }

    @keyframes agentIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-in { animation: agentIn var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out) both; }

    .agent-command-shell {
      position: relative;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      overflow: hidden;
      --edge-rgb: var(--ox-edge-teal-rgb);
    }
    .agent-command-shell::after {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), 0.75), transparent);
    }
    .agent-command-shell[data-edge="amber"] { --edge-rgb: var(--ox-edge-amber-rgb); }

    .agent-head { border-bottom: 1px solid var(--ox-border); --ox-attention-padding: 0 18px; }

    /* One row per agent. The row's select button stretches over the row; the
       avatar (the agent's hover card, its own button) sits above that layer,
       so nothing interactive nests and both stay 44 px targets. */
    .agent-switcher-list { display: flex; flex-direction: column; padding: 6px; list-style: none; }
    .agent-switcher-row {
      position: relative;
      display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 12px;
      min-height: 60px; padding: 8px 10px 8px 12px; border-radius: 12px; color: var(--ox-text);
      transition: background 160ms ease;
    }
    @media (hover: hover) { .agent-switcher-row:hover { background: color-mix(in srgb, var(--ox-hover) 60%, transparent); } }
    .agent-switcher-row[data-selected="true"], .agent-switcher-row[data-selected="true"]:hover { background: var(--ox-hover); }
    .agent-switcher-select {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
      min-width: 0; min-height: 44px; margin: 0; padding: 0; border: 0; background: none;
      font: inherit; color: inherit; text-align: left; cursor: pointer; outline: none;
    }
    .agent-switcher-select::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }
    .agent-switcher-row .agent-switcher-select:focus-visible { outline: none; }
    .agent-switcher-select:focus-visible::after { outline: 2px solid var(--ox-focus); outline-offset: -2px; }
    .agent-avatar { position: relative; z-index: 1; display: grid; place-items: center; width: 32px; height: 32px; line-height: 0; }
    .switcher-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .switcher-identity { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .switcher-name { font-size: 14px; font-weight: 650; }
    .switcher-role { font-size: 12.5px; color: var(--ox-text-muted); }
    .switcher-focus { font-size: 12.5px; line-height: 1.4; color: var(--ox-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .switcher-focus .is-stalled { color: var(--ox-warning); font-weight: 600; }
    .switcher-status { display: flex; justify-content: flex-end; }

    .idle-agent-toggle {
      display: flex; align-items: center; gap: 8px; width: calc(100% - 12px); min-height: 44px; margin: 0 6px 6px;
      padding: 0 12px; border-radius: 10px; border: 0; background: transparent; cursor: pointer;
      font-size: 12.5px; font-weight: 600; color: var(--ox-text-muted);
    }
    .idle-agent-toggle:hover { color: var(--ox-text); }
    .idle-agent-toggle .chevron { width: 14px; height: 14px; transition: transform 160ms ease; }
    .idle-agent-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

    /* The selected agent's focus */
    .agent-command-panel { border-top: 1px solid var(--ox-border); padding: 16px 20px 4px; display: flex; flex-direction: column; gap: 10px; }
    .command-focus-header { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 28px; }
    .command-who { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: 13px; color: var(--ox-text-muted); }
    .command-who b { font-weight: 650; color: var(--ox-text); }
    .command-focus-title { font-size: 17px; font-weight: 650; line-height: 1.3; letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }
    /* Progress: one bar with its number, then the counts in plain words. */
    .command-progress { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; }
    .command-progress-bar { height: 6px; border-radius: 999px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.14)); overflow: hidden; }
    .command-progress-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--ox-teal); }
    .command-progress-value { font-size: 12.5px; color: var(--ox-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .command-progress-value b { font-weight: 650; color: var(--ox-text); }
    .command-meta { font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
    .command-meta .tone-blocked { color: var(--ox-warning); font-weight: 600; }

    .agent-attention { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 10px; align-items: start; text-align: left; padding: 10px 12px; border: 0; border-radius: 10px; background: rgba(var(--ox-warning-rgb, 251, 191, 36), 0.08); }
    .agent-attention > svg { grid-row: span 2; margin-top: 1px; color: var(--ox-warning); }
    .agent-attention .attention-title { font-size: 12.5px; font-weight: 650; color: var(--ox-warning); }
    .agent-attention .attention-body { font-size: 13.5px; line-height: 1.45; color: var(--ox-text); overflow-wrap: anywhere; }

    .command-state-note { font-size: 12.5px; color: var(--ox-text-muted); }
    .command-state-note strong { color: var(--ox-text-2); font-weight: 600; }

    /* Work details: a section header across the panel, not a pill in a box. */
    .command-panel-actions { display: flex; align-items: stretch; justify-content: space-between; gap: 8px; margin: 2px -20px 0; padding: 0 12px 0 20px; border-top: 1px solid var(--ox-border); }
    .command-disclosure, .command-live-link {
      display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0; border-radius: 0;
      border: 0; background: transparent; cursor: pointer; text-decoration: none;
      font-size: 13px; font-weight: 600; color: var(--ox-text-2);
    }
    .command-disclosure { flex: 1; min-width: 0; }
    .command-live-link { padding: 0 8px; border-radius: 10px; }
    .command-disclosure:hover, .command-live-link:hover { color: var(--ox-text); }
    .command-disclosure .count { font-size: 12.5px; font-weight: 500; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
    .command-disclosure .chevron, .command-live-link svg { width: 14px; height: 14px; flex: none; }
    .command-disclosure .chevron { color: var(--ox-text-muted); transition: transform 200ms var(--ox-ease-out, ease); }
    .command-disclosure[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .command-disclosure:focus-visible, .command-live-link:focus-visible { outline-offset: -2px; border-radius: 8px; }

    .command-details { display: flex; flex-direction: column; gap: 12px; padding: 0 0 12px; }
    .command-details[hidden] { display: none; }
    .command-detail-label { font-size: 12.5px; font-weight: 600; color: var(--ox-text-muted); margin-bottom: 2px; }
    .command-detail-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 40px; padding: 7px 0; border-top: 1px solid var(--ox-border); }
    .command-detail-row:first-of-type { border-top: 0; }
    .command-detail-title { font-size: 13.5px; line-height: 1.4; color: var(--ox-text); overflow-wrap: anywhere; }
    .command-detail-copy { min-width: 0; }
    .command-detail-why { display: block; font-size: 12.5px; color: var(--ox-warning); margin-top: 2px; }
    .command-detail-state { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ox-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .command-detail-state .command-progress-bar { width: 64px; }
    .command-detail-state[data-tone='done'] { color: var(--ox-teal); }

    .quiet-command-state { padding: 16px 20px 18px; font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); }

    .sk { display: block; border-radius: 6px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.12)); }
    .sk-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 72px; align-items: center; gap: 12px; min-height: 60px; padding: 8px 18px; }

    .focusable:focus-visible { outline: 2px solid var(--ox-focus, var(--ox-warning)); outline-offset: -2px; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .agent-head { --ox-attention-padding: 0 14px; }
      .agent-switcher-list { padding: 4px; }
      .agent-switcher-row { gap: 10px; padding: 8px 8px 8px 10px; }
      .switcher-role { display: none; }
      .agent-command-panel { padding: 14px 16px 4px; }
      .command-panel-actions { margin: 2px -16px 0; padding: 0 8px 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-in { animation: none; }
    }
  </style>

<body>
  <main class="agent-board" id="content" aria-live="polite">
    <div class="skeleton-wrapper" aria-busy="true">
      <div class="agent-command-shell">
        <div class="agent-head" style="height:44px;display:flex;align-items:center;gap:10px;padding:0 18px"><span class="sk" style="width:8px;height:8px;border-radius:50%"></span><span class="sk" style="width:40%;height:12px"></span></div>
        <div class="sk-row"><span class="sk" style="width:32px;height:32px;border-radius:50%"></span><span style="display:flex;flex-direction:column;gap:6px"><span class="sk" style="width:30%;height:12px"></span><span class="sk" style="width:76%;height:11px"></span></span><span class="sk" style="height:22px;border-radius:999px"></span></div>
        <div class="sk-row"><span class="sk" style="width:32px;height:32px;border-radius:50%"></span><span style="display:flex;flex-direction:column;gap:6px"><span class="sk" style="width:26%;height:12px"></span><span class="sk" style="width:64%;height:11px"></span></span><span class="sk" style="height:22px;border-radius:999px"></span></div>
        <div class="agent-command-panel" aria-hidden="true"><span style="display:flex;gap:10px;align-items:center"><span class="sk" style="width:28px;height:28px;border-radius:50%"></span><span class="sk" style="width:34%;height:12px"></span></span><span class="sk" style="width:86%;height:20px"></span><span class="sk" style="width:100%;height:6px;border-radius:999px"></span><span class="sk" style="width:52%;height:12px"></span><span class="sk" style="width:100%;height:44px;margin-bottom:4px"></span></div>
        <ox-footer variant="reads" state="loading"></ox-footer>
      </div>
    </div>
  </main>

  <script>
    (function syncThemeFromUrl() {
      var theme = new URLSearchParams(window.location.search).get('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    })();

    var hasLoadedOnce = false;
    function injectHtml(html) {
      var content = document.getElementById('content');
      var skeleton = content.querySelector('.skeleton-wrapper');
      if (skeleton && !hasLoadedOnce) {
        skeleton.style.opacity = '0';
        setTimeout(function() {
          content.innerHTML = html;
          hasLoadedOnce = true;
          requestAnimationFrame(_sendSize);
        }, 300);
      } else {
        content.innerHTML = html;
        hasLoadedOnce = true;
        requestAnimationFrame(_sendSize);
      }
    }

    function _sendSize() {
      window.OrgXWidgetRuntime.reportSize();
    }

    function escapeHtml(value) {
      if (value == null) return '';
      var div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function firstString(values) {
      for (var i = 0; i < values.length; i += 1) {
        var value = values[i];
        if (typeof value === 'string' && value.trim()) return value.trim();
      }
      return '';
    }

    function asNumber(value) {
      if (typeof value === 'number' && !Number.isNaN(value)) return value;
      if (typeof value === 'string' && value.trim() !== '' && !Number.isNaN(Number(value))) {
        return Number(value);
      }
      return null;
    }

    function asArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function titleCase(value) {
      return String(value || '')
        .replace(/[-_]+/g, ' ')
        .replace(/\b\w/g, function (char) { return char.toUpperCase(); })
        .trim();
    }

    function normalizeStatus(value) {
      var normalized = String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '_');
      if (!normalized) return 'idle';
      if (['running', 'active', 'executing', 'in_progress', 'working'].indexOf(normalized) !== -1) return 'running';
      // 'stalled' is a first-class read-time derived status — agents whose
      // runs the API flagged as having no heartbeat in 30+ minutes. Keep
      // it distinct from 'blocked' so the resume surface is obvious.
      if (['stalled', 'stale'].indexOf(normalized) !== -1) return 'stalled';
      if (['verifying', 'validating', 'checking', 'testing'].indexOf(normalized) !== -1) return 'verifying';
      if (['blocked', 'waiting', 'at_risk'].indexOf(normalized) !== -1) return 'blocked';
      if (['needs_review', 'review', 'in_review'].indexOf(normalized) !== -1) return 'review';
      if (['queued', 'pending', 'not_started', 'todo', 'draft', 'backlog', 'paused'].indexOf(normalized) !== -1) return 'queued';
      if (['done', 'complete', 'completed', 'approved', 'shipped'].indexOf(normalized) !== -1) return 'done';
      return normalized;
    }

    function getStatusTone(status) {
      if (status === 'done') return 'done';
      if (status === 'blocked') return 'blocked';
      if (status === 'review') return 'review';
      if (status === 'stalled') return 'review';
      if (status === 'queued' || status === 'idle') return 'idle';
      return 'running';
    }

    function getStatusLabel(status) {
      if (status === 'blocked') return 'Needs you';
      if (status === 'review') return 'Needs review';
      if (status === 'approved') return 'Approved';
      if (status === 'done') return 'Done';
      if (status === 'queued') return 'Queued';
      if (status === 'idle') return 'Idle';
      if (status === 'stalled') return 'Needs refresh';
      if (status === 'verifying') return 'Verifying';
      return 'Running';
    }

    /* ------------------------------------------------------------ resume -- */
    // Agents surfaced as "stalled" carry the run_id the TTL cron auto-closed.
    // Resume calls resume_agent_run, then reads orgx_command_status({kind:'run'})
    // until the run settles, so the footer reports what the run actually did.
    var resumeStates = {};
    var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var STATUS_POLL_LIMIT_MS = 120000;

    function setResumeState(runId, next) {
      if (next) resumeStates[runId] = next;
      else delete resumeStates[runId];
      syncAgentFooter(runId);
    }

    function readRunStatus(runId) {
      return window.OrgXWidgetRuntime.callTool('orgx_command_status', { kind: 'run', id: runId }).then(function (raw) {
        var runtime = window.OrgXWidgetRuntime;
        return runtime.extractStructuredWidgetData ? runtime.extractStructuredWidgetData(raw, true) : raw;
      });
    }

    function watchResumedRun(runId) {
      if (!UUID_RE.test(runId)) {
        setResumeState(runId, { phase: 'unconfirmed' });
        return Promise.resolve();
      }
      var deadline = Date.now() + STATUS_POLL_LIMIT_MS;
      function poll(wait) {
        return new Promise(function (resolve) { window.setTimeout(resolve, wait); })
          .then(function () { return readRunStatus(runId); })
          .then(function (status) {
            if (!status || typeof status !== 'object' || typeof status.state !== 'string') {
              setResumeState(runId, { phase: 'unconfirmed' });
              return;
            }
            var outcome = typeof status.outcome === 'string' ? status.outcome.trim() : '';
            var final = status.next_poll_after_ms === null || status.next_poll_after_ms === undefined;
            if (status.state === 'succeeded') return setResumeState(runId, { phase: 'done', detail: outcome });
            if (status.state === 'failed') return setResumeState(runId, { phase: 'run-failed', detail: outcome });
            if (status.state === 'cancelled') return setResumeState(runId, { phase: 'run-failed', heading: 'Run cancelled', detail: outcome || 'cancelled in OrgX' });
            if (status.state === 'not_found') return setResumeState(runId, { phase: 'unconfirmed', detail: 'OrgX has no status for it yet' });
            setResumeState(runId, {
              phase: status.state === 'queued' || status.state === 'held' ? 'queued' : 'running',
              detail: status.waiting_on === 'person' ? 'waiting on a person in OrgX' : outcome,
            });
            if (final || Date.now() >= deadline) {
              if (final) return;
              setResumeState(runId, { phase: 'unconfirmed' });
              return;
            }
            return poll(Math.min(15000, Math.max(750, Number(status.next_poll_after_ms) || 2000)));
          })
          .catch(function () {
            setResumeState(runId, { phase: 'unconfirmed' });
          });
      }
      return poll(0);
    }

    function resumeAgentRun(runId) {
      if (!runId) return;
      var current = resumeStates[runId];
      if (current && (current.phase === 'sending' || current.phase === 'queued' || current.phase === 'running')) return;
      setResumeState(runId, { phase: 'sending' });
      var args = { run_id: runId, note: 'Resumed from agent-status widget' };
      Promise.resolve(window.OrgXWidgetRuntime.callTool('resume_agent_run', args))
        .then(function () {
          setResumeState(runId, { phase: 'queued' });
          return watchResumedRun(runId);
        })
        .catch(function (err) {
          var message = err && typeof err.message === 'string' ? err.message.trim() : '';
          setResumeState(runId, { phase: 'failed', detail: message && message.length <= 36 ? message.replace(/\.$/, '') : '' });
          console.warn('[agent-status] resume failed', err);
        });
    }
    window.__orgxResumeAgentRun = resumeAgentRun;


    function collectionKey(item) {
      if (typeof item === 'string') return item.trim();
      if (!item || typeof item !== 'object') return '';
      return firstString([
        item.id,
        item.task_id,
        item.taskId,
        item.entity_id,
        item.entityId,
        item.title,
        item.summary,
        item.name,
        item.description
      ]) || JSON.stringify(item);
    }

    function mergeUniqueItems(left, right) {
      var seen = {};
      return ([]).concat(asArray(left), asArray(right)).filter(function (item) {
        var key = collectionKey(item);
        if (!key || seen[key]) return false;
        seen[key] = true;
        return true;
      });
    }

    var REMOTE_WIDGET_ASSET_BASE = 'https://mcp.useorgx.com/widgets/shared/';
    function resolveWidgetAsset(path){
      return REMOTE_WIDGET_ASSET_BASE + path;
    }

    var AGENT_DIRECTORY = {
      pace: { name: 'Pace', role: 'Product', accentRgb: '22, 163, 74' },
      product: { name: 'Pace', role: 'Product', accentRgb: '22, 163, 74' },
      eli: { name: 'Eli', role: 'Engineering', accentRgb: '6, 182, 212' },
      engineering: { name: 'Eli', role: 'Engineering', accentRgb: '6, 182, 212' },
      mark: { name: 'Mark', role: 'Marketing', accentRgb: '249, 115, 22' },
      marketing: { name: 'Mark', role: 'Marketing', accentRgb: '249, 115, 22' },
      sage: { name: 'Sage', role: 'Sales', accentRgb: '168, 85, 247' },
      sales: { name: 'Sage', role: 'Sales', accentRgb: '168, 85, 247' },
      orion: { name: 'Orion', role: 'Operations', accentRgb: '245, 158, 11' },
      operations: { name: 'Orion', role: 'Operations', accentRgb: '245, 158, 11' },
      dana: { name: 'Dana', role: 'Design', accentRgb: '236, 72, 153' },
      design: { name: 'Dana', role: 'Design', accentRgb: '236, 72, 153' },
      xandy: { name: 'Xandy', role: 'Orchestrator', accentRgb: '20, 184, 166' },
      orchestrator: { name: 'Xandy', role: 'Orchestrator', accentRgb: '20, 184, 166' }
    };

    function resolveAgentProfile(agent) {
      var directName = firstString([agent.agent_name, agent.name, agent.title]);
      var directRole = firstString([agent.role, agent.persona, agent.domain, agent.agent_domain]);
      var agentType = firstString([agent.agent_type, agent.type, agent.domain, agent.agent_domain]).toLowerCase();
      var nameKey = directName.toLowerCase();
      var roleKey = directRole.toLowerCase();
      // A named agent is matched by its name ("engineering-agent" is Eli); the
      // type or role names one only when the payload gives no name.
      var identity = window.OrgXAgentIdentity;
      var who = identity ? (directName ? identity.profile(directName) : identity.profile(agentType, roleKey)) : null;
      var profile = (who && AGENT_DIRECTORY[who.key]) || AGENT_DIRECTORY[nameKey] || (!directName && (AGENT_DIRECTORY[agentType] || AGENT_DIRECTORY[roleKey])) || null;
      return {
        name: (who && who.name) || directName || (profile && profile.name) || 'OrgX Agent',
        role: directRole || (profile && profile.role) || titleCase(agentType) || 'Agent',
        accentRgb: (profile && profile.accentRgb) || '20, 184, 166'

    }

    function footerHtml(agent) {
      var spec = footerSpec(agent);
      return '<ox-footer class="agent-footer" data-agent-id="' + escapeHtml(agent.id) + '" data-run-id="' + escapeHtml(agent.runId || '') + '" ' +
        footerAttrs(spec).map(function (pair) { return pair[0] + '="' + escapeHtml(pair[1]) + '"'; }).join(' ') + '></ox-footer>';
    }

    // Move the footer (and the row chip) in place; the kit crossfades and keeps focus.
    function syncAgentFooter(runId) {
      currentAgents.forEach(function (agent) {
        if (agent.runId !== runId) return;
        var footer = document.querySelector('ox-footer[data-agent-id="' + CSS.escape(agent.id) + '"]');
        if (footer) {
          footerAttrs(footerSpec(agent)).forEach(function (pair) {
            if (footer.getAttribute(pair[0]) !== pair[1]) footer.setAttribute(pair[0], pair[1]);
          });
        }
        var row = document.querySelector('[data-agent-tab="' + CSS.escape(agent.id) + '"] .switcher-status');
        if (row) row.innerHTML = chipHtml(agent);
        var card = document.querySelector('[data-agent-id="' + CSS.escape(agent.id) + '"] ox-agent-card');
        if (card) card.setAttribute('state', displayState(agent));
      });
    }

    // The kit locks the primary on press until the state changes. Setting the state
    // clears the lock; touching the detail repaints the button as pressable again.
    function rearmFooter(footer) {
      var detail = footer.getAttribute('detail') || '';
      footer.setAttribute('state', footer.getAttribute('state') || '');
      footer.setAttribute('detail', detail + ' ');
      footer.setAttribute('detail', detail);
    }

    function openExternal(url, event) {
      if (!url) return;
      if (openWidgetLink(url, event) === false) return;
      try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (_) { /* host owns recovery */ }
    }

    document.addEventListener('ox-primary', function (event) {
      var footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-agent-id]') : null;
      if (!footer) return;
      var role = footer.getAttribute('data-role');
      if (role === 'resume') {
        var runId = footer.getAttribute('data-run-id');
        if (resumeStates[runId]) delete resumeStates[runId];
        resumeAgentRun(runId);
      } else if (role === 'handoff') {
        openExternal(footer.getAttribute('data-url'));
        // A handoff does not change state here; re-arm the primary for the next press.
        rearmFooter(footer);
      }
    });

    document.addEventListener('ox-action', function (event) {
      var footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-agent-id]') : null;
      if (!footer) return;
      var runId = footer.getAttribute('data-run-id');
      var resume = runId ? resumeStates[runId] : null;
      if (resume && resume.phase === 'unconfirmed') {
        setResumeState(runId, { phase: 'queued' });
        watchResumedRun(runId);
        return;
      }
      openExternal(footer.getAttribute('data-url'));
    });

    function renderCommandPanel(agent) {
      var detailsOpen = widgetState[agent.id] === 'details';
      var detailCount = Math.max(0, agent.blockers.length - (agent.status === 'blocked' ? 1 : 0)) + agent.tasks.length + agent.completedTasks.length + agent.artifacts.length + agent.streams.length;
      var isDone = agent.status === 'done';
      var counts = [
        !isDone && agent.taskCount ? agent.taskCount + (agent.taskCount === 1 ? ' task' : ' tasks') + ' in flight' : '',
        agent.blockedCount ? '<span class="tone-blocked">' + agent.blockedCount + ' blocked</span>' : '',
        agent.completedCount ? agent.completedCount + ' done' : '',
        agent.artifacts.length ? agent.artifacts.length + (agent.artifacts.length === 1 ? ' artifact' : ' artifacts') : ''
      ].filter(Boolean);
      var progress = agent.progress == null || isDone ? '' :
        '<div class="command-progress">' +
          '<div class="command-progress-bar" role="img" aria-label="' + escapeHtml(agent.progress + '% through') + '"><span style="width:' + Math.max(0, Math.min(100, agent.progress)) + '%"></span></div>' +
          '<span class="command-progress-value"><b>' + escapeHtml(String(agent.progress)) + '%</b>' + (agent.currentMeta ? ' · ' + escapeHtml(agent.currentMeta.replace(/ remaining$/, ' left')) : '') + '</span>' +
        '</div>';
      var stateMeta = window.OrgXWidgetState ? window.OrgXWidgetState.derive(agent) : null;
      var stateNote = stateMeta && stateMeta.state !== 'in_progress' && stateMeta.state !== 'completed' && stateMeta.state !== 'stale' && agent.status !== 'blocked' && agent.status !== 'stalled'
        ? '<div class="command-state-note" data-state="' + escapeHtml(stateMeta.state) + '"><strong>' + escapeHtml(stateMeta.label) + '</strong> · ' + escapeHtml(stateMeta.description) + '</div>'
        : '';
      var lastDone = agent.completedTasks[0] ? agent.completedTasks[0].title : '';
      var title = isDone ? (lastDone ? 'Last finished: ' + lastDone : 'No active task right now') : agent.currentTask;

      return (
        '<section class="agent-command-panel" id="agent-command-panel" aria-label="' + escapeHtml(agent.name) + ' agent details">' +
          '<div class="command-focus-header">' + renderAgentCard(agent, 'inline') +
            '<span class="command-who"><b>' + escapeHtml(agent.name) + '</b>' + escapeHtml(isDone ? 'is caught up' : agent.status === 'stalled' ? 'stopped on' : agent.status === 'blocked' ? 'is blocked on' : agent.status === 'review' ? 'needs your review on' : agent.status === 'queued' ? 'is up next on' : 'is working on') + '</span></div>' +
          '<div class="command-focus-title">' + escapeHtml(title) + '</div>' +
          progress +
          (counts.length ? '<div class="command-meta">' + counts.join(' · ') + '</div>' : '') +
          renderAttention(agent) +
          stateNote +
          '<div class="command-panel-actions">' +
            '<button type="button" class="command-disclosure focusable" data-action="toggle-details" data-agent="' + escapeHtml(agent.id) + '" aria-expanded="' + String(detailsOpen) + '" aria-controls="agent-work-details">Work details <span class="count">' + escapeHtml(detailCount + (detailCount === 1 ? ' item' : ' items')) + '</span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>' +
            '<a class="command-live-link focusable" ' + window.OrgXLinks.attrs(agent.openUrl) + '>Open in OrgX <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V14"/><path d="M14 4h6v6M20 4l-9 9"/></svg></a>' +
          '</div>' +
          renderCommandDetails(agent, detailsOpen) +
        '</section>' +
        footerHtml(agent)
      );
    }

    function attentionLine(needsAttention, moving, completed, queued) {
      var meta = syncedAt ? '<span slot="meta">' + window.OrgXTime.html(syncedAt, 'synced') + '</span>' : '';
      var activity = [moving ? moving + ' working' : '', queued ? queued + ' queued' : ''].filter(Boolean).join(' · ');
      if (needsAttention) {
        var sentence = needsAttention + ' agent' + (needsAttention === 1 ? ' needs' : 's need') + ' you' + (activity ? ' · ' + activity : '');
        return '<div class="agent-head"><ox-attention-line tone="needs-you" count="' + needsAttention + '"><span>' + escapeHtml(sentence) + '</span>' + meta + '</ox-attention-line></div>';
      }
      var calm = activity
        ? 'Nothing needs you · ' + activity
        : completed
        ? 'Nothing needs you · ' + completed + ' done'
        : 'No agents need you right now';
      return '<div class="agent-head"><ox-attention-line tone="calm" count="0"><span>' + escapeHtml(calm) + '</span>' + meta + '</ox-attention-line></div>';
    }

    function renderCurrentBoard() {
      if (!currentAgents.length) {
        injectHtml(
          '<div class="agent-command-shell animate-in" data-edge="teal">' +
            attentionLine(0, 0, 0) +
            '<div class="quiet-command-state">Everything is available for the next assignment.</div>' +
          '</div>'
        );
        return;
      }

      var activeAgents = currentAgents.filter(function (agent) { return !isIdleAgent(agent); });
      var idleAgents = currentAgents.filter(isIdleAgent);
      var selectedAgent = currentAgentsById[selectedAgentId] || null;
      if (!selectedAgent || (isIdleAgent(selectedAgent) && !showIdleAgents)) {
        selectedAgent = activeAgents[0] || null;
        selectedAgentId = selectedAgent ? selectedAgent.id : null;
      }

      var needsAttention = activeAgents.filter(function (agent) {
        return agent.status === 'blocked' || agent.status === 'review' || agent.status === 'stalled';
      }).length;
      // "Working" means running now. A queued agent has not started, so it is
      // counted as queued rather than inflating the working number.
      var moving = activeAgents.filter(function (agent) {
        return agent.status === 'running' || agent.status === 'verifying';
      }).length;
      var queuedCount = activeAgents.filter(function (agent) { return agent.status === 'queued'; }).length;
      var completed = activeAgents.filter(function (agent) { return agent.status === 'done'; }).length;

      var html = '<div class="agent-command-shell ox-surface animate-in" data-edge="' + (needsAttention ? 'amber' : 'teal') + '">';
      html += attentionLine(needsAttention, moving, completed, queuedCount);
      if (activeAgents.length) {
        html += '<ul class="agent-switcher-list" aria-label="Active agents">';
        activeAgents.forEach(function (agent) {
          html += renderSwitcherRow(agent, selectedAgentId === agent.id);
        });
        if (showIdleAgents) {
          idleAgents.forEach(function (agent) {
            html += renderSwitcherRow(agent, selectedAgentId === agent.id);
          });
        }
        html += '</ul>';
      } else if (!showIdleAgents) {
        html += '<div class="quiet-command-state">No active work. All agents are available.</div>';
      } else {
        html += '<ul class="agent-switcher-list" aria-label="Available agents">';
        idleAgents.forEach(function (agent) {
          html += renderSwitcherRow(agent, selectedAgentId === agent.id);
        });
        html += '</ul>';
      }

      if (idleAgents.length) {
        html += '<button type="button" class="idle-agent-toggle focusable" data-action="toggle-idle" aria-expanded="' + String(showIdleAgents) + '"><span>' + escapeHtml(String(idleAgents.length)) + ' available agent' + (idleAgents.length === 1 ? '' : 's') + '</span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>';
      }
      if (selectedAgent) html += renderCommandPanel(selectedAgent);
      html += '</div>';
      injectHtml(html);
    }

    function renderBoard(payload) {
      var normalized = normalizePayload(payload);
      syncedAt = new Date();
      currentAgents = normalized.agents.sort(function (left, right) {
        return getPriority(left) - getPriority(right) || left.name.localeCompare(right.name);
      });
      currentAgentsById = {};
      currentAgents.forEach(function (agent) {
        currentAgentsById[agent.id] = agent;
      });
      renderCurrentBoard();
    }


    function focusAgentTab(agentId) {
      Array.prototype.some.call(document.querySelectorAll('[data-agent-tab]'), function (button) {
        if (button.getAttribute('data-agent-tab') !== agentId) return false;
        button.focus();
        return true;
      });
    }

    document.addEventListener('click', function (event) {
      var trigger = event.target && event.target.closest('[data-action]');
      if (!trigger) return;
      var action = trigger.getAttribute('data-action');
      if (action === 'select-agent') {
        selectedAgentId = trigger.getAttribute('data-agent-tab');
        renderCurrentBoard();
        enterPanel();
        window.setTimeout(function () { focusAgentTab(selectedAgentId); }, 0);
      } else if (action === 'toggle-idle') {
        showIdleAgents = !showIdleAgents;
        renderCurrentBoard();
        window.setTimeout(function () {
          var nextTrigger = document.querySelector('[data-action="toggle-idle"]');
          if (nextTrigger) nextTrigger.focus();
        }, 0);
      } else if (action === 'toggle-details') {
        var agentId = trigger.getAttribute('data-agent');
        widgetState[agentId] = widgetState[agentId] === 'details' ? null : 'details';
        // Open and close in place, height and opacity together (reduced motion: instantly).
        var detailsPanel = document.getElementById('agent-work-details');
        var motion = window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.motion;
        if (detailsPanel && motion) {
          motion.setExpanded(detailsPanel, widgetState[agentId] === 'details', trigger);
          return;
        }
        renderCurrentBoard();
        window.setTimeout(function () {
          var nextTrigger = document.querySelector(
            '[data-action="toggle-details"][data-agent="' + CSS.escape(agentId) + '"]'
          );
          if (nextTrigger) nextTrigger.focus();
        }, 0);
      }
    });

    // A newly selected agent's panel fades in rather than snapping.
    function enterPanel() {
      var motion = window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.motion;
      var panel = document.getElementById('agent-command-panel');
      if (motion && panel) motion.enter(panel);
    }

    document.addEventListener('keydown', function (event) {
      if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
      var current = event.target && event.target.closest('[data-agent-tab]');
      if (!current) return;
      var tabs = Array.prototype.slice.call(document.querySelectorAll('[data-agent-tab]'));
      var index = tabs.indexOf(current);
      if (index < 0 || tabs.length < 2) return;
      event.preventDefault();
      var direction = event.key === 'ArrowDown' ? 1 : -1;
      var next = tabs[(index + direction + tabs.length) % tabs.length];
      selectedAgentId = next.getAttribute('data-agent-tab');
      renderCurrentBoard();
      enterPanel();
      window.setTimeout(function () { focusAgentTab(selectedAgentId); }, 0);
    });


    // Previews served next to the widgets read avatars from the same origin;
    // host sandboxes use the kit default (mcp.useorgx.com).
    if (window.OrgXElements && window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
      window.OrgXElements.avatarConfig.baseUrl = new URL('shared/avatars', window.location.href).toString();
    }

    var demoParams = new URLSearchParams(window.location.search);
    // Gallery previews (?gallery=true&state=…) read the same fixtures as ?demo=true.
    var isDemo = demoParams.get('demo') === 'true' || demoParams.get('gallery') === 'true';
    var demoState = demoParams.get('state') || 'populated';
    var demoPayload = isDemo
      ? {
          agents: [
            {
              agent_name: 'Pace',
              role: 'Product',
              status: 'blocked',
              current_task: 'Decide whether to ship self-serve usage pricing before founder onboarding opens',
              progress: 68,
              eta: '~2 days remaining',
              blockers: ['Waiting on pricing approval from founders before the activation test can launch.'],
              tasks: [
                { id: 'pace-1', title: 'Finalize velocity model for launch readiness scoring', status: 'done' },
                { id: 'pace-2', title: 'Audit founder activation loop for drop-off at pricing step', status: 'in_progress' },
                { id: 'pace-3', title: 'Package self-serve pricing recommendation for approval', status: 'blocked' }
              ],
              artifacts: [
                { id: 'pace-a', title: 'Velocity model draft', artifact_type: 'prod.analysis', status: 'approved', summary: 'Baseline launch scoring model accepted by the team.' },
                { id: 'pace-b', title: 'Activation loop audit', artifact_type: 'prod.report', status: 'in_review', summary: 'Recommendations ready for founder review.' }
              ],
              streams: [
                { id: 'pace-s1', name: 'Launch readiness', progress: 78 },
                { id: 'pace-s2', name: 'Founder onboarding', progress: 54 }
              ]
            },
            {
              agent_name: 'Eli',
              role: 'Engineering',
              status: 'running',
              current_task: 'Implement billing event pipeline and reconcile launch telemetry fields',
              progress: 74,
              eta: '~1 day remaining',
              tasks: [
                { id: 'eli-1', title: 'Backfill usage event normalization for Stripe and product analytics', status: 'in_progress' },
                { id: 'eli-2', title: 'Patch MCP launch event audit trail for founder review', status: 'done' }
              ],
              artifacts: [
                { id: 'eli-a', title: 'Billing event mapping', artifact_type: 'eng.spec', status: 'in_review', summary: 'Review needed before the instrumentation ships.' }
              ],
              streams: [
                { id: 'eli-s1', name: 'Billing instrumentation', progress: 82 },
                { id: 'eli-s2', name: 'Telemetry QA', progress: 61 }
              ]
            }
          ]
        }
      : null;

    // The gallery uses the same fixture contract as the live widget so each
    // state can be inspected without pretending a snapshot is fresher than
    // it is. Keep these transitions deterministic and intentionally bounded.
    if (demoPayload && demoState === 'stale') {
      demoPayload.agents[0].status = 'done';
      demoPayload.agents[0].blockers = [];
      demoPayload.agents[0].artifacts = (demoPayload.agents[0].artifacts || []).map(function (artifact) {
        return Object.assign({}, artifact, { status: 'approved' });
      });
      demoPayload.agents[0].tasks = (demoPayload.agents[0].tasks || []).map(function (task) {
        return Object.assign({}, task, { status: 'done' });
      });
      demoPayload.agents[1].last_heartbeat_at = new Date(Date.now() - 8 * 60 * 1000).toISOString();
      demoPayload.agents[1].updated_at = demoPayload.agents[1].last_heartbeat_at;
      demoPayload.agents[1].artifacts = (demoPayload.agents[1].artifacts || []).map(function (artifact) {
        return Object.assign({}, artifact, { status: 'approved' });
      });
    } else if (demoPayload && demoState === 'blocked') {
      demoPayload.agents[1].status = 'blocked';
      demoPayload.agents[1].blockers = ['Waiting on the production rollout approval before the next verification pass can begin.'];
    } else if (demoPayload && demoState === 'empty') {
      demoPayload.agents = [];
    } else if (demoPayload && demoState === 'stalled') {
      // Pace is running, so the stalled agent leads the board.
      demoPayload.agents[0].status = 'running';
      demoPayload.agents[0].blockers = [];
      demoPayload.agents[0].tasks = demoPayload.agents[0].tasks.map(function (task) { return task.status === 'blocked' ? Object.assign({}, task, { status: 'in_progress' }) : task; });
      demoPayload.agents[0].artifacts = demoPayload.agents[0].artifacts.map(function (artifact) { return Object.assign({}, artifact, { status: 'approved' }); });
      demoPayload.agents[1].status = 'stalled';
      demoPayload.agents[1].run_id = '0f6c2a1e-5b7d-4c3e-9a8b-2d1e0f9c8b7a';
      demoPayload.agents[1].stalled_minutes = 135;
      demoPayload.agents[1].artifacts = [];
      demoPayload.agents[1].tasks[0] = Object.assign({}, demoPayload.agents[1].tasks[0], { status: 'stalled', stored_status: 'in_progress' });
    } else if (demoPayload && (demoState === 'resolved' || demoState === 'completed')) {
      demoPayload.agents.forEach(function (agent) {
        agent.status = 'done';
        agent.blockers = [];
        agent.artifacts = (agent.artifacts || []).map(function (artifact) {
          return Object.assign({}, artifact, { status: 'approved' });
        });
        agent.tasks = (agent.tasks || []).map(function (task) {
          return Object.assign({}, task, { status: 'done' });
        });
        agent.updated_at = new Date().toISOString();
      });
    } else if (demoPayload && demoState === 'progressing') {
      demoPayload.agents[0].status = 'verifying';
      demoPayload.agents[0].blockers = [];
      demoPayload.agents.forEach(function (agent) {
        agent.artifacts = (agent.artifacts || []).map(function (artifact) {
          return Object.assign({}, artifact, { status: 'approved' });
        });
      });
      demoPayload.agents[0].current_task = 'Validating the next acceptance slice and collecting proof';
      demoPayload.agents.forEach(function (agent) {
        agent.last_heartbeat_at = new Date().toISOString();
        agent.updated_at = agent.last_heartbeat_at;
        agent.run_id = agent.agent_name.toLowerCase() + '-run-live';
      });
    }

    if (demoParams.get('loading') !== 'true' && demoState !== 'loading') initWidget({
      /* Live control flow. The board is a point-in-time snapshot; this
         subscribes so agents that start, finish, or block after the message was
         sent show up instead of going unseen. Additive — a payload with no
         'live' grant renders exactly as before. */
      live: {
        anchor: '.board',
        widget: 'agent-status',
        emptyLabel: 'No agents running',
      },
      render: function (payload) {
        renderBoard(payload || demoPayload);
      }
    });
  </script>
</body>
</html>
