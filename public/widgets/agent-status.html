<!DOCTYPE html>
<html lang="en" data-accent="lime">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Status - OrgX</title>
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/components/domain-accent.css" />
  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/widget-state.js"></script>
  <script src="shared/interaction-kit.js"></script>
  <script src="shared/components/domain-accent.js"></script>
  <script src="shared/components/liveness-indicator.js"></script>
  <style>
    
    :root, :root[data-theme="light"] {
      --ox-bg: #f8fafc;
      --ox-panel: #ffffff;
      --ox-border: rgba(0, 0, 0, 0.08);
      --ox-border-strong: rgba(0, 0, 0, 0.15);
      --ox-text: #0f172a;
      --ox-text-muted: #64748b;
      --ox-text-dim: #94a3b8;
      --ox-well-bg: #f1f5f9;
      --ox-well-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      --ox-primary: #bfff00;
      --ox-primary-rgb: 191, 255, 0;
      --ox-primary-rgb: 191, 255, 0;
      --ox-grid: rgba(0, 0, 0, 0.03);
    }
    
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ox-bg: #02040a;
        --ox-panel: rgba(10, 15, 22, 0.95);
        --ox-border: rgba(255, 255, 255, 0.08);
        --ox-border-strong: rgba(255, 255, 255, 0.15);
        --ox-text: #f8fafc;
        --ox-text-muted: rgba(255, 255, 255, 0.5);
        --ox-text-dim: rgba(255, 255, 255, 0.32);
        --ox-well-bg: rgba(0,0,0,0.3);
        --ox-well-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
        --ox-primary: #bfff00;
      --ox-primary-rgb: 191, 255, 0;
      --ox-primary-rgb: 191, 255, 0;
        --ox-grid: rgba(255, 255, 255, 0.02);
      }
    }
    
    :root[data-theme="dark"] {
        --ox-bg: #02040a;
        --ox-panel: rgba(10, 15, 22, 0.95);
        --ox-border: rgba(255, 255, 255, 0.08);
        --ox-border-strong: rgba(255, 255, 255, 0.15);
        --ox-text: #f8fafc;
        --ox-text-muted: rgba(255, 255, 255, 0.5);
        --ox-text-dim: rgba(255, 255, 255, 0.32);
        --ox-well-bg: rgba(0,0,0,0.3);
        --ox-well-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
        --ox-primary: #bfff00;
      --ox-primary-rgb: 191, 255, 0;
      --ox-primary-rgb: 191, 255, 0;
        --ox-grid: rgba(255, 255, 255, 0.02);
    }
    
    :root {
      --ox-lime: #d4ed31;
      --ox-warning: #fbbf24;
      --ox-danger: #f43f5e;
      --ox-font: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      --ox-mono: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular, monospace;
    }


    :root {
      --agent-surface-max: 720px;
      --agent-running: #10a37f;
      --agent-blocked: var(--ox-danger);
      --agent-review: var(--ox-warning);
      --agent-idle: var(--ox-text-dim);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--ox-font);
      background: var(--ox-bg);
      color: var(--ox-text);
      padding: 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% -18%, rgba(var(--ox-primary-rgb), 0.08), transparent 56%),
                    linear-gradient(var(--ox-grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--ox-grid) 1px, transparent 1px);
        background-size: 100% 100%, 20px 20px, 20px 20px;
        pointer-events: none;
        z-index: -1;
    }
    

    .agent-board {
      width: 100%;
      max-width: var(--agent-surface-max);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .surface-label {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ox-text-dim);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .surface-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--ox-border);
    }
    .agent-card {
      --ox-card-color-rgb: var(--agent-accent-rgb, var(--ox-primary-rgb));
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      background: var(--ox-panel);
      border-color: var(--ox-border);
      box-shadow: var(--ox-shadow);
      transition:
        transform var(--widget-motion-fast) var(--widget-motion-curve),
        border-color var(--widget-motion-fast) var(--widget-motion-curve),
        box-shadow var(--widget-motion-fast) var(--widget-motion-curve);
    }

    .agent-card[data-priority='running'] { --ox-card-color-rgb: 0, 201, 167; }
    .agent-card[data-priority='blocked'] { --ox-card-color-rgb: 244, 63, 94; }
    .agent-card[data-priority='review'],
    .agent-card[data-priority='stalled']   { --ox-card-color-rgb: 251, 191, 36; }
    .agent-card[data-priority='idle'], .agent-card[data-priority='queued'] { --ox-card-color-rgb: 100, 116, 139; }
    
    .agent-card.app-flat-card::after {
      background: linear-gradient(90deg, transparent, rgba(var(--ox-card-color-rgb), 0.6), transparent);
    }

    .agent-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 12px;
    }

    .agent-identity {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-title-group {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .agent-name-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .agent-name {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ox-text);
      min-width: 0;
    }

    .agent-role {
      color: rgba(var(--agent-accent-rgb, var(--ox-card-color-rgb)), 0.9);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .agent-subline {
      color: var(--ox-text-muted);
      font-size: 0.875rem;
      line-height: 1.35;
      min-width: 0;
    }

    .agent-subline strong {
      color: var(--ox-text);
      font-weight: 500;
    }


    [data-tone="running"], [data-tone="done"], [data-tone="approved"] {
      --ox-color: var(--ox-primary);
      --ox-color-rgb: 0, 201, 167;
    }
    [data-tone="blocked"] {
      --ox-color: var(--ox-danger);
      --ox-color-rgb: 244, 63, 94;
    }
    [data-tone="review"] {
      --ox-color: var(--ox-warning);
      --ox-color-rgb: 251, 191, 36;
    }
    [data-tone="queued"], [data-tone="idle"] {
      --ox-color: var(--ox-text-muted);
      --ox-color-rgb: 100, 116, 139;
    }
    
    .agent-chip {
      --ox-color: var(--ox-primary);
      --ox-color-rgb: 0, 201, 167;
      flex-shrink: 0;
    }

    .agent-attention {
      margin: 0 12px 12px;
      box-shadow: none;
    }

    .attention-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .attention-title {
      color: currentColor;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .attention-body {
      color: var(--ox-text);
      font-size: 0.875rem;
      line-height: 1.4;
    }

    .attention-action {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .focus-strip {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .focus-task {
      color: var(--ox-text);
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .focus-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--ox-text-muted);
      font-size: 0.875rem;
      line-height: 1.35;
    }

    .focus-meta span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .focus-meta span + span::before {
      content: '';
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: var(--ox-text-dim);
      margin-right: 8px;
    }

    .metric-row {
      border-top: 1px solid var(--ox-border);
      border-bottom: 1px solid var(--ox-border);
    }

    .metric-button {
      min-height: 72px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .metric-button[data-tone='blocked'] .metric-value {
      color: var(--agent-blocked);
    }

    .metric-button[data-tone='review'] .metric-value {
      color: var(--agent-review);
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1;
      color: var(--ox-text);
    }

    .metric-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ox-text-dim);
    }

    .agent-section {
      display: none;
      padding-bottom: 16px;
    }
    @keyframes sectionFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .agent-section.is-open {
      display: block;
      animation: sectionFadeIn var(--ox-dur-base, 250ms) var(--ox-ease-entry, cubic-bezier(0, 0, 0.2, 1)) forwards;
    }

    .agent-section-trigger {
      border-top: 1px solid var(--ox-border);
    }

    .disclosure-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .disclosure-count {
      color: var(--ox-text-dim);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chevron {
      width: 14px;
      height: 14px;
      color: var(--ox-text-dim);
      transition: transform 160ms ease;
      flex-shrink: 0;
    }

    .agent-section.is-open .chevron {
      transform: rotate(180deg);
    }

    .section-list {
      display: flex;
      flex-direction: column;
    }

    .section-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 12px 0;
    }

    .section-row + .section-row {
      border-top: 1px solid var(--ox-border);
    }

    .section-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .section-heading {
      color: var(--ox-text);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .section-detail {
      color: var(--ox-text-muted);
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .section-inline-meta {
      color: var(--ox-text-dim);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .section-status {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--ox-well-bg);
      color: var(--ox-text-muted);
      border: 1px solid var(--ox-border);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .section-status[data-tone='running'],
    .section-status[data-tone='done'],
    .section-status[data-tone='approved'] {
      color: var(--agent-running);
      background: var(--ox-primary);
      border-color: rgba(16, 163, 127, 0.2);
    }

    .section-status[data-tone='blocked'] {
      color: var(--agent-blocked);
      background: var(--ox-danger-bg);
      border-color: rgba(220, 38, 38, 0.2);
    }

    .section-status[data-tone='review'] {
      color: var(--agent-review);
      background: var(--ox-warning-bg);
      border-color: rgba(217, 119, 6, 0.2);
    }

    .section-status[data-tone='queued'],
    .section-status[data-tone='idle'] {
      color: var(--ox-text-muted);
    }

    .progress-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
    }

    .progress-value {
      color: var(--ox-text);
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1;
    }

    .progress-context {
      color: var(--ox-text-dim);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: right;
    }

    .progress-bar {
      margin-top: 12px;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--ox-well-bg);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--agent-running), #34d399);
    }

    .progress-note {
      margin-top: 12px;
      color: var(--ox-text-muted);
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .empty-slot {
      padding-top: 12px;
      color: var(--ox-text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 16px;
      border-top: 1px solid var(--ox-border);
    }

    .sync-copy {
      color: var(--ox-text-dim);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ox-text-muted);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
    }

    .footer-link svg {
      width: 14px;
      height: 14px;
    }

    .empty-state {
      padding: 40px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .empty-state__glyph {
      width: 44px;
      height: 44px;
      margin-bottom: 4px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ox-text-muted);
      background: rgba(var(--ox-primary-rgb), 0.06);
      border: 1px solid var(--ox-border);
      position: relative;
    }

    .empty-state__glyph::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.55;
      box-shadow: 0 0 0 6px rgba(var(--ox-primary-rgb), 0.05);
      animation: breathe 2.4s ease-in-out infinite;
    }

    .empty-state strong {
      color: var(--ox-text);
      font-size: 1rem;
      font-weight: 600;
    }

    .empty-state p {
      color: var(--ox-text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      max-width: 28ch;
    }

    .skeleton-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .skeleton-card {
      border-radius: 16px;
      border: 1px solid var(--ox-border);
      background: var(--ox-panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .skeleton-line {
      border-radius: 8px;
      background:
        linear-gradient(
          90deg,
          var(--ox-well-bg) 0%,
          rgba(var(--ox-primary-rgb), 0.14) 50%,
          var(--ox-well-bg) 100%
        );
      background-size: 200% 100%;
      animation: shimmer 1.8s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    @media (max-width: 420px) {
      body {
        padding: 16px 8px 24px;
      }

      .agent-head {
        align-items: flex-start;
      }

      .metric-button {
        min-height: 66px;
        padding-inline: 6px;
      }

      .metric-value {
        font-size: 0.95rem;
      }

      .metric-label {
        letter-spacing: 0.05em;
      }
    }
    .ox-metric-rail {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--ox-border);
      border-bottom: 1px solid var(--ox-border);
    }
    
    .ox-metric-button {
      appearance: none;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      font: inherit;
      margin: 0;
      min-height: 72px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    
    .ox-metric-button + .ox-metric-button::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: var(--ox-border);
    }
    
    .agent-card .ox-metric-button:hover {
      background: rgba(var(--agent-accent-rgb, var(--ox-card-color-rgb)), 0.06);
    }
    .agent-card .ox-metric-button[aria-pressed='true'] {
      background: rgba(var(--agent-accent-rgb, var(--ox-card-color-rgb)), 0.13);
    }
    /* Active-tab indicator — an accent underline that slides in, so the
       rail reads as switchable tabs rather than a static stat strip.
       The bar sits on the rail's bottom edge for a clear tab metaphor. */
    .ox-metric-button::after {
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: -1px;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: rgb(var(--agent-accent-rgb, var(--ox-card-color-rgb)));
      transform: scaleX(0);
      opacity: 0;
      transition:
        transform var(--ox-motion-medium, 240ms cubic-bezier(0.16, 1, 0.3, 1)),
        opacity var(--ox-motion-medium, 240ms cubic-bezier(0.16, 1, 0.3, 1));
      pointer-events: none;
    }
    .agent-card .ox-metric-button[aria-pressed='true']::after {
      transform: scaleX(1);
      opacity: 1;
    }
    .agent-card .ox-metric-button[aria-pressed='true'] .ox-eyebrow {
      color: var(--ox-text);
    }

    .ox-metric-button[data-tone='blocked'] .metric-value {
      color: var(--ox-danger);
    }
    .ox-metric-button[data-tone='review'] .metric-value {
      color: var(--ox-warning);
    }

    .agent-section {
      border-top: 1px solid var(--ox-border);
      overflow: hidden;
    }
    .agent-section:first-child {
      border-top: none;
    }

    .ox-disclosure-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 24px;
      background: transparent;
      border: none;
      color: var(--ox-text);
      cursor: pointer;
      transition: background 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: left;
    }

    .agent-card .ox-disclosure-trigger:hover {
      background: rgba(var(--agent-accent-rgb, var(--ox-card-color-rgb)), 0.08);
    }

    .section-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(var(--ox-primary-rgb), 0.12);
      color: var(--ox-primary);
      margin-left: 8px;
    }
    .section-badge.needs-review {
      background: rgba(251, 191, 36, 0.12);
      color: var(--ox-warning);
    }
    .section-badge.blocked {
      background: rgba(244, 63, 94, 0.12);
      color: var(--ox-danger);
    }

    .disclosure-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--ox-font);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .chevron {
      width: 16px; height: 16px;
      color: var(--ox-text-dim);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .agent-section.is-open .chevron {
      transform: rotate(180deg);
    }

    .ox-disclosure-body {
      max-height: 0;
      opacity: 0;
      transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0 24px;
    }

    .agent-section.is-open .ox-disclosure-body {
      max-height: 800px;
      opacity: 1;
      padding: 0 24px 16px;
    }
    
    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;

            <div class="skeleton-line" style="width:32px;height:32px;border-radius:10px;background:linear-gradient(90deg, var(--ox-border) 25%, rgba(var(--ox-primary-rgb),0.16) 50%, var(--ox-border) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite linear;"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
              <div class="skeleton-line" style="width:42%;height:16px;background:linear-gradient(90deg, var(--ox-border) 25%, rgba(var(--ox-primary-rgb),0.16) 50%, var(--ox-border) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite linear;"></div>
              <div class="skeleton-line" style="width:68%;height:12px;background:linear-gradient(90deg, var(--ox-border) 25%, rgba(var(--ox-primary-rgb),0.16) 50%, var(--ox-border) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite linear;"></div>
            </div>
          </div>
          <div class="skeleton-line" style="width:88px;height:28px;border-radius:999px;background:linear-gradient(90deg, var(--ox-border) 25%, rgba(var(--ox-primary-rgb),0.16) 50%, var(--ox-border) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite linear;"></div>
        </div>
        <div class="skeleton-line" style="width:100%;height:52px;border-radius:12px;background:linear-gradient(90deg, var(--ox-border) 25%, rgba(var(--ox-primary-rgb),0.16) 50%, var(--ox-border) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite linear;"></div>
        <div class="skeleton-line" style="width:100%;height:40px;border-radius:10px;background:linear-gradient(90deg, var(--ox-border) 25%, rgba(var(--ox-primary-rgb),0.16) 50%, var(--ox-border) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite linear;"></div>
      </div>
    </div>
  </main>

  <script>
    (function syncThemeFromUrl() {
      var theme = new URLSearchParams(window.location.search).get('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    })();

    var hasLoadedOnce = false;
    function injectHtml(html) {
      var content = document.getElementById('content');
      var skeleton = content.querySelector('.skeleton-wrapper');
      if (skeleton && !hasLoadedOnce) {
        skeleton.style.opacity = '0';
        setTimeout(function() {
          content.innerHTML = html;
          hasLoadedOnce = true;
          requestAnimationFrame(_sendSize);
        }, 300);
      } else {
        content.innerHTML = html;
        hasLoadedOnce = true;
        requestAnimationFrame(_sendSize);
      }
    }

    function _sendSize() {
      window.OrgXWidgetRuntime.reportSize();
    }

    function escapeHtml(value) {
      if (value == null) return '';
      var div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    function firstString(values) {
      for (var i = 0; i < values.length; i += 1) {
        var value = values[i];
        if (typeof value === 'string' && value.trim()) return value.trim();
      }
      return '';
    }

    function asNumber(value) {
      if (typeof value === 'number' && !Number.isNaN(value)) return value;
      if (typeof value === 'string' && value.trim() !== '' && !Number.isNaN(Number(value))) {
        return Number(value);
      }
      return null;
    }

    function asArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function titleCase(value) {
      return String(value || '')
        .replace(/[-_]+/g, ' ')
        .replace(/\b\w/g, function (char) { return char.toUpperCase(); })
        .trim();
    }

    function normalizeStatus(value) {
      var normalized = String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '_');
      if (!normalized) return 'idle';
      if (['running', 'active', 'executing', 'in_progress', 'working'].indexOf(normalized) !== -1) return 'running';
      // 'stalled' is a first-class read-time derived status — agents whose
      // runs the API flagged as having no heartbeat in 30+ minutes. Keep
      // it distinct from 'blocked' so the resume surface is obvious.
      if (['stalled', 'stale'].indexOf(normalized) !== -1) return 'stalled';
      if (['blocked', 'waiting', 'at_risk'].indexOf(normalized) !== -1) return 'blocked';
      if (['needs_review', 'review', 'in_review'].indexOf(normalized) !== -1) return 'review';
      if (['queued', 'pending', 'not_started', 'todo', 'draft', 'backlog', 'paused'].indexOf(normalized) !== -1) return 'queued';
      if (['done', 'complete', 'completed', 'approved', 'shipped'].indexOf(normalized) !== -1) return 'done';
      return normalized;
    }

    function getStatusTone(status) {
      if (status === 'done') return 'done';
      if (status === 'blocked') return 'blocked';
      if (status === 'review') return 'review';
      if (status === 'stalled') return 'review';
      if (status === 'queued' || status === 'idle') return 'idle';
      return 'running';
    }

    function getStatusLabel(status) {
      if (status === 'blocked') return 'Needs you';
      if (status === 'review') return 'Needs review';
      if (status === 'approved') return 'Approved';
      if (status === 'done') return 'Done';
      if (status === 'queued') return 'Queued';
      if (status === 'idle') return 'Idle';
      if (status === 'stalled') return 'Needs refresh';
      return 'Running';
    }

    /**
     * Agents surfaced as "stalled" by getAgentStatus have a run_id that
     * was auto-closed by the TTL cron (or manually paused). A single
     * Resume button brings them back to running — calls the backing tool
     * via the appropriate host bridge.
     */
    function resumeAgentRun(runId, button) {
      if (!runId || !button) return;
      if (button.getAttribute('data-busy') === '1') return;
      button.setAttribute('data-busy', '1');
      button.disabled = true;
      var originalLabel = button.textContent;
      button.textContent = 'Resuming…';
      var args = { run_id: runId, note: 'Resumed from agent-status widget' };
      var call = window.OrgXWidgetRuntime.callTool('resume_agent_run', args);
      Promise.resolve(call)
        .then(function () {
          button.textContent = 'Resumed ✓';
          button.setAttribute('data-resumed', '1');
        })
        .catch(function (err) {
          button.textContent = 'Retry';
          button.removeAttribute('data-busy');
          button.disabled = false;
          console.warn('[agent-status] resume failed', err);
        });
    }
    window.__orgxResumeAgentRun = resumeAgentRun;

    function collectionKey(item) {
      if (typeof item === 'string') return item.trim();
      if (!item || typeof item !== 'object') return '';
      return firstString([
        item.id,
        item.task_id,
        item.taskId,
        item.entity_id,
        item.entityId,
        item.title,
        item.summary,
        item.name,
        item.description
      ]) || JSON.stringify(item);
    }

    function mergeUniqueItems(left, right) {
      var seen = {};
      return ([]).concat(asArray(left), asArray(right)).filter(function (item) {
        var key = collectionKey(item);
        if (!key || seen[key]) return false;
        seen[key] = true;
        return true;
      });
    }

    var REMOTE_WIDGET_ASSET_BASE = 'https://mcp.useorgx.com/widgets/shared/';
    function resolveWidgetAsset(path){
      return REMOTE_WIDGET_ASSET_BASE + path;
    }

    var ORGX_BASE_URL = 'https://useorgx.com';
    var AGENT_DIRECTORY = {
      pace: { name: 'Pace', role: 'Product', avatarPath: 'product_orchestrator.png', accentRgb: '22, 163, 74' },
      product: { name: 'Pace', role: 'Product', avatarPath: 'product_orchestrator.png', accentRgb: '22, 163, 74' },
      eli: { name: 'Eli', role: 'Engineering', avatarPath: 'engineering_autopilot.png', accentRgb: '6, 182, 212' },
      engineering: { name: 'Eli', role: 'Engineering', avatarPath: 'engineering_autopilot.png', accentRgb: '6, 182, 212' },
      mark: { name: 'Mark', role: 'Marketing', avatarPath: 'launch_captain.png', accentRgb: '249, 115, 22' },
      marketing: { name: 'Mark', role: 'Marketing', avatarPath: 'launch_captain.png', accentRgb: '249, 115, 22' },
      sage: { name: 'Sage', role: 'Sales', avatarPath: 'pipeline_intelligence.png', accentRgb: '168, 85, 247' },
      sales: { name: 'Sage', role: 'Sales', avatarPath: 'pipeline_intelligence.png', accentRgb: '168, 85, 247' },
      orion: { name: 'Orion', role: 'Operations', avatarPath: 'control_tower.png', accentRgb: '245, 158, 11' },
      operations: { name: 'Orion', role: 'Operations', avatarPath: 'control_tower.png', accentRgb: '245, 158, 11' },
      dana: { name: 'Dana', role: 'Design', avatarPath: 'design_codex.png', accentRgb: '236, 72, 153' },
      design: { name: 'Dana', role: 'Design', avatarPath: 'design_codex.png', accentRgb: '236, 72, 153' },
      xandy: { name: 'Xandy', role: 'Orchestrator', avatarPath: 'xandy_orchestrator.png', accentRgb: '20, 184, 166' },
      orchestrator: { name: 'Xandy', role: 'Orchestrator', avatarPath: 'xandy_orchestrator.png', accentRgb: '20, 184, 166' }
    };

    function resolveAgentProfile(agent) {
      var directName = firstString([agent.agent_name, agent.name, agent.title]);
      var directRole = firstString([agent.role, agent.persona, agent.domain, agent.agent_domain]);
      var agentType = firstString([agent.agent_type, agent.type, agent.domain, agent.agent_domain]).toLowerCase();
      var nameKey = directName.toLowerCase();
      var roleKey = directRole.toLowerCase();
      var profile = AGENT_DIRECTORY[nameKey] || AGENT_DIRECTORY[agentType] || AGENT_DIRECTORY[roleKey] || null;
      return {
        name: directName || (profile && profile.name) || 'OrgX Agent',
        role: directRole || (profile && profile.role) || titleCase(agentType) || 'Agent',
        avatarPath: (profile && profile.avatarPath) || null,
        accentRgb: (profile && profile.accentRgb) || '20, 184, 166'
      };
    }
    function renderAvatar(agent) {
      var profile = resolveAgentProfile(agent);
      var fallback = escapeHtml(profile.name.charAt(0).toUpperCase() || '?');
      
      if (profile.avatarPath) {
        var remoteUrl = resolveWidgetAsset(profile.avatarPath);
        
        return '<span style="display:none;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--ox-mono);font-size:0.9rem;font-weight:600;">' + fallback + '</span>' +
               '<img src="' + escapeHtml(remoteUrl) + '" alt="' + escapeHtml(profile.name) + '" loading="eager" decoding="sync" draggable="false" ' +
               'onerror="this.style.display=\'none\'; if (this.previousElementSibling) this.previousElementSibling.style.display=\'flex\';" />';
      }
      return '<span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--ox-mono);font-size:0.9rem;font-weight:600;">' + fallback + '</span>';
    }



    function buildAgentUrl(agentId) {
      return agentId
        ? ORGX_BASE_URL + '/settings/agents?agent=' + encodeURIComponent(agentId)
        : ORGX_BASE_URL + '/settings/agents';
    }

    function normalizeTask(task, index) {
      if (!task) return null;
      if (typeof task === 'string') {
        return { id: 'task-' + index, title: task, detail: '', status: 'queued' };
      }
      if (typeof task !== 'object') return null;
      return {
        id: firstString([task.id, task.task_id, task.taskId, task.entity_id, task.entityId]) || 'task-' + index,
        title: firstString([task.title, task.summary, task.name, task.description]) || 'Task ' + (index + 1),
        detail: firstString([task.detail, task.description]),
        status: normalizeStatus(firstString([task.status, task.state, task.phase]))
      };
    }

    function normalizeArtifact(artifact, index) {
      if (!artifact || typeof artifact !== 'object') return null;
      return {
        id: firstString([artifact.id, artifact.ref]) || 'artifact-' + index,
        title: firstString([artifact.title, artifact.name, artifact.summary]) || 'Artifact ' + (index + 1),
        type: firstString([artifact.type, artifact.kind, artifact.artifact_type]) || 'artifact',
        status: normalizeStatus(firstString([artifact.status, artifact.review_status, artifact.state])) || 'approved',
        detail: firstString([artifact.detail, artifact.description, artifact.summary]),
        url:
          firstString([
            artifact.primary_url,
            artifact.url,
            artifact.review_url,
            artifact.task_url,
            artifact.live_url
          ]) || null
      };
    }

    function normalizeStream(stream, index) {
      if (!stream || typeof stream !== 'object') return null;
      return {
        id: firstString([stream.id, stream.ref]) || 'stream-' + index,
        name: firstString([stream.name, stream.title]) || 'Stream ' + (index + 1),
        progress: Math.max(0, Math.min(100, asNumber(stream.progress || stream.progress_pct || stream.percent) || 0))
      };
    }

    function normalizeAgent(raw, index) {
      if (!raw || typeof raw !== 'object') return null;
      var profile = resolveAgentProfile(raw);
      var allTasks = mergeUniqueItems(
        asArray(raw.current_tasks),
        mergeUniqueItems(asArray(raw.active_tasks), asArray(raw.tasks))
      ).map(normalizeTask).filter(Boolean);
      var completedTasks = mergeUniqueItems(
        mergeUniqueItems(asArray(raw.completed_tasks), asArray(raw.completedTasks)),
        mergeUniqueItems(asArray(raw.recent_completed), asArray(raw.history))
      ).map(normalizeTask).filter(Boolean);
      completedTasks = mergeUniqueItems(
        completedTasks,
        allTasks.filter(function (task) { return task.status === 'done'; })
      );
      var tasks = allTasks.filter(function (task) { return task.status !== 'done'; });
      var artifacts = mergeUniqueItems(
        mergeUniqueItems(asArray(raw.proof_cards), asArray(raw.artifacts)),
        asArray(raw.outputs || raw.session_output)
      )
        .map(normalizeArtifact)
        .filter(Boolean);
      var blockers = asArray(raw.blockers).filter(Boolean);
      var streams = mergeUniqueItems(asArray(raw.streams), asArray(raw.workstreams))
        .map(normalizeStream)
        .filter(Boolean);
      var stateMeta = window.OrgXWidgetState
        ? window.OrgXWidgetState.derive(raw)
        : { state: normalizeStatus(raw.status), observedAt: null };
      var currentTask = firstString([
        raw.current_task,
        raw.current_focus,
        raw.currentTask,
        tasks[0] && tasks[0].title
      ]);
      var status = normalizeStatus(raw.status);
      if (stateMeta.state === 'stale') status = 'stalled';
      else if (stateMeta.state === 'starting') status = 'queued';
      else if (stateMeta.state === 'in_progress') status = 'running';
      else if (stateMeta.state === 'completed' && !tasks.length && !blockers.length) status = 'done';
      if (blockers.length > 0) status = 'blocked';
      else if (artifacts.some(function (artifact) { return artifact.status === 'review'; })) status = 'review';
      if (status === 'done' && !tasks.length) currentTask = 'No active task right now';
      if (status === 'stalled' && !tasks.length) currentTask = 'Last execution needs a refresh';

      var progress = asNumber(raw.progress || raw.progress_pct || raw.percent_complete);
      if (progress == null && (tasks.length > 0 || completedTasks.length > 0)) {
        progress = Math.round((completedTasks.length / (tasks.length + completedTasks.length)) * 100);
      }

      return {
        id: firstString([raw.agent_id, raw.id, raw.agent_name]) || 'agent-' + index,
        name: profile.name,
        role: firstString([raw.role, profile.role]) || 'Agent',
        accentRgb: profile.accentRgb,
        status: status,
        tone: getStatusTone(status),
        statusLabel: getStatusLabel(status),
        currentTask: currentTask || (status === 'idle' || status === 'done' ? 'No active task right now' : stateMeta.state === 'stale' ? 'Last execution needs a refresh' : 'Tracking background execution'),
        currentMeta: firstString([raw.eta, raw.time_remaining]) || '',
        progress: progress,
        blockers: blockers,
        tasks: tasks,
        completedTasks: completedTasks.slice(0, 8),
        artifacts: artifacts,
        streams: streams,
        taskCount: tasks.length || (currentTask && status !== 'idle' && status !== 'done' ? 1 : 0),
        completedCount: completedTasks.length,
        blockedCount: blockers.length || tasks.filter(function (task) { return task.status === 'blocked'; }).length,
        reviewCount: artifacts.filter(function (artifact) { return artifact.status === 'review'; }).length,
        openUrl: firstString([raw.url, raw.agent_url]) || buildAgentUrl(firstString([raw.agent_id, raw.id])),
        // Stalled-run metadata from getAgentStatus (2026-04-21).
        // `status === 'stalled'` triggers the Resume CTA in renderAttention;
        // runId is the agent_runs UUID that resume_agent_run targets.
        runId: firstString([raw.run_id, raw.runId]) || null,
        stalledMinutes: typeof raw.stalled_minutes === 'number'
          ? raw.stalled_minutes
          : (typeof raw.stalledMinutes === 'number' ? raw.stalledMinutes : null),
        lastHeartbeatAt: firstString([raw.last_heartbeat_at, raw.lastHeartbeatAt]) || null,
        observedAt: stateMeta.observedAt,
      };
    }

    function mergeAgentAliases(agents) {
      // Stalled outranks running so an auto-closed run stays visible even
      // if a stale duplicate claims 'running'. Blocked still wins overall.
      var statusWeight = { done: 1, idle: 1, queued: 2, running: 3, stalled: 4, review: 4, blocked: 5 };
      var merged = {};
      agents.forEach(function (agent) {
        var key = (agent.name + '|' + agent.role).toLowerCase();
        var existing = merged[key];
        if (!existing) {
          merged[key] = agent;
          return;
        }
        var keepIncoming = (statusWeight[agent.status] || 0) > (statusWeight[existing.status] || 0);
        merged[key] = {
          id: existing.id || agent.id,
          name: existing.name || agent.name,
          role: existing.role || agent.role,
          status: keepIncoming ? agent.status : existing.status,
          tone: keepIncoming ? agent.tone : existing.tone,
          statusLabel: keepIncoming ? agent.statusLabel : existing.statusLabel,
          currentTask: keepIncoming ? (agent.currentTask || existing.currentTask) : (existing.currentTask || agent.currentTask),
          currentMeta: existing.currentMeta || agent.currentMeta,
          accentRgb: existing.accentRgb || agent.accentRgb,
          progress: Math.max(existing.progress || 0, agent.progress || 0),
          blockers: mergeUniqueItems(existing.blockers, agent.blockers),
          tasks: mergeUniqueItems(existing.tasks, agent.tasks),
          completedTasks: mergeUniqueItems(existing.completedTasks, agent.completedTasks),
          artifacts: mergeUniqueItems(existing.artifacts, agent.artifacts),
          streams: mergeUniqueItems(existing.streams, agent.streams),
          taskCount: Math.max(existing.taskCount || 0, agent.taskCount || 0),
          completedCount: Math.max(existing.completedCount || 0, agent.completedCount || 0),
          blockedCount: Math.max(existing.blockedCount || 0, agent.blockedCount || 0),
          reviewCount: Math.max(existing.reviewCount || 0, agent.reviewCount || 0),
          openUrl: existing.openUrl || agent.openUrl,
          runId: keepIncoming ? (agent.runId || existing.runId) : (existing.runId || agent.runId),
          stalledMinutes: keepIncoming
            ? (agent.stalledMinutes != null ? agent.stalledMinutes : existing.stalledMinutes)
            : (existing.stalledMinutes != null ? existing.stalledMinutes : agent.stalledMinutes),
          lastHeartbeatAt: keepIncoming ? (agent.lastHeartbeatAt || existing.lastHeartbeatAt) : (existing.lastHeartbeatAt || agent.lastHeartbeatAt),
          observedAt: Math.max(existing.observedAt || 0, agent.observedAt || 0) || null,
        };
      });
      return Object.keys(merged).map(function (key) { return merged[key]; });
    }

    function normalizePayload(payload) {
      if (!payload) return { agents: [] };
      var agents = Array.isArray(payload.agents) ? payload.agents : [payload];
      return { agents: mergeAgentAliases(agents.map(normalizeAgent).filter(Boolean)) };
    }

    function getPriority(agent) {
      if (agent.status === 'blocked') return 0;
      // Stalled surfaces next to review — both ask the user for a
      // one-click action (resume / review). Above running because a
      // stalled run is a broken contract the user should see first.
      if (agent.status === 'review') return 1;
      if (agent.status === 'stalled') return 1;
      if (agent.status === 'running') return 2;
      if (agent.status === 'queued') return 3;
      return 4;
    }

    function statusToneForRow(status) {
      if (status === 'blocked') return 'blocked';
      if (status === 'review') return 'review';
      if (status === 'done' || status === 'approved') return 'done';
      if (status === 'running') return 'running';
      if (status === 'queued') return 'queued';
      return 'idle';
    }

    function summarizeOverview(agent) {
      var parts = [];
      if (agent.blockedCount) parts.push(agent.blockedCount + ' blocked');
      if (agent.reviewCount) parts.push(agent.reviewCount + ' review');
      if (agent.taskCount) parts.push(agent.taskCount + ' tasks in flight');
      if (agent.completedCount) parts.push(agent.completedCount + ' completed');
      if (!parts.length) parts.push('No agents need you right now');
      return parts.join(' · ');
    }

    var widgetState = {};
    var currentAgents = [];
    var currentAgentsById = {};

    function setCardSection(cardId, section) {
      if (section === 'overview') {
        widgetState[cardId] = 'overview';
        syncAgentCard(cardId);
        return;
      }
      widgetState[cardId] = widgetState[cardId] === section ? null : section;
      syncAgentCard(cardId);
    }
    function renderAttention(agent) {
      if (agent.status !== 'blocked' && agent.status !== 'review' && agent.status !== 'stalled') return '';
      var isBlocked = agent.status === 'blocked';
      var isStalled = agent.status === 'stalled';
      var tone = isBlocked ? 'blocked' : 'review';

      // Stalled agents surface a Resume button inline — the run was
      // auto-closed by the TTL cron. Clicking Resume calls
      // resume_agent_run to flip the row back to running.
      var body;
      var action;
      var actionHtml;
      if (isStalled) {
        var stalledMin = typeof agent.stalledMinutes === 'number' ? agent.stalledMinutes : null;
        var stalledSummary = stalledMin !== null
          ? 'No heartbeat in ' + formatStalledDuration(stalledMin) + '. Auto-paused.'
          : 'No heartbeat in 30+ min. Auto-paused.';
        body = stalledSummary;
        action = 'Resume';
        actionHtml = '<button type="button" class="attention-action" data-resume-run="' + escapeHtml(agent.runId || '') + '" onclick="window.__orgxResumeAgentRun(this.getAttribute(\'data-resume-run\'), this)" style="border-color: rgba(251, 191, 36, 0.14); cursor: pointer; font: inherit; background: transparent;">Resume</button>';
      } else if (isBlocked) {
        body = 'Blocked: ' + String(agent.blockers[0] || 'A founder-level decision is blocking progress.');
        action = 'Resolve';
      } else {
        body = 'Review: ' + String((agent.artifacts.find(function (artifact) { return artifact.status === 'review'; }) || {}).title || 'An artifact is ready for review.');
        action = 'Review';
      }

      var icon = isBlocked
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
        : isStalled
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>';

      var bgTone = isBlocked ? 'rgba(244, 63, 94, 0.1)' : 'rgba(251, 191, 36, 0.1)';
      var borderTone = isBlocked ? 'rgba(244, 63, 94, 0.14)' : 'rgba(251, 191, 36, 0.14)';
      var textTone = isBlocked ? 'var(--ox-danger)' : 'var(--ox-warning)';

      if (!actionHtml) {
        actionHtml = '<a class="attention-action" href="' + escapeHtml(agent.openUrl) + '" target="_blank" rel="noreferrer" onclick="return openWidgetLink(this.href, event)" style="border-color: ' + borderTone + ';">' + action + '</a>';
      }

      var title = isBlocked ? 'Blocked' : isStalled ? 'Stalled' : 'Needs review';

      return (
        '<div class="agent-attention app-attention-banner" data-tone="' + tone + '" style="background: ' + bgTone + '; border-color: ' + borderTone + '; color: ' + textTone + ';">' +
          '<div style="display: flex; align-items: center; gap: 10px; min-width: 0;">' +
            '<div style="width: 18px; height: 18px; flex-shrink: 0; color: currentColor; opacity: 0.85; display: flex; align-items: center; justify-content: center;">' + icon + '</div>' +
            '<div class="attention-copy">' +
              '<span class="attention-title">' + title + '</span>' +
              '<span class="attention-body">' + escapeHtml(body) + '</span>' +
            '</div>' +
          '</div>' +
          actionHtml +
        '</div>'
      );
    }

    function formatStalledDuration(minutes) {
      if (minutes < 60) return minutes + 'm';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h';
      var days = Math.floor(hours / 24);
      return days + 'd';
    }

    var selectedAgentId = null;
    var showIdleAgents = false;

    function isIdleAgent(agent) {
      // Completed agents stay in the board so their recent proof remains
      // one click away instead of disappearing into the idle drawer.
      return agent.status === 'idle';
    }

    function renderSwitcherRow(agent, selected) {
      var switcherMeta = [
        agent.currentTask,
        agent.completedCount ? agent.completedCount + ' completed' : ''
      ].filter(Boolean).join(' · ');
      return (
        '<button type="button" class="agent-switcher-row focusable" role="tab" data-action="select-agent" data-agent-tab="' + escapeHtml(agent.id) + '" aria-selected="' + String(selected) + '" tabindex="' + (selected ? '0' : '-1') + '" style="--row-accent-rgb:' + escapeHtml(agent.accentRgb) + ';">' +
          '<span class="agent-avatar" aria-hidden="true">' + renderAvatar(agent) + '</span>' +
          '<span class="switcher-copy">' +
            '<span class="switcher-identity"><span class="switcher-name">' + escapeHtml(agent.name) + '</span><span class="switcher-role">' + escapeHtml(agent.role) + '</span></span>' +
            '<span class="switcher-focus">' + escapeHtml(switcherMeta) + (agent.currentMeta ? ' · ' + escapeHtml(agent.currentMeta) : '') + '</span>' +
          '</span>' +
          '<span class="switcher-status" data-tone="' + escapeHtml(agent.tone) + '">' + escapeHtml(agent.statusLabel) + '</span>' +
        '</button>'
      );
    }

    function renderCommandDetailGroup(label, rows) {
      if (!rows.length) return '';
      return (
        '<section class="command-detail-group">' +
          '<div class="command-detail-label">' + escapeHtml(label) + '</div>' +
          rows.map(function (row) {
            return (
              '<div class="command-detail-row">' +
                '<div class="command-detail-title">' + escapeHtml(row.title) + '</div>' +
                '<div class="command-detail-state" data-tone="' + escapeHtml(row.tone) + '">' + escapeHtml(row.state) + '</div>' +
              '</div>'
            );
          }).join('') +
        '</section>'
      );
    }

    function renderCommandDetails(agent, isOpen) {
      var blockerRows = agent.blockers.map(function (blocker) {
        return { title: String(blocker), state: 'Blocked', tone: 'blocked' };
      });
      var taskRows = agent.tasks.map(function (task) {
        return {
          title: task.title,
          state: getStatusLabel(task.status),
          tone: statusToneForRow(task.status)
        };
      });
      var completedRows = agent.completedTasks.map(function (task) {
        return {
          title: task.title,
          state: 'Completed',
          tone: 'done'
        };
      });
      var artifactRows = agent.artifacts.map(function (artifact) {
        return {
          title: artifact.title,
          state: artifact.status === 'review' ? 'Review' : getStatusLabel(artifact.status),
          tone: statusToneForRow(artifact.status)
        };
      });
      var streamRows = agent.streams.map(function (stream) {
        return { title: stream.name, state: stream.progress + '%', tone: 'running' };
      });

      return (
        '<div class="command-details' + (isOpen ? ' is-open' : '') + '" id="agent-work-details" aria-hidden="' + String(!isOpen) + '">' +
          renderCommandDetailGroup('Blockers', blockerRows) +
          renderCommandDetailGroup('Tasks', taskRows) +
          renderCommandDetailGroup('Completed recently', completedRows) +
          renderCommandDetailGroup('Artifacts', artifactRows) +
          renderCommandDetailGroup('Streams', streamRows) +
          (!blockerRows.length && !taskRows.length && !completedRows.length && !artifactRows.length && !streamRows.length
            ? '<div class="quiet-command-state">No additional work details.</div>'
            : '') +
        '</div>'
      );
    }

    function renderCommandPanel(agent) {
      var detailsOpen = widgetState[agent.id] === 'details';
      var detailCount = agent.blockers.length + agent.tasks.length + agent.completedTasks.length + agent.artifacts.length + agent.streams.length;
      var focusMeta = [agent.currentMeta, summarizeOverview(agent), agent.observedAt && window.OrgXWidgetState ? window.OrgXWidgetState.formatAge(agent.observedAt) : 'Sync time unavailable'].filter(Boolean).join(' · ');
      var stateMeta = window.OrgXWidgetState ? window.OrgXWidgetState.derive(agent) : null;
      var stateNote = stateMeta && stateMeta.state !== 'in_progress' && stateMeta.state !== 'completed'
        ? '<div class="command-state-note" data-state="' + escapeHtml(stateMeta.state) + '"><span class="command-state-note__dot"></span><span><strong>' + escapeHtml(stateMeta.label) + '</strong> · ' + escapeHtml(stateMeta.description) + '</span></div>'
        : '';

      return (
        '<section class="agent-command-panel" role="tabpanel" aria-label="' + escapeHtml(agent.name) + ' agent details" style="--agent-accent-rgb:' + escapeHtml(agent.accentRgb) + ';">' +
          renderAttention(agent) +
          '<div class="command-focus-header"><span class="ox-eyebrow">Current focus</span><span class="switcher-status" data-tone="' + escapeHtml(agent.tone) + '">' + escapeHtml(agent.statusLabel) + '</span></div>' +
          '<div class="command-focus-title">' + escapeHtml(agent.currentTask) + '</div>' +
          '<div class="command-meta">' + escapeHtml(focusMeta || 'Available for the next assignment') + '</div>' +
          stateNote +
          '<div class="command-facts" aria-label="Agent work summary">' +
            '<span class="command-fact"><strong>' + escapeHtml(String(agent.taskCount)) + '</strong> active</span>' +
            '<span class="command-fact" data-tone="done"><strong>' + escapeHtml(String(agent.completedCount || 0)) + '</strong> completed</span>' +
            '<span class="command-fact" data-tone="blocked"><strong>' + escapeHtml(String(agent.blockedCount)) + '</strong> blocked</span>' +
            '<span class="command-fact" data-tone="review"><strong>' + escapeHtml(String(agent.artifacts.length)) + '</strong> artifacts</span>' +
            '<span class="command-fact"><strong>' + escapeHtml(agent.progress == null ? '—' : String(agent.progress) + '%') + '</strong> progress</span>' +
          '</div>' +
          '<div class="command-panel-actions">' +
            '<button type="button" class="command-disclosure focusable" data-action="toggle-details" data-agent="' + escapeHtml(agent.id) + '" aria-expanded="' + String(detailsOpen) + '" aria-controls="agent-work-details">Work details <span style="color:var(--ox-text-dim);">' + escapeHtml(String(detailCount)) + '</span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>' +
            '<a class="command-live-link focusable" href="' + escapeHtml(agent.openUrl) + '" target="_blank" rel="noreferrer" onclick="return openWidgetLink(this.href, event)">Open live <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></a>' +
          '</div>' +
          renderCommandDetails(agent, detailsOpen) +
        '</section>'
      );
    }

    function renderCurrentBoard() {
      if (!currentAgents.length) {
        injectHtml(
          '<div class="surface-bar"><div class="surface-label">Agent Status</div><div class="surface-summary">All quiet</div></div>' +
          '<div class="agent-command-shell animate-in"><div class="quiet-command-state"><span><strong style="color:var(--ox-text);font-weight:600;">No agents need you right now.</strong> Everything is available for the next assignment.</span></div></div>'
        );
        return;
      }

      var activeAgents = currentAgents.filter(function (agent) { return !isIdleAgent(agent); });
      var idleAgents = currentAgents.filter(isIdleAgent);
      var selectedAgent = currentAgentsById[selectedAgentId] || null;
      if (!selectedAgent || (isIdleAgent(selectedAgent) && !showIdleAgents)) {
        selectedAgent = activeAgents[0] || null;
        selectedAgentId = selectedAgent ? selectedAgent.id : null;
      }

      var needsAttention = activeAgents.filter(function (agent) {
        return agent.status === 'blocked' || agent.status === 'review' || agent.status === 'stalled';
      }).length;
      var moving = activeAgents.filter(function (agent) {
        return agent.status === 'running' || agent.status === 'queued';
      }).length;
      var completed = activeAgents.filter(function (agent) { return agent.status === 'done'; }).length;
      var summary = needsAttention
        ? needsAttention + ' need' + (needsAttention === 1 ? 's' : '') + ' you' + (moving ? ' · ' + moving + ' active' : '')
          + (completed ? ' · ' + completed + ' completed' : '')
        : moving
        ? moving + ' active' + (completed ? ' · ' + completed + ' completed' : '')
        : completed
        ? completed + ' completed'
        : 'All quiet';

      var selectedAccent = selectedAgent ? selectedAgent.accentRgb : '20, 184, 166';
      var html = '<div class="surface-bar"><div class="surface-label">Agent Status</div><div class="surface-summary">' + escapeHtml(summary) + '</div></div>';
      html += '<div class="agent-command-shell animate-in" style="--selected-agent-rgb:' + escapeHtml(selectedAccent) + ';">';
      if (activeAgents.length) {
        html += '<div class="agent-switcher-list" role="tablist" aria-label="Active agents">';
        activeAgents.forEach(function (agent) {
          html += renderSwitcherRow(agent, selectedAgentId === agent.id);
        });
        if (showIdleAgents) {
          idleAgents.forEach(function (agent) {
            html += renderSwitcherRow(agent, selectedAgentId === agent.id);
          });
        }
        html += '</div>';
      } else if (!showIdleAgents) {
        html += '<div class="quiet-command-state"><span><strong style="color:var(--ox-text);font-weight:600;">No active work.</strong> All agents are available.</span></div>';
      } else {
        html += '<div class="agent-switcher-list" role="tablist" aria-label="Available agents">';
        idleAgents.forEach(function (agent) {
          html += renderSwitcherRow(agent, selectedAgentId === agent.id);
        });
        html += '</div>';
      }

      if (idleAgents.length) {
        html += '<button type="button" class="idle-agent-toggle focusable" data-action="toggle-idle" aria-expanded="' + String(showIdleAgents) + '"><span>' + escapeHtml(String(idleAgents.length)) + ' available agent' + (idleAgents.length === 1 ? '' : 's') + '</span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>';
      }
      if (selectedAgent) html += renderCommandPanel(selectedAgent);
      html += '</div>';
      injectHtml(html);
    }

    function renderBoard(payload) {
      var normalized = normalizePayload(payload);
      currentAgents = normalized.agents.sort(function (left, right) {
        return getPriority(left) - getPriority(right) || left.name.localeCompare(right.name);
      });
      currentAgentsById = {};
      currentAgents.forEach(function (agent) {
        currentAgentsById[agent.id] = agent;
      });
      renderCurrentBoard();
    }

    function focusAgentTab(agentId) {
      Array.prototype.some.call(document.querySelectorAll('[data-agent-tab]'), function (button) {
        if (button.getAttribute('data-agent-tab') !== agentId) return false;
        button.focus();
        return true;
      });
    }

    document.addEventListener('click', function (event) {
      var trigger = event.target && event.target.closest('[data-action]');
      if (!trigger) return;
      var action = trigger.getAttribute('data-action');
      if (action === 'select-agent') {
        selectedAgentId = trigger.getAttribute('data-agent-tab');
        renderCurrentBoard();
        window.setTimeout(function () { focusAgentTab(selectedAgentId); }, 0);
      } else if (action === 'toggle-idle') {
        showIdleAgents = !showIdleAgents;
        renderCurrentBoard();
        window.setTimeout(function () {
          var nextTrigger = document.querySelector('[data-action="toggle-idle"]');
          if (nextTrigger) nextTrigger.focus();
        }, 0);
      } else if (action === 'toggle-details') {
        var agentId = trigger.getAttribute('data-agent');
        widgetState[agentId] = widgetState[agentId] === 'details' ? null : 'details';
        renderCurrentBoard();
        window.setTimeout(function () {
          var nextTrigger = document.querySelector(
            '[data-action="toggle-details"][data-agent="' + CSS.escape(agentId) + '"]'
          );
          if (nextTrigger) nextTrigger.focus();
        }, 0);
      }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
      var current = event.target && event.target.closest('[data-agent-tab]');
      if (!current) return;
      var tabs = Array.prototype.slice.call(document.querySelectorAll('[data-agent-tab]'));
      var index = tabs.indexOf(current);
      if (index < 0 || tabs.length < 2) return;
      event.preventDefault();
      var direction = event.key === 'ArrowDown' ? 1 : -1;
      var next = tabs[(index + direction + tabs.length) % tabs.length];
      selectedAgentId = next.getAttribute('data-agent-tab');
      renderCurrentBoard();
      window.setTimeout(function () { focusAgentTab(selectedAgentId); }, 0);
    });

    var demoParams = new URLSearchParams(window.location.search);
    var isDemo = demoParams.get('demo') === 'true';
    var demoState = demoParams.get('state') || 'populated';
    var demoPayload = isDemo
      ? {
          agents: [
            {
              agent_name: 'Pace',
              role: 'Product',
              status: 'blocked',
              current_task: 'Decide whether to ship self-serve usage pricing before founder onboarding opens',
              progress: 68,
              eta: '~2 days remaining',
              blockers: ['Waiting on pricing approval from founders before the activation test can launch.'],
              tasks: [
                { id: 'pace-1', title: 'Finalize velocity model for launch readiness scoring', status: 'done' },
                { id: 'pace-2', title: 'Audit founder activation loop for drop-off at pricing step', status: 'in_progress' },
                { id: 'pace-3', title: 'Package self-serve pricing recommendation for approval', status: 'blocked' }
              ],
              artifacts: [
                { id: 'pace-a', title: 'Velocity model draft', artifact_type: 'prod.analysis', status: 'approved', summary: 'Baseline launch scoring model accepted by the team.' },
                { id: 'pace-b', title: 'Activation loop audit', artifact_type: 'prod.report', status: 'in_review', summary: 'Recommendations ready for founder review.' }
              ],
              streams: [
                { id: 'pace-s1', name: 'Launch readiness', progress: 78 },
                { id: 'pace-s2', name: 'Founder onboarding', progress: 54 }
              ]
            },
            {
              agent_name: 'Eli',
              role: 'Engineering',
              status: 'running',
              current_task: 'Implement billing event pipeline and reconcile launch telemetry fields',
              progress: 74,
              eta: '~1 day remaining',
              tasks: [
                { id: 'eli-1', title: 'Backfill usage event normalization for Stripe and product analytics', status: 'in_progress' },
                { id: 'eli-2', title: 'Patch MCP launch event audit trail for founder review', status: 'done' }
              ],
              artifacts: [
                { id: 'eli-a', title: 'Billing event mapping', artifact_type: 'eng.spec', status: 'in_review', summary: 'Review needed before the instrumentation ships.' }
              ],
              streams: [
                { id: 'eli-s1', name: 'Billing instrumentation', progress: 82 },
                { id: 'eli-s2', name: 'Telemetry QA', progress: 61 }
              ]
            }
          ]
        }
      : null;

    // The gallery uses the same fixture contract as the live widget so each
    // state can be inspected without pretending a snapshot is fresher than
    // it is. Keep these transitions deterministic and intentionally bounded.
    if (demoPayload && demoState === 'stale') {
      demoPayload.agents[0].status = 'done';
      demoPayload.agents[0].blockers = [];
      demoPayload.agents[0].artifacts = (demoPayload.agents[0].artifacts || []).map(function (artifact) {
        return Object.assign({}, artifact, { status: 'approved' });
      });
      demoPayload.agents[0].tasks = (demoPayload.agents[0].tasks || []).map(function (task) {
        return Object.assign({}, task, { status: 'done' });
      });
      demoPayload.agents[1].last_heartbeat_at = new Date(Date.now() - 8 * 60 * 1000).toISOString();
      demoPayload.agents[1].updated_at = demoPayload.agents[1].last_heartbeat_at;
      demoPayload.agents[1].artifacts = (demoPayload.agents[1].artifacts || []).map(function (artifact) {
        return Object.assign({}, artifact, { status: 'approved' });
      });
    } else if (demoPayload && demoState === 'blocked') {
      demoPayload.agents[1].status = 'blocked';
      demoPayload.agents[1].blockers = ['Waiting on the production rollout approval before the next verification pass can begin.'];
    } else if (demoPayload && demoState === 'resolved') {
      demoPayload.agents.forEach(function (agent) {
        agent.status = 'done';
        agent.blockers = [];
        agent.artifacts = (agent.artifacts || []).map(function (artifact) {
          return Object.assign({}, artifact, { status: 'approved' });
        });
        agent.tasks = (agent.tasks || []).map(function (task) {
          return Object.assign({}, task, { status: 'done' });
        });
        agent.updated_at = new Date().toISOString();
      });
    } else if (demoPayload && demoState === 'progressing') {
      demoPayload.agents[0].status = 'running';
      demoPayload.agents[0].blockers = [];
      demoPayload.agents.forEach(function (agent) {
        agent.artifacts = (agent.artifacts || []).map(function (artifact) {
          return Object.assign({}, artifact, { status: 'approved' });
        });
      });
      demoPayload.agents[0].current_task = 'Validating the next acceptance slice and collecting proof';
      demoPayload.agents.forEach(function (agent) {
        agent.last_heartbeat_at = new Date().toISOString();
        agent.updated_at = agent.last_heartbeat_at;
        agent.run_id = agent.agent_name.toLowerCase() + '-run-live';
      });
    }

    initWidget({
      render: function (payload) {
        renderBoard(payload || demoPayload);
      }
    });
  </script>
</body>
</html>
