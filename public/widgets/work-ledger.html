  <style>
    /*
     * Work Ledger — the get_operator_chronicle result drawn as a receipt card
     * (canvas K1 "receipt at volume", K4 "every way the card can arrive"):
     * one card that carries its window and time, because it stays in the chat
     * after the ledger moves on; the headline; what was produced; which
     * clients wrote to the record and on what evidence; the latest entries.
     * Inline lists never pass three rows; the rest is one link away.
     */
    :root {
      --ox-primary-rgb: 0, 201, 167;
    }

    .wl-page {
      padding: 10px;
    }

    .wl {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      background: var(--ox-panel);
      box-shadow: var(--ox-shadow);
      color: var(--ox-text);
      font-family: var(--ox-font);
    }

    /* The one edge that says how the card arrived: amber needs you, teal
       recorded, mute when there is nothing to judge or the copy is old. */
    .wl::after {
      content: '';
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--wl-edge, var(--ox-edge-teal-rgb)), 0.75), transparent);
    }

    .wl[data-edge='amber'] { --wl-edge: var(--ox-edge-amber-rgb); }
    .wl[data-edge='mute'] { --wl-edge: var(--ox-edge-mute-rgb); }
    .wl[data-edge='red'] { --wl-edge: var(--ox-edge-red-rgb); }
    .wl[data-view='explore'] { max-width: 1100px; margin: 0 auto; }

    .wl-hd {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 14px 18px 0;
      font-size: 12.5px;
      color: var(--ox-text-muted);
    }

    .wl-hd ox-glyph { --ox-glyph-size: 16px; flex: none; }

    .wl-kind {
      flex: none;
      font-size: var(--ox-type-label-size);
      font-weight: 600;
      color: var(--ox-text-2);
    }

    .wl-src {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .wl-src b {
      color: var(--ox-text-2);
      font-weight: 500;
    }

    .wl-bd {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
      padding: 12px 18px 16px;
    }

    .wl-bd > * { min-width: 0; }

    .wl-headline {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }

    .wl-bd ox-attention-line {
      --ox-attention-padding: 0;
      margin: -8px 0 -6px;
    }

    .wl-lbl {
      margin: 0;
      font-size: var(--ox-type-label-size);
      font-weight: 500;
      line-height: 1.3;
      color: var(--ox-text-muted);
    }

    /* Needs you: the one loud line, and it is the way to act. */
    .wl .wl-attn {
      align-self: flex-start;
      margin: -6px 0 -8px;
      color: var(--ox-warning);
      font-size: 13.5px;
    }

    .wl-attn::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px var(--ox-warning-surface);
    }

    .wl .wl-attn::after { background: currentColor; }

    .wl-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* What the window produced, as one quiet line of numbers. */
    .wl-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 2px 0 0;
    }

    .wl-stats div {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .wl-stats dd {
      order: -1;
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .wl-stats dt {
      font-size: 12.5px;
      color: var(--ox-text-muted);
    }

    .wl-rows {
      display: block;
    }

    .wl-more,
    .wl-note {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ox-text-muted);
    }

    .wl-flywheel {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--ox-text-2);
    }

    .wl-next {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0 12px;
      margin: 0;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--ox-text);
    }

    .wl-next b {
      font-weight: 650;
    }

    .wl-next .ox-open { min-height: 36px; }

    /* Loading: the same frame as the arrived card, so nothing moves when it lands. */
    .wl-sk {
      display: block;
      height: 12px;
      border-radius: 4px;
      background: var(--ox-skeleton);
    }

    .wl-sk.h { height: 18px; width: 72%; }

    .wl-strip-sk {
      display: flex;
      gap: 18px;
    }

    .wl-strip-sk .wl-sk { width: 76px; height: 20px; }

    /* "Explore all": the one way from the card into every entry. */
    .wl-explore {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 44px;
      margin: 6px 0 0;
      padding: 0 12px 0 14px;
      border: 1px solid var(--ox-border);
      border-radius: 12px;
      background: var(--ox-surface-subtle);
      font: 600 13px/1.2 var(--ox-font);
      color: var(--ox-text);
      text-align: left;
      cursor: pointer;
    }

    .wl-explore:hover { border-color: var(--ox-border-strong); }
    .wl-explore span { font-weight: 500; color: var(--ox-text-muted); }
    .wl-explore svg { width: 14px; height: 14px; margin-left: auto; flex: none; color: var(--ox-text-muted); transform: rotate(-90deg); }

    .wl button:focus-visible {
      outline: 2px solid var(--ox-focus);
      outline-offset: 2px;
      border-radius: 6px;
    }

    /*
     * Explorer (canvas K2, restacked at phone width per M2): every entry in
     * the window, worst first. Chips filter by proof, the category bar
     * focuses one kind, and verified entries fold into a count per group.
     */
    .kx-back {
      flex: none;
      min-height: 44px;
      margin: -12px -8px -12px auto;
      padding: 0 8px;
      border: 0;
      background: transparent;
      font: 600 12.5px/1 var(--ox-font);
      color: var(--ox-text-2);
      cursor: pointer;
    }

    .kx-top {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px 16px;
    }

    .kx-h {
      flex: 1 1 320px;
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .kx-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .kx-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--ox-border);
      border-radius: 8px;
      background: transparent;
      font: 500 12.5px/1 var(--ox-font);
      color: var(--ox-text-2);
      cursor: pointer;
    }

    .kx-chip b {
      font: 600 12px/1 var(--ox-font);
      font-variant-numeric: tabular-nums;
      color: var(--ox-text);
    }

    .kx-chip[aria-pressed='true'] {
      border-color: var(--ox-border-strong);
      background: var(--ox-hover);
      color: var(--ox-text);
    }

    .sw {
      display: inline-block;
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .s-fail { background: var(--ox-danger); }
    .s-yours { background: var(--ox-warning); }
    .s-met { background: var(--ox-teal); }
    .s-unverified {
      background: repeating-linear-gradient(135deg, rgba(var(--ox-mute-rgb), 0.85) 0 2px, rgba(var(--ox-mute-rgb), 0.25) 2px 4px);
    }
    .s-all { background: var(--ox-text-muted); }

    .kx-cats {
      display: flex;
      gap: 10px;
      min-width: 0;
    }

    .kx-cat {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      min-height: 44px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .kx-cat[data-dim] { opacity: 0.38; }

    .kx-cells {
      display: flex;
      gap: 2px;
      height: 16px;
      min-width: 0;
    }

    .kx-cells i {
      flex: 1 1 0;
      min-width: 3px;
      border-radius: 2px;
    }

    .kx-cat-name {
      overflow: hidden;
      font-size: 12px;
      color: var(--ox-text-2);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .kx-cat[aria-pressed='true'] .kx-cat-name { color: var(--ox-text); font-weight: 600; }

    .kx-cat-n {
      font: 500 11px/1 var(--ox-mono);
      color: var(--ox-text-muted);
      font-variant-numeric: tabular-nums;
    }

    .kx-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .kx-grp-h {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 0 6px;
      border-bottom: 1px solid var(--ox-border);
      font-size: 12px;
      color: var(--ox-text-muted);
    }

    .kx-grp-h b {
      font-size: 13.5px;
      font-weight: 650;
      color: var(--ox-text);
    }

    .kx-grp-h .kx-note { margin-left: auto; }

    .kx-more {
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      font: 500 12px/1 var(--ox-mono);
      color: var(--ox-text-muted);
      text-align: left;
      cursor: pointer;
    }

    .kx-empty {
      margin: 0;
      padding: 10px 0;
      font-size: 13px;
      color: var(--ox-text-muted);
    }

    /* M2: on a phone the category bar restacks into a list, worst first. */
    @media (max-width: 560px) {
      .kx-h { font-size: 18px; }
      .kx-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .kx-chip { flex: none; }
      .kx-cats { flex-direction: column; gap: 0; }
      .kx-cat {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 110px 44px;
        align-items: center;
        gap: 10px;
        flex: none !important;
        padding: 6px 0;
        border-bottom: 1px solid var(--ox-border);
      }
      .kx-cat-name { order: 1; font-size: 13px; color: var(--ox-text); }
      .kx-cells { order: 2; height: 10px; }
      .kx-cat-n { order: 3; text-align: right; }
    }

    @media (max-width: 420px) {
      .wl-page { padding: 6px; }
      .wl-hd { padding: 12px 14px 0; }
      .wl-bd { padding: 10px 14px 14px; }
      .wl::after { left: 14px; right: 14px; }
      .wl-stats { gap: 6px 14px; }
      .wl[data-view='explore'] .wl-src { display: none; }
    }

     * Every row used to print all three — "80 sessions · 0 artifacts · 0
     * decisions" — so the eye had to filter the zeros out of every line to find
     * the one number that meant anything. The demo fixture happened to have all
     * three populated everywhere, which is why this never showed up until real
     * data arrived.
     */
    var countSummary = function (client) {
      // The output first (PRs, artifacts, decisions), sessions last; three at
      // most so the line fits a phone. The ledger has the rest.
      var parts = [];
      if (num(client.pullRequests)) parts.push(count(client.pullRequests, 'PR'));
      if (num(client.artifacts)) parts.push(count(client.artifacts, 'artifact'));
      if (num(client.decisions)) parts.push(count(client.decisions, 'decision'));
      if (num(client.sessions)) parts.push(count(client.sessions, 'session'));
      return parts.slice(0, 3).join(' · ');
    };

    /*
     * Collapse runs of the same entry.
     *
     * A client that reports four times in a window produced four identical
     * "Reporting · codex" rows, which filled the list without saying anything.
     * Identical title and source collapse to one row carrying the count.
     */
    /*
     * Machine titles read as a person would say them: "claude-code session:
     * 5 step(s)" is "Session, 5 steps"; "Reporting · codex" is a progress
     * report (the client is already on the detail line).
     */
    var cleanTitle = function (title) {
      var text = String(title || '').trim();
      var session = /^[\w.-]+ session:\s*(\d+) step\(s\)$/i.exec(text);
      if (session) return 'Session, ' + session[1] + (session[1] === '1' ? ' step' : ' steps');
      if (/^reporting\s*·/i.test(text)) return 'Progress report';
      return text.replace(/\((s|es)\)/g, '$1');
    };

    var collapseEvents = function (list) {
      var out = [];
      list.map(function (event) {
        return Object.assign({}, event, { title: cleanTitle(event.title) });
      }).forEach(function (event) {
        var previous = out[out.length - 1];
        if (
          previous &&
          previous.title === event.title &&
          previous.sourceLabel === event.sourceLabel
        ) {
          previous.repeats += 1;
          return;
        }
        out.push({
          id: event.id,
          kind: event.kind,
          title: event.title,
          sourceLabel: event.sourceLabel,
          occurredAt: event.occurredAt,
          status: event.status,
          proofState: event.proofState,
          url: event.url,
          repeats: 1
        });
      });
      return out;
    };

    // Dates and times in the viewer's locale and zone (shared formatter).
    var shortDate = function (value) {
      return typeof value === 'string' ? window.OrgXTime.day(value) : '';
    };

    // Same day: the time ("5:05 PM" / "17:05"); otherwise the date. The card
    // stays in the chat, so it always says when it was true.
    var shortTime = function (value) {
      if (typeof value !== 'string') return '';
      var date = window.OrgXTime.toDate(value);
      if (!date) return '';
      return new Date().toDateString() === date.toDateString() ? window.OrgXTime.clock(date) : shortDate(value);
    };

    /*
     * The evidence label is a trust tier, not part of the client's name. The
     * server sends three of them — "Verified work", "Activity observed",
     * "Seen earlier" — and the receipt row states it as proof: verified work
     * is met (teal check), anything weaker is unverified (hatched).
     */
    var tierOf = function (label) {
      return /verif/i.test(String(label || '')) ? 'verified' : 'observed';
    };
    var tierWord = function (label) {
      var text = String(label || '');
      if (!text) return '';
      if (/verif/i.test(text)) return 'Verified';
      if (/earlier/i.test(text)) return 'Seen earlier';
      return 'Observed';
    };

    /*
     * The chronicle states each entry's proof (proofState): verified reads
     * met, needs_review is the person's call, recorded has no proof yet, and
     * failed failed. Older payloads without it fall back to the kind: an
     * entry that carries its own record reads met, bare activity unverified.
     */
    var PROOF_STATUS = { verified: 'met', needs_review: 'yours', recorded: 'unverified', failed: 'fail' };
    var STATUS_RANK = { fail: 0, yours: 1, unverified: 2, met: 3 };
    var entryStatus = function (event) {
      var proof = event && PROOF_STATUS[event.proofState];

    };

    /*
     * Entry links: OrgX paths open on useorgx.com. Absolute links must be
     * https on an origin the widget may open (the resource's declared
     * redirect domains); anything else stays a plain row.
     */
    var entryHref = function (event) {
      // Relative OrgX paths resolve on useorgx.com; legacy shapes are rewritten
      // to real app routes; other origins stay plain rows.
      return window.OrgXLinks.normalize(event && event.url);
    };

    var KIND_LABEL = {
      decision: 'Decisions',
      artifact: 'Artifacts',
      pull_request: 'Pull requests',
      run: 'Runs',
      progress: 'Progress',
      receipt: 'Receipts'
    };
    var kindLabel = function (kind) {
      return KIND_LABEL[kind] || 'Activity';
    };

    var humanStatus = function (value) {
      var text = typeof value === 'string' ? value.trim().replace(/_/g, ' ') : '';

    };

    var entryRow = function (event, className) {

    var explore = { filter: null, kind: null, open: {} };

    var exploreButton = function (events) {

    var FILTERS = [

      ['fail', 'Failed', 's-fail'],
      ['yours', 'Needs review', 's-yours'],
      ['unverified', 'No proof yet', 's-unverified'],
      ['met', 'Verified', 's-met'],
      ['all', 'All', 's-all']

    var passes = function (filter, status) {
      if (filter === 'all') return true;

    var worstFirst = function (a, b) {

    var plural = function (n, one, many) {
      return n + ' ' + (n === 1 ? one : many);
    };

    var renderExplorer = function (chronicle) {
      var entries = collapseEvents(asArray(chronicle.continuity && chronicle.continuity.events)).map(function (event) {
        return { event: event, status: entryStatus(event), kind: kindLabel(event.kind) };
      });
      var tally = { fail: 0, yours: 0, unverified: 0, met: 0 };
      entries.forEach(function (entry) { tally[entry.status] += 1; });
      var attention = tally.fail + tally.yours + tally.unverified;
      var filter = explore.filter || (attention ? 'open' : 'all');
      var period = PERIOD_LABEL[chronicle.period] || 'This window';
      var asOf = shortTime(chronicle.generatedAt);

      // Kinds, worst first: the most failures, then reviews, then unproven.
      var kinds = [];
      entries.forEach(function (entry) {
        var group = kinds.filter(function (k) { return k.name === entry.kind; })[0];
        if (!group) { group = { name: entry.kind, items: [], tally: { fail: 0, yours: 0, unverified: 0, met: 0 } }; kinds.push(group); }
        group.items.push(entry);
        group.tally[entry.status] += 1;
      });
      kinds.forEach(function (group) { group.items.sort(worstFirst); });
      kinds.sort(function (a, b) {
        return b.tally.fail - a.tally.fail || b.tally.yours - a.tally.yours || b.tally.unverified - a.tally.unverified || b.items.length - a.items.length;
      });
      if (explore.kind && !kinds.some(function (k) { return k.name === explore.kind; })) explore.kind = null;

      var headline = entries.length
        ? tally.met + ' of ' + entries.length + ' verified.' + (attention
          ? ' ' + [
              tally.fail ? tally.fail + ' failed' : '',
              tally.yours ? plural(tally.yours, 'waits', 'wait') + ' on your review' : '',
              tally.unverified ? tally.unverified + (tally.unverified === 1 ? ' has' : ' have') + ' no proof yet' : ''
            ].filter(Boolean).join(', ') + '.'
          : ' Nothing needs attention.')
        : 'Nothing recorded in this window yet.';

      // Zero-count filters are not drawn; All always is.
      var chips = FILTERS.filter(function (f) {
        var n = f[0] === 'all' ? entries.length : f[0] === 'open' ? attention : tally[f[0]];
        return f[0] === 'all' || n > 0;
      }).map(function (f) {
        var n = f[0] === 'all' ? entries.length : f[0] === 'open' ? attention : tally[f[0]];
        return '<button type="button" class="kx-chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '"><i class="sw ' + f[2] + '"></i>' + f[1] + ' <b>' + n + '</b></button>';
      }).join('');

      var cats = kinds.map(function (group) {
        var on = explore.kind === group.name;
        return '<button type="button" class="kx-cat" data-kind="' + escapeHtml(group.name) + '" aria-pressed="' + on + '"' +
          (explore.kind && !on ? ' data-dim' : '') + ' style="flex:' + group.items.length + ' 1 0"' +
          ' aria-label="' + escapeHtml(group.name + ': ' + group.tally.met + ' of ' + group.items.length + ' verified') + '">' +
          '<span class="kx-cells" aria-hidden="true">' + group.items.map(function (entry) { return '<i class="s-' + entry.status + '"></i>'; }).join('') + '</span>' +
          '<span class="kx-cat-name">' + escapeHtml(group.name) + '</span>' +
          '<span class="kx-cat-n">' + group.tally.met + '/' + group.items.length + '</span></button>';
      }).join('');

      var shown = 0;
      var allMet = [];
      var groups = kinds.filter(function (group) { return !explore.kind || group.name === explore.kind; }).map(function (group) {
        var visible = group.items.filter(function (entry) { return passes(filter, entry.status); });
        var folded = filter === 'open' ? group.items.filter(function (entry) { return entry.status === 'met'; }) : [];

        return '<section class="kx-grp" aria-label="' + escapeHtml(group.name) + '">' +
          '<div class="kx-grp-h"><b>' + escapeHtml(group.name) + '</b><span>' + group.tally.met + ' of ' + group.items.length + ' verified</span>' +
          (group.tally.fail ? '<span class="kx-note">' + plural(group.tally.fail, 'failure', 'failures') + ' here</span>' : '') + '</div>' +
          '<div class="wl-rows" role="list">' + rows.map(function (entry) { return entryRow(entry.event, 'kx-entry'); }).join('') + '</div>' +
          (folded.length
            ? '<button type="button" class="kx-more" data-fold="' + escapeHtml(group.name) + '" aria-expanded="' + open + '">' +
              (open ? 'Hide ' + folded.length + ' verified' : folded.length + ' verified · show') + '</button>'
            : '') +
          '</section>';
      }).join('');

      var edge = refreshFailed ? 'mute' : tally.fail ? 'red' : attention ? 'amber' : 'teal';
      return '<article class="wl ox-surface" data-view="explore" data-edge="' + edge + '" aria-label="Every Work Ledger entry">' +
        '<div class="wl-hd"><ox-glyph kind="receipt"' + (attention && !refreshFailed ? ' tone="amber"' : '') + '></ox-glyph>' +
        '<span class="wl-kind">Work Ledger</span>' +
        '<span class="wl-src"><b>' + escapeHtml(chronicle.workspaceName || 'This workspace') + '</b> · ' + escapeHtml(period) + '</span>' +
        '<button type="button" class="kx-back" data-explore="close">Back to summary</button>' +
        '</div>' +
        '<div class="wl-bd">' +
        '<div class="kx-top"><h1 class="kx-h">' + escapeHtml(headline) + '</h1>' +
        (entries.length ? '<div class="kx-chips" role="group" aria-label="Filter by proof">' + chips + '</div>' : '') + '</div>' +
        (kinds.length > 1 ? '<div class="kx-cats" role="group" aria-label="Focus one kind">' + cats + '</div>' : '') +
        '<div class="kx-list">' + (groups || '<p class="kx-empty">Nothing matches this filter.</p>') +
        (allMet.length ? '<button type="button" class="kx-more" data-filter="all">All ' + escapeHtml(allMet.join(', ')) + ' verified · show all</button>' : '') +
        '</div>' +
        '</div>' +
        (refreshing
          ? '<ox-footer variant="reads" state="refreshing" heading="Refreshing" detail="keeps what you see"></ox-footer>'
          : refreshFailed
          ? '<ox-footer variant="reads" state="failed" heading="Couldn’t refresh" detail="' + escapeHtml(asOf ? 'showing what we had at ' + asOf : 'showing the last copy') + '" action-label="Retry"></ox-footer>'
          : '<ox-footer variant="reads" state="fresh" heading="' + escapeHtml(asOf ? 'As of ' + asOf : 'From this request') + '" detail="' +
            escapeHtml('showing ' + shown + ' of ' + entries.length) + '" action-label="Open Work Ledger ↗"></ox-footer>') +
        '</article>';
    };

    var requestMode = function (mode) {
      var runtime = window.OrgXWidgetRuntime;
      if (!runtime || !runtime.requestDisplayMode) return;

      Promise.resolve().then(function () { return runtime.requestDisplayMode(mode); }).catch(function () {});
    };

    var setView = function (next) {
      if (view === next) return;
      view = next;
      if (next === 'explore') explore = { filter: null, kind: null, open: {} };
      requestMode(next === 'explore' ? 'fullscreen' : 'inline');
      render(lastPayload);
      var focus = document.querySelector(next === 'explore' ? '.kx-back' : '.wl-explore');
      if (focus && focus.focus) focus.focus();
    };

    // Bound to this widget's own root, so a remount never answers twice.
    document.getElementById('content').addEventListener('click', function (event) {
      var target = event.target && event.target.closest ? event.target.closest('button') : null;
      if (!target) return;
      if (target.hasAttribute('data-url')) {
        openLink(window.OrgXLinks.normalize(target.getAttribute('data-url')));
        return;
      }
      var toggle = target.getAttribute('data-explore');
      if (toggle) {
        setView(toggle === 'open' ? 'explore' : 'summary');
        return;
      }
      if (view !== 'explore') return;
      var filter = target.getAttribute('data-filter');
      var kind = target.getAttribute('data-kind');
      var fold = target.getAttribute('data-fold');
      if (filter) explore.filter = filter;
      else if (kind) explore.kind = explore.kind === kind ? null : kind;
      else if (fold) explore.open[fold] = !explore.open[fold];
      else return;
      var key = filter ? '[data-filter="' + filter + '"]' : kind ? '[data-kind="' + kind + '"]' : '[data-fold="' + fold + '"]';

      var again = document.querySelector('.wl ' + key);
      if (again && again.focus) again.focus();
    });

    var footerFor = function (chronicle, period) {
      var asOf = shortTime(chronicle.generatedAt);
      if (refreshing) {
        return '<ox-footer variant="reads" state="refreshing" heading="Refreshing" detail="keeps what you see"></ox-footer>';
      }
      if (refreshFailed) {
        return '<ox-footer variant="reads" state="failed" heading="Couldn’t refresh" detail="' +
          escapeHtml(asOf ? 'showing what we had at ' + asOf : 'showing the last copy') + '" action-label="Retry"></ox-footer>';
      }
      var at = window.OrgXTime.toDate(chronicle.generatedAt);
      return '<ox-footer variant="reads" state="fresh" heading="' +
        escapeHtml(at ? 'Updated ' + window.OrgXTime.relative(at, { inline: true }) : 'From this request') + '" detail="' +
        // A week or more back the heading already names the date; add the clock.
        escapeHtml(at ? (/ago|now|day/i.test(window.OrgXTime.relative(at)) ? window.OrgXTime.when(at) : window.OrgXTime.clock(at)) : period) +
        '" action-label="Open Work Ledger ↗"></ox-footer>';
    };

    var render = function (payload) {
      var content = document.getElementById('content');
      if (!payload) {
        if (state === 'loading' || !state) return;
      }
      lastPayload = payload;
      if (view === 'explore' && payload && payload.chronicle && typeof payload.chronicle === 'object') {
        content.innerHTML = renderExplorer(payload.chronicle);
        return;
      }
      var chronicle = payload && payload.chronicle && typeof payload.chronicle === 'object'
        ? payload.chronicle
        : null;
      if (!chronicle) {
        content.innerHTML =
          '<article class="wl ox-surface" data-edge="mute" aria-label="OrgX Work Ledger">' +
          '<div class="wl-hd"><ox-glyph kind="receipt"></ox-glyph><span class="wl-kind">Work Ledger</span></div>' +
          '<div class="wl-bd"><h1 class="wl-headline">Nothing recorded yet.</h1>' +
          '<p class="wl-note">Work lands here when a connected client, such as Claude Code, Codex or Cursor, records a session, receipt, decision or artifact.</p></div>' +
          '<ox-footer variant="reads" state="stale" heading="No entries yet" detail="" action-label="Open Work Ledger ↗"></ox-footer>' +
          '</article>';
        return;
      }
      var metrics = chronicle.metrics || {};
      var continuity = chronicle.continuity || {};
      var clients = asArray(continuity.clients).filter(function (client) {
        return num(client.sessions) + num(client.artifacts) + num(client.decisions) + num(client.pullRequests) > 0;
      });
      var events = collapseEvents(asArray(continuity.events));
      var flywheel = asArray(chronicle.flywheel && chronicle.flywheel.summary).filter(function (line) {
        return typeof line === 'string' && line.trim();
      });
      var narrative = chronicle.reportingNarrative || payload.reportingNarrative || {};
      var nextAction = typeof narrative.nextAction === 'string' ? narrative.nextAction.trim() : '';
      var pending = num(metrics.pendingDecisions);
      var needsYou = pending > 0 || chronicle.attentionState === 'needs_you';
      var period = PERIOD_LABEL[chronicle.period] || 'This window';
      var asOf = shortTime(chronicle.generatedAt);
      // Only the numbers that are there, each in its own words ("1 decision").
      var stats = [
        [num(metrics.receiptsProduced), 'receipt', 'receipts'],
        [num(metrics.decisionsResolved), 'decision made', 'decisions made'],
        [num(metrics.artifactsProduced), 'artifact', 'artifacts'],
        [num(metrics.prReceipts), 'pull request', 'pull requests']
      ].filter(function (stat) { return stat[0] > 0; }).map(function (stat) {
        return [stat[0] === 1 ? stat[1] : stat[2], stat[0].toLocaleString(window.OrgXTime.locale)];
      });
      if (num(metrics.valueCreatedUsd) > 0) {
        stats.push(['in value', '$' + Math.round(num(metrics.valueCreatedUsd)).toLocaleString(window.OrgXTime.locale)]);

      }).map(function (line) {
        return line.replace(/^Ledger coverage:\s*/i, 'Clients reporting: ').replace(/^Decision-model spend:\s*/i, 'Spent deciding: ');
      });

      var edge = refreshFailed ? 'mute' : needsYou ? 'amber' : 'teal';

      content.innerHTML =
        '<article class="wl ox-surface" data-edge="' + edge + '" aria-label="OrgX Work Ledger">' +
        '<div class="wl-hd"><ox-glyph kind="receipt"' + (needsYou && !refreshFailed ? ' tone="amber"' : '') + '></ox-glyph>' +
        '<span class="wl-kind">Work Ledger</span>' +
        '<span class="wl-src"><b>' + escapeHtml(chronicle.workspaceName || 'This workspace') + '</b></span>' +
        '</div>' +
        '<div class="wl-bd">' +
        '<h1 class="wl-headline">' + escapeHtml(chronicle.headline || payload.headline || 'The record of agent work') + '</h1>' +
        (pending > 0
          ? '<button type="button" class="ox-open wl-attn" data-url="' + escapeHtml(window.OrgXLinks.decisions()) + '">' +
            (pending === 1 ? '1 decision waits on you' : pending + ' decisions wait on you') + '</button>'
          : '') +
        // The headline is a standing backlog; these numbers are the window.
        (stats.length ? '<div class="wl-section"><p class="wl-lbl">Produced ' + escapeHtml(phrase) + '</p>' : '<div hidden>') +
        '<dl class="wl-stats">' +
        stats.map(function (stat) {
          return '<div><dt>' + escapeHtml(stat[0]) + '</dt><dd>' + escapeHtml(stat[1]) + '</dd></div>';
        }).join('') +
        '</dl></div>' +
        (clients.length
          ? '<div class="wl-section"><p class="wl-lbl">By client</p><div class="wl-rows" role="list">' +
            clients.slice(0, INLINE_ROWS).map(function (client) {

              return row({

        (events.length
          ? '<div class="wl-section"><p class="wl-lbl">Latest entries</p><div class="wl-rows" role="list">' +
            events.slice(0, INLINE_ROWS).map(function (event) { return entryRow(event, 'wl-entry'); }).join('') +
            '</div>' + (events.length > INLINE_ROWS ? exploreButton(events) : '') + '</div>'
          : '') +
        (flywheel.length
          ? '<div class="wl-section"><p class="wl-lbl">Also ' + escapeHtml(phrase) + '</p><ul class="wl-flywheel">' +
            flywheel.map(function (line) { return '<li>' + escapeHtml(line) + '</li>'; }).join('') +
            '</ul></div>'
          : '') +
        (nextAction
          ? '<p class="wl-next"><span><b>Next:</b> ' + escapeHtml(nextAction) + '</span>' +
            (nextUrl ? '<button type="button" class="ox-open" data-url="' + escapeHtml(nextUrl) + '">Open Decisions</button>' : '') + '</p>'
          : '') +
        '</div>' +
        footerFor(chronicle, period) +
        '</article>';
    };

    /*
     * Retry is a real read: it asks for the same window again and keeps the
     * last copy on screen until the answer lands. Nothing here guesses.
     */
    var refresh = function () {
      if (refreshing || !lastPayload) return;
      var chronicle = lastPayload.chronicle;
      var period = chronicle && chronicle.period ? chronicle.period : 'week';
      refreshing = true;
      render(lastPayload);
      Promise.resolve()
        .then(function () { return callTool('get_operator_chronicle', { period: period }); })
        .then(function (result) {
          var next = window.OrgXWidgetRuntime.extractStructuredWidgetData(result, true);
          if (!next || !next.chronicle) throw new Error('No ledger in the response.');
          refreshFailed = false;
          refreshing = false;
          render(next);
        })
        .catch(function () {
          refreshFailed = true;
          refreshing = false;
          render(lastPayload);
        });
    };

    // Footer: "Open Work Ledger ↗" opens the ledger; "Retry" re-reads it.
    document.addEventListener('ox-action', function (event) {
      var footer = event.target;
      if (footer && footer.getAttribute && footer.getAttribute('state') === 'failed') refresh();
      else openLink(LEDGER_URL);
    });
    document.addEventListener('ox-open', function (event) {
      event.preventDefault();
      openLink(event.detail && event.detail.href);
    });

    if (state === 'loading') {
      // Keep the skeleton.
    } else if (data) {
      render(data);
    } else {
      initWidget({
        live: { anchor: '#content', widget: 'work-ledger', emptyLabel: 'No agents running right now' },
        render: render,
      });
    }
  </script>
</body>
</html>
