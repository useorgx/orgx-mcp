<!DOCTYPE html>
<html lang="en" data-widget-mode="escalation" data-accent="lime">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifact Review — OrgX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2302040a'/%3E%3Cpath d='M20 18h18l8 8v22H20z' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M38 18v8h8' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <script src="shared/kit/ox-elements.js"></script>
  <script src="shared/agent-identity.js"></script>

  <style>
    /* Escalation mode. Canvas R2 (review final), K1/K4 (receipts) and Q5 supply the shape.
       Primaries are the kit's action lime; amber stays on the needs-you edge, glyph and chip. */
    :root { --ox-primary-rgb: 191, 255, 0; }

    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 18px;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: var(--ox-font);
      -webkit-font-smoothing: antialiased;
    }
    .widget-shell-card { max-width: 680px; margin: 0 auto; position: relative; }

    .wcard {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      --edge-rgb: 100, 116, 139;
    }
    .wcard::after {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), .7), transparent);
      pointer-events: none;
    }
    .wcard[data-edge="amber"] { --edge-rgb: 251, 191, 36; }
    .wcard[data-edge="teal"] { --edge-rgb: 0, 201, 167; }
    .wcard[data-edge="red"] { --edge-rgb: 244, 63, 94; }
    .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; min-width: 0; }
    .hd > ox-glyph { --ox-glyph-size: 18px; flex: none; }
    .kind {
      font-size: 11px; font-weight: 600; line-height: 1;
      letter-spacing: .04em; text-transform: uppercase;
      color: var(--ox-text-muted); white-space: nowrap;
    }
    .src { min-width: 0; font-size: 12.5px; color: var(--ox-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .src b { color: var(--ox-text-2); font-weight: 600; }
    .sp { flex: 1; }
    .who2 { display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 12.5px; color: var(--ox-text-muted); white-space: nowrap; }
    .who2 b { color: var(--ox-text-2); font-weight: 600; }
    .hd-link {
      display: inline-flex; align-items: center; gap: 5px; flex: none;
      min-height: 44px; margin: -12px 0; padding: 0 6px;
      color: var(--ox-text-2); font-size: 12.5px; font-weight: 650; text-decoration: none; white-space: nowrap;
    }
    .hd-link:hover { color: var(--ox-text); }
    .bd { padding: 10px 18px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .meta { font-size: 11.5px; line-height: 1.35; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }

    /* Q5 / K1: the verdict first, the bar under it, the proof as rows. */
    .review-desk { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .review-control { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .review-status { display: flex; align-items: center; gap: 10px; min-height: 22px; flex-wrap: wrap; }
    .review-question {
      margin: 0; color: var(--ox-text);
      font-size: 20px; font-weight: 700; line-height: 1.2; letter-spacing: -.025em;
      text-wrap: balance;
    }
    .review-summary, .review-consequence { margin: 0; color: var(--ox-text-muted); font-size: 13px; line-height: 1.5; text-wrap: pretty; }
    .review-summary { color: var(--ox-text-2); }

    .quality-gauge { --quality-signal: var(--ox-text-muted); display: grid; gap: 6px; padding-top: 4px; }
    .quality-gauge[data-quality-state="cleared"] { --quality-signal: var(--ox-teal); }
    .quality-gauge[data-quality-state="held"],
    .quality-gauge[data-quality-state="stale"] { --quality-signal: var(--ox-warning); }
    .quality-gauge[data-quality-state="error"] { --quality-signal: var(--ox-danger); }
    .quality-gauge[data-quality-state="pending"] { --quality-signal: var(--ox-text-2); }
    .quality-gauge__track { position: relative; height: 8px; border-radius: 999px; background: var(--ox-hover, rgba(127, 127, 127, .12)); }
    .quality-gauge__fill { position: absolute; inset: 0 auto 0 0; min-width: 2px; border-radius: inherit; background: var(--quality-signal); }
    .quality-gauge__threshold,
    .quality-gauge__historical { position: absolute; z-index: 2; top: -4px; width: 2px; height: 16px; border-radius: 2px; }
    .quality-gauge__threshold { background: var(--ox-text); }
    .quality-gauge__historical {
      z-index: 1; width: 1px;
      background: repeating-linear-gradient(to bottom, var(--ox-text-muted) 0 3px, transparent 3px 5px);
    }
    .quality-gauge__legend {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      color: var(--ox-text-muted); font: 500 11.5px/1.3 var(--ox-mono); font-variant-numeric: tabular-nums;
    }
    .quality-gauge__legend span:first-child { color: var(--quality-signal); }
    .quality-gauge__profile { overflow: hidden; color: var(--ox-text-muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }

    /* K1: criteria as receipt rows, failures first. */
    .receipts { display: flex; flex-direction: column; }
    .receipts__more { margin: 6px 0 0; font-size: 12.5px; color: var(--ox-text-muted); }

    .quality-anatomy { border-block: 1px solid var(--ox-border); }
    .quality-anatomy > summary {
      display: grid; grid-template-columns: minmax(0, 1fr) 18px; align-items: center; gap: 8px;
      min-height: 48px; padding-block: 9px; color: var(--ox-text); cursor: pointer; list-style: none;
    }
    .quality-anatomy > summary::-webkit-details-marker { display: none; }
    .quality-anatomy__title { display: inline-flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 13px; font-weight: 650; line-height: 1.25; }
    .quality-anatomy__freshness { color: var(--ox-warning); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    .quality-anatomy__flow { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); min-width: 0; }
    .quality-anatomy__flow-step { display: flex; gap: 6px; align-items: baseline; min-width: 0; color: var(--ox-text-muted); font-size: 11.5px; }
    .quality-anatomy__flow-step b { color: var(--ox-text); font: 600 12px/1 var(--ox-mono); }
    .quality-anatomy__chevron { color: var(--ox-text-muted); transition: transform 150ms var(--ox-ease, ease); }
    .quality-anatomy[open] .quality-anatomy__chevron { transform: rotate(180deg); }
    .quality-anatomy__equation {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-block: 10px;
      border-top: 1px solid var(--ox-border); color: var(--ox-text-muted); font: 500 11.5px/1.35 var(--ox-mono);
    }
    .quality-anatomy__equation span { position: relative; min-width: 0; padding-inline-end: 10px; overflow-wrap: anywhere; }
    .quality-anatomy__equation span + span::before { content: "\2192"; position: absolute; inset-inline-start: -11px; color: var(--ox-text-muted); }
    .quality-anatomy__calculation {
      padding: 9px 0; border-top: 1px solid var(--ox-border); color: var(--ox-text);
      font: 600 12px/1.45 var(--ox-mono); overflow-wrap: anywhere; font-variant-numeric: tabular-nums;
    }
    .quality-anatomy__calculation span { margin-inline-end: 8px; color: var(--ox-text-muted); font-family: var(--ox-font); font-weight: 500; }
    .quality-anatomy__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--ox-border); }
    .quality-anatomy__stage { min-width: 0; padding: 11px 10px 12px 0; }
    .quality-anatomy__stage:nth-child(even) { border-inline-start: 1px solid var(--ox-border); padding-inline-start: 12px; }
    .quality-anatomy__stage:nth-child(n + 3) { border-top: 1px solid var(--ox-border); }
    .quality-anatomy__stage-label { color: var(--ox-text-muted); font: 600 10.5px/1.2 var(--ox-mono); letter-spacing: .1em; text-transform: uppercase; }
    .quality-anatomy__stage-value { margin-top: 6px; color: var(--ox-text); font-size: 13px; font-weight: 650; line-height: 1.35; }
    .quality-anatomy__stage-detail {
      display: -webkit-box; margin-top: 3px; overflow: hidden; color: var(--ox-text-muted);
      font-size: 12px; line-height: 1.4; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    }
    .quality-anatomy__note { margin: 0; padding: 10px 0 11px; border-top: 1px solid var(--ox-border); color: var(--ox-text-muted); font-size: 12px; line-height: 1.45; }

    /* Q4: the artifact itself, read in one well with its tabs above. */
    .review-evidence { display: flex; flex-direction: column; min-width: 0; }
    .viewer-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ox-border); overflow-x: auto; scrollbar-width: none; }
    .viewer-tab {
      min-height: 44px; padding: 0 12px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent;
      background: none; color: var(--ox-text-muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .viewer-tab[aria-selected="true"] { color: var(--ox-text); border-bottom-color: var(--ox-text); }
    .viewer-tab:hover { color: var(--ox-text); }
    .viewer-panel { padding-top: 12px; min-width: 0; }
    .artifact-preview__body {
      background: var(--ox-well-bg); border-radius: 12px; padding: 14px 16px;
      max-height: 240px; overflow: hidden; position: relative;
      color: var(--ox-text-2); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere;
      transition: max-height 220ms var(--ox-ease, ease);
    }
    .artifact-preview.is-expanded .artifact-preview__body { max-height: 640px; overflow: auto; }
    .artifact-preview__body p { margin: 0 0 10px; }
    .artifact-preview__body p:last-child { margin-bottom: 0; }
    .artifact-preview__body img, .artifact-preview__body video { display: block; max-width: 100%; max-height: 220px; margin: 0 auto; border-radius: 8px; }
    .artifact-preview.is-expanded .artifact-preview__body img,
    .artifact-preview.is-expanded .artifact-preview__body video { max-height: 600px; }
    .artifact-preview__body pre { margin: 0; font: 12px/1.55 var(--ox-mono); white-space: pre-wrap; color: var(--ox-text); }
    .diff-preview span { display: block; }
    .diff-preview .is-add { color: var(--ox-teal); }
    .diff-preview .is-remove { color: var(--ox-danger); }
    .structured-preview { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; }
    .structured-preview dt { color: var(--ox-text-muted); text-transform: capitalize; }
    .structured-preview dd { margin: 0; color: var(--ox-text); }
    .artifact-preview__placeholder { display: flex; align-items: center; gap: 12px; color: var(--ox-text-muted); }
    .preview-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px; }
    .preview-toggle {
      min-height: 44px; padding: 0; border: 0; background: none;
      color: var(--ox-text-2); font-family: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
    }
    .evidence-readout { display: flex; flex-direction: column; gap: 10px; }
    .evidence-verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .evidence-verdict__label { font-size: 13.5px; font-weight: 650; color: var(--ox-text); }
    .evidence-verdict__score { font: 500 12px/1 var(--ox-mono); color: var(--ox-text-muted); }
    .evidence-verdict__detail { flex-basis: 100%; margin: 0; font-size: 13px; line-height: 1.5; color: var(--ox-text-muted); }
    .evidence-meter { position: relative; height: 6px; border-radius: 999px; background: var(--ox-hover, rgba(127, 127, 127, .12)); }
    .evidence-meter__fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--ox-text-muted); }
    .evidence-meter__threshold { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ox-text); }
    .evidence-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; }
    .evidence-facts dt { color: var(--ox-text-muted); }
    .evidence-facts dd { margin: 0; color: var(--ox-text); overflow-wrap: anywhere; }
    .evidence-facts a { color: var(--ox-text); }
    .version-history { display: flex; flex-direction: column; }
    .version-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 40px; border-top: 1px solid var(--ox-border); font-size: 13px; color: var(--ox-text-2); }
    .version-row:first-child { border-top: 0; }
    .version-row__number { font: 600 12px/1 var(--ox-mono); color: var(--ox-text); }
    .version-row__state { font-size: 12px; color: var(--ox-text-muted); }

    /* A held approval reads as one line, not a banner. */
    .verification-block { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); }
    .verification-block strong { color: var(--ox-warning); font-weight: 650; margin-right: 6px; }
    .decision-row { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.45; }
    .decision-row strong { color: var(--ox-text); font-weight: 650; }
    .decision-row span { color: var(--ox-text-muted); }

    .composer { display: flex; flex-direction: column; gap: 8px; }
    .composer label { font-size: 13px; font-weight: 650; color: var(--ox-text); }
    .composer textarea {
      width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--ox-border-strong); background: var(--ox-panel);
      color: var(--ox-text); font-family: inherit; font-size: 14px; line-height: 1.5;
    }
    .composer textarea:focus { outline: 2px solid var(--ox-focus); outline-offset: 1px; }
    .review-feedback { min-height: 0; font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); }
    .review-feedback:empty { display: none; }
    .review-feedback[data-tone="error"] { color: var(--ox-danger); }

    /* Footer controls live in the kit footer's slots; they match its buttons. */
    .ft-btn {
      position: relative; overflow: hidden;
      min-height: 44px; margin: -4px 0; padding: 0 12px; border-radius: 9px; border: 1px solid transparent;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      background: none; color: var(--ox-text-2);
      font-family: inherit; font-size: 12.5px; font-weight: 650; line-height: 1; cursor: pointer;
      transition: background .16s;
    }
    .ft-btn::after { content: ""; position: absolute; inset: -4px -2px; }
    .ft-btn--text:hover:not(:disabled) { background: var(--ox-hover); color: var(--ox-text); }
    .ft-btn--primary {
      background: var(--ox-action); color: var(--ox-action-fg); border-color: var(--ox-action-border);
      box-shadow: inset 0 1px rgba(255, 255, 255, .27);
    }
    .ft-btn:disabled { cursor: default; opacity: .55; }
    .ft-btn[aria-busy="true"] { opacity: .85; }
    .ft-btn__label { position: relative; }
    .ft-btn svg { width: 12px; height: 12px; position: relative; }

    /* The decision leaves the surface before the receipt replaces it. */
    .stage.is-resolving { animation: review-exit 220ms var(--ox-ease, ease) forwards; }
    @keyframes review-exit { to { opacity: 0; transform: translateY(-4px); } }

    .sk { display: block; height: 10px; border-radius: 4px; background: var(--ox-skeleton, rgba(127, 127, 127, .12)); }
    .empty-copy { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ox-text-muted); }

    @media (max-width: 760px) {
      .who2 b { display: none; }
    }
    @media (max-width: 520px) {
      .hd { flex-wrap: wrap; row-gap: 4px; padding: 12px 14px 0; }
      .hd .src { flex-basis: calc(100% - 28px); order: 2; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .bd { padding: 10px 14px 14px; }
      .review-question { font-size: 18px; }
      .quality-anatomy__flow { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 4px; }
      .quality-anatomy__equation { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 6px; }
      .quality-anatomy__grid { grid-template-columns: 1fr; }
      .quality-anatomy__stage:nth-child(even) { border-inline-start: 0; padding-inline-start: 0; }
      .quality-anatomy__stage:nth-child(n + 2) { border-top: 1px solid var(--ox-border); }
      .hd-link span { display: none; }
      /* Icon only: a 44px square hit area whose margins keep the 24px footprint. */
      .hd-link { min-width: 44px; justify-content: center; margin-inline: -10px; }
    }
    @media (max-width: 420px) {
      .ft-btn { padding: 0 8px; gap: 4px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage.is-resolving { animation: none; }
      .artifact-preview__body, .quality-anatomy__chevron { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
  <div class="widget-shell-card">
    <div class="stage" data-stage>
      <article class="wcard ox-surface" aria-busy="true" aria-label="Loading artifact review">
        <div class="hd"><span class="sk" style="width:44%"></span></div>
        <div class="bd">
          <span class="sk" style="width:80%;height:22px"></span>
          <span class="sk" style="width:100%;height:8px"></span>
          <span class="sk" style="width:100%;height:132px;border-radius:12px"></span>
        </div>
        <ox-footer variant="reads" state="loading"></ox-footer>
      </article>
    </div>
  </div>

  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/live-machine.js"></script>
  <script src="shared/live-store.js"></script>
  <script src="shared/live-panel.js"></script>
  <script>
    (function () {
      'use strict';

      const ALLOWED_ARTIFACT_MEDIA_ORIGINS = [
        'https://mcp.useorgx.com',
        'https://cdn.useorgx.com',
      ];
      const ALLOWED_ARTIFACT_LINK_ORIGINS = [
        'https://mcp.useorgx.com',
        'https://useorgx.com',
        'https://www.useorgx.com',
        'https://github.com',
      ];

      // Previews read avatars from the same origin; hosts use the published renders.
      if (window.OrgXElements && window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
        try {
          window.OrgXElements.avatarConfig.baseUrl = new URL('shared/avatars', window.location.href).toString();
        } catch (_) { /* keep the default */ }
      }

      // Focus rings follow the keyboard (widget-theme.css keys on data-ox-input). This widget
      // doesn't load interaction-kit.js, which records it for the others.
      (function trackInputModality(doc) {
        if (!doc || doc.__oxInput) return;
        doc.__oxInput = true;
        const set = function (mode) { if (doc.documentElement.getAttribute('data-ox-input') !== mode) doc.documentElement.setAttribute('data-ox-input', mode); };
        doc.addEventListener('pointerdown', function () { set('pointer'); }, true);
        doc.addEventListener('keydown', function (event) { if (!event.metaKey && !event.ctrlKey && !event.altKey) set('keyboard'); }, true);
      })(document);

      // ─── SDK shim ────────────────────────────────────────────────
      // Blocker artifacts can carry raw codes ("Model call stopped: model_budget_exhausted").
      // Known codes read as words; an unknown snake_case code becomes plain words. Code, diffs
      // and structured payloads are shown as they are.
      const CODE_COPY = {
        model_budget_exhausted: 'the model budget ran out',
        budget_exhausted: 'the budget ran out',
        budget_exceeded: 'it went over the spend cap',
        max_cost_exceeded: 'it went over the spend cap',
        spend_cap_exceeded: 'it went over the spend cap',
        rate_limited: 'the provider rate limit',
        provider_rate_limited: 'the provider rate limit',
        provider_unavailable: 'the model provider was unavailable',
        model_unavailable: 'the model was unavailable',
        context_length_exceeded: 'the input was too long for the model',
        timed_out: 'it timed out',
        run_timeout: 'it timed out',
        heartbeat_lost: 'it stopped reporting',
        no_heartbeat: 'it stopped reporting',
        guardrail_blocked: 'a guardrail stopped it',
        policy_blocked: 'a policy stopped it',
        authentication_required: 'it needs you to sign in again',
        tool_unavailable: 'a tool it needed was unavailable',
      };
      function humanizeCodes(text) {
        return String(text == null ? '' : text).replace(/(^|[^\w./:#=?&@-])([a-z][a-z0-9]*(?:_[a-z0-9]+)+)(?![\w/=@-]|\.\w)/g, function (all, lead, code) {
          return lead + (CODE_COPY[code] || code.replace(/_/g, ' '));
        });
      }
      function looksRaw(text) {
        return /^[\s{[<"]/.test(text) || /^[\s{}[\]"',:]*$/.test(text) || /"\s*:/.test(text);
      }

      function callTool(name, args) {
        return window.OrgXWidgetRuntime.callTool(name, args || {});
      }

      function openWidgetLink(url) {
        if (!isAllowedArtifactLinkUrl(url)) return false;
        // OrgX app links go through the shared builder's normalizer (legacy
        // shapes rewritten to real routes); other allowed origins pass as is.
        return window.OrgXWidgetRuntime.openWidgetLink(window.OrgXLinks.normalize(url) || url);
      }

      function reportSize() {
        window.OrgXWidgetRuntime.reportSize();
      }

      // ─── data resolution ─────────────────────────────────────────
      let activeReviewContract = null;

      function resolveArtifact() {
        const toolOutput = (window.openai && window.openai.toolOutput) || null;
        if (toolOutput && toolOutput.artifact) return toolOutput;
        if (toolOutput && toolOutput.id) return { artifact: toolOutput };

        const params = new URLSearchParams(window.location.search);
        const fixtureState = params.get('state') || (params.get('loading') === 'true' ? 'loading' : params.get('demo') === 'true' ? 'urgent' : 'empty');
        if (fixtureState === 'loading') return { state: 'loading' };

        if (artifactKind === 'diff') {
