<!DOCTYPE html>
<html lang="en" data-widget-mode="escalation" data-accent="lime">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifact Review — OrgX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2302040a'/%3E%3Cpath d='M20 18h18l8 8v22H20z' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M38 18v8h8' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <script src="shared/kit/ox-elements-core.js"></script>
  <script src="shared/kit/ox-elements-footer.js"></script>
  <script src="shared/kit/ox-elements-avatar.js"></script>
  <script src="shared/agent-identity.js"></script>
  <script src="shared/orgx-icons.js"></script>

  <style>

    :root { --ox-primary-rgb: 191, 255, 0; }
    .ox-icon { display: block; flex: none; }

    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 18px;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: var(--ox-font);
      -webkit-font-smoothing: antialiased;
    }
    .widget-shell-card { max-width: 680px; margin: 0 auto; position: relative; }

    .wcard {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      --edge-rgb: 100, 116, 139;
    }
    .wcard::after {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), .7), transparent);
      pointer-events: none;
    }
    .wcard[data-edge="amber"] { --edge-rgb: 251, 191, 36; }
    .wcard[data-edge="teal"] { --edge-rgb: 0, 201, 167; }
    .wcard[data-edge="red"] { --edge-rgb: 244, 63, 94; }
    .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; min-width: 0; }
    .hd > .ox-icon { color: var(--ox-text-muted); }
    .hd[data-tone="amber"] > .ox-icon { color: var(--ox-warning); }
    .hd[data-tone="teal"] > .ox-icon { color: var(--ox-teal); }
    .hd[data-tone="red"] > .ox-icon { color: var(--ox-danger); }
    .kind { font-size: 13px; font-weight: 650; line-height: 1.2; color: var(--ox-text-2); white-space: nowrap; }
    .src { min-width: 0; font-size: 12.5px; color: var(--ox-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .src b { color: var(--ox-text-2); font-weight: 600; }
    .sp { flex: 1; }
    .who2 { display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 12.5px; color: var(--ox-text-muted); white-space: nowrap; }
    .who2 b { color: var(--ox-text-2); font-weight: 600; }

    .hd .ox-open { margin: -10px 0; }
    .bd { padding: 10px 18px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .meta { font-size: 12.5px; line-height: 1.35; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }


    .review-desk { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .review-control { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .review-status { display: flex; align-items: center; gap: 10px; min-height: 22px; flex-wrap: wrap; }
    .review-question {
      margin: 0; color: var(--ox-text);
      font-size: 20px; font-weight: 700; line-height: 1.2; letter-spacing: -.025em;
      text-wrap: balance;
    }
    .review-summary, .review-consequence { margin: 0; color: var(--ox-text-muted); font-size: 13px; line-height: 1.5; text-wrap: pretty; }
    .review-summary { color: var(--ox-text-2); }


    .qv { --qv-signal: var(--ox-text-muted); display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 4px; border-radius: 14px;
      background: var(--ox-surface-subtle, rgba(127, 127, 127, .06)); border: 1px solid var(--ox-border); }
    .qv[data-quality-state="cleared"] { --qv-signal: var(--ox-teal); }
    .qv[data-quality-state="held"], .qv[data-quality-state="stale"] { --qv-signal: var(--ox-warning); }
    .qv[data-quality-state="error"] { --qv-signal: var(--ox-danger); }
    .qv-verdict { display: flex; align-items: flex-start; gap: 10px; }
    .qv-verdict > .ox-icon { color: var(--qv-signal); margin-top: 1px; }
    .qv-title { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--ox-text); }
    .qv-detail { margin: 2px 0 0; font-size: 13px; line-height: 1.45; color: var(--ox-text-2); text-wrap: pretty; }
    .qv-meter { display: flex; flex-direction: column; gap: 5px; }
    .qv-bar { position: relative; height: 10px; border-radius: 999px; background: var(--ox-hover, rgba(127, 127, 127, .14)); }
    .qv-fill { position: absolute; inset: 0 auto 0 0; min-width: 4px; border-radius: inherit; background: var(--qv-signal); }
    .qv-fill.is-history { background: repeating-linear-gradient(135deg, var(--ox-text-muted) 0 3px, transparent 3px 6px); opacity: .7; }
    .qv-mark { position: absolute; top: -5px; width: 2px; height: 20px; margin-left: -1px; border-radius: 2px; background: var(--ox-text); }
    .qv-scale { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
    .qv-scale b { color: var(--ox-text); font-weight: 700; }
    .qv-checks-label { margin: 2px 0 0; font-size: 12.5px; font-weight: 650; color: var(--ox-text-muted); }
    .qv-checks { list-style: none; margin: 0; padding: 0; }
    .qv-check { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--ox-border); }
    .qv-check:first-child { border-top: 0; }
    .qv-check > .ox-icon { margin-top: 1px; color: var(--ox-text-muted); }
    .qv-check[data-status="passed"] > .ox-icon { color: var(--ox-teal); }
    .qv-check[data-status="failed"] > .ox-icon { color: var(--ox-danger); }
    .qv-check[data-status="missing"] > .ox-icon { color: var(--ox-warning); }
    .qv-check b { display: block; font-size: 13.5px; font-weight: 650; line-height: 1.3; color: var(--ox-text); }
    .qv-check span { display: block; font-size: 12.5px; line-height: 1.4; color: var(--ox-text-muted); overflow-wrap: anywhere; }
    .qv-state { font-size: 12px; font-weight: 650; line-height: 1.3; color: var(--ox-text-muted); white-space: nowrap; padding-top: 1px; }
    .qv-check[data-status="passed"] .qv-state { color: var(--ox-teal); }
    .qv-check[data-status="failed"] .qv-state { color: var(--ox-danger-text, var(--ox-danger)); }
    .qv-check[data-status="missing"] .qv-state { color: var(--ox-warning); }


    .qv-more { border-top: 1px solid var(--ox-border); margin: 0 -14px; padding: 0 14px; }
    .qv-more__toggle {
      display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0; border: 0; background: none;
      cursor: pointer; text-align: left; font: 650 13px/1.3 var(--ox-font); color: var(--ox-text-2);
    }
    .qv-more__toggle:hover { color: var(--ox-text); }
    .qv-more__toggle .ox-icon { margin-left: auto; color: var(--ox-text-muted); transition: transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .qv-more__toggle[aria-expanded="true"] .ox-icon { transform: rotate(180deg); }
    .qv-more__body { display: flex; flex-direction: column; gap: 12px; padding: 0 0 12px; }
    .qv-facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
    .qv-facts dt { color: var(--ox-text-muted); }
    .qv-facts dd { margin: 0; color: var(--ox-text-2); overflow-wrap: anywhere; }
    .qv-note { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); }
    .ruling-note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--ox-well-bg, rgba(127, 127, 127, .06)); font-size: 13px; line-height: 1.45; color: var(--ox-text-2); }
    .ruling-note b { color: var(--ox-text); font-weight: 650; }
    .receipts { display: flex; flex-direction: column; }
    .receipts__more { margin: 6px 0 0; font-size: 12.5px; color: var(--ox-text-muted); }
    .receipts-label { margin: 0; font-size: 12.5px; font-weight: 650; color: var(--ox-text-muted); }


    .review-evidence { display: flex; flex-direction: column; min-width: 0; }
    .viewer-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ox-border); overflow-x: auto; scrollbar-width: none; }
    .viewer-tab {
      min-height: 44px; padding: 0 12px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent;
      background: none; color: var(--ox-text-muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .viewer-tab[aria-selected="true"] { color: var(--ox-text); border-bottom-color: var(--ox-text); }
    .viewer-tab:hover { color: var(--ox-text); }
    .viewer-panel { padding-top: 12px; min-width: 0; }
    .artifact-preview__body {
      background: var(--ox-well-bg); border-radius: 12px; padding: 14px 16px;
      max-height: 240px; overflow: hidden; position: relative;
      color: var(--ox-text-2); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere;
      transition: max-height 220ms var(--ox-ease, ease);
    }
    .artifact-preview.is-expanded .artifact-preview__body { max-height: 640px; overflow: auto; }
    .artifact-preview__body p { margin: 0 0 10px; }
    .artifact-preview__body p:last-child { margin-bottom: 0; }
    .artifact-preview__body img, .artifact-preview__body video { display: block; max-width: 100%; max-height: 220px; margin: 0 auto; border-radius: 8px; }
    .artifact-preview.is-expanded .artifact-preview__body img,
    .artifact-preview.is-expanded .artifact-preview__body video { max-height: 600px; }
    .artifact-preview__body pre { margin: 0; font: 12px/1.55 var(--ox-font-code); white-space: pre-wrap; color: var(--ox-text); }
    .diff-preview span { display: block; }
    .diff-preview .is-add { color: var(--ox-teal); }
    .diff-preview .is-remove { color: var(--ox-danger); }
    .structured-preview { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; }
    .structured-preview dt { color: var(--ox-text-muted); text-transform: capitalize; }
    .structured-preview dd { margin: 0; color: var(--ox-text); }
    .artifact-preview__placeholder { display: flex; align-items: center; gap: 12px; color: var(--ox-text-muted); }
    .preview-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px; }
    .preview-toggle {
      min-height: 44px; padding: 0; border: 0; background: none;
      color: var(--ox-text-2); font-family: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
    }
    .evidence-readout { display: flex; flex-direction: column; gap: 10px; }
    .evidence-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; }
    .evidence-facts dt { color: var(--ox-text-muted); }
    .evidence-facts dd { margin: 0; color: var(--ox-text); overflow-wrap: anywhere; }
    .evidence-facts a { color: var(--ox-text); }
    .version-history { display: flex; flex-direction: column; }
    .version-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 40px; border-top: 1px solid var(--ox-border); font-size: 13px; color: var(--ox-text-2); }
    .version-row:first-child { border-top: 0; }
    .version-row__number { font-size: 13px; font-weight: 650; color: var(--ox-text); }
    .version-row__state { font-size: 12px; color: var(--ox-text-muted); }


    .decision-row { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.45; }
    .decision-row strong { color: var(--ox-text); font-weight: 650; }
    .decision-row span { color: var(--ox-text-muted); }

    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .composer { display: flex; flex-direction: column; gap: 8px; }
    .composer label { font-size: 13px; font-weight: 650; color: var(--ox-text); }
    .composer textarea {
      width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--ox-border-strong); background: var(--ox-panel);
      color: var(--ox-text); font-family: inherit; font-size: 14px; line-height: 1.5;
    }
    .composer textarea:focus { outline: 2px solid var(--ox-focus); outline-offset: 1px; }
    .review-feedback { min-height: 0; font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); }
    .review-feedback:empty { display: none; }
    .review-feedback[data-tone="error"] { color: var(--ox-danger); }


    .ft-btn {
      position: relative; overflow: hidden;
      min-height: 44px; margin: -4px 0; padding: 0 12px; border-radius: 9px; border: 1px solid transparent;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      background: none; color: var(--ox-text-2);
      font-family: inherit; font-size: 12.5px; font-weight: 650; line-height: 1; cursor: pointer;
      transition: background .16s;
    }
    .ft-btn::after { content: ""; position: absolute; inset: -4px -2px; }
    .ft-btn--text:hover:not(:disabled) { background: var(--ox-hover); color: var(--ox-text); }
    .ft-btn--primary {
      background: var(--ox-action); color: var(--ox-action-fg); border-color: var(--ox-action-border);
      box-shadow: inset 0 1px rgba(255, 255, 255, .27);
    }
    .ft-btn:disabled { cursor: default; opacity: .55; }
    .ft-btn[aria-busy="true"] { opacity: .85; }
    .ft-btn__label { position: relative; }
    .ft-btn svg { width: 12px; height: 12px; position: relative; }


    .stage.is-resolving { animation: review-exit 220ms var(--ox-ease, ease) forwards; }
    @keyframes review-exit { to { opacity: 0; transform: translateY(-4px); } }

    .sk { display: block; height: 10px; border-radius: 4px; background: var(--ox-skeleton, rgba(127, 127, 127, .12)); }
    .empty-copy { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ox-text-muted); }

    @media (max-width: 760px) {
      .who2 b { max-width: 12ch; overflow: hidden; text-overflow: ellipsis; }
    }
    @media (max-width: 520px) {
      .hd { flex-wrap: wrap; row-gap: 4px; padding: 12px 14px 0; }
      .hd .src { flex-basis: calc(100% - 28px); order: 2; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .bd { padding: 10px 14px 14px; }
      .review-question { font-size: 18px; }
      .qv { padding: 12px 12px 4px; }
      .qv-more { margin: 0 -12px; padding: 0 12px; }
      .qv-facts { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .qv-facts dd + dt { margin-top: 6px; }
      .who2 b { display: none; }

      .hd .ox-open .ox-open__long { display: none; }
      .hd .ox-open { min-width: 44px; justify-content: center; }

      .qv-check[data-status="not-run"] { padding: 6px 0; align-items: center; }
      .qv-check[data-status="not-run"] > span > span { display: none; }
      .review-control { gap: 8px; }
    }
    @media (max-width: 420px) {

      .ft-btn { padding: 0 6px; gap: 4px; font-size: 12px; letter-spacing: -.01em; }
      .ft-btn--primary { padding: 0 6px; }
      .ft-btn--text[disabled] { padding: 0 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage.is-resolving { animation: none; }
      .artifact-preview__body, .qv-more__toggle .ox-icon { transition: none; }
    }
  </style>

<body>
  <div class="widget-shell-card">
    <div class="stage" data-stage>
      <article class="wcard ox-surface" aria-busy="true" aria-label="Loading artifact review">
        <div class="hd"><span class="sk" style="width:44%"></span></div>
        <div class="bd">
          <span class="sk" style="width:80%;height:22px"></span>
          <span class="sk" style="width:100%;height:8px"></span>
          <span class="sk" style="width:100%;height:132px;border-radius:12px"></span>
        </div>
        <ox-footer variant="reads" state="loading"></ox-footer>
      </article>
    </div>
  </div>

  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/live-machine.js"></script>
  <script src="shared/live-store.js"></script>
  <script src="shared/live-panel.js"></script>
  <script>
    (function () {
      'use strict';

      const ALLOWED_ARTIFACT_MEDIA_ORIGINS = [
        'https://mcp.useorgx.com',
        'https://cdn.useorgx.com',
      ];
      const ALLOWED_ARTIFACT_LINK_ORIGINS = [
        'https://mcp.useorgx.com',
        'https://useorgx.com',
        'https://www.useorgx.com',
        'https://github.com',
      ];

      // Previews read avatars from the same origin; hosts use the published renders.
      if (window.OrgXElements && window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
        try {
          window.OrgXElements.avatarConfig.baseUrl = new URL('shared/avatars', window.location.href).toString();
        } catch (_) { /* keep the default */ }
      }

      // Focus rings follow the keyboard (widget-theme.css keys on data-ox-input). This widget
      // doesn't load interaction-kit.js, which records it for the others.
      (function trackInputModality(doc) {
        if (!doc || doc.__oxInput) return;
        doc.__oxInput = true;
        const set = function (mode) { if (doc.documentElement.getAttribute('data-ox-input') !== mode) doc.documentElement.setAttribute('data-ox-input', mode); };
        doc.addEventListener('pointerdown', function () { set('pointer'); }, true);
        doc.addEventListener('keydown', function (event) { if (!event.metaKey && !event.ctrlKey && !event.altKey) set('keyboard'); }, true);
      })(document);

      // ─── SDK shim ────────────────────────────────────────────────
      // Blocker artifacts can carry raw codes ("Model call stopped: model_budget_exhausted").
      // Known codes read as words; an unknown snake_case code becomes plain words. Code, diffs
      // and structured payloads are shown as they are.
      const CODE_COPY = {
        model_budget_exhausted: 'the model budget ran out',
        budget_exhausted: 'the budget ran out',
        budget_exceeded: 'it went over the spend cap',
        max_cost_exceeded: 'it went over the spend cap',
        spend_cap_exceeded: 'it went over the spend cap',
        rate_limited: 'the provider rate limit',
        provider_rate_limited: 'the provider rate limit',
        provider_unavailable: 'the model provider was unavailable',
        model_unavailable: 'the model was unavailable',
        context_length_exceeded: 'the input was too long for the model',
        timed_out: 'it timed out',
        run_timeout: 'it timed out',
        heartbeat_lost: 'it stopped reporting',
        no_heartbeat: 'it stopped reporting',
        guardrail_blocked: 'a guardrail stopped it',
        policy_blocked: 'a policy stopped it',
        authentication_required: 'it needs you to sign in again',
        tool_unavailable: 'a tool it needed was unavailable',
      };
      function humanizeCodes(text) {
        return String(text == null ? '' : text).replace(/(^|[^\w./:#=?&@-])([a-z][a-z0-9]*(?:_[a-z0-9]+)+)(?![\w/=@-]|\.\w)/g, function (all, lead, code) {
          return lead + (CODE_COPY[code] || code.replace(/_/g, ' '));
        });
      }
      function looksRaw(text) {
        return /^[\s{[<"]/.test(text) || /^[\s{}[\]"',:]*$/.test(text) || /"\s*:/.test(text);
      }

      function callTool(name, args) {
        return window.OrgXWidgetRuntime.callTool(name, args || {});
      }

      function openWidgetLink(url) {
        if (!isAllowedArtifactLinkUrl(url)) return false;
        // OrgX app links go through the shared builder's normalizer (legacy
        // shapes rewritten to real routes); other allowed origins pass as is.
        return window.OrgXWidgetRuntime.openWidgetLink(window.OrgXLinks.normalize(url) || url);
      }

      function reportSize() {
        window.OrgXWidgetRuntime.reportSize();
      }

      // ─── data resolution ─────────────────────────────────────────
      let activeReviewContract = null;

      function resolveArtifact() {
        const toolOutput = (window.openai && window.openai.toolOutput) || null;
        if (toolOutput && toolOutput.artifact) return toolOutput;
        if (toolOutput && toolOutput.id) return { artifact: toolOutput };

        const params = new URLSearchParams(window.location.search);
        const fixtureState = params.get('state') || (params.get('loading') === 'true' ? 'loading' : params.get('demo') === 'true' ? 'urgent' : 'empty');
        if (fixtureState === 'loading') return { state: 'loading' };
        if (fixtureState === 'empty') return { artifact: null };
        if (fixtureState === 'error' || fixtureState === 'degraded') {
          return { artifact: { __error: 'Artifact evidence could not be loaded. The review remains open and no action was taken.' } };
        }

        if (fixtureState === 'blocker') {
          // A structured blocker that still carries the run's raw codes (live QA, 2026-10-02).
          return {
            artifact: {
              id: 'ART-BLOCKER', name: 'Model call stopped: model_budget_exhausted', artifact_type: 'structured_blocker',
              artifact_url: '', status: 'in_review', version: 1,
              summary: 'Model call stopped: model_budget_exhausted',
              content: 'Model call stopped: model_budget_exhausted\n\nThe run hit provider_rate_limited twice before the budget check.',
              author: { name: 'Eli', domain: 'engineering', role: 'Engineering' },
            },
          };
        }

        const failedFixture = fixtureState === 'urgent' || fixtureState === 'failed';

        // Deterministic fixture payload for gallery / dev.
        const payload = {
          artifact: {
            id: 'ART-DEMO',
            name: failedFixture ? 'Launch narrative — v4' : 'Launch narrative — v5',
            artifact_type: 'marketing.launch_narrative',
            artifact_url: '',

      // ─── helpers ─────────────────────────────────────────────────
      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function escapeAttribute(str) {
        return escapeHtml(String(str || '')).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function formatRelative(iso) {
        // Shared formatter: "2m ago", "Yesterday", then the date in the viewer's locale.
        return window.OrgXTime.relative(iso, { inline: true });
      }

      function asRecord(value) {
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      }

      function firstString(values) {
        for (let i = 0; i < values.length; i += 1) {
          if (typeof values[i] === 'string' && values[i].trim()) return values[i].trim();
        }
        return '';
      }

      function firstNumber(values) {
        for (let i = 0; i < values.length; i += 1) {
          if (typeof values[i] === 'number' && Number.isFinite(values[i])) return values[i];
        }
        return null;
      }

      function normalizeRatio(value) {
        if (typeof value !== 'number' || !Number.isFinite(value)) return null;
        return Math.max(0, Math.min(1, value > 1 ? value / 100 : value));
      }

      function nonNegativeInteger(value) {
        return typeof value === 'number' && Number.isFinite(value) && value >= 0
          ? Math.floor(value)
          : null;
      }

      function compactLabel(value, fallback) {
        const label = firstString([value, fallback]).replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
        return label.length > 72 ? label.slice(0, 69).trimEnd() + '…' : label;
      }

      function asEvidenceRecords(value) {
        if (Array.isArray(value)) {
          return value.map(asRecord).filter(function (item) { return Object.keys(item).length > 0; });
        }
        const record = asRecord(value);
        return Object.entries(record).map(function (entry) {
          const nested = asRecord(entry[1]);
          if (Object.keys(nested).length) {
            return Object.assign({ label: entry[0] }, nested);
          }
          return {
            label: entry[0],
            score: typeof entry[1] === 'number' ? entry[1] : undefined,
            value: entry[1],
          };
        });
      }

      function evidenceRecordLabel(item, fallback) {
        const record = asRecord(item);
        return compactLabel(firstString([
          record.label,
          record.name,
          record.title,
          record.criterion,
          record.criterion_id,
          record.criterionId,
          record.check,
          record.metric,
          record.key,
          record.kind,
          record.summary,
        ]), fallback);
      }

      function evidenceRecordVerdict(item, threshold) {
        const record = asRecord(item);
        const booleans = [record.passed, record.pass, record.result, record.value];
        for (let i = 0; i < booleans.length; i += 1) {
          if (typeof booleans[i] === 'boolean') return booleans[i];
        }
        const state = firstString([record.status, record.state, record.verdict]).toLowerCase();
        if (['pass', 'passed', 'clear', 'cleared', 'success'].includes(state)) return true;
        if (['fail', 'failed', 'blocked', 'held', 'error', 'invalid'].includes(state)) return false;
        const score = normalizeRatio(firstNumber([record.score, record.value]));
        const bar = normalizeRatio(firstNumber([record.threshold, threshold]));
        return score !== null && bar !== null ? score >= bar : null;
      }

      function evidenceRecordScore(item) {
        const record = asRecord(item);
        return normalizeRatio(firstNumber([record.score, record.value, record.rating]));
      }

      function hasAllowedHttpsOrigin(value, allowedOrigins) {
        try {
          const url = new URL(value);
          return url.protocol === 'https:' && allowedOrigins.includes(url.origin);
        } catch (_) {
          return false;
        }
      }

      function isAllowedArtifactLinkUrl(value) {
        return hasAllowedHttpsOrigin(value, ALLOWED_ARTIFACT_LINK_ORIGINS);
      }

      function isSafeMediaUrl(value, allowImageData) {
        if (allowImageData && /^data:image\//i.test(value)) return true;
        return hasAllowedHttpsOrigin(value, ALLOWED_ARTIFACT_MEDIA_ORIGINS);
      }

      function normalizeArtifact(artifact) {
        if (!artifact || typeof artifact !== 'object') return artifact;
        const metadata = asRecord(artifact.metadata);
        const author = asRecord(artifact.author || artifact.producer || metadata.producer);
        const versions = Array.isArray(artifact.versions)
          ? artifact.versions
          : Array.isArray(artifact.version_history)
            ? artifact.version_history
            : [];
        return Object.assign({}, artifact, {
          id: firstString([artifact.id, artifact.artifact_id, artifact.artifactId]),
          name: firstString([artifact.name, artifact.title, artifact.label]) || 'Artifact review',
          artifact_type: firstString([artifact.artifact_type, artifact.artifactType, artifact.type, artifact.kind]) || 'document',
          artifact_url: firstString([artifact.artifact_url, artifact.artifactUrl, artifact.preview_url, artifact.previewUrl, artifact.url]),
          summary: firstString([artifact.summary, artifact.description, metadata.summary]),
          content: firstString([artifact.content, artifact.body, artifact.markdown, metadata.content, metadata.body]),
          code: firstString([artifact.code, artifact.diff, metadata.code, metadata.diff]),
          status: firstString([artifact.status, artifact.review_status, artifact.reviewStatus]) || 'in_review',
          version: firstNumber([artifact.version, artifact.version_number, artifact.versionNumber]) || 1,
          versions: versions,
          author: Object.assign({}, author, {
            name: firstString([author.name, author.label, artifact.producer_name, artifact.producerName]) || 'OrgX agent',
            role: firstString([author.role, author.type, artifact.producer_role, artifact.producerRole]),
            domain: firstString([author.domain, author.agent_type, author.agentType]) || 'orchestrator',
          }),
        });
      }

      function resolveIncomingArtifact(payload) {
        if (!payload || typeof payload !== 'object') return payload;
        const data = asRecord(payload.data);
        const result = asRecord(payload.result);
        const reviewContract =
          payload.reviewContract || data.reviewContract || result.reviewContract;
        activeReviewContract =
          reviewContract &&
          asRecord(reviewContract).schemaVersion === 'artifact_review_contract.v1'
            ? reviewContract
            : null;
        const candidate = payload.artifact || data.artifact || result.artifact || payload;
        const error = payload.error || data.error || result.error;
        if (error && !(candidate && (candidate.id || candidate.artifact_id || candidate.artifactId))) {
          const rawDetail = typeof error === 'string'
            ? error
            : firstString([error.message, error.detail, error.code]) || '';
          // Never show a raw payload; a code reads as words.
          const words = rawDetail && !looksRaw(rawDetail) ? humanizeCodes(rawDetail).trim() : '';
          const detail = words ? words.charAt(0).toUpperCase() + words.slice(1).replace(/[.!]?$/, '.') : 'Artifact evidence could not be loaded.';
          return {
            __error: detail + ' The review remains open and no action was taken.',
            __errorCode: typeof error === 'object' ? firstString([error.code, error.kind]) : '',
          };
        }
        return normalizeArtifact(candidate);
      }

      function resolveReviewerSignal(review) {
        const reviewedBy = firstString([review.reviewed_by, review.reviewedBy]);
        const kind = firstString([review.reviewer_kind, review.reviewerKind]).toLowerCase();
        if (review.auto_approved === true || review.autoApproved === true || kind === 'system' || reviewedBy.toLowerCase().startsWith('system:')) {
          return 'Auto-approved by policy';
        }
        const named = firstString([review.reviewer_name, review.reviewerName, review.reviewer_display_name, review.reviewerDisplayName]);
        if (named && !/^user_|^[0-9a-f-]{32,}$/i.test(named)) return 'Reviewed by ' + named;
        if (reviewedBy || review.reviewer || review.reviewer_id || review.reviewerId) return 'Review recorded';
        return 'Awaiting human decision';
      }

      function resolveContractReviewer(ruling) {
        const state = firstString([ruling.state]).replace(/_/g, ' ');
        const actorLabel = firstString([ruling.actorLabel, ruling.actor_label]);
        const actorKind = firstString([ruling.actorKind, ruling.actor_kind]);
        if (state === 'pending' || state === 'none' || !state) {
          return 'Awaiting human decision';
        }
        return compactLabel(
          state + (actorLabel ? ' · ' + actorLabel : actorKind ? ' · ' + actorKind : ''),
          'Review recorded',
        );
      }

      function resolveContractEvidence(artifact, reviewContract) {
        const contract = asRecord(reviewContract);
        if (contract.schemaVersion !== 'artifact_review_contract.v1') return null;
        const quality = asRecord(contract.quality);
        const thresholdSource = asRecord(quality.thresholdSource || quality.threshold_source);
        const ruling = asRecord(contract.ruling);
        const authority = asRecord(contract.authority);
        const purpose = asRecord(contract.purpose);
        const modalityGate = asRecord(contract.modalityGate || contract.modality_gate);
        const stateMap = {
          cleared: 'cleared',
          failed: 'held',
          error: 'error',
          stale: 'stale',
          scoring: 'pending',
          unscored: 'not_scored',
          skipped: 'not_scored',
        };
        const qualityState = firstString([quality.state]).toLowerCase();
        const rulingState = firstString([ruling.state]).toLowerCase();
        const state = stateMap[qualityState] || 'not_scored';
        const score = normalizeRatio(firstNumber([quality.score]));
        const previousScore = normalizeRatio(firstNumber([
          quality.previousScore,
          quality.previous_score,
        ]));
        const threshold = normalizeRatio(firstNumber([quality.threshold]));
        const profileName = firstString([
          thresholdSource.profileName,
          thresholdSource.profile_name,
        ]);
        const profileVersion = firstNumber([
          thresholdSource.profileVersion,
          thresholdSource.profile_version,
        ]);
        const profileScope = firstString([
          thresholdSource.profileScope,
          thresholdSource.profile_scope,
        ]);
        const qualityBlocksValue =
          typeof quality.blocksAdvance === 'boolean'
            ? quality.blocksAdvance
            : typeof quality.blocks_advance === 'boolean'
              ? quality.blocks_advance
              : null;
        const modalityBlocksValue =
          typeof modalityGate.blocksAdvance === 'boolean'
            ? modalityGate.blocksAdvance
            : typeof modalityGate.blocks_advance === 'boolean'
              ? modalityGate.blocks_advance
              : null;
        const reviewRequiredValue =
          typeof purpose.reviewRequired === 'boolean'
            ? purpose.reviewRequired
            : typeof purpose.review_required === 'boolean'
              ? purpose.review_required
              : null;
        const canReviewValue =
          typeof authority.canReview === 'boolean'
            ? authority.canReview
            : typeof authority.can_review === 'boolean'
              ? authority.can_review
              : null;
        const blocksApproval =
          qualityBlocksValue === true || modalityBlocksValue === true;
        const hasCanonicalActionContract =
          qualityBlocksValue !== null &&
          modalityBlocksValue !== null &&
          reviewRequiredValue !== null &&
          canReviewValue !== null;
        const labels = {
          cleared: 'Verification cleared',
          held: 'Verification held',
          stale: 'Verification stale',
          error: 'Verification needs attention',
          pending: 'Verification pending',
          not_scored: qualityState === 'skipped' ? 'Verification not required' : 'Not scored yet',
        };
        const metadata = asRecord(artifact.metadata);
        // purpose.reviewAction (optional): sign a deliverable, resolve a blocker, inspect a record.
        // Only `sign` ever offers Approve; a blocker is resolved in OrgX, a record is read.
        const reviewAction = firstString([purpose.reviewAction, purpose.review_action]).toLowerCase();
        const mode = reviewAction === 'resolve' || reviewAction === 'inspect' || reviewAction === 'sign'
          ? reviewAction
          : firstString([purpose.kind]).toLowerCase() === 'blocker' ? 'resolve' : '';
        const rulingNote = firstString([ruling.note]);

        return {
          mode: mode,
          rulingNote: rulingNote,
          findings: Array.isArray(quality.findings) ? quality.findings.map(asRecord).filter(function (f) { return firstString([f.label]); }) : [],
          barSource: firstString([thresholdSource.kind]),
          state: state,
          label: labels[state],
          detail: firstString([quality.reason, asRecord(contract.workflow).reason]) ||
            'Canonical review evidence is attached to this artifact.',
          score: score,
          previousScore: previousScore,
          threshold: threshold,
          evalStatus: qualityState || 'unscored',
          profileLabel: profileName
            ? profileName + (profileVersion === null ? '' : ' v' + profileVersion) + (profileScope ? ' · ' + profileScope : '')
            : firstString([thresholdSource.kind]).replace(/_/g, ' ') || 'Quality policy source unavailable',
          blocksApproval: blocksApproval,
          canReview:
            hasCanonicalActionContract &&
            canReviewValue === true &&
            reviewRequiredValue === true &&
            mode !== 'resolve' && mode !== 'inspect' &&
            !['accepted', 'changes_requested', 'rejected'].includes(rulingState),
          reviewControlsLabel: ['accepted', 'changes_requested', 'rejected'].includes(rulingState)
            ? 'Ruling recorded'
            : 'Review controls unavailable',
          reviewControlsDetail: ['accepted', 'changes_requested', 'rejected'].includes(rulingState)
            ? resolveContractReviewer(ruling)
            : 'This evidence is readable, but your current authority cannot record a ruling.',
          reviewer: resolveContractReviewer(ruling),
          reviewStatus: firstString([ruling.state]) || 'none',
          sourceUrl: firstString([artifact.source_url, artifact.sourceUrl, artifact.artifact_url, artifact.artifactUrl, metadata.source_url, metadata.sourceUrl]),
        };
      }

      function resolveEvidence(artifact, reviewContract) {
        const contractEvidence = resolveContractEvidence(artifact, reviewContract);
        if (contractEvidence) return contractEvidence;
        const metadata = asRecord(artifact.metadata);
        const verification = asRecord(artifact.verification || metadata.verification);
        const evalData = asRecord(verification.eval || metadata.eval || artifact.eval);
        const review = asRecord(metadata.review || verification.human_review || verification.humanReview || artifact.review);
        const score = normalizeRatio(firstNumber([
          evalData.score,
          evalData.quality_score,
          evalData.qualityScore,
          verification.score,
          artifact.quality_score,
          artifact.qualityScore,
        ]));
        const previousScore = normalizeRatio(firstNumber([
          evalData.previous_score,
          evalData.previousScore,
          evalData.prior_score,
          evalData.priorScore,
          verification.previous_score,
          verification.previousScore,
        ]));
        const threshold = normalizeRatio(firstNumber([
          evalData.threshold,
          evalData.quality_threshold,
          evalData.qualityThreshold,
          verification.threshold,
          artifact.quality_threshold,
          artifact.qualityThreshold,
        ]));
        const evalStatus = firstString([
          evalData.status,
          evalData.eval_status,
          evalData.evalStatus,
          verification.status,
          artifact.eval_status,
          artifact.evalStatus,
        ]).toLowerCase();
        const blocksApproval = [
          evalData.blocks_completion,
          evalData.blocksCompletion,
          verification.blocks_completion,
          verification.blocksCompletion,
          artifact.blocks_completion,
          artifact.blocksCompletion,
        ].some(function (value) { return value === true; });
        let state = 'not_scored';
        if (['error', 'errored', 'invalid'].includes(evalStatus)) state = 'error';
        else if (blocksApproval || ['failed', 'blocked', 'held'].includes(evalStatus)) state = 'held';
        else if (evalStatus === 'stale') state = 'stale';
        else if (['queued', 'running', 'pending', 'scoring'].includes(evalStatus)) state = 'pending';
        else if (evalStatus === 'passed' || (score !== null && threshold !== null && score >= threshold)) state = 'cleared';
        const labels = {
          cleared: 'Verification cleared',
          held: 'Verification held',
          stale: 'Verification stale',
          error: 'Verification needs attention',
          pending: 'Verification pending',
          not_scored: 'Not scored yet',
        };
        const details = {
          cleared: 'Recorded evidence meets the current quality bar.',
          held: firstString([evalData.proof_impact, evalData.proofImpact, verification.proof_impact, verification.proofImpact]) || 'Required evidence has not cleared the current quality bar.',
          stale: 'The attached score belongs to an older artifact version and cannot clear this one.',
          error: 'The current evaluation did not produce a usable score. Prior scores remain historical context only.',
          pending: 'The evaluation is still running. Approval stays available only when policy allows it.',
          not_scored: 'No evaluation result is attached. Review the provenance before signing off.',
        };
        const profileName = firstString([
          evalData.profile_name,
          evalData.profileName,
          asRecord(evalData.profile).name,
          asRecord(evalData.profile).label,
        ]);
        const profileVersion = firstNumber([
          evalData.profile_version,
          evalData.profileVersion,
          asRecord(evalData.profile).version,
        ]);
        const profileScope = firstString([
          evalData.profile_scope,
          evalData.profileScope,
          asRecord(evalData.profile).scope,
        ]);
        return {
          state: state,
          label: labels[state],
          detail: details[state],
          score: score,
          previousScore: previousScore,
          threshold: threshold,
          evalStatus: evalStatus || 'not attached',
          profileLabel: profileName
            ? profileName + (profileVersion === null ? '' : ' v' + profileVersion) + (profileScope ? ' · ' + profileScope : '')
            : 'Quality policy source unavailable',
          // Legacy payloads: a blocker artifact is resolved, never signed.
          mode: /blocker/i.test(artifact.artifact_type || '') ? 'resolve' : 'sign',
          rulingNote: firstString([review.note, review.notes, review.comment]),
          findings: [],
          barSource: profileName ? 'eval_profile' : '',
          blocksApproval: blocksApproval,
          canReview: !/blocker/i.test(artifact.artifact_type || ''),
          reviewControlsLabel: '',
          reviewControlsDetail: '',
          reviewer: resolveReviewerSignal(review),
          reviewStatus: firstString([review.status, artifact.review_status, artifact.reviewStatus]) || artifact.status,
          sourceUrl: firstString([artifact.source_url, artifact.sourceUrl, artifact.artifact_url, artifact.artifactUrl, metadata.source_url, metadata.sourceUrl]),
        };
      }

      function readablePayload(artifact) {
        const metadata = asRecord(artifact.metadata);
        const candidates = [artifact.payload, artifact.data, metadata.payload, metadata.data];
        for (let i = 0; i < candidates.length; i += 1) {
          const value = candidates[i];
          if (value && typeof value === 'object') return value;
        }
        return null;
      }

      function renderStructured(value) {
        const entries = Object.entries(asRecord(value)).slice(0, 12);
        if (!entries.length) return '';
        return '<dl class="structured-preview">' + entries.map(function (entry) {
          const raw = entry[1];
          const serialized = raw && typeof raw === 'object' ? JSON.stringify(raw) : String(raw ?? '—');
          const display = serialized.length > 260 ? serialized.slice(0, 257) + '…' : serialized;
          return '<dt>' + escapeHtml(entry[0].replace(/[_-]+/g, ' ')) + '</dt><dd>' + escapeHtml(display) + '</dd>';
        }).join('') + '</dl>';
      }

      function renderDiff(text) {
        return '<pre class="diff-preview" aria-label="Artifact diff">' + String(text || '').split('\n').map(function (line) {
          const cls = line.startsWith('+') && !line.startsWith('+++')
            ? ' class="is-add"'
            : line.startsWith('-') && !line.startsWith('---')
              ? ' class="is-remove"'
              : '';
          return '<span' + cls + '>' + escapeHtml(line || ' ') + '</span>';
        }).join('') + '</pre>';
      }

      function renderPreview(artifact) {
        const type = (artifact.artifact_type || '').toLowerCase();
        const url = artifact.artifact_url || '';
        const content = artifact.content || artifact.summary || '';
        const code = artifact.code || '';
        const payload = readablePayload(artifact);

        if (isSafeMediaUrl(url, true) && (type.startsWith('image') || type.includes('mockup') || type.includes('screenshot') || type.includes('design'))) {
          return '<img src="' + escapeAttribute(url) + '" alt="' + escapeAttribute(artifact.name || 'artifact') + '" />';
        }

        if (isSafeMediaUrl(url, false) && (type.includes('video') || /\.(mp4|webm|mov)(?:$|[?#])/i.test(url))) {
          return '<video controls preload="metadata" aria-label="' + escapeAttribute(artifact.name || 'Artifact video') + '"><source src="' + escapeAttribute(url) + '" /></video>';
        }

        if (type.includes('diff') || (/^(?:diff --git|@@ |\+\+\+ |--- )/m.test(code))) {
          return renderDiff(code || content);
        }

        if (type.includes('code') || type.includes('pull_request') || type.includes('tech_spec') || code) {
          return '<pre>' + escapeHtml(code || content) + '</pre>';
        }

        if (type.includes('markdown') || type.includes('doc') || type.includes('report') || type.includes('brief') || content) {
          return '<div class="artifact-preview__markdown">' + escapeHtml(humanizeCodes(content)).replace(/\n\n/g, '</p><p>').replace(/^(.+)$/, '<p>$1</p>') + '</div>';
        }

        if (payload) return renderStructured(payload);

        // Fallback: placeholder with summary
        return (
          '<div class="artifact-preview__placeholder">' +
          '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h7M7 16h10"/></svg>' +
          '<div>' + escapeHtml(humanizeCodes(artifact.summary || 'Preview unavailable for this artifact type.')) + '</div>' +
          '</div>'
        );
      }

      function renderHistory(artifact) {
        const versions = Array.isArray(artifact.versions) && artifact.versions.length ? artifact.versions : [{ version: artifact.version || 1 }];
        const current = artifact.version || versions[versions.length - 1].version;
        return (
          '<div class="version-history" aria-label="Artifact version history">' +
          versions.slice().reverse().map(function (v) {
            const isCurrent = v.version === current;
            return (
              '<div class="version-row">' +
              '<span class="version-row__number">v' + escapeHtml(String(v.version || 1)) + '</span>' +
              '<span>' + escapeHtml(v.updated_at ? formatRelative(v.updated_at) : (isCurrent ? 'Current revision' : 'Prior revision')) + '</span>' +
              '<span class="version-row__state">' + (isCurrent ? 'Current' : 'Recorded') + '</span>' +
              '</div>'
            );
          }).join('') +
          '</div>'
        );
      }

      const oxIcon = function (name, size) {
        return window.OrgXIcons ? window.OrgXIcons.icon(name, { size: size || 16 }) : '';
      };
      function pct(value) {
        return typeof value === 'number' && isFinite(value) ? Math.round(value * 100) : null;
      }
      function labelsOf(items, withScores, n) {
        return items.slice(0, n || 2).map(function (item) {
          const score = withScores ? evidenceRecordScore(item) : null;
          return evidenceRecordLabel(item, '') + (score === null ? '' : ' ' + Math.round(score * 100));
        }).filter(Boolean).join(', ');
      }

      // One plain sentence for where the score stands. quality.score may be null: "Not scored yet",
      // never NaN or an empty bar.
      function verdictFor(evidence, version) {
        const score = pct(evidence.score);
        const bar = pct(evidence.threshold);
        const prior = pct(evidence.previousScore);
        const needed = bar === null ? '' : bar + ' is needed to sign';
        const optional = !evidence.blocksApproval;
        switch (evidence.state) {
          case 'cleared':
            return { icon: 'done', title: score === null ? 'Cleared the bar' : 'Cleared · scored ' + score + (bar === null ? '' : ' of the ' + bar + ' needed'), detail: 'This version meets the quality bar.' };
          case 'held':
            return {
              icon: 'needs-you',
              title: score === null ? 'Held below the bar' : 'Held · scored ' + score + (bar === null ? '' : ' of the ' + bar + ' needed'),
              detail: evidence.blocksApproval ? 'Approval waits until a stronger version is scored.' : 'It is below the bar; policy still lets you decide.',
            };
          case 'stale':
            return { icon: 'waiting', title: prior === null ? 'Score is out of date' : 'Out of date · ' + prior + ' was for an older version', detail: 'v' + version + ' needs its own score' + (needed ? '; ' + needed : '') + '.' };
          case 'error':
            return { icon: 'failed', title: 'The check didn’t produce a score', detail: 'Run it again in OrgX. Older scores are history only.' };
          case 'pending':
            return { icon: 'active', title: 'Scoring now', detail: 'The result lands here when the check finishes.' };
          default:
            if (evidence.evalStatus === 'skipped') return { icon: 'done', title: 'No score needed', detail: 'This kind of artifact is not scored.' };
            return {
              icon: 'draft',
              title: 'Not scored yet',
              detail: 'Nothing has scored v' + version + ' yet' + (needed ? '; ' + needed : '') + (optional && evidence.canReview ? '. You can still decide on it.' : '.'),
            };
        }
      }

      // What was checked, as four plain rows: passed, failed, missing, or not run.
      function buildChecks(anatomy, evidence) {
        const rec = anatomy.records;
        const scored = anatomy.evidenceIsCurrent && evidence.score !== null;
        const findings = (evidence.findings || []).map(function (f) {
          return { label: f.label, score: typeof f.score === 'number' ? f.score : undefined, passed: f.tone === 'danger' ? false : f.tone === 'good' ? true : undefined };
        });
        const criteria = rec.criteria.length ? rec.criteria : rec.supportingLayers.length ? rec.supportingLayers : findings;
        const below = criteria.filter(function (c) { return evidenceRecordVerdict(c, evidence.threshold) === false; });
        const checks = [];
        if (criteria.length) {
          checks.push(below.length
            ? { status: 'failed', label: 'Judged against criteria', detail: below.length + ' of ' + criteria.length + ' below the bar: ' + labelsOf(below, true) }
            : { status: 'passed', label: 'Judged against criteria', detail: 'All ' + criteria.length + ' at or above the bar' + (labelsOf(criteria, true, 3) ? ': ' + labelsOf(criteria, true, 3) : '') });
        } else {
          checks.push(scored
            ? { status: 'missing', label: 'Judged against criteria', detail: 'No criteria were recorded, so OrgX can’t show what set the score.' }
            : { status: 'not-run', label: 'Judged against criteria', detail: 'No judge has scored this version yet.' });
        }
        const failedChecks = rec.measured.filter(function (m) { return evidenceRecordVerdict(m, null) === false; });
        const passedChecks = rec.measured.filter(function (m) { return evidenceRecordVerdict(m, null) === true; });
        checks.push(!rec.measured.length
          ? { status: 'not-run', label: 'Automatic checks', detail: 'None ran on this version.' }
          : failedChecks.length
            ? { status: 'failed', label: 'Automatic checks', detail: failedChecks.length + ' of ' + rec.measured.length + ' failed: ' + labelsOf(failedChecks, false) }
            : { status: 'passed', label: 'Automatic checks', detail: passedChecks.length + ' of ' + rec.measured.length + ' passed' + (passedChecks.length < rec.measured.length ? ', the rest unreported' : '') });
        checks.push(anatomy.observedCount
          ? { status: 'passed', label: 'Looked at the output', detail: anatomy.observedCount + ' inspection' + (anatomy.observedCount === 1 ? '' : 's') + (labelsOf(rec.observations, false, 1) ? ': ' + labelsOf(rec.observations, false, 1) : '') }
          : { status: 'not-run', label: 'Looked at the output', detail: 'Nobody inspected the rendered output.' });
        const refs = anatomy.inputCount - 1;
        checks.push(refs > 0
          ? { status: 'passed', label: 'Sources linked', detail: refs + ' linked' + (labelsOf(rec.relationships || [], false) ? ': ' + labelsOf(rec.relationships || [], false) : '') }
          : { status: 'not-run', label: 'Sources linked', detail: 'No briefs or references were linked.' });
        return checks;
      }

      const CHECK_ICON = { passed: 'done', failed: 'failed', missing: 'needs-you', 'not-run': 'draft' };
      const CHECK_WORD = { passed: 'Passed', failed: 'Failed', missing: 'Missing', 'not-run': 'Not run' };

      function barSourceText(evidence, bar) {
        if (evidence.barSource === 'system_default' || evidence.barSource === 'contract_default') return 'The OrgX default bar' + (bar === null ? '' : ' (' + bar + ')');
        if (evidence.profileLabel && evidence.profileLabel !== 'Quality policy source unavailable') return evidence.profileLabel.replace(/ · (\w+)$/, ' ($1 policy)');
        return bar === null ? 'No bar is set' : 'A bar of ' + bar;
      }

      function renderQualityGauge(evidence, artifact, reviewContract) {
        const anatomy = buildQualityAnatomy(artifact, evidence, reviewContract);
        const version = artifact.version || 1;
        const verdict = verdictFor(evidence, version);
        const score = anatomy.evidenceIsCurrent ? pct(evidence.score) : null;
        const prior = pct(evidence.previousScore);
        const bar = pct(evidence.threshold);
        const shownScore = score !== null ? score : evidence.state === 'stale' ? prior : null;
        const meter = bar !== null && shownScore !== null
          ? '<div class="qv-meter" role="img" aria-label="' + escapeAttribute((score !== null ? 'Scored ' : 'Older version scored ') + shownScore + ' out of 100; ' + bar + ' needed.') + '">' +
            '<div class="qv-bar"><span class="qv-fill' + (score === null ? ' is-history' : '') + '" style="width:' + shownScore + '%"></span>' +
            '<span class="qv-mark" style="left:' + bar + '%" title="' + bar + ' needed"></span></div>' +
            '<div class="qv-scale"><span>' + (score === null ? 'Older version' : 'Scored') + ' <b>' + shownScore + '</b></span><span><b>' + bar + '</b> needed</span></div></div>'
          : '';
        const checks = buildChecks(anatomy, evidence).map(function (c) {
          return '<li class="qv-check" data-status="' + c.status + '">' + oxIcon(CHECK_ICON[c.status], 18) +
            '<span><b>' + escapeHtml(c.label) + '</b><span>' + escapeHtml(c.detail) + '</span></span>' +
            '<span class="qv-state">' + CHECK_WORD[c.status] + '</span></li>';
        }).join('');
        return (
          '<section class="qv" data-quality-gauge data-quality-state="' + escapeAttribute(evidence.state) + '" aria-label="Quality check">' +
          '<div class="qv-verdict">' + oxIcon(verdict.icon, 20) + '<div><p class="qv-title">' + escapeHtml(verdict.title) + '</p><p class="qv-detail">' + escapeHtml(verdict.detail) + '</p></div></div>' +
          meter +
          '<p class="qv-checks-label">What was checked</p><ul class="qv-checks">' + checks + '</ul>' +
          renderQualityAnatomy(artifact, evidence, reviewContract, anatomy) +
          '</section>'
        );
      }

      function buildQualityAnatomy(artifact, evidence, reviewContract) {
        const metadata = asRecord(artifact.metadata);
        const verification = asRecord(artifact.verification || metadata.verification);
        const evalData = asRecord(verification.eval || metadata.eval || artifact.eval);
        const report = asRecord(evalData.report);
        const contract = asRecord(reviewContract);
        const hasCanonicalContract = contract.schemaVersion === 'artifact_review_contract.v1';
        const contractQuality = asRecord(contract.quality);
        const contractEvidence = asRecord(contract.evidence);
        const contractCounts = asRecord(contract.counts);
        const contractLineage = asRecord(contract.lineage);
        const canonicalAnatomy = asRecord(contractQuality.anatomy);
        const snapshot = hasCanonicalContract
          ? canonicalAnatomy
          : asRecord(
              evalData.evaluation_anatomy ||
              evalData.evaluationAnatomy ||
              report.evaluation_anatomy ||
              report.evaluationAnatomy
            );
        const snapshotInput = asRecord(snapshot.inputSummary || snapshot.input_summary || snapshot.input);
        const snapshotEvidence = asRecord(snapshot.evidence);

        function firstRecords(values) {
          for (let i = 0; i < values.length; i += 1) {
            const records = asEvidenceRecords(values[i]);
            if (records.length) return records;
          }
          return [];
        }

        const relationships = firstRecords([
          contractEvidence.relationships,
          snapshotInput.references,
          snapshotInput.relationships,
          snapshot.relationships,
          evalData.relationships,
          evalData.inputs,
          verification.relationships,
          metadata.relationships,
          artifact.relationships,
        ]);
        const criteria = firstRecords(hasCanonicalContract
          ? [snapshot.criteria]
          : [
              snapshot.criteria,
              snapshot.judged,
              evalData.criteria,
              evalData.per_criteria,
              evalData.perCriteria,
              evalData.layers,
              verification.layers,
            ]);
        const supportingLayers = firstRecords([contractEvidence.layers]);
        const measured = firstRecords([
          contractEvidence.measured,
          snapshotEvidence.measured,
          snapshot.measured,
          evalData.measured,
          evalData.checks,
          verification.measured,
        ]);
        const observations = firstRecords([
          contractEvidence.observations,
          snapshotEvidence.observed,
          snapshot.observed,
          snapshot.observations,
          evalData.observations,
          evalData.observed,
          verification.observations,
        ]);

        const referenceCount = nonNegativeInteger(firstNumber([
          snapshotInput.referenceCount,
          snapshotInput.reference_count,
          evalData.reference_count,
          evalData.referenceCount,
        ]));
        const linkedReferenceCount = Math.max(referenceCount === null ? 0 : referenceCount, relationships.length);
        const judgedCount = criteria.length;
        const observedCount = Math.max(
          observations.length,
          nonNegativeInteger(firstNumber([
            snapshot.observedCount,
            snapshot.observed_count,
            evalData.observedCount,
            evalData.observed_count,
          ])) || 0
        );
        const criteriaByPriority = criteria.slice().sort(function (left, right) {
          const leftVerdict = evidenceRecordVerdict(left, evidence.threshold);
          const rightVerdict = evidenceRecordVerdict(right, evidence.threshold);
          if (leftVerdict === false && rightVerdict !== false) return -1;
          if (rightVerdict === false && leftVerdict !== false) return 1;
          const leftScore = evidenceRecordScore(left);
          const rightScore = evidenceRecordScore(right);
          if (leftScore === null || rightScore === null) return 0;
          return leftScore - rightScore;
        });
        const inputCount = 1 + linkedReferenceCount;
        const evidenceIsCurrent = evidence.state === 'cleared' || evidence.state === 'held';
        const scoreLabel = !evidenceIsCurrent || evidence.score === null
          ? 'No current score'
          : Math.round(evidence.score * 100);
        const aggregation = asRecord(snapshot.aggregation);
        const aggregationMethod = firstString([aggregation.method]);
        const criterionScores = criteria.map(evidenceRecordScore);
        const allCriteriaScored =
          criteria.length > 0 && criterionScores.every(function (score) { return score !== null; });
        const criterionWeights = criteria.map(function (criterion) {
          return normalizeRatio(firstNumber([criterion.weight]));
        });
        const allCriteriaWeighted =
          allCriteriaScored && criterionWeights.every(function (weight) { return weight !== null; });
        let calculation = 'Recorded score · formula unavailable';
        if (aggregationMethod === 'mean' && allCriteriaScored) {
          calculation = '(' + criterionScores.map(function (score) {
            return Math.round(score * 100);
          }).join(' + ') + ') ÷ ' + criteria.length + ' = ' + scoreLabel;
        } else if (aggregationMethod === 'weighted_mean' && allCriteriaWeighted) {
          calculation = criterionScores.map(function (score, index) {
            return Math.round(score * 100) + '×' + Math.round(criterionWeights[index] * 100) + '%';
          }).join(' + ') + ' = ' + scoreLabel;
        } else if (aggregationMethod === 'holistic') {
          calculation = 'Holistic judgment = ' + scoreLabel;
        }

        return {
          records: {
            criteria: criteriaByPriority,
            supportingLayers: judgedCount === 0 ? supportingLayers : [],
            measured: measured,
            observations: observations,
            relationships: relationships,
          },
          inputCount: inputCount,
          judgedCount: judgedCount,
          measuredCount: measured.length,
          observedCount: observedCount,
          evidenceIsCurrent: evidenceIsCurrent,
          calculation: calculation,
          hasScoredCriteria: criteria.length > 0,
        };
      }

      // Scoring details, on demand: every criterion and check as a receipt row, how the score is
      // made, and where the bar comes from. Opens in place (.ox-collapse); nothing jumps.
      let anatomyOpen = new URLSearchParams(window.location.search).get('anatomy') === 'expanded';
      function renderQualityAnatomy(artifact, evidence, reviewContract, built) {
        const anatomy = built || buildQualityAnatomy(artifact, evidence, reviewContract);
        const bar = pct(evidence.threshold);
        const calc = anatomy.calculation === 'Recorded score · formula unavailable'
          ? (anatomy.hasScoredCriteria ? 'One recorded score; the breakdown wasn’t saved.' : 'One overall score; no breakdown was saved.')
          : anatomy.calculation.indexOf('Holistic') === 0 ? 'One overall judgment: ' + anatomy.calculation.replace(/^Holistic judgment = /, '') + '.'
          : anatomy.calculation.indexOf('×') !== -1 ? 'Weighted average: ' + anatomy.calculation.replace(/ = /, ' → ') + '.'
          : 'Average of ' + anatomy.judgedCount + ' criteria: ' + anatomy.calculation.replace(/^\(/, '').replace(/\) ÷ \d+ = /, ' → ') + '.';
        const receipts = renderReceipts(artifact, evidence, reviewContract);
        return (
          '<div class="qv-more" data-quality-anatomy>' +
          '<button type="button" class="qv-more__toggle" data-anatomy-toggle aria-expanded="' + anatomyOpen + '" aria-controls="qv-more-body">Scoring details' + (anatomy.evidenceIsCurrent ? '' : ' · context only') + oxIcon('expand', 16) + '</button>' +
          '<div class="ox-collapse" id="qv-more-body"><div><div class="qv-more__body">' +
          receipts +
          '<dl class="qv-facts">' +
          '<dt>How the score is made</dt><dd>' + escapeHtml(anatomy.hasScoredCriteria || anatomy.calculation.indexOf('Holistic') === 0 ? calc : (evidence.score === null ? 'Nothing has been scored yet.' : 'One overall score; no breakdown was saved.')) + '</dd>' +
          '<dt>The bar</dt><dd>' + escapeHtml(barSourceText(evidence, bar)) + '</dd>' +
          '</dl>' +
          '<p class="qv-note">' + escapeHtml(anatomy.evidenceIsCurrent
            ? 'The score comes from the judged criteria. Checks and inspections add confidence; your ruling stays separate.'
            : 'This evidence belongs to another version or failed run, so it can’t clear this one.') + '</p>' +
          '</div></div></div>' +
          '</div>'
        );
      }

      function renderEvidence(artifact, evidence) {
        const scoreLabel = evidence.score === null ? '' : 'Scored ' + Math.round(evidence.score * 100);
        const thresholdLabel = evidence.threshold === null ? 'Not set' : Math.round(evidence.threshold * 100) + ' needed · ' + barSourceText(evidence, Math.round(evidence.threshold * 100));
        const producer = artifact.author || {};
        const source = evidence.sourceUrl && isAllowedArtifactLinkUrl(evidence.sourceUrl)
          ? '<a href="' + escapeAttribute(evidence.sourceUrl) + '" data-source-link>' + escapeHtml(evidence.sourceUrl.replace(/^https?:\/\//i, '').slice(0, 52)) + (evidence.sourceUrl.length > 60 ? '…' : '') + '</a>'
          : 'Attached artifact record';
        return (
          '<div class="evidence-readout">' +
          '<dl class="evidence-facts">' +
          '<dt>Quality</dt><dd>' + escapeHtml(evidence.score === null ? evidence.label : scoreLabel + ' · ' + evidence.label) + '</dd>' +
          '<dt>Bar</dt><dd>' + escapeHtml(thresholdLabel) + '</dd>' +
          '<dt>Produced by</dt><dd>' + escapeHtml(producer.name || 'OrgX agent') + (producer.role ? ' · ' + escapeHtml(producer.role) : '') + '</dd>' +
          '<dt>Review</dt><dd>' + escapeHtml(evidence.reviewer) + '</dd>' +
          '<dt>Source</dt><dd>' + source + '</dd>' +
          '</dl>' +
          '</div>'
        );
      }

      function renderAuthor(artifact, form) {
        const author = artifact.author || {};
        const name = firstString([author.name]) || '';
        const identity = window.OrgXAgentIdentity;
        const who = identity.profile(author.id, name, author.domain, author.role);
        if (!name && !who) return '';
        // Agents: headshot + hover card (state, the artifact, Open in OrgX). People: initials.
        const state = { asking: 'needs_you', verifying: 'verifying', proactive: 'succeeded', working: 'running' }[form] || '';
        return (
          '<span class="who2">' +
          identity.agentCard({
            agent: who ? who.key : '',
            name: who ? who.name : name,
            size: 'inline',
            state: state,
            task: firstString([artifact.title, artifact.name]),
            label: '<b>' + escapeHtml(who ? who.name : name) + '</b>',
          }) +
          '</span>'
        );
      }

      // K1: one row of proof per criterion, check and observation; what
      // fails comes first, and the inline list stops at five rows.
      function receiptStatus(verdict) {
        return verdict === true ? 'met' : verdict === false ? 'fail' : 'unverified';
      }

      function renderReceipts(artifact, evidence, reviewContract) {
        const anatomy = buildQualityAnatomy(artifact, evidence, reviewContract);
        const records = anatomy.records;
        const bar = evidence.threshold === null ? null : Math.round(evidence.threshold * 100);
        const rows = [];
        records.criteria.forEach(function (item) {
          const score = evidenceRecordScore(item);
          const verdict = evidenceRecordVerdict(item, evidence.threshold);
          rows.push({
            status: receiptStatus(verdict),
            label: evidenceRecordLabel(item, 'Criterion'),
            detail: 'Criterion' + (verdict === false && bar !== null ? ' · below the ' + bar + ' bar' : ''),
            value: score === null ? '' : String(Math.round(score * 100)),
          });
        });
        records.supportingLayers.forEach(function (item) {
          const score = evidenceRecordScore(item);
          rows.push({
            status: receiptStatus(evidenceRecordVerdict(item, evidence.threshold)),
            label: evidenceRecordLabel(item, 'Supporting layer'),
            detail: 'Supporting layer · not in the score',
            value: score === null ? '' : String(Math.round(score * 100)),
          });
        });
        records.measured.forEach(function (item) {
          rows.push({
            status: receiptStatus(evidenceRecordVerdict(item, null)),
            label: evidenceRecordLabel(item, 'Check'),
            detail: 'Automatic check',
            value: '',
          });
        });
        records.observations.forEach(function (item) {
          const verdict = evidenceRecordVerdict(item, null);
          rows.push({
            status: verdict === null ? 'unverified' : receiptStatus(verdict),
            label: evidenceRecordLabel(item, 'Observation'),
            detail: 'Inspection · no score',
            value: '',
          });
        });
        if (!rows.length) return '';
        const rank = { fail: 0, yours: 1, pending: 2, unverified: 3, met: 4 };
        rows.sort(function (left, right) { return rank[left.status] - rank[right.status]; });
        // Quiet when fine: met rows collapse into a count; the rest show, five at most.
        const open = rows.filter(function (row) { return row.status !== 'met'; });
        // Inside the details every row shows, failures first.
        const shown = open.concat(rows.filter(function (row) { return row.status === 'met'; })).slice(0, 12);
        const moreLine = rows.length > shown.length ? (rows.length - shown.length) + ' more in OrgX.' : '';
        if (!shown.length) return '<p class="receipts__more">' + escapeHtml(moreLine) + '</p>';
        return (
          '<p class="receipts-label">Every criterion and check</p>' +
          '<div class="receipts" role="list" aria-label="' + escapeAttribute(anatomy.evidenceIsCurrent ? 'Criteria and checks' : 'Criteria and checks, context only') + '">' +
          shown.map(function (row) {
            return '<ox-receipt-row status="' + row.status + '" label="' + escapeAttribute(row.label) + '" detail="' + escapeAttribute(row.detail + (anatomy.evidenceIsCurrent ? '' : ' · context only')) + '"' + (row.value ? ' value="' + escapeAttribute(row.value) + '"' : '') + '></ox-receipt-row>';
          }).join('') +
          '</div>' +
          (moreLine ? '<p class="receipts__more">' + escapeHtml(moreLine) + '</p>' : '')
        );
      }

      // Reading the evidence never needs the footer; deciding does.
      function renderDecisionRow(evidence) {
        if (evidence && evidence.canReview === false) {
          return (
            '<div class="decision-row" aria-label="Read-only review">' +
            '<strong>' + escapeHtml(evidence.reviewControlsLabel || 'Review controls unavailable') + '</strong>' +
            '<span>' + escapeHtml(evidence.reviewControlsDetail || 'This evidence is readable, but no ruling can be recorded here.') + '</span>' +
            '</div>'
          );
        }
        const approvalDisabled = Boolean(evidence && evidence.blocksApproval);
        return (
          (approvalDisabled
            // The verdict above says it; this line names it for the disabled Approve.
            ? '<p class="verification-block sr-only" id="verification-block">Approval is held by policy. ' + escapeHtml(evidence.detail) + '</p>'
            : '') +
          '<div class="composer" id="artifact-change-composer" data-composer hidden>' +
          '<label for="composer-input">What needs to change?</label>' +
          '<textarea id="composer-input" data-composer-input placeholder="Be specific — this creates a decision entity linked to the artifact."></textarea>' +
          '</div>' +
          '<div class="review-feedback" role="status" aria-live="polite" data-review-feedback></div>'
        );
      }

      // The footer's slotted controls: approve, request changes, and the
      // change-request composer's cancel and file. Rendered once per card.
      function renderFooterControls(evidence) {
        if (!evidence || evidence.canReview === false) return '';
        const approvalDisabled = Boolean(evidence.blocksApproval);
        return (
          '<button class="ft-btn" data-action="approve" type="button"' +
          (approvalDisabled ? ' disabled aria-describedby="verification-block"' : '') + '>' +
          '<span class="ft-btn__label">Approve</span>' +
          '</button>' +
          '<button class="ft-btn" data-action="request-changes" type="button" aria-expanded="false" aria-controls="artifact-change-composer">' +
          '<span class="ft-btn__label">Request changes</span>' +
          '</button>' +
          '<button class="ft-btn ft-btn--text" type="button" data-composer-cancel hidden>Cancel</button>' +
          '<button class="ft-btn ft-btn--primary" type="button" data-composer-submit hidden><span class="ft-btn__label">Request changes</span></button>'
        );
      }

      function buildArtifactLink(artifact) {
        // The artifact page (the live room has no ?artifactId= focus).
        return window.OrgXLinks.artifact(artifact.id);
      }

      const KIND_LABEL = { resolve: 'Blocker', inspect: 'Record', sign: 'Artifact' };
      function renderHeader(artifact, tone, form, mode) {
        const deepLink = artifact.id ? buildArtifactLink(artifact) : null;
        const status = String(artifact.status || 'in_review').replace(/_/g, ' ');
        return (
          '<div class="hd"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' +
          oxIcon(mode === 'resolve' ? 'blocked' : 'artifact', 18) +
          '<span class="kind">' + (KIND_LABEL[mode] || 'Artifact') + '</span>' +
          '<span class="src" title="' + escapeAttribute(humanizeCodes(artifact.name || '')) + '"><b>' + escapeHtml(humanizeCodes(artifact.name || 'Artifact')) + '</b>' +
          // The version once: "Launch narrative — v4" is not followed by "· v4".
          (new RegExp('\\bv' + (artifact.version || 1) + '$').test(String(artifact.name || '')) ? '' : ' · v' + escapeHtml(String(artifact.version || 1))) + ' · ' + escapeHtml(status) + '</span>' +
          '<span class="sp"></span>' +
          renderAuthor(artifact, form) +
          (deepLink ? '<a class="ox-open" data-deeplink href="' + escapeAttribute(deepLink) + '" aria-label="Open in OrgX" title="Open in OrgX"><span><span class="ox-open__long">Open in </span>OrgX</span></a>' : '') +
          '</div>'
        );
      }

      /* ── Footer modes (SM3) ──────────────────────────────────────────
         decide   approve (one click) + request changes, or request changes first
                  when approval is held by policy
         compose  file decision + cancel
         sending  the control that was pressed stays, busy and locked
         failed   the same controls return; the note and the review stay */
      let footerMode = 'decide';
      let footerAction = null;
      function setFooterMode(mode, action, evidence) {
        const footer = document.getElementById('reviewFooter');
        if (!footer) return;
        footerMode = mode;
        footerAction = action || footerAction;
        const held = Boolean(evidence && evidence.blocksApproval);
        const approve = footer.querySelector('[data-action="approve"]');
        const changes = footer.querySelector('[data-action="request-changes"]');
        const cancel = footer.querySelector('[data-composer-cancel]');
        const submit = footer.querySelector('[data-composer-submit]');
        const composing = mode === 'compose' || ((mode === 'sending' || mode === 'failed') && footerAction === 'changes');
        function place(button, slot, primary) {
          if (!button) return;
          button.hidden = !slot;
          if (slot) button.setAttribute('slot', slot);
          else button.removeAttribute('slot');
          button.classList.toggle('ft-btn--primary', !!primary);
          button.classList.toggle('ft-btn--text', !primary);
        }
        if (composing) {
          place(approve, null);
          place(changes, null);
          place(cancel, 'action', false);
          place(submit, 'primary', true);
        } else if (held) {
          place(approve, 'action', false);
          place(changes, 'primary', true);
          place(cancel, null);
          place(submit, null);
        } else {
          place(approve, 'primary', true);
          place(changes, 'action', false);
          place(cancel, null);
          place(submit, null);
        }
        const frames = {
          decide: held
            ? { variant: 'confirms-in-orgx', state: 'draft', heading: 'Held', detail: 'approval opens at the bar' }
            : { variant: 'finishes-here', state: 'needs-you', heading: 'Finishes here', detail: 'recorded in OrgX' },
          compose: { variant: 'finishes-here', state: 'needs-you', heading: 'Request changes', detail: 'the author is notified' },
          sending: footerAction === 'changes'
            ? { variant: 'finishes-here', state: 'sending', heading: 'Filing change request', detail: 'linking guidance to the artifact' }
            : { variant: 'finishes-here', state: 'sending', heading: 'Recording approval', detail: 'advancing the artifact' },
          failed: footerAction === 'changes'
            ? { variant: 'finishes-here', state: 'failed', heading: 'Not sent', detail: 'your note is preserved' }
            : { variant: 'finishes-here', state: 'failed', heading: 'Not sent', detail: 'your review is still open' },
        };
        const frame = frames[mode] || frames.decide;
        footer.setAttribute('variant', frame.variant);
        footer.setAttribute('heading', frame.heading);
        footer.setAttribute('detail', frame.detail);
        footer.setAttribute('state', frame.state);
      }

      // ─── interactions ────────────────────────────────────────────
      // Approval is one click. approveArtifact disables the button before its
      // first await, so a double click records one approval; a failure hands
      // the button back.
      function bindApprove(button, onCommit) {
        button.addEventListener('click', function () {
          if (button.disabled || button.getAttribute('aria-busy') === 'true') return;
          onCommit();
        });
      }

      // Play the decisive exit on the live stage, then re-render the
      // resolved state. Exit curve = the decision is leaving the surface.
      function resolveStage(next) {
        const stage = document.querySelector('[data-stage]');
        if (!stage || !stage.animate) { next(); return; }
        stage.classList.add('is-resolving');
        let done = false;
        const finish = function () { if (done) return; done = true; next(); };
        stage.addEventListener('animationend', finish, { once: true });
        setTimeout(finish, 320);
      }
