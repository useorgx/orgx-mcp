<!DOCTYPE html>
<html lang="en" data-widget-mode="escalation" data-accent="amber">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifact Review — OrgX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2302040a'/%3E%3Cpath d='M20 18h18l8 8v22H20z' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M38 18v8h8' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <link rel="stylesheet" href="shared/components/domain-accent.css" />

  <style>
    /*
     * artifact-review — Action widget, Escalation mode.
     * Primary = amber (shares the attention palette with decisions).
     * Spec: orgx-design skill, Widget Types › Action Widgets.
     *
     * Layout:
     *   widget-shell (kicker + title + icon)
     *   → artifact-preview (filmstrip + main preview)
     *   → author attribution (agent-chip) + version badge
     *   → decision block (approve | request changes)
     *   → footer (deep link + last-version meta)
     */

    :root { --ox-primary: #fbbf24; --ox-primary-rgb: 251, 191, 36; }
    @media (prefers-color-scheme: dark) {
      :root { --ox-primary: #fbbf24; --ox-primary-rgb: 251, 191, 36; }
    }
    [data-theme="dark"] {
      --ox-primary: #fbbf24;
      --ox-primary-rgb: 251, 191, 36;
    }

    .stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ─── artifact-preview ──────────────────────────────────────── */
    .artifact-preview {
      border: 1px solid var(--ox-border);
      border-radius: 14px;
      background: var(--ox-well-bg);
      box-shadow: var(--ox-well-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .artifact-preview__body {
      position: relative;
      min-height: 200px;
      max-height: 420px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 0%, rgba(var(--ox-primary-rgb), 0.06), transparent 60%),
        var(--ox-well-bg);
    }

    .artifact-preview__body img,
    .artifact-preview__body iframe {
      max-width: 100%;
      max-height: 380px;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
    }

    .artifact-preview__body pre {
      width: 100%;
      max-height: 380px;
      overflow: auto;
      margin: 0;
      padding: 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.78rem;
      color: var(--ox-text);
      line-height: 1.55;
      border: 1px solid var(--ox-border);
    }

    .artifact-preview__markdown {
      width: 100%;
      max-height: 380px;
      overflow: auto;
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--ox-text);
      padding: 4px 8px;
    }
    .artifact-preview__markdown h1,
    .artifact-preview__markdown h2,
    .artifact-preview__markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.3;
    }
    .artifact-preview__markdown p { margin: 0 0 10px; }

    .artifact-preview__placeholder {
      text-align: center;
      color: var(--ox-text-muted);
      font-size: 0.84rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .artifact-preview__placeholder svg { opacity: 0.55; }

    /* ─── version filmstrip ─────────────────────────────────────── */
    .filmstrip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--ox-border);
      background: var(--ox-panel);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .filmstrip__label {
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ox-text-muted);
      margin-right: 4px;
      flex-shrink: 0;
    }

    .filmstrip__item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--ox-border);
      background: var(--ox-well-bg);
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        border-color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        background var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1));
      flex-shrink: 0;
    }
    .filmstrip__item:hover {
      border-color: rgba(var(--ox-primary-rgb), 0.35);
      color: var(--ox-text);
    }
    .filmstrip__item.is-current {
      color: var(--ox-primary);
      border-color: rgba(var(--ox-primary-rgb), 0.45);
      background: rgba(var(--ox-primary-rgb), 0.1);
    }
    .filmstrip__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
    }

    /* ─── attribution + version badge row ──────────────────────── */
    .attribution-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
      flex-wrap: wrap;
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(var(--ox-primary-rgb), 0.3);
      background: rgba(var(--ox-primary-rgb), 0.1);
      color: var(--ox-primary);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ─── decision block ───────────────────────────────────────── */
    .decision-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 520px) {
      .decision-row { grid-template-columns: 1fr; }
    }

    .decision-card {
      position: relative;
      min-height: 88px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--ox-border);
      background: var(--ox-well-bg);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: var(--ox-text);
      overflow: hidden;
      transition: transform var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        border-color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        background var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1));
    }

    .decision-card:hover {
      transform: translateY(-1px);
      border-color: rgba(var(--card-color-rgb), 0.45);
    }

    .decision-card--approve {
      --card-color-rgb: var(--ox-primary-rgb);
    }

    .decision-card--changes {
      --card-color-rgb: 148, 163, 184; /* slate */
    }

    .decision-card__icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(var(--card-color-rgb), 0.15);
      color: rgb(var(--card-color-rgb));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .decision-card__body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .decision-card__title {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .decision-card__detail {
      font-size: 0.76rem;
      color: var(--ox-text-muted);
    }

    /* Hold-to-approve — the approve card fills from left-to-right
       while the user holds. Release early → resets. 100% → commits.
       The visual affordance doubles as the weight-of-decision signal. */
    .decision-card__hold {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: rgba(var(--card-color-rgb), 0.15);
      border-right: 1px solid rgba(var(--card-color-rgb), 0.45);
      pointer-events: none;
      transition: width var(--ox-dur-instant, 50ms) linear;
    }
    .decision-card.is-holding .decision-card__hold {
      transition: width 800ms linear;
      width: 100%;
    }

    /* Resolve — when a decision commits, the stage leaves decisively.
       Approve / request-changes both accelerate out (exit curve). */
    .stage.is-resolving {
      animation: resolve-out var(--ox-dur-base, 250ms) var(--ox-ease-exit, cubic-bezier(0.4, 0, 1, 1)) forwards;
      pointer-events: none;
    }
    @keyframes resolve-out {
      to { opacity: 0; transform: translateY(-6px) scale(0.99); filter: blur(4px); }
    }

    .decision-card__hint {
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.56rem;
      color: var(--ox-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 1;
    }

    /* ─── composer (changes-requested) ─────────────────────────── */
    .composer {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.06);
    }
    .composer.is-open { display: flex; }

    .composer label {
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ox-text-muted);
    }

    .composer textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--ox-border);
      border-radius: 10px;
      background: var(--ox-panel);
      color: var(--ox-text);
      font: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .composer textarea:focus-visible {
      outline: 2px solid rgba(148, 163, 184, 0.5);
      outline-offset: 2px;
    }

    .composer__actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .composer-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--ox-border);
      background: var(--ox-panel);
      color: var(--ox-text);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .composer-btn--primary {
      background: rgb(148, 163, 184);
      color: var(--ox-bg);
      border-color: rgb(148, 163, 184);
    }

    /* ─── footer ───────────────────────────────────────────────── */
    .widget-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--ox-border);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.65rem;
      color: var(--ox-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .widget-foot a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--ox-primary);
      text-decoration: none;
    }
    .widget-foot a:hover { text-decoration: underline; }

    /* ─── empty + error states ─────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      color: var(--ox-text-muted);
    }
    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(var(--ox-primary-rgb), 0.1);
      color: var(--ox-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    /* 2026 review-desk composition: evidence and consequence share first paint. */
    .review-desk {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 20px;
      align-items: start;
    }
    .review-evidence,
    .review-control {
      min-width: 0;
    }
    .review-control {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-left: 4px;
    }
    .review-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      font-family: var(--ox-mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ox-text-muted);
    }
    .review-status__signal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ox-primary);
      font-weight: 700;
    }
    .review-status__signal::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 5px rgba(var(--ox-primary-rgb), 0.1);
    }
    .review-question {
      margin: 0;
      color: var(--ox-text);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1.3;
      letter-spacing: -0.025em;
    }
    .review-consequence {
      margin: 0;
      color: var(--ox-text-muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .artifact-preview {
      border-radius: 12px;
    }
    .artifact-preview__body {
      min-height: 180px;
      max-height: 260px;
      padding: 12px;
      cursor: zoom-in;
      transition: max-height 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .artifact-preview.is-expanded .artifact-preview__body {
      max-height: 560px;
      cursor: zoom-out;
    }
    .artifact-preview__body img,
    .artifact-preview__body iframe {
      max-height: 236px;
      box-shadow: none;
    }
    .artifact-preview.is-expanded .artifact-preview__body img,
    .artifact-preview.is-expanded .artifact-preview__body iframe {
      max-height: 536px;
    }
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-top: 1px solid var(--ox-border);
      background: var(--ox-panel);
    }
    .preview-toggle {
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--ox-text);
      font: 600 0.72rem var(--ox-font);
      cursor: pointer;
    }
    .viewer-tabs {
      display: flex;
      overflow-x: auto;
      scrollbar-width: thin;
      padding: 4px;
      border-bottom: 1px solid var(--ox-border);
      background: var(--ox-panel);
    }
    .viewer-tab {
      position: relative;
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ox-text-muted);
      font: 700 0.62rem var(--ox-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      flex: 1 0 88px;
      transition:
        color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        background var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1));
    }
    .viewer-tab:hover { color: var(--ox-text); }
    .viewer-tab[aria-selected="true"] {
      color: var(--ox-primary);
      background: rgba(var(--ox-primary-rgb), 0.08);
    }
    .viewer-tab[aria-selected="true"]::after {
      content: '';
      position: absolute;
      inset: auto 20% 2px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }
    .viewer-panel[hidden] { display: none; }
    .viewer-panel--readout {
      min-height: 180px;
      padding: 16px;
      background: var(--ox-well-bg);
    }
    .evidence-readout {
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .evidence-verdict {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 14px;
      align-items: end;
    }
    .evidence-verdict__label {
      color: var(--ox-text);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .evidence-verdict__score {
      color: var(--ox-text);
      font: 700 0.78rem var(--ox-mono);
    }
    .evidence-verdict__detail {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--ox-text-muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }
    .evidence-meter {
      position: relative;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--ox-border);
    }
    .evidence-meter__fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--ox-primary);
    }
    .evidence-meter__threshold {
      position: absolute;
      inset-block: -2px;
      width: 2px;
      border-radius: 999px;
      background: var(--ox-text);
      opacity: 0.7;
    }
    .evidence-facts {
      display: grid;
      grid-template-columns: minmax(92px, 0.34fr) minmax(0, 1fr);
      gap: 8px 12px;
      margin: 0;
      padding-top: 12px;
      border-top: 1px solid var(--ox-border);
      font-size: 0.74rem;
      line-height: 1.45;
    }
    .evidence-facts dt {
      color: var(--ox-text-muted);
      font: 700 0.58rem var(--ox-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .evidence-facts dd {
      min-width: 0;
      margin: 0;
      color: var(--ox-text);
      overflow-wrap: anywhere;
    }
    .evidence-facts a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--ox-primary);
      text-decoration: none;
    }
    .evidence-facts a:hover { text-decoration: underline; }
    .version-history {
      display: grid;
      gap: 0;
    }
    .version-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 52px;
      border-bottom: 1px solid var(--ox-border);
      color: var(--ox-text-muted);
      font-size: 0.74rem;
    }
    .version-row:last-child { border-bottom: 0; }
    .version-row__number {
      color: var(--ox-text);
      font: 700 0.72rem var(--ox-mono);
    }
    .version-row__state {
      color: var(--ox-primary);
      font: 700 0.56rem var(--ox-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .structured-preview {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(100px, 0.34fr) minmax(0, 1fr);
      gap: 8px 14px;
      margin: 0;
      font-size: 0.78rem;
      line-height: 1.5;
    }
    .structured-preview dt {
      color: var(--ox-text-muted);
      font: 700 0.6rem var(--ox-mono);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .structured-preview dd {
      min-width: 0;
      margin: 0;
      color: var(--ox-text);
      overflow-wrap: anywhere;
    }
    .diff-preview {
      width: 100%;
      max-height: 380px;
      overflow: auto;
      margin: 0;
      padding: 12px 0;
      border: 1px solid var(--ox-border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      font: 0.72rem/1.55 var(--ox-mono);
    }
    .diff-preview span {
      display: block;
      min-height: 1.55em;
      padding: 0 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .diff-preview .is-add { color: var(--ox-teal); background: rgba(13, 148, 136, 0.08); }
    .diff-preview .is-remove { color: var(--ox-danger); background: rgba(225, 29, 72, 0.08); }
    .artifact-preview__body video {
      width: 100%;
      max-height: 380px;
      border-radius: 10px;
      background: #000;
    }
    .decision-card:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
    }
    .verification-block {
      padding: 10px 12px;
      color: var(--ox-text-muted);
      background: rgba(217, 119, 6, 0.06);
      font-size: 0.74rem;
      line-height: 1.45;
    }
    .verification-block strong {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 2px;
      color: var(--ox-warning);
    }
    .verification-block strong::before {
      content: '';
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 999px;
      background: currentColor;
    }
    .filmstrip {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .filmstrip__label { display: none; }
    .filmstrip__item {
      min-width: 44px;
      justify-content: center;
      padding-inline: 8px;
    }
    .attribution-row {
      padding: 10px 0 0;
    }
    .decision-row {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .decision-card {
      min-height: 72px;
      padding: 12px;
      align-items: center;
    }
    .decision-card--approve {
      border-color: rgba(var(--ox-primary-rgb), 0.38);
      background: rgba(var(--ox-primary-rgb), 0.1);
    }
    .decision-card__hint {
      top: 8px;
      right: 10px;
    }
    .composer {
      border-radius: 10px;
      padding: 12px;
    }
    .composer__actions {
      flex-wrap: wrap;
    }
    .composer-btn {
      min-height: 44px;
    }
    .review-feedback {
      min-height: 20px;
      color: var(--ox-text-muted);
      font-size: 0.74rem;
      line-height: 1.4;
    }
    .review-feedback[data-tone="error"] { color: var(--ox-danger); }
    .review-feedback[data-tone="success"] { color: var(--ox-teal); }
    .review-receipt {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 14px 0;
    }
    .review-receipt__icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      color: var(--ox-teal);
      background: rgba(13, 148, 136, 0.1);
    }
    .review-receipt__title {
      color: var(--ox-text);
      font-weight: 700;
    }
    .review-receipt__detail {
      margin-top: 3px;
      color: var(--ox-text-muted);
      font-size: 0.78rem;
    }
    .review-skeleton {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
      gap: 20px;
    }
    .review-skeleton__preview {
      height: 250px;
      border-radius: 12px;
    }
    .review-skeleton__control {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-left: 4px;
    }
    .skeleton-line {
      border-radius: 4px;
      background: linear-gradient(90deg, var(--ox-border) 25%, rgba(var(--ox-primary-rgb), 0.12) 50%, var(--ox-border) 75%);
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
    @media (max-width: 760px) {
      .review-desk,
      .review-skeleton { grid-template-columns: 1fr; }
      .review-control,
      .review-skeleton__control {
        position: static;
        padding: 16px 0 0;
        border-top: 1px solid var(--ox-border);
      }
    }
    @media (max-width: 520px) {
      .artifact-preview__body { min-height: 150px; max-height: 210px; }
      .artifact-preview__body img,
      .artifact-preview__body iframe { max-height: 186px; }
      .viewer-panel--readout { min-height: 150px; padding: 12px; }
      .evidence-facts,
      .structured-preview { grid-template-columns: 1fr; gap: 4px; }
      .version-row { grid-template-columns: 40px minmax(0, 1fr); }
      .version-row__state { grid-column: 2; }
      .widget-foot { align-items: flex-start; flex-direction: column; }
      .widget-foot a { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton-line { animation: none; }
      .artifact-preview__body,
      .decision-card,
      .stage.is-resolving { animation: none; transition: none; }
    }
  </style>
  <link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
  <div class="widget-shell-card animate-in">
    <div class="ox-card">
      <div class="ox-card-inner">
        <div class="widget-hero">
          <div class="widget-hero-copy">
            <div class="widget-kicker">Artifact Review</div>
            <div class="widget-title-lg" data-artifact-title>Ready when you are</div>
            <div class="widget-subtitle" data-artifact-subtitle>Approve or request changes — production artifacts need a human signature.</div>
          </div>
          <div class="widget-icon-frame">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg>
          </div>
        </div>

        <div class="stage" data-stage></div>
      </div>
    </div>
  </div>

  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/components/domain-accent.js"></script>
  <script>
    (function () {
      'use strict';

      // ─── SDK shim ────────────────────────────────────────────────
      function callTool(name, args) {
        return window.OrgXWidgetRuntime.callTool(name, args || {});
      }

      function openWidgetLink(url) {
        return window.OrgXWidgetRuntime.openWidgetLink(url);
      }

      function reportSize() {
        window.OrgXWidgetRuntime.reportSize();
      }

      // ─── data resolution ─────────────────────────────────────────
      function resolveArtifact() {
        const toolOutput = (window.openai && window.openai.toolOutput) || null;
        if (toolOutput && toolOutput.artifact) return toolOutput;
        if (toolOutput && toolOutput.id) return { artifact: toolOutput };

        const params = new URLSearchParams(window.location.search);
        const fixtureState = params.get('state') || (params.get('loading') === 'true' ? 'loading' : params.get('demo') === 'true' ? 'urgent' : 'empty');
        if (fixtureState === 'loading') return { state: 'loading' };
        if (fixtureState === 'empty') return { artifact: null };
        if (fixtureState === 'error' || fixtureState === 'degraded') {
          return { artifact: { __error: 'Artifact evidence could not be loaded. The review remains open and no action was taken.' } };
        }

        // Deterministic fixture payload for gallery / dev.
        const payload = {
          artifact: {
            id: 'ART-DEMO',
            name: 'Amplify launch landing — v3',
            artifact_type: 'design.mockup',
            artifact_url: 'https://picsum.photos/seed/orgx-art/900/500',
            status: 'in_review',
            version: 3,
            summary: 'Marketing hero revised for the founder-led narrative. Awaiting design review before the Amplify launch window.',
            author: { name: 'Mark', domain: 'marketing', role: 'Marketing' },
            source_url: 'https://useorgx.com/live/INI-AMPLIFY?artifactId=ART-DEMO',
            verification: {
              eval: {
                status: 'passed',
                score: 0.92,
                threshold: 0.85,
                blocks_completion: false,
              },
              human_review: {
                status: 'in_review',
              },
            },
            versions: [
              { version: 1, updated_at: '2026-04-10T12:00:00Z' },
              { version: 2, updated_at: '2026-04-12T15:30:00Z' },
              { version: 3, updated_at: '2026-04-16T09:15:00Z' },
            ],
            entity_type: 'initiative',
            entity_id: 'INI-AMPLIFY',
          },
        };
        if (fixtureState === 'long') {
          payload.artifact.name = 'Amplify launch landing — founder continuity narrative, proof sequencing, accessibility pass, and responsive release candidate v3';
          payload.artifact.summary = 'A long-form review fixture verifying that the reviewer can still understand the evidence, consequence, owner, version, and next action without horizontal overflow or buried controls.';
        }
        if (fixtureState === 'urgent') {
          payload.artifact.verification.eval.status = 'failed';
          payload.artifact.verification.eval.score = 0.78;
          payload.artifact.verification.eval.blocks_completion = true;
          payload.artifact.verification.eval.proof_impact = 'Required evaluation evidence is below the release bar. Inspect the findings in the live initiative before approval.';
        }
        const artifactKind = params.get('artifactKind');
        if (artifactKind === 'diff') {
          payload.artifact.artifact_type = 'eng.diff_pack';
          payload.artifact.artifact_url = '';
          payload.artifact.content = '';
          payload.artifact.summary = '';
          payload.artifact.code = 'diff --git a/viewer.ts b/viewer.ts\n-old behavior\n+portable viewer contract';
        } else if (artifactKind === 'structured') {
          payload.artifact.artifact_type = 'ops.playbook';
          payload.artifact.artifact_url = '';
          payload.artifact.content = '';
          payload.artifact.summary = '';
          payload.artifact.payload = {
            owner: 'Operations',
            proof_boundary: 'Merged PR and live verification',
            next_action: 'Inspect the rollout receipt',
          };
        } else if (artifactKind === 'video') {
          payload.artifact.artifact_type = 'video';
          payload.artifact.artifact_url = 'https://cdn.useorgx.com/fixtures/artifact-review.mp4';
          payload.artifact.content = '';
          payload.artifact.summary = '';
        } else if (artifactKind === 'not-scored') {
          payload.artifact.verification.eval = {};
        } else if (artifactKind === 'policy-review') {
          payload.artifact.verification.human_review = {
            status: 'approved',
            reviewer_kind: 'system',
            reviewed_by: 'system:autonomy-eval-pass',
            auto_approved: true,
          };
        }
        if (fixtureState === 'resolved') payload.artifact.status = 'approved';
        return payload;
      }

      // ─── helpers ─────────────────────────────────────────────────
      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function escapeAttribute(str) {
        return escapeHtml(String(str || '')).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function formatRelative(iso) {
        if (!iso) return '';
        const then = new Date(iso).getTime();
        const now = Date.now();
        const delta = Math.max(0, now - then);
        const min = Math.round(delta / 60000);
        if (min < 1) return 'just now';
        if (min < 60) return min + 'm ago';
        const hr = Math.round(min / 60);
        if (hr < 24) return hr + 'h ago';
        const d = Math.round(hr / 24);
        return d + 'd ago';
      }

      function asRecord(value) {
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      }

      function firstString(values) {
        for (let i = 0; i < values.length; i += 1) {
          if (typeof values[i] === 'string' && values[i].trim()) return values[i].trim();
        }
        return '';
      }

      function firstNumber(values) {
        for (let i = 0; i < values.length; i += 1) {
          if (typeof values[i] === 'number' && Number.isFinite(values[i])) return values[i];
        }
        return null;
      }

      function normalizeRatio(value) {
        if (typeof value !== 'number' || !Number.isFinite(value)) return null;
        return Math.max(0, Math.min(1, value > 1 ? value / 100 : value));
      }

      function isSafeMediaUrl(value, allowImageData) {
        return /^https?:\/\//i.test(value) || (allowImageData && /^data:image\//i.test(value));
      }

      function normalizeArtifact(artifact) {
        if (!artifact || typeof artifact !== 'object') return artifact;
        const metadata = asRecord(artifact.metadata);
        const author = asRecord(artifact.author || artifact.producer || metadata.producer);
        const versions = Array.isArray(artifact.versions)
          ? artifact.versions
          : Array.isArray(artifact.version_history)
            ? artifact.version_history
            : [];
        return Object.assign({}, artifact, {
          id: firstString([artifact.id, artifact.artifact_id, artifact.artifactId]),
          name: firstString([artifact.name, artifact.title, artifact.label]) || 'Artifact review',
          artifact_type: firstString([artifact.artifact_type, artifact.artifactType, artifact.type, artifact.kind]) || 'document',
          artifact_url: firstString([artifact.artifact_url, artifact.artifactUrl, artifact.preview_url, artifact.previewUrl, artifact.url]),
          summary: firstString([artifact.summary, artifact.description, metadata.summary]),
          content: firstString([artifact.content, artifact.body, artifact.markdown, metadata.content, metadata.body]),
          code: firstString([artifact.code, artifact.diff, metadata.code, metadata.diff]),
          status: firstString([artifact.status, artifact.review_status, artifact.reviewStatus]) || 'in_review',
          version: firstNumber([artifact.version, artifact.version_number, artifact.versionNumber]) || 1,
          versions: versions,
          author: Object.assign({}, author, {
            name: firstString([author.name, author.label, artifact.producer_name, artifact.producerName]) || 'OrgX agent',
            role: firstString([author.role, author.type, artifact.producer_role, artifact.producerRole]),
            domain: firstString([author.domain, author.agent_type, author.agentType]) || 'orchestrator',
          }),
        });
      }

      function resolveIncomingArtifact(payload) {
        if (!payload || typeof payload !== 'object') return payload;
        const data = asRecord(payload.data);
        const result = asRecord(payload.result);
        const candidate = payload.artifact || data.artifact || result.artifact || payload;
        const error = payload.error || data.error || result.error;
        if (error && !(candidate && (candidate.id || candidate.artifact_id || candidate.artifactId))) {
          const detail = typeof error === 'string'
            ? error
            : firstString([error.message, error.detail, error.code]) || 'Artifact evidence could not be loaded.';
          return {
            __error: detail + ' The review remains open and no action was taken.',
            __errorCode: typeof error === 'object' ? firstString([error.code, error.kind]) : '',
          };
        }
        return normalizeArtifact(candidate);
      }

      function resolveReviewerSignal(review) {
        const reviewedBy = firstString([review.reviewed_by, review.reviewedBy]);
        const kind = firstString([review.reviewer_kind, review.reviewerKind]).toLowerCase();
        if (review.auto_approved === true || review.autoApproved === true || kind === 'system' || reviewedBy.toLowerCase().startsWith('system:')) {
          return 'Auto-approved by policy';
        }
        const named = firstString([review.reviewer_name, review.reviewerName, review.reviewer_display_name, review.reviewerDisplayName]);
        if (named && !/^user_|^[0-9a-f-]{32,}$/i.test(named)) return 'Reviewed by ' + named;
        if (reviewedBy || review.reviewer || review.reviewer_id || review.reviewerId) return 'Review recorded';
        return 'Awaiting human decision';
      }

      function resolveEvidence(artifact) {
        const metadata = asRecord(artifact.metadata);
        const verification = asRecord(artifact.verification || metadata.verification);
        const evalData = asRecord(verification.eval || metadata.eval || artifact.eval);
        const review = asRecord(metadata.review || verification.human_review || verification.humanReview || artifact.review);
        const score = normalizeRatio(firstNumber([
          evalData.score,
          evalData.quality_score,
          evalData.qualityScore,
          verification.score,
          artifact.quality_score,
          artifact.qualityScore,
        ]));
        const threshold = normalizeRatio(firstNumber([
          evalData.threshold,
          evalData.quality_threshold,
          evalData.qualityThreshold,
          verification.threshold,
          artifact.quality_threshold,
          artifact.qualityThreshold,
        ]));
        const evalStatus = firstString([
          evalData.status,
          evalData.eval_status,
          evalData.evalStatus,
          verification.status,
          artifact.eval_status,
          artifact.evalStatus,
        ]).toLowerCase();
        const blocksApproval = [
          evalData.blocks_completion,
          evalData.blocksCompletion,
          verification.blocks_completion,
          verification.blocksCompletion,
          artifact.blocks_completion,
          artifact.blocksCompletion,
        ].some(function (value) { return value === true; });
        let state = 'not_scored';
        if (blocksApproval || ['failed', 'blocked', 'stale', 'held'].includes(evalStatus)) state = 'held';
        else if (['queued', 'running', 'pending', 'scoring'].includes(evalStatus)) state = 'pending';
        else if (evalStatus === 'passed' || (score !== null && threshold !== null && score >= threshold)) state = 'cleared';
        const labels = {
          cleared: 'Verification cleared',
          held: 'Verification held',
          pending: 'Verification pending',
          not_scored: 'Not scored yet',
        };
        const details = {
          cleared: 'Recorded evidence meets the current quality bar.',
          held: firstString([evalData.proof_impact, evalData.proofImpact, verification.proof_impact, verification.proofImpact]) || 'Required evidence has not cleared the current quality bar.',
          pending: 'The evaluation is still running. Approval stays available only when policy allows it.',
          not_scored: 'No evaluation result is attached. Review the provenance before signing off.',
        };
        return {
          state: state,
          label: labels[state],
          detail: details[state],
          score: score,
          threshold: threshold,
          evalStatus: evalStatus || 'not attached',
          blocksApproval: blocksApproval,
          reviewer: resolveReviewerSignal(review),
          reviewStatus: firstString([review.status, artifact.review_status, artifact.reviewStatus]) || artifact.status,
          sourceUrl: firstString([artifact.source_url, artifact.sourceUrl, artifact.artifact_url, artifact.artifactUrl, metadata.source_url, metadata.sourceUrl]),
        };
      }

      function readablePayload(artifact) {
        const metadata = asRecord(artifact.metadata);
        const candidates = [artifact.payload, artifact.data, metadata.payload, metadata.data];
        for (let i = 0; i < candidates.length; i += 1) {
          const value = candidates[i];
          if (value && typeof value === 'object') return value;
        }
        return null;
      }

      function renderStructured(value) {
        const entries = Object.entries(asRecord(value)).slice(0, 12);
        if (!entries.length) return '';
        return '<dl class="structured-preview">' + entries.map(function (entry) {
          const raw = entry[1];
          const serialized = raw && typeof raw === 'object' ? JSON.stringify(raw) : String(raw ?? '—');
          const display = serialized.length > 260 ? serialized.slice(0, 257) + '…' : serialized;
          return '<dt>' + escapeHtml(entry[0].replace(/[_-]+/g, ' ')) + '</dt><dd>' + escapeHtml(display) + '</dd>';
        }).join('') + '</dl>';
      }

      function renderDiff(text) {
        return '<pre class="diff-preview" aria-label="Artifact diff">' + String(text || '').split('\n').map(function (line) {
          const cls = line.startsWith('+') && !line.startsWith('+++')
            ? ' class="is-add"'
            : line.startsWith('-') && !line.startsWith('---')
              ? ' class="is-remove"'
              : '';
          return '<span' + cls + '>' + escapeHtml(line || ' ') + '</span>';
        }).join('') + '</pre>';
      }

      function renderPreview(artifact) {
        const type = (artifact.artifact_type || '').toLowerCase();
        const url = artifact.artifact_url || '';
        const content = artifact.content || artifact.summary || '';
        const code = artifact.code || '';
        const payload = readablePayload(artifact);

        if (isSafeMediaUrl(url, true) && (type.startsWith('image') || type.includes('mockup') || type.includes('screenshot') || type.includes('design'))) {
          return '<img src="' + escapeAttribute(url) + '" alt="' + escapeAttribute(artifact.name || 'artifact') + '" />';
        }

        if (isSafeMediaUrl(url, false) && (type.includes('video') || /\.(mp4|webm|mov)(?:$|[?#])/i.test(url))) {
          return '<video controls preload="metadata" aria-label="' + escapeAttribute(artifact.name || 'Artifact video') + '"><source src="' + escapeAttribute(url) + '" /></video>';
        }

        if (type.includes('diff') || (/^(?:diff --git|@@ |\+\+\+ |--- )/m.test(code))) {
          return renderDiff(code || content);
        }

        if (type.includes('code') || type.includes('pull_request') || type.includes('tech_spec') || code) {
          return '<pre>' + escapeHtml(code || content) + '</pre>';
        }

        if (type.includes('markdown') || type.includes('doc') || type.includes('report') || type.includes('brief') || content) {
          return '<div class="artifact-preview__markdown">' + escapeHtml(content).replace(/\n\n/g, '</p><p>').replace(/^(.+)$/, '<p>$1</p>') + '</div>';
        }

        if (payload) return renderStructured(payload);

        // Fallback: placeholder with summary
        return (
          '<div class="artifact-preview__placeholder">' +
          '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h7M7 16h10"/></svg>' +
          '<div>' + escapeHtml(artifact.summary || 'Preview unavailable for this artifact type.') + '</div>' +
          '</div>'
        );
      }

      function renderHistory(artifact) {
        const versions = Array.isArray(artifact.versions) && artifact.versions.length ? artifact.versions : [{ version: artifact.version || 1 }];
        const current = artifact.version || versions[versions.length - 1].version;
        return (
          '<div class="version-history" aria-label="Artifact version history">' +
          versions.slice().reverse().map(function (v) {
            const isCurrent = v.version === current;
            return (
              '<div class="version-row">' +
              '<span class="version-row__number">v' + escapeHtml(String(v.version || 1)) + '</span>' +
              '<span>' + escapeHtml(v.updated_at ? formatRelative(v.updated_at) : (isCurrent ? 'Current revision' : 'Prior revision')) + '</span>' +
              '<span class="version-row__state">' + (isCurrent ? 'Current' : 'Recorded') + '</span>' +
              '</div>'
            );
          }).join('') +
          '</div>'
        );
      }

      function renderEvidence(artifact, evidence) {
        const scoreLabel = evidence.score === null ? '—' : Math.round(evidence.score * 100) + ' / 100';
        const thresholdLabel = evidence.threshold === null ? 'Not set' : Math.round(evidence.threshold * 100) + ' / 100';
        const scoreWidth = evidence.score === null ? 0 : Math.round(evidence.score * 100);
        const thresholdLeft = evidence.threshold === null ? null : Math.round(evidence.threshold * 100);
        const producer = artifact.author || {};
        const source = evidence.sourceUrl && /^https?:\/\//i.test(evidence.sourceUrl)
          ? '<a href="' + escapeAttribute(evidence.sourceUrl) + '" data-source-link>' + escapeHtml(evidence.sourceUrl.replace(/^https?:\/\//i, '').slice(0, 52)) + (evidence.sourceUrl.length > 60 ? '…' : '') + '</a>'
          : 'Attached artifact record';
        return (
          '<div class="evidence-readout">' +
          '<div class="evidence-verdict">' +
          '<span class="evidence-verdict__label">' + escapeHtml(evidence.label) + '</span>' +
          '<span class="evidence-verdict__score">' + scoreLabel + '</span>' +
          '<p class="evidence-verdict__detail">' + escapeHtml(evidence.detail) + '</p>' +
          '</div>' +
          '<div class="evidence-meter" role="meter" aria-label="Artifact quality score" aria-valuemin="0" aria-valuemax="100"' + (evidence.score === null ? '' : ' aria-valuenow="' + scoreWidth + '"') + '>' +
          '<span class="evidence-meter__fill" style="width:' + scoreWidth + '%"></span>' +
          (thresholdLeft === null ? '' : '<span class="evidence-meter__threshold" style="left:' + thresholdLeft + '%" title="Quality threshold"></span>') +
          '</div>' +
          '<dl class="evidence-facts">' +
          '<dt>Quality bar</dt><dd>' + thresholdLabel + ' · ' + escapeHtml(evidence.evalStatus.replace(/_/g, ' ')) + '</dd>' +
          '<dt>Produced by</dt><dd>' + escapeHtml(producer.name || 'OrgX agent') + (producer.role ? ' · ' + escapeHtml(producer.role) : '') + '</dd>' +
          '<dt>Manual review</dt><dd>' + escapeHtml(evidence.reviewer) + ' · ' + escapeHtml(String(evidence.reviewStatus || 'in review').replace(/_/g, ' ')) + '</dd>' +
          '<dt>Source</dt><dd>' + source + '</dd>' +
          '</dl>' +
          '</div>'
        );
      }

      function renderAttribution(artifact) {
        const authorChip = window.OrgxDomain
          ? window.OrgxDomain.renderAgentChip(artifact.author || { name: 'Unassigned', domain: 'orchestrator' }, { size: 'sm' })
          : '';
        const version = artifact.version || 1;
        return (
          '<div class="attribution-row">' +
          authorChip +
          '<span class="version-badge">v' + version + ' · ' + (artifact.status || 'in_review').replace('_', ' ') + '</span>' +
          '</div>'
        );
      }

      function renderDecisionRow(evidence) {
        const approvalDisabled = Boolean(evidence && evidence.blocksApproval);
        return (
          '<div class="decision-row" aria-label="Review actions">' +
          '<button class="decision-card decision-card--approve" data-action="approve" type="button"' + (approvalDisabled ? ' disabled aria-describedby="verification-block"' : '') + '>' +
          '<div class="decision-card__hold" aria-hidden="true"></div>' +
          '<span class="decision-card__hint">' + (approvalDisabled ? 'evidence held' : 'hold to approve') + '</span>' +
          '<div class="decision-card__icon">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
          '</div>' +
          '<div class="decision-card__body">' +
          '<div class="decision-card__title">' + (approvalDisabled ? 'Verification blocked' : 'Approve') + '</div>' +
          '<div class="decision-card__detail">' + (approvalDisabled ? 'Inspect the held evidence before signing off.' : 'Sign off and advance to production.') + '</div>' +
          '</div>' +
          '</button>' +
          '<button class="decision-card decision-card--changes" data-action="request-changes" type="button" aria-expanded="false" aria-controls="artifact-change-composer">' +
          '<div class="decision-card__icon">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3l7 7-11 11H3v-7z"/></svg>' +
          '</div>' +
          '<div class="decision-card__body">' +
          '<div class="decision-card__title">Request changes</div>' +
          '<div class="decision-card__detail">File a change request — author is notified.</div>' +
          '</div>' +
          '</button>' +
          '</div>' +
          '<div class="composer" id="artifact-change-composer" data-composer>' +
          '<label for="composer-input">What needs to change?</label>' +
          '<textarea id="composer-input" data-composer-input placeholder="Be specific — this creates a decision entity linked to the artifact."></textarea>' +
          '<div class="composer__actions">' +
          '<button class="composer-btn" type="button" data-composer-cancel>Cancel</button>' +
          '<button class="composer-btn composer-btn--primary" type="button" data-composer-submit>File decision</button>' +
          '</div>' +
          '</div>' +
          (approvalDisabled
            ? '<div class="verification-block" id="verification-block"><strong>Approval is held by policy</strong>' + escapeHtml(evidence.detail) + '</div>'
            : '') +
          '<div class="review-feedback" role="status" aria-live="polite" data-review-feedback></div>'
        );
      }

      function buildArtifactLink(artifact) {
        const artifactId = encodeURIComponent(artifact.id);
        if (artifact.entity_type === 'initiative' && artifact.entity_id) {
          return 'https://useorgx.com/live/' + encodeURIComponent(artifact.entity_id) + '?artifactId=' + artifactId;
        }
        return 'https://useorgx.com/artifacts/' + artifactId;
      }

      function renderFoot(artifact) {
        const lastVersion = Array.isArray(artifact.versions) && artifact.versions.length
          ? artifact.versions[artifact.versions.length - 1]
          : null;
        const lastLabel = lastVersion && lastVersion.updated_at
          ? 'Updated ' + formatRelative(lastVersion.updated_at)
          : '';
        const deepLink = artifact.id ? buildArtifactLink(artifact) : null;
        return (
          '<div class="widget-foot">' +
          '<span>' + escapeHtml(lastLabel || 'Fresh artifact') + '</span>' +
          (deepLink ? '<a data-deeplink href="' + deepLink + '">Open in OrgX →</a>' : '') +
          '</div>'
        );
      }

      // ─── interactions ────────────────────────────────────────────
      function bindHoldToApprove(card, onCommit) {
        let timer = null;
        let committed = false;

        function start(e) {
          if (committed || card.disabled) return;
          e.preventDefault();
          card.classList.add('is-holding');
          timer = setTimeout(function () {
            committed = true;
            card.classList.remove('is-holding');
            onCommit();
          }, 820);
        }
        function cancel() {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
          card.classList.remove('is-holding');
        }

        card.addEventListener('pointerdown', start);
        card.addEventListener('pointerup', cancel);
        card.addEventListener('pointerleave', cancel);
        card.addEventListener('pointercancel', cancel);
        card.addEventListener('keydown', function (e) {
          if ((e.key === 'Enter' || e.key === ' ') && !committed) {
            e.preventDefault();
            start(e);
          }
        });
        card.addEventListener('keyup', cancel);
      }

      // Play the decisive exit on the live stage, then re-render the
      // resolved state. Exit curve = the decision is leaving the surface.
      function resolveStage(next) {
        const stage = document.querySelector('[data-stage]');
        if (!stage || !stage.animate) { next(); return; }
        stage.classList.add('is-resolving');
        let done = false;
        const finish = function () { if (done) return; done = true; next(); };
        stage.addEventListener('animationend', finish, { once: true });
        setTimeout(finish, 320);
      }

      async function approveArtifact(artifact) {
        const button = document.querySelector('[data-action="approve"]');
        const feedback = document.querySelector('[data-review-feedback]');
        const evidence = resolveEvidence(artifact);
        if (evidence.blocksApproval) {
          if (feedback) {
            feedback.dataset.tone = 'error';
            feedback.textContent = 'Approval is blocked until required verification evidence clears.';
          }
          return;
        }
        if (button) {
          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
          const label = button.querySelector('.decision-card__title');
          if (label) label.textContent = 'Approving…';
        }
        if (feedback) {
          feedback.dataset.tone = '';
          feedback.textContent = 'Recording approval and advancing the artifact…';
        }
        try {
          await callTool('orgx_act', {
            type: 'artifact',
            id: artifact.id,
            action: 'approve',
          });
          resolveStage(function () { render(Object.assign({}, artifact, { status: 'approved' })); });
        } catch (err) {
          console.warn('[artifact-review] approve failed', err);
          if (button) {
            button.disabled = false;
            button.removeAttribute('aria-busy');
            const label = button.querySelector('.decision-card__title');
            if (label) label.textContent = 'Approve';
          }
          if (feedback) {
            feedback.dataset.tone = 'error';
            feedback.textContent = 'Approval failed. Your review is still open; try again.';
          }
        }
      }

      async function submitChangeRequest(artifact, notes) {
        const button = document.querySelector('[data-composer-submit]');
        const input = document.querySelector('[data-composer-input]');
        const feedback = document.querySelector('[data-review-feedback]');
        if (button) {
          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
          button.textContent = 'Filing…';
        }
        if (input) input.disabled = true;
        if (feedback) {
          feedback.dataset.tone = '';
          feedback.textContent = 'Linking guidance to the artifact…';
        }
        try {
          await callTool('orgx_decide', {
            action: 'create',
            title: 'Changes requested on ' + (artifact.name || 'artifact'),
            summary: notes,
            context: 'Artifact review change request',
            entity_type: 'artifact',
            entity_id: artifact.id,
            initiative_id: artifact.entity_type === 'initiative' ? artifact.entity_id : undefined,
          });
          await callTool('orgx_act', {
            type: 'artifact',
            id: artifact.id,
            action: 'request_changes',
          });
          resolveStage(function () { render(Object.assign({}, artifact, { status: 'changes_requested' })); });
        } catch (err) {
          console.warn('[artifact-review] change request failed', err);
          if (button) {
            button.disabled = false;
            button.removeAttribute('aria-busy');
            button.textContent = 'File decision';
          }
          if (input) input.disabled = false;
          if (feedback) {
            feedback.dataset.tone = 'error';
            feedback.textContent = 'Change request failed. Your note is preserved; try again.';
          }
        }
      }

      // ─── render ─────────────────────────────────────────────────
      function render(artifact) {
        artifact = normalizeArtifact(artifact);
        const stage = document.querySelector('[data-stage]');
        const title = document.querySelector('[data-artifact-title]');
        const subtitle = document.querySelector('[data-artifact-subtitle]');

        if (artifact && artifact.__loading) {
          title.textContent = 'Loading review evidence';
          subtitle.textContent = 'Holding the action surface until the artifact and provenance arrive.';
          stage.innerHTML = (
            '<div class="review-skeleton" aria-label="Loading artifact review">' +
            '<div class="skeleton-line review-skeleton__preview"></div>' +
            '<div class="review-skeleton__control">' +
            '<div class="skeleton-line" style="width:42%;height:10px"></div>' +
            '<div class="skeleton-line" style="width:94%;height:24px"></div>' +
            '<div class="skeleton-line" style="width:82%;height:14px"></div>' +
            '<div class="skeleton-line" style="width:100%;height:72px"></div>' +
            '<div class="skeleton-line" style="width:100%;height:72px"></div>' +
            '</div></div>'
          );
          reportSize();
          return;
        }

        if (artifact && artifact.__error) {
          title.textContent = 'Review evidence unavailable';
          subtitle.textContent = 'No action was taken. Restore the evidence before signing off.';
          stage.innerHTML = (
            '<div class="empty-state animate-in">' +
            '<div class="empty-icon" style="color:var(--ox-danger);background:rgba(225,29,72,.08)">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>' +
            '</div><strong style="color:var(--ox-text)">Evidence disconnected</strong>' +
            '<div style="max-width:38ch;margin-top:6px">' + escapeHtml(artifact.__error) + '</div>' +
            '<button type="button" class="composer-btn" style="margin-top:14px" onclick="location.reload()">Retry evidence</button>' +
            '</div>'
          );
          reportSize();
          return;
        }

        if (!artifact || !artifact.id) {
          stage.classList.remove('is-resolving');
          stage.innerHTML = (
            '<div class="empty-state animate-in">' +
            '<div class="empty-icon">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
            '</div>' +
            '<div>No artifacts waiting for review.</div>' +
            '</div>'
          );
          title.textContent = 'Inbox clear';
          subtitle.textContent = 'Nothing to sign off on right now.';
          reportSize();
          return;
        }

        title.textContent = artifact.name || 'Artifact review';
        const isResolved = artifact.status === 'approved' || artifact.status === 'changes_requested';
        const evidence = resolveEvidence(artifact);
        subtitle.textContent = isResolved
          ? (artifact.status === 'approved' ? 'Signed off. Execution can continue from this version.' : 'Guidance filed. The author owns the next revision.')
          : (artifact.summary || 'Production artifact awaiting approval.');

        stage.classList.remove('is-resolving');
        if (isResolved) {
          stage.innerHTML = (
            '<div class="review-receipt animate-in">' +
            '<div class="review-receipt__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg></div>' +
            '<div><div class="review-receipt__title">' + (artifact.status === 'approved' ? 'Approval recorded' : 'Revision requested') + '</div>' +
            '<div class="review-receipt__detail">v' + escapeHtml(String(artifact.version || 1)) + ' · ' + (artifact.status === 'approved' ? 'artifact advanced' : 'author notified') + '</div></div>' +
            '</div>' +
            renderAttribution(artifact) +
            renderFoot(artifact)
          );
          reportSize();
          return;
        }

        stage.innerHTML = (
          '<div class="review-desk animate-in">' +
          '<div class="review-evidence">' +
          '<div class="artifact-preview" data-preview>' +
          '<div class="viewer-tabs" role="tablist" aria-label="Artifact viewer">' +
          '<button class="viewer-tab" type="button" role="tab" aria-selected="true" aria-controls="artifact-preview-panel" data-view-tab="preview">Preview</button>' +
          '<button class="viewer-tab" type="button" role="tab" aria-selected="false" aria-controls="artifact-evidence-panel" data-view-tab="evidence" tabindex="-1">Evidence</button>' +
          '<button class="viewer-tab" type="button" role="tab" aria-selected="false" aria-controls="artifact-history-panel" data-view-tab="history" tabindex="-1">History</button>' +
          '</div>' +
          '<div class="viewer-panel" id="artifact-preview-panel" role="tabpanel" data-view-panel="preview">' +
          '<div class="artifact-preview__body" data-preview-body>' + renderPreview(artifact) + '</div>' +
          '<div class="preview-toolbar">' +
          '<span style="color:var(--ox-text-muted);font:700 .58rem var(--ox-mono);letter-spacing:.08em;text-transform:uppercase">' + escapeHtml(artifact.artifact_type.replace(/[_.-]+/g, ' ')) + ' · v' + escapeHtml(String(artifact.version)) + '</span>' +
          '<button class="preview-toggle" type="button" data-preview-toggle aria-expanded="false">Expand evidence</button>' +
          '</div></div>' +
          '<div class="viewer-panel viewer-panel--readout" id="artifact-evidence-panel" role="tabpanel" data-view-panel="evidence" hidden>' + renderEvidence(artifact, evidence) + '</div>' +
          '<div class="viewer-panel viewer-panel--readout" id="artifact-history-panel" role="tabpanel" data-view-panel="history" hidden>' + renderHistory(artifact) + '</div>' +
          '</div>' +
          renderAttribution(artifact) +
          '</div>' +
          '<div class="review-control">' +
          '<div class="review-status"><span class="review-status__signal">' + (evidence.blocksApproval ? 'Verification held' : 'Needs your signature') + '</span><span>v' + escapeHtml(String(artifact.version || 1)) + '</span></div>' +
          '<h2 class="review-question">Does this evidence meet the bar to advance?</h2>' +
          '<p class="review-consequence">Approval releases this version to the next execution step. A change request returns precise guidance to ' + escapeHtml((artifact.author && artifact.author.name) || 'the author') + '.</p>' +
          renderDecisionRow(evidence) +
          '</div></div>' +
          renderFoot(artifact)
        );

        // Wire decisions
        const approveCard = stage.querySelector('[data-action="approve"]');
        if (approveCard) bindHoldToApprove(approveCard, function () { approveArtifact(artifact); });

        const changesCard = stage.querySelector('[data-action="request-changes"]');
        const composer = stage.querySelector('[data-composer]');
        const composerInput = stage.querySelector('[data-composer-input]');
        const composerCancel = stage.querySelector('[data-composer-cancel]');
        const composerSubmit = stage.querySelector('[data-composer-submit]');

        if (changesCard && composer) {
          changesCard.addEventListener('click', function () {
            composer.classList.add('is-open');
            changesCard.setAttribute('aria-expanded', 'true');
            if (composerInput) composerInput.focus();
            reportSize();
          });
        }
        if (composerCancel) {
          composerCancel.addEventListener('click', function () {
            composer.classList.remove('is-open');
            if (changesCard) changesCard.setAttribute('aria-expanded', 'false');
            if (changesCard) changesCard.focus();
            reportSize();
          });
        }
        if (composerSubmit) {
          composerSubmit.addEventListener('click', function () {
            const notes = (composerInput.value || '').trim();
            if (!notes) {
              composerInput.focus();
              return;
            }
            submitChangeRequest(artifact, notes);
          });
        }

        const preview = stage.querySelector('[data-preview]');
        const previewToggle = stage.querySelector('[data-preview-toggle]');
        function togglePreview() {
          if (!preview || !previewToggle) return;
          const expanded = preview.classList.toggle('is-expanded');
          previewToggle.setAttribute('aria-expanded', String(expanded));
          previewToggle.textContent = expanded ? 'Compress evidence' : 'Expand evidence';
          reportSize();
        }
        if (previewToggle) previewToggle.addEventListener('click', togglePreview);
        const viewTabs = Array.from(stage.querySelectorAll('[data-view-tab]'));
        const viewPanels = Array.from(stage.querySelectorAll('[data-view-panel]'));
        function selectView(name, focus) {
          viewTabs.forEach(function (tab) {
            const selected = tab.getAttribute('data-view-tab') === name;
            tab.setAttribute('aria-selected', String(selected));
            tab.tabIndex = selected ? 0 : -1;
            if (selected && focus) tab.focus();
          });
          viewPanels.forEach(function (panel) {
            panel.hidden = panel.getAttribute('data-view-panel') !== name;
          });
          if (previewToggle) previewToggle.hidden = name !== 'preview';
          reportSize();
        }
        viewTabs.forEach(function (tab, index) {
          tab.addEventListener('click', function () {
            selectView(tab.getAttribute('data-view-tab'), false);
          });
          tab.addEventListener('keydown', function (event) {
            let nextIndex = index;
            if (event.key === 'ArrowRight') nextIndex = (index + 1) % viewTabs.length;
            else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + viewTabs.length) % viewTabs.length;
            else if (event.key === 'Home') nextIndex = 0;
            else if (event.key === 'End') nextIndex = viewTabs.length - 1;
            else return;
            event.preventDefault();
            selectView(viewTabs[nextIndex].getAttribute('data-view-tab'), true);
          });
        });
        stage.onkeydown = function (event) {
          if (event.key !== 'Escape' || !composer || !composer.classList.contains('is-open')) return;
          event.preventDefault();
          composer.classList.remove('is-open');
          if (changesCard) {
            changesCard.setAttribute('aria-expanded', 'false');
            changesCard.focus();
          }
          reportSize();
        };

        // Wire deep link
        const deepLink = stage.querySelector('[data-deeplink]');
        if (deepLink) {
          deepLink.addEventListener('click', function (e) {
            e.preventDefault();
            openWidgetLink(deepLink.getAttribute('href'));
          });
        }
        const sourceLink = stage.querySelector('[data-source-link]');
        if (sourceLink) {
          sourceLink.addEventListener('click', function (event) {
            event.preventDefault();
            openWidgetLink(sourceLink.getAttribute('href'));
          });
        }

        reportSize();
      }

      // Bootstrap
      function bootstrap() {
        const fixtureParams = new URLSearchParams(window.location.search);
        const hasFixture = fixtureParams.has('state') || fixtureParams.get('demo') === 'true' || fixtureParams.get('loading') === 'true';
        if (hasFixture || window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
          const payload = resolveArtifact();
          if (payload && payload.state === 'loading') {
            render({ __loading: true });
            return;
          }
          render(resolveIncomingArtifact(payload));
          return;
        }
        window.OrgXWidgetRuntime.initWidget({
          render: function (payload) {
            if (!payload) {
              render({ __loading: true });
              return;
            }
            render(resolveIncomingArtifact(payload));
          },
        });
      }

      document.addEventListener('DOMContentLoaded', bootstrap);
      window.addEventListener('resize', reportSize);
    })();
  </script>
</body>
</html>
