<!DOCTYPE html>
<html lang="en" data-widget-mode="escalation">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifact verification — OrgX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2302040a'/%3E%3Cpath d='M20 18h18l8 8v22H20z' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M38 18v8h8' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='m26 36 4 4 8-10' fill='none' stroke='%2300c9a7' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />

  <style>
    :root {
      --ox-primary: #fbbf24;
      --ox-primary-rgb: 251, 191, 36;
      --verification-signal: #fbbf24;
      --verification-signal-rgb: 251, 191, 36;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ox-primary: #fbbf24;
        --ox-primary-rgb: 251, 191, 36;
      }
    }

    [data-theme="dark"] {
      --ox-primary: #fbbf24;
      --ox-primary-rgb: 251, 191, 36;
    }

    body { min-width: 0; }

    .verification-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      background:
        radial-gradient(circle at 92% -10%, rgba(var(--verification-signal-rgb), 0.12), transparent 42%),
        var(--ox-panel);
      box-shadow: var(--ox-well-shadow);
    }

    .verification-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, var(--verification-signal), transparent 82%);
      box-shadow: 0 0 22px rgba(var(--verification-signal-rgb), 0.55);
    }

    .verification-card[data-tone="positive"] {
      --verification-signal: #00c9a7;
      --verification-signal-rgb: 0, 201, 167;
    }
    .verification-card[data-tone="critical"] {
      --verification-signal: #fb7185;
      --verification-signal-rgb: 251, 113, 133;
    }
    .verification-card[data-tone="active"] {
      --verification-signal: #6366f1;
      --verification-signal-rgb: 99, 102, 241;
    }
    .verification-card[data-tone="neutral"] {
      --verification-signal: #94a3b8;
      --verification-signal-rgb: 148, 163, 184;
    }

    .verification-inner {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px 20px 18px 22px;
    }

    .artifact-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .artifact-copy { min-width: 0; }

    .eyebrow {
      font-family: var(--ox-mono, ui-monospace, monospace);
      color: var(--ox-text-muted);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      line-height: 1;
      text-transform: uppercase;
    }

    .artifact-title {
      margin: 7px 0 0;
      overflow-wrap: anywhere;
      color: var(--ox-text);
      font-size: 0.94rem;
      font-weight: 650;
      line-height: 1.35;
    }

    .purpose-badge {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      min-height: 28px;
      max-width: 48%;
      padding: 0 9px;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.28);
      border-radius: 999px;
      background: rgba(var(--verification-signal-rgb), 0.09);
      color: var(--verification-signal);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-align: right;
      text-transform: uppercase;
    }

    .verdict {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: flex-start;
    }

    .verdict-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.32);
      border-radius: 11px;
      background: rgba(var(--verification-signal-rgb), 0.11);
      color: var(--verification-signal);
    }

    .verdict h1 {
      margin: 0;
      color: var(--ox-text);
      font-size: clamp(1.28rem, 4.4vw, 1.72rem);
      font-weight: 720;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    .verdict p {
      margin: 7px 0 0;
      max-width: 68ch;
      color: var(--ox-text-muted);
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .quality-gauge {
      --quality-signal: #94a3b8;
      --quality-signal-rgb: 148, 163, 184;
      display: grid;
      gap: 7px;
    }

    .quality-gauge[data-quality-state="cleared"] {
      --quality-signal: #00c9a7;
      --quality-signal-rgb: 0, 201, 167;
    }

    .quality-gauge[data-quality-state="failed"],
    .quality-gauge[data-quality-state="stale"] {
      --quality-signal: #fbbf24;
      --quality-signal-rgb: 251, 191, 36;
    }

    .quality-gauge[data-quality-state="error"] {
      --quality-signal: #fb7185;
      --quality-signal-rgb: 251, 113, 133;
    }

    .quality-gauge[data-quality-state="scoring"] {
      --quality-signal: #6366f1;
      --quality-signal-rgb: 99, 102, 241;
    }

    .quality-gauge__track {
      position: relative;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
    }

    .quality-gauge__fill {
      position: absolute;
      inset: 0 auto 0 0;
      min-width: 2px;
      border-radius: inherit;
      background: var(--quality-signal);
      box-shadow: 0 0 12px rgba(var(--quality-signal-rgb), 0.25);
    }

    .quality-gauge__threshold,
    .quality-gauge__historical {
      position: absolute;
      z-index: 2;
      top: -4px;
      width: 2px;
      height: 14px;
      border-radius: 2px;
    }

    .quality-gauge__threshold {
      background: var(--ox-text);
      box-shadow: 0 0 0 3px rgba(242, 247, 255, 0.06);
    }

    .quality-gauge__historical {
      z-index: 1;
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(148, 163, 184, 0.9) 0 3px,
        transparent 3px 5px
      );
    }

    .quality-gauge__legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.625rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .quality-gauge__history-key {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .quality-gauge__history-key::before {
      content: "";
      width: 1px;
      height: 10px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(148, 163, 184, 0.9) 0 2px,
        transparent 2px 4px
      );
    }

    .quality-anatomy {
      border-block: 1px solid var(--ox-border);
    }

    .quality-anatomy > summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 18px;
      align-items: center;
      gap: 14px;
      min-height: 48px;
      padding: 7px 2px;
      color: var(--ox-text);
      cursor: pointer;
      list-style: none;
    }

    .quality-anatomy > summary::-webkit-details-marker { display: none; }

    .quality-anatomy__title {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .quality-anatomy__freshness {
      color: var(--ox-warning, #fbbf24);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .quality-anatomy__flow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      min-width: 0;
    }

    .quality-anatomy__flow-step {
      position: relative;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.58rem;
      font-weight: 650;
      letter-spacing: 0.055em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .quality-anatomy__flow-step + .quality-anatomy__flow-step::before {
      content: "→";
      position: absolute;
      inset-inline-start: -4px;
      color: rgba(148, 163, 184, 0.55);
      font-family: var(--ox-font, sans-serif);
      font-size: 0.68rem;
    }

    .quality-anatomy__flow-step b {
      color: var(--ox-text);
      font-size: 0.7rem;
      letter-spacing: -0.02em;
    }

    .quality-anatomy__chevron {
      color: var(--ox-text-muted);
      transition: transform 180ms var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1));
    }

    .quality-anatomy[open] .quality-anatomy__chevron { transform: rotate(180deg); }

    .quality-anatomy__grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--ox-border);
    }

    .quality-anatomy__stage {
      --lens-signal: #94a3b8;
      min-width: 0;
      padding: 12px 11px 13px;
    }

    .quality-anatomy__stage + .quality-anatomy__stage {
      border-inline-start: 1px solid var(--ox-border);
    }

    .quality-anatomy__stage[data-lens="judged"] { --lens-signal: #818cf8; }
    .quality-anatomy__stage[data-lens="measured"] { --lens-signal: #22d3ee; }
    .quality-anatomy__stage[data-lens="observed"] { --lens-signal: #fbbf24; }

    .quality-anatomy__stage-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.575rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .quality-anatomy__stage-label::before {
      content: "";
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--lens-signal);
      box-shadow: 0 0 8px var(--lens-signal);
      opacity: 0.82;
    }

    .quality-anatomy__stage-value {
      margin-top: 7px;
      color: var(--ox-text);
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .quality-anatomy__stage-detail {
      display: -webkit-box;
      margin-top: 3px;
      overflow: hidden;
      color: var(--ox-text-muted);
      font-size: 0.68rem;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .quality-anatomy__note {
      margin: 0;
      padding: 10px 11px 11px;
      border-top: 1px solid var(--ox-border);
      color: var(--ox-text-muted);
      font-size: 0.68rem;
      line-height: 1.45;
    }

    .signals {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--ox-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      overflow: hidden;
    }

    .signal {
      --axis-signal: #94a3b8;
      min-width: 0;
      padding: 11px 12px;
    }
    .signal + .signal { border-inline-start: 1px solid var(--ox-border); }

    .signal[data-axis="quality"][data-state="cleared"] { --axis-signal: #00c9a7; }
    .signal[data-axis="quality"][data-state="failed"],
    .signal[data-axis="quality"][data-state="stale"] { --axis-signal: #fbbf24; }
    .signal[data-axis="quality"][data-state="error"] { --axis-signal: #fb7185; }
    .signal[data-axis="quality"][data-state="scoring"] { --axis-signal: #818cf8; }
    .signal[data-axis="human"][data-state="accepted"] { --axis-signal: #d4ed31; }
    .signal[data-axis="human"][data-state="changes_requested"] { --axis-signal: #fbbf24; }
    .signal[data-axis="human"][data-state="rejected"] { --axis-signal: #fb7185; }
    .signal[data-axis="outcome"]:not([data-state="unobserved"]):not([data-state="drafted"]) { --axis-signal: #d4ed31; }
    .signal[data-axis="outcome"][data-state="scheduled"] { --axis-signal: #818cf8; }
    .signal[data-axis="outcome"][data-state="held"] { --axis-signal: #fbbf24; }

    .signal-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .signal-label::before {
      content: "";
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--axis-signal);
      box-shadow: 0 0 7px var(--axis-signal);
      opacity: 0.82;
    }

    .signal-value {
      display: block;
      overflow: hidden;
      color: var(--ox-text);
      font-size: 0.75rem;
      font-weight: 620;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .signal-detail {
      display: block;
      margin-top: 2px;
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.6875rem;
      line-height: 1.4;
    }

    .action-region {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .primary-action {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      overflow: hidden;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.42);
      border-radius: 11px;
      background: rgba(var(--verification-signal-rgb), 0.12);
      color: var(--ox-text);
      cursor: pointer;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      text-align: left;
      transition: border-color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, ease),
        background var(--ox-dur-fast, 150ms) var(--ox-ease-standard, ease),
        transform var(--ox-dur-fast, 150ms) var(--ox-ease-standard, ease);
    }

    .primary-action:hover {
      border-color: rgba(var(--verification-signal-rgb), 0.7);
      background: rgba(var(--verification-signal-rgb), 0.17);
      transform: translateY(-1px);
    }
    .primary-action:focus-visible,
    .quality-anatomy > summary:focus-visible,
    .composer textarea:focus-visible,
    .composer button:focus-visible {
      outline: 2px solid var(--verification-signal);
      outline-offset: 2px;
    }
    .primary-action:disabled { cursor: wait; opacity: 0.7; transform: none; }

    .primary-action__progress {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      pointer-events: none;
      background: rgba(var(--verification-signal-rgb), 0.18);
    }
    .primary-action.is-holding .primary-action__progress {
      width: 100%;
      transition: width 820ms linear;
    }

    .primary-action > span,
    .primary-action > svg { position: relative; z-index: 1; }

    .action-hint {
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.59rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .composer {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.28);
      border-radius: 11px;
      background: rgba(var(--verification-signal-rgb), 0.06);
    }

    .composer label {
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.61rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .composer textarea {
      width: 100%;
      min-height: 82px;
      padding: 10px 11px;
      resize: vertical;
      border: 1px solid var(--ox-border);
      border-radius: 9px;
      background: var(--ox-panel);
      color: var(--ox-text);
      font: inherit;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .composer-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .composer button {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--ox-border);
      border-radius: 9px;
      background: var(--ox-panel);
      color: var(--ox-text);
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 650;
    }
    .composer button[data-submit] {
      border-color: rgba(var(--verification-signal-rgb), 0.5);
      background: rgba(var(--verification-signal-rgb), 0.16);
    }

    .action-status {
      min-height: 18px;
      color: var(--ox-text-muted);
      font-size: 0.72rem;
      line-height: 1.4;
    }
    .action-status:empty { display: none; }
    .action-status[data-error="true"] { color: #fb7185; }

    .empty-state {
      padding: 34px 22px;
      color: var(--ox-text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 520px) {
      .verification-inner { padding: 17px 15px 15px 18px; }
      .artifact-heading { align-items: flex-start; }
      .purpose-badge { max-width: 46%; }
      .signals { grid-template-columns: 1fr; }
      .signal + .signal { border-top: 1px solid var(--ox-border); border-inline-start: 0; }
      .signal-value { white-space: normal; }
      .verdict { grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
      .verdict-mark { width: 32px; height: 32px; border-radius: 9px; }
      .quality-anatomy > summary {
        grid-template-columns: minmax(0, 1fr) 18px;
        gap: 8px;
        padding-block: 10px;
      }
      .quality-anatomy__flow {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      .quality-anatomy__flow-step { justify-content: flex-start; }
      .quality-anatomy__flow-step + .quality-anatomy__flow-step::before { display: none; }
      .quality-anatomy__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .quality-anatomy__stage:nth-child(3) {
        border-top: 1px solid var(--ox-border);
        border-inline-start: 0;
      }
      .quality-anatomy__stage:nth-child(4) { border-top: 1px solid var(--ox-border); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="widget-shell-card animate-in" aria-live="polite">
    <section data-stage></section>
  </main>

  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script>
    (function installArtifactVerificationWidget() {
      'use strict';

      var APP_BASE_URL = 'https://useorgx.com';
      var currentResponse = null;

      function asObject(value) {
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      }

      function cleanText(value, fallback) {
        return typeof value === 'string' && value.trim() ? value.trim() : fallback;
      }

      function asRecordArray(value) {
        return Array.isArray(value)
          ? value.map(asObject).filter(function (item) { return Object.keys(item).length > 0; })
          : [];
      }

      function nonNegativeInteger(value) {
        return typeof value === 'number' && Number.isFinite(value) && value >= 0
          ? Math.floor(value)
          : null;
      }

      function compactLabel(value, fallback) {
        var label = cleanText(value, fallback).replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
        return label.length > 72 ? label.slice(0, 69).trimEnd() + '…' : label;
      }

      function evidenceItemLabel(item, fallback) {
        var record = asObject(item);
        var candidates = [
          record.label,
          record.name,
          record.title,
          record.key,
          record.layer,
          record.layerKey,
          record.criterion,
          record.criterionId,
          record.check,
          record.metric,
          record.kind,
          record.summary,
        ];
        for (var i = 0; i < candidates.length; i += 1) {
          if (typeof candidates[i] === 'string' && candidates[i].trim()) {
            return compactLabel(candidates[i], fallback);
          }
        }
        return fallback;
      }

      function topEvidenceLabels(items, fallback) {
        var seen = {};
        var labels = [];
        for (var i = 0; i < items.length && labels.length < 2; i += 1) {
          var label = evidenceItemLabel(items[i], '');
          var key = label.toLowerCase();
          if (!label || seen[key]) continue;
          seen[key] = true;
          labels.push(label);
        }
        return labels.length ? labels.join(' · ') : fallback;
      }

      function measuredVerdict(item) {
        var record = asObject(item);
        if (typeof record.passed === 'boolean') return record.passed;
        if (typeof record.pass === 'boolean') return record.pass;
        if (typeof record.result === 'boolean') return record.result;
        var state = cleanText(record.status, cleanText(record.state, cleanText(record.verdict, ''))).toLowerCase();
        if (['pass', 'passed', 'clear', 'cleared', 'success'].indexOf(state) >= 0) return true;
        if (['fail', 'failed', 'blocked', 'error', 'invalid'].indexOf(state) >= 0) return false;
        return null;
      }

      function escapeHtml(value) {
        var node = document.createElement('div');
        node.textContent = cleanText(value, '');
        return node.innerHTML;
      }

      function normalizeReviewResponse(value) {
        var payload = asObject(value);
        if (payload.structuredContent) payload = asObject(payload.structuredContent);
        if (payload.data && !payload.artifact) payload = asObject(payload.data);
        return {
          raw: payload,
          artifact: asObject(payload.artifact),
          contract: asObject(payload.reviewContract),
        };
      }

      function scoreText(quality) {
        var state = cleanText(quality.state, 'unavailable').replace(/_/g, ' ');
        var current = quality.state === 'cleared' || quality.state === 'failed';
        var score = current && typeof quality.score === 'number' ? quality.score.toFixed(2) : null;
        var historical = typeof quality.previousScore === 'number'
          ? quality.previousScore.toFixed(2)
          : !current && typeof quality.score === 'number'
            ? quality.score.toFixed(2)
            : null;
        var threshold = typeof quality.threshold === 'number' ? quality.threshold.toFixed(2) : null;
        return {
          value: state,
          detail: score && threshold
            ? score + ' / ' + threshold + ' bar'
            : historical
              ? historical + ' historical · no current score'
              : cleanText(quality.reason, 'No current score'),
        };
      }

      function unitPercent(value) {
        if (typeof value !== 'number' || !Number.isFinite(value)) return null;
        return Math.round(Math.max(0, Math.min(1, value)) * 100);
      }

      function renderQualityGauge(quality, reviewRequired) {
        if (reviewRequired === false) return '';
        var state = cleanText(quality.state, 'unscored');
        var threshold = unitPercent(quality.threshold);
        if (threshold === null) return '';
        var score = state === 'cleared' || state === 'failed'
          ? unitPercent(quality.score)
          : null;
        var historical = unitPercent(quality.previousScore);
        var currentLabel = score !== null
          ? 'Current ' + score
          : historical !== null
            ? 'Prior ' + historical + ' · historical'
            : state === 'scoring'
              ? 'Checking now'
              : 'No current score';
        var ariaParts = [
          score !== null
            ? 'Current quality score ' + score + ' out of 100.'
            : 'No current quality score.',
        ];
        if (historical !== null) ariaParts.push('Historical score ' + historical + '.');
        ariaParts.push('Quality bar ' + threshold + '.');
        var ariaLabel = ariaParts.join(' ');

        return (
          '<section class="quality-gauge" data-quality-state="' + escapeHtml(state) + '" role="img" aria-label="' + escapeHtml(ariaLabel) + '">' +
            '<div class="quality-gauge__track">' +
              (score !== null ? '<span class="quality-gauge__fill" style="width:' + score + '%"></span>' : '') +
              (historical !== null ? '<span class="quality-gauge__historical" style="left:calc(' + historical + '% - 1px)" title="Historical score ' + historical + '"></span>' : '') +
              '<span class="quality-gauge__threshold" style="left:calc(' + threshold + '% - 1px)" title="Quality bar ' + threshold + '"></span>' +
            '</div>' +
            '<div class="quality-gauge__legend"><span>' + escapeHtml(currentLabel) + '</span>' +
              (historical !== null && score !== null ? '<span class="quality-gauge__history-key">Prior ' + historical + '</span>' : '') +
              '<span>Quality bar ' + threshold + '</span></div>' +
          '</section>'
        );
      }

      function buildQualityAnatomy(model) {
        var contract = asObject(model.contract);
        var quality = asObject(contract.quality);
        var evidence = asObject(contract.evidence);
        var counts = asObject(contract.counts);
        var lineage = asObject(contract.lineage);
        var layers = asRecordArray(evidence.layers);
        var measured = asRecordArray(evidence.measured);
        var observations = asRecordArray(evidence.observations);
        var relationships = asRecordArray(evidence.relationships);
        var evidenceRefs = nonNegativeInteger(counts.evidenceRefs);
        if (evidenceRefs === null) evidenceRefs = relationships.length;
        var gradedLayers = nonNegativeInteger(evidence.gradedLayers);
        var judgedCount = Math.max(gradedLayers === null ? 0 : gradedLayers, layers.length);
        var confidence = typeof evidence.confidence === 'number' && Number.isFinite(evidence.confidence)
          ? Math.round(Math.max(0, Math.min(1, evidence.confidence)) * 100)
          : null;
        var clearChecks = 0;
        var heldChecks = 0;
        var unknownChecks = 0;
        measured.forEach(function (item) {
          var verdict = measuredVerdict(item);
          if (verdict === true) clearChecks += 1;
          else if (verdict === false) heldChecks += 1;
          else unknownChecks += 1;
        });
        var measuredStatus = measured.length === 0
          ? 'No measured checks'
          : heldChecks > 0
            ? measured.length + ' checks · ' + heldChecks + ' held' + (unknownChecks ? ' · ' + unknownChecks + ' unreported' : '')
            : unknownChecks > 0
              ? measured.length + ' checks · ' + unknownChecks + ' unreported'
              : clearChecks + ' checks · all clear';
        var version = nonNegativeInteger(lineage.version);
        if (version === null) version = nonNegativeInteger(model.artifact.version) || 1;
        var qualityState = cleanText(quality.state, 'unscored').replace(/_/g, ' ');
        var evidenceIsCurrent = quality.state === 'cleared' || quality.state === 'failed';

        return {
          inputCount: 1 + relationships.length,
          judgedCount: judgedCount,
          measuredCount: measured.length,
          observedCount: observations.length,
          evidenceIsCurrent: evidenceIsCurrent,
          qualityState: qualityState,
          stages: [
            {
              lens: 'inputs',
              label: 'Inputs',
              value: '1 artifact · ' + relationships.length + ' linked ref' + (relationships.length === 1 ? '' : 's'),
              detail: 'Current v' + version + ' · ' + evidenceRefs + ' evidence record' + (evidenceRefs === 1 ? '' : 's') + ' · ' + topEvidenceLabels(relationships, relationships.length ? 'Linked inputs returned by the contract' : 'No linked inputs returned'),
            },
            {
              lens: 'judged',
              label: 'Judged',
              value: judgedCount > 0
                ? judgedCount + ' layer' + (judgedCount === 1 ? '' : 's') + (confidence === null ? '' : ' · ' + confidence + '% confidence')
                : 'No judged layers',
              detail: topEvidenceLabels(layers, judgedCount ? 'Layer labels not exposed in this view' : 'No qualitative layer verdicts returned'),
            },
            {
              lens: 'measured',
              label: 'Measured',
              value: measuredStatus,
              detail: topEvidenceLabels(measured, 'No deterministic check records returned'),
            },
            {
              lens: 'observed',
              label: 'Observed',
              value: observations.length
                ? observations.length + ' record' + (observations.length === 1 ? '' : 's')
                : 'No observations',
              detail: topEvidenceLabels(observations, 'No direct observation records returned'),
            },
          ],
        };
      }

      function renderQualityAnatomy(model) {
        var anatomy = buildQualityAnatomy(model);
        var expanded = new URLSearchParams(window.location.search).get('anatomy') === 'expanded';
        var summaryLabel = 'Quality anatomy: ' + anatomy.inputCount + ' inputs, ' + anatomy.judgedCount + ' judged, ' + anatomy.measuredCount + ' measured, and ' + anatomy.observedCount + ' observed.' + (anatomy.evidenceIsCurrent ? '' : ' Evidence is context only.');
        var flow = [
          ['Inputs', anatomy.inputCount],
          ['Judged', anatomy.judgedCount],
          ['Measured', anatomy.measuredCount],
          ['Observed', anatomy.observedCount],
        ].map(function (item) {

        }).join('');
        var stages = anatomy.stages.map(function (stage) {
          return (
            '<div class="quality-anatomy__stage" data-lens="' + stage.lens + '" role="listitem">' +

        return (
          '<details class="quality-anatomy" data-quality-anatomy' + (expanded ? ' open' : '') + '>' +
            '<summary aria-label="' + escapeHtml(summaryLabel) + '">' +
              '<span class="quality-anatomy__title">Quality anatomy' + (anatomy.evidenceIsCurrent ? '' : '<span class="quality-anatomy__freshness">Context only</span>') + '</span>' +

              '<svg class="quality-anatomy__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
            '</summary>' +
            '<div class="quality-anatomy__grid" role="list" aria-label="Quality evidence path">' + stages + '</div>' +
            '<p class="quality-anatomy__note">' + escapeHtml(note) + '</p>' +

      }

      function choosePrimaryAction(model) {
        var contract = model.contract;
        var purpose = asObject(contract.purpose);
        var authority = asObject(contract.authority);
        var quality = asObject(contract.quality);
        var ruling = asObject(contract.ruling);
        var modalityGate = asObject(contract.modalityGate);
        var artifactId = cleanText(model.artifact.id, '');
        var href = APP_BASE_URL + '/artifacts/' + encodeURIComponent(artifactId);

        if (!artifactId) return { kind: 'none', label: '', href: '' };
        if (purpose.reviewRequired !== true || authority.canReview !== true) {
          return { kind: 'open', label: purpose.reviewRequired === false ? 'Inspect evidence in OrgX' : 'Open verification in OrgX', href: href };
        }
        if (quality.state === 'error') {
          return { kind: 'open', label: 'Inspect current verification error', href: href };
        }
        if (quality.state === 'stale') {
          return { kind: 'open', label: 'Refresh stale verification', href: href };
        }
        if (quality.state === 'failed') {
          return { kind: 'changes_requested', label: 'Request a stronger iteration', href: href };
        }
        if (['scoring', 'unscored', 'skipped'].indexOf(quality.state) >= 0) {
          return { kind: 'open', label: 'Inspect quality evidence', href: href };
        }
        if (modalityGate.blocksAdvance === true) {
          var modalityLabel = cleanText(modalityGate.label, 'Modality proof incomplete')
            .replace(/\s+incomplete$/i, '')
            .toLowerCase();
          return { kind: 'changes_requested', label: 'Request ' + modalityLabel, href: href };
        }
        if (['accepted', 'changes_requested', 'rejected'].indexOf(ruling.state) >= 0) {
          return { kind: 'open', label: 'Open ruling in OrgX', href: href };
        }
        if (quality.state === 'cleared') {
          return {
            kind: 'approved',
            label: 'Hold to accept & advance',
            href: href,
          };
        }
        return { kind: 'open', label: 'Inspect quality evidence', href: href };

      function thresholdSourceText(quality) {
        var source = asObject(quality.thresholdSource);

        if (kind === 'eval_profile') {
          var name = cleanText(source.profileName, 'Evaluation profile');
          var version = typeof source.profileVersion === 'number' ? ' v' + source.profileVersion : '';
          var scope = cleanText(source.profileScope, '');
          return name + version + (scope ? ' · ' + scope : '');
        }
        if (kind === 'eval_run_report') return 'Current eval run';
        if (kind === 'embedded_eval') return 'Embedded artifact eval';
        if (kind === 'contract_default') return 'Artifact contract default';
        if (kind === 'system_default') return 'System fallback';

      function formatEvidenceTime(value) {
        var raw = cleanText(value, '');
        if (!raw) return '';
        var parsed = new Date(raw);
        if (Number.isNaN(parsed.getTime())) return raw;
        try {
          return new Intl.DateTimeFormat('en-US', {
            month: 'short',
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            timeZoneName: 'short',
          }).format(parsed);
        } catch (_error) {
          return raw;
        }
      }

      async function submitRuling(model, status, note) {
        var button = document.querySelector('[data-primary-action]');
        if (button) button.disabled = true;
        setStatus('Recording against the canonical artifact state…', false);
        try {
          var result = await window.OrgXWidgetRuntime.callTool('submit_artifact_review', {
            artifact_id: model.artifact.id,
            status: status,
            note: note || undefined,
          });
          var refreshed = normalizeReviewResponse(result);
          if (!refreshed.artifact.id || !refreshed.contract.schemaVersion) {
            throw new Error('The server did not return refreshed verification state.');
          }
          render(refreshed.raw);
        } catch (error) {
          if (button) button.disabled = false;
          setStatus(error instanceof Error ? error.message : 'Artifact ruling could not be recorded.', true);
        }
      }

            '<label for="artifact-review-note">What must improve?</label>' +
            '<textarea id="artifact-review-note" maxlength="4000" placeholder="Name the gap and the evidence that would clear it." data-note></textarea>' +
            '<div class="composer-actions"><button type="button" data-cancel>Cancel</button><button type="button" data-submit>Request changes</button></div>' +
            '<div class="action-status" data-action-status></div>' +
          '</div>'
        );
        var note = region.querySelector('[data-note]');
        var cancel = region.querySelector('[data-cancel]');
        var submit = region.querySelector('[data-submit]');
        if (note) note.focus();
        if (cancel) cancel.addEventListener('click', function () { render(currentResponse); });
        if (submit) submit.addEventListener('click', function () {
          var text = cleanText(note && note.value, '');
          if (!text) { setStatus('Specific feedback is required before rework can start.', true); if (note) note.focus(); return; }
          submitRuling(model, 'changes_requested', text);
        });
        window.OrgXWidgetRuntime.reportSize();
      }

      function bindHoldToApprove(button, model) {
        var timer = null;
        var committed = false;
        function start(event) {
          if (committed || timer || button.disabled) return;
          event.preventDefault();
          button.classList.add('is-holding');
          timer = window.setTimeout(function () {
            committed = true;
            button.classList.remove('is-holding');
            submitRuling(model, 'approved');
          }, 840);
        }
        function cancel() {
          if (timer) window.clearTimeout(timer);
          timer = null;
          if (!committed) button.classList.remove('is-holding');
        }
        button.addEventListener('pointerdown', start);
        button.addEventListener('pointerup', cancel);
        button.addEventListener('pointerleave', cancel);
        button.addEventListener('pointercancel', cancel);
        button.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') start(event);
        });
        button.addEventListener('keyup', cancel);
      }

      function bindAction(model, action) {
        var button = document.querySelector('[data-primary-action]');
        if (!button) return;
        if (action.kind === 'open') {
          button.addEventListener('click', function (event) {
            event.preventDefault();
            window.OrgXWidgetRuntime.openWidgetLink(action.href, event);
          });
        } else if (action.kind === 'changes_requested') {
          button.addEventListener('click', function () { openChangesComposer(model); });
        } else if (action.kind === 'approved') {
          bindHoldToApprove(button, model);
        }
      }

      window.OrgXArtifactReviewWidgetModel = {
        normalizeReviewResponse: normalizeReviewResponse,
        choosePrimaryAction: choosePrimaryAction,
        scoreText: scoreText,
        renderQualityGauge: renderQualityGauge,
        buildQualityAnatomy: buildQualityAnatomy,
        renderQualityAnatomy: renderQualityAnatomy,
      };

      function bootstrap() {
        if (window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
          render(demoResponse());
          return;
        }
        window.OrgXWidgetRuntime.initWidget({ render: render });
      }

      document.addEventListener('DOMContentLoaded', bootstrap);
      window.addEventListener('resize', window.OrgXWidgetRuntime.reportSize);
    })();
  </script>
</body>
</html>
