<!DOCTYPE html>
<html lang="en" data-widget-mode="escalation" data-accent="amber">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifact Review — OrgX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2302040a'/%3E%3Cpath d='M20 18h18l8 8v22H20z' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M38 18v8h8' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <link rel="stylesheet" href="shared/components/domain-accent.css" />

  <style>
    /*
     * artifact-review — Action widget, Escalation mode.
     * Primary = amber (shares the attention palette with decisions).
     * Spec: orgx-design skill, Widget Types › Action Widgets.
     *
     * Layout:
     *   widget-shell (kicker + title + icon)
     *   → artifact-preview (filmstrip + main preview)
     *   → author attribution (agent-chip) + version badge
     *   → decision block (approve | request changes)
     *   → footer (deep link + last-version meta)
     */

    :root { --ox-primary: #fbbf24; --ox-primary-rgb: 251, 191, 36; }
    @media (prefers-color-scheme: dark) {
      :root { --ox-primary: #fbbf24; --ox-primary-rgb: 251, 191, 36; }
    }
    [data-theme="dark"] {
      --ox-primary: #fbbf24;
      --ox-primary-rgb: 251, 191, 36;
    }

    .stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ─── artifact-preview ──────────────────────────────────────── */
    .artifact-preview {
      border: 1px solid var(--ox-border);
      border-radius: 14px;
      background: var(--ox-well-bg);
      box-shadow: var(--ox-well-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .artifact-preview__body {
      position: relative;
      min-height: 200px;
      max-height: 420px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 0%, rgba(var(--ox-primary-rgb), 0.06), transparent 60%),
        var(--ox-well-bg);
    }

    .artifact-preview__body img,
    .artifact-preview__body iframe {
      max-width: 100%;
      max-height: 380px;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
    }

    .artifact-preview__body pre {
      width: 100%;
      max-height: 380px;
      overflow: auto;
      margin: 0;
      padding: 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.78rem;
      color: var(--ox-text);
      line-height: 1.55;
      border: 1px solid var(--ox-border);
    }

    .artifact-preview__markdown {
      width: 100%;
      max-height: 380px;
      overflow: auto;
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--ox-text);
      padding: 4px 8px;
    }
    .artifact-preview__markdown h1,
    .artifact-preview__markdown h2,
    .artifact-preview__markdown h3 {
      margin: 18px 0 8px;
      line-height: 1.3;
    }
    .artifact-preview__markdown p { margin: 0 0 10px; }

    .artifact-preview__placeholder {
      text-align: center;
      color: var(--ox-text-muted);
      font-size: 0.84rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .artifact-preview__placeholder svg { opacity: 0.55; }

    /* ─── version filmstrip ─────────────────────────────────────── */
    .filmstrip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--ox-border);
      background: var(--ox-panel);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .filmstrip__label {
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ox-text-muted);
      margin-right: 4px;
      flex-shrink: 0;
    }

    .filmstrip__item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--ox-border);
      background: var(--ox-well-bg);
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        border-color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        background var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1));
      flex-shrink: 0;
    }
    .filmstrip__item:hover {
      border-color: rgba(var(--ox-primary-rgb), 0.35);
      color: var(--ox-text);
    }
    .filmstrip__item.is-current {
      color: var(--ox-primary);
      border-color: rgba(var(--ox-primary-rgb), 0.45);
      background: rgba(var(--ox-primary-rgb), 0.1);
    }
    .filmstrip__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
    }

    /* ─── attribution + version badge row ──────────────────────── */
    .attribution-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
      flex-wrap: wrap;
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(var(--ox-primary-rgb), 0.3);
      background: rgba(var(--ox-primary-rgb), 0.1);
      color: var(--ox-primary);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ─── decision block ───────────────────────────────────────── */
    .decision-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 520px) {
      .decision-row { grid-template-columns: 1fr; }
    }

    .decision-card {
      position: relative;
      min-height: 88px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--ox-border);
      background: var(--ox-well-bg);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: var(--ox-text);
      overflow: hidden;
      transition: transform var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        border-color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1)),
        background var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1));
    }

    .decision-card:hover {
      transform: translateY(-1px);
      border-color: rgba(var(--card-color-rgb), 0.45);
    }

    .decision-card--approve {
      --card-color-rgb: var(--ox-primary-rgb);
    }

    .decision-card--changes {
      --card-color-rgb: 148, 163, 184; /* slate */
    }

    .decision-card__icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(var(--card-color-rgb), 0.15);
      color: rgb(var(--card-color-rgb));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .decision-card__body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .decision-card__title {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .decision-card__detail {
      font-size: 0.76rem;
      color: var(--ox-text-muted);
    }

    /* Hold-to-approve — the approve card fills from left-to-right
       while the user holds. Release early → resets. 100% → commits.
       The visual affordance doubles as the weight-of-decision signal. */
    .decision-card__hold {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: rgba(var(--card-color-rgb), 0.15);
      border-right: 1px solid rgba(var(--card-color-rgb), 0.45);
      pointer-events: none;
      transition: width var(--ox-dur-instant, 50ms) linear;
    }
    .decision-card.is-holding .decision-card__hold {
      transition: width 800ms linear;
      width: 100%;
    }

    /* Resolve — when a decision commits, the stage leaves decisively.
       Approve / request-changes both accelerate out (exit curve). */
    .stage.is-resolving {
      animation: resolve-out var(--ox-dur-base, 250ms) var(--ox-ease-exit, cubic-bezier(0.4, 0, 1, 1)) forwards;
      pointer-events: none;
    }
    @keyframes resolve-out {
      to { opacity: 0; transform: translateY(-6px) scale(0.99); filter: blur(4px); }
    }

    .decision-card__hint {
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.56rem;
      color: var(--ox-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 1;
    }

    /* ─── composer (changes-requested) ─────────────────────────── */
    .composer {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.06);
    }
    .composer.is-open { display: flex; }

    .composer label {
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ox-text-muted);
    }

    .composer textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--ox-border);
      border-radius: 10px;
      background: var(--ox-panel);
      color: var(--ox-text);
      font: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .composer textarea:focus-visible {
      outline: 2px solid rgba(148, 163, 184, 0.5);
      outline-offset: 2px;
    }

    .composer__actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .composer-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--ox-border);
      background: var(--ox-panel);
      color: var(--ox-text);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .composer-btn--primary {
      background: rgb(148, 163, 184);
      color: var(--ox-bg);
      border-color: rgb(148, 163, 184);
    }

    /* ─── footer ───────────────────────────────────────────────── */
    .widget-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--ox-border);
      font-family: var(--ox-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 0.65rem;
      color: var(--ox-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .widget-foot a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--ox-primary);
      text-decoration: none;
    }
    .widget-foot a:hover { text-decoration: underline; }

    /* ─── empty + error states ─────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      color: var(--ox-text-muted);
    }
    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(var(--ox-primary-rgb), 0.1);
      color: var(--ox-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    /* 2026 review-desk composition: evidence and consequence share first paint. */
    .review-desk {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 20px;
      align-items: start;
    }
    .review-evidence,
    .review-control {
      min-width: 0;
    }
    .review-control {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-left: 4px;
    }
    .review-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      font-family: var(--ox-mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ox-text-muted);
    }
    .review-status__signal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ox-primary);
      font-weight: 700;
    }
    .review-status__signal::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 5px rgba(var(--ox-primary-rgb), 0.1);
    }
    .review-question {
      margin: 0;
      color: var(--ox-text);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1.3;
      letter-spacing: -0.025em;
    }
    .review-consequence {
      margin: 0;
      color: var(--ox-text-muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .quality-gauge {
      --quality-signal: var(--ox-text-muted);
      display: grid;
      gap: 7px;
      padding-block: 2px;
    }
    .quality-gauge[data-quality-state="cleared"] { --quality-signal: var(--ox-teal); }
    .quality-gauge[data-quality-state="held"],
    .quality-gauge[data-quality-state="stale"] { --quality-signal: var(--ox-warning); }
    .quality-gauge[data-quality-state="error"] { --quality-signal: var(--ox-danger); }
    .quality-gauge[data-quality-state="pending"] { --quality-signal: var(--ox-iris); }
    .quality-gauge__track {
      position: relative;
      height: 7px;
      border-radius: 999px;
      background: var(--ox-surface-inset);
      box-shadow: inset 0 0 0 1px var(--ox-border);
    }
    .quality-gauge__fill {
      position: absolute;
      inset: 0 auto 0 0;
      min-width: 2px;
      border-radius: inherit;
      background: var(--quality-signal);
    }
    .quality-gauge__threshold,
    .quality-gauge__historical {
      position: absolute;
      z-index: 2;
      top: -4px;
      width: 2px;
      height: 15px;
      border-radius: 2px;
    }
    .quality-gauge__threshold {
      background: var(--ox-text);
      box-shadow: 0 0 0 3px var(--ox-surface-subtle);
    }
    .quality-gauge__historical {
      z-index: 1;
      width: 1px;
      background: repeating-linear-gradient(
        to bottom,
        var(--ox-text-muted) 0 3px,
        transparent 3px 5px
      );
    }
    .quality-gauge__legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--ox-text-muted);
      font: 700 0.58rem/1.3 var(--ox-mono);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .quality-gauge__profile {
      overflow: hidden;
      color: var(--ox-text-muted);
      font: 0.65rem/1.4 var(--ox-mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .quality-anatomy {
      border-block: 1px solid var(--ox-border);
    }
    .quality-anatomy > summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 18px;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding-block: 9px;
      color: var(--ox-text);
      cursor: pointer;
      list-style: none;
    }
    .quality-anatomy > summary::-webkit-details-marker { display: none; }
    .quality-anatomy__title {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .quality-anatomy__freshness {
      color: var(--ox-warning);
      font: 700 0.52rem/1.2 var(--ox-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .quality-anatomy__flow {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-width: 0;
    }
    .quality-anatomy__flow-step {
      display: grid;
      gap: 2px;
      min-width: 0;
      color: var(--ox-text-muted);
      font: 700 0.5rem/1.2 var(--ox-mono);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .quality-anatomy__flow-step b {
      color: var(--ox-text);
      font-size: 0.66rem;
      letter-spacing: 0;
    }
    .quality-anatomy__chevron {
      color: var(--ox-text-muted);
      transition: transform var(--ox-dur-fast, 150ms) var(--ox-ease-standard, cubic-bezier(0.16, 1, 0.3, 1));
    }
    .quality-anatomy[open] .quality-anatomy__chevron { transform: rotate(180deg); }
    .quality-anatomy__equation {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding-block: 10px;
      border-top: 1px solid var(--ox-border);
      color: var(--ox-text-muted);
      font: 700 0.54rem/1.3 var(--ox-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .quality-anatomy__equation span {
      position: relative;
      min-width: 0;
      padding-inline-end: 9px;
      overflow-wrap: anywhere;
    }
    .quality-anatomy__equation span + span::before {
      content: "\2192";
      position: absolute;
      inset-inline-start: -9px;
      color: var(--ox-text-dim);
    }
    .quality-anatomy__calculation {
      padding: 9px 10px;
      border-top: 1px solid var(--ox-border);
      color: var(--ox-text);
      background: rgba(var(--ox-primary-rgb), 0.035);
      font: 700 0.64rem/1.45 var(--ox-mono);
      overflow-wrap: anywhere;
    }
    .quality-anatomy__calculation span {
      margin-inline-end: 8px;
      color: var(--ox-text-muted);
      font-size: 0.54rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .quality-anatomy__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 1px solid var(--ox-border);
    }
    .quality-anatomy__stage {
      --lens-signal: var(--ox-text-muted);
      min-width: 0;
      padding: 11px 10px 12px;
    }
    .quality-anatomy__stage:nth-child(even) { border-inline-start: 1px solid var(--ox-border); }
    .quality-anatomy__stage:nth-child(n + 3) { border-top: 1px solid var(--ox-border); }
    .quality-anatomy__stage[data-lens="judged"] { --lens-signal: var(--ox-iris); }
    .quality-anatomy__stage[data-lens="measured"] { --lens-signal: var(--ox-teal); }
    .quality-anatomy__stage[data-lens="observed"] { --lens-signal: var(--ox-warning); }
    .quality-anatomy__stage-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ox-text-muted);
      font: 700 0.54rem/1.2 var(--ox-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .quality-anatomy__stage-label::before {
      content: "";
      width: 5px;
      height: 5px;
      flex: 0 0 5px;
      border-radius: 999px;
      background: var(--lens-signal);
    }
    .quality-anatomy__stage-value {
      margin-top: 7px;
      color: var(--ox-text);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .quality-anatomy__stage-detail {
      display: -webkit-box;
      margin-top: 3px;
      overflow: hidden;
      color: var(--ox-text-muted);
      font-size: 0.66rem;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
    .quality-anatomy__note {
      margin: 0;
      padding: 10px 2px 11px;
      border-top: 1px solid var(--ox-border);
      color: var(--ox-text-muted);
      font-size: 0.68rem;
      line-height: 1.45;
    }
    .artifact-preview {
      border-radius: 12px;
    }
    .artifact-preview__body {
      min-height: 180px;
      max-height: 260px;
      padding: 12px;
      cursor: zoom-in;
      transition: max-height 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .artifact-preview.is-expanded .artifact-preview__body {
      max-height: 560px;
      cursor: zoom-out;
    }
    .artifact-preview__body img,
    .artifact-preview__body iframe {
      max-height: 236px;
      box-shadow: none;
    }
    .artifact-preview.is-expanded .artifact-preview__body img,
    .artifact-preview.is-expanded .artifact-preview__body iframe {
      max-height: 536px;
    }
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-top: 1px solid var(--ox-border);
      background: var(--ox-panel);
    }
    .preview-toggle {
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--ox-text);

          </div>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></svg>
