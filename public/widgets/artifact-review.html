<!DOCTYPE html>
<html lang="en" data-widget-mode="escalation">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artifact verification — OrgX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2302040a'/%3E%3Cpath d='M20 18h18l8 8v22H20z' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M38 18v8h8' fill='none' stroke='%23fbbf24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='m26 36 4 4 8-10' fill='none' stroke='%2300c9a7' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />

  <style>
    :root {
      --ox-primary: #fbbf24;
      --ox-primary-rgb: 251, 191, 36;
      --verification-signal: #fbbf24;
      --verification-signal-rgb: 251, 191, 36;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ox-primary: #fbbf24;
        --ox-primary-rgb: 251, 191, 36;
      }
    }

    [data-theme="dark"] {
      --ox-primary: #fbbf24;
      --ox-primary-rgb: 251, 191, 36;
    }

    body { min-width: 0; }

    .verification-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      background:
        radial-gradient(circle at 92% -10%, rgba(var(--verification-signal-rgb), 0.12), transparent 42%),
        var(--ox-panel);
      box-shadow: var(--ox-well-shadow);
    }

    .verification-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, var(--verification-signal), transparent 82%);
      box-shadow: 0 0 22px rgba(var(--verification-signal-rgb), 0.55);
    }

    .verification-card[data-tone="positive"] {
      --verification-signal: #00c9a7;
      --verification-signal-rgb: 0, 201, 167;
    }
    .verification-card[data-tone="critical"] {
      --verification-signal: #fb7185;
      --verification-signal-rgb: 251, 113, 133;
    }
    .verification-card[data-tone="active"] {
      --verification-signal: #6366f1;
      --verification-signal-rgb: 99, 102, 241;
    }
    .verification-card[data-tone="neutral"] {
      --verification-signal: #94a3b8;
      --verification-signal-rgb: 148, 163, 184;
    }

    .verification-inner {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px 20px 18px 22px;
    }

    .artifact-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .artifact-copy { min-width: 0; }

    .eyebrow {
      font-family: var(--ox-mono, ui-monospace, monospace);
      color: var(--ox-text-muted);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      line-height: 1;
      text-transform: uppercase;
    }

    .artifact-title {
      margin: 7px 0 0;
      overflow-wrap: anywhere;
      color: var(--ox-text);
      font-size: 0.94rem;
      font-weight: 650;
      line-height: 1.35;
    }

    .purpose-badge {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      min-height: 28px;
      max-width: 48%;
      padding: 0 9px;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.28);
      border-radius: 999px;
      background: rgba(var(--verification-signal-rgb), 0.09);
      color: var(--verification-signal);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.2;
      text-align: right;
      text-transform: uppercase;
    }

    .verdict {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: flex-start;
    }

    .verdict-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.32);
      border-radius: 11px;
      background: rgba(var(--verification-signal-rgb), 0.11);
      color: var(--verification-signal);
    }

    .verdict h1 {
      margin: 0;
      color: var(--ox-text);
      font-size: clamp(1.28rem, 4.4vw, 1.72rem);
      font-weight: 720;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    .verdict p {
      margin: 7px 0 0;
      max-width: 68ch;
      color: var(--ox-text-muted);
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .signals {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--ox-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      overflow: hidden;
    }

    .signal {
      min-width: 0;
      padding: 11px 12px;
    }
    .signal + .signal { border-inline-start: 1px solid var(--ox-border); }

    .signal-label {
      display: block;
      margin-bottom: 5px;
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.57rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .signal-value {
      display: block;
      overflow: hidden;
      color: var(--ox-text);
      font-size: 0.75rem;
      font-weight: 620;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .signal-detail {
      display: block;
      margin-top: 2px;
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.6rem;
      line-height: 1.35;
    }

    .action-region {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .primary-action {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      overflow: hidden;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.42);
      border-radius: 11px;
      background: rgba(var(--verification-signal-rgb), 0.12);
      color: var(--ox-text);
      cursor: pointer;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      text-align: left;
      transition: border-color var(--ox-dur-fast, 150ms) var(--ox-ease-standard, ease),
        background var(--ox-dur-fast, 150ms) var(--ox-ease-standard, ease),
        transform var(--ox-dur-fast, 150ms) var(--ox-ease-standard, ease);
    }

    .primary-action:hover {
      border-color: rgba(var(--verification-signal-rgb), 0.7);
      background: rgba(var(--verification-signal-rgb), 0.17);
      transform: translateY(-1px);
    }
    .primary-action:focus-visible,
    .composer textarea:focus-visible,
    .composer button:focus-visible {
      outline: 2px solid var(--verification-signal);
      outline-offset: 2px;
    }
    .primary-action:disabled { cursor: wait; opacity: 0.7; transform: none; }

    .primary-action__progress {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      pointer-events: none;
      background: rgba(var(--verification-signal-rgb), 0.18);
    }
    .primary-action.is-holding .primary-action__progress {
      width: 100%;
      transition: width 820ms linear;
    }

    .primary-action > span,
    .primary-action > svg { position: relative; z-index: 1; }

    .action-hint {
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.59rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .composer {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px;
      border: 1px solid rgba(var(--verification-signal-rgb), 0.28);
      border-radius: 11px;
      background: rgba(var(--verification-signal-rgb), 0.06);
    }

    .composer label {
      color: var(--ox-text-muted);
      font-family: var(--ox-mono, ui-monospace, monospace);
      font-size: 0.61rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .composer textarea {
      width: 100%;
      min-height: 82px;
      padding: 10px 11px;
      resize: vertical;
      border: 1px solid var(--ox-border);
      border-radius: 9px;
      background: var(--ox-panel);
      color: var(--ox-text);
      font: inherit;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .composer-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .composer button {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--ox-border);
      border-radius: 9px;
      background: var(--ox-panel);
      color: var(--ox-text);
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 650;
    }
    .composer button[data-submit] {
      border-color: rgba(var(--verification-signal-rgb), 0.5);
      background: rgba(var(--verification-signal-rgb), 0.16);
    }

    .action-status {
      min-height: 18px;
      color: var(--ox-text-muted);
      font-size: 0.72rem;
      line-height: 1.4;
    }
    .action-status[data-error="true"] { color: #fb7185; }

    .empty-state {
      padding: 34px 22px;
      color: var(--ox-text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 520px) {
      .verification-inner { padding: 17px 15px 15px 18px; }
      .artifact-heading { align-items: flex-start; }
      .purpose-badge { max-width: 46%; }
      .signals { grid-template-columns: 1fr; }
      .signal + .signal { border-top: 1px solid var(--ox-border); border-inline-start: 0; }
      .signal-value { white-space: normal; }
      .verdict { grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
      .verdict-mark { width: 32px; height: 32px; border-radius: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="widget-shell-card animate-in" aria-live="polite">
    <section data-stage></section>
  </main>

  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script>
    (function installArtifactVerificationWidget() {
      'use strict';

      var APP_BASE_URL = 'https://useorgx.com';
      var currentResponse = null;

      function asObject(value) {
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      }

      function cleanText(value, fallback) {
        return typeof value === 'string' && value.trim() ? value.trim() : fallback;
      }

      function escapeHtml(value) {
        var node = document.createElement('div');
        node.textContent = cleanText(value, '');
        return node.innerHTML;
      }

      function normalizeReviewResponse(value) {
        var payload = asObject(value);
        if (payload.structuredContent) payload = asObject(payload.structuredContent);
        if (payload.data && !payload.artifact) payload = asObject(payload.data);
        return {
          raw: payload,
          artifact: asObject(payload.artifact),
          contract: asObject(payload.reviewContract),
        };
      }

      function scoreText(quality) {
        var state = cleanText(quality.state, 'unavailable').replace(/_/g, ' ');
        var score = typeof quality.score === 'number' ? quality.score.toFixed(2) : null;
        var threshold = typeof quality.threshold === 'number' ? quality.threshold.toFixed(2) : null;
        return {
          value: state,
          detail: score && threshold ? score + ' / ' + threshold + ' bar' : cleanText(quality.reason, 'No current score'),
        };
      }

      function choosePrimaryAction(model) {
        var contract = model.contract;
        var purpose = asObject(contract.purpose);
        var authority = asObject(contract.authority);
        var quality = asObject(contract.quality);
        var ruling = asObject(contract.ruling);
        var artifactId = cleanText(model.artifact.id, '');
        var href = APP_BASE_URL + '/artifacts/' + encodeURIComponent(artifactId);

        if (!artifactId) return { kind: 'none', label: '', href: '' };
        if (purpose.reviewRequired !== true || authority.canReview !== true) {
          return { kind: 'open', label: purpose.reviewRequired === false ? 'Inspect evidence in OrgX' : 'Open verification in OrgX', href: href };
        }
        if (['accepted', 'changes_requested', 'rejected'].indexOf(ruling.state) >= 0) {
          return { kind: 'open', label: 'Open ruling in OrgX', href: href };
        }
        if (quality.state === 'failed') {
          return { kind: 'changes_requested', label: 'Request a stronger iteration', href: href };
        }
        if (quality.state === 'cleared') {
          return { kind: 'approved', label: 'Hold to record approval', href: href };
        }
        return { kind: 'open', label: 'Inspect quality evidence', href: href };
      }

      function demoResponse() {
        var mode = new URLSearchParams(window.location.search).get('state') || 'ready';
        var evidenceOnly = mode === 'evidence';
        var failed = mode === 'failed';
        var approved = mode === 'approved';
        return {
          artifact: {
            id: 'artifact-demo-verified',
            name: evidenceOnly ? 'Browser verification receipt' : 'Launch narrative v3',
            artifact_type: evidenceOnly ? 'proof.link' : 'marketing.launch_asset',
            status: approved ? 'approved' : 'in_review',
            version: 3,
          },
          reviewContract: {
            schemaVersion: 'artifact_review_contract.v1',
            purpose: { kind: evidenceOnly ? 'evidence' : 'deliverable', label: evidenceOnly ? 'Evidence' : 'Deliverable', reviewRequired: !evidenceOnly },
            modality: { kind: evidenceOnly ? 'web' : 'document', label: evidenceOnly ? 'Web experience' : 'Document' },
            quality: {
              state: evidenceOnly ? 'skipped' : failed ? 'failed' : 'cleared',
              score: evidenceOnly ? null : failed ? 0.71 : 0.91,
              threshold: 0.85,
              reason: evidenceOnly ? 'Evidence records are inspected, never passed.' : failed ? 'The current run found unsupported outcome claims.' : 'Current evaluation cleared the configured quality bar.',
            },
            ruling: {
              state: approved ? 'accepted' : 'pending',
              label: approved ? 'Accepted' : 'Pending human ruling',
              actorKind: approved ? 'human' : 'unknown',
              note: null,
            },
            outcome: { state: approved ? 'validated' : 'unobserved', label: approved ? 'Outcome validated' : 'No outcome observed', count: approved ? 1 : 0 },
            workflow: {
              headline: evidenceOnly ? 'Inspect evidence' : failed ? 'Below the quality bar' : approved ? 'Cleared to advance' : 'Ready for a decision',
              reason: evidenceOnly ? 'This record supports another artifact; it is not an approval target.' : failed ? 'Machine evidence is current and the measured quality is below the configured bar.' : approved ? 'Current quality evidence cleared the bar and an authorized reviewer accepted the work.' : 'Quality cleared; an authorized human must now rule.',
              tone: evidenceOnly ? 'neutral' : failed ? 'critical' : approved ? 'positive' : 'attention',
              canAdvance: approved,
            },
            authority: { canReview: !evidenceOnly, canRerun: false, canOverride: false, canEditPolicy: false },
            lineage: { version: 3, state: 'current' },
          },
        };
      }

      function iconForTone(tone) {
        if (tone === 'positive') return '<path d="M5 12.5 9.2 17 19 7"/>';
        if (tone === 'critical') return '<path d="M12 8v5"/><path d="M12 17h.01"/><path d="M10.3 3.7 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/>';
        if (tone === 'active') return '<path d="M12 2v4m0 12v4M4.9 4.9l2.8 2.8m8.6 8.6 2.8 2.8M2 12h4m12 0h4M4.9 19.1l2.8-2.8m8.6-8.6 2.8-2.8"/>';
        return '<path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/>';
      }

      function renderAction(model, action) {
        if (action.kind === 'none') return '';
        var icon = action.kind === 'open'
          ? '<path d="M14 3h7v7"/><path d="m10 14 11-11"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>'
          : action.kind === 'approved'
            ? '<path d="m5 12 4 4L19 6"/>'
            : '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>';
        return (
          '<div class="action-region" data-action-region>' +
            '<button class="primary-action" type="button" data-primary-action="' + action.kind + '" data-href="' + escapeHtml(action.href) + '">' +
              '<span class="primary-action__progress" aria-hidden="true"></span>' +
              '<span>' + escapeHtml(action.label) + '</span>' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icon + '</svg>' +
            '</button>' +
            (action.kind === 'approved' ? '<div class="action-hint">Release early to cancel · current server state renders after submit</div>' : '') +
            '<div class="action-status" data-action-status></div>' +
          '</div>'
        );
      }

      function render(value) {
        var model = normalizeReviewResponse(value);
        currentResponse = model.raw;
        var stage = document.querySelector('[data-stage]');
        if (!stage) return;

        if (!model.artifact.id) {
          stage.innerHTML = '<div class="verification-card"><div class="empty-state">No artifact verification is waiting for you.</div></div>';
          window.OrgXWidgetRuntime.reportSize();
          return;
        }

        var contract = model.contract;
        var purpose = asObject(contract.purpose);
        var modality = asObject(contract.modality);
        var workflow = asObject(contract.workflow);
        var quality = asObject(contract.quality);
        var ruling = asObject(contract.ruling);
        var outcome = asObject(contract.outcome);
        var lineage = asObject(contract.lineage);
        var tone = cleanText(workflow.tone, 'neutral');
        var hasCanonicalContract = cleanText(contract.schemaVersion, '') === 'artifact_review_contract.v1';
        if (!hasCanonicalContract) {
          workflow = { headline: 'Verification unavailable', reason: 'Open the artifact to inspect its source. No pass or approval is inferred from legacy fields.', tone: 'attention' };
          tone = 'attention';
        }
        var machine = scoreText(quality);
        var action = choosePrimaryAction(model);
        if (!hasCanonicalContract) action = { kind: 'open', label: 'Open artifact in OrgX', href: APP_BASE_URL + '/artifacts/' + encodeURIComponent(cleanText(model.artifact.id, '')) };
        var title = cleanText(model.artifact.name, cleanText(model.artifact.title, 'Artifact verification'));
        var version = typeof lineage.version === 'number' ? lineage.version : typeof model.artifact.version === 'number' ? model.artifact.version : 1;

        stage.innerHTML = (
          '<article class="verification-card" data-tone="' + escapeHtml(tone) + '">' +
            '<div class="verification-inner">' +
              '<header class="artifact-heading">' +
                '<div class="artifact-copy"><div class="eyebrow">Artifact verification</div><div class="artifact-title">' + escapeHtml(title) + '</div></div>' +
                '<div class="purpose-badge">' + escapeHtml(cleanText(purpose.label, 'Artifact')) + ' · ' + escapeHtml(cleanText(modality.label, 'Unknown')) + ' · v' + version + '</div>' +
              '</header>' +
              '<section class="verdict">' +
                '<div class="verdict-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + iconForTone(tone) + '</svg></div>' +
                '<div><h1>' + escapeHtml(cleanText(workflow.headline, 'Verification unavailable')) + '</h1><p>' + escapeHtml(cleanText(workflow.reason, 'No canonical verification reason was returned.')) + '</p></div>' +
              '</section>' +
              '<section class="signals" aria-label="Verification signals">' +
                '<div class="signal"><span class="signal-label">Machine quality</span><span class="signal-value">' + escapeHtml(machine.value) + '</span><span class="signal-detail">' + escapeHtml(machine.detail) + '</span></div>' +
                '<div class="signal"><span class="signal-label">Human ruling</span><span class="signal-value">' + escapeHtml(cleanText(ruling.label, 'Not recorded')) + '</span><span class="signal-detail">' + escapeHtml(cleanText(ruling.actorKind, 'No authority')) + '</span></div>' +
                '<div class="signal"><span class="signal-label">Outcome</span><span class="signal-value">' + escapeHtml(cleanText(outcome.label, 'Not observed')) + '</span><span class="signal-detail">' + (typeof outcome.count === 'number' ? outcome.count : 0) + ' observation' + (outcome.count === 1 ? '' : 's') + '</span></div>' +
              '</section>' +
              renderAction(model, action) +
            '</div>' +
          '</article>'
        );

        bindAction(model, action);
        window.OrgXWidgetRuntime.reportSize();
      }

      function setStatus(message, isError) {
        var status = document.querySelector('[data-action-status]');
        if (!status) return;
        status.textContent = message || '';
        status.setAttribute('data-error', isError ? 'true' : 'false');
        window.OrgXWidgetRuntime.reportSize();
      }

      async function submitRuling(model, status, note) {
        var button = document.querySelector('[data-primary-action]');
        if (button) button.disabled = true;
        setStatus('Recording against the canonical artifact state…', false);
        try {
          var result = await window.OrgXWidgetRuntime.callTool('submit_artifact_review', {
            artifact_id: model.artifact.id,
            status: status,
            note: note || undefined,
          });
          var refreshed = normalizeReviewResponse(result);
          if (!refreshed.artifact.id || !refreshed.contract.schemaVersion) {
            throw new Error('The server did not return refreshed verification state.');
          }
          render(refreshed.raw);
        } catch (error) {
          if (button) button.disabled = false;
          setStatus(error instanceof Error ? error.message : 'Artifact ruling could not be recorded.', true);
        }
      }

      function openChangesComposer(model) {
        var region = document.querySelector('[data-action-region]');
        if (!region) return;
        region.innerHTML = (
          '<div class="composer">' +
            '<label for="artifact-review-note">What must improve?</label>' +
            '<textarea id="artifact-review-note" maxlength="4000" placeholder="Name the gap and the evidence that would clear it." data-note></textarea>' +
            '<div class="composer-actions"><button type="button" data-cancel>Cancel</button><button type="button" data-submit>Request changes</button></div>' +
            '<div class="action-status" data-action-status></div>' +
          '</div>'
        );
        var note = region.querySelector('[data-note]');
        var cancel = region.querySelector('[data-cancel]');
        var submit = region.querySelector('[data-submit]');
        if (note) note.focus();
        if (cancel) cancel.addEventListener('click', function () { render(currentResponse); });
        if (submit) submit.addEventListener('click', function () {
          var text = cleanText(note && note.value, '');
          if (!text) { setStatus('Specific feedback is required before rework can start.', true); if (note) note.focus(); return; }
          submitRuling(model, 'changes_requested', text);
        });
        window.OrgXWidgetRuntime.reportSize();
      }

      function bindHoldToApprove(button, model) {
        var timer = null;
        var committed = false;
        function start(event) {
          if (committed || timer || button.disabled) return;
          event.preventDefault();
          button.classList.add('is-holding');
          timer = window.setTimeout(function () {
            committed = true;
            button.classList.remove('is-holding');
            submitRuling(model, 'approved');
          }, 840);
        }
        function cancel() {
          if (timer) window.clearTimeout(timer);
          timer = null;
          if (!committed) button.classList.remove('is-holding');
        }
        button.addEventListener('pointerdown', start);
        button.addEventListener('pointerup', cancel);
        button.addEventListener('pointerleave', cancel);
        button.addEventListener('pointercancel', cancel);
        button.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') start(event);
        });
        button.addEventListener('keyup', cancel);
      }

      function bindAction(model, action) {
        var button = document.querySelector('[data-primary-action]');
        if (!button) return;
        if (action.kind === 'open') {
          button.addEventListener('click', function (event) {
            event.preventDefault();
            window.OrgXWidgetRuntime.openWidgetLink(action.href, event);
          });
        } else if (action.kind === 'changes_requested') {
          button.addEventListener('click', function () { openChangesComposer(model); });
        } else if (action.kind === 'approved') {
          bindHoldToApprove(button, model);
        }
      }

      window.OrgXArtifactReviewWidgetModel = {
        normalizeReviewResponse: normalizeReviewResponse,
        choosePrimaryAction: choosePrimaryAction,
        scoreText: scoreText,
      };

      function bootstrap() {
        if (window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
          render(demoResponse());
          return;
        }
        window.OrgXWidgetRuntime.initWidget({ render: render });
      }

      document.addEventListener('DOMContentLoaded', bootstrap);
      window.addEventListener('resize', window.OrgXWidgetRuntime.reportSize);
    })();
  </script>
</body>
</html>
