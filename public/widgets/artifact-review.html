      const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

      function readToolResult(result) {
        const runtime = window.OrgXWidgetRuntime;
        if (runtime && typeof runtime.extractStructuredWidgetData === 'function') {
          return runtime.extractStructuredWidgetData(result, true);
        }
        return result && typeof result === 'object' && result.structuredContent ? result.structuredContent : result;
      }

      // When the ruling comes back as a queued command or run, follow it
      // through orgx_get_operation_status instead of calling it done on arrival.
      function settleCommand(result) {
        const out = asRecord(readToolResult(result));
        const candidates = [['operation', firstString([out.operation_id])], ['command', firstString([out.command_id, out.commandId])], ['run', firstString([out.run_id, out.runId])]];
        const ref = candidates.find(function (entry) { return entry[0] === 'operation' ? Boolean(entry[1]) : UUID_RE.test(entry[1]); });
        if (!ref) return Promise.resolve(out);
        return new Promise(function (resolve, reject) {
          function check() {
            Promise.resolve(callTool('orgx_get_operation_status', ref[0] === 'operation' ? { operation_id: ref[1] } : { kind: ref[0], id: ref[1] }))
              .then(function (statusResult) {
                const status = asRecord(readToolResult(statusResult));
                if (status.state === 'failed' || status.state === 'cancelled') {
                  reject(new Error(firstString([status.outcome]) || 'ruling_not_recorded'));
                  return;
                }
                if (typeof status.next_poll_after_ms === 'number' && isFinite(status.next_poll_after_ms)) {
                  setTimeout(check, Math.max(1000, status.next_poll_after_ms));
                  return;
                }
                resolve(Object.assign({}, out, status));
              })
              .catch(reject);
          }
          check();
        });
      }

      function artifactReviewToken(id) {
        const runtime = window.OrgXWidgetRuntime;
        if (!runtime || !runtime.getToolResponseMetadata) return null;
        const dedicated = asRecord(runtime.getToolResponseMetadata('orgx/artifactReview'));
        const shared = asRecord(runtime.getToolResponseMetadata('orgx/widgetApproval'));
        const token = asRecord(dedicated.approval_tokens)[id] || asRecord(shared.artifact_approval_tokens)[id] || asRecord(shared.approval_tokens)[id];
        return typeof token === 'string' && token ? token : null;
      }

      function hasArtifactReviewAuthority(id) {
        const runtime = window.OrgXWidgetRuntime;
        // A standalone gallery can preview controls but has no host transport.
        return Boolean(artifactReviewToken(id)) || Boolean(runtime && runtime.detectProtocol && runtime.detectProtocol() === 'standalone');
      }

      function artifactReviewArgs(artifact, note) {
        const args = { artifact_id: artifact.id, expected_version: artifact.version };
        if (note) args.note = note;
        const token = artifactReviewToken(artifact.id);
        if (token) args.approval_token = token;
        return args;
      }

      function confirmedReviewArtifact(artifact, result, expectedStatus) {
        const out = asRecord(result);
        const updated = asRecord(out.artifact);
        const status = firstString([updated.status, out.review_status, out.status]);
        if (out.ok === false || out.applied === false || status !== expectedStatus) {
          throw new Error('review_not_confirmed');
        }
        return Object.assign({}, artifact, updated, { status: status });
      }

      function setButtonLabel(button, text) {
        if (!button) return;
        const label = button.querySelector('.ft-btn__label');
        (label || button).textContent = text;
      }

      async function approveArtifact(artifact) {
        const button = document.querySelector('[data-action="approve"]');
        const feedback = document.querySelector('[data-review-feedback]');
        const evidence = resolveEvidence(artifact, activeReviewContract);
        if (evidence.blocksApproval) {
          if (feedback) {
            feedback.dataset.tone = 'error';
            feedback.textContent = 'Approval is blocked until required verification evidence clears.';
          }
          return;
        }
        if (button) {
          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
          setButtonLabel(button, 'Approving…');
        }
        setFooterMode('sending', 'approve', evidence);
        if (feedback) {
          feedback.dataset.tone = '';
          feedback.textContent = 'Recording approval and advancing the artifact…';
        }
        try {
          const result = await callTool('orgx_widget_approve_artifact', artifactReviewArgs(artifact));
          const settled = await settleCommand(result);
          const updated = confirmedReviewArtifact(artifact, settled, 'approved');
          resolveStage(function () {
            activeReviewContract = null;
            render(updated);
          });
        } catch (err) {
          console.warn('[artifact-review] approve failed', err);
          if (button) {
            button.disabled = false;
            button.removeAttribute('aria-busy');
            setButtonLabel(button, 'Approve');
          }
          setFooterMode('failed', 'approve', evidence);
          if (feedback) {
            feedback.dataset.tone = 'error';
            feedback.textContent = 'Approval failed. Your review is still open; try again.';
          }
        }
      }

      async function submitChangeRequest(artifact, notes) {
        const button = document.querySelector('[data-composer-submit]');
        const input = document.querySelector('[data-composer-input]');
        const feedback = document.querySelector('[data-review-feedback]');
        const evidence = resolveEvidence(artifact, activeReviewContract);
        if (button) {
          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
          setButtonLabel(button, 'Filing…');
        }
        if (input) input.disabled = true;
        setFooterMode('sending', 'changes', evidence);
        if (feedback) {
          feedback.dataset.tone = '';
          feedback.textContent = 'Linking guidance to the artifact…';
        }
        try {
          const result = await callTool('orgx_widget_request_artifact_changes', artifactReviewArgs(artifact, notes));
          const settled = await settleCommand(result);
          const updated = confirmedReviewArtifact(artifact, settled, 'changes_requested');
          resolveStage(function () {
            activeReviewContract = null;
            render(updated);
          });
        } catch (err) {
          console.warn('[artifact-review] change request failed', err);
          if (button) {
            button.disabled = false;
            button.removeAttribute('aria-busy');
            setButtonLabel(button, 'Request changes');
          }
          if (input) input.disabled = false;
          setFooterMode('failed', 'changes', evidence);
          if (feedback) {
            feedback.dataset.tone = 'error';
            feedback.textContent = 'Change request failed. Your note is preserved; try again.';
          }
        }
      }

      // ─── render ─────────────────────────────────────────────────
      function bindLinks(stage) {
        const deepLink = stage.querySelector('[data-deeplink]');
        if (deepLink) {
          deepLink.addEventListener('click', function (e) {
            e.preventDefault();
            openWidgetLink(deepLink.getAttribute('href'));
          });
        }
        const sourceLink = stage.querySelector('[data-source-link]');
        if (sourceLink) {
          sourceLink.addEventListener('click', function (event) {
            event.preventDefault();
            openWidgetLink(sourceLink.getAttribute('href'));
          });
        }
      }

      function render(artifact) {
        artifact = normalizeArtifact(artifact);
        const stage = document.querySelector('[data-stage]');
        stage.classList.remove('is-resolving');

        if (artifact && artifact.__loading) {
          stage.innerHTML = (
            '<article class="wcard ox-surface" aria-busy="true" aria-label="Loading artifact review">' +
            '<div class="hd"><span class="sk" style="width:44%"></span></div>' +
            '<div class="bd"><span class="sk" style="width:80%;height:22px"></span><span class="sk" style="width:100%;height:8px"></span><span class="sk" style="width:100%;height:132px;border-radius:12px"></span></div>' +
            '<ox-footer variant="reads" state="loading"></ox-footer>' +
            '</article>'
          );
          reportSize();
          return;
        }

        if (artifact && artifact.__error) {
          stage.innerHTML = (
            '<article class="wcard ox-surface" data-edge="red">' +
            '<div class="hd" data-tone="red">' + oxIcon('artifact', 18) + '<span class="kind">Artifact</span></div>' +
            '<div class="bd"><h2 class="review-question">Evidence disconnected</h2>' +
            '<p class="empty-copy">' + escapeHtml(artifact.__error) + ' Restore the evidence before signing off.</p></div>' +
            '<ox-footer variant="reads" state="failed" heading="Couldn’t load the evidence" detail="no action was taken" action-label="Retry evidence" data-retry-evidence></ox-footer>' +
            '</article>'
          );
          const retry = stage.querySelector('[data-retry-evidence]');
          if (retry) retry.addEventListener('ox-action', function () { location.reload(); });
          reportSize();
          return;
        }

        if (!artifact || !artifact.id) {
          stage.innerHTML = (
            '<article class="wcard ox-surface" data-edge="teal">' +
            '<div class="hd" data-tone="teal">' + oxIcon('artifact', 18) + '<span class="kind">Artifact review</span></div>' +
            '<div class="bd"><h2 class="review-question">Inbox clear</h2>' +
            '<p class="empty-copy">No artifacts waiting for review. Nothing to sign off on right now.</p></div>' +
            '<ox-footer variant="reads" state="caught-up" heading="Nothing waits on you" detail="no artifacts in review"></ox-footer>' +
            '</article>'
          );
          reportSize();
          return;
        }

        const isResolved =
          !activeReviewContract &&
          (artifact.status === 'approved' || artifact.status === 'changes_requested');
        const evidence = resolveEvidence(artifact, activeReviewContract);
        const canonicalWorkflow = asRecord(asRecord(activeReviewContract).workflow);
        const rulingRecorded = ['accepted', 'changes_requested', 'rejected'].includes(
          firstString([evidence.reviewStatus]).toLowerCase(),
        );
        const summary = activeReviewContract
          ? firstString([canonicalWorkflow.reason, canonicalWorkflow.headline]) || artifact.summary || 'Canonical review evidence attached.'
          : (artifact.summary || 'Production artifact awaiting approval.');

        if (isResolved) {
          const approved = artifact.status === 'approved';
          stage.innerHTML = (
            '<article class="wcard ox-surface" data-edge="teal">' +
            renderHeader(artifact, 'teal', 'proactive', 'sign') +
            '<div class="bd">' +
            '<h2 class="review-question">' + (approved ? 'Approval recorded' : 'Revision requested') + '</h2>' +
            '<p class="review-summary">' + (approved ? 'Signed off. Execution can continue from this version.' : 'Guidance filed. The author owns the next revision.') + '</p>' +
            '</div>' +
            '<ox-footer variant="finishes-here" state="done" heading="' + (approved ? 'Approved' : 'Changes requested') + '" detail="v' + escapeAttribute(String(artifact.version || 1)) + ' · ' + (approved ? 'artifact advanced' : 'author notified') + '" action-label=""></ox-footer>' +
            '</article>'
          );
          bindLinks(stage);
          reportSize();
          return;
        }

        // What the reviewer is asked to do: sign (Approve / Request changes), resolve a blocker
        // in OrgX (never "signature" or Approve), or inspect a record (read-only).
        const mode = evidence.mode === 'resolve' || evidence.mode === 'inspect' ? evidence.mode : 'sign';
        const canReview = mode === 'sign' && evidence.canReview !== false && hasArtifactReviewAuthority(artifact.id);
        const held = canReview && evidence.blocksApproval;
        const tone = rulingRecorded ? 'teal' : mode === 'resolve' ? 'red' : !canReview ? '' : 'amber';
        const chip = rulingRecorded
          ? '<ox-state-chip state="confirmed" label="Ruling recorded"></ox-state-chip>'
          : mode === 'resolve'
            ? '<ox-state-chip state="blocked" label="Blocking work"></ox-state-chip>'
            : mode === 'inspect'
              ? '<ox-state-chip state="view_only" label="Read only"></ox-state-chip>'
              : !canReview
                ? '<ox-state-chip state="view_only"></ox-state-chip>'
                : held
                  ? '' // The quality verdict says "Held · scored 20 of the 80 needed"; a chip would say it twice.
                  : '<ox-state-chip state="needs_you" label="Needs your sign-off"></ox-state-chip>';
        const footer = canReview
          ? '<ox-footer id="reviewFooter" variant="finishes-here" state="needs-you">' + renderFooterControls(evidence) + '</ox-footer>'
          : mode === 'resolve' && !rulingRecorded
            ? '<ox-footer id="handoffFooter" variant="confirms-in-orgx" state="needs-you" heading="Blocking work" detail="cleared in OrgX" primary-label="Resolve in OrgX ↗"></ox-footer>'
            : rulingRecorded
              ? '<ox-footer variant="confirms-in-orgx" state="confirmed" heading="Ruling recorded" detail="evidence stays separate" action-label=""></ox-footer>'
              : mode === 'inspect'
                ? '<ox-footer id="handoffFooter" variant="reads" state="fresh" heading="A record to read" detail="nothing to sign here" action-label="Open in OrgX ↗"></ox-footer>'
                : '<ox-footer id="handoffFooter" variant="confirms-in-orgx" state="waiting" heading="Decided in OrgX" detail="you can read the evidence here" action-label="Open in OrgX ↗"></ox-footer>';
        const question = rulingRecorded
          ? 'What remains unresolved after the ruling?'
          : mode === 'resolve' ? 'What’s blocking, and what clears it?'
          : mode === 'inspect' ? 'What does this record show?'
          : evidence.canReview === false ? 'What does the current evidence establish?'
          : 'Is this version good enough to sign?';
        const consequence = rulingRecorded
          ? 'The ruling stays recorded. Quality, visual proof and later outcomes stay separate.'
          : mode === 'resolve'
            ? 'Blockers are resolved, not signed: fixing or acknowledging it in OrgX lets the work continue.'
            : mode === 'inspect'
              ? 'This is evidence for other work. Nothing here needs your signature.'
              : evidence.canReview === false
                ? 'Your role can read this evidence; the ruling is recorded in OrgX.'
                : 'Approving releases this version to the next step. Requesting changes sends your note to ' + ((artifact.author && artifact.author.name) || 'the author') + '.';
        // A blocker with no score skips the quality check entirely: there is nothing to grade.
        const showQuality = !(mode === 'resolve' && evidence.score === null) && !(mode === 'inspect' && evidence.state === 'not_scored');
        // When the verdict below explains a hold, a summary that only restates it ("Quality is below
        // the bar for this version") is dropped; a summary that says something else stays.
        const summaryText = humanizeCodes(summary);
        const restatesVerdict = held && showQuality && !chip && /\b(bar|quality|scor(e|ed|ing))\b/i.test(summaryText);

        stage.innerHTML = (
          '<article class="wcard ox-surface" data-edge="' + (tone || 'mute') + '">' +
          renderHeader(artifact, tone, mode === 'resolve' ? 'asking' : 'verifying', mode) +
          '<div class="bd">' +
          '<div class="review-desk animate-in">' +
          '<div class="review-control">' +
          (chip ? '<div class="review-status">' + chip + '</div>' : '') +
          '<h2 class="review-question">' + escapeHtml(question) + '</h2>' +
          (restatesVerdict || !summaryText ? '' : '<p class="review-summary">' + escapeHtml(summaryText) + '</p>') +
          (evidence.rulingNote ? '<p class="ruling-note"><b>Reviewer note</b> · ' + escapeHtml(evidence.rulingNote) + '</p>' : '') +
          (showQuality ? renderQualityGauge(evidence, artifact, activeReviewContract) : '') +
          '<p class="review-consequence">' + escapeHtml(consequence) + '</p>' +
          '</div>' +
          '<div class="review-evidence">' +
          '<div class="artifact-preview" data-preview>' +
          '<div class="viewer-tabs" role="tablist" aria-label="Artifact viewer">' +
          '<button class="viewer-tab" type="button" role="tab" aria-selected="true" aria-controls="artifact-preview-panel" data-view-tab="preview">Preview</button>' +
          '<button class="viewer-tab" type="button" role="tab" aria-selected="false" aria-controls="artifact-evidence-panel" data-view-tab="evidence" tabindex="-1">Evidence</button>' +
          '<button class="viewer-tab" type="button" role="tab" aria-selected="false" aria-controls="artifact-history-panel" data-view-tab="history" tabindex="-1">History</button>' +
          '</div>' +
          '<div class="viewer-panel" id="artifact-preview-panel" role="tabpanel" data-view-panel="preview">' +
          '<div class="artifact-preview__body" data-preview-body>' + renderPreview(artifact) + '</div>' +
          '<div class="preview-toolbar">' +
          '<span class="meta">' + escapeHtml(artifact.artifact_type.replace(/[_.-]+/g, ' ')) + ' · v' + escapeHtml(String(artifact.version)) + '</span>' +
          '<button class="preview-toggle" type="button" data-preview-toggle aria-expanded="false">Show all</button>' +
          '</div></div>' +
          '<div class="viewer-panel viewer-panel--readout" id="artifact-evidence-panel" role="tabpanel" data-view-panel="evidence" hidden>' + renderEvidence(artifact, evidence) + '</div>' +
          '<div class="viewer-panel viewer-panel--readout" id="artifact-history-panel" role="tabpanel" data-view-panel="history" hidden>' + renderHistory(artifact) + '</div>' +
          '</div>' +
          '</div>' +
          (canReview ? renderDecisionRow(evidence) : '') +
          '</div>' +
          '</div>' +
          footer +
          '</article>'
        );

        // Wire decisions
        const approveCard = stage.querySelector('[data-action="approve"]');
        if (approveCard) bindApprove(approveCard, function () { approveArtifact(artifact); });

        const changesCard = stage.querySelector('[data-action="request-changes"]');
        const composer = stage.querySelector('[data-composer]');
        const composerInput = stage.querySelector('[data-composer-input]');
        const composerCancel = stage.querySelector('[data-composer-cancel]');
        const composerSubmit = stage.querySelector('[data-composer-submit]');
        if (canReview) setFooterMode('decide', null, evidence);

        function openComposer() {
          if (!composer) return;
          composer.hidden = false;
          composer.classList.add('is-open');
          if (changesCard) changesCard.setAttribute('aria-expanded', 'true');
          setFooterMode('compose', 'changes', evidence);
          if (composerInput) composerInput.focus();
          reportSize();
        }
        function closeComposer() {
          if (!composer) return;
          composer.hidden = true;
          composer.classList.remove('is-open');
          if (changesCard) changesCard.setAttribute('aria-expanded', 'false');
          setFooterMode('decide', 'approve', evidence);
          if (changesCard) changesCard.focus();
          reportSize();
        }

        if (changesCard && composer) changesCard.addEventListener('click', openComposer);
        if (composerCancel) composerCancel.addEventListener('click', closeComposer);
        if (composerSubmit) {
          composerSubmit.addEventListener('click', function () {
            const notes = (composerInput.value || '').trim();
            if (!notes) {
              composerInput.focus();
              return;
            }
            submitChangeRequest(artifact, notes);
          });
        }

        const anatomyToggle = stage.querySelector('[data-anatomy-toggle]');
        if (anatomyToggle) {
          anatomyToggle.addEventListener('click', function () {
            anatomyOpen = anatomyToggle.getAttribute('aria-expanded') !== 'true';
            anatomyToggle.setAttribute('aria-expanded', String(anatomyOpen));
          });
        }
        const handoff = stage.querySelector('#handoffFooter');
        if (handoff && artifact.id) {
          const openArtifact = function () {
            openWidgetLink(buildArtifactLink(artifact));
            // Opening OrgX changes nothing here: hand the kit's pressed control back.
            handoff.setAttribute('state', handoff.getAttribute('state') || '');
          };
          handoff.addEventListener('ox-primary', openArtifact);
          handoff.addEventListener('ox-action', openArtifact);
        }
        const preview = stage.querySelector('[data-preview]');
        const previewToggle = stage.querySelector('[data-preview-toggle]');
        function togglePreview() {
          if (!preview || !previewToggle) return;
          const expanded = preview.classList.toggle('is-expanded');
          previewToggle.setAttribute('aria-expanded', String(expanded));
          previewToggle.textContent = expanded ? 'Show less' : 'Show all';
          reportSize();
        }
        if (previewToggle) previewToggle.addEventListener('click', togglePreview);
        const viewTabs = Array.from(stage.querySelectorAll('[data-view-tab]'));
        const viewPanels = Array.from(stage.querySelectorAll('[data-view-panel]'));
        function selectView(name, focus) {
          viewTabs.forEach(function (tab) {
            const selected = tab.getAttribute('data-view-tab') === name;
            tab.setAttribute('aria-selected', String(selected));
            tab.tabIndex = selected ? 0 : -1;
            if (selected && focus) tab.focus();
          });
          viewPanels.forEach(function (panel) {
            panel.hidden = panel.getAttribute('data-view-panel') !== name;
          });
          if (previewToggle) previewToggle.hidden = name !== 'preview';
          reportSize();
        }
        viewTabs.forEach(function (tab, index) {
          tab.addEventListener('click', function () {
            selectView(tab.getAttribute('data-view-tab'), false);
          });
          tab.addEventListener('keydown', function (event) {
            let nextIndex = index;
            if (event.key === 'ArrowRight') nextIndex = (index + 1) % viewTabs.length;
            else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + viewTabs.length) % viewTabs.length;
            else if (event.key === 'Home') nextIndex = 0;
            else if (event.key === 'End') nextIndex = viewTabs.length - 1;
            else return;
            event.preventDefault();
            selectView(viewTabs[nextIndex].getAttribute('data-view-tab'), true);
          });
        });
        stage.onkeydown = function (event) {
          if (event.key !== 'Escape' || !composer || !composer.classList.contains('is-open')) return;
          event.preventDefault();
          closeComposer();
        };

        bindLinks(stage);
        reportSize();
      }

      let booted = false;
      function bootstrap() {
        // Boot once: a second DOMContentLoaded must not wipe an open review.
        if (booted) return;
        booted = true;
        const fixtureParams = new URLSearchParams(window.location.search);
        const hasFixture = fixtureParams.has('state') || fixtureParams.get('demo') === 'true' || fixtureParams.get('loading') === 'true';
        if (hasFixture || window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
          const payload = resolveArtifact();
          if (payload && payload.state === 'loading') {
            render({ __loading: true });
            return;
          }
          render(resolveIncomingArtifact(payload));
          return;
        }
        window.OrgXWidgetRuntime.initWidget({
          /* Context while you review: what else is running on this initiative. */
          live: {
            anchor: '.widget-shell-card',
            widget: 'artifact-review',
            emptyLabel: 'No agents running',
          },
          render: function (payload) {
            if (!payload) {
              render({ __loading: true });
              return;
            }
            render(resolveIncomingArtifact(payload));
          },
        });
      }

      document.addEventListener('DOMContentLoaded', bootstrap);
      window.addEventListener('resize', reportSize);
    })();
  </script>
</body>
</html>
