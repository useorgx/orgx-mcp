  <style>
    /* Creation mode keeps its iris identity; the canvas Q2 card supplies the shape. */
    :root { --ox-primary: #6366f1; --ox-primary-rgb: 99, 102, 241; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 18px;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: var(--ox-font);
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 640px; margin: 0 auto; position: relative; }

    /* The footer's primary is the kit's action lime, whatever the widget accent. */

    /* Q2: one card. Header line, the work, its consequence, its rows, one footer. */
    .wcard {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      --edge-rgb: 100, 116, 139;
    }
    .wcard::after {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), .7), transparent);
      pointer-events: none;
    }
    .wcard[data-edge="amber"] { --edge-rgb: 251, 191, 36; }
    .wcard[data-edge="teal"] { --edge-rgb: 0, 201, 167; }
    .wcard[data-edge="red"] { --edge-rgb: 244, 63, 94; }
    .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; min-width: 0; }
    .hd > ox-glyph { --ox-glyph-size: 18px; flex: none; }
    .kind {
      font-size: 11px; font-weight: 600; line-height: 1;
      letter-spacing: .04em; text-transform: uppercase;
      color: var(--ox-text-muted); white-space: nowrap;
    }
    .src {
      display: inline-flex; align-items: center; gap: 5px;
      min-width: 0; font-size: 12.5px; color: var(--ox-text-muted);
      white-space: nowrap; overflow: hidden;
    }
    .src ox-glyph { --ox-glyph-size: 15px; flex: none; }
    .src b { color: var(--ox-text-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .sp { flex: 1; }
    .who2 { display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 12.5px; color: var(--ox-text-muted); white-space: nowrap; }
    .who2 b { color: var(--ox-text-2); font-weight: 600; }
    .bd { padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .pk-q {
      margin: 0; font-size: 20px; font-weight: 700; line-height: 1.18;
      letter-spacing: -.025em; color: var(--ox-text);
      text-wrap: balance; overflow-wrap: anywhere;
    }
    .status { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-height: 22px; }
    .meta { font-size: 11.5px; line-height: 1.3; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
    .note { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ox-text-muted); text-wrap: pretty; }
    .cap { display: flex; flex-direction: column; gap: 6px; }
    .segbar { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; background: var(--ox-hover, rgba(127, 127, 127, .1)); }
    .segbar i { display: block; height: 100%; }
    .segbar .est { background: rgba(148, 163, 184, .75); }
    .segbar .over { background: var(--ox-danger); }
    .cap-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; font-size: 12.5px; line-height: 1.45; font-variant-numeric: tabular-nums; }
    .cap-row .v { color: var(--ox-text); }
    .cap-row .muted { color: var(--ox-text-muted); }
    .cap-row .meta { margin-left: auto; }
    .rows { display: flex; flex-direction: column; }

    /* Loading keeps the populated footprint so the card never jumps. */
    .sk { display: block; height: 10px; border-radius: 4px; background: var(--ox-skeleton, rgba(127, 127, 127, .12)); }
    .empty { padding: 18px; display: flex; flex-direction: column; gap: 6px; }
    .empty b { font-size: 15px; color: var(--ox-text); }
    .empty span { font-size: 13px; line-height: 1.45; color: var(--ox-text-muted); }

    @media (max-width: 480px) {
      .hd { flex-wrap: wrap; row-gap: 6px; padding: 12px 14px 0; }
      .bd { padding: 10px 14px 12px; }
      .pk-q { font-size: 18px; }
      .cap-row .meta { margin-left: 0; flex-basis: 100%; }
    }

<body>
  <div class="container" id="content">
    <article class="wcard" aria-busy="true" aria-label="Loading dispatch receipt">
      <div class="hd"><span class="sk" style="width:40%"></span></div>
      <div class="bd">
        <span class="sk" style="width:78%;height:22px"></span>
        <span class="sk" style="width:30%"></span>

  <script>

    // Sync theme from URL to override prefers-color-scheme
    (function() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    })();


    var injectHtml = (html) => {
      const content = document.getElementById('content');
      // Never create a blank interval between the loading skeleton and the
      // committed receipt. The boot timer already provides the minimum loading
      // dwell; replacement itself must be atomic for embedded app hosts.
      content.innerHTML = html;
    };

    var escapeHtml = (str) => { if (str === null || str === undefined || str === '') return ''; const div = document.createElement('div'); div.textContent = String(str); return div.innerHTML; };
    var firstString = (values) => values.find((value) => typeof value === 'string' && value.trim()) || null;
    var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    var stateParams = new URLSearchParams(window.location.search);
    var fixtureState = stateParams.get('state') || (stateParams.get('loading') === 'true' ? 'loading' : stateParams.get('demo') === 'true' ? 'progressing' : 'empty');
    if (fixtureState === 'completed') fixtureState = 'resolved';
    var isDemo = ['estimate', 'guard', 'populated', 'progressing', 'urgent', 'long', 'error', 'degraded', 'blocked', 'stale', 'resolved', 'queued', 'cancelled', 'polling'].includes(fixtureState);
    var isLoadingOverride = fixtureState === 'loading';

    var entity = isDemo ? { id: 'TSK-942', type: 'task', title: 'Implement rate limiting middleware for public API', agent_name: 'Eli', status: 'In Progress', domain: 'Engineering', workspace_name: 'Core Platform', links: [{ platform: 'Task', url: 'https://useorgx.com/live?view=mission-control&task=TSK-942', label: 'ENG-142' }] } : null;
    if (fixtureState === 'long' && entity) {
      entity.title = 'Implement tenant-aware rate limiting middleware, observability receipts, rollback controls, and adversarial load verification for the public API';
      entity.workspace_name = 'Core Platform and Reliability Operations';
    }
    if ((fixtureState === 'error' || fixtureState === 'degraded') && entity) {
      entity.workspace_name = null;
      entity.status = fixtureState === 'error' ? 'failed' : 'queued';
      entity.note = fixtureState === 'error'
        ? 'The handoff ended before an execution receipt was created.'
        : 'Dispatch accepted; waiting for the execution receipt.';
    }
    if (fixtureState === 'blocked' && entity) {
      entity.status = 'blocked';
      entity.note = 'This task is waiting on an explicit approval before work can continue.';
    }
    if (fixtureState === 'stale' && entity) {
      entity.status = 'in_progress';
      entity.run_id = 'run-stale-942';
      entity.last_heartbeat_at = new Date(Date.now() - 8 * 60 * 1000).toISOString();
      entity.note = 'The last heartbeat is outside the live window.';
    }
    if ((fixtureState === 'populated' || fixtureState === 'progressing' || fixtureState === 'urgent' || fixtureState === 'long') && entity) {
      entity.status = 'in_progress';
      entity.run_id = 'run-live-942';
      entity.last_heartbeat_at = new Date().toISOString();
    }
    if (fixtureState === 'resolved' && entity) {
      entity.status = 'completed';
      entity.run_id = 'run-live-942';
      entity.completed_at = new Date().toISOString();
    }
    if (fixtureState === 'queued' && entity) {
      entity.status = 'queued';
      entity.updated_at = new Date().toISOString();
    }
    if (fixtureState === 'polling' && entity) {
      // A real run id: the card asks orgx_command_status instead of guessing.
      entity.status = 'queued';
      entity.run_id = '7f3c2a10-5b1e-4c3d-9a8f-2e6b4d1c0a99';
      entity.updated_at = new Date().toISOString();
      entity.estimate = { recommended_model: 'standard', estimated_cost_usd: 0.42, budget_check: { max_cost_usd: 2, estimated_cost_usd: 0.42, within_cap: true } };
    }
    if (fixtureState === 'cancelled' && entity) {
      entity.status = 'cancelled';
      entity.run_id = 'run-live-942';
    }
    if (fixtureState === 'estimate') entity = { action: 'estimate', title: 'Implement rate limiting middleware for public API', estimate: { recommended_model: 'standard', estimated_cost_usd: 0.02, budget_check: { max_cost_usd: 0.5, estimated_cost_usd: 0.02, within_cap: true } } };
    if (fixtureState === 'guard') entity = { action: 'guard', allowed: false, blockedReason: 'Over the daily spend cap for this workspace.' };
    var isLoading = !isDemo;
    if (isLoadingOverride) { isLoading = true; isDemo = false; }
    var bootStartedAt = Date.now();
    var MIN_LOADING_MS = 220;
    var loadingSettled = false;
    var applyBootPayload = function(assign) {
      var commit = function() {
        if (typeof assign === 'function') assign();
        isLoading = false;
        render();
      };
      if (loadingSettled) {
        commit();
        return;
      }
      loadingSettled = true;
      var delay = Math.max(0, MIN_LOADING_MS - (Date.now() - bootStartedAt));
      window.setTimeout(commit, delay);
    };
    function resolveWidgetAsset(path){
        try {
            return new URL('shared/' + path, window.location.href).toString();
        } catch (error) {
            return 'https://mcp.useorgx.com/widgets/shared/' + path;
        }
    }
    if (window.OrgXElements && window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
      window.OrgXElements.avatarConfig.baseUrl = resolveWidgetAsset('avatars');
    }
    var ORGX_BASE_URL = 'https://useorgx.com';
    var buildEntityUrl = (type, id, initiativeId) => {
      if (!id) return ORGX_BASE_URL;
      var normalizedType = String(type || '').toLowerCase();
      if (normalizedType === 'run' || normalizedType === 'agent_run') {
        return ORGX_BASE_URL + '/agents/runs/' + encodeURIComponent(id);
      }
      if (normalizedType === 'task') {
        return initiativeId
          ? ORGX_BASE_URL + '/live/' + encodeURIComponent(initiativeId) + '?task=' + encodeURIComponent(id)
          : ORGX_BASE_URL + '/live?view=mission-control&task=' + encodeURIComponent(id);
      }
      if (normalizedType === 'initiative') {
        return ORGX_BASE_URL + '/live/' + encodeURIComponent(id);
      }
      if (normalizedType === 'workstream') {
        return initiativeId
          ? ORGX_BASE_URL + '/live/' + encodeURIComponent(initiativeId) + '?workstream=' + encodeURIComponent(id)
          : ORGX_BASE_URL + '/live?view=mission-control&workstream=' + encodeURIComponent(id);
      }
      if (normalizedType === 'milestone') {
        return initiativeId
          ? ORGX_BASE_URL + '/live/' + encodeURIComponent(initiativeId) + '?milestone=' + encodeURIComponent(id)
          : ORGX_BASE_URL + '/live?view=mission-control&milestone=' + encodeURIComponent(id);
      }
      if (normalizedType === 'agent') {
        return ORGX_BASE_URL + '/settings/agents?agent=' + encodeURIComponent(id);
      }
      return ORGX_BASE_URL;
    };
    var inferDomain = payload => {
      const source = [payload.domain, payload.agent_name, payload.agent_id].filter(Boolean).join(' ').toLowerCase();
      if (source.includes('product') || source.includes('pace')) return 'Product';
      if (source.includes('engineer') || source.includes('eli')) return 'Engineering';
      if (source.includes('market') || source.includes('mark')) return 'Marketing';
      if (source.includes('sale') || source.includes('sage')) return 'Sales';
      if (source.includes('design') || source.includes('dana')) return 'Design';
      if (source.includes('oper') || source.includes('orion')) return 'Operations';
      if (source.includes('orchestr') || source.includes('xandy')) return 'Orchestrator';
      return null;
    };
    var inferAgentName = payload => {
      const source = [payload.agent_id, payload.agent, payload.domain].filter(Boolean).join(' ').toLowerCase();
      if (source.includes('pace') || source.includes('product')) return 'Pace';
      if (source.includes('eli') || source.includes('engineer')) return 'Eli';
      if (source.includes('mark') || source.includes('market')) return 'Mark';
      if (source.includes('sage') || source.includes('sale')) return 'Sage';
      if (source.includes('dana') || source.includes('design')) return 'Dana';
      if (source.includes('orion') || source.includes('oper')) return 'Orion';
      if (source.includes('xandy') || source.includes('orchestr')) return 'Xandy';
      return null;
    };
    var resolveRunId = payload => firstString([
      payload.run_id, payload.runId, payload.spawned_run_id,
      payload.entity && payload.entity.run_id
    ]);
    var normalizeEntityPayload = payload => {
      if (!payload) return null;
      const action = String(payload._action || payload.action || 'spawn').toLowerCase();
      const dispatched = action === 'spawn' || action === 'handoff';
      const estimate = payload.estimate && typeof payload.estimate === 'object'
        ? payload.estimate
        : payload.budget_preflight && payload.budget_preflight.estimate
        ? payload.budget_preflight.estimate
        : null;
      const runId = resolveRunId(payload);
      if (payload.title && payload.agent_name && (payload.workspace_name || payload.id || payload.task_id || payload.run_id)) {
        return { ...payload, action, dispatched, estimate, run_id: runId, agent_ready: true, workspace_ready: !!payload.workspace_name, domain_ready: !!payload.domain, initiative_name: payload.initiative_name || null };
      }
      var inferredAgentName = payload.agent_name || inferAgentName(payload);
      var inferredDomain = payload.domain || inferDomain(payload);
      var workspaceName = payload.workspace_name || payload.command_center_name || null;
      var initiativeName = payload.initiative_name || payload.initiative_title || null;
      if (payload.entity && typeof payload.entity === 'object') {
        return {
          id: payload.entity.id || payload.id || payload.task_id || payload.run_id || null,
          type: payload.entity.type || payload.type || 'task',
          title: payload.entity.title || payload.title || payload.task_summary || payload.task_title || 'Execution dispatched',
          agent_name: inferredAgentName || payload.entity.agent_name || null,
          domain: inferredDomain,
          workspace_name: workspaceName,
          initiative_name: initiativeName,
          initiative_id: payload.initiative_id || payload.entity.initiative_id || null,
          status: payload.status || payload.entity.status || 'queued',
          run_id: runId,
          links: Array.isArray(payload.links) ? payload.links : [],
          console_url: payload.live_url || payload.url || null,
          agent_ready: !!(inferredAgentName || payload.entity.agent_name),
          workspace_ready: !!workspaceName,
          domain_ready: !!inferredDomain,
          note: payload.message || null,
          allowed: typeof payload.allowed === 'boolean' ? payload.allowed : null,
          blocked_reason: payload.blockedReason || payload.reason || null,
          action,
          dispatched,
          estimate
        };
      }
      return {
        id: payload.run_id || payload.task_id || null,
        type: payload.spawned_run_id ? 'handoff' : 'task',
        title:
          payload.title ||
          payload.task_summary ||
          payload.task_title ||
          payload.task ||
          payload.message ||
          (dispatched ? 'Execution dispatched' : 'Agent work preflight'),
        agent_name: inferredAgentName,
        domain: inferredDomain,
        workspace_name: workspaceName,
        initiative_name: initiativeName,
        initiative_id: payload.initiative_id || null,
        status: payload.status || 'queued',
        run_id: runId,
        last_heartbeat_at: payload.last_heartbeat_at || null,
        updated_at: payload.updated_at || null,
        links: [
          payload.task_id ? { platform: 'Task', url: buildEntityUrl('task', payload.task_id, payload.initiative_id), label: payload.task_short_id || payload.task_id.slice(0, 8) } : null,
          payload.run_id ? { platform: 'Run', url: payload.live_url || buildEntityUrl('run', payload.run_id), label: payload.run_short_id || payload.run_id.slice(0, 8) } : null
        ].filter(Boolean),
        console_url: payload.live_url || (payload.run_id ? buildEntityUrl('run', payload.run_id) : payload.task_id ? buildEntityUrl('task', payload.task_id, payload.initiative_id) : null),
        agent_ready: !!inferredAgentName,
        workspace_ready: !!workspaceName,
        domain_ready: !!inferredDomain,
        note: payload.message || null,
        allowed: typeof payload.allowed === 'boolean' ? payload.allowed : null,
        blocked_reason: payload.blockedReason || payload.reason || null,
        action,
        dispatched,
        estimate
      };
    };

    /* ── Run status: ask OrgX, never guess ─────────────────────────────
       A spawn result is a snapshot from the moment the tool ran. When it
       carries a run id the card polls orgx_command_status and shows what
       the server says (queued, running, done, failed, cancelled), waiting
       next_poll_after_ms between checks and stopping when it is null. */
    var runStatus = { runId: null, timer: null, failures: 0, data: null, checkedAt: null, unreachable: false, missing: false };

    // Gallery only: a scripted status sequence standing in for the server.
    var galleryStatusSequence = [
      { state: 'queued', next_poll_after_ms: 1600 },
      { state: 'running', outcome: 'step 2 of 4', next_poll_after_ms: 1600 },
      { state: 'running', outcome: 'step 4 of 4', next_poll_after_ms: 1600 },
      { state: 'succeeded', outcome: 'checks passed', next_poll_after_ms: null }
    ];
    var galleryStatusIndex = 0;

    function fetchRunStatus(runId) {
      if (fixtureState === 'polling') {
        var step = galleryStatusSequence[Math.min(galleryStatusIndex++, galleryStatusSequence.length - 1)];
        return Promise.resolve(Object.assign({ kind: 'run', id: runId, updated_at: new Date().toISOString() }, step));
      }
      var runtime = window.OrgXWidgetRuntime;
      if (!runtime || !runtime.callTool) return Promise.reject(new Error('Status is unavailable here.'));
      return Promise.resolve(runtime.callTool('orgx_command_status', { kind: 'run', id: runId })).then(function(result) {
        return runtime.extractStructuredWidgetData ? runtime.extractStructuredWidgetData(result, true) : result;
      });
    }

    function stopRunPolling() {
      if (runStatus.timer) window.clearTimeout(runStatus.timer);
      runStatus.timer = null;
    }

    function scheduleRunCheck(ms) {
      stopRunPolling();
      runStatus.timer = window.setTimeout(checkRunStatus, Math.max(0, ms));
    }

    function canPollRuns() {
      if (fixtureState === 'polling') return true;
      var runtime = window.OrgXWidgetRuntime;
      return !!(runtime && runtime.detectProtocol && runtime.detectProtocol() !== 'standalone');
    }

    function watchRun(runId) {
      if (!runId || !UUID_RE.test(runId) || !canPollRuns()) return;
      if (runStatus.runId === runId) return;
      stopRunPolling();
      runStatus = { runId: runId, timer: null, failures: 0, data: null, checkedAt: null, unreachable: false, missing: false };
      scheduleRunCheck(fixtureState === 'polling' ? 900 : 0);
    }

    function checkRunStatus() {
      var runId = runStatus.runId;
      if (!runId) return;
      runStatus.timer = null;
      fetchRunStatus(runId).then(function(data) {
        if (runStatus.runId !== runId) return;
        runStatus.failures = 0;
        runStatus.unreachable = false;
        runStatus.checkedAt = Date.now();
        if (!data || typeof data !== 'object' || typeof data.state !== 'string') {
          runStatus.unreachable = true;
          render();
          return;
        }
        if (data.state === 'not_found') {
          runStatus.missing = true;
          runStatus.data = null;
          render();
          return;
        }
        runStatus.data = data;
        render();
        var wait = data.next_poll_after_ms;
        if (typeof wait === 'number' && isFinite(wait)) scheduleRunCheck(Math.max(1000, wait));
      }).catch(function() {
        if (runStatus.runId !== runId) return;
        runStatus.failures += 1;
        if (runStatus.failures < 3) {
          scheduleRunCheck(4000 * runStatus.failures);
          return;
        }
        runStatus.unreachable = true;
        render();
      });
    }

    function formatClock(ms) {
      try {
        return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return '';
      }
    }

    function formatUsd(value) {
      if (typeof value !== 'number' || !isFinite(value)) return null;
      if (value === 0) return '$0';
      if (value < 0.1) return '$' + value.toFixed(value < 0.01 ? 4 : 3);
      return '$' + value.toFixed(2);
    }

    function normalizedStatus(model) {
      return String(model.status || '').toLowerCase().replace(/[^a-z]+/g, '_');
    }

    /* One description of the card for the current truth. Every visible
       status (edge, chip, avatar form, footer) reads from it. */
    function describeDispatch(model, stateMeta) {
      var isDispatch = model.dispatched !== false;
      var agent = model.agent_name || 'The agent';
      var live = runStatus.runId && runStatus.data ? runStatus.data : null;
      // The execution link is the same one the card always opened.
      var consoleUrl = model.console_url || (model.id ? buildEntityUrl(model.type, model.id, model.initiative_id) : ORGX_BASE_URL);
      var view;

      if (!isDispatch) {
        if (model.action === 'guard' && model.allowed === false) {
          view = { chip: 'blocked', chipLabel: 'Dispatch blocked', edge: 'red',
            footer: { variant: 'confirms-in-orgx', state: 'rejected', heading: 'Dispatch blocked', detail: model.blocked_reason || 'nothing was started', action: '' } };
        } else {
          view = { chip: null, edge: 'mute',
            footer: { variant: 'reads', state: 'caught-up', heading: 'Preflight only · no dispatch', detail: model.action === 'guard' ? 'the guard allows this dispatch' : 'nothing was started' } };
        }
        view.key = 'preflight';
        view.kind = model.action === 'estimate' ? 'Route estimate' : model.action === 'guard' ? 'Dispatch guard' : 'Agent route';
        view.note = model.action === 'estimate'
          ? 'Routing and cost context only. No agent work was dispatched.'
          : model.action === 'guard'
          ? 'OrgX checked whether this delegation can proceed. No agent work was dispatched.'
          : 'OrgX classified the best execution route. No agent work was dispatched.';
        view.consoleUrl = consoleUrl;
        return view;
      }

      var state = stateMeta.state;
      var heading = null;
      var detail = null;
      if (live) {
        if (live.state === 'queued' || live.state === 'held') state = 'queued';
        else if (live.state === 'running') state = 'in_progress';
        else if (live.state === 'succeeded') state = 'completed';
        else if (live.state === 'failed') state = 'failed';
        else if (live.state === 'cancelled') state = 'cancelled';
        if (live.waiting_on === 'person' && (state === 'queued' || state === 'in_progress')) state = 'blocked';
        if (live.state === 'held') heading = 'Held before it starts';
        detail = live.outcome || null;
      } else if (normalizedStatus(model) === 'cancelled' || normalizedStatus(model) === 'canceled') {
        state = 'cancelled';
      }

      // The same action the card has always carried, named for the state.
      const executionLabel = stateMeta.state === 'completed' ? 'View result' : stateMeta.state === 'stale' || stateMeta.state === 'blocked' ? 'Open current state' : 'Open execution';
      var checked = runStatus.checkedAt ? 'checked ' + formatClock(runStatus.checkedAt) : null;
      var age = window.OrgXWidgetState ? window.OrgXWidgetState.formatAge(model) : null;
      switch (state) {
        case 'completed':
          view = { chip: 'succeeded', edge: 'teal', footer: { variant: 'queues-work', state: 'done', heading: heading || 'Done', detail: detail || 'Execution complete', action: 'View result ↗' } };
          break;
        case 'in_progress':
          view = { chip: 'running', edge: 'teal', footer: { variant: 'queues-work', state: 'running', heading: heading || agent + ' is running', detail: detail || checked || (age ? age.replace(/^Updated/, 'updated') : 'heartbeat current'), action: 'Watch ↗' } };
          break;
        case 'queued':
          view = { chip: 'queued', edge: 'teal', footer: { variant: 'queues-work', state: 'queued', heading: heading || 'Waiting to start', detail: detail || 'waiting for an execution slot', action: executionLabel + ' ↗' } };
          break;
        case 'starting':
          view = { chip: 'queued', chipLabel: 'Accepted', edge: 'teal', footer: { variant: 'queues-work', state: 'queued', heading: 'Dispatch accepted', detail: 'waiting for the execution receipt', action: executionLabel + ' ↗' } };
          break;
        case 'stale':
          view = { chip: 'stale', edge: 'amber', footer: { variant: 'reads', state: 'stale', heading: 'Out of date', detail: age ? age.replace(/^Updated /, '') : 'no current heartbeat', action: executionLabel + ' ↗' } };
          break;
        case 'blocked':
          view = { chip: 'needs_you', edge: 'amber', footer: { variant: 'confirms-in-orgx', state: 'draft', heading: live && live.waiting_on === 'person' ? 'Waiting on you in OrgX' : 'Waiting on approval', detail: detail || 'nothing runs until it is approved', primary: executionLabel + ' ↗' } };
          break;
        case 'failed':
          view = { chip: 'failed_step', edge: 'red', footer: { variant: 'finishes-here', state: 'failed', heading: 'Run failed', detail: detail || 'nothing was delivered', primary: executionLabel + ' ↗' } };
          break;
        case 'cancelled':
          view = { chip: 'cancelled', edge: 'mute', footer: { variant: 'confirms-in-orgx', state: 'rejected', heading: 'Cancelled', detail: detail || 'nothing more will run', action: executionLabel + ' ↗' } };
          break;
        default:
          view = { chip: 'handed_off', chipLabel: 'Awaiting state', edge: 'mute', footer: { variant: 'queues-work', state: 'queued', heading: 'Awaiting state', detail: 'OrgX has not reported a state yet', action: executionLabel + ' ↗' } };
      }
      view.key = state;
      view.kind = model.action === 'handoff' ? 'Handed off' : 'Dispatched';
      // Say it once: the footer carries the short state; the note explains
      // only what the footer cannot (why it is waiting, what went wrong).
      view.note = state === 'in_progress' || state === 'completed' || state === 'queued' ? null : (model.note || stateMeta.description);
      if (state === 'starting' && !model.note) view.note = stateMeta.description + ' The execution link remains the proof boundary.';
      if (runStatus.missing) view.note = 'OrgX has no status for this run yet. Showing what the dispatch reported.';
      if (runStatus.unreachable) view.note = 'Could not check the run just now. Showing the last known state.';
      view.consoleUrl = consoleUrl;
      return view;
    }

    function renderCap(model) {
      var est = model.estimate || {};
      var check = est.budget_check || {};
      var cost = typeof check.estimated_cost_usd === 'number' ? check.estimated_cost_usd : est.estimated_cost_usd;
      var cap = typeof check.max_cost_usd === 'number' ? check.max_cost_usd : est.max_cost_usd;
      var route = [est.recommended_tier || est.model_tier || est.tier, est.recommended_model || est.model, est.provider].filter(Boolean).join(' · ');
      if (typeof cost !== 'number' && !route) return '';
      var costLabel = formatUsd(cost);
      if (typeof cap === 'number' && cap > 0 && typeof cost === 'number') {
        var over = cost > cap;
        var estPct = Math.min(100, (Math.min(cost, cap) / Math.max(cost, cap)) * 100);
        var tail = over ? '· over the cap by ' + formatUsd(cost - cap) : '· ' + formatUsd(cap - cost) + ' left';
        return '<div class="cap">'
          + '<div class="segbar" role="img" aria-label="Estimated ' + escapeHtml(costLabel) + ' of a ' + escapeHtml(formatUsd(cap)) + ' cap"><i class="est" style="width:' + estPct.toFixed(1) + '%"></i>' + (over ? '<i class="over" style="width:' + (100 - estPct).toFixed(1) + '%"></i>' : '') + '</div>'
          + '<div class="cap-row"><span class="v">Est. ' + escapeHtml(costLabel) + ' of ' + escapeHtml(formatUsd(cap)) + '</span><span class="muted">' + escapeHtml(tail + (route ? ' · ' + route : '')) + '</span><span class="meta">Spend cap for this run</span></div>'
          + '</div>';
      }
      return '<div class="cap-row">' + (costLabel ? '<span class="v">Est. ' + escapeHtml(costLabel) + '</span>' : '') + (route ? '<span class="muted">' + escapeHtml((costLabel ? '· ' : '') + route) + '</span>' : '') + '</div>';
    }

    function receiptRow(attrs) {
      var out = '<ox-receipt-row';
      Object.keys(attrs).forEach(function(key) {
        if (attrs[key] === null || attrs[key] === undefined || attrs[key] === '') return;
        out += ' ' + key + '="' + escapeHtml(attrs[key]) + '"';
      });
      return out + '></ox-receipt-row>';
    }

    function usableLinks(model) {
      return (model.links || []).map(function(l) {
        const rawUrl = typeof l.url === 'string' ? l.url.trim() : '';
        const hasRealUrl = /^https?:\/\//i.test(rawUrl) && rawUrl !== '#';
        const fallbackUrl = buildEntityUrl(model.type, model.id, model.initiative_id);
        if (!hasRealUrl && !fallbackUrl) return null;
        return Object.assign({}, l, {
          url: hasRealUrl ? rawUrl : fallbackUrl,
          platform: hasRealUrl ? (l.platform || 'OrgX') : 'Task',
        });
      }).filter(Boolean);
    }

    function renderRows(model, view) {
      var isDispatch = model.dispatched !== false;
      var rows = usableLinks(model).map(function(l) {
        return receiptRow({ status: 'met', label: 'Open ' + l.platform + ' · ' + (l.label || model.id || 'OrgX'), detail: [model.workspace_name, model.domain].filter(Boolean).join(' · '), href: l.url });
      });
      if (!isDispatch) {
        rows.push(receiptRow({ status: 'unverified', label: 'Result · No dispatch', detail: model.agent_name ? 'Requested owner · ' + model.agent_name : 'Requested owner · Automatic' }));
        return rows.join('');
      }
      var receiptId = firstString([model.receipt_id, model.receiptId, model.run_id, model.runId, model.execution_id, model.executionId]);
      if (receiptId) {
        var shortId = UUID_RE.test(receiptId) ? 'run ' + receiptId.slice(0, 8) : receiptId;
        rows.push(receiptRow({
          status: view.key === 'failed' ? 'fail' : view.key === 'completed' ? 'met' : view.key === 'stale' || view.key === 'cancelled' ? 'unverified' : 'pending',
          label: 'Receipt · ' + shortId,
          detail: view.key === 'completed' ? 'Execution complete' : runStatus.data ? 'Status from OrgX' : 'Reported by the dispatch',
          value: runStatus.checkedAt ? formatClock(runStatus.checkedAt) : ''
        }));
      } else {
        rows.push(receiptRow({ status: 'pending', label: 'Receipt · awaiting receipt ID', detail: model.workspace_ready ? model.workspace_name : 'Context syncing' }));
      }
      return rows.join('');
    }

    var currentView = null;

    var render = () => {
      if (isLoading) return;
      var model = normalizeEntityPayload(entity);
      if (!model) {
        stopRunPolling();
        injectHtml('<article class="wcard"><div class="empty"><b>No dispatch receipt</b><span>No agent handoff was returned. Nothing is presented as running until OrgX supplies a task or run receipt.</span></div></article>');
        return;
      }
      if (model.dispatched !== false) watchRun(model.run_id);
      const stateMeta = window.OrgXWidgetState
        ? window.OrgXWidgetState.derive(model)
        : { state: String(model.status || 'unknown').toLowerCase(), label: 'Awaiting state', description: 'OrgX has not returned a reliable execution state yet.', hasExecutionEvidence: false };
      var view = describeDispatch(model, stateMeta);
      currentView = view;

      var identity = window.OrgXAgentIdentity;
      var agentKey = identity ? identity.resolveAgentKey(model.agent_name, model.domain) : null;
      var form = identity && view.chip ? identity.formForState(view.chip) : 'base';
      var typeKey = String(model.type || '').toLowerCase();
      var glyphKind = model.run_id ? 'run' : ['initiative', 'workstream', 'milestone', 'task'].indexOf(typeKey) !== -1 ? typeKey : 'task';
      var glyphTone = view.edge === 'mute' ? '' : view.edge;
      var place = model.initiative_name || model.workspace_name;
      var who = model.agent_name
        ? '<span class="who2">' + (agentKey ? '<ox-avatar agent="' + agentKey + '" form="' + form + '" size="20" name="' + escapeHtml(model.agent_name) + '"></ox-avatar>' : '') + '<b>' + escapeHtml(model.agent_name) + '</b></span>'
        : model.dispatched !== false ? '<span class="who2">Confirming agent</span>' : '';
      var ft = view.footer;
      var footerAttrs = 'variant="' + ft.variant + '" state="' + ft.state + '" heading="' + escapeHtml(ft.heading) + '" detail="' + escapeHtml(ft.detail || '') + '"'
        + (ft.primary !== undefined ? ' primary-label="' + escapeHtml(ft.primary) + '"' : '')
        + (ft.action !== undefined ? ' action-label="' + escapeHtml(ft.action) + '"' : '');

      injectHtml(
        '<article class="wcard" data-edge="' + view.edge + '" data-state="' + escapeHtml(view.key) + '">'
        + '<div class="hd">'
        + '<ox-glyph kind="' + glyphKind + '"' + (glyphTone ? ' tone="' + glyphTone + '"' : '') + '></ox-glyph>'
        + '<span class="kind">' + escapeHtml(view.kind) + '</span>'
        + (place ? '<span class="src">in <ox-glyph kind="' + (model.initiative_name ? 'initiative' : 'workstream') + '"></ox-glyph><b>' + escapeHtml(place) + '</b></span>' : '')
        + '<span class="sp"></span>' + who
        + '</div>'
        + '<div class="bd">'
        + '<h3 class="pk-q">' + escapeHtml(model.title) + '</h3>'
        + (view.chip ? '<div class="status"><ox-state-chip state="' + view.chip + '"' + (view.chipLabel ? ' label="' + escapeHtml(view.chipLabel) + '"' : '') + ' reserve="queued running succeeded failed_step stale needs_you cancelled"></ox-state-chip>'
          + (model.dispatched !== false && window.OrgXWidgetState && window.OrgXWidgetState.observedAt(runStatus.data || model) !== null ? '<span class="meta">' + escapeHtml(window.OrgXWidgetState.formatAge(runStatus.data || model)) + '</span>' : '') + '</div>' : '')
        + (view.note ? '<p class="note">' + escapeHtml(view.note) + '</p>' : '')
        + renderCap(model)
        + '<div class="rows" role="list" aria-label="Dispatch receipts">' + renderRows(model, view) + '</div>'
        + '</div>'
        + '<ox-footer id="dispatchFooter" ' + footerAttrs + '></ox-footer>'
        + '</article>'
      );
      var footer = document.getElementById('dispatchFooter');
      if (footer) {
        footer.addEventListener('ox-primary', onFooterAction);
        footer.addEventListener('ox-action', onFooterAction);
      }
    };

    function openExecution(href, footer) {
      if (!href) return;
      var proceed = window.openWidgetLink ? window.openWidgetLink(href) : true;
      if (proceed) {
        try { window.open(href, '_blank', 'noopener,noreferrer'); } catch (_) { /* host owns navigation */ }
      }
      // The kit locks the primary until the state changes; opening OrgX does
      // not change the run, so hand the button back.
      if (footer) footer.setAttribute('state', footer.getAttribute('state') || '');
    }

    function onFooterAction(event) {
      if (!currentView) return;
      openExecution(currentView.consoleUrl, event.currentTarget);
    }

    // Receipt rows are links; route them through the host instead of a raw navigation.
    document.addEventListener('ox-open', function(event) {
      var href = event.detail && event.detail.href;
      if (!href || !window.openWidgetLink) return;
      if (window.openWidgetLink(href, event) === false) event.preventDefault();
    });

    if (isLoadingOverride) render();
    else if (isDemo) applyBootPayload();
    else initWidget({
      /* Spawning a task used to end the story here. The grant turns the
         dispatch receipt into a view of the work it started. */
      live: { anchor: '#content', widget: 'task-spawned', emptyLabel: 'No agents running yet' },
      render: d => { applyBootPayload(function(){ if(d) entity = d; }); }
    });

  </script>
</body>
</html>
