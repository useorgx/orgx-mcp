        ? window.OrgXWidgetRuntime.getToolResponseMetadata('orgx/widgetApproval')
        : null;
      const token = meta && meta.approval_tokens ? meta.approval_tokens[decisionId] : null;
      if (typeof token === 'string' && token) return token;
      // Gallery fixtures only: never set for a real tool result.
      return demoApprovalTokens && demoApprovalTokens[decisionId] ? demoApprovalTokens[decisionId] : null;
    };

    // Why this one is decided in OrgX: one sentence per reason the server gives.
    var DECIDE_IN_ORGX_COPY = {
      credential_required: 'It needs a credential, and credentials are entered only in OrgX.',
      integration_connection_required: 'It settles when you connect the integration in OrgX.',
      form_input_required: 'It asks for several answers. Fill them in OrgX.',
      options_unavailable: 'Its options could not be read here. Choose in OrgX.',
      artifact_reference_invalid: 'The artifact under review could not be opened here. Review it in OrgX.',
      specialized_lifecycle: 'This type runs its own review in OrgX.',
      requester_cannot_approve: 'You requested this action, so another approver decides it.',
      widget_approvals_disabled: 'Deciding from chat is off for this workspace.',
      action_authority_denied: 'Your role can’t approve this from chat. OrgX shows who can.',
      token_mismatch: 'This view belongs to another account or workspace. Open it in OrgX.',
      lifecycle_required: 'This one finishes in OrgX.',
      chat_unavailable: 'This chat can’t settle it right now, so nothing was sent.',
      // Older servers.
      critical: 'Critical decisions are made in OrgX.',
      choice_required: 'Choose between the options in OrgX.',
      agent_run_approval: 'Agent run approvals are made in OrgX.',
      protected_decision_type: 'This one needs the full review in OrgX.',
      artifact_review_lifecycle: 'This one needs the full review in OrgX.',
    };
    var decideInOrgxDetail = (decision) => DECIDE_IN_ORGX_COPY[decision && decision.decide_in_orgx_reason] ||
      (chatCannotDecide ? DECIDE_IN_ORGX_COPY.chat_unavailable : 'Open it in OrgX to decide.');

    var buildDecisionSurfaceUrl = (decision) => {
      const links = window.OrgXLinks;
      if (!decision || !decision.id) return links.decisions();
      for (const candidate of [decision.review_url, decision.url, decision.link]) {
        const url = typeof candidate === 'string' ? links.normalize(candidate) : '';
        if (url) return url;
      }
      const refs = decision.context_refs || {};
      const kind = kindFromType(decision);
      // Agent-run approvals open their run; actions waiting on approval open the decision queue.
      if (kind === 'approval' && UUID_RE.test(firstString(refs.run_id))) return links.run(refs.run_id);
      if (kind === 'action') return buildDecisionsUrl();
      return links.decision(decision.id);
    };

    // Links leave through the host; standalone previews open a tab.
    var openExternal = (url, event) => {
      if (!url) return;
      if (window.openWidgetLink && openWidgetLink(url, event) === false) return;
      if (event && event.defaultPrevented) return;
      try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (_) { /* host owns recovery */ }
    };

    var firstString = (...values) => {
      for (const value of values) {
        if (typeof value === 'string' && value.trim()) return value.trim();
      }
      return '';
    };

    var humanizeDecisionKey = (key) => String(key || '')
      .replace(/[_-]+/g, ' ')
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .trim();

    var pushUniqueText = (parts, value) => {
      var text = typeof value === 'string' ? value.trim() : '';
      if (!text || parts.includes(text)) return;
      parts.push(text);
    };

    // Placeholders the app sends when it knows nothing: never worth a line on the card.
    var isEmptyUnknown = (text) => {
      const t = String(text || '').trim().replace(/[.!]+$/, '');
      if (!t) return true;
      if (/^(?:n\/?a|none|null|undefined|unknown|tbd|not set|unavailable|pending|[-–—?]+)$/i.test(t)) return true;
      return t.length <= 40 && /\b(?:not linked|not set|not available|unavailable|unknown)$/i.test(t);
    };
    var sentence = (text) => {
      const t = String(text || '').trim();
      if (!t) return '';
      const s = t.charAt(0).toUpperCase() + t.slice(1);
      return /[.!?…)"”]$/.test(s) ? s : s + '.';
    };

    // Free-form fields as words: booleans and empty unknowns are dropped, never printed as "blocked: false".
    var formatDecisionField = (value, depth) => {
      if (value === null || value === undefined) return '';
      if (typeof value === 'string') return isEmptyUnknown(value) ? '' : value.trim();
      if (typeof value === 'boolean') return '';
      if (typeof value === 'number') return Number.isFinite(value) ? String(value) : '';
      if (Array.isArray(value)) {
        var listParts = [];
        value.forEach((item) => pushUniqueText(listParts, formatDecisionField(item, (depth || 0) + 1)));
        return listParts.join(' • ');
      }
      if (typeof value === 'object') {
        if ((depth || 0) > 2) return '';
        var objectParts = [];
        var preferredKeys = ['summary', 'text', 'message', 'title', 'description', 'reason', 'note', 'content', 'detail', 'details', 'body', 'why', 'impact', 'recommendation'];
        var hiddenKeys = ['id', 'uuid', 'created_at', 'createdAt', 'updated_at', 'updatedAt', 'decision_id', 'entity_id', 'initiative_id', 'workstream_id', 'milestone_id', 'task_id', 'run_id', 'mission_id', 'policy_key', 'status', 'state', 'provenance', 'evidence'];
        var orderedKeys = preferredKeys.filter((key) => key in value);
        Object.keys(value).forEach((key) => {
          if (orderedKeys.includes(key) || hiddenKeys.includes(key)) return;
          orderedKeys.push(key);
        });
        orderedKeys.forEach((key) => {
          var formatted = formatDecisionField(value[key], (depth || 0) + 1);
          if (!formatted) return;
          if (preferredKeys.includes(key)) {
            pushUniqueText(objectParts, formatted);
            return;
          }
          pushUniqueText(objectParts, sentence(humanizeDecisionKey(key)).replace(/\.$/, '') + ': ' + formatted);
        });
        return objectParts.map(sentence).join(' ');
      }
      return '';
    };

    // "Why it matters" from a review packet, in short sentences. The evidence list renders as
    // receipt rows and a missing recommendation is said once, in the recommendation line.
    var IDLE_STATES = ['pending', 'open', 'needs_decision', 'awaiting_decision', 'pending_decision', 'needs_you', 'in_review'];
    var textOf = (value) => typeof value === 'string' ? value.trim()
      : value && typeof value === 'object' && !Array.isArray(value) ? firstString(value.summary, value.title, value.text, value.label, value.name, value.description) : '';
    var packetContextLines = (packet) => {
      const lines = [];
      const outcome = textOf(packet.outcome);
      if (outcome && !isEmptyUnknown(outcome)) lines.push('It serves this outcome: ' + sentence(outcome));
      const current = packet.current;
      if (current && typeof current === 'object' && !Array.isArray(current)) {
        const state = firstString(current.state, current.status).toLowerCase();
        if (state && !IDLE_STATES.includes(state) && !isEmptyUnknown(state)) lines.push('It is ' + humanizeDecisionKey(state).toLowerCase() + ' right now.');
        if (current.blocked === true) lines.push('It is blocking work until you decide.');
        const note = firstString(current.summary, current.note, current.detail);
        if (note && !isEmptyUnknown(note)) lines.push(sentence(note));
      } else if (textOf(current) && !isEmptyUnknown(textOf(current))) {
        lines.push(sentence(textOf(current)));
      }
      const uncertainty = textOf(packet.uncertainty);
      if (uncertainty && !isEmptyUnknown(uncertainty) && !/\bno\b.*\brecommendation\b/i.test(uncertainty)) {
        lines.push('Still uncertain: ' + sentence(uncertainty));
      }
      return lines;
    };
    var contextLines = (packet, raw) => {
      if (packet) return packetContextLines(packet);
      const text = formatDecisionField(raw);
      return text ? [text] : [];
    };

    // A recommendation the app could not make is not a recommendation: no "status: unavailable".
    var EMPTY_RECOMMENDATION = ['unavailable', 'none', 'missing', 'pending', 'not_available', 'skipped', 'failed', 'error'];
    var readRecommendation = (value) => {
      if (value === null || value === undefined) return { text: '', empty: false, unverified: false };
      if (typeof value === 'string') return { text: isEmptyUnknown(value) ? '' : value.trim(), empty: isEmptyUnknown(value), unverified: false };
      if (typeof value !== 'object' || Array.isArray(value)) {
        const text = formatDecisionField(value);
        return { text, empty: !text, unverified: false };
      }
      const status = firstString(value.status).toLowerCase();
      const action = firstString(value.action, value.summary, value.text, value.recommendation, value.title, value.label);
      const why = firstString(value.rationale, value.reason, value.why);
      if (EMPTY_RECOMMENDATION.includes(status) && !action) return { text: '', empty: true, unverified: false };
      const parts = [action && !isEmptyUnknown(action) ? action : '', why && !isEmptyUnknown(why) ? why : ''].filter(Boolean);
      const text = parts.length > 1 ? sentence(parts[0]) + ' ' + parts[1] : parts[0] || '';
      return { text, empty: !text, unverified: status === 'unverified' };
    };

    // The headline: the title when the item has its own, else the first sentence, whole. A first
    // sentence that runs long splits at its label ("Production verification of PR #424: …");
    // otherwise CSS clamps it and "Show the whole request" lifts the clamp. Never "…" + an orphan.
    var HEADLINE_MAX = 96;
    var HEADLINE_LONG = 110;
    var NOT_A_SENTENCE_END = /(?:\b(?:e\.g|i\.e|vs|etc|approx|incl|No|Mr|Ms|Dr|St|Inc|Ltd)|\b[A-Z])$/;
    var firstSentence = (text) => {
      const re = /[.!?](?=\s+["“(]?[A-Z0-9])/g;
      let match;
      while ((match = re.exec(text))) {
        const end = match.index + 1;
        if (end < 12 || NOT_A_SENTENCE_END.test(text.slice(0, match.index))) continue;
        return { head: text.slice(0, end).trim(), rest: text.slice(end).trim() };
      }
      return { head: text, rest: '' };
    };
    var splitHeadline = (title, text) => {
      const full = String(text || '').replace(/\s+/g, ' ').trim();
      const own = String(title || '').replace(/\s+/g, ' ').trim();
      if (own && own !== full && own.length <= HEADLINE_MAX) {
        return { headline: own, body: full.startsWith(own) ? full.slice(own.length).trim() : full };
      }
      let { head, rest } = firstSentence(full || own);
      if (head.length > HEADLINE_LONG) {
        // "Label: the long rest" reads as a headline and its body.
        const colon = head.indexOf(': ');
        if (colon >= 16 && colon <= HEADLINE_MAX) {
          const after = head.slice(colon + 2).trim();
          rest = sentence(after.charAt(0).toUpperCase() + after.slice(1)) + (rest ? ' ' + rest : '');
          head = head.slice(0, colon).trim();
        }
      }
      return { headline: head, body: rest };
    };

    /* ------------------------------------------------------------- body -- */
    // Decision text arrives as one paragraph holding a reason, a command, a URL and what approving
    // does. Sentences are sorted into a short lede, labelled facts ("Agent’s reason: …"),
    // commands (set as code), and the approve consequence and recommendation (shown where those
    // belong on the card). Inline: URLs become links, `code` and long hashes become code.
    var CLI_RE = /^(?:gh|git|pnpm|npm|npx|yarn|curl|kubectl|docker|terraform|make|psql|python3?|node|bash|sh|orgx)\s+\S/;
    var URL_RE = /\bhttps?:\/\/[^\s<>"')\]]+[^\s<>"')\].,;:!?]/g;
    var sentencesOf = (text) => {
      const out = [];
      let rest = String(text || '').replace(/\s+/g, ' ').trim();
      while (rest) {
        const { head, rest: tail } = firstSentence(rest);
        out.push(head);
        if (!tail || tail === rest) break;
        rest = tail;
      }
      return out;
    };
    var inlineHtml = (text) => {
      const raw = String(text || '');
      let html = '';
      let last = 0;
      raw.replace(URL_RE, (url, at) => {
        html += inlineText(raw.slice(last, at));
        const label = url.replace(/^https?:\/\/(www\.)?/, '');
        html += `<a ${linkAttrs(window.OrgXLinks.normalize(url) || url)}>${escapeHtml(label.length > 48 ? label.slice(0, 46) + '…' : label)}</a>`;
        last = at + url.length;
        return url;
      });
      return html + inlineText(raw.slice(last));
    };
    var inlineText = (text) => escapeHtml(text)
      .replace(/`([^`]{1,200})`/g, (m, code) => `<code>${code}</code>`)
      .replace(/\b([0-9a-f]{12,64})\b/g, (m, hash) => `<code title="${hash}">${hash.slice(0, 10)}</code>`);
    var structureBody = (text) => {
      const parts = { lede: [], facts: [], commands: [], ifApproved: '', recommendation: '' };
      sentencesOf(text).forEach((line) => {
        const bare = line.replace(/[.!]$/, '');
        const labelled = /^([A-Z][\w’' -]{2,28}?)\s*:\s+(.+)$/.exec(line);
        const label = labelled ? labelled[1].trim() : '';
        if (labelled && /^(?:command|run|cmd|shell)$/i.test(label)) { parts.commands.push(labelled[2].replace(/[.]$/, '')); return; }
        if (CLI_RE.test(bare) && !/\s(?:the|to|and|because)\s/i.test(bare)) { parts.commands.push(bare); return; }
        if (labelled && /^(?:recommendation|recommended|suggestion)$/i.test(label)) { if (!parts.recommendation) parts.recommendation = sentence(labelled[2]); return; }
        if (/^(?:approve|approving|approval)\b.{0,40}\b(?:to|lets?|will|runs?)\b/i.test(line) && !parts.ifApproved) {
          parts.ifApproved = sentence(line.replace(/^(?:approve|approving|approval)\s+(?:to\s+)?/i, '').replace(/^\w/, (c) => c.toUpperCase()));
          return;
        }
        if (labelled && label.length <= 24 && !/^https?$/i.test(label)) { parts.facts.push({ k: label, v: labelled[2].replace(/^[a-z]/, (c) => c.toUpperCase()) }); return; }
        parts.lede.push(line);
      });
      return parts;
    };
    var bodyHtml = (parts) => {
      const lede = parts.lede.length ? `<p class="dq-lede">${inlineHtml(parts.lede.join(' '))}</p>` : '';
      const facts = parts.facts.length
        ? `<dl class="dq-facts">${parts.facts.map((f) => `<dt>${escapeHtml(f.k)}</dt><dd>${inlineHtml(f.v)}</dd>`).join('')}</dl>`
        : '';
      const commands = parts.commands.map((c) => `<div class="dq-cmd"><span class="k">Command</span><pre><code>${escapeHtml(c)}</code></pre></div>`).join('');
      return lede + facts + commands;
    };

    // Evidence lists become receipt rows: one line of proof each.
    var RECEIPT_STATUS = { met: 'met', pass: 'met', passed: 'met', ok: 'met', verified: 'met', succeeded: 'met', fail: 'fail', failed: 'fail', failing: 'fail', yours: 'yours', pending: 'pending', checking: 'pending' };
    var normalizeEvidenceItems = (value) => {
      if (!Array.isArray(value)) return [];
      return value.map((item) => {
        if (typeof item === 'string') return item.trim() ? { label: item.trim(), status: 'unverified' } : null;
        if (!item || typeof item !== 'object') return null;
        const label = firstString(item.label, item.title, item.summary, item.name, item.description);
        if (!label) return null;
        const rawStatus = firstString(item.status, item.verdict, item.result).toLowerCase();
        return {
          label,
          status: RECEIPT_STATUS[rawStatus] || 'unverified',
          at: firstString(item.created_at, item.createdAt, item.at, item.updated_at),
          url: firstString(item.url, item.href, item.link),
        };
      }).filter(Boolean);
    };

    var pickConsequence = (source, keys) => {
      if (!source || typeof source !== 'object' || Array.isArray(source)) return '';
      for (const key of keys) {
        if (key in source) {
          const text = formatDecisionField(source[key]);
          if (text) return text;
        }
      }
      return '';
    };

    var resolveWidgetAsset = (path) => new URL('shared/' + path, window.location.href).toString();
    // Previews served next to the widgets read avatars from the same origin;
    // host sandboxes use the kit default (mcp.useorgx.com).
    if (window.OrgXElements && window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
      window.OrgXElements.avatarConfig.baseUrl = resolveWidgetAsset('avatars');
    }

    /* ------------------------------------------------------------- choices -- */
    // What the person can do here comes from the server, never from the decision's type.
    // widget_actions is the app's per-item contract: the two buttons and their labels, the
    // options (one or several, each maybe implying approve or reject, maybe needing a reason),
    // a typed answer, and whether rejecting needs a reason. Older payloads still render: the
    // provisional list of actions, or options without widget_actions (two or more are buttons).
    var ITEM_KINDS = ['decision', 'approval', 'action'];
    var DECIDE_ACTIONS = ['approve', 'reject'];
    var OPTION_LIMIT = 12;
    var OPTION_ID_MAX = 120;
    var TEXT_MAX = 2000;
    var kindFromType = (decision) => {
      const type = firstString(decision && decision.type).toLowerCase();
      return type === 'approval' ? 'approval' : type === 'action' ? 'action' : 'decision';
    };
    var normalizeOption = (item, index) => {
      if (typeof item === 'string') return item.trim() ? { id: 'option-' + (index + 1), label: item.trim(), description: '', recommended: false, implied: null, requiresReason: false } : null;
      if (!item || typeof item !== 'object') return null;
      const label = firstString(item.label, item.title, item.name, item.action);
      if (!label) return null;
      return {
        id: firstString(item.id, item.option_id, item.action_id) || 'option-' + (index + 1),
        label,
        description: firstString(item.description, item.detail),
        recommended: item.recommended === true || item.is_recommended === true,
        implied: item.implied_action === 'approve' || item.implied_action === 'reject' ? item.implied_action : null,
        requiresReason: item.requires_reason === true,
      };
    };
    var normalizeOptions = (value) => {
      if (!Array.isArray(value)) return [];
      const seen = new Set();
      return value.map(normalizeOption)
        .filter((o) => o && o.id.length <= OPTION_ID_MAX && !seen.has(o.id) && seen.add(o.id))
        .slice(0, OPTION_LIMIT);
    };
    var readCount = (...values) => {
      for (const v of values) {
        const n = Number(v);
        if (v !== null && v !== undefined && v !== '' && Number.isInteger(n) && n >= 0) return n;
      }
      return null;
    };
    var isMultiselect = (decision, actionsRaw) => {
      const mode = firstString(decision.selection, decision.selection_mode, decision.selectionMode, decision.shape,
        actionsRaw && !Array.isArray(actionsRaw) && typeof actionsRaw.selection === 'string' ? actionsRaw.selection : '').toLowerCase();
      return decision.multiselect === true || decision.multi_select === true || decision.allow_multiple === true ||
        Boolean(actionsRaw && !Array.isArray(actionsRaw) && actionsRaw.multiselect === true) ||
        ['multi', 'multiple', 'multiselect', 'option_multiselect'].includes(mode);
    };
    var actionSet = (value) => {
      const list = Array.isArray(value) ? value : [];
      return { approve: list.includes('approve'), reject: list.includes('reject') };
    };
    // Options without a contract: one click approves; several are toggles and need at least one.
    var selectionFrom = (decision, options) => {
      const shape = decision.shape_context && typeof decision.shape_context === 'object' ? decision.shape_context : {};
      if (!isMultiselect(decision, decision.widget_actions)) {
        return { mode: 'single', options, min: 1, max: 1, requiredFor: { approve: true, reject: false } };
      }
      const max = readCount(decision.max_select, decision.maxSelect, shape.max_select, shape.maxSelect);
      const min = readCount(decision.min_select, decision.minSelect, shape.min_select, shape.minSelect);
      const lo = Math.min(options.length, Math.max(1, min || 1));
      return { mode: 'multiple', options, min: lo, max: Math.max(lo, Math.min(options.length, max || options.length)), requiredFor: { approve: true, reject: false } };
    };

    // The app contract: { kind, actions, labels, reject_requires_reason, answer, selection }.
    var isContractActions = (value) => Boolean(value && typeof value === 'object' && !Array.isArray(value) &&
      Array.isArray(value.actions) && value.actions.every((a) => typeof a === 'string'));
    var fromContract = (value, decision) => {
      const allowed = actionSet(value.actions);
      if (!allowed.approve && !allowed.reject) return null;
      const labels = value.labels && typeof value.labels === 'object' ? value.labels : {};
      const rawAnswer = value.answer && typeof value.answer === 'object' ? value.answer : null;
      const answerFor = rawAnswer ? actionSet(rawAnswer.required_for) : null;
      const rawSelection = value.selection && typeof value.selection === 'object' ? value.selection : null;
      const options = rawSelection ? normalizeOptions(rawSelection.options) : [];
      let selection = null;
      if (rawSelection && options.length) {
        const multiple = rawSelection.mode === 'multiple';
        const min = multiple ? Math.min(options.length, readCount(rawSelection.min) ?? 1) : 1;
        const max = multiple ? Math.max(min, Math.min(options.length, readCount(rawSelection.max) || options.length)) : 1;
        selection = { mode: multiple ? 'multiple' : 'single', options, min, max, requiredFor: actionSet(rawSelection.required_for) };
      }
      return {
        source: 'server',
        kind: ITEM_KINDS.includes(value.kind) ? value.kind : kindFromType(decision),
        approve: allowed.approve ? { label: firstString(labels.approve) || 'Approve', optionId: '' } : null,
        reject: allowed.reject ? { label: firstString(labels.reject) || 'Send back' } : null,
        rejectRequiresReason: value.reject_requires_reason === true,
        answer: answerFor && (answerFor.approve || answerFor.reject)
          ? { approve: answerFor.approve, reject: answerFor.reject, max: Math.min(TEXT_MAX, readCount(rawAnswer.max_length) || TEXT_MAX) }
          : null,
        selection,
      };
    };

    // The provisional shape: a list of { action, option_id, label }.
    var actionKind = (item) => {
      const verb = firstString(item.action, item.kind, item.type, item.verb).toLowerCase();
      if (/reject|decline|send_back|sendback|request_changes/.test(verb)) return 'reject';
      if (firstString(item.option_id, item.optionId) || ['option', 'choose', 'select'].includes(verb)) return 'option';
      if (/approve|accept|confirm/.test(verb)) return 'approve';
      return '';
    };
    var fromProvisional = (value, decision) => {
      const list = Array.isArray(value) ? value : value && Array.isArray(value.actions) ? value.actions : null;
      if (!list) return null;
      const options = [];
      let approveAction = null;
      let rejectAction = null;
      list.forEach((item) => {
        if (!item || typeof item !== 'object') return;
        const kind = actionKind(item);
        const label = firstString(item.label, item.title, item.name);
        if (kind === 'option') {
          const id = firstString(item.option_id, item.optionId, item.id);
          if (id && label && id.length <= OPTION_ID_MAX && !options.some((o) => o.id === id)) {
            options.push({ id, label, description: firstString(item.description, item.detail), recommended: item.recommended === true, implied: null, requiresReason: false });
          }
        } else if (kind === 'approve' && !approveAction) approveAction = { label: label || 'Approve' };
        else if (kind === 'reject' && !rejectAction) rejectAction = { label: label || 'Send back' };
      });
      if (!options.length && !approveAction && !rejectAction) return null;
      const spec = { source: 'legacy', kind: kindFromType(decision), approve: null, reject: rejectAction, rejectRequiresReason: true, answer: null, selection: null };
      if (options.length === 1 && !approveAction) {
        // One option and nothing else: it is the approval.
        spec.approve = { label: options[0].label, optionId: options[0].id };
      } else if (options.length >= 2) {
        spec.selection = selectionFrom(decision, options.slice(0, OPTION_LIMIT));
        spec.approve = { label: approveAction ? approveAction.label : spec.selection.mode === 'multiple' ? 'Confirm' : 'Approve', optionId: '' };
      } else if (approveAction) {
        spec.approve = { label: approveAction.label, optionId: '' };
      }
      return spec;
    };

    // No widget_actions at all: options (two or more) or a plain Approve, and Send back.
    var fromOptions = (decision, packet) => {
      const options = normalizeOptions(Array.isArray(decision.options) && decision.options.length ? decision.options : packet && packet.options)
        .map((o) => ({ ...o, implied: null, requiresReason: false }));
      const selection = options.length >= 2 ? selectionFrom(decision, options) : null;
      return {
        source: 'fallback',
        kind: kindFromType(decision),
        approve: { label: selection && selection.mode === 'multiple' ? 'Confirm' : 'Approve', optionId: '' },
        reject: { label: 'Send back' },
        rejectRequiresReason: true,
        answer: null,
        selection,
      };
    };

    var resolveChoices = (decision, packet) => {
      const raw = decision.widget_actions;
      return (isContractActions(raw) ? fromContract(raw, decision) : fromProvisional(raw, decision)) || fromOptions(decision, packet);
    };
    var choicesFor = (d) => d.choices || resolveChoices(d, null);
    var selectedFor = (id) => (Array.isArray(optionSelections[id]) ? optionSelections[id] : []);
    var optionById = (d, optionId) => {
      const s = choicesFor(d).selection;
      return s ? s.options.find((o) => o.id === optionId) || null : null;
    };
    var optionLabel = (d, optionId) => {
      const o = optionById(d, optionId);
      if (o) return o.label;
      const c = choicesFor(d);
      return c.approve && c.approve.optionId === optionId ? c.approve.label : '';
    };
    // Options an action can carry: an option that implies the other action never rides along.
    var optionsFor = (c, action) => (c.selection ? c.selection.options.filter((o) => !o.implied || o.implied === action) : []);
    var rangeCopy = (sel) => sel.min === sel.max
      ? String(sel.min)
      : sel.max >= sel.options.length ? (sel.min > 1 ? 'at least ' + sel.min : 'one or more') : sel.min + '–' + sel.max;

    // What one action still needs before it can be sent, and the arguments it sends.
    var draftFor = (d, action) => {
      const c = choicesFor(d);
      const id = d.id;
      const sel = c.selection;
      const args = { kind: c.kind };
      const missing = [];
      let picked = [];
      if (action === 'approve' && c.approve && c.approve.optionId) {
        picked = [c.approve.optionId];
      } else if (sel) {
        const allowed = new Set(optionsFor(c, action).map((o) => o.id));
        const pool = action === 'reject' && sel.mode === 'single' ? (rejectPicks[id] ? [rejectPicks[id]] : []) : selectedFor(id);
        // Several options ride with a rejection only when the server asks for them.
        picked = action === 'reject' && sel.mode === 'multiple' && !sel.requiredFor.reject ? [] : pool.filter((oid) => allowed.has(oid));
      }
      if (picked.length) {
        if (sel && sel.mode === 'multiple') args.option_ids = picked.slice();
        else args.option_id = picked[0];
      }
      if (sel && (sel.requiredFor[action] || (sel.mode === 'multiple' && picked.length)) &&
          (!picked.length || (sel.mode === 'multiple' && (picked.length < sel.min || picked.length > sel.max)))) {
        missing.push('options');
      }
      const err = fieldErrors[id];
      const reasonNeeded = picked.some((oid) => { const o = optionById(d, oid); return Boolean(o && o.requiresReason); }) ||
        (action === 'reject' && c.rejectRequiresReason) ||
        Boolean(err && err.action === action && err.field === 'reason');
      const reason = ((action === 'reject' ? rejectDrafts[id] : approveNotes[id]) || '').trim();
      if (reason) args.reason = reason.slice(0, TEXT_MAX);
      else if (reasonNeeded) missing.push('reason');
      const answerNeeded = Boolean(c.answer && c.answer[action]);
      if (answerNeeded) {
        const answer = (answerDrafts[id] || '').trim();
        if (answer) args.answer = answer.slice(0, c.answer.max);
        else missing.push('answer');
      }
      return { action, args, missing, picked, reasonNeeded, answerNeeded };
    };
    var missingCopy = (draft, sel) => {
      if (draft.missing.includes('options')) return sel && sel.mode === 'multiple' ? 'choose ' + rangeCopy(sel) + ' first' : 'choose an option first';
      if (draft.missing.includes('answer')) return 'type your answer first';
      if (draft.missing.includes('reason')) return draft.action === 'reject' ? 'write a note first' : 'say why first';
      return '';
    };

    // What kind of item this is, in words: the pending list mixes decisions, agent-run approvals and actions.
    var typeLabel = (decision) => {
      const type = firstString(decision.type, decision.entity_type);
      const kind = kindFromType(decision);
      if (kind === 'approval') return 'Agent run approval';
      if (kind === 'action') return 'Action approval';
      if (!type || ['decision', 'decision_queue', 'decision_request'].includes(type.toLowerCase())) return '';
      return /[_-]/.test(type) && type === type.toLowerCase() ? humanizeDecisionKey(type).replace(/^./, (c) => c.toUpperCase()) : type;
    };

    var normalizeDecision = (decision, index) => {
      if (!decision || typeof decision !== 'object') return null;
      const packet =
        decision.review_packet &&
        typeof decision.review_packet === 'object' &&
        !Array.isArray(decision.review_packet)
          ? decision.review_packet
          : null;
      const id =
        firstString(
          packet && packet.headDecisionId,
          decision.id,
          decision.decision_id,
          decision.uuid,
          decision.entity_id
        ) || `decision-${index + 1}`;
      const summary =
        firstString(
          packet && packet.question,
          decision.summary,
          decision.title,
          decision.name,
          decision.prompt,
          decision.description
        ) || 'Untitled decision';
      const urgency = firstString(
        decision.urgency,
        decision.urgency_level,
        decision.priority
      ).toLowerCase() || 'medium';
      const why = contextLines(
        packet,
        decision.context ?? decision.why_it_matters ?? decision.whyItMatters ?? decision.reasoning ?? null
      );
      const recommendation = readRecommendation(
        (packet && packet.recommendation) ??
        decision.recommendation ?? decision.recommended_action ?? decision.next_action ?? decision.action ?? null
      );
      const ownTitle = firstString(decision.title, decision.name);
      const head = splitHeadline(ownTitle !== summary ? ownTitle : '', summary);
      const impact =
        (packet && packet.consequences) ??
        decision.impact ?? decision.impact_if_ignored ?? decision.risk_if_ignored ?? decision.consequence ?? null;
      const consequenceSource = (packet && packet.consequences) || decision.consequences || decision;
      const ifApproved = pickConsequence(consequenceSource, ['if_approved', 'ifApproved', 'approve', 'approved', 'on_approve']);
      const ifRejected = pickConsequence(consequenceSource, ['if_rejected', 'ifRejected', 'reject', 'rejected', 'on_reject']);
      const rawOwner = firstString(
        packet && packet.current && packet.current.owner,
        decision.agent_name,
        decision.owner_agent,
        decision.assigned_agent,
        decision.domain
      );
      const isSystemDecision =
        !rawOwner ||
        ['system', 'orgx', 'orgx system'].includes(rawOwner.toLowerCase()) ||
        firstString(decision.source, decision.created_by_type, decision.created_by).toLowerCase() === 'system';
      return {
        ...decision,
        id,
        packet_id: firstString(decision.packet_id, packet && packet.id),
        gate_key: firstString(packet && packet.gateKey),
        duplicate_count:
          packet && typeof packet.duplicateCount === 'number'
            ? packet.duplicateCount
            : 0,
        provider:
          packet && packet.recommendation && packet.recommendation.provenance && packet.recommendation.provenance.provider,
        model:
          packet && packet.recommendation && packet.recommendation.provenance && packet.recommendation.provenance.model,
        agent_name: isSystemDecision ? 'OrgX System' : rawOwner,
        is_system: isSystemDecision,
        type: firstString(decision.type, decision.entity_type) || 'Decision',
        type_label: typeLabel(decision),
        context_refs: decision.context && typeof decision.context === 'object' && !Array.isArray(decision.context) ? decision.context : {},
        source_label: firstString(decision.sourceLabel, decision.source_label, decision.initiative_title, decision.initiative_name),
        summary,
        headline: head.headline,
        headline_body: head.body,
        urgency,
        context: why.join(' '),
        context_lines: why,
        recommendation: recommendation.text,
        recommendation_missing: recommendation.empty,
        recommendation_unverified: recommendation.unverified,
        impact: ifApproved || ifRejected ? '' : formatDecisionField(impact),
        if_approved: ifApproved,
        if_rejected: ifRejected,
        evidence_items: normalizeEvidenceItems((packet && packet.evidence) || decision.evidence),
        choices: resolveChoices(decision, packet),
        created_at:
          firstString(decision.created_at, decision.createdAt, decision.updated_at) ||
          new Date().toISOString(),
      };
    };

    var buildDecisionKey = (decision) => {
      const packetId = firstString(decision.packet_id, decision.review_packet && decision.review_packet.id);
      if (packetId) return `packet:${packetId}`;
      const stableId = firstString(decision.id, decision.decision_id, decision.uuid, decision.entity_id);
      if (stableId) return `id:${stableId}`;
      return [
        firstString(decision.agent_name, decision.owner_agent, decision.assigned_agent, decision.domain).toLowerCase(),
        firstString(decision.summary, decision.title, decision.name, decision.prompt, decision.description).toLowerCase(),
        firstString(decision.urgency, decision.urgency_level, decision.priority).toLowerCase(),
        firstString(decision.type, decision.entity_type).toLowerCase(),
        firstString(decision.initiative_id, decision.run_id).toLowerCase(),
      ].join('::');
    };

    var normalizeDecisionQueue = (payload) => {
      if (!payload || typeof payload !== 'object') return null;
      if (payload.__normalized) return payload;
      const rawDecisions = Array.isArray(payload.decisions) ? payload.decisions : [];
      const seen = new Set();
      const decisions = [];
      rawDecisions.forEach((item, index) => {
        const normalized = normalizeDecision(item, index);
        if (!normalized) return;
        const key = buildDecisionKey(normalized);
        if (seen.has(key)) return;
        seen.add(key);
        decisions.push(normalized);
      });

      const summary = {};
      decisions.forEach((decision) => {
        const urgency = (decision.urgency || 'low').toLowerCase();
        summary[urgency] = (summary[urgency] || 0) + 1;
      });

      return {
        ...payload,
        __normalized: true,
        decisions,
        summary,
      };
    };

    var getDecisionById = (id) => Array.isArray(data && data.decisions) ? data.decisions.find((decision) => decision.id === id) || null : null;
    // A decision is settled here once OrgX confirmed it (or recorded it and could not confirm yet).
    var isSettled = (d) => {
      const st = actionStates[d.id];
      return Boolean(st && (st.phase === 'done' || st.phase === 'waiting' || st.phase === 'elsewhere'));
    };
    var pendingDecisions = () => (data && Array.isArray(data.decisions) ? data.decisions.filter((d) => !isSettled(d)) : []);

    var setPageButtonsDisabled = (disabled) => {
      document.querySelectorAll('.page-btn').forEach((button) => {
        button.disabled = !!disabled;
      });
    };

    var getDecisionOwner = (decision) => {
      const label = firstString(
        decision.agent_name,
        decision.owner_agent,
        decision.assigned_agent,
        decision.domain
      );
      const isSystem = Boolean(decision.is_system) || !label || ['system', 'orgx', 'orgx system'].includes(label.toLowerCase());
      if (isSystem) return { label: 'OrgX System', name: 'OrgX', role: '', isSystem: true };
      const parts = label.split(/\s+[-–—·|]\s+|\s*\(|\)/).map((part) => part.trim()).filter(Boolean);
      const name = parts[0] || label;
      const role = parts[1] ? parts[1].toLowerCase() : '';
      return { label, name, role, isSystem: false };
    };

    /* The owner's avatar: an agent's headshot inside the hover card (name, role,
       state, the decision it is waiting on, Open in OrgX); the OrgX mark for
       system owners; initials for a person. Never an empty circle. */
    var renderAvatar = (name, sizePx, isSystem, decision) => {
      const identity = window.OrgXAgentIdentity;
      if (isSystem) return `<span class="agent-avatar agent-avatar--system">${identity.avatar({ agent: 'system', size: sizePx })}</span>`;
      const who = identity.profile(name);
      if (!who) return `<span class="agent-avatar">${identity.avatar({ name: getDecisionOwner({ agent_name: name }).name, size: sizePx })}</span>`;
      return `<span class="agent-avatar">${identity.agentCard({
        agent: who.key,
        size: sizePx,
        state: 'needs_you',
        statusLabel: 'Waiting on you',
        task: decision ? firstString(decision.title, decision.question, decision.summary) : '',
      })}</span>`;
    };


    var formatUsd = v => Number.isFinite(Number(v)) ? '$'+Number(v).toFixed(2) : null;
    // "5h", "2d": the canvas status-line age.
    var shortAge = (value) => {
      const t = new Date(value).getTime();
      if (!Number.isFinite(t)) return '';
      const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
      if (m < 1) return 'now';
      if (m < 60) return m + 'm';
      const h = Math.floor(m / 60);
      if (h < 48) return h + 'h';
      return Math.floor(h / 24) + 'd';
    };
    var timeAgo = d => { const a = shortAge(d); return !a ? '' : a === 'now' ? 'just now' : a + ' ago'; };

    /* ---------------------------------------------------------------- footer -- */
    // SM3 finishes-here: one click approves (or picks an option), the outcome lands in the same row.
    // There is no server-side hold for decisions yet, so the footer never offers Undo.
    // Past tense for the server's labels: "Grant access" lands as "Access granted".
    var PAST = {
      approve: 'Approved', 'approve and continue': 'Approved', 'approve selected': 'Approved', 'grant access': 'Access granted',
      'allow once': 'Allowed once', 'allow and continue': 'Allowed', 'send answer': 'Answer sent', 'send guidance and retry': 'Guidance sent',
      'confirm and continue': 'Confirmed', 'confirm selection': 'Confirmed', confirm: 'Confirmed', 'accept plan': 'Plan accepted',
      'apply edit': 'Edit applied', retry: 'Retry approved', 'retry and continue': 'Retry approved', acknowledge: 'Acknowledged',
      'send back': 'Sent back', deny: 'Denied', decline: 'Declined', reject: 'Rejected', 'request changes': 'Changes requested', 'stop here': 'Stopped',
    };
    var pastTense = (d, action) => {
      const c = choicesFor(d);
      const label = action === 'approve' ? (c.approve && c.approve.label) : (c.reject && c.reject.label);
      return PAST[String(label || '').toLowerCase()] || (action === 'approve' ? 'Approved' : 'Sent back');
    };
    var doneDetail = (d, action, who) => {
      const kind = choicesFor(d).kind;
      if (kind === 'action') return action === 'approve' ? 'the action can run' : 'the action does not run';
      if (kind === 'approval') return action === 'approve' ? who + ' continues the run' : who + ' stops at this step';
      return action === 'approve' ? who + ' continues' : who + ' reworks it against your note';
    };
    var footerSpec = (d) => {
      const who = getDecisionOwner(d).name;
      const st = actionStates[d.id];
      const c = choicesFor(d);
      const base = { variant: 'finishes-here', heading: '', detail: '', primary: '', action: '', disabled: false, slot: '' };
      if (!st) {
        const sel = c.selection;
        if (rejectComposerId === d.id) {
          const draft = draftFor(d, 'reject');
          const ready = !draft.missing.length;
          const label = c.reject ? c.reject.label : 'Send back';
          return { ...base, state: 'needs-you', heading: label, detail: ready ? (draft.args.reason ? 'your note goes to ' + who : 'recorded in OrgX') : missingCopy(draft, sel), primary: label, disabled: !ready, slot: 'cancel' };
        }
        const slot = c.reject ? 'reject' : '';
        if (!c.approve) return { ...base, state: 'needs-you', heading: 'Decide here', detail: 'recorded in OrgX', slot };
        const draft = draftFor(d, 'approve');
        const ready = !draft.missing.length;
        const detail = ready ? 'recorded in OrgX' : missingCopy(draft, sel);
        if (sel && sel.mode === 'multiple') {
          const n = draft.picked.length;
          const label = c.approve.label === 'Confirm' && n ? 'Confirm ' + n : c.approve.label;
          return { ...base, state: 'needs-you', heading: n ? n + ' chosen' : 'Choose ' + rangeCopy(sel), detail: n || ready ? detail : 'recorded in OrgX', primary: label, disabled: !ready, slot };
        }
        if (sel && !draft.picked.length && sel.requiredFor.approve) {
          return { ...base, state: 'needs-you', heading: 'Choose one', detail: 'recorded in OrgX', slot };
        }
        if (sel && draft.picked.length) {
          return { ...base, state: 'needs-you', heading: 'You picked ' + optionLabel(d, draft.picked[0]), detail, primary: c.approve.label, disabled: !ready, slot };
        }
        return { ...base, state: 'needs-you', heading: 'Finishes here', detail, primary: c.approve.label, disabled: !ready, slot };
      }
      const approving = st.action === 'approve';
      const choice = decisionChoices[d.id];
      switch (st.phase) {
        case 'sending':
          return { ...base, state: 'sending', heading: approving ? 'Approving' : 'Sending', detail: 'recording it in OrgX', primary: approving ? 'Approving…' : 'Sending…' };
        case 'confirming':
          return { ...base, state: 'running', heading: 'Confirming in OrgX', detail: st.detail || 'checking it settled' };
        case 'done':
          return { ...base, state: 'done', heading: approving && choice && choice.label ? 'You chose ' + choice.label : pastTense(d, st.action) + ' by you', detail: st.detail || doneDetail(d, st.action, who), action: 'Receipt ↗' };
        case 'waiting':
          return { ...base, variant: 'confirms-in-orgx', state: 'waiting', heading: 'Recorded in OrgX', detail: st.detail || 'not confirmed yet', action: 'Check now' };
        case 'elsewhere': {
          // Someone settled it first (here or in OrgX). Nothing of yours was applied.
          const status = st.status || '';
          const approved = /approv|accept|confirm|grant|allow/.test(status);
          const declined = /declin|reject|deni|denied|sent_back|cancel/.test(status);
          return approved
            ? { ...base, state: 'done', heading: 'Already approved in OrgX', detail: 'nothing of yours was applied', action: 'Open ↗' }
            : { ...base, variant: 'confirms-in-orgx', state: 'rejected', heading: declined ? 'Already declined in OrgX' : 'Already settled in OrgX', detail: 'nothing of yours was applied', action: 'Open ↗' };
        }
        case 'stale':
          return { ...base, variant: 'reads', state: st.refreshing ? 'refreshing' : 'stale', heading: st.refreshing ? 'Refreshing' : st.heading || 'This view is out of date', detail: st.refreshing ? 'getting the current version' : st.detail || 'Refresh to decide', action: st.refreshing ? '' : 'Refresh' };
        case 'unsettled':
          return { ...base, state: 'failed', heading: st.heading || 'Didn’t go through', detail: st.detail || 'nothing changed here', primary: 'Decide in OrgX ↗' };
        case 'failed':
        default:
          return { ...base, state: 'failed', heading: 'Not sent', detail: st.detail || (approving ? 'nothing changed · try again' : 'your note is kept · try again'), primary: 'Retry' };
      }
    };

    var footerSlotHtml = (d, spec) => {
      if (spec.slot === 'reject') {
        const label = (choicesFor(d).reject || {}).label || 'Send back';
        return `<button type="button" slot="action" class="dq-text-btn decision-action-btn" data-reject-id="${escapeHtml(d.id)}" data-action="toggle-reject" onclick="toggleRejectComposer('${escapeHtml(d.id)}', this)" aria-expanded="false" aria-controls="reject-composer-${escapeHtml(d.id)}">${escapeHtml(label)}</button>`;
      }
      if (spec.slot === 'cancel') {
        return `<button type="button" slot="action" class="dq-text-btn decision-action-btn" data-reject-id="${escapeHtml(d.id)}" data-action="toggle-reject" onclick="toggleRejectComposer('${escapeHtml(d.id)}', this)" aria-expanded="true" aria-controls="reject-composer-${escapeHtml(d.id)}">Cancel</button>`;
      }
      return '';
    };

    var footerAttrs = (spec) => [
      ['variant', spec.variant],
      ['state', spec.state],
      ['heading', spec.heading],
      ['detail', spec.detail],
      ['primary-label', spec.primary],
      ['action-label', spec.action],
    ];

    var footerHtml = (d) => {
      const spec = footerSpec(d);
      const attrs = footerAttrs(spec).map(([k, v]) => `${k}="${escapeHtml(v)}"`).join(' ');
      return `<ox-footer class="dq-footer" data-decision-id="${escapeHtml(d.id)}" ${attrs}${spec.disabled ? ' disabled' : ''}>${footerSlotHtml(d, spec)}</ox-footer>`;
    };

    // Move the footer in place so the kit crossfades it and focus follows the new control.
    var syncFooter = (id) => {
      const d = getDecisionById(id);
      const footer = document.querySelector(`ox-footer[data-decision-id="${CSS.escape(id)}"]`);
      if (!d || !footer) return;
      const spec = footerSpec(d);
      const note = document.getElementById('reject-note-' + id);
      if (note) note.readOnly = Boolean(actionStates[id]);
      syncOptions(id);
      footer.innerHTML = footerSlotHtml(d, spec);
      footer.toggleAttribute('disabled', spec.disabled);
      footerAttrs(spec).forEach(([k, v]) => {
        if (footer.getAttribute(k) !== v) footer.setAttribute(k, v);
      });
      syncChrome();
    };

    // The attention line, the card edge and the status line follow the queue.
    var syncChrome = () => {
      const line = document.getElementById('dqAttention');
      const pending = pendingDecisions();
      if (line) {
        line.setAttribute('count', String(pending.length));
        line.setAttribute('tone', pending.length ? 'needs-you' : 'calm');
        const label = line.querySelector(':scope > span:not([slot])');
        const sentence = scopeLabel(pending.length) || (pending.length ? `${pending.length} need${pending.length === 1 ? 's' : ''} your decision` : '');
        if (label && sentence) label.textContent = sentence;
        else if (label && !sentence) label.remove();
      }
      document.querySelectorAll('[data-status-for]').forEach((node) => {
        const d = getDecisionById(node.getAttribute('data-status-for'));
        if (d) node.innerHTML = statusLineHtml(d);
      });
      document.querySelectorAll('.ox-card[data-card-for]').forEach((card) => {
        const d = getDecisionById(card.getAttribute('data-card-for'));
        if (d) card.setAttribute('data-edge', edgeFor(d));
      });
    };

    var edgeFor = (d) => {
      const st = actionStates[d.id];
      if (!st) return 'amber';
      if (st.phase === 'done' || st.phase === 'confirming') return 'teal';
      if (st.phase === 'failed' || st.phase === 'unsettled') return 'red';
      if (st.phase === 'waiting') return 'mute';
      return 'amber';
    };

    var oldestAge = (list) => {
      let oldest = null;
      list.forEach((d) => {
        const t = new Date(d.created_at).getTime();
        if (Number.isFinite(t) && (oldest === null || t < oldest)) oldest = t;
      });
      if (oldest === null) return '';
      const age = shortAge(oldest);
      return age === 'now' ? '' : age;
    };

    var statusLineHtml = (d) => {
      const st = actionStates[d.id];
      const ctx = d.source_label || d.type_label || '';
      const ctxHtml = ctx ? `<span class="ctx-wrap"><span aria-hidden="true">·</span><span class="ctx">${escapeHtml(ctx)}</span></span>` : '';
      const urgency = d.urgency === 'critical'
        ? '<span class="urg urg-critical">Critical</span>'
        : d.urgency === 'high' ? '<span class="urg">High</span>' : '';
      if (st && st.phase === 'done') {
        return `<span class="done">${oxIcon('done', 16)}${escapeHtml(pastTense(d, st.action))} by you · just now</span>${ctxHtml}`;
      }
      if (st && st.phase === 'elsewhere') {
        return `<span class="done">${oxIcon('done', 16)}Settled in OrgX</span>${ctxHtml}`;
      }
      const age = shortAge(d.created_at);
      return `<span class="need">${oxIcon('decision', 16)}Needs you${age && age !== 'now' ? ' · ' + age + ' waiting' : ''}</span>${ctxHtml}${urgency}`;
    };

    /* --------------------------------------------------------------- actions -- */
    var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var STATUS_POLL_LIMIT_MS = 120000;
    var sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

    var setPhase = (id, next) => {
      if (next) actionStates[id] = next; else delete actionStates[id];
      syncFooter(id);
    };

    // Host and transport failures arrive with a code (widget-runtime.js): tool_unavailable when the
    // host has no such tool or resource, network when the call never arrived. The card says what
    // happened from the code; a raw payload ({"detail":…} or a lone "{") is never shown.
    var looksRaw = (text) => /^[\s{[<"]/.test(text) || /^[\s{}[\]"',:]*$/.test(text) || /"\s*:/.test(text) || /\b(?:undefined|null|NaN)\b/.test(text);
    var safeErrorText = (error, fallback, max) => {
      const message = error && typeof error.message === 'string' ? error.message.trim() : '';
      if (!message || looksRaw(message) || message.length > (max || 160) || /tool (?:request|execution) failed/i.test(message)) return fallback;
      return message;
    };
    var errorKind = (error) => {
      const code = String((error && error.code) || '').toLowerCase();
      if (code === 'tool_unavailable' || code === 'network') return code;
      // No host bridge at all (a standalone preview): nothing can be settled here either.
      if (code === 'host_unavailable') return 'tool_unavailable';
      if (code && code !== 'tool_failed') return code;
      const raw = [error && error.message, error && error.details && error.details.raw].filter((v) => typeof v === 'string').join(' ');
      if (/resource not found|tool not found|unknown tool|method not found|no such tool/i.test(raw)) return 'tool_unavailable';
      if (/failed to fetch|networkerror|network error|load failed|timed? ?out|offline/i.test(raw)) return 'network';
      return code;
    };
    var shortError = (error, fallback) => safeErrorText(error, fallback, 36).replace(/\.$/, '');
    var markChatCannotDecide = () => {
      chatCannotDecide = true;
      (data && Array.isArray(data.decisions) ? data.decisions : []).forEach((d) => {
        if (!isSettled(d) && !d.decide_in_orgx_reason) d.decide_in_orgx_reason = 'chat_unavailable';
      });
    };

    // After OrgX records the decision, read its status until it settles (orgx_command_status).
    // next_poll_after_ms paces the reads; null means the state is final.
    var confirmDecisionSettled = async (id, onProgress) => {
      if (!UUID_RE.test(id)) return { state: 'unconfirmed' };
      const runtime = rt();
      const deadline = Date.now() + STATUS_POLL_LIMIT_MS;
      let wait = 0;
      for (;;) {
        if (wait) await sleep(wait);
        let status = null;
        try {
          const raw = await callTool('orgx_command_status', { kind: 'decision', id });
          status = runtime && runtime.extractStructuredWidgetData ? runtime.extractStructuredWidgetData(raw, true) : raw;
        } catch (_) {
          return { state: 'unconfirmed' };
        }
        if (!status || typeof status !== 'object' || typeof status.state !== 'string') return { state: 'unconfirmed' };
        if (status.next_poll_after_ms === null || status.next_poll_after_ms === undefined) return status;
        onProgress(status);
        if (Date.now() >= deadline) return { state: 'unconfirmed' };
        wait = Math.min(15000, Math.max(750, Number(status.next_poll_after_ms) || 2000));
      }
    };

    var progressDetail = (status, who) => {
      if (status && status.waiting_on === 'agent') return who + ' is picking it up';
      if (status && status.waiting_on === 'person') return 'waiting on a person in OrgX';
      if (status && status.state === 'queued') return 'queued in OrgX';
      return 'checking it settled';
    };

    var settleFromStatus = (id, action, status) => {
      const outcome = status && typeof status.outcome === 'string' && status.outcome.trim() ? status.outcome.trim() : '';
      if (status.state === 'succeeded') return setPhase(id, { phase: 'done', action, detail: outcome });
      if (status.state === 'failed') return setPhase(id, { phase: 'unsettled', action, heading: 'Didn’t go through', detail: outcome || 'OrgX reported a failure' });
      if (status.state === 'cancelled') return setPhase(id, { phase: 'unsettled', action, heading: 'Cancelled in OrgX', detail: outcome || 'nothing was applied' });
      return setPhase(id, { phase: 'waiting', action, detail: status.state === 'not_found' ? 'OrgX has no status for it yet' : 'not confirmed yet' });
    };

    var watchDecision = async (id, action) => {
      const d = getDecisionById(id);
      const who = d ? getDecisionOwner(d).name : 'The agent';
      setPhase(id, { phase: 'confirming', action });
      const status = await confirmDecisionSettled(id, (progress) => {
        setPhase(id, { phase: 'confirming', action, detail: progressDetail(progress, who) });
      });
      settleFromStatus(id, action, status);
    };

    /* ----------------------------------------------------------- refusals -- */
    // Every refusal code orgx_widget_decide can return, and what this card says for it.
    var VALIDATION_CODES = ['reason_required', 'answer_required', 'answer_not_accepted', 'option_required', 'options_not_accepted',
      'option_unavailable', 'option_action_mismatch', 'selection_out_of_range', 'invalid_decision_option_material'];
    var VALIDATION_COPY = {
      reason_required: 'Say what should change.',
      answer_required: 'Type an answer to send.',
      answer_not_accepted: 'This one no longer takes an answer. Decide with the buttons.',
      option_required: 'Choose an option first.',
      options_not_accepted: 'The options changed. Choose again.',
      option_unavailable: 'That option is no longer available. Choose again.',
      option_action_mismatch: 'That option goes with the other button.',
      selection_out_of_range: 'Choose a number of options the decision allows.',
      invalid_decision_option_material: 'That choice is not valid for this decision. Choose again.',
    };
    var OUT_OF_DATE_CODES = ['widget_approval_token_expired', 'widget_approval_token_invalid', 'widget_view_out_of_date'];
    var IN_ORGX_CODES = {
      decide_in_orgx: '',
      widget_approval_ineligible: '',
      widget_approval_disabled: 'widget_approvals_disabled',
      action_authority_denied: 'action_authority_denied',
      widget_approval_token_mismatch: 'token_mismatch',
      widget_decision_lifecycle_required: 'lifecycle_required',
    };
    var fieldForCode = (code) => code === 'reason_required' ? 'reason' : code === 'answer_required' ? 'answer' : code === 'answer_not_accepted' ? 'form' : 'options';
    var refusalCopy = (error, fallback) => safeErrorText(error, fallback, 160);
    // Drop picks the current contract no longer offers.
    var pruneSelections = (d) => {
      const c = choicesFor(d);
      const ids = new Set(c.selection ? c.selection.options.map((o) => o.id) : []);
      if (optionSelections[d.id]) optionSelections[d.id] = selectedFor(d.id).filter((oid) => ids.has(oid));
      if (rejectPicks[d.id] && !ids.has(rejectPicks[d.id])) delete rejectPicks[d.id];
      if (!c.answer) delete answerDrafts[d.id];
    };

    var handleRefusal = (id, action, error, opts) => {
      const code = errorKind(error);
      const details = error && error.details && typeof error.details === 'object' ? error.details : {};
      const d = getDecisionById(id);
      if (code === 'tool_unavailable') {
        // The chat's OrgX connection can't settle this here: every card hands off to OrgX
        // (Decide in OrgX, with why), and nothing offers Retry again.
        markChatCannotDecide();
        delete actionStates[id];
        if (!(opts && opts.batch)) render();
        return;
      }
      if (code === 'network') {
        return setPhase(id, { phase: 'failed', action, detail: action === 'approve' ? 'couldn’t reach OrgX · nothing changed' : 'couldn’t reach OrgX · your note is kept' });
      }
      if (VALIDATION_CODES.includes(code)) {
        // The server sends the item's current widget_actions with every validation refusal.
        if (d && details.widget_actions && typeof details.widget_actions === 'object') {
          d.widget_actions = details.widget_actions;
          d.choices = resolveChoices(d, d.review_packet);
          pruneSelections(d);
        }
        const field = fieldForCode(code);
        fieldErrors[id] = { action, field, code, message: refusalCopy(error, VALIDATION_COPY[code]) };
        if (action === 'reject') rejectComposerId = id;
        delete actionStates[id];
        render();
        return;
      }
      if (OUT_OF_DATE_CODES.includes(code)) {
        return setPhase(id, { phase: 'stale', action, heading: 'This view is out of date', detail: 'Refresh to decide' });
      }
      if (code === 'widget_decision_conflict') {
        return setPhase(id, { phase: 'stale', action, heading: 'Changed since you opened it', detail: 'nothing of yours was applied' });
      }
      if (code === 'widget_decision_not_found') {
        return setPhase(id, { phase: 'stale', action, heading: 'No longer open here', detail: 'it may be settled or moved' });
      }
      if (code === 'decision_already_resolved') {
        setPhase(id, { phase: 'elsewhere', action, status: firstString(details.status).toLowerCase() });
        if (!(opts && opts.batch)) void refreshQueue(id);
        return;
      }
      if (Object.prototype.hasOwnProperty.call(IN_ORGX_CODES, code)) {
        const reason = code === 'widget_approval_ineligible' ? firstString(details.reason) : IN_ORGX_CODES[code];
        if (d && reason) d.decide_in_orgx_reason = reason;
        return setPhase(id, { phase: 'unsettled', action, heading: 'Decide in OrgX', detail: decideInOrgxDetail(d) });
      }
      // Older servers: no code, only a message.
      if (/conflict|already|superseded|not_pending/i.test(code)) {
        return setPhase(id, { phase: 'elsewhere', action, status: '' });
      }
      if (/expired|approval_token|invalid_token/i.test(code)) {
        return setPhase(id, { phase: 'stale', action, heading: 'This view is out of date', detail: 'Refresh to decide' });
      }
      setPhase(id, { phase: 'failed', action, detail: shortError(error, action === 'approve' ? 'nothing changed · try again' : 'your note is kept · try again') });
    };

    // A fresh pending list (and fresh approval tokens) from OrgX. Decisions settled here stay
    // in "Decided here"; out-of-date cards start over from what OrgX says now.
    var refreshQueue = async (focusId) => {
      const runtime = rt();
      const stale = Object.keys(actionStates).filter((id) => actionStates[id].phase === 'stale');
      stale.forEach((id) => setPhase(id, { ...actionStates[id], refreshing: true }));
      let result = null;
      try {
        result = runtime && runtime.callToolResult ? await runtime.callToolResult('get_pending_decisions', {}) : null;
      } catch (_) {
        result = null;
      }
      const next = result && result.data && typeof result.data === 'object' && Array.isArray(result.data.decisions) ? result.data : null;
      if (!next) {
        stale.forEach((id) => {
          if (actionStates[id] && actionStates[id].phase === 'stale') {
            setPhase(id, { phase: 'unsettled', action: actionStates[id].action, heading: 'Couldn’t refresh', detail: 'decide it in OrgX' });
          }
        });
        return false;
      }
      const approval = result.meta && result.meta['orgx/widgetApproval'];
      refreshedTokens = approval && approval.approval_tokens && typeof approval.approval_tokens === 'object' ? { ...approval.approval_tokens } : {};
      const previous = data && Array.isArray(data.decisions) ? data.decisions : [];
      const kept = previous.filter((d) => isSettled(d));
      const fresh = normalizeDecisionQueue({ ...next, __normalized: false });
      const ids = new Set(fresh.decisions.map((d) => d.id));
      // Cards settled here stay settled; anything else starts over from what OrgX says now.
      Object.keys(actionStates).forEach((id) => {
        if (!isSettled({ id })) delete actionStates[id];
      });
      Object.keys(fieldErrors).forEach((id) => delete fieldErrors[id]);
      data = { ...fresh, decisions: fresh.decisions.concat(kept.filter((d) => !ids.has(d.id) && isSettled(d))) };
      const pendingNow = pendingDecisions();
      const focusIndex = data.decisions.findIndex((d) => d.id === focusId && !isSettled(d));
      const firstPending = data.decisions.findIndex((d) => !isSettled(d));
      const index = focusIndex >= 0 ? focusIndex : pendingNow.length ? firstPending : data.decisions.findIndex((d) => d.id === focusId);
      currentPage = Math.max(1, index + 1);
      syncedAt = new Date();
      render();
      return true;
    };

    /* ------------------------------------------------------------ deciding -- */
    var runDecision = async (id, action) => {
      if (pendingDecisionId) return;
      const decision = getDecisionById(id);
      if (!decision) return;
      const draft = draftFor(decision, action);
      if (draft.missing.length) { syncFooter(id); return; }
      pendingDecisionId = id;
      const label = draft.picked.map((oid) => optionLabel(decision, oid)).filter(Boolean).join(', ');
      decisionChoices[id] = action === 'approve' && draft.picked.length ? { option_id: draft.args.option_id || '', option_ids: draft.args.option_ids || [], label } : null;
      delete fieldErrors[id];
      setPageButtonsDisabled(true);
      setPhase(id, { phase: 'sending', action });

      try {
        const approvalToken = getApprovalToken(id);
        if (!approvalToken) throw Object.assign(new Error('This decision has to be made in OrgX.'), { code: 'decide_in_orgx' });
        await callTool('orgx_widget_decide', { decision_id: id, action, ...draft.args, approval_token: approvalToken });
        lastResolution = {
          action: action === 'approve' ? 'approved' : 'rejected',
          verb: pastTense(decision, action).toLowerCase(),
          summary: decision.headline || decision.summary || 'This decision',
          agent_name: decision.agent_name || 'the assigned agent',
          choice: action === 'approve' && label ? label : null,
          note: draft.args.reason || null,
        };
        if (rejectComposerId === id) rejectComposerId = null;
        void publishDecisionResolution(decision, lastResolution);
        if (draft.args.kind === 'decision') {
          await watchDecision(id, action);
        } else {
          // Agent-run approvals and actions settle in the call itself; there is no decision status to read.
          setPhase(id, { phase: 'done', action });
        }
        // The composer closes once OrgX has the note.
        if (action === 'reject') render();
        if (actionStates[id] && actionStates[id].phase === 'done') {
          delete rejectDrafts[id];
          delete answerDrafts[id];
          delete approveNotes[id];
        }
        scheduleDecisionStatePersistence();
      } catch (error) {
        handleRefusal(id, action, error);
      } finally {
        pendingDecisionId = null;
        setPageButtonsDisabled(false);
      }
    };

    // choice (optional): { option_id } or { option_ids } the caller already picked.
    window.approveDecision = async (id, choice) => {
      if (pendingDecisionId) return;
      if (choice && choice.option_id) optionSelections[id] = [choice.option_id];
      if (choice && Array.isArray(choice.option_ids)) optionSelections[id] = choice.option_ids.slice();
      await runDecision(id, 'approve');
    };

    // An option click: approve with it in one click, unless it implies sending back or the
    // approval still needs a reason or an answer (then it is picked and the card asks for that).
    window.chooseOption = (id, optionId) => {
      const d = getDecisionById(id);
      if (!d || pendingDecisionId || actionStates[id]) return;
      const c = choicesFor(d);
      const sel = c.selection;
      const option = optionById(d, optionId);
      if (!sel || !option) return;
      if (sel.mode === 'multiple') { window.toggleOption(id, optionId); return; }
      if (option.implied === 'reject') {
        rejectPicks[id] = optionId;
        if (!c.reject) return;
        if (!draftFor(d, 'reject').missing.length) { void runDecision(id, 'reject'); return; }
        rejectComposerId = id;
        scheduleDecisionStatePersistence();
        render();
        focusField(id, 'reject-note');
        return;
      }
      if (!c.approve) return;
      const already = selectedFor(id)[0] === optionId;
      optionSelections[id] = already ? [] : [optionId];
      const draft = draftFor(d, 'approve');
      if (!already && !draft.missing.length) { void runDecision(id, 'approve'); return; }
      scheduleDecisionStatePersistence();
      render();
      if (!already) focusField(id, draft.missing.includes('answer') ? 'answer' : 'approve-note');
    };

    // In the send-back note: which option the note is about.
    window.pickRejectOption = (id, optionId) => {
      const d = getDecisionById(id);
      if (!d || pendingDecisionId || actionStates[id]) return;
      const sel = choicesFor(d).selection;
      if (sel && sel.mode === 'multiple') { window.toggleOption(id, optionId); return; }
      rejectPicks[id] = rejectPicks[id] === optionId ? '' : optionId;
      render();
    };

    window.toggleOption = (id, optionId) => {
      const d = getDecisionById(id);
      if (!d || pendingDecisionId || actionStates[id]) return;
      const sel = choicesFor(d).selection;
      if (!sel) return;
      const current = selectedFor(id);
      const next = current.includes(optionId) ? current.filter((x) => x !== optionId) : current.concat(optionId);
      if (next.length > sel.max) return;
      const action = rejectComposerId === id ? 'reject' : 'approve';
      const neededNote = draftFor(d, action).reasonNeeded;
      optionSelections[id] = sel.options.map((o) => o.id).filter((oid) => next.includes(oid));
      const hadError = Boolean(fieldErrors[id] && fieldErrors[id].field === 'options');
      if (hadError) delete fieldErrors[id];
      scheduleDecisionStatePersistence();
      // A pick that needs a reason adds the reason field; otherwise only the toggles and footer move.
      if (hadError || draftFor(d, action).reasonNeeded !== neededNote) render();
      else syncFooter(id);
    };

    window.confirmOptions = (id) => {
      const d = getDecisionById(id);
      if (!d || pendingDecisionId) return;
      void runDecision(id, 'approve');
    };

    // Option buttons and fields are delegated: their ids come from the server and never reach an inline handler.
    document.getElementById('content').addEventListener('click', (event) => {
      const button = event.target && event.target.closest ? event.target.closest('.dq-opt[data-option-id]') : null;
      if (!button || button.disabled) return;
      const id = button.getAttribute('data-decision-id');
      const optionId = button.getAttribute('data-option-id');
      if (button.getAttribute('data-for') === 'reject') window.pickRejectOption(id, optionId);
      else window.chooseOption(id, optionId);
    });
    document.getElementById('content').addEventListener('input', (event) => {
      const field = event.target && event.target.getAttribute ? event.target.getAttribute('data-field') : null;
      const id = field ? event.target.getAttribute('data-decision-id') : null;
      if (!field || !id) return;
      if (field === 'reject-note') { window.syncRejectDraft(id, event.target); return; }
      if (field === 'answer') answerDrafts[id] = event.target.value;
      if (field === 'approve-note') approveNotes[id] = event.target.value;
      if (fieldErrors[id] && (fieldErrors[id].field === field || (field === 'approve-note' && fieldErrors[id].field === 'reason'))) clearFieldError(id);
      syncCounter(event.target);
      scheduleDecisionStatePersistence();
      syncFooter(id);
    });

    // Typing answers the inline message; the requirement it raised stays until the item is sent.
    var clearFieldError = (id) => {
      if (fieldErrors[id]) fieldErrors[id].message = '';
      document.querySelectorAll(`[data-error-for="${CSS.escape(id)}"]`).forEach((node) => node.remove());
    };

    var syncCounter = (field) => {
      const counter = field && field.id ? document.querySelector(`[data-counter-for="${CSS.escape(field.id)}"]`) : null;
      if (!counter) return;
      const max = Number(field.getAttribute('maxlength')) || TEXT_MAX;
      const left = max - field.value.length;
      counter.textContent = left <= 200 ? left + ' left' : '';
    };

    var focusField = (id, field) => {
      window.requestAnimationFrame(() => {
        const el = document.getElementById(field + '-' + id);
        if (el && !el.readOnly) el.focus();
      });
    };

    // Toggles, the chosen option and the disabled state follow the footer.
    var syncOptions = (id) => {
      const d = getDecisionById(id);
      const locked = Boolean(actionStates[id]) || Boolean(pendingDecisionId);
      const picked = selectedFor(id);
      const chosen = decisionChoices[id];
      document.querySelectorAll(`.dq-options[data-options-for="${CSS.escape(id)}"]`).forEach((group) => {
        const forReject = group.getAttribute('data-for') === 'reject';
        group.querySelectorAll('.dq-opt').forEach((btn) => {
          const oid = btn.getAttribute('data-option-id');
          btn.disabled = locked;
          const on = forReject && d && choicesFor(d).selection && choicesFor(d).selection.mode === 'single' ? rejectPicks[id] === oid : picked.includes(oid);
          if (btn.hasAttribute('aria-pressed')) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
          const sel = d ? choicesFor(d).selection : null;
          btn.toggleAttribute('data-at-max', Boolean(sel && sel.mode === 'multiple' && !on && picked.length >= sel.max));
          const isChosen = Boolean(chosen && (chosen.option_id === oid || (chosen.option_ids || []).includes(oid)) && actionStates[id]);
          btn.toggleAttribute('data-chosen', isChosen);
        });
      });
      document.querySelectorAll(`[data-field][data-decision-id="${CSS.escape(id)}"]`).forEach((field) => {
        field.readOnly = Boolean(actionStates[id]);
      });
    };

    window.submitReject = async (id) => {
      if (pendingDecisionId) return;
      await runDecision(id, 'reject');
    };

    window.toggleRejectComposer = (id, trigger) => {
      if (pendingDecisionId) return;
      rejectComposerId = rejectComposerId === id ? null : id;
      if (fieldErrors[id] && fieldErrors[id].action === 'reject' && rejectComposerId !== id) delete fieldErrors[id];
      scheduleDecisionStatePersistence();
      render();
      window.requestAnimationFrame(() => {
        if (rejectComposerId === id) {
          const field = document.getElementById('reject-note-' + id);
          if (field) { field.focus(); return; }
        }
        const nextTrigger = document.querySelector(
          `[data-reject-id="${CSS.escape(id)}"]`
        );
        (nextTrigger || trigger)?.focus();
      });
    };

    window.syncRejectDraft = (id, textarea) => {
      rejectDrafts[id] = textarea.value;
      if (fieldErrors[id] && fieldErrors[id].field === 'reason') clearFieldError(id);
      syncCounter(textarea);
      scheduleDecisionStatePersistence();
      syncFooter(id);
    };

    window.selectDecision = (id) => {
      if (pendingDecisionId || !data || !Array.isArray(data.decisions)) return;
      const index = data.decisions.findIndex((d) => d.id === id);
      if (index < 0) return;
      pageDirection = index + 1 >= currentPage ? 'forward' : 'backward';
      currentPage = index + 1;
      scheduleDecisionStatePersistence();
      render();
      window.requestAnimationFrame(() => {
        const heading = document.querySelector('.dq-q a');
        if (heading) heading.focus({ preventScroll: false });
      });
    };

    window.changePage = (delta) => {
      const totalPages = Math.max(1, Math.ceil((data?.decisions?.length || 0) / itemsPerPage));
      const nextPage = Math.min(totalPages, Math.max(1, currentPage + delta));
      if (nextPage === currentPage) return;
      pageDirection = delta > 0 ? 'forward' : 'backward';
      currentPage = nextPage;
      scheduleDecisionStatePersistence();
      render();
    };

    // Footer events bubble out of the kit's shadow root.
    document.addEventListener('ox-primary', (event) => {
      const footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-decision-id]') : null;
      if (!footer) return;
      const id = footer.getAttribute('data-decision-id');
      const d = getDecisionById(id);
      const st = actionStates[id];
      if (!d) return;
      if (!st) {
        if (rejectComposerId === id) void window.submitReject(id);
        else void runDecision(id, 'approve');
        return;
      }
      if (st.phase === 'failed') {
        delete actionStates[id];
        void runDecision(id, st.action);
        return;
      }
      if (st.phase === 'unsettled') {
        openExternal(buildDecisionSurfaceUrl(d));
        // Handing off does not change state here; clear the kit's press lock so it can open again.
        const detail = footer.getAttribute('detail') || '';
        footer.setAttribute('state', footer.getAttribute('state') || '');
        footer.setAttribute('detail', detail + ' ');
        footer.setAttribute('detail', detail);
      }
    });

    document.addEventListener('ox-action', (event) => {
      const footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-decision-id]') : null;
      if (!footer) return;
      const id = footer.getAttribute('data-decision-id');
      const d = getDecisionById(id);
      const st = actionStates[id];
      if (!d || !st) return;
      if (st.phase === 'done' || st.phase === 'elsewhere') openExternal(buildDecisionSurfaceUrl(d));
      if (st.phase === 'waiting') void watchDecision(id, st.action);
      if (st.phase === 'stale' && !st.refreshing) void refreshQueue(id);
    });

    document.addEventListener('ox-open', (event) => {
      const href = event.detail && event.detail.href;
      if (!href) return;
      if (window.openWidgetLink) openWidgetLink(href, event);
    });

    document.addEventListener('ox-action', (event) => {
      const footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-queue-retry]') : null;
      if (footer) location.reload();
    });


    /* -------------------------------------------------------------- batch -- */
    // Q7: finish what can, in one move. Items that are a plain approve (a token, no options,
    // no typed answer) can be approved together: one call per item, in order, each with its
    // own token and kind. Every item reports its own result; the batch never claims more.
    // There is no server-side undo for decisions, so none is offered.
    var batchState = null; // { ids, results: { id: { status, text } }, running }
    if (fixtureState === 'batch-result') {
      actionStates.d2 = { phase: 'done', action: 'approve' };
      actionStates.d3 = { phase: 'done', action: 'approve' };
      actionStates.c3 = { phase: 'done', action: 'approve' };
