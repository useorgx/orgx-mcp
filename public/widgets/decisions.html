  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      const embed = params.get('embed');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      if (embed) document.documentElement.setAttribute('data-embed', embed);

  <style>
    /* Canvas: Main (needs you), Q3 (one card, one send), Q8 (after you act), F2 (calm).
       Surface, text and status colors come from the kit tokens and the widget theme;
       this sheet only lays the card out. */
    :root { --ox-primary-rgb: 251, 191, 36; }

    /* The kit draws its primary (Approve, Retry) in the needs-you amber in every widget. */
    ox-footer, ox-attention-line, ox-state-chip, ox-receipt-row, ox-glyph, ox-avatar {
      --ox-primary: rgb(251, 191, 36);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ox-font);
      background: var(--ox-bg);
      color: var(--ox-text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button { font: inherit; color: inherit; }
    a { color: inherit; }

    .container { max-width: 640px; margin: 0 auto; }

    .decision-shell { display: flex; flex-direction: column; gap: 12px; }

    @keyframes dqIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-in { animation: dqIn var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out) both; }
    .decision-shell[data-page-direction="forward"] .decision-card,
    .decision-shell[data-page-direction="backward"] .decision-card { animation: dqIn var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out) both; }
    .skeleton-wrapper { transition: opacity 200ms ease; }

    /* One card: attention line, the decision, the footer. */
    .ox-card {
      position: relative;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      overflow: hidden;
      --edge-rgb: var(--ox-edge-amber-rgb);
    }
    .ox-card::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), 0.75), transparent);
      transition: background var(--ox-dur-edge, 600ms) ease;
    }
    .ox-card[data-edge="teal"] { --edge-rgb: var(--ox-edge-teal-rgb); }
    .ox-card[data-edge="red"] { --edge-rgb: var(--ox-edge-red-rgb); }
    .ox-card[data-edge="mute"] { --edge-rgb: var(--ox-edge-mute-rgb); }

    .dq-head { border-bottom: 1px solid var(--ox-border); --ox-attention-padding: 0 8px 0 20px; }
    .dq-head-link {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 44px; padding: 0 12px; border-radius: 10px;
      font-size: 12.5px; font-weight: 600; color: var(--ox-text-2); text-decoration: none; white-space: nowrap;
    }
    .dq-head-link:hover { color: var(--ox-text); background: var(--ox-hover); }
    .dq-head-link svg { width: 12px; height: 12px; }

    .dq-body { padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 18px; }

    .dq-status {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      font: 600 12px/1.3 var(--ox-mono); color: var(--ox-text-muted);
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .dq-status .need { display: inline-flex; align-items: center; gap: 6px; color: var(--ox-warning); }
    .dq-status .done { display: inline-flex; align-items: center; gap: 6px; color: var(--ox-teal); }
    .dq-status .ctx-wrap { display: contents; }
    .dq-status .ctx { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .dq-status .urg { margin-left: auto; padding-left: 8px; }
    .dq-status .urg-critical { color: var(--ox-danger); }
    .dq-status ox-glyph { --ox-glyph-size: 15px; }

    .dq-q { font-size: 26px; line-height: 1.18; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; overflow-wrap: anywhere; }
    .dq-q a { color: inherit; text-decoration: none; }
    .dq-q a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }

    .dq-rec { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; min-width: 0; }
    .dq-rec .role { font-weight: 500; color: var(--ox-text-muted); }
    .dq-why { font-size: 14px; line-height: 1.5; color: var(--ox-text-2); margin-top: 6px; text-wrap: pretty; }

    .agent-avatar { display: inline-flex; flex: none; line-height: 0; }
    .agent-avatar--system { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: rgba(var(--ox-teal-rgb, 0, 201, 167), 0.12); align-items: center; justify-content: center; font: 600 10px/1 var(--ox-mono); color: var(--ox-teal); }
    .agent-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .dq-evidence { display: flex; flex-direction: column; }
    .dq-all {
      display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
      font-size: 12.5px; color: var(--ox-text-2); text-decoration: none; align-self: flex-start;
    }
    .dq-all:hover { color: var(--ox-text); }
    .dq-all svg { width: 12px; height: 12px; }

    .dq-cons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .dq-cons.is-single { grid-template-columns: minmax(0, 1fr); }
    .dq-cons .k { font-size: 12.5px; color: var(--ox-text-muted); margin-bottom: 3px; }
    .dq-cons .v { font-size: 13.5px; line-height: 1.45; color: var(--ox-text-2); }

    .decision-evidence { border-top: 1px solid var(--ox-border); }
    .decision-evidence > summary {
      display: flex; align-items: center; gap: 8px; min-height: 44px;
      list-style: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ox-text-2);
    }
    .decision-evidence > summary::-webkit-details-marker { display: none; }
    .decision-evidence > summary::after {
      content: ""; width: 7px; height: 7px; margin-left: auto; margin-right: 4px;
      border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor;
      transform: rotate(45deg) translateY(-2px); transition: transform 160ms ease;
    }
    .decision-evidence[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
    .decision-evidence > summary:hover { color: var(--ox-text); }
    .decision-evidence__body { display: flex; flex-direction: column; gap: 12px; padding: 2px 0 6px; }
    .decision-evidence__item .k { font-size: 12.5px; color: var(--ox-text-muted); margin-bottom: 3px; }
    .decision-evidence__copy { font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); overflow-wrap: anywhere; }
    .decision-tradeoffs { display: grid; gap: 8px; }
    .decision-tradeoff { font-size: 13px; line-height: 1.45; color: var(--ox-text-2); }
    .decision-tradeoff strong { display: block; color: var(--ox-text); font-weight: 600; }
    .params-well {
      display: flex; flex-wrap: wrap; gap: 4px 14px;
      font: 500 11.5px/1.5 var(--ox-mono); color: var(--ox-text-muted); font-variant-numeric: tabular-nums;
    }
    .param-chip strong { font-weight: 600; color: var(--ox-text-2); overflow-wrap: anywhere; }

    /* Decide in OrgX: the fallback when this widget holds no approval token. */
    .decide-in-orgx {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px;
      padding: 14px 16px; border-radius: 14px; text-decoration: none;
      background: rgb(251, 191, 36); color: #1a1204; border: 1px solid #e9a800;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: filter 160ms ease;
    }
    .decide-in-orgx:hover { filter: brightness(1.04); }
    .decide-in-orgx .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.12); flex: none; }
    .decide-in-orgx .ic svg { width: 16px; height: 16px; }
    .decide-in-orgx .t { display: block; font-size: 15px; font-weight: 700; }
    .decide-in-orgx .d { display: block; font-size: 12.5px; line-height: 1.35; opacity: 0.74; margin-top: 2px; }

    /* Send back: the note travels with the rejection. */
    .reject-composer { display: flex; flex-direction: column; gap: 8px; }
    .reject-composer label { font-size: 12.5px; color: var(--ox-text-muted); }
    .reject-textarea {
      width: 100%; min-height: 88px; resize: vertical; padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--ox-border-strong); background: var(--ox-well-bg); color: var(--ox-text);
      font: 14px/1.5 var(--ox-font);
    }
    .reject-textarea::placeholder { color: var(--ox-placeholder, var(--ox-text-muted)); }
    .reject-textarea:focus-visible { outline: 2px solid var(--ox-focus, var(--ox-warning)); outline-offset: 1px; }

    /* Slotted footer text action (Reject / Cancel) styled like the kit's text action. */
    .dq-text-btn {
      position: relative; min-height: 36px; padding: 0 12px; border-radius: 9px;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      font-size: 12.5px; font-weight: 650; background: none; border: 1px solid transparent;
      color: var(--ox-text-2); cursor: pointer; transition: background 160ms ease;
    }
    .dq-text-btn::after { content: ""; position: absolute; inset: -4px -2px; }
    .dq-text-btn:hover { color: var(--ox-text); background: var(--ox-hover); }
    .dq-text-btn:disabled { opacity: 0.55; cursor: default; }
    .dq-text-btn:focus-visible, .dq-row:focus-visible, .dq-head-link:focus-visible, .dq-all:focus-visible, .decide-in-orgx:focus-visible, .dq-q a:focus-visible, .decision-evidence > summary:focus-visible {
      outline: 2px solid var(--ox-focus, var(--ox-warning)); outline-offset: 2px;
    }

    /* The rest of the queue: one quiet row each, opened in place. */
    .dq-queue { display: flex; flex-direction: column; }
    .dq-row {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px;
      padding: 10px 14px; border-radius: 12px; border: 1px solid transparent;
      background: transparent; text-align: left; cursor: pointer; color: var(--ox-text);
    }
    .dq-row:hover { background: var(--ox-hover); }
    .dq-row:disabled { cursor: default; opacity: 0.6; }
    .dq-row .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ox-warning); flex: none; }
    .dq-row .ttl { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dq-row .meta, .dq-meta { font: 500 11.5px/1.3 var(--ox-mono); color: var(--ox-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dq-row .chev { width: 14px; height: 14px; color: var(--ox-text-muted); flex: none; }
    .dq-more { padding: 6px 14px; }

    .dq-history { display: flex; flex-direction: column; padding: 0 2px; }
    .dq-history-label { font-size: 12.5px; color: var(--ox-text-muted); padding: 4px 12px 2px; }
    .dq-last {
      display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 14px;
      font-size: 12.5px; color: var(--ox-text-muted); text-decoration: none;
    }
    .dq-last .t2 { color: var(--ox-text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dq-last svg { width: 12px; height: 12px; margin-left: auto; flex: none; }
    .dq-last:hover .t2 { color: var(--ox-text); }

    /* Calm and error */
    .dq-calm { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 4px; }
    .dq-calm-title { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; }
    .dq-calm-copy { font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); }
    .dq-calm-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }

    /* Loading: the card's own footprint */
    .sk { display: block; border-radius: 6px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.12)); }
    .sk-head { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--ox-border); }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .dq-body { padding: 16px 16px 18px; gap: 16px; }
      .dq-calm { padding: 16px; }
      .dq-q { font-size: 21px; }
      .dq-cons { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .dq-head { --ox-attention-padding: 0 4px 0 16px; }
      .dq-status .ctx-wrap { display: none; }
      .dq-head-link .long, .dq-row .long { display: none; }
      .dq-row { padding: 10px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-in, .decision-shell[data-page-direction] .decision-card { animation: none; }
    }

    /* Social preview: one decision, no queue. */
    :root[data-embed="og-decision"] body { padding: 14px; }
    :root[data-embed="og-decision"] .container { max-width: 600px; }
    :root[data-embed="og-decision"] .dq-q { font-size: 22px; }
    :root[data-embed="og-decision"] .decision-evidence,
    :root[data-embed="og-decision"] .dq-queue,
    :root[data-embed="og-decision"] .dq-history,
    :root[data-embed="og-decision"] .dq-last { display: none; }
  </style>

<body>
  <div class="container">
    <div id="content">
      <!-- Skeleton mirrors the decision card: attention line, question, recommendation, footer -->
      <div class="skeleton-wrapper" aria-busy="true">
        <div class="ox-card">
          <div class="sk-head"><span class="sk" style="width:8px;height:8px;border-radius:50%"></span><span class="sk" style="width:38%;height:12px"></span></div>
          <div class="dq-body">
            <span class="sk" style="width:34%;height:11px"></span>
            <span class="sk" style="width:82%;height:24px"></span>
            <span class="sk" style="width:58%;height:13px"></span>
            <span class="sk" style="width:90%;height:13px"></span>
          </div>
          <ox-footer variant="reads" state="loading"></ox-footer>
        </div>
      </div>
    </div>
  </div>
  <script>
    var queryParams = new URLSearchParams(window.location.search);
    var embedMode = document.documentElement.getAttribute('data-embed') || queryParams.get('embed') || '';
    var isOgDecisionEmbed = embedMode === 'og-decision';

    var injectHtml = (html) => {
      const content = document.getElementById('content');
      const skeleton = content.querySelector('.skeleton-wrapper');
      if (skeleton) {
        skeleton.style.opacity = '0';
        setTimeout(() => {
          content.innerHTML = html;
          afterRender();
        }, 200);
      } else {
        content.innerHTML = html;
        afterRender();
      }
    };

    var _svg = function(c,s){var sz=typeof s==='number'?s+'px':(s||'1em');return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true">'+c+'</svg>';};
    var icons = {
      check: function(s){return _svg('<polyline points="20 6 9 17 4 12"></polyline>',s);},
      ext: function(s){return _svg('<path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>',s);},
      chevron: function(s){return _svg('<polyline points="9 6 15 12 9 18"></polyline>',s);},
    };

    var escapeHtml = (str) => {
      if (str === null || str === undefined || str === '') return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    };
    var ORGX_BASE_URL = 'https://useorgx.com';
    var hasKit = () => Boolean(window.customElements && window.customElements.get && window.customElements.get('ox-footer'));
    var rt = () => window.OrgXWidgetRuntime || null;

    var fixtureState = queryParams.get('state') || (queryParams.get('loading') === 'true' ? 'loading' : queryParams.get('demo') === 'true' ? 'urgent' : 'empty');
    // Footer fixtures for the gallery: each one opens decision d2, which this demo can approve here.
    var FOOTER_FIXTURES = ['decide-here', 'composing', 'sending', 'confirming', 'approved', 'not-sent', 'unconfirmed'];
    var isFooterFixture = FOOTER_FIXTURES.includes(fixtureState);
    var isDemo = ['urgent', 'populated', 'long', 'resolved'].includes(fixtureState) || isFooterFixture;
    var demoNow = Date.now();
    var data = isDemo ? {
      summary: { critical: 1, high: 2 },
      decisions: [
        {
          id: 'd1',
          urgency: 'critical',
          agent_name: 'Pace - Product',
          type: 'Launch approval',
          sourceLabel: 'Founder launch',
          decide_in_orgx_reason: 'critical',
          summary: 'Approve the founder continuity launch story so the hero, OG preview, and CTA all ship with one narrative.',
          created_at: new Date(demoNow - 2 * 24 * 60 * 60 * 1000).toISOString(),
          expected_cost_usd: 0,
          required_trust_level: 'act_with_approval',
          context: 'Search, scaffolded work, and the decision queue are all demo-ready. The remaining operator call is whether the founder story leads with continuity instead of generic orchestration.',
          recommendation: 'Approve the continuity-led narrative and keep decisions in the foreground so the founder sees exactly what still needs judgment.',
          impact: 'Launch copy, social preview, and founder post stay misaligned if this waits for another async pass.',
          if_approved: 'The launch pack publishes with the continuity story and Mark schedules the founder post.',
          if_rejected: 'The launch holds. Pace reworks the story against your note.',
          evidence: [
            { label: 'Launch copy review · passed', status: 'met', created_at: new Date(demoNow - 2 * 24 * 60 * 60 * 1000).toISOString() },
            { label: 'Founder post draft · v3', status: 'unverified', created_at: new Date(demoNow - 3 * 24 * 60 * 60 * 1000).toISOString() }
          ],
          tradeoffs: [
            {
              option: 'Continuity-led story',
              detail: 'Connects search, scaffold, and approvals into one clear founder workflow.'
            },
            {
              option: 'Generic orchestration story',
              detail: 'Feels broader, but weakens the proof of why OrgX MCP matters day one.'
            }
          ]
        },
        {
          id: 'd2',
          urgency: 'high',
          agent_name: 'Eli - Engineering',
          type: 'Search threshold',
          sourceLabel: 'Launch search',
          summary: 'Lock the launch search relevance threshold at 0.82?',
          created_at: new Date(demoNow - 5 * 60 * 60 * 1000).toISOString(),
          expected_cost_usd: 0,
          required_trust_level: 'approve_or_adjust',
          context: 'The search widget is pulling the right memory set in staging, but the score cutoff still decides whether the launch decision appears in the first fold.',
          recommendation: 'Keep 0.82 for launch and revisit after real operator traffic gives us edge-case recall data.',
          impact: 'Too low adds noisy memory; too high hides the decision that makes the founder workflow credible.',
          if_approved: 'Eli ships 0.82 to production search and records recall for a week.',
          if_rejected: 'The threshold stays at 0.75. Eli reworks it against your note.',
          evidence: [
            { label: 'Staging recall run 214 · passed', status: 'met', created_at: new Date(demoNow - 6 * 60 * 60 * 1000).toISOString() },
            { label: 'Edge-case query set · 3 misses', status: 'fail', created_at: new Date(demoNow - 6 * 60 * 60 * 1000).toISOString() }
          ]
        },
        {
          id: 'd3',
          urgency: 'high',
          agent_name: 'Mark - Marketing',
          type: 'CTA lock',
          summary: 'Approve the founder CTA: “Connect your AI tools to one continuity layer” for launch page, OG copy, and the day-seven post.',
          created_at: new Date(demoNow - 96 * 60 * 1000).toISOString(),
          expected_cost_usd: 0,
          required_trust_level: 'act_with_approval',
          context: 'Marketing has three variants drafted. This is the last manual choice before the launch pack can be published across site and social.',
          recommendation: 'Use the continuity-layer CTA so the launch promise stays concrete and defensible across channels.',
          impact: 'Founder content risks sounding like another generic AI wrapper if the CTA drifts from the product proof.'
        }
      ]
    } : null;
    // Demo-only stand-ins for the widget approval tokens a real result carries in its _meta.
    var demoApprovalTokens = isDemo ? { d2: 'demo-approval-token', d3: 'demo-approval-token' } : null;
    if (fixtureState === 'long' && data) {
      data.decisions[0].summary = 'Approve the founder continuity launch story, linked artifact evidence, decision provenance language, responsive social preview, CTA hierarchy, and cross-agent continuation receipt before the scheduled release window';
      data.decisions[0].context += ' This long-content fixture verifies wrapping and disclosure behavior across compact hosts.';
    }
    if (fixtureState === 'resolved') {
      data = { summary: {}, decisions: [] };
    }
    if (fixtureState === 'error' || fixtureState === 'degraded') {

    }

    var isLoadingOverride = fixtureState === 'loading';

    }
    var bootStartedAt = Date.now();
    var syncedAt = null;
    var MIN_LOADING_MS = 220;
    var loadingSettled = false;
    var applyBootPayload = function(assign) {
      var commit = function() {
        if (typeof assign === 'function') assign();
        syncedAt = new Date();
        isLoading = false;
        render();
      };
      if (loadingSettled) {
        commit();
        return;
      }

    };

    var rejectComposerId = null;
    var rejectDrafts = {};
    var pendingDecisionId = null;
    var lastResolution = null;
    var currentPage = 1;
    var itemsPerPage = 1;
    var pageDirection = 'forward';
    var decisionStateTimer = null;
    // Per-decision footer state after the person acts: sending, confirming, done, waiting, failed, unsettled.
    var actionStates = {};

    var restoredDecisionState = window.openai && window.openai.widgetState;
    if (restoredDecisionState && typeof restoredDecisionState === 'object') {
      if (Number.isInteger(restoredDecisionState.currentPage) && restoredDecisionState.currentPage > 0) {

      }
      if (typeof restoredDecisionState.rejectComposerId === 'string') {

      }
      if (restoredDecisionState.rejectDrafts && typeof restoredDecisionState.rejectDrafts === 'object') {

      if (restoredDecisionState.lastResolution && typeof restoredDecisionState.lastResolution === 'object') {
        lastResolution = restoredDecisionState.lastResolution;

    }

    if (isFooterFixture) {
      currentPage = 2;
      if (fixtureState === 'composing') {

        rejectDrafts.d2 = 'Hold at 0.80 until the edge-case set passes.';
      }
      var fixturePhase = {
        sending: { phase: 'sending', action: 'approve' },
        confirming: { phase: 'confirming', action: 'approve', detail: 'Eli is picking it up' },
        approved: { phase: 'done', action: 'approve', detail: 'Eli continues · 0.82 ships to production' },
        'not-sent': { phase: 'failed', action: 'approve' },
        unconfirmed: { phase: 'waiting', action: 'approve' },

      if (fixturePhase) actionStates.d2 = fixturePhase;
      if (fixtureState === 'approved') {

    if (fixtureState === 'resolved') {
      lastResolution = { action: 'approved', summary: 'Release checklist v3', agent_name: 'Eli - Engineering' };
    }

    var persistDecisionState = () => {
      if (!window.OrgXWidgetRuntime) return Promise.resolve(null);
      return window.OrgXWidgetRuntime.persistWidgetState({
        version: 1,
        widgetSessionId: window.OrgXWidgetRuntime.getWidgetSessionId(),
        currentPage,
        rejectComposerId,
        rejectDrafts,
        lastResolution,
      });
    };

    var scheduleDecisionStatePersistence = () => {
      if (decisionStateTimer) window.clearTimeout(decisionStateTimer);
      decisionStateTimer = window.setTimeout(() => {
        decisionStateTimer = null;
        void persistDecisionState();
      }, 160);
    };

    var publishDecisionResolution = async (decision, resolution) => {
      if (!window.OrgXWidgetRuntime || !resolution) return;
      const verb = resolution.action === 'approved' ? 'approved' : 'sent back';
      const owner = resolution.agent_name || 'the assigned agent';
      const summary = resolution.summary || 'Decision';
      const context = {

        decision_id: decision && decision.id ? decision.id : null,

        action: resolution.action,
        summary,
        owner,
        note: resolution.note || null,
        widget_session_id: window.OrgXWidgetRuntime.getWidgetSessionId(),
      };

        persistDecisionState(),
        window.OrgXWidgetRuntime.updateModelContext({
          content: [{ type: 'text', text: `${summary} was ${verb} in OrgX. ${owner} can continue from this operator decision.` }],
          structuredContent: context,
        }),
        window.OrgXWidgetRuntime.sendFollowUpMessage(
          `${summary} was ${verb} in the OrgX decision widget. Keep the conversation aligned with that operator action.`
        ),
      ]);
    };

    var buildAgentStatusUrl = () => ORGX_BASE_URL + '/settings/agents';
    var buildDecisionsUrl = () => ORGX_BASE_URL + '/decisions?status=pending';
    // Approval tokens arrive in widget-only result metadata. A decision without
    // one is decided in OrgX: the widget never pretends it can settle it.
    var getApprovalToken = (decisionId) => {
      const meta = window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.getToolResponseMetadata
        ? window.OrgXWidgetRuntime.getToolResponseMetadata('orgx/widgetApproval')
        : null;
      const token = meta && meta.approval_tokens ? meta.approval_tokens[decisionId] : null;
      if (typeof token === 'string' && token) return token;

    };

    var decideInOrgxDetail = (decision) => {
      switch (decision && decision.decide_in_orgx_reason) {
        case 'critical': return 'Critical decisions are made in OrgX.';
        case 'choice_required': return 'Choose between the options in OrgX.';
        case 'agent_run_approval': return 'Agent run approvals are made in OrgX.';
        case 'protected_decision_type':
        case 'specialized_lifecycle':
        case 'artifact_review_lifecycle': return 'This one needs the full review in OrgX.';
        default: return 'Open it in OrgX to decide.';
      }
    };

    var buildDecisionSurfaceUrl = (decision) => {
      if (!decision || !decision.id) return ORGX_BASE_URL + '/decisions';
      if (typeof decision.url === 'string' && decision.url.trim()) return decision.url.trim();
      if (typeof decision.link === 'string' && decision.link.trim()) return decision.link.trim();
      if (typeof decision.initiative_id === 'string' && decision.initiative_id.trim()) {
        return ORGX_BASE_URL + '/initiatives/' + encodeURIComponent(decision.initiative_id.trim()) + '?focus=decisions&decision=' + encodeURIComponent(decision.id);
      }

    // Links leave through the host; standalone previews open a tab.
    var openExternal = (url, event) => {

      if (event && event.defaultPrevented) return;
      try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (_) { /* host owns recovery */ }
    };

    var firstString = (...values) => {
      for (const value of values) {
        if (typeof value === 'string' && value.trim()) return value.trim();
      }
      return '';
    };

    var humanizeDecisionKey = (key) => String(key || '')
      .replace(/[_-]+/g, ' ')
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .trim();

    var pushUniqueText = (parts, value) => {
      var text = typeof value === 'string' ? value.trim() : '';
      if (!text || parts.includes(text)) return;
      parts.push(text);
    };

    var formatDecisionField = (value, depth) => {
      if (value === null || value === undefined) return '';
      if (typeof value === 'string') return value.trim();
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (Array.isArray(value)) {
        var listParts = [];
        value.forEach((item) => pushUniqueText(listParts, formatDecisionField(item, (depth || 0) + 1)));
        return listParts.join(' • ');
      }
      if (typeof value === 'object') {
        if ((depth || 0) > 2) return '';
        var objectParts = [];
        var preferredKeys = ['summary', 'text', 'message', 'title', 'description', 'reason', 'note', 'content', 'detail', 'details', 'body', 'why', 'impact', 'recommendation'];
        var hiddenKeys = ['id', 'uuid', 'created_at', 'createdAt', 'updated_at', 'updatedAt', 'decision_id', 'entity_id', 'initiative_id', 'workstream_id', 'milestone_id', 'task_id'];
        var orderedKeys = preferredKeys.filter((key) => key in value);
        Object.keys(value).forEach((key) => {
          if (orderedKeys.includes(key) || hiddenKeys.includes(key)) return;
          orderedKeys.push(key);
        });
        orderedKeys.forEach((key) => {
          var formatted = formatDecisionField(value[key], (depth || 0) + 1);
          if (!formatted) return;
          if (preferredKeys.includes(key)) {
            pushUniqueText(objectParts, formatted);
            return;
          }
          pushUniqueText(objectParts, humanizeDecisionKey(key) + ': ' + formatted);
        });
        return objectParts.join(' • ');
      }
      return '';
    };

    // Evidence lists become receipt rows: one line of proof each.
    var RECEIPT_STATUS = { met: 'met', pass: 'met', passed: 'met', ok: 'met', verified: 'met', succeeded: 'met', fail: 'fail', failed: 'fail', failing: 'fail', yours: 'yours', pending: 'pending', checking: 'pending' };
    var normalizeEvidenceItems = (value) => {
      if (!Array.isArray(value)) return [];
      return value.map((item) => {
        if (typeof item === 'string') return item.trim() ? { label: item.trim(), status: 'unverified' } : null;
        if (!item || typeof item !== 'object') return null;
        const label = firstString(item.label, item.title, item.summary, item.name, item.description);
        if (!label) return null;
        const rawStatus = firstString(item.status, item.verdict, item.result).toLowerCase();
        return {
          label,
          status: RECEIPT_STATUS[rawStatus] || 'unverified',
          at: firstString(item.created_at, item.createdAt, item.at, item.updated_at),
          url: firstString(item.url, item.href, item.link),
        };
      }).filter(Boolean);
    };

    var pickConsequence = (source, keys) => {
      if (!source || typeof source !== 'object' || Array.isArray(source)) return '';
      for (const key of keys) {
        if (key in source) {
          const text = formatDecisionField(source[key]);
          if (text) return text;
        }
      }
      return '';
    };

    var resolveWidgetAsset = (path) => new URL('shared/' + path, window.location.href).toString();
    // Previews served next to the widgets read avatars from the same origin;
    // host sandboxes use the kit default (mcp.useorgx.com).
    if (window.OrgXElements && window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.detectProtocol() === 'standalone') {
      window.OrgXElements.avatarConfig.baseUrl = resolveWidgetAsset('avatars');
    }

    var normalizeDecision = (decision, index) => {
      if (!decision || typeof decision !== 'object') return null;
      const packet =
        decision.review_packet &&
        typeof decision.review_packet === 'object' &&
        !Array.isArray(decision.review_packet)
          ? decision.review_packet
          : null;
      const id =
        firstString(
          packet && packet.headDecisionId,
          decision.id,
          decision.decision_id,
          decision.uuid,
          decision.entity_id
        ) || `decision-${index + 1}`;
      const summary =
        firstString(
          packet && packet.question,
          decision.summary,
          decision.title,
          decision.name,
          decision.prompt,
          decision.description
        ) || 'Untitled decision';
      const urgency = firstString(
        decision.urgency,
        decision.urgency_level,
        decision.priority
      ).toLowerCase() || 'medium';
      const context =
        (packet && {
          outcome: packet.outcome,
          current: packet.current,
          evidence: packet.evidence,
          uncertainty: packet.uncertainty,
        }) ??
        decision.context ?? decision.why_it_matters ?? decision.whyItMatters ?? decision.reasoning ?? null;
      const recommendation =
        (packet && packet.recommendation) ??
        decision.recommendation ?? decision.recommended_action ?? decision.next_action ?? decision.action ?? null;
      const impact =
        (packet && packet.consequences) ??
        decision.impact ?? decision.impact_if_ignored ?? decision.risk_if_ignored ?? decision.consequence ?? null;
      const consequenceSource = (packet && packet.consequences) || decision.consequences || decision;
      const ifApproved = pickConsequence(consequenceSource, ['if_approved', 'ifApproved', 'approve', 'approved', 'on_approve']);
      const ifRejected = pickConsequence(consequenceSource, ['if_rejected', 'ifRejected', 'reject', 'rejected', 'on_reject']);
      const rawOwner = firstString(
        packet && packet.current && packet.current.owner,
        decision.agent_name,
        decision.owner_agent,
        decision.assigned_agent,
        decision.domain
      );
      const isSystemDecision =
        !rawOwner ||
        ['system', 'orgx', 'orgx system'].includes(rawOwner.toLowerCase()) ||
        firstString(decision.source, decision.created_by_type, decision.created_by).toLowerCase() === 'system';
      return {
        ...decision,
        id,
        packet_id: firstString(decision.packet_id, packet && packet.id),
        gate_key: firstString(packet && packet.gateKey),
        duplicate_count:
          packet && typeof packet.duplicateCount === 'number'
            ? packet.duplicateCount
            : 0,
        provider:
          packet && packet.recommendation && packet.recommendation.provenance && packet.recommendation.provenance.provider,
        model:
          packet && packet.recommendation && packet.recommendation.provenance && packet.recommendation.provenance.model,
        agent_name: isSystemDecision ? 'OrgX System' : rawOwner,
        is_system: isSystemDecision,
        type: firstString(decision.type, decision.entity_type) || 'Decision',
        source_label: firstString(decision.sourceLabel, decision.source_label, decision.initiative_title, decision.initiative_name),
        summary,
        urgency,
        context: formatDecisionField(context),
        recommendation: formatDecisionField(recommendation),
        impact: ifApproved || ifRejected ? '' : formatDecisionField(impact),
        if_approved: ifApproved,
        if_rejected: ifRejected,
        evidence_items: normalizeEvidenceItems((packet && packet.evidence) || decision.evidence),
        created_at:
          firstString(decision.created_at, decision.createdAt, decision.updated_at) ||
          new Date().toISOString(),

    };

    var buildDecisionKey = (decision) => {
      const packetId = firstString(decision.packet_id, decision.review_packet && decision.review_packet.id);
      if (packetId) return `packet:${packetId}`;
      const stableId = firstString(decision.id, decision.decision_id, decision.uuid, decision.entity_id);
      if (stableId) return `id:${stableId}`;
      return [
        firstString(decision.agent_name, decision.owner_agent, decision.assigned_agent, decision.domain).toLowerCase(),
        firstString(decision.summary, decision.title, decision.name, decision.prompt, decision.description).toLowerCase(),
        firstString(decision.urgency, decision.urgency_level, decision.priority).toLowerCase(),
        firstString(decision.type, decision.entity_type).toLowerCase(),
        firstString(decision.initiative_id, decision.run_id).toLowerCase(),
      ].join('::');
    };

    var normalizeDecisionQueue = (payload) => {
      if (!payload || typeof payload !== 'object') return null;
      if (payload.__normalized) return payload;
      const rawDecisions = Array.isArray(payload.decisions) ? payload.decisions : [];
      const seen = new Set();
      const decisions = [];
      rawDecisions.forEach((item, index) => {
        const normalized = normalizeDecision(item, index);
        if (!normalized) return;
        const key = buildDecisionKey(normalized);
        if (seen.has(key)) return;
        seen.add(key);
        decisions.push(normalized);
      });

      const summary = {};
      decisions.forEach((decision) => {
        const urgency = (decision.urgency || 'low').toLowerCase();
        summary[urgency] = (summary[urgency] || 0) + 1;
      });

      return {
        ...payload,
        __normalized: true,
        decisions,
        summary,
      };
    };

    var getDecisionById = (id) => Array.isArray(data && data.decisions) ? data.decisions.find((decision) => decision.id === id) || null : null;
    // A decision is settled here once OrgX confirmed it (or recorded it and could not confirm yet).
    var isSettled = (d) => {

      return Boolean(st && (st.phase === 'done' || st.phase === 'waiting'));
    };
    var pendingDecisions = () => (data && Array.isArray(data.decisions) ? data.decisions.filter((d) => !isSettled(d)) : []);

    var setPageButtonsDisabled = (disabled) => {
      document.querySelectorAll('.page-btn').forEach((button) => {
        button.disabled = !!disabled;
      });
    };

    var getDecisionOwner = (decision) => {
      const label = firstString(
        decision.agent_name,
        decision.owner_agent,
        decision.assigned_agent,
        decision.domain
      );
      const isSystem = Boolean(decision.is_system) || !label || ['system', 'orgx', 'orgx system'].includes(label.toLowerCase());
      if (isSystem) return { label: 'OrgX System', name: 'OrgX', role: '', isSystem: true };
      const parts = label.split(/\s+[-–—·|]\s+|\s*\(|\)/).map((part) => part.trim()).filter(Boolean);
      const name = parts[0] || label;
      const role = parts[1] ? parts[1].toLowerCase() : '';
      return { label, name, role, isSystem: false };
    };

    var renderAvatar = (name, sizePx, isSystem) => {
      if (isSystem) {
        const localUrl = resolveWidgetAsset('orgx-logo.png');
        const remoteUrl = 'https://mcp.useorgx.com/widgets/shared/orgx-logo.png';
        return `<span class="agent-avatar agent-avatar--system" style="width:${sizePx}px;height:${sizePx}px"><img src="${localUrl}" alt="" loading="eager" decoding="sync" draggable="false" onerror="if(!this.dataset.retried){this.dataset.retried='1';this.src='${remoteUrl}';return;}this.remove();" /></span>`;
      }

      if (agentKey) {

      }
      return '';
    };

    var formatUsd = v => Number.isFinite(Number(v)) ? '$'+Number(v).toFixed(2) : null;
    // "5h", "2d": the canvas status-line age.
    var shortAge = (value) => {
      const t = new Date(value).getTime();
      if (!Number.isFinite(t)) return '';

      if (m < 1) return 'now';
      if (m < 60) return m + 'm';

    var timeAgo = d => { const a = shortAge(d); return !a ? '' : a === 'now' ? 'just now' : a + ' ago'; };

    /* ---------------------------------------------------------------- footer -- */
    // SM3 finishes-here: Approve is hold-to-confirm, the outcome lands in the same row.
    // There is no server-side hold for decisions yet, so the footer never offers Undo.
    var footerSpec = (d) => {
      const who = getDecisionOwner(d).name;
      const st = actionStates[d.id];
      const base = { variant: 'finishes-here', heading: '', detail: '', primary: '', action: '', hold: false, disabled: false, slot: '' };
      if (!st) {
        if (rejectComposerId === d.id) {
          const hasNote = Boolean((rejectDrafts[d.id] || '').trim());

        }

        case 'sending':

        case 'confirming':
          return { ...base, state: 'running', heading: 'Confirming in OrgX', detail: st.detail || 'checking it settled' };
        case 'done':
          return { ...base, state: 'done', heading: approving ? 'Approved by you' : 'Sent back to ' + who, detail: st.detail || (approving ? who + ' continues' : who + ' reworks it against your note'), action: 'Receipt ↗' };
        case 'waiting':
          return { ...base, variant: 'confirms-in-orgx', state: 'waiting', heading: 'Recorded in OrgX', detail: st.detail || 'not confirmed yet', action: 'Check now' };
        case 'unsettled':
          return { ...base, state: 'failed', heading: st.heading || 'Didn’t go through', detail: st.detail || 'nothing changed here', primary: 'Decide in OrgX ↗' };
        case 'failed':
        default:
          return { ...base, state: 'failed', heading: 'Not sent', detail: st.detail || (approving ? 'nothing changed · try again' : 'your note is kept · try again'), primary: 'Retry' };
      }
    };

    var footerSlotHtml = (d, spec) => {
      if (spec.slot === 'reject') {
        return `<button type="button" slot="action" class="dq-text-btn decision-action-btn" data-reject-id="${escapeHtml(d.id)}" data-action="toggle-reject" onclick="toggleRejectComposer('${escapeHtml(d.id)}', this)" aria-expanded="false" aria-controls="reject-composer-${escapeHtml(d.id)}">Reject</button>`;
      }
      if (spec.slot === 'cancel') {
        return `<button type="button" slot="action" class="dq-text-btn decision-action-btn" data-reject-id="${escapeHtml(d.id)}" data-action="toggle-reject" onclick="toggleRejectComposer('${escapeHtml(d.id)}', this)" aria-expanded="true" aria-controls="reject-composer-${escapeHtml(d.id)}">Cancel</button>`;
      }
      return '';
    };

    var footerAttrs = (spec) => [
      ['variant', spec.variant],
      ['state', spec.state],
      ['heading', spec.heading],
      ['detail', spec.detail],
      ['primary-label', spec.primary],
      ['action-label', spec.action],
    ];

    var footerHtml = (d) => {
      const spec = footerSpec(d);
      const attrs = footerAttrs(spec).map(([k, v]) => `${k}="${escapeHtml(v)}"`).join(' ');
      return `<ox-footer class="dq-footer" data-decision-id="${escapeHtml(d.id)}" ${attrs}${spec.hold ? ' hold' : ''}${spec.disabled ? ' disabled' : ''}>${footerSlotHtml(d, spec)}</ox-footer>`;
    };

    // Move the footer in place so the kit crossfades it and focus follows the new control.
    var syncFooter = (id) => {
      const d = getDecisionById(id);
      const footer = document.querySelector(`ox-footer[data-decision-id="${CSS.escape(id)}"]`);
      if (!d || !footer) return;
      const spec = footerSpec(d);
      const note = document.getElementById('reject-note-' + id);
      if (note) note.readOnly = Boolean(actionStates[id]);
      footer.innerHTML = footerSlotHtml(d, spec);
      footer.toggleAttribute('hold', spec.hold);
      footer.toggleAttribute('disabled', spec.disabled);
      footerAttrs(spec).forEach(([k, v]) => {
        if (footer.getAttribute(k) !== v) footer.setAttribute(k, v);
      });
      syncChrome();
    };

    // The attention line, the card edge and the status line follow the queue.
    var syncChrome = () => {
      const line = document.getElementById('dqAttention');
      const pending = pendingDecisions();
      if (line) {
        line.setAttribute('count', String(pending.length));
        line.setAttribute('tone', pending.length ? 'needs-you' : 'calm');
        const oldest = oldestAge(pending);
        if (oldest) line.setAttribute('oldest', oldest); else line.removeAttribute('oldest');
      }
      document.querySelectorAll('[data-status-for]').forEach((node) => {
        const d = getDecisionById(node.getAttribute('data-status-for'));
        if (d) node.innerHTML = statusLineHtml(d);
      });
      document.querySelectorAll('.ox-card[data-card-for]').forEach((card) => {
        const d = getDecisionById(card.getAttribute('data-card-for'));
        if (d) card.setAttribute('data-edge', edgeFor(d));
      });
    };

    var edgeFor = (d) => {
      const st = actionStates[d.id];
      if (!st) return 'amber';
      if (st.phase === 'done' || st.phase === 'confirming') return 'teal';
      if (st.phase === 'failed' || st.phase === 'unsettled') return 'red';
      if (st.phase === 'waiting') return 'mute';
      return 'amber';
    };

    var oldestAge = (list) => {
      let oldest = null;
      list.forEach((d) => {
        const t = new Date(d.created_at).getTime();
        if (Number.isFinite(t) && (oldest === null || t < oldest)) oldest = t;
      });
      if (oldest === null) return '';
      const age = shortAge(oldest);
      return age === 'now' ? '' : age;
    };

    var statusLineHtml = (d) => {
      const st = actionStates[d.id];
      const ctx = d.source_label || (d.type && d.type.toLowerCase() !== 'decision' ? d.type : '');
      const ctxHtml = ctx ? `<span class="ctx-wrap"><span aria-hidden="true">·</span><span class="ctx">${escapeHtml(ctx)}</span></span>` : '';
      const urgency = d.urgency === 'critical'
        ? '<span class="urg urg-critical">Critical</span>'
        : d.urgency === 'high' ? '<span class="urg">High</span>' : '';
      if (st && st.phase === 'done') {
        return `<span class="done"><ox-glyph kind="decision" tone="teal"></ox-glyph>${st.action === 'approve' ? 'Approved' : 'Sent back'} by you · just now</span>${ctxHtml}`;
      }
      const age = shortAge(d.created_at);
      return `<span class="need"><ox-glyph kind="decision" tone="amber"></ox-glyph>Needs you${age && age !== 'now' ? ' · ' + age : ''}</span>${ctxHtml}${urgency}`;
    };

    /* --------------------------------------------------------------- actions -- */
    var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    var STATUS_POLL_LIMIT_MS = 120000;
    var sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

    var setPhase = (id, next) => {
      if (next) actionStates[id] = next; else delete actionStates[id];
      syncFooter(id);
    };

    var shortError = (error, fallback) => {
      const message = error && typeof error.message === 'string' ? error.message.trim() : '';
      return message && message.length <= 36 ? message.replace(/\.$/, '') : fallback;
    };

    // After OrgX records the decision, read its status until it settles (orgx_command_status).
    // next_poll_after_ms paces the reads; null means the state is final.
    var confirmDecisionSettled = async (id, onProgress) => {
      if (!UUID_RE.test(id)) return { state: 'unconfirmed' };
      const runtime = rt();
      const deadline = Date.now() + STATUS_POLL_LIMIT_MS;
      let wait = 0;
      for (;;) {
        if (wait) await sleep(wait);
        let status = null;
        try {
          const raw = await callTool('orgx_command_status', { kind: 'decision', id });
          status = runtime && runtime.extractStructuredWidgetData ? runtime.extractStructuredWidgetData(raw, true) : raw;
        } catch (_) {
          return { state: 'unconfirmed' };
        }
        if (!status || typeof status !== 'object' || typeof status.state !== 'string') return { state: 'unconfirmed' };
        if (status.next_poll_after_ms === null || status.next_poll_after_ms === undefined) return status;
        onProgress(status);
        if (Date.now() >= deadline) return { state: 'unconfirmed' };
        wait = Math.min(15000, Math.max(750, Number(status.next_poll_after_ms) || 2000));
      }
    };

    var progressDetail = (status, who) => {
      if (status && status.waiting_on === 'agent') return who + ' is picking it up';
      if (status && status.waiting_on === 'person') return 'waiting on a person in OrgX';
      if (status && status.state === 'queued') return 'queued in OrgX';
      return 'checking it settled';
    };

    var settleFromStatus = (id, action, status) => {
      const d = getDecisionById(id);
      const who = d ? getDecisionOwner(d).name : 'The agent';
      const outcome = status && typeof status.outcome === 'string' && status.outcome.trim() ? status.outcome.trim() : '';
      if (status.state === 'succeeded') return setPhase(id, { phase: 'done', action, detail: outcome });
      if (status.state === 'failed') return setPhase(id, { phase: 'unsettled', action, heading: 'Didn’t go through', detail: outcome || 'OrgX reported a failure' });
      if (status.state === 'cancelled') return setPhase(id, { phase: 'unsettled', action, heading: 'Cancelled in OrgX', detail: outcome || 'nothing was applied' });
      return setPhase(id, { phase: 'waiting', action, detail: status.state === 'not_found' ? 'OrgX has no status for it yet' : 'not confirmed yet' });
    };

    var watchDecision = async (id, action) => {
      const d = getDecisionById(id);
      const who = d ? getDecisionOwner(d).name : 'The agent';
      setPhase(id, { phase: 'confirming', action });
      const status = await confirmDecisionSettled(id, (progress) => {
        setPhase(id, { phase: 'confirming', action, detail: progressDetail(progress, who) });
      });
      settleFromStatus(id, action, status);
    };

    var runDecision = async (id, action, reason) => {
      if (pendingDecisionId) return;
      const decision = getDecisionById(id);
      pendingDecisionId = id;
      setPageButtonsDisabled(true);
      setPhase(id, { phase: 'sending', action });

      try {
        const approvalToken = getApprovalToken(id);
        if (!approvalToken) throw Object.assign(new Error('This decision has to be made in OrgX.'), { code: 'decide_in_orgx' });
        if (action === 'approve') {
          await callTool('orgx_widget_decide', { decision_id: id, action: 'approve', approval_token: approvalToken });
          lastResolution = {
            action: 'approved',
            summary: decision && decision.summary ? decision.summary : 'This decision',
            agent_name: decision && decision.agent_name ? decision.agent_name : 'the assigned agent'
          };
        } else {
          await callTool('orgx_widget_decide', { decision_id: id, action: 'reject', reason, approval_token: approvalToken });
          lastResolution = {
            action: 'rejected',
            summary: decision && decision.summary ? decision.summary : 'This decision',
            agent_name: decision && decision.agent_name ? decision.agent_name : 'the assigned agent',
            note: reason
          };
        }
        if (rejectComposerId === id) rejectComposerId = null;
        void publishDecisionResolution(decision, lastResolution);
        await watchDecision(id, action);
        // The composer closes once OrgX has the note.
        if (action === 'reject') render();
        if (actionStates[id] && actionStates[id].phase === 'done') delete rejectDrafts[id];
        scheduleDecisionStatePersistence();
      } catch (error) {
        const code = String((error && error.code) || '');
        if (code === 'decide_in_orgx') {
          setPhase(id, { phase: 'unsettled', action, heading: 'Decide in OrgX', detail: decideInOrgxDetail(decision) });
        } else if (/conflict|already|superseded|not_pending/i.test(code)) {
          // Q8: someone else ruled first. Nothing of yours was applied.
          setPhase(id, { phase: 'unsettled', action, heading: 'Already decided', detail: 'nothing of yours was applied' });
        } else if (/expired|approval_token|invalid_token/i.test(code)) {
          setPhase(id, { phase: 'unsettled', action, heading: 'Decide in OrgX', detail: 'this approval expired here' });
        } else {
          setPhase(id, { phase: 'failed', action, detail: shortError(error, action === 'approve' ? 'nothing changed · try again' : 'your note is kept · try again') });
        }
      } finally {
        pendingDecisionId = null;
        setPageButtonsDisabled(false);
      }
    };

    window.approveDecision = async (id) => {
      if (pendingDecisionId) return;
      await runDecision(id, 'approve');
    };

    window.submitReject = async (id) => {
      const reason = (rejectDrafts[id] || '').trim();
      if (!reason || pendingDecisionId) return;
      await runDecision(id, 'reject', reason);
    };

    window.toggleRejectComposer = (id, trigger) => {
      if (pendingDecisionId) return;
      rejectComposerId = rejectComposerId === id ? null : id;
      scheduleDecisionStatePersistence();
      render();
      window.requestAnimationFrame(() => {
        if (rejectComposerId === id) {
          const field = document.getElementById('reject-note-' + id);
          if (field) { field.focus(); return; }
        }
        const nextTrigger = document.querySelector(
          `[data-reject-id="${CSS.escape(id)}"]`
        );
        (nextTrigger || trigger)?.focus();
      });
    };

    window.syncRejectDraft = (id, textarea) => {
      rejectDrafts[id] = textarea.value;
      scheduleDecisionStatePersistence();
      const footer = document.querySelector(`ox-footer[data-decision-id="${CSS.escape(id)}"]`);
      const hasNote = Boolean(textarea.value.trim());
      if (footer && footer.hasAttribute('disabled') === hasNote) syncFooter(id);
    };

    window.selectDecision = (id) => {
      if (pendingDecisionId || !data || !Array.isArray(data.decisions)) return;
      const index = data.decisions.findIndex((d) => d.id === id);
      if (index < 0) return;
      pageDirection = index + 1 >= currentPage ? 'forward' : 'backward';
      currentPage = index + 1;
      scheduleDecisionStatePersistence();
      render();
      window.requestAnimationFrame(() => {
        const heading = document.querySelector('.dq-q a');
        if (heading) heading.focus({ preventScroll: false });
      });
    };

    window.changePage = (delta) => {
      const totalPages = Math.max(1, Math.ceil((data?.decisions?.length || 0) / itemsPerPage));
      const nextPage = Math.min(totalPages, Math.max(1, currentPage + delta));
      if (nextPage === currentPage) return;
      pageDirection = delta > 0 ? 'forward' : 'backward';
      currentPage = nextPage;
      scheduleDecisionStatePersistence();
      render();
    };

    // Footer events bubble out of the kit's shadow root.
    document.addEventListener('ox-primary', (event) => {
      const footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-decision-id]') : null;
      if (!footer) return;
      const id = footer.getAttribute('data-decision-id');
      const d = getDecisionById(id);
      const st = actionStates[id];
      if (!d) return;
      if (!st) {
        if (rejectComposerId === id) void window.submitReject(id);
        else void window.approveDecision(id);
        return;
      }
      if (st.phase === 'failed') {
        delete actionStates[id];
        if (st.action === 'reject') void window.submitReject(id);
        else void window.approveDecision(id);
        return;
      }
      if (st.phase === 'unsettled') {
        openExternal(buildDecisionSurfaceUrl(d));
        // Handing off does not change state here; clear the kit's press lock so it can open again.
        const detail = footer.getAttribute('detail') || '';
        footer.setAttribute('state', footer.getAttribute('state') || '');
        footer.setAttribute('detail', detail + ' ');
        footer.setAttribute('detail', detail);
      }
    });

    document.addEventListener('ox-action', (event) => {
      const footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-decision-id]') : null;
      if (!footer) return;
      const id = footer.getAttribute('data-decision-id');
      const d = getDecisionById(id);
      const st = actionStates[id];
      if (!d || !st) return;
      if (st.phase === 'done') openExternal(buildDecisionSurfaceUrl(d));
      if (st.phase === 'waiting') void watchDecision(id, st.action);
    });

    document.addEventListener('ox-open', (event) => {
      const href = event.detail && event.detail.href;
      if (!href) return;
      if (window.openWidgetLink) openWidgetLink(href, event);
    });

    document.addEventListener('ox-action', (event) => {
      const footer = event.target && event.target.closest ? event.target.closest('ox-footer[data-queue-retry]') : null;
      if (footer) location.reload();
    });

    /* ---------------------------------------------------------------- render -- */
    var linkAttrs = (url) => `href="${escapeHtml(url)}" target="_blank" rel="noreferrer" onclick='return openWidgetLink(${JSON.stringify(String(url || ''))}, event)'`;

    var attentionHtml = (pendingCount, oldest, label, tone) => {
      const decisionsUrl = buildDecisionsUrl();
      return `<div class="dq-head">
        <ox-attention-line id="dqAttention" tone="${tone || (pendingCount ? 'needs-you' : 'calm')}" count="${tone && !pendingCount ? 1 : pendingCount}"${oldest ? ` oldest="${escapeHtml(oldest)}"` : ''}>${
          label ? `<span>${escapeHtml(label)}</span>` : ''}${
          syncedAt ? `<span slot="meta">synced ${clock(syncedAt)}</span>` : ''}<a slot="action" id="queueDecisionsLink" class="dq-head-link" ${linkAttrs(decisionsUrl)} aria-label="View all decisions in OrgX"><span class="long">All in </span>OrgX ${icons.ext(12)}</a></ox-attention-line>
      </div>`;
    };

    var decisionBodyHtml = (d) => {
      const decisionUrl = buildDecisionSurfaceUrl(d);
      const owner = getDecisionOwner(d);
      // The note stays on screen while it is sending or after a failure; it clears once OrgX has it.
      const isRejecting = rejectComposerId === d.id;
      const noteLocked = Boolean(actionStates[d.id]);
      const rejectValue = rejectDrafts[d.id] || '';
      const canDecideHere = isOgDecisionEmbed || Boolean(getApprovalToken(d.id));
      const evidence = d.evidence_items || [];
      const shownEvidence = evidence.slice(0, 2);
      const hasCons = Boolean(d.if_approved || d.if_rejected);
      const recLine = d.recommendation
        ? `<div>
            <div class="dq-rec">${renderAvatar(owner.isSystem ? 'OrgX System' : owner.label, 22, owner.isSystem)}<span>${escapeHtml(owner.name)} recommends</span>${owner.role ? `<span class="role">· ${escapeHtml(owner.role)} agent</span>` : ''}</div>
            <div class="dq-why">${escapeHtml(d.recommendation)}</div>
          </div>`
        : '';
      const evidenceHtml = shownEvidence.length
        ? `<div class="dq-evidence" role="list">
            ${shownEvidence.map((item) => `<ox-receipt-row status="${escapeHtml(item.status)}" label="${escapeHtml(item.label)}"${item.at ? ` value="${escapeHtml(timeAgo(item.at))}"` : ''}${item.url ? ` href="${escapeHtml(item.url)}"` : ''}>${escapeHtml(item.label)}</ox-receipt-row>`).join('')}
            ${isOgDecisionEmbed ? '' : `<a class="dq-all" ${linkAttrs(decisionUrl)}>All ${evidence.length} evidence item${evidence.length === 1 ? '' : 's'} in OrgX ${icons.ext(12)}</a>`}
          </div>`
        : '';
      const consHtml = hasCons
        ? `<div class="dq-cons">
            ${d.if_approved ? `<div><div class="k">If approved</div><div class="v">${escapeHtml(d.if_approved)}</div></div>` : ''}
            ${d.if_rejected ? `<div><div class="k">If rejected</div><div class="v">${escapeHtml(d.if_rejected)}</div></div>` : ''}
          </div>`
        : d.impact
        ? `<div class="dq-cons is-single"><div><div class="k">If it waits</div><div class="v">${escapeHtml(d.impact)}</div></div></div>`
        : '';
      const detailsHtml = isOgDecisionEmbed ? '' : `
        <details class="decision-evidence">
          <summary>Evidence and consequence</summary>
          <div class="decision-evidence__body">
            ${d.context ? `<div class="decision-evidence__item"><div class="k">Why it matters</div><div class="decision-evidence__copy">${escapeHtml(d.context)}</div></div>` : ''}
            ${hasCons && formatDecisionField(d.impact_if_ignored || d.risk_if_ignored) ? `<div class="decision-evidence__item"><div class="k">If ignored</div><div class="decision-evidence__copy">${escapeHtml(formatDecisionField(d.impact_if_ignored || d.risk_if_ignored))}</div></div>` : ''}
            ${d.tradeoffs && d.tradeoffs.length ? `<div class="decision-tradeoffs">${d.tradeoffs.map(t => `<div class="decision-tradeoff"><strong>${escapeHtml(t.option)}</strong>${escapeHtml(t.detail)}</div>`).join('')}</div>` : ''}
            <div class="params-well">
              ${d.packet_id ? `<span class="param-chip" title="${escapeHtml(d.packet_id)}">From review packet <strong>${escapeHtml(d.packet_id.slice(-18))}</strong></span>` : ''}
              <span class="param-chip">Type <strong>${escapeHtml(d.type)}</strong></span>
              <span class="param-chip">Raised <strong>${escapeHtml(timeAgo(d.created_at) || '—')}</strong></span>
              ${d.provider && d.model ? `<span class="param-chip">Model <strong>${escapeHtml(d.provider + '/' + d.model)}</strong></span>` : ''}
              ${d.duplicate_count ? `<span class="param-chip">Collapsed <strong>${escapeHtml(String(d.duplicate_count))} duplicate${d.duplicate_count === 1 ? '' : 's'}</strong></span>` : ''}
              ${d.expected_cost_usd !== undefined && formatUsd(d.expected_cost_usd) ? `<span class="param-chip">Cost <strong>${formatUsd(d.expected_cost_usd)}</strong></span>` : ''}
              ${d.required_trust_level ? `<span class="param-chip">Rule <strong>${escapeHtml(humanizeDecisionKey(d.required_trust_level))}</strong></span>` : ''}
            </div>
          </div>
        </details>`;
      const composerHtml = canDecideHere && isRejecting ? `
        <div class="reject-composer" id="reject-composer-${escapeHtml(d.id)}">
          <label for="reject-note-${escapeHtml(d.id)}">Note for ${escapeHtml(owner.name)} · required</label>
          <textarea
            id="reject-note-${escapeHtml(d.id)}"
            class="reject-textarea"
            placeholder="What changed, which constraint was missed, or which path you want instead."
            oninput="syncRejectDraft('${escapeHtml(d.id)}', this)"${noteLocked ? ' readonly' : ''}
          >${escapeHtml(rejectValue)}</textarea>
        </div>` : '';
      const handoffHtml = canDecideHere ? '' : `
        <a ${linkAttrs(decisionUrl)} class="decide-in-orgx decision-action-btn">
          <span class="ic">${icons.ext(16)}</span>
          <span>
            <span class="t">Decide in OrgX</span>
            <span class="d">${escapeHtml(decideInOrgxDetail(d))} Approve or reject in your signed-in session.</span>
          </span>
        </a>`;
      return `
        <div class="dq-body">
          <div>
            <div class="dq-status" data-status-for="${escapeHtml(d.id)}">${statusLineHtml(d)}</div>
            <h1 class="dq-q" style="margin-top:8px"><a ${linkAttrs(decisionUrl)} title="Open in OrgX">${escapeHtml(d.summary)}</a></h1>
          </div>
          ${recLine}
          ${evidenceHtml || (isOgDecisionEmbed ? '' : `<a class="dq-all decision-open-link" ${linkAttrs(decisionUrl)}>Open in OrgX ${icons.ext(12)}</a>`)}
          ${consHtml}
          ${detailsHtml}
          ${composerHtml}
          ${handoffHtml}
        </div>
        ${canDecideHere ? footerHtml(d) : ''}`;
    };

    var queueHtml = (current) => {
      if (isOgDecisionEmbed) return '';
      const others = pendingDecisions().filter((d) => d.id !== current.id);
      if (!others.length) return '';
      const shown = others.slice(0, 4);
      const rows = shown.map((d) => {
        const age = shortAge(d.created_at);
        return `<button type="button" class="dq-row page-btn" onclick="selectDecision('${escapeHtml(d.id)}')" aria-label="Open: ${escapeHtml(d.summary)}">
          <span class="dot" aria-hidden="true"></span>
          <span class="ttl">${escapeHtml(d.summary)}</span>
          <span class="meta">${age && age !== 'now' ? '<span class="long">Needs you · </span>' + age : 'Needs you'}</span>
          <span class="chev">${icons.chevron(14)}</span>
        </button>`;
      }).join('');
      const more = others.length - shown.length;
      return `<nav class="dq-queue" aria-label="Other decisions waiting on you">${rows}${more > 0 ? `<a class="dq-all dq-more" ${linkAttrs(buildDecisionsUrl())}>${more} more in OrgX ${icons.ext(12)}</a>` : ''}</nav>`;
    };

    var historyHtml = (current) => {
      if (isOgDecisionEmbed || !data || !Array.isArray(data.decisions)) return '';
      const settled = data.decisions.filter((d) => d.id !== current.id && isSettled(d));
      if (!settled.length) return '';
      return `<div class="dq-history" role="list" aria-label="Decided here">
        <div class="dq-history-label">Decided here</div>
        ${settled.map((d) => {
          const st = actionStates[d.id];
          const verb = st.phase === 'waiting' ? 'Recorded' : st.action === 'approve' ? 'Approved' : 'Sent back';
          return `<ox-receipt-row status="${st.phase === 'waiting' ? 'pending' : 'met'}" label="${escapeHtml(verb + ' · ' + d.summary)}" value="by you" href="${escapeHtml(buildDecisionSurfaceUrl(d))}">${escapeHtml(verb + ' · ' + d.summary)}</ox-receipt-row>`;
        }).join('')}
      </div>`;
    };

    var lastDecidedHtml = (current) => {
      if (!lastResolution || isOgDecisionEmbed || (current && isSettled(current))) return '';
      const decisionsUrl = buildDecisionsUrl();
      return `<a class="dq-last" ${linkAttrs(decisionsUrl)}><span>Last decided</span><span class="t2">${escapeHtml(lastResolution.summary)} · ${lastResolution.action === 'approved' ? 'approved' : 'sent back'} by you</span>${icons.ext(12)}</a>`;
    };

    var focusedFooterId = () => {
      const active = document.activeElement;
      return active && active.matches && active.matches('ox-footer[data-decision-id]') ? active.getAttribute('data-decision-id') : null;
    };
    var pendingFocusId = null;
    var lastRenderedId = null;
    var afterRender = () => {
      if (!pendingFocusId) return;
      const footer = document.querySelector(`ox-footer[data-decision-id="${CSS.escape(pendingFocusId)}"]`);
      pendingFocusId = null;
      if (footer && footer.shadowRoot) {
        const target = footer.shadowRoot.querySelector('button:not([hidden])');
        if (target) target.focus();
      }
    };

    var render = () => {
      if(isLoading) return;
      pendingFocusId = focusedFooterId();
      const agentStatusUrl = buildAgentStatusUrl();
      const decisionsUrl = buildDecisionsUrl();
      if (data && data.error) {
        var errorMessage = window.OrgXWidgetRuntime.getErrorMessage(data.error, 'The decision queue could not be refreshed.');
        injectHtml(`<div class="decision-shell animate-in"><div class="decision-card"><article class="ox-card" data-edge="red">
          <div class="dq-calm" role="alert">
            <div class="dq-calm-title">Decision queue unavailable</div>
            <div class="dq-calm-copy">${escapeHtml(errorMessage)}</div>
          </div>
          <ox-footer variant="reads" state="failed" data-queue-retry heading="Couldn’t refresh" detail="No approval or rejection was sent" action-label="Retry queue"></ox-footer>
        </article></div></div>`);
        return;
      }
      data = normalizeDecisionQueue(data);
      const all = data && Array.isArray(data.decisions) ? data.decisions : [];
      const pending = pendingDecisions();

      if (!all.length) {
        var calmCopy = (function emptyQueueCopy() {
          /* The card renders the tool payload; the panel above renders the
             live feed. Both read the same queue, but the payload is a
             snapshot from when the tool ran — a decision raised seconds
             later shows up live while this card still says the queue is
             clear. "All caught up" over a list of pending approvals is
             true of the payload and wrong on the screen, so defer to what
             the reader can already see. */
          var liveRows = window.OrgXLiveStore && window.OrgXLiveStore.liveRowCount
            ? window.OrgXLiveStore.liveRowCount()
            : 0;
          if (liveRows) {
            return { edge: 'amber', title: 'Newer than this snapshot', copy: `The live queue above has ${liveRows} item${liveRows === 1 ? '' : 's'} that arrived after this result was produced.`, line: 'Decisions arrived after this result', tone: 'needs-you' };
          }
          return { edge: 'teal', title: 'All caught up', copy: lastResolution
            ? `${lastResolution.summary} was ${lastResolution.action === 'approved' ? 'approved' : 'sent back'} by you. New decisions appear here when work needs you.`
            : 'New decisions appear here when work needs you.', line: '', tone: '' };
        })();
        injectHtml(`<div class="decision-shell animate-in"><div class="decision-card"><article class="ox-card" data-edge="${calmCopy.edge}">
          ${attentionHtml(0, '', calmCopy.line, calmCopy.tone)}
          <div class="dq-calm">
            <div class="dq-calm-title">${escapeHtml(calmCopy.title)}</div>
            <div class="dq-calm-copy">${escapeHtml(calmCopy.copy)}</div>
            <div class="dq-calm-links">
              <a class="dq-all" ${linkAttrs(decisionsUrl)}>View all decisions in OrgX ${icons.ext(12)}</a>
              <a class="dq-all" ${linkAttrs(agentStatusUrl)}>Open agent status ${icons.ext(12)}</a>
            </div>
          </div>
        </article></div></div>`);
        return;
      }

      const totalPages = Math.ceil(all.length / itemsPerPage);
      currentPage = Math.min(Math.max(1, currentPage), totalPages);
      const startIdx = (currentPage - 1) * itemsPerPage;
      const paginated = all.slice(startIdx, startIdx + itemsPerPage);
      const current = paginated[0];

      // Animate only when the card changes; reopening the composer re-renders in place.
      const activeDirection = lastRenderedId === current.id ? 'still' : pageDirection;
      lastRenderedId = current.id;
      pageDirection = 'forward';

      const cardsHtml = paginated.map((d) => `
        <div class="decision-card urgency-${escapeHtml(d.urgency)}">
          <article class="ox-card" data-card-for="${escapeHtml(d.id)}" data-edge="${edgeFor(d)}" aria-label="Decision: ${escapeHtml(d.summary)}">
            ${attentionHtml(pending.length, oldestAge(pending), '')}
            ${decisionBodyHtml(d)}
          </article>
        </div>`).join('');

      injectHtml(`<div class="decision-shell" data-page-direction="${activeDirection}">${cardsHtml}${queueHtml(current)}${historyHtml(current)}${historyHtml(current) ? '' : lastDecidedHtml(current)}</div>`);
    };

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || !rejectComposerId || pendingDecisionId) return;
      const decisionId = rejectComposerId;
      rejectComposerId = null;
      scheduleDecisionStatePersistence();
      render();
      window.requestAnimationFrame(() => {
        const trigger = document.querySelector(`[data-reject-id="${CSS.escape(decisionId)}"]`);
        if (trigger) trigger.focus();
      });
    });

    if(isDemo) applyBootPayload();
    else initWidget({
      live: { anchor: '#content', widget: 'decisions', emptyLabel: 'No decisions pending' },
      render: d => { applyBootPayload(function(){ if(d) data = d; }); }
    });
  </script>
</body>
</html>
