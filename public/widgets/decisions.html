      const formErrorHtml = errorHtml('form');
      const handoffHtml = canDecideHere ? '' : `
        <a ${linkAttrs(decisionUrl)} class="decide-in-orgx decision-action-btn">
          <span class="ic">${icons.ext(16)}</span>
          <span>
            <span class="t">${d.decide_in_orgx_reason === 'requester_cannot_approve' ? 'Open in OrgX' : 'Decide in OrgX'}</span>
            <span class="d">${escapeHtml(decideInOrgxDetail(d))}</span>
          </span>
        </a>`;
      return `
        <div class="dq-body">
          <div>
            <div class="dq-status" data-status-for="${escapeHtml(d.id)}">${statusLineHtml(d)}</div>
            <h1 class="dq-q${wholeHeadlines[d.id] ? ' is-whole' : ''}" style="margin-top:10px" data-headline-for="${escapeHtml(d.id)}"><a ${linkAttrs(decisionUrl)} title="Open in OrgX">${escapeHtml(d.headline || d.summary)}</a></h1>
            <button type="button" class="dq-q-more" data-action="whole-headline" data-decision-id="${escapeHtml(d.id)}" hidden>Show the whole request</button>
            ${parts.lede.length || parts.facts.length || parts.commands.length ? `<div class="dq-detail">${bodyHtml(parts)}</div>` : ''}
          </div>
          ${recLine}
          ${evidenceHtml}
          ${consHtml}
          ${evidenceHtml || isOgDecisionEmbed || !canDecideHere ? '' : `<a class="dq-all decision-open-link" ${linkAttrs(decisionUrl)}>Open in OrgX ${icons.ext(14)}</a>`}
          ${optionsHtml}
          ${answerHtml}
          ${approveNoteHtml}
          ${detailsHtml}
          ${composerHtml}
          ${formErrorHtml}
          ${handoffHtml}
        </div>
        ${canDecideHere ? footerHtml(d) : ''}`;
    };

    var queueHtml = (current) => {
      if (isOgDecisionEmbed) return '';
      const others = pendingDecisions().filter((d) => d.id !== current.id);
      const scopedMore = queueScope() ? queueScope().total - pendingDecisions().length : 0;
      if (!others.length && scopedMore <= 0) return '';
      const shown = others.slice(0, 4);
      const rows = shown.map((d) => {
        const age = shortAge(d.created_at);
        return `<button type="button" class="dq-row page-btn" onclick="selectDecision('${escapeHtml(d.id)}')" aria-label="Open: ${escapeHtml(d.headline || d.summary)}">
          <span class="dot" aria-hidden="true">${oxIcon('decision', 16)}</span>
          <span class="ttl">${escapeHtml(d.headline || d.summary)}</span>
          <span class="meta">${age && age !== 'now' ? age + '<span class="long"> waiting</span>' : 'New'}</span>
          <span class="chev">${icons.chevron(14)}</span>
        </button>`;
      }).join('');
      // Beyond this page: what the app says is pending in scope, not just what this result carried.
      const scoped = queueScope();
      const more = Math.max(others.length - shown.length, scoped ? scoped.total - pendingDecisions().length : 0);
      const where = scoped ? (scoped.level === 'initiative' ? ' in this initiative' : ' across the workspace') : '';
      return `<nav class="dq-queue" aria-label="Other decisions waiting on you">${rows}${more > 0 ? `<a class="dq-all dq-more" ${linkAttrs(buildDecisionsUrl())}>${more} more${escapeHtml(where)} in OrgX ${icons.ext(14)}</a>` : ''}</nav>`;
    };

    var historyHtml = (current) => {
      if (isOgDecisionEmbed || !data || !Array.isArray(data.decisions)) return '';
      const settled = data.decisions.filter((d) => d.id !== current.id && isSettled(d) && !(batchState && batchState.ids.includes(d.id)));
      if (!settled.length) return '';
      return `<div class="dq-history" role="list" aria-label="Decided here">
        <div class="dq-history-label">Decided here</div>
        ${settled.map((d) => {
          const st = actionStates[d.id];
          const verb = st.phase === 'waiting' ? 'Recorded' : st.phase === 'elsewhere' ? 'Settled in OrgX' : pastTense(d, st.action);
          const by = st.phase === 'elsewhere' ? 'not by you' : 'by you';
          const title = d.headline || d.summary;
          return `<ox-receipt-row status="${st.phase === 'waiting' ? 'pending' : 'met'}" label="${escapeHtml(verb + ' · ' + title)}" value="${by}" href="${escapeHtml(buildDecisionSurfaceUrl(d))}">${escapeHtml(verb + ' · ' + title)}</ox-receipt-row>`;
        }).join('')}
      </div>`;
    };

    var lastDecidedHtml = (current) => {
      if (!lastResolution || isOgDecisionEmbed || (current && isSettled(current))) return '';
      const decisionsUrl = buildDecisionsUrl();
      return `<a class="dq-last" ${linkAttrs(decisionsUrl)}><span>Last decided</span><span class="t2">${escapeHtml(lastResolution.summary)} · ${escapeHtml(lastResolution.verb || (lastResolution.action === 'approved' ? 'approved' : 'sent back'))} by you</span>${icons.ext(12)}</a>`;
    };

    var focusedFooterId = () => {
      const active = document.activeElement;
      return active && active.matches && active.matches('ox-footer[data-decision-id]') ? active.getAttribute('data-decision-id') : null;
    };
    var pendingFocusId = null;
    var lastRenderedId = null;
    // A headline that overflows its clamp by about a line shows whole; a longer one keeps the
    // clamp and offers "Show the whole request". Never a "…" plus an orphaned continuation.
    var fitHeadlines = () => {
      document.querySelectorAll('.dq-q[data-headline-for]').forEach((h) => {
        if (h.classList.contains('is-whole') || !h.clientHeight) return;
        const over = h.scrollHeight - h.clientHeight;
        const line = parseFloat(getComputedStyle(h).lineHeight) || 28;
        const more = h.parentElement.querySelector('.dq-q-more');
        if (over > 2 && over <= line * 1.25) h.classList.add('is-whole');
        if (more) more.hidden = !(over > line * 1.25);
      });
    };
    var fitTimer = 0;
    var scheduleFit = () => {
      if (fitTimer) window.cancelAnimationFrame(fitTimer);
      fitTimer = window.requestAnimationFrame(() => { fitTimer = 0; fitHeadlines(); });
    };
    window.addEventListener('resize', scheduleFit);
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(scheduleFit).observe(document.getElementById('content'));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);
    var afterRender = () => {
      scheduleFit();
      if (!pendingFocusId) return;
      const footer = document.querySelector(`ox-footer[data-decision-id="${CSS.escape(pendingFocusId)}"]`);
      pendingFocusId = null;
      if (footer && footer.shadowRoot) {
        const target = footer.shadowRoot.querySelector('button:not([hidden])');
        if (target) target.focus();
      }
    };

    var render = () => {
      if(isLoading) return;
      pendingFocusId = focusedFooterId();
      const agentStatusUrl = buildAgentStatusUrl();
      const decisionsUrl = buildDecisionsUrl();
      if (data && data.error) {
        var errorMessage = window.OrgXWidgetRuntime.getErrorMessage(data.error, 'The decision queue could not be refreshed.');
        injectHtml(`<div class="decision-shell animate-in"><div class="decision-card"><article class="ox-card ox-surface" data-edge="red">
          <div class="dq-calm" role="alert">
            <div class="dq-calm-title">Decision queue unavailable</div>
            <div class="dq-calm-copy">${escapeHtml(errorMessage)}</div>
          </div>
          <ox-footer variant="reads" state="failed" data-queue-retry heading="Couldn’t refresh" detail="No approval or rejection was sent" action-label="Retry queue"></ox-footer>
        </article></div></div>`);
        return;
      }
      const review = needsHumanReview(data);
      if (review) {
        injectHtml(`<div class="decision-shell animate-in"><div class="decision-card"><article class="ox-card ox-surface" data-edge="amber" data-needs-human>
          ${attentionHtml(0, '', 'A person decides this in OrgX', 'needs-you')}
          <div class="dq-calm" role="status">
            <div class="dq-calm-title">Decide in OrgX</div>
            <div class="dq-calm-copy">${escapeHtml(review.message)}</div>
            <div class="dq-calm-links">
              <a class="dq-all" data-needs-human-link ${linkAttrs(review.url)}>${review.action === 'reject' ? 'Send back in OrgX' : 'Open the decision in OrgX'} ${icons.ext(12)}</a>
            </div>
          </div>
        </article></div></div>`);
        return;
      }
      data = normalizeDecisionQueue(data);
      const all = data && Array.isArray(data.decisions) ? data.decisions : [];
      const pending = pendingDecisions();

      if (!all.length) {
        var calmCopy = (function emptyQueueCopy() {
          /* The card renders the tool payload; the panel above renders the
             live feed. Both read the same queue, but the payload is a
             snapshot from when the tool ran — a decision raised seconds
             later shows up live while this card still says the queue is
             clear. "All caught up" over a list of pending approvals is
             true of the payload and wrong on the screen, so defer to what
             the reader can already see. */
          var liveRows = window.OrgXLiveStore && window.OrgXLiveStore.liveRowCount
            ? window.OrgXLiveStore.liveRowCount()
            : 0;
          if (liveRows) {
            return { edge: 'amber', title: 'Newer than this snapshot', copy: `The live queue above has ${liveRows} item${liveRows === 1 ? '' : 's'} that arrived after this result was produced.`, line: 'Decisions arrived after this result', tone: 'needs-you' };
          }
          return { edge: 'teal', title: 'All caught up', copy: lastResolution
            ? `${lastResolution.summary} was ${lastResolution.verb || (lastResolution.action === 'approved' ? 'approved' : 'sent back')} by you. New decisions appear here when work needs you.`
            : 'New decisions appear here when work needs you.', line: '', tone: '' };
        })();
        injectHtml(`<div class="decision-shell animate-in"><div class="decision-card"><article class="ox-card ox-surface" data-edge="${calmCopy.edge}">
          ${attentionHtml(0, '', calmCopy.line, calmCopy.tone)}
          <div class="dq-calm">
            <div class="dq-calm-title">${escapeHtml(calmCopy.title)}</div>
            <div class="dq-calm-copy">${escapeHtml(calmCopy.copy)}</div>
            <div class="dq-calm-links">
              <a class="dq-all" ${linkAttrs(decisionsUrl)}>View all decisions in OrgX ${icons.ext(12)}</a>
              <a class="dq-all" ${linkAttrs(agentStatusUrl)}>Open agent status ${icons.ext(12)}</a>
            </div>
          </div>
        </article></div></div>`);
        return;
      }

      const totalPages = Math.ceil(all.length / itemsPerPage);
      currentPage = Math.min(Math.max(1, currentPage), totalPages);
      const startIdx = (currentPage - 1) * itemsPerPage;
      const paginated = all.slice(startIdx, startIdx + itemsPerPage);
      const current = paginated[0];

      // Animate only when the card changes; reopening the composer re-renders in place.
      const activeDirection = lastRenderedId === current.id ? 'still' : pageDirection;
      lastRenderedId = current.id;
      pageDirection = 'forward';

      const cardsHtml = paginated.map((d) => `
        <div class="decision-card urgency-${escapeHtml(d.urgency)}">
          <article class="ox-card ox-surface" data-card-for="${escapeHtml(d.id)}" data-edge="${edgeFor(d)}" aria-label="Decision: ${escapeHtml(d.headline || d.summary)}">
            ${attentionHtml(pending.length, oldestAge(pending), '')}
            ${decisionBodyHtml(d)}
          </article>
        </div>`).join('');

      injectHtml(`<div class="decision-shell" data-page-direction="${activeDirection}">${cardsHtml}${batchHtml()}${queueHtml(current)}${historyHtml(current)}${historyHtml(current) || batchState ? '' : lastDecidedHtml(current)}</div>`);
    };

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || !rejectComposerId || pendingDecisionId) return;
      const decisionId = rejectComposerId;
      rejectComposerId = null;
      scheduleDecisionStatePersistence();
      render();
      window.requestAnimationFrame(() => {
        const trigger = document.querySelector(`[data-reject-id="${CSS.escape(decisionId)}"]`);
        if (trigger) trigger.focus();
      });
    });

    if(isDemo) applyBootPayload();
    else initWidget({
      live: { anchor: '#content', widget: 'decisions', emptyLabel: 'No decisions pending' },
      render: d => { applyBootPayload(function(){ if(d) data = d; }); }
    });
  </script>
</body>
</html>
