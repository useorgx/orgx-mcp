<!DOCTYPE html>
<html lang="en" data-accent="lime">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending Decisions - OrgX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2302040a'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23FBBF24' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23FBBF24'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <script src="shared/kit/ox-elements-core.js"></script>
  <script src="shared/kit/ox-elements-footer.js"></script>
  <script src="shared/kit/ox-elements-avatar.js"></script>
  <script src="shared/agent-identity.js"></script>
  <script src="shared/orgx-icons.js"></script>
  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/interaction-kit.js"></script>
  <script src="shared/live-machine.js"></script>
  <script src="shared/live-store.js"></script>
  <script src="shared/live-panel.js"></script>
  <template id="structured-review-contract">
    <section class="review-step-panel" data-direction="neutral">
      <ol>
        <li class="review-step current" aria-current="step">
          <span class="review-step-index" aria-hidden="true">1</span>
          <span class="review-step-label">Review</span>
          <span class="review-step-tone active-approved">Approved</span>
          <span class="review-step-tone active-declined">Declined</span>
          <span class="review-step-tone active-pending">Pending</span>
        </li>
      </ol>
      <div class="review-progress-track" role="progressbar"></div>
      <p class="review-footer-copy"></p>
    </section>
  </template>
  <script>
    var demoDecisionDetails = {
      interaction: {
        kind: 'compound',
        steps: [{ type: 'config' }, { type: 'subrequests' }],
      },
    };
    var stepTransitionDirection = 'neutral';
    function resolveReviewConfigActionLabel() {
      return 'Configure';
    }
    function resolveReviewFooterSummary() {
      return '';
    }
  </script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      const embed = params.get('embed');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      if (embed) document.documentElement.setAttribute('data-embed', embed);
    })();
  </script>
  <style>
    /* Canvas: Main (needs you), Q3 (one card, one send), Q8 (after you act), F2 (calm).
       Surface, text and status colors come from the kit tokens and the widget theme;
       this sheet only lays the card out. */
    /* Primaries (Approve, Confirm, Retry, Decide in OrgX) are the kit's action lime.
       Amber is only "needs you": the attention line, the status line and the card edge. */
    :root { --ox-primary-rgb: 191, 255, 0; --dq-code: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    /* Meta reads in the sans scale; mono is kept for code and ids (--dq-code). */
    ox-receipt-row, ox-attention-line, ox-state-chip, ox-footer { --ox-mono: var(--ox-font); }
    .ox-icon { display: block; flex: none; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ox-font);
      background: var(--ox-bg);
      color: var(--ox-text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button { font: inherit; color: inherit; }
    a { color: inherit; }

    .container { max-width: 640px; margin: 0 auto; }

    .decision-shell { display: flex; flex-direction: column; gap: 12px; }

    @keyframes dqIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-in { animation: dqIn var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out) both; }
    .decision-shell[data-page-direction="forward"] .decision-card,
    .decision-shell[data-page-direction="backward"] .decision-card { animation: dqIn var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out) both; }
    .skeleton-wrapper { transition: opacity 200ms ease; }

    /* One card: attention line, the decision, the footer. */
    .ox-card {
      position: relative;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      overflow: hidden;
      --edge-rgb: var(--ox-edge-amber-rgb);
    }
    .ox-card::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), 0.75), transparent);
      transition: background var(--ox-dur-edge, 600ms) ease;
    }
    .ox-card[data-edge="teal"] { --edge-rgb: var(--ox-edge-teal-rgb); }
    .ox-card[data-edge="red"] { --edge-rgb: var(--ox-edge-red-rgb); }
    .ox-card[data-edge="mute"] { --edge-rgb: var(--ox-edge-mute-rgb); }

    .dq-head { border-bottom: 1px solid var(--ox-border); --ox-attention-padding: 0 8px 0 20px; }
    /* OrgX links read as controls: 44px, full-contrast label, a hairline edge. */
    .dq-head-link, .dq-all {
      display: inline-flex; align-items: center; gap: 6px; flex: none;
      min-height: 44px; padding: 0 14px; border-radius: 12px;
      border: 1px solid var(--ox-border-strong); background: var(--ox-surface-subtle, transparent);
      font-size: 13px; font-weight: 650; line-height: 1.2; color: var(--ox-text); text-decoration: none; white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease;
    }
    .dq-head-link { min-height: 36px; padding: 0 12px; position: relative; }
    .dq-head-link::after { content: ""; position: absolute; inset: -4px -2px; }
    .dq-head-link:hover, .dq-all:hover { background: var(--ox-hover); border-color: var(--ox-text-muted); }
    .dq-head-link svg, .dq-all svg { width: 14px; height: 14px; color: var(--ox-text-2); }
    .dq-head [slot="meta"] { font: 500 12px/1.3 var(--ox-font); font-variant-numeric: tabular-nums; }

    .dq-body { padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 18px; }

    .dq-status {
      display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 22px;
      font: 600 13px/1.3 var(--ox-font); color: var(--ox-text-muted);
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .dq-status .ctx { font-weight: 500; }
    .dq-status .need { display: inline-flex; align-items: center; gap: 6px; color: var(--ox-warning); }
    .dq-status .done { display: inline-flex; align-items: center; gap: 6px; color: var(--ox-teal); }
    .dq-status .ctx-wrap { display: contents; }
    .dq-status .ctx { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .dq-status .urg {
      margin-left: auto; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 650;
      color: var(--ox-text-2); background: var(--ox-hover, rgba(127, 127, 127, .1));
    }
    .dq-status .urg-critical { color: var(--ox-danger-text, var(--ox-danger)); background: rgba(var(--ox-edge-red-rgb, 244, 63, 94), .12); }

    /* The headline is the decision's title (or its first sentence), whole. A headline that
       would run past three lines is clamped by CSS (never cut mid-sentence in the text);
       "Show the whole request" lifts the clamp in place. */
    .dq-q {
      font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.022em; text-wrap: balance; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
    }
    .dq-q.is-whole { -webkit-line-clamp: unset; line-clamp: none; display: block; }
    .dq-q-more {
      display: inline-flex; align-items: center; gap: 4px; min-height: 36px; margin: 2px 0 -8px; padding: 0;
      border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 650; color: var(--ox-text-2);
    }
    .dq-q-more[hidden] { display: none; }
    .dq-q-more:hover { color: var(--ox-text); text-decoration: underline; text-underline-offset: 3px; }
    /* The body, structured: a short lede, labelled facts, commands set as code. */
    .dq-detail { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.5; color: var(--ox-text-2); overflow-wrap: anywhere; }
    .dq-lede { margin: 0; text-wrap: pretty; }
    .dq-facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 13.5px; }
    .dq-facts dt { color: var(--ox-text-muted); font-weight: 500; }
    .dq-facts dd { margin: 0; color: var(--ox-text-2); }
    .dq-cmd { display: flex; flex-direction: column; gap: 4px; }
    .dq-cmd .k { font-size: 12.5px; color: var(--ox-text-muted); }
    .dq-cmd pre code { padding: 0; background: none; font: inherit; }
    .dq-cmd pre {
      margin: 0; padding: 9px 12px; border-radius: 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere;
      background: var(--ox-well-bg, rgba(127, 127, 127, .08)); box-shadow: var(--ox-well-shadow, none);
      font: 500 12.5px/1.5 var(--dq-code); color: var(--ox-text);
    }
    .dq-detail code, .decision-evidence__copy code, .dq-why code { font: 500 0.92em/1 var(--dq-code); padding: 1px 5px; border-radius: 5px; background: var(--ox-hover, rgba(127, 127, 127, .1)); color: var(--ox-text); }
    .dq-detail a, .decision-evidence__copy a, .dq-why a { color: var(--ox-text); text-decoration: underline; text-decoration-color: var(--ox-border-strong); text-underline-offset: 3px; overflow-wrap: anywhere; }
    .dq-detail a:hover, .decision-evidence__copy a:hover, .dq-why a:hover { text-decoration-color: currentColor; }
    .dq-q a { color: inherit; text-decoration: none; }
    .dq-q a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }

    .dq-rec { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; min-width: 0; }
    .dq-rec .role { font-weight: 500; color: var(--ox-text-muted); }
    .dq-why { font-size: 14px; line-height: 1.5; color: var(--ox-text-2); margin-top: 6px; text-wrap: pretty; }
    .dq-rec.is-quiet { font-size: 13px; font-weight: 500; color: var(--ox-text-muted); }

    .agent-avatar { display: inline-flex; flex: none; line-height: 0; }
    /* OrgX's own items carry the OrgX mark, drawn inline so a host that blocks images never shows an empty circle. */

    .dq-evidence { display: flex; flex-direction: column; gap: 8px; }
    .dq-evidence > [role="list"] { display: flex; flex-direction: column; }
    .dq-all { align-self: flex-start; }

    .dq-cons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .dq-cons.is-single { grid-template-columns: minmax(0, 1fr); }
    .dq-cons .k { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ox-text-muted); margin-bottom: 3px; }
    .dq-cons .k .ox-icon { color: var(--ox-text-muted); }
    .dq-cons .k[data-tone="approve"] .ox-icon { color: var(--ox-teal); }
    .dq-cons .v { font-size: 13.5px; line-height: 1.45; color: var(--ox-text-2); }

    /* Context and details: a disclosure that opens in place (.ox-collapse: no measured
       height, nothing below it jumps; reduced motion switches instantly). */
    .decision-evidence { border-top: 1px solid var(--ox-border); }
    .decision-evidence__toggle {
      display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding: 0;
      border: 0; background: none; cursor: pointer; text-align: left;
      font-size: 13.5px; font-weight: 650; color: var(--ox-text-2); white-space: nowrap;
    }
    .decision-evidence__toggle .hint { flex: 1; font-weight: 500; color: var(--ox-text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .decision-evidence__toggle .ox-icon { margin-left: auto; color: var(--ox-text-muted); transition: transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .decision-evidence__toggle[aria-expanded="true"] .ox-icon { transform: rotate(180deg); }
    .decision-evidence__toggle:hover { color: var(--ox-text); }
    .decision-evidence__body { display: flex; flex-direction: column; gap: 14px; padding: 2px 0 8px; }
    .decision-evidence__item .k { font-size: 12.5px; font-weight: 600; color: var(--ox-text-muted); margin-bottom: 3px; }
    .decision-evidence__copy { font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); overflow-wrap: anywhere; }
    .decision-evidence__copy p { margin: 0; }
    .decision-evidence__copy p + p { margin-top: 4px; }
    .decision-tradeoffs { display: grid; gap: 8px; }
    .decision-tradeoff { font-size: 13px; line-height: 1.45; color: var(--ox-text-2); }
    .decision-tradeoff strong { display: block; color: var(--ox-text); font-weight: 600; }
    .params-well {
      display: flex; flex-wrap: wrap; gap: 4px 6px;
      font: 500 12.5px/1.5 var(--ox-font); color: var(--ox-text-muted); font-variant-numeric: tabular-nums;
    }
    .param-chip + .param-chip::before { content: "·"; margin-right: 6px; }
    .param-chip strong { font-weight: 600; color: var(--ox-text-2); overflow-wrap: anywhere; }
    .param-chip code { font: 500 12px/1.4 var(--dq-code); }

    /* Decide in OrgX: the fallback when this widget holds no approval token. */
    .decide-in-orgx {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px;
      padding: 14px 16px; border-radius: 14px; text-decoration: none;
      background: var(--ox-action); color: var(--ox-action-fg); border: 1px solid var(--ox-action-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: filter 160ms ease;
    }
    .decide-in-orgx:hover { filter: brightness(1.04); }
    .decide-in-orgx .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.12); flex: none; }
    .decide-in-orgx .ic svg { width: 16px; height: 16px; }
    .decide-in-orgx .t { display: block; font-size: 15px; font-weight: 700; }
    .decide-in-orgx .d { display: block; font-size: 12.5px; line-height: 1.35; opacity: 0.74; margin-top: 2px; }

    /* Options the server sent: one click records the choice; several are toggles plus Confirm. */
    .dq-options { display: flex; flex-direction: column; gap: 8px; }
    .dq-options-label { font-size: 12.5px; color: var(--ox-text-muted); }
    .dq-opt {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px;
      padding: 10px 14px; border-radius: 12px; text-align: left; cursor: pointer;
      border: 1px solid var(--ox-border-strong); background: var(--ox-panel); color: var(--ox-text);
      transition: background 160ms ease, border-color 160ms ease;
    }
    .dq-opt:hover:not(:disabled) { background: var(--ox-hover); border-color: var(--ox-primary); }
    .dq-opt:disabled { cursor: default; opacity: 0.6; }
    .dq-opt[data-at-max] { opacity: 0.55; }
    .dq-opt[aria-pressed="true"], .dq-opt[data-chosen] { border-color: var(--ox-primary); background: rgba(var(--ox-action-rgb), 0.1); opacity: 1; }
    .dq-opt-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .dq-opt-label { font-size: 14px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
    .dq-opt-desc { font-size: 12.5px; line-height: 1.4; color: var(--ox-text-muted); overflow-wrap: anywhere; }
    .dq-opt-tag { font-size: 12px; font-weight: 600; color: var(--ox-text-muted); white-space: nowrap; }
    .dq-opt-go { width: 14px; height: 14px; color: var(--ox-text-muted); flex: none; }
    .dq-opt-box {
      width: 18px; height: 18px; border-radius: 5px; flex: none; display: grid; place-items: center;
      border: 1.5px solid var(--ox-border-strong); color: transparent;
    }
    .dq-opt[aria-pressed="true"] .dq-opt-box { background: var(--ox-action); border-color: var(--ox-action-border); color: var(--ox-action-fg); }
    .dq-opt-box svg { width: 12px; height: 12px; }

    /* Send back: the note travels with the rejection. */
    .reject-composer { display: flex; flex-direction: column; gap: 8px; }
    .reject-composer label { font-size: 12.5px; color: var(--ox-text-muted); }
    .reject-textarea {
      width: 100%; min-height: 88px; resize: vertical; padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--ox-border-strong); background: var(--ox-well-bg); color: var(--ox-text);
      font: 14px/1.5 var(--ox-font);
    }
    .reject-textarea::placeholder { color: var(--ox-placeholder, var(--ox-text-muted)); }
    .reject-textarea:focus-visible { outline: 2px solid var(--ox-focus); outline-offset: 1px; }
    .reject-textarea.is-short { min-height: 56px; }
    .reject-textarea[aria-invalid="true"] { border-color: var(--ox-danger); }
    .reject-textarea[readonly] { opacity: 0.7; }
    .reject-composer .dq-options { margin-bottom: 4px; }

    /* Typed answers and reasons the server asks for; one inline line when a click was refused. */
    .dq-field { display: flex; flex-direction: column; gap: 8px; }
    .dq-field label { font-size: 12.5px; color: var(--ox-text-muted); }
    .dq-counter { font-size: 12px; line-height: 1.2; color: var(--ox-text-muted); align-self: flex-end; min-height: 0; font-variant-numeric: tabular-nums; }
    .dq-counter:empty { display: none; }
    .dq-field-error {
      margin: -4px 0 0; font-size: 12.5px; line-height: 1.4; font-weight: 600;
      color: var(--ox-danger-text, var(--ox-danger));
    }
    .dq-options .dq-field-error { margin-top: 2px; }

    /* Slotted footer text action (Reject / Cancel) styled like the kit's text action. */
    .dq-text-btn {
      position: relative; min-height: 44px; padding: 0 12px; border-radius: 9px;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      font-size: 12.5px; font-weight: 650; background: none; border: 1px solid transparent;
      color: var(--ox-text-2); cursor: pointer; transition: background 160ms ease;
    }
    .dq-text-btn::after { content: ""; position: absolute; inset: -4px -2px; }
    .dq-text-btn:hover { color: var(--ox-text); background: var(--ox-hover); }
    .dq-text-btn:disabled { opacity: 0.55; cursor: default; }
    .dq-text-btn:focus-visible, .dq-opt:focus-visible, .dq-row:focus-visible, .dq-head-link:focus-visible, .dq-all:focus-visible, .decide-in-orgx:focus-visible, .dq-q a:focus-visible, .decision-evidence__toggle:focus-visible, .dq-q-more:focus-visible, .dq-detail a:focus-visible {
      outline: 2px solid var(--ox-focus); outline-offset: 2px;
    }

    /* The rest of the queue: one quiet row each, opened in place. */
    .dq-queue { display: flex; flex-direction: column; }
    .dq-row {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px;
      padding: 10px 14px; border-radius: 12px; border: 1px solid transparent;
      background: transparent; text-align: left; cursor: pointer; color: var(--ox-text);
    }
    .dq-row:hover { background: var(--ox-hover); }
    .dq-row:disabled { cursor: default; opacity: 0.6; }
    .dq-row .dot { display: grid; place-items: center; width: 18px; color: var(--ox-warning); flex: none; }
    .dq-row .ttl { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dq-row .meta, .dq-meta { font-size: 12.5px; line-height: 1.3; color: var(--ox-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .dq-row .chev { width: 14px; height: 14px; color: var(--ox-text-muted); flex: none; }
    .dq-more { margin: 6px 0 0 14px; }

    /* Approve N ready: one quiet line, then one result row per item. */
    .dq-batch {
      display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-height: 56px;
      padding: 6px 6px 6px 16px; border-radius: 14px; border: 1px solid var(--ox-border);
      background: var(--ox-surface-subtle, rgba(127, 127, 127, .06));
    }
    .dq-batch-copy { flex: 1 1 0; min-width: 0; font-size: 13px; color: var(--ox-text-2); }
    .dq-batch-btn { color: var(--ox-text); border-color: var(--ox-border-strong); background: var(--ox-panel); }
    .dq-batch-btn:hover { border-color: var(--ox-text-muted); }
    .dq-batch.is-result { display: block; padding: 6px 14px 4px; border-style: solid; }
    .dq-batch-head { display: flex; align-items: center; gap: 8px; min-height: 44px; }
    .dq-batch-head .dq-batch-copy { font-weight: 600; color: var(--ox-text); }

    .dq-history { display: flex; flex-direction: column; padding: 0 2px; }
    .dq-history-label { font-size: 12.5px; color: var(--ox-text-muted); padding: 4px 12px 2px; }
    .dq-last {
      display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 14px;
      font-size: 12.5px; color: var(--ox-text-muted); text-decoration: none;
    }
    .dq-last .t2 { color: var(--ox-text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dq-last svg { width: 12px; height: 12px; margin-left: auto; flex: none; }
    .dq-last:hover .t2 { color: var(--ox-text); }

    /* Calm and error */
    .dq-calm { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 4px; }
    .dq-calm-title { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; }
    .dq-calm-copy { font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); }
    .dq-calm-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    /* Loading: the card's own footprint */
    .sk { display: block; border-radius: 6px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.12)); }
    .sk-head { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--ox-border); }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (max-width: 480px) {
      body { padding: 12px; }
