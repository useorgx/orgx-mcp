<!DOCTYPE html>
<html lang="en" data-accent="teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Results - OrgX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2302040a'/%3E%3Ccircle cx='28' cy='28' r='14' fill='none' stroke='%2300C9A7' stroke-width='6'/%3E%3Cpath d='M39 39l12 12' stroke='%2300C9A7' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <script src="shared/kit/ox-elements.js"></script>
  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      const embed = params.get('embed');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      if (embed) document.documentElement.setAttribute('data-embed', embed);
    })();
  </script>
  <style>
    /*
     * Search results — orgx_search (and decision history / recommendations,
     * which reuse this widget) as host rows with OrgX strings (canvas F5),
     * grouped by attention (S5-B): what needs your decision first, then the
     * rest of the work. Each row is a glyph for the kind of thing, its title,
     * and one line in OrgX words: "Decision · needs you · 2d".
     */
    :root { --ox-primary-rgb: 0, 201, 167; }

    body {
      margin: 0;
      padding: 10px;
      background: var(--ox-bg);
      color: var(--ox-text);
      font-family: var(--ox-font);
    }

    .container { max-width: 760px; margin: 0 auto; position: relative; }

    :root[data-embed="og-wide-search"] body { min-width: 700px; padding: 20px 18px; }
    :root[data-embed="og-wide-search"] .container { max-width: 700px; }

    .widget-shell-card { margin: 0; }

    .widget-shell-card .ox-card.sr {
      display: flex;
      flex-direction: column;
      margin: 0;
      border-radius: 16px;
    }

    .sr::after {
      left: 16px !important;
      right: 16px !important;
      opacity: 1 !important;
      background: linear-gradient(90deg, transparent, rgba(var(--sr-edge, var(--ox-edge-teal-rgb)), 0.75), transparent) !important;
    }

    .sr[data-edge='amber'] { --sr-edge: var(--ox-edge-amber-rgb); }
    .sr[data-edge='mute'] { --sr-edge: var(--ox-edge-mute-rgb); }
    .sr[data-edge='red'] { --sr-edge: var(--ox-edge-red-rgb); }

    .sr-hd {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 14px 18px 6px;
      font-size: 12.5px;
      color: var(--ox-text-muted);
    }

    .sr-hd ox-glyph { --ox-glyph-size: 16px; flex: none; }
    .sr-search-icon { width: 16px; height: 16px; flex: none; }
    .sr-tools { margin: 4px 18px 10px; font-size: 12.5px; color: var(--ox-text-muted); }
    .sr-tools summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
    .sr-tools p { line-height: 1.5; margin: 4px 0 10px; }
    .sr-filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .sr-filters label { display: grid; gap: 5px; min-width: 0; }
    .sr-filters input, .sr-filters select { width: 100%; box-sizing: border-box; min-width: 0; min-height: 40px; padding: 7px; border: 1px solid var(--ox-border-strong); border-radius: 8px; background: var(--ox-bg); color: var(--ox-text); font: inherit; }
    .sr-filter-actions { display: flex; gap: 8px; margin-top: 10px; }
    .sr-filter-actions button { min-height: 40px; }
    @media (max-width: 420px) { .sr-filters { grid-template-columns: 1fr; } }

    .sr-kind {
      flex: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sr-src {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sr-src b { color: var(--ox-text-2); font-weight: 600; }

    .sr-count {
      flex: none;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sr-bd {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      padding: 4px 8px 10px;
    }

    .sr-sub {
      margin: 0 10px 6px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ox-text-muted);
    }

    .sr-bd ox-attention-line { --ox-attention-padding: 0 10px; }

    .sr-lbl {
      margin: 0;
      padding: 10px 10px 4px;
      font-family: var(--ox-mono);
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ox-text-muted);
    }

    .result-list { display: flex; flex-direction: column; gap: 2px; }

    /* One row: glyph, title, one line of OrgX words. The row is the link. */
    .result-card {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      column-gap: 12px;
      align-items: start;
      min-height: 56px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: background var(--ox-dur-micro, 160ms), border-color var(--ox-dur-micro, 160ms);
    }

    /* The leading match reads as the selected row (S5-B): only the first row
       of the first group, never the head of every group. */
    .sr-bd .result-list:first-of-type > .result-card:first-child {
      background: var(--ox-hover);
      border-color: var(--ox-border-strong);
    }

    .result-card:hover,
    .result-card:focus-visible {
      background: var(--ox-hover);
      border-color: var(--ox-border-strong);
      outline: none;
    }

    .result-card:focus-visible { box-shadow: 0 0 0 2px var(--ox-focus); }

    .r-glyph {
      display: grid;
      place-items: center;
      height: 22px;
      --ox-glyph-size: 18px;
    }

    .r-copy {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .r-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--ox-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .r-meta {
      font: 500 11.5px/1.35 var(--ox-mono);
      color: var(--ox-text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .r-meta .need { color: var(--ox-warning); }

    .r-snippet {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ox-text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .r-reason {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ox-text-2);
    }

    .r-reason b { font-weight: 650; color: var(--ox-text); }

    .highlight { color: var(--ox-text); font-weight: 600; }

    .r-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ox-text-muted);
      white-space: nowrap;
    }

    .r-open svg { width: 12px; height: 12px; }

    .result-card:hover .r-open,
    .result-card:focus-visible .r-open { color: var(--ox-text); }

    /* Pages: a quiet row, never a second card. */
    .pagination {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 2px 10px 0;
    }

    .page-range {
      flex: 1;
      min-width: 0;
      font: 500 11.5px/1.3 var(--ox-mono);
      color: var(--ox-text-muted);
      font-variant-numeric: tabular-nums;
    }

    .page-btn {
      min-width: 44px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--ox-border);
      border-radius: 9px;
      background: transparent;
      color: var(--ox-text);
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .page-btn:hover:not(:disabled) { background: var(--ox-hover); border-color: var(--ox-border-strong); }
    .page-btn:disabled { opacity: 0.42; cursor: default; }

    /* In-widget footer action (no external arrow: it pages, it does not leave). */
    .sr-alert { margin-top: 6px; color: var(--ox-danger); }

    .sr-more {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: none;
      color: var(--ox-text-2);
      font: inherit;
      font-size: 12.5px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
    }

    .sr-more:hover { color: var(--ox-text); background: var(--ox-hover); }

    .sr ox-footer {
      --ox-primary-rgb: 251, 191, 36;
      --ox-primary: rgb(251, 191, 36);
    }

    /* Empty and unavailable: one sentence about the search, in the same card. */
    .sr-state {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 18px 18px;
    }

    .sr-state b {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.3;
      color: var(--ox-text);
    }

    .sr-state span {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--ox-text-muted);
    }

    .sr-sk {
      display: block;
      height: 12px;
      border-radius: 4px;
      background: var(--ox-skeleton);
    }

    .search-skeleton__row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      column-gap: 12px;
      align-items: start;
      min-height: 56px;
      padding: 10px;
    }

    .search-skeleton__row .col { display: grid; gap: 6px; }

    @media (max-width: 420px) {
      body { padding: 6px; }
      .sr-hd { padding: 12px 14px 4px; }
      .sr-bd { padding: 2px 4px 8px; }
      .sr::after { left: 14px !important; right: 14px !important; }
      .r-open span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .result-card { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
  <div class="container" id="content">
    <!-- Skeleton shown during loading: the arrived card's own frame. -->
    <div class="widget-shell-card skeleton-wrapper search-skeleton" aria-label="Searching organizational memory" aria-busy="true">
      <div class="ox-card sr" data-edge="mute">
        <div class="sr-hd"><span class="sr-kind">Search</span><span class="sr-sk" style="width:160px"></span></div>
        <div class="sr-bd">
          <div class="search-skeleton__row"><span class="sr-sk" style="height:18px"></span><span class="col"><span class="sr-sk" style="width:62%;height:14px"></span><span class="sr-sk" style="width:38%"></span></span></div>
          <div class="search-skeleton__row"><span class="sr-sk" style="height:18px"></span><span class="col"><span class="sr-sk" style="width:54%;height:14px"></span><span class="sr-sk" style="width:30%"></span></span></div>
          <div class="search-skeleton__row"><span class="sr-sk" style="height:18px"></span><span class="col"><span class="sr-sk" style="width:58%;height:14px"></span><span class="sr-sk" style="width:34%"></span></span></div>
        </div>
        <ox-footer variant="reads" state="loading"></ox-footer>
      </div>
    </div>
  </div>
  <script>
    var queryParams = new URLSearchParams(window.location.search);


    var injectHtml = (html) => {
      const content = document.getElementById('content');
      content.innerHTML = html;
    };


      var escapeHtml = (str) => { if (!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; };
      var renderSnippet = (snippet) => {
        var text = typeof snippet === 'string' ? snippet : '';
        if (!text) return '';
        var highlightOpenToken = '__ORGX_HIGHLIGHT_OPEN__';
        var highlightCloseToken = '__ORGX_HIGHLIGHT_CLOSE__';
        var prepared = text
          .replace(/<span class=["']highlight["']>/g, highlightOpenToken)
          .replace(/<\/span>/g, highlightCloseToken);
        return escapeHtml(prepared)
          .replace(new RegExp(highlightOpenToken, 'g'), '<span class="highlight">')
          .replace(new RegExp(highlightCloseToken, 'g'), '</span>');
      };
      var serializeJsString = (value) => JSON.stringify(String(value || ''));
      var titleCase = value => String(value || '').replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      var formatRelativeDate = (value) => {
        if (!value) return '';
        var date = new Date(value);
        if (isNaN(date.getTime())) return '';
        var diffMs = Date.now() - date.getTime();
        var diffMins = Math.floor(diffMs / 60000);
        var diffHours = Math.floor(diffMs / 3600000);
        var diffDays = Math.floor(diffMs / 86400000);
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return diffMins + 'm ago';
        if (diffHours < 24) return diffHours + 'h ago';
        if (diffDays < 7) return diffDays + 'd ago';
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };
      var coerceScore = (value) => {
        if (value === null || value === undefined || value === '') return null;
        var num = Number(value);
        if (!Number.isFinite(num)) return null;
        if (num > 1 && num <= 100) num = num / 100;
        if (num < 0) num = 0;
        if (num > 1) num = 1;
        return num;
      };
      var ORGX_BASE_URL = 'https://useorgx.com';
      var decodeEscapedText = (value) => {
        if (typeof value !== 'string' || !value) return '';
        return value
          .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
          .replace(/\\n/g, '\n')
          .replace(/\\r/g, '')
          .replace(/\\t/g, ' ')
          .replace(/\\"/g, '"')
          .replace(/\\'/g, "'")
          .replace(/\\\\/g, '\\');
      };
      var buildObjectiveUrl = (objectiveId, commandCenterId) => {
        if (!objectiveId) return ORGX_BASE_URL + '/settings/goals';
        var query = '?objective=' + encodeURIComponent(objectiveId);
        if (commandCenterId) query += '&center=' + encodeURIComponent(commandCenterId);
        return ORGX_BASE_URL + '/settings/goals' + query;
      };
      var buildEntityUrl = (item) => {
        var explicitCandidates = [
          item && item.url,
          item && item.live_url,
          item && item.action_url,
          item && item.start_url,
          item && item.link,
          item && item._link,
        ];
        var explicitUrl = explicitCandidates.find(function (candidate) {
          if (typeof candidate !== 'string') return false;
          var value = candidate.trim();
          return /^https?:\/\//i.test(value) && value !== '#';
        });
        if (explicitUrl) return explicitUrl;

        var type = item && typeof item.type === 'string'
          ? item.type.toLowerCase().replace(/-/g, '_')
          : '';
        var id = item && typeof item.id === 'string' ? item.id : '';
        var initiativeId = item && typeof item.initiative_id === 'string' ? item.initiative_id : '';
        if (!id) return ORGX_BASE_URL;

        if (type === 'initiative') return ORGX_BASE_URL + '/initiatives/' + encodeURIComponent(id);
        if (type === 'objective') return buildObjectiveUrl(id, item && typeof item.command_center_id === 'string' ? item.command_center_id : '');
        if (type === 'decision') {
          return initiativeId
            ? ORGX_BASE_URL + '/initiatives/' + encodeURIComponent(initiativeId) + '?focus=decisions&decision=' + encodeURIComponent(id)
            : ORGX_BASE_URL + '/decisions/' + encodeURIComponent(id);
        }
        if (type === 'artifact') return ORGX_BASE_URL + '/artifacts/' + encodeURIComponent(id);
        if (type === 'task') {
          return initiativeId
            ? ORGX_BASE_URL + '/live/' + encodeURIComponent(initiativeId) + '?task=' + encodeURIComponent(id)
            : ORGX_BASE_URL + '/live?view=mission-control&task=' + encodeURIComponent(id);
        }
        if (type === 'workstream') {
          return initiativeId
            ? ORGX_BASE_URL + '/live/' + encodeURIComponent(initiativeId) + '?workstream=' + encodeURIComponent(id)
            : ORGX_BASE_URL + '/live?view=mission-control&workstream=' + encodeURIComponent(id);
        }
        if (type === 'milestone') {
          return initiativeId
            ? ORGX_BASE_URL + '/live/' + encodeURIComponent(initiativeId) + '?milestone=' + encodeURIComponent(id)
            : ORGX_BASE_URL + '/live?view=mission-control&milestone=' + encodeURIComponent(id);
        }
        if (type === 'agent') return ORGX_BASE_URL + '/settings/agents?agent=' + encodeURIComponent(id);
        if (type === 'run' || type === 'agent_run') return ORGX_BASE_URL + '/agents/runs/' + encodeURIComponent(id);
        if (type === 'workspace' || type === 'command_center') return ORGX_BASE_URL + '/command?center=' + encodeURIComponent(id);
        return ORGX_BASE_URL;
      };
      var excerptText = (value) => decodeEscapedText(value)
        .replace(/^\s{0,3}#{1,6}\s+/gm, '')
        .replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g, '$1')
        .replace(/(\*\*|__|`)/g, '')
        .replace(/\s+/g, ' ').trim();
      var readableText = (value, item) => {
        var text = excerptText(value);
        var uuid = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}';
        text = text.replace(new RegExp('\\b(task|run|initiative|artifact|workstream|decision|milestone)\\s+' + uuid + '\\b', 'gi'), function(_, type) { return 'linked ' + type.toLowerCase(); });
        return text.replace(new RegExp('\\b' + uuid + '\\b', 'gi'), function(id) {
          return item && id.toLowerCase() === String(item.id || '').toLowerCase() && item.short_id ? item.short_id : 'linked record';
        });
      };
      var normalizeResult = (item, fallbackType) => {
        item = item || {};
        var type = item.type || item.entity_type || fallbackType || 'result';
        var snippet = [item.snippet, item.summary, item.description].find(value => typeof value === 'string' && value.trim()) || '';
        var related = [item.entity, item.record, item.data].find(value => value && typeof value === 'object' && !Array.isArray(value)) || {};
        var title = [
          item.title, item.name, item.label, item.display_name, item.displayName,
          item.entity_title, item.entityTitle, item.initiative_title,
          item.artifact_title, related.title, related.name, related.label
        ].find(value => typeof value === 'string' && value.trim() && !/^untitled$/i.test(value.trim()));
        var normalizedType = String(type).toLowerCase().replace(/-/g, '_');
        return {
          title: readableText(title || (normalizedType === 'initiative' ? 'Initiative title unavailable' : normalizedType === 'artifact' ? 'Artifact title unavailable' : normalizedType === 'decision' ? 'Decision title unavailable' : 'Result title unavailable'), item),
          type: decodeEscapedText(type),
          snippet: readableText(snippet, item),
          score: coerceScore(item.score ?? item.relevance_score ?? item.vector_score),
          url: buildEntityUrl({ ...item, type }),
          date: formatRelativeDate(item.updated_at || item.date || item.created_at),
          // Status and timestamp drive the OrgX strings ("Decision · needs you · 2d").
          status: typeof item.status === 'string' ? decodeEscapedText(item.status) : '',
          at: item.updated_at || item.created_at || item.date || null
        };
      };
      var normalizeDecisionHistoryItem = (item) => {
        return {
          title: item && typeof item.title === 'string' && item.title.trim()
            ? decodeEscapedText(item.title)
            : item && typeof item.summary === 'string' && item.summary.trim()
            ? decodeEscapedText(item.summary)
            : 'Historical decision',
          summary: item && typeof item.summary === 'string' && item.summary.trim()
            ? decodeEscapedText(item.summary)
            : item && typeof item.reason === 'string' && item.reason.trim()
            ? decodeEscapedText(item.reason)
            : item && typeof item.rationale === 'string' && item.rationale.trim()
            ? decodeEscapedText(item.rationale)
            : 'No decision summary was provided.',
          status: item && typeof item.status === 'string' && item.status.trim()
            ? decodeEscapedText(item.status)
            : item && typeof item.outcome === 'string' && item.outcome.trim()
            ? decodeEscapedText(item.outcome)
            : 'resolved',
          date: formatRelativeDate(item && (item.decided_at || item.created_at || item.updated_at)) || 'Previously',
          url: buildEntityUrl({
            type: 'decision',
            id: item && typeof item.id === 'string' ? item.id : '',
            initiative_id: item && typeof item.initiative_id === 'string' ? item.initiative_id : '',
            url: item && typeof item.url === 'string' ? item.url : ''
          })
        };
      };
      var sanitizeScopeLabel = (label) => {
        var value = typeof label === 'string' ? label.trim() : '';
        if (!value) return '';
        var normalized = value.toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
        if (
          normalized === 'workspace scope' ||
          normalized === 'initiative scope' ||
          normalized === 'entity scope' ||
          normalized === 'scope' ||
          normalized === 'workspace'
        ) {
          return '';
        }
        return value;
      };
      var normalizeRecommendation = (item, index) => {
        var metadata = item && typeof item.metadata === 'object' && !Array.isArray(item.metadata) ? item.metadata : {};
        var score = coerceScore(item && (item.score ?? item.confidence ?? item.priority_score));
        var entityType = item && typeof item.entityType === 'string'
          ? item.entityType
          : item && typeof item.type === 'string'
          ? item.type
          : 'recommendation';
        var summary = item && typeof item.summary === 'string' && item.summary.trim()
          ? decodeEscapedText(item.summary)
          : item && typeof item.message === 'string' && item.message.trim()
          ? decodeEscapedText(item.message)
          : 'Review this recommendation in OrgX.';
        var reason = item && typeof item.reason === 'string' && item.reason.trim()
          ? decodeEscapedText(item.reason)
          : item && typeof item.rationale === 'string' && item.rationale.trim()
          ? decodeEscapedText(item.rationale)
          : summary;
        var objectiveId = typeof metadata.objectiveId === 'string' ? metadata.objectiveId : item && typeof item.objective_id === 'string' ? item.objective_id : '';
        var commandCenterId = typeof metadata.commandCenterId === 'string' ? metadata.commandCenterId : item && typeof item.command_center_id === 'string' ? item.command_center_id : '';
        var url = objectiveId
          ? buildObjectiveUrl(objectiveId, commandCenterId)
          : buildEntityUrl({
              type: entityType,
              id:
                typeof item.id === 'string'
                  ? item.id
                  : typeof metadata.workstreamId === 'string'

        return;
      }

      var normalizedResults = Array.isArray(data.results) ? data.results.map(item => normalizeResult(item, data.type)) : [];
      if (!Array.isArray(data.results)) {
        injectHtml(unavailable('OrgX returned an incomplete search response. Retry the search.'));
        return;
      }
      window.OrgXWidgetRuntime.reportSearchWidgetEvent('rendered');
      if (!normalizedResults.length) {
        injectHtml(stateCard('Search', 'No results found', data.query ? 'OrgX could not find a strong match for “' + data.query + '”. Try a broader phrase or a different scope.' : 'Try adjusting your query or expanding your search scope.', 'mute',
          '<ox-footer variant="reads" state="caught-up" heading="No matches" detail="try a broader phrase"></ox-footer>'));
        return;
      }

      // S5-B: what needs your decision comes first, in its own group.
      var visibleResults = filterResults(normalizedResults);
      var waiting = visibleResults.filter(needsYou);
      var ordered = waiting.concat(visibleResults.filter((r) => !needsYou(r)));
      const totalPages = Math.max(1, Math.ceil(ordered.length / itemsPerPage));
      currentPage = Math.min(currentPage, totalPages);
      const startIdx = (currentPage - 1) * itemsPerPage;
      const paginatedResults = ordered.slice(startIdx, startIdx + itemsPerPage);
      var pageNeeds = paginatedResults.filter(needsYou);
      var pageWork = paginatedResults.filter((r) => !needsYou(r));
      var oldest = waiting.reduce((acc, r) => {
        var t = r.at ? new Date(r.at).getTime() : NaN;
        return isNaN(t) ? acc : (acc === null || t < acc ? t : acc);
      }, null);

      var resultRow = (r, index) => rowHtml(r, index, {
        need: needsYou(r),
        meta: metaLine([kindLabel(r.type), statusWords(r), ageOf(r.at), r.score !== null && r.score < 1 ? Math.round(r.score * 100) + '% match' : '']),
        snippet: r.snippet ? renderSnippet(r.snippet) : ''
      });

      var groupsHtml =
        (pageNeeds.length
          ? `<ox-attention-line tone="needs-you" count="${waiting.length}"${oldest !== null ? ` oldest="${escapeHtml(ageOf(oldest))}"` : ''}></ox-attention-line>
             <div class="result-list">${pageNeeds.map(resultRow).join('')}</div>`
          : '') +
        (pageWork.length
          ? `${pageNeeds.length ? '<p class="sr-lbl">Work</p>' : ''}<div class="result-list">${pageWork.map((r, i) => resultRow(r, i + pageNeeds.length)).join('')}</div>`
          : '');

      var hasMore = !!(data.pagination && data.pagination.has_more && data.next_call && data.next_call.tool === 'orgx_search');
      var footer = loadingMore
        ? '<ox-footer variant="reads" state="refreshing" heading="Loading more…" detail="your results stay"></ox-footer>'
        : loadMoreError
          ? `<ox-footer variant="reads" state="failed" heading="Couldn’t load more" detail="your results are kept" action-label="Load more results"></ox-footer>`
          : hasMore
            ? `<ox-footer variant="reads" state="fresh" heading="${normalizedResults.length} loaded" detail="more in OrgX"><button type="button" slot="action" class="sr-more" onclick="loadMoreResults()">Load more results</button></ox-footer>`
            : `<ox-footer variant="reads" state="fresh" heading="${normalizedResults.length} ${normalizedResults.length === 1 ? 'match' : 'matches'}" detail="from organizational memory" action-label=""></ox-footer>`;

      injectHtml(cardHtml({
        kind: 'Search',
        glyph: 'question',
        edge: waiting.length ? 'amber' : 'teal',
        source: data.query ? quoted(data.query) : '<b>Organizational memory</b>',
        count: visibleResults.length + ' of ' + normalizedResults.length + ' loaded',
        body: `${searchTools(normalizedResults)}<div class="sr-bd">
            ${visibleResults.length ? '' : '<p class="sr-sub" role="status">No loaded results match these filters. Clear the filters or load another page.</p>'}
            ${groupsHtml}
            ${loadMoreError ? `<p class="sr-sub sr-alert" role="alert">${escapeHtml(loadMoreError)}</p>` : ''}
            ${totalPages > 1 ? `
              <div class="pagination">
                <span class="page-range">Showing ${startIdx + 1}-${Math.min(startIdx + paginatedResults.length, ordered.length)} of ${ordered.length}${hasMore ? '+' : ''}</span>
                <button type="button" class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                <button type="button" class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
              </div>` : ''}
          </div>`,
        footer: footer
      }));
    };

    // Footer "Load more results" pages the same search on the server (next_call).
    document.addEventListener('ox-action', function () {
      window.loadMoreResults();
    });

    if(isDemo) applyBootPayload(data);
    else initWidget({
      bridge: 'mcp-apps-sdk',
      observeChatGPTGlobals: true,
      onFailure: function(failure) { applyBootPayload(failure); return true; },
      getData: function(result) {
        var payload = window.OrgXWidgetRuntime.extractSearchWidgetData(result);
        if (payload && (payload.error || payload.ok === false || Array.isArray(payload.results) ||
            Array.isArray(payload.decisions) || Array.isArray(payload.recommendations) || payload.next_action)) return payload;
        // Widget-only copy survives hosts that expose only the summary as
        // toolOutput. Never use it to replace an explicit failure.
        return window.OrgXWidgetRuntime.getToolResponseMetadata('orgx/searchPayload') || payload;
      },
      render: d => { applyBootPayload(d); }
    });
  </script>
</body>
</html>
