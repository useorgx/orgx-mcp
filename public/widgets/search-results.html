<!DOCTYPE html>
<html lang="en" data-accent="teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Results - OrgX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2302040a'/%3E%3Ccircle cx='28' cy='28' r='14' fill='none' stroke='%2300C9A7' stroke-width='6'/%3E%3Cpath d='M39 39l12 12' stroke='%2300C9A7' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <script src="shared/kit/ox-elements-core.js"></script>
  <script src="shared/kit/ox-elements-footer.js"></script>
  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/orgx-icons.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      const embed = params.get('embed');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      if (embed) document.documentElement.setAttribute('data-embed', embed);
    })();
  </script>
  <style>
    /*
     * Search results — orgx_search (and decision history / recommendations,
     * which reuse this widget) as host rows with OrgX strings (canvas F5),
     * grouped by attention (S5-B): what needs your decision first, then the
     * rest of the work. Each row is a glyph for the kind of thing, its title,
     * and one line in OrgX words: "Decision · needs you · 2d".
     */
    :root { --ox-primary-rgb: 0, 201, 167; }

    body {
      margin: 0;
      padding: 10px;
      background: var(--ox-bg);
      color: var(--ox-text);
      font-family: var(--ox-font);
    }

    .container { max-width: 760px; margin: 0 auto; position: relative; }

    :root[data-embed="og-wide-search"] body { min-width: 700px; padding: 20px 18px; }
    :root[data-embed="og-wide-search"] .container { max-width: 700px; }

    .widget-shell-card { margin: 0; }

    .widget-shell-card .ox-card.sr {
      display: flex;
      flex-direction: column;
      margin: 0;
      border-radius: 16px;
    }

    .sr::after {
      left: 16px !important;
      right: 16px !important;
      opacity: 1 !important;
      background: linear-gradient(90deg, transparent, rgba(var(--sr-edge, var(--ox-edge-teal-rgb)), 0.75), transparent) !important;
    }

    .sr[data-edge='amber'] { --sr-edge: var(--ox-edge-amber-rgb); }
    .sr[data-edge='mute'] { --sr-edge: var(--ox-edge-mute-rgb); }
    .sr[data-edge='red'] { --sr-edge: var(--ox-edge-red-rgb); }

    .sr-hd {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 14px 18px 6px;
      font-size: 12.5px;
      color: var(--ox-text-muted);
    }

    .sr-hd ox-glyph { --ox-glyph-size: 16px; flex: none; }
    .sr-search-icon { width: 16px; height: 16px; flex: none; }
    /* Filters: one control that reads as a control (a bordered chip with its
       count), a panel that opens in place, presets instead of bare native date
       pickers. Help is a small "?" in the header, never a peer of the results. */
    .sr-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; margin: 0 18px 2px; min-width: 0; }
    /* 44 px targets, 34 px pills: the button is the target, its .pill the look. */
    .sr-filter-toggle {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; background: none; cursor: pointer;
      font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ox-text-2);
    }
    .sr-filter-toggle .pill {
      display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
      border: 1px solid var(--ox-border-strong); border-radius: 999px;
      transition: border-color var(--ox-dur-micro, 160ms), background-color var(--ox-dur-micro, 160ms), color var(--ox-dur-micro, 160ms);
    }
    .sr-filter-toggle svg { width: 15px; height: 15px; flex: none; color: var(--ox-text-muted); }
    .sr-filter-toggle .chev { width: 13px; height: 13px; transition: transform 200ms var(--ox-ease-out, ease); }
    .sr-filter-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .sr-filter-toggle:hover { color: var(--ox-text); }
    .sr-filter-toggle:hover .pill { border-color: var(--ox-text-muted); }
    .sr-filter-toggle[aria-expanded="true"] .pill { background: var(--ox-hover); color: var(--ox-text); }
    .sr-filter-toggle:focus-visible { outline: none; }
    .sr-filter-toggle:focus-visible .pill { outline: 2px solid var(--ox-focus); outline-offset: 2px; }
    .sr-filter-count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--ox-text); color: var(--ox-bg); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sr-active { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; min-width: 0; font-size: 12.5px; color: var(--ox-text-muted); }
    .sr-active b { font-weight: 600; color: var(--ox-text-2); }
    .sr-filter-panel { margin: 0 18px; }
    .sr-filter-panel > form { display: grid; gap: 14px; padding: 4px 0 14px; border-bottom: 1px solid var(--ox-border); }
    .sr-field { display: grid; gap: 6px; min-width: 0; border: 0; margin: 0; padding: 0; }
    .sr-field-label { font-size: 12.5px; font-weight: 600; color: var(--ox-text-2); padding: 0; }
    .sr-field select, .sr-field input[type="datetime-local"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; box-sizing: border-box; min-width: 0; min-height: 44px; padding: 0 12px;
      border: 1px solid var(--ox-border-strong); border-radius: 10px;
      background-color: var(--ox-well-bg); color: var(--ox-text);
      font: 500 13px/1.2 var(--ox-font); color-scheme: inherit;
      transition: border-color var(--ox-dur-micro, 160ms);
    }
    .sr-field select {
      padding-right: 34px; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: right 16px center, right 11px center;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    }
    .sr-field input[type="datetime-local"]::-webkit-datetime-edit { padding: 0; }
    .sr-field input[type="datetime-local"]::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }
    .sr-field select:hover, .sr-field input:hover { border-color: var(--ox-text-muted); }
    /* Created: a row of preset chips (radio buttons), custom dates on demand. */
    .sr-presets { display: flex; flex-wrap: wrap; gap: 0 6px; margin: -5px 0; }
    .sr-preset { position: relative; display: inline-flex; align-items: center; min-height: 44px; }
    .sr-preset input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .sr-preset span {
      display: inline-flex; align-items: center; height: 34px; padding: 0 13px; border-radius: 999px;
      border: 1px solid var(--ox-border-strong); font-size: 12.5px; font-weight: 600; color: var(--ox-text-2);
      transition: background-color var(--ox-dur-micro, 160ms), color var(--ox-dur-micro, 160ms), border-color var(--ox-dur-micro, 160ms);
    }
    .sr-preset input:hover + span { border-color: var(--ox-text-muted); color: var(--ox-text); }
    .sr-preset input:checked + span { background: var(--ox-text); border-color: var(--ox-text); color: var(--ox-bg); }
    .sr-preset input:focus-visible + span { outline: 2px solid var(--ox-focus); outline-offset: 2px; }
    .sr-custom { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .sr-custom[hidden] { display: none; }
    .sr-filter-actions { display: flex; align-items: center; gap: 8px; }
    .sr-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px;
      border-radius: 12px; border: 1px solid var(--ox-border-strong); background: transparent; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 650; color: var(--ox-text);
    }
    .sr-btn svg { width: 15px; height: 15px; }
    .sr-btn:hover:not(:disabled) { background: var(--ox-hover); }
    .sr-btn.is-primary { background: var(--ox-action); border-color: var(--ox-action-border, var(--ox-action)); color: var(--ox-action-fg); }
    .sr-btn.is-primary:hover:not(:disabled) { background: var(--ox-action); filter: brightness(1.05); }
    .sr-btn.is-quiet { border-color: transparent; color: var(--ox-text-2); }
    .sr-btn:disabled { opacity: 0.5; cursor: default; }
    .sr-filter-panel [role="alert"] { margin: 0; font-size: 12.5px; color: var(--ox-danger); }
    @media (max-width: 420px) { .sr-custom { grid-template-columns: 1fr; } }

    /* Help: a "?" at the end of the header that opens a short note in place. */
    .sr-help-btn {
      flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: -12px -12px -12px 0;
      border: 0; border-radius: 10px; background: none; color: var(--ox-text-muted); cursor: pointer;
    }
    .sr-help-btn svg { width: 16px; height: 16px; }
    .sr-help-btn:hover, .sr-help-btn[aria-expanded="true"] { color: var(--ox-text); }
    .sr-help { margin: 0 18px; }
    .sr-help p { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--ox-well-bg); font-size: 12.5px; line-height: 1.5; color: var(--ox-text-2); }

    .sr-kind {
      flex: none;
      font-size: 13px;
      font-weight: 650;
      color: var(--ox-text);
    }

    .sr-src {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sr-src b { color: var(--ox-text-2); font-weight: 600; }

    .sr-count {
      flex: none;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sr-bd {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      padding: 4px 8px 12px;
    }

    .sr-sub {
      margin: 0 10px 6px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ox-text-muted);
    }

    .sr-bd ox-attention-line { --ox-attention-padding: 0 10px; }

    .sr-lbl {
      margin: 0;
      padding: 12px 10px 4px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ox-text-muted);
    }

    .result-list { display: flex; flex-direction: column; }
    .result-list > .result-card + .result-card { border-top-color: var(--ox-border); border-top-left-radius: 0; border-top-right-radius: 0; }

    /* One row: glyph, title, one line of OrgX words. The row is the link. */
    .result-card {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      column-gap: 12px;
      align-items: start;
      min-height: 56px;
      padding: 12px 10px;
      border: 0;
      border-top: 1px solid transparent;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: background var(--ox-dur-micro, 160ms), border-color var(--ox-dur-micro, 160ms);
    }

    /* Every row is drawn the same at rest. A permanently outlined first row,
       plus a hover that stuck on touch and a focus left on the last row
       opened, read as three different row styles. Hover only applies where a
       pointer can hover; keyboard focus uses the shared focus ring. */
    .result-card:focus:not(:focus-visible) { outline: none; }
    .result-card:focus-visible { background: var(--ox-hover); }

    @media (hover: hover) {
      .result-card:hover { background: var(--ox-hover); }
    }

    .r-glyph {
      display: grid;
      place-items: center;
      height: 22px;
      color: var(--ox-text-muted);
    }

    .r-glyph[data-tone="amber"] { color: var(--ox-warning); }

    .r-copy {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .r-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--ox-text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .r-meta {
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--ox-text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .r-meta .need { color: var(--ox-warning); font-weight: 600; }
    .r-meta .kind { color: var(--ox-text-2); font-weight: 600; }

    .r-snippet {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ox-text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .r-reason {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ox-text-2);
    }

    .r-reason b { font-weight: 650; color: var(--ox-text); }

    .highlight { color: var(--ox-text); font-weight: 600; }

    .r-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ox-text-muted);
      white-space: nowrap;
    }

    .r-open svg { width: 12px; height: 12px; }

    .result-card:focus-visible .r-open { color: var(--ox-text); }
    @media (hover: hover) { .result-card:hover .r-open { color: var(--ox-text); } }

    /* Pages: a quiet row, never a second card. */
    .pagination {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 2px 10px 0;
    }

    .page-range {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      line-height: 1.3;
      color: var(--ox-text-muted);
      font-variant-numeric: tabular-nums;
    }

    .page-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 10px;
      border: 1px solid var(--ox-border);
      border-radius: 9px;
      background: transparent;
      color: var(--ox-text);
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .page-btn:hover:not(:disabled) { background: var(--ox-hover); border-color: var(--ox-border-strong); }
    .page-btn:disabled { opacity: 0.42; cursor: default; }

    /* In-widget footer action (no external arrow: it pages, it does not leave). */
    .sr-alert { margin-top: 6px; color: var(--ox-danger); }

    .sr-more {
      min-height: 44px;
      margin: -4px 0;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: none;
      color: var(--ox-text-2);
      font: inherit;
      font-size: 12.5px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
    }

    .sr-more:hover { color: var(--ox-text); background: var(--ox-hover); }

    /* Empty and unavailable: what happened, in plain words, and what to do. */
    .sr-state {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      column-gap: 12px;
      row-gap: 4px;
      padding: 6px 20px 18px;
    }
    .sr-state > svg { grid-row: span 2; margin-top: 1px; color: var(--ox-text-muted); }
    .sr-state[role="alert"] > svg { color: var(--ox-danger); }
    .sr-state b { font-size: 15px; font-weight: 650; line-height: 1.3; color: var(--ox-text); }
    .sr-state span { font-size: 13px; line-height: 1.5; color: var(--ox-text-2); overflow-wrap: anywhere; }
    .sr-state .sr-reason { grid-column: 2; font-size: 12.5px; color: var(--ox-text-muted); }
    .sr-state .sr-state-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    .sr-sk {
      display: block;
      height: 12px;
      border-radius: 4px;
      background: var(--ox-skeleton);
    }

    .search-skeleton__row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      column-gap: 12px;
      align-items: start;
      min-height: 56px;
      padding: 10px;
    }

    .search-skeleton__row .col { display: grid; gap: 6px; }

    @media (max-width: 420px) {
      body { padding: 6px; }
      .sr-hd { padding: 12px 14px 4px; }
      .sr-bd { padding: 2px 4px 8px; }
      .sr::after { left: 14px !important; right: 14px !important; }
      .r-open span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .result-card { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
  <div class="container" id="content">
    <!-- Skeleton shown during loading: the arrived card's own frame. -->
    <div class="widget-shell-card skeleton-wrapper search-skeleton" aria-label="Searching organizational memory" aria-busy="true">
      <div class="ox-card sr ox-surface" data-edge="mute">
        <div class="sr-hd"><svg class="sr-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><span class="sr-kind">Search</span><span class="sr-sk" style="width:160px"></span></div>
        <div class="sr-toolbar"><span class="sr-sk" style="width:142px;height:44px;border-radius:999px"></span></div>
        <div class="sr-bd">
          <div class="search-skeleton__row"><span class="sr-sk" style="height:18px"></span><span class="col"><span class="sr-sk" style="width:62%;height:14px"></span><span class="sr-sk" style="width:38%"></span></span></div>
          <div class="search-skeleton__row"><span class="sr-sk" style="height:18px"></span><span class="col"><span class="sr-sk" style="width:54%;height:14px"></span><span class="sr-sk" style="width:30%"></span></span></div>
          <div class="search-skeleton__row"><span class="sr-sk" style="height:18px"></span><span class="col"><span class="sr-sk" style="width:58%;height:14px"></span><span class="sr-sk" style="width:34%"></span></span></div>
        </div>
        <ox-footer variant="reads" state="loading"></ox-footer>
      </div>
    </div>
  </div>
  <script>
    var queryParams = new URLSearchParams(window.location.search);


    var injectHtml = (html) => {
      const content = document.getElementById('content');
      content.innerHTML = html;
    };


      var escapeHtml = (str) => { if (!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; };
      var renderSnippet = (snippet) => {
        var text = typeof snippet === 'string' ? snippet : '';
        if (!text) return '';
        var highlightOpenToken = '__ORGX_HIGHLIGHT_OPEN__';
        var highlightCloseToken = '__ORGX_HIGHLIGHT_CLOSE__';
        var prepared = text
          .replace(/<span class=["']highlight["']>/g, highlightOpenToken)
          .replace(/<\/span>/g, highlightCloseToken);
        return escapeHtml(prepared)
          .replace(new RegExp(highlightOpenToken, 'g'), '<span class="highlight">')
          .replace(new RegExp(highlightCloseToken, 'g'), '</span>');
      };
      var serializeJsString = (value) => JSON.stringify(String(value || ''));
      var titleCase = value => String(value || '').replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      var formatRelativeDate = (value) => window.OrgXTime.relative(value);
      var coerceScore = (value) => {
        if (value === null || value === undefined || value === '') return null;
        var num = Number(value);
        if (!Number.isFinite(num)) return null;
        if (num > 1 && num <= 100) num = num / 100;
        if (num < 0) num = 0;
        if (num > 1) num = 1;
        return num;
      };
      var decodeEscapedText = (value) => {
        if (typeof value !== 'string' || !value) return '';
        return value
          .replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)))
          .replace(/\\n/g, '\n')
          .replace(/\\r/g, '')
          .replace(/\\t/g, ' ')
          .replace(/\\"/g, '"')
          .replace(/\\'/g, "'")
          .replace(/\\\\/g, '\\');
      };
      /* Every OrgX URL comes from the shared link builder (OrgXLinks), which
         only produces routes the app has; payload URLs are normalized. */
      var buildEntityUrl = (item) => {
        var links = window.OrgXLinks;
        var explicitCandidates = [
          item && item.url,
          item && item.live_url,
          item && item.action_url,
          item && item.start_url,
          item && item.link,
          item && item._link,
        ];
        for (var i = 0; i < explicitCandidates.length; i += 1) {
          var explicitUrl = typeof explicitCandidates[i] === 'string' ? links.normalize(explicitCandidates[i]) : '';
          if (explicitUrl) return explicitUrl;
        }
        var id = item && typeof item.id === 'string' ? item.id : '';
        if (!id) return links.command();
        return links.entity(item && item.type, id, {
          initiativeId: item && typeof item.initiative_id === 'string' ? item.initiative_id : '',
          center: item && typeof item.command_center_id === 'string' ? item.command_center_id : '',
        });
      };
      var excerptText = (value) => decodeEscapedText(value)
        .replace(/^\s{0,3}#{1,6}\s+/gm, '')
        .replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g, '$1')
        .replace(/(\*\*|__|`)/g, '')
        .replace(/\s+/g, ' ').trim();
      var readableText = (value, item) => {
        var text = excerptText(value);
        var uuid = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}';
        text = text.replace(new RegExp('\\b(task|run|initiative|artifact|workstream|decision|milestone)\\s+' + uuid + '\\b', 'gi'), function(_, type) { return 'linked ' + type.toLowerCase(); });
        return text.replace(new RegExp('\\b' + uuid + '\\b', 'gi'), function(id) {
          return item && id.toLowerCase() === String(item.id || '').toLowerCase() && item.short_id ? item.short_id : 'linked record';
        });
      };
      var normalizeResult = (item, fallbackType) => {
        item = item || {};
        var type = item.type || item.entity_type || fallbackType || 'result';

      var active = [filters.type ? '<b>' + escapeHtml(kindLabel(filters.type)) + '</b>' : '', range !== 'any' && range !== 'custom' ? '<b>' + escapeHtml(rangeLabel(range)) + '</b>' : range === 'custom' ? '<b>Custom dates</b>' : ''].filter(Boolean).join(' · ');
      return `<div class="sr-toolbar">
          <button type="button" class="sr-filter-toggle" aria-expanded="${filterOpen}" aria-controls="sr-filter-panel" onclick="toggleDisclosure(this, 'filters')"><span class="pill">${FILTER_ICON}<span>Search filters</span>${activeCount ? `<span class="sr-filter-count" aria-label="${activeCount} on">${activeCount}</span>` : ''}${CHEVRON}</span></button>
          ${active ? `<span class="sr-active">${active}</span>` : ''}
        </div>
        <div class="sr-filter-panel" id="sr-filter-panel"${filterOpen ? '' : ' hidden'}>
        <form onsubmit="applySearchFilters(event)">
          <label class="sr-field"><span class="sr-field-label">Type</span><select name="type" aria-label="Type"><option value="">All types</option>${types.map(type => `<option value="${escapeHtml(type)}" ${filters.type === type ? 'selected' : ''}>${escapeHtml(kindLabel(type))}</option>`).join('')}</select></label>
          <fieldset class="sr-field"><legend class="sr-field-label">Created</legend>
            <div class="sr-presets">${RANGE_PRESETS.map(p => `<label class="sr-preset"><input type="radio" name="range" value="${p.value}" ${range === p.value ? 'checked' : ''} onchange="pickRange(this)"><span>${p.label}</span></label>`).join('')}</div>
            <div class="sr-custom"${range === 'custom' ? '' : ' hidden'}>
              <label class="sr-field"><span class="sr-field-label">Created from</span><input name="from" aria-label="Created from" type="datetime-local" value="${escapeHtml(range === 'custom' ? filters.from : '')}"></label>
              <label class="sr-field"><span class="sr-field-label">Created to</span><input name="to" aria-label="Created to" type="datetime-local" value="${escapeHtml(range === 'custom' ? filters.to : '')}"></label>
            </div>
          </fieldset>
          <div class="sr-filter-actions"><button class="sr-btn is-primary" type="submit" ${retrying ? 'disabled' : ''}>${retrying ? 'Searching…' : 'Apply filters'}</button><button class="sr-btn is-quiet" type="button" onclick="clearSearchFilters()" ${retrying ? 'disabled' : ''}>Clear</button></div>
          ${filterError ? `<p role="alert">${escapeHtml(filterError)}</p>` : ''}
        </form></div>`;
    };
    window.loadMoreResults = async () => {
      if (loadingMore || !data || !data.next_call || data.next_call.tool !== 'orgx_search') return;
      const previous = data;
      loadingMore = true;
      loadMoreError = '';
      render();
      try {
        const response = await callTool('orgx_search', previous.next_call.args || {});
        const next = window.OrgXWidgetRuntime.extractSearchWidgetData(response);
        if (!next || next.error || response.isError || !Array.isArray(next.results)) throw new Error('Search did not return a result page.');
        if (data !== previous) return;
        data = { ...previous, ...next, results: previous.results.concat(next.results) };
        currentPage = Math.floor(previous.results.length / itemsPerPage) + 1;
      } catch (_) {
        window.OrgXWidgetRuntime.reportSearchWidgetEvent('page_error');
        loadMoreError = 'More results could not be loaded. Your current results are preserved. Try again.';
      } finally {
        loadingMore = false;
        render();
      }
    };

    window.changePage = (delta) => {
      const totalPages = Math.max(1, Math.ceil(((data && data.results) || []).length / itemsPerPage));
      const nextPage = Math.min(totalPages, Math.max(1, currentPage + delta));
      if (nextPage === currentPage) return;
      currentPage = nextPage;
      render();
    };


    // ── Rows in OrgX words ─────────────────────────────────────────────────

    var EXT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

    var GLYPH_KINDS = ['goal', 'initiative', 'workstream', 'milestone', 'task', 'run', 'decision', 'question', 'artifact', 'receipt'];
    var glyphKind = (type) => {
      var t = String(type || '').toLowerCase().replace(/-/g, '_');
      if (t === 'objective' || t === 'goal') return 'goal';
      if (t === 'agent_run' || t === 'run') return 'run';
      if (t === 'document' || t === 'artifact' || t === 'pull_request') return 'artifact';
      if (t === 'recommendation') return 'task';
      return GLYPH_KINDS.indexOf(t) === -1 ? 'artifact' : t;
    };

    var kindLabel = (type) => {
      var t = String(type || '').toLowerCase().replace(/-/g, '_');
      if (t === 'document') return 'Artifact';
      if (t === 'objective') return 'Goal';
      return titleCase(t || 'result');
    };

    // Compact age, the canvas way: "now", "6m", "5h", "2d", then a date.
    var ageOf = (value) => {
      if (!value) return '';
      var date = new Date(value);
      if (isNaN(date.getTime())) return '';
      var mins = Math.floor((Date.now() - date.getTime()) / 60000);
      if (mins < 1) return 'now';
      if (mins < 60) return mins + 'm';
      if (mins < 60 * 24) return Math.floor(mins / 60) + 'h';
      if (mins < 60 * 24 * 7) return Math.floor(mins / 1440) + 'd';
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    };

    var NEEDS_YOU_STATUSES = ['pending', 'open', 'proposed', 'needs_you', 'needs_input', 'awaiting_approval', 'pending_approval'];
    // Only a decision that still waits on a person needs you; nothing is guessed.
    var needsYou = (r) => String(r.type).toLowerCase() === 'decision' &&
      NEEDS_YOU_STATUSES.indexOf(String(r.status || '').toLowerCase()) !== -1;

    // The status in the words the person uses: "accepted", "in progress".
    var statusWords = (r) => {
      var s = String(r.status || '').toLowerCase();
      if (!s) return '';
      if (needsYou(r)) return 'needs you';
      if (s === 'approved' || s === 'accepted') return 'accepted';
      if (s === 'completed' || s === 'complete' || s === 'done') return 'completed';
      return s.replace(/_/g, ' ');
    };

    var metaLine = (parts) => parts.filter(Boolean).map((part) =>
      part === 'needs you' ? '<span class="need">needs you</span>' : escapeHtml(part)
    ).join(' · ');

    var rowHtml = (r, index, options) => {
      var need = options && options.need;
      return `
        <a href="${escapeHtml(r.url)}" target="_blank" rel="noreferrer" onclick='return openWidgetLink(${serializeJsString(r.url)}, event)' class="result-card" style="--i:${index}">
          <span class="r-glyph"${need ? ' data-tone="amber"' : ''}>${window.OrgXIcons.icon(window.OrgXIcons.forEntity(r.type) || window.OrgXIcons.forEntity(glyphKind(r.type)) || 'artifact', 18)}</span>
          <span class="r-copy">
            <span class="r-title">${escapeHtml(r.title)}</span>
            <span class="r-meta">${options.meta}</span>
            ${options.snippet ? `<span class="r-snippet">${options.snippet}</span>` : ''}
            ${options.reason ? `<span class="r-reason"><b>Why now:</b> ${escapeHtml(options.reason)}</span>` : ''}
          </span>
          <span class="r-open"><span>${escapeHtml(options.open || 'Open')}</span>${EXT_ICON}</span>
        </a>`;
    };

    var cardHtml = (options) => `
      <div class="widget-shell-card">
        <div class="ox-card sr ox-surface ox-enter" data-edge="${options.edge || 'teal'}">
          <div class="sr-hd">${options.kind === 'Search' ? '<svg class="sr-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>' : window.OrgXIcons.icon(options.glyph || 'artifact', { size: 16, className: 'sr-search-icon' })}
            <span class="sr-kind">${escapeHtml(options.kind)}</span>
            ${options.source ? `<span class="sr-src">${options.source}</span>` : ''}
            ${options.count ? `<span class="sr-count">${escapeHtml(options.count)}</span>` : '<span class="sr-count"></span>'}
            ${options.help ? helpButton() : ''}
          </div>
          ${options.help ? helpPanel() : ''}
          ${options.body}
          ${options.footer || ''}
        </div>
      </div>`;

    var STATE_ICONS = {
      empty: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M8 10.5h5"/></svg>',
      error: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.4" r="1.1" fill="currentColor" stroke="none"/></svg>'
    };
    var stateCard = (kind, title, message, edge, footer, extra) => cardHtml({
      kind: kind,
      glyph: kind === 'Decision history' ? 'decision' : kind === 'Next action' ? 'run' : 'search',
      edge: edge || 'mute',
      help: kind === 'Search',
      body: `<div class="sr-state" role="${edge === 'red' ? 'alert' : 'status'}">${edge === 'red' ? STATE_ICONS.error : STATE_ICONS.empty}<b>${escapeHtml(title)}</b><span>${escapeHtml(message)}</span>${extra || ''}</div>`,
      footer: footer
    });

    // One failure, said once: what happened, that nothing changed, and a retry button.
    var unavailable = (message) => {
      var reason = String(message || '').trim();
      var plain = /did not arrive|could not be loaded|ask chatgpt/i.test(reason);
      return stateCard('Search', 'Search unavailable',
        plain ? reason : 'OrgX couldn’t finish this search. Nothing was changed, and your question is kept.',
        'red', '',
        // A short reason from OrgX ("Search backend timed out") helps; a paragraph repeats us.
        (!plain && reason && reason.length <= 90 && !/not changed/i.test(reason) ? `<span class="sr-reason">${escapeHtml('Reason: ' + reason.replace(/[.\s]*$/, '.'))}</span>` : '') +
        `<span class="sr-state-actions"><button class="sr-btn" type="button" onclick="retrySearch()" ${retrying ? 'disabled' : ''}>${RETRY_ICON}${retrying ? 'Retrying…' : 'Retry search'}</button></span>`);
    };

    var quoted = (text) => text ? '<b>“' + escapeHtml(text) + '”</b>' : '';

    var render = () => {
      if(isLoading) return;
      if(data && (data.error || data.ok === false)) {
        window.OrgXWidgetRuntime.reportSearchWidgetEvent('tool_error');
        var errorMessage = window.OrgXWidgetRuntime.getErrorMessage(data.error || data, 'Organizational memory is temporarily unavailable.');
        injectHtml(unavailable(errorMessage));
        return;
      }
      if (bootError || !data || typeof data !== 'object') {
        var unavailableMessage = bootError || 'OrgX returned an incomplete search response. Retry the search.';
        injectHtml(unavailable(unavailableMessage));
        return;
      }
      var recommendationMode = Array.isArray(data.recommendations) || !!data.next_action;
      var historyMode = Array.isArray(data.decisions) || data.scope === 'decisions' || !!data.topic;

      if (historyMode) {
        window.OrgXWidgetRuntime.reportSearchWidgetEvent('rendered');
        var history = (Array.isArray(data.decisions) ? data.decisions : Array.isArray(data.results) ? data.results : []).map(normalizeDecisionHistoryItem);
        if (!history.length) {
          injectHtml(stateCard('Decision history', 'No matching decisions', data.topic ? 'OrgX has no earlier decision on “' + data.topic + '”.' : 'OrgX has no earlier decisions for this request yet.', 'mute', ''));
          return;
        }
        var historyHtml = history.map((r, index) => rowHtml(
          { title: r.title, type: 'decision', url: r.url },
          index,
          { meta: metaLine(['Decision', titleCase(r.status).toLowerCase(), r.date]), snippet: escapeHtml(r.summary), open: 'Open in OrgX' }
        )).join('');
        injectHtml(cardHtml({
          kind: 'Decision history',
          glyph: 'decision',
          source: data.topic ? quoted(data.topic) : '<b>Past approvals and rejections</b>',
          count: history.length + (history.length === 1 ? ' ruling' : ' rulings'),
          body: `<div class="sr-bd"><p class="sr-sub">Past approvals and rejections that may inform the current call.</p><div class="result-list result-list--recommendations">${historyHtml}</div></div>`,
          footer: ''
        }));
        return;
      }

      if (recommendationMode) {
        window.OrgXWidgetRuntime.reportSearchWidgetEvent('rendered');
        var recommendations = (data.recommendations || []).map(normalizeRecommendation);
        if (!recommendations.length && data.next_action) {
          recommendations = [normalizeRecommendation(data.next_action, 0)];
        }
        if (!recommendations.length) {
          injectHtml(stateCard('Next action', 'No recommendations available', data.message || 'OrgX did not find a clear next action yet.', 'mute', ''));
          return;
        }
        var recommendationsHtml = recommendations.map((r, index) => rowHtml(
          r,
          index,
          {
            meta: metaLine([r.ready ? 'Ready now' : 'Recommended', kindLabel(r.type), r.source ? String(r.source).replace(/_/g, ' ') : '', r.nextTask, r.score !== null ? Math.round(r.score * 100) + '% confidence' : '']),
            snippet: renderSnippet(r.summary),
            reason: r.reason && r.reason !== r.summary ? r.reason : '',
            open: r.ready ? 'Start in OrgX' : 'Review in OrgX'
          }
        )).join('');
        injectHtml(cardHtml({
          kind: 'Next action',
          glyph: 'run',
          source: '',
          count: recommendations.length === 1 ? '' : recommendations.length + ' ranked',
          body: `<div class="sr-bd"><p class="sr-sub">${escapeHtml(data.message || 'Ranked follow-up actions based on current OrgX context. Use the CTA on each card to start the next step directly.')}</p><div class="result-list result-list--recommendations">${recommendationsHtml}</div></div>`,
          footer: '<ox-footer variant="reads" state="fresh" heading="Ranked just now" detail="from current OrgX context" action-label=""></ox-footer>'
        }));
        return;
      }

      var normalizedResults = Array.isArray(data.results) ? data.results.map(item => normalizeResult(item, data.type)) : [];
      if (!Array.isArray(data.results)) {
        injectHtml(unavailable('OrgX returned an incomplete search response. Retry the search.'));
        return;
      }
      window.OrgXWidgetRuntime.reportSearchWidgetEvent('rendered');
      if (!normalizedResults.length) {
        var hasFilters = !!(filters.type || (filters.range && filters.range !== 'any'));
        var emptyCard = stateCard('Search', 'No results found', data.query ? 'Nothing in OrgX matches “' + data.query + '” closely. Try fewer or broader words' + (hasFilters ? ', or clear the filters.' : '.') : 'Try fewer or broader words, or a different scope.', 'mute', '',
          hasFilters ? '<span class="sr-state-actions"><button class="sr-btn" type="button" onclick="clearSearchFilters()">Clear filters</button></span>' : '');
        // With filters on, keep them in reach so they can be changed or cleared.
        injectHtml(hasFilters ? emptyCard.replace('<div class="sr-state"', searchTools([]) + '<div class="sr-state"') : emptyCard);
        return;
      }

      // S5-B: what needs your decision comes first, in its own group.
      var visibleResults = filterResults(normalizedResults);
      var waiting = visibleResults.filter(needsYou);
      var ordered = waiting.concat(visibleResults.filter((r) => !needsYou(r)));
      const totalPages = Math.max(1, Math.ceil(ordered.length / itemsPerPage));
      currentPage = Math.min(currentPage, totalPages);
      const startIdx = (currentPage - 1) * itemsPerPage;
      const paginatedResults = ordered.slice(startIdx, startIdx + itemsPerPage);
      var pageNeeds = paginatedResults.filter(needsYou);
      var pageWork = paginatedResults.filter((r) => !needsYou(r));
      var oldest = waiting.reduce((acc, r) => {
        var t = r.at ? new Date(r.at).getTime() : NaN;
        return isNaN(t) ? acc : (acc === null || t < acc ? t : acc);
      }, null);

      var resultRow = (r, index) => rowHtml(r, index, {
        need: needsYou(r),
        // Raw relevance scores are not shown: an exact title match scored "5%"
        // next to "2%" for the rest. Order already says which matched best.
        meta: metaLine([kindLabel(r.type), statusWords(r), ageOf(r.at)]),
        snippet: r.snippet ? renderSnippet(r.snippet) : ''
      });

      var groupsHtml =
        (pageNeeds.length
          ? `<ox-attention-line tone="needs-you" count="${waiting.length}"${oldest !== null ? ` oldest="${escapeHtml(ageOf(oldest))}"` : ''}></ox-attention-line>
             <div class="result-list">${pageNeeds.map(resultRow).join('')}</div>`
          : '') +
        (pageWork.length
          ? `${pageNeeds.length ? '<p class="sr-lbl">Work</p>' : ''}<div class="result-list">${pageWork.map((r, i) => resultRow(r, i + pageNeeds.length)).join('')}</div>`
          : '');

      var hasMore = !!(data.pagination && data.pagination.has_more && data.next_call && data.next_call.tool === 'orgx_search');
      var footer = loadingMore
        ? '<ox-footer variant="reads" state="refreshing" heading="Loading more…" detail="your results stay"></ox-footer>'
        : loadMoreError
          ? `<ox-footer variant="reads" state="failed" heading="Couldn’t load more" detail="your results are kept" action-label="Load more results"></ox-footer>`
          : hasMore
            ? `<ox-footer variant="reads" state="fresh" heading="${normalizedResults.length} loaded" detail="more in OrgX"><button type="button" slot="action" class="sr-more" onclick="loadMoreResults()">Load more results</button></ox-footer>`
            : '';

      injectHtml(cardHtml({
        kind: 'Search',
        glyph: 'question',
        edge: waiting.length ? 'amber' : 'teal',
        source: data.query ? quoted(data.query) : '<b>Organizational memory</b>',
        help: true,
        // One count everywhere: "20+ results" when OrgX has more pages, the
        // range below reads "1–3 of 20+", and the footer says how many loaded.
        count: normalizedResults.length + (hasMore ? '+' : '') + (normalizedResults.length === 1 && !hasMore ? ' result' : ' results'),
        body: `${searchTools(normalizedResults)}<div class="sr-bd">
            ${visibleResults.length ? '' : '<p class="sr-sub" role="status">No loaded results match these filters. Clear the filters or load another page.</p>'}
            ${groupsHtml}
            ${loadMoreError ? `<p class="sr-sub sr-alert" role="alert">${escapeHtml(loadMoreError)}</p>` : ''}
            ${totalPages > 1 ? `
              <div class="pagination">
                <span class="page-range">${startIdx + 1}–${Math.min(startIdx + paginatedResults.length, ordered.length)} of ${ordered.length}${hasMore ? '+' : ''}</span>
                <button type="button" class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                <button type="button" class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
              </div>` : ''}
          </div>`,
        footer: footer
      }));
    };

    // Footer "Load more results" pages the same search on the server (next_call).
    document.addEventListener('ox-action', function () {
      window.loadMoreResults();
    });

    if(isDemo) applyBootPayload(data);
    else initWidget({
      bridge: 'mcp-apps-sdk',
      observeChatGPTGlobals: true,
      onFailure: function(failure) { applyBootPayload(failure); return true; },
      getData: function(result) {
        var payload = window.OrgXWidgetRuntime.extractSearchWidgetData(result);
        if (payload && (payload.error || payload.ok === false || Array.isArray(payload.results) ||
            Array.isArray(payload.decisions) || Array.isArray(payload.recommendations) || payload.next_action)) return payload;
        // Widget-only copy survives hosts that expose only the summary as
        // toolOutput. Never use it to replace an explicit failure.
        return window.OrgXWidgetRuntime.getToolResponseMetadata('orgx/searchPayload') || payload;
      },
      render: d => { applyBootPayload(d); }
    });
  </script>
</body>
</html>
