<!DOCTYPE html>
<html lang="en" data-accent="iris">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Brief - OrgX</title>
    <style>
      :root {
        --ox-primary-rgb: 99, 102, 241;
        --ox-primary: rgb(var(--ox-primary-rgb));
        --ox-warning: #fbbf24;
        --ox-danger: #f43f5e;

        /* Surface + text tokens (standalone — no shared foundation to inherit
           these from). Without them every `color: var(--ox-text)` fell back to
           black, rendering all copy invisible on the dark host surface.
           Light is the default; dark via prefers-color-scheme below. */
        --ox-bg: #f8fafc;
        --ox-panel: #ffffff;
        --ox-well-bg: #f1f5f9;
        --ox-border: rgba(0, 0, 0, 0.08);
        --ox-border-strong: rgba(0, 0, 0, 0.15);
        --ox-text: #0f172a;
        --ox-text-muted: #64748b;
        --ox-text-dim: #94a3b8;
        --ox-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        --ox-font: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;

        /* Canonical OrgX motion vocabulary (standalone — no shared foundation). */
        --ox-ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
        --ox-ease-entry: cubic-bezier(0, 0, 0.2, 1);
        --ox-ease-exit: cubic-bezier(0.4, 0, 1, 1);
        --ox-ease-morph: cubic-bezier(0.4, 0, 0.2, 1);
        --ox-dur-instant: 50ms;
        --ox-dur-fast: 150ms;
        --ox-dur-base: 250ms;
        --ox-dur-slow: 400ms;
        --ox-dur-slower: 600ms;

        /* Settled UI / hover / press — route through the standard curve. */
        --ox-easing: var(--ox-ease-standard);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --ox-bg: #02040a;
          --ox-panel: rgba(8, 12, 20, 0.96);
          --ox-well-bg: rgba(0, 0, 0, 0.3);
          --ox-border: rgba(255, 255, 255, 0.07);
          --ox-border-strong: rgba(255, 255, 255, 0.14);
          --ox-text: #f2f7ff;
          --ox-text-muted: rgba(255, 255, 255, 0.46);
          --ox-text-dim: rgba(255, 255, 255, 0.28);
        }
      }
      :root[data-theme='dark'] {
        --ox-bg: #02040a;
        --ox-panel: rgba(8, 12, 20, 0.96);
        --ox-well-bg: rgba(0, 0, 0, 0.3);
        --ox-border: rgba(255, 255, 255, 0.07);
        --ox-border-strong: rgba(255, 255, 255, 0.14);
        --ox-text: #f2f7ff;
        --ox-text-muted: rgba(255, 255, 255, 0.46);
        --ox-text-dim: rgba(255, 255, 255, 0.28);
      }

      /* Accessibility-safe reduced-motion guard. Collapse motion to ~instant
         rather than killing it, so `forwards` entrances still settle visibly. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Calm staggered entrance for ledger rows + sections. */
      @keyframes db-enter {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.99);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      .db-stagger {
        opacity: 0;
        animation: db-enter var(--ox-dur-slow) var(--ox-ease-entry) forwards;
        animation-delay: calc(var(--i, 0) * 60ms);
      }

      body {
        font-family: var(--ox-font);
        color: var(--ox-text);
        -webkit-font-smoothing: antialiased;
      }

      .db-empty {
        padding: 40px 28px;
        text-align: center;
      }
      .db-empty-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--ox-text);
        margin-bottom: 6px;
      }
      .db-empty-desc {
        font-size: 13px;
        line-height: 1.5;
        color: var(--ox-text-muted);
        max-width: 320px;
        margin: 0 auto;
      }

      .db-card {
        position: relative;
        background: var(--ox-panel);
        border: 1px solid var(--ox-border);
        border-radius: 20px;
        padding: 24px 28px 20px;
        overflow: hidden;
      }
      .db-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(var(--ox-primary-rgb), 0.8),
          transparent
        );
      }
      .db-masthead {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .db-kicker {
        font-family: var(--ox-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--ox-text-muted);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .db-kicker-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ox-primary);
        box-shadow: 0 0 8px rgba(var(--ox-primary-rgb), 0.6);
      }
      .db-headline {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
        color: var(--ox-text);
        margin-bottom: 6px;
      }
      .db-headline em {
        font-style: normal;
        color: var(--ox-primary);
      }
      .db-needs-eye {
        color: var(--ox-warning);
      }
      .db-subtitle {
        font-size: 13px;
        color: var(--ox-text-muted);
        line-height: 1.5;
      }
      .db-attention {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        margin-bottom: 18px;
        background: rgba(251, 191, 36, 0.05);
        border: 1px solid rgba(251, 191, 36, 0.22);
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s var(--ox-easing);
      }
      .db-attention:hover {
        background: rgba(251, 191, 36, 0.08);
      }
      .db-attention-eyebrow {
        font-family: var(--ox-mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ox-warning);
        margin-bottom: 2px;
      }
      .db-attention-headline {
        font-size: 13px;
        color: var(--ox-text);
      }
      .db-ledger-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .db-lens-toggle {
        display: inline-flex;
        background: var(--ox-well-bg);
        border: 1px solid var(--ox-border);
        border-radius: 8px;
        padding: 2px;
      }
      .db-lens-btn {
        min-height: 44px;
        padding: 6px 12px;
        background: transparent;
        border: none;
        color: var(--ox-text-muted);
        font-family: var(--ox-mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background var(--ox-dur-fast) var(--ox-ease-standard),
          color var(--ox-dur-fast) var(--ox-ease-standard);
      }
      .db-lens-btn.is-active {
        background: rgba(var(--ox-primary-rgb), 0.15);
        color: var(--ox-primary);
      }
      .db-lens-meta {
        font-family: var(--ox-mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ox-text-muted);
      }
      .db-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px 60px;
        gap: 14px;
        align-items: center;
        padding: 14px;
        border-top: 1px solid var(--ox-border);
      }
      .db-row-name {
        font-family: var(--ox-mono);
        font-size: 14px;
        font-weight: 500;
        color: var(--ox-text);
      }
      .db-mode-pill {
        display: inline-block;
        font-family: var(--ox-mono);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 3px;
        margin-left: 8px;
        border: 1px solid var(--ox-border);
        color: var(--ox-text-muted);
      }
      .db-mode-pill.is-auto {
        background: rgba(var(--ox-primary-rgb), 0.12);
        color: var(--ox-primary);
        border-color: rgba(var(--ox-primary-rgb), 0.28);
      }
      .db-row-learning {
        font-size: 12px;
        color: var(--ox-text-muted);
        line-height: 1.5;
        margin-top: 4px;
      }
      .db-row-learning .ascended {
        color: var(--ox-primary);
        font-weight: 500;
      }
      .db-row-learning .regressed {
        color: var(--ox-warning);
        font-weight: 500;
      }
      .db-confidence {
        text-align: right;
      }
      .db-sparkline {
        width: 56px;
        height: 18px;
        display: block;
        margin-left: auto;
      }
      .db-confidence-value {
        font-family: var(--ox-mono);
        font-size: 12px;
        color: var(--ox-text);
        margin-top: 3px;
      }
      .db-confidence-delta {
        font-size: 10px;
        margin-left: 5px;
        color: var(--ox-primary);
      }
      .db-confidence-delta.is-warn {
        color: var(--ox-warning);
      }
      .db-runs {
        text-align: right;
      }
      .db-runs-value {
        font-family: var(--ox-mono);
        font-size: 14px;
        color: var(--ox-text);
      }
      .db-runs-label {
        font-family: var(--ox-mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ox-text-muted);
        margin-top: 2px;
      }
      .db-agent-avatar {
        display: inline-flex;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgba(var(--agent-rgb, var(--ox-primary-rgb)), 0.18);
        color: rgb(var(--agent-rgb, var(--ox-primary-rgb)));
        align-items: center;
        justify-content: center;
        font-family: var(--ox-mono);
        font-size: 10px;
        font-weight: 600;
        margin-right: 8px;
        vertical-align: middle;
      }
      .db-cross-prompt {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border: 1px dashed rgba(var(--ox-primary-rgb), 0.35);
        border-radius: 12px;
        margin-bottom: 12px;
        font-size: 12px;
        color: var(--ox-text);
        line-height: 1.5;
      }
      .db-cross-prompt code {
        font-family: var(--ox-mono);
        font-size: 11px;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(var(--ox-primary-rgb), 0.15);
        color: var(--ox-primary);
      }
      .db-cross-prompt-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        background: rgba(var(--ox-primary-rgb), 0.18);
        border: 1px solid rgba(var(--ox-primary-rgb), 0.35);
        color: var(--ox-primary);
        font-family: var(--ox-mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background var(--ox-dur-fast) var(--ox-ease-standard),
          border-color var(--ox-dur-fast) var(--ox-ease-standard),
          transform var(--ox-dur-fast) var(--ox-ease-standard);
      }
      .db-cross-prompt-btn:hover {
        transform: translateY(-1px);
        background: rgba(var(--ox-primary-rgb), 0.26);
        border-color: rgba(var(--ox-primary-rgb), 0.45);
      }
      .db-proof-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 16px 0 0;
        margin-top: 20px;
        border-top: 1px solid var(--ox-border);
      }
      .db-proof-stat {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--ox-border);
      }
      .db-proof-value {
        font-family: var(--ox-mono);
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--ox-text);
        line-height: 1;
      }
      .db-proof-value.is-empty {
        color: var(--ox-text-muted);
      }
      .db-proof-label {
        font-size: 11px;
        color: var(--ox-text);
        margin-top: 8px;
      }
      .db-proof-baseline {
        font-family: var(--ox-mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ox-text-muted);
        margin-top: 3px;
      }
      .db-proof-goal {
        font-family: var(--ox-mono);
        font-size: 10px;
        margin-top: 4px;
        color: var(--ox-primary);
      }
      .db-proof-goal.is-behind {
        color: var(--ox-warning);
      }
      .db-footer {
        display: flex;
        justify-content: space-between;
        padding-top: 14px;
        margin-top: 16px;
        border-top: 1px solid var(--ox-border);
        font-family: var(--ox-mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ox-text-muted);
      }
      .db-footer-link {
        min-height: 44px;
        color: var(--ox-primary);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: gap var(--ox-dur-fast) var(--ox-ease-standard);
      }
      .db-footer-link:hover {
        gap: 8px;
      }
    </style>
    <link rel="stylesheet" href="shared/widget-theme.css" />
  </head>
  <body>
    <div id="root" class="ox-surface"></div>
    <script src="shared/mcp-apps-sdk.umd.js"></script>
    <script src="shared/widget-runtime.js"></script>
    <script type="module">
      const { initWidget, callTool, openWidgetLink } = window.OrgXWidgetRuntime;

      const root = document.getElementById('root');
      let data = null;
      let lens = 'skills';
      const params = new URLSearchParams(location.search);
      const demoState = params.get('state') || 'populated';
      const galleryDemo = params.get('demo') === 'true' || params.get('gallery') === 'true';
      let isLoading = params.get('loading') === 'true' || demoState === 'loading';
      let demoError = demoState === 'error';

      function demoConfidence(value, delta, placeholder) {
        return {
          value: value,
          delta: delta,
          placeholder: !!placeholder,
          points: placeholder ? [] : [0.42, 0.55, 0.61, 0.74, value],
        };
      }

      function buildDemoData(state) {
        const complete = state === 'completed' || state === 'resolved';
        const blocked = state === 'blocked';
        const stale = state === 'stale' || state === 'degraded';
        const progressing = state === 'progressing';
        const long = state === 'long';
        const skillRows = [
          {
            id: 'skill-evidence',
            name: 'Evidence QA',
            mode: 'auto',
            learningLine: progressing ? '<strong>Running now</strong> · validating the latest receipt chain.' : blocked ? '<strong>Blocked</strong> · waiting on a deploy receipt.' : 'Verified receipt coverage across the latest run.',
            confidence: demoConfidence(complete ? 0.97 : blocked ? 0.48 : stale ? 0.7 : 0.86, complete ? 0.11 : blocked ? -0.14 : 0.08, stale),
            runs: complete ? 14 : 12,
          },
          {
            id: 'skill-orchestration',
            name: 'Orchestration',
            mode: 'auto',
            learningLine: progressing ? 'Decomposing the next workstream into agent-sized slices.' : 'Keeps handoffs concise and ownership explicit.',
            confidence: demoConfidence(complete ? 0.94 : blocked ? 0.63 : stale ? 0.76 : 0.82, complete ? 0.06 : 0.04, stale),
            runs: complete ? 9 : 8,
          },
        ];
        if (long) {
          skillRows.push(
            { id: 'skill-search', name: 'Search relevance', mode: 'manual', learningLine: 'Ranking the strongest organizational answer first.', confidence: demoConfidence(0.79, 0.03, stale), runs: 7 },
            { id: 'skill-memory', name: 'Memory hygiene', mode: 'auto', learningLine: 'Keeping workspace context scoped and current.', confidence: demoConfidence(0.91, 0.09, stale), runs: 11 },
            { id: 'skill-briefing', name: 'Brief synthesis', mode: 'auto', learningLine: 'Turning completed work into a compact operator readout.', confidence: demoConfidence(0.88, 0.05, stale), runs: 6 }
          );
        }
        const agents = [
          {
            id: 'agent-eli',
            displayName: 'Eli',
            role: 'Engineering',
            mode: 'auto',
            avatarGlyph: 'E',
            accentRgb: '6, 182, 212',
            learningLine: progressing ? '<strong>In progress</strong> · assembling the deploy proof packet.' : blocked ? '<strong>Waiting</strong> · a verification gate needs attention.' : 'Closed the latest evidence gap cleanly.',
            confidence: demoConfidence(complete ? 0.98 : blocked ? 0.45 : stale ? 0.69 : 0.9, complete ? 0.12 : blocked ? -0.18 : 0.07, stale),
            tasks: complete ? 6 : 5,
            isRegressed: blocked,
            sla: { displayLine: stale ? 'Last seen 14m ago' : 'Next checkpoint · 18m' },
          },
          {
            id: 'agent-dana',
            displayName: 'Dana',
            role: 'Design',
            mode: 'manual',
            avatarGlyph: 'D',
            accentRgb: '236, 72, 153',
            learningLine: 'Reviewing the next operator-facing surface.',
            confidence: demoConfidence(complete ? 0.93 : stale ? 0.77 : 0.84, 0.03, stale),
            tasks: complete ? 3 : 2,
            sla: { displayLine: stale ? 'Last seen 14m ago' : 'Next checkpoint · 42m' },
          },
        ];
        if (long) {
          agents.push(
            { id: 'agent-mark', displayName: 'Mark', role: 'Marketing', mode: 'auto', avatarGlyph: 'M', accentRgb: '249, 115, 22', learningLine: 'Packaging the launch proof for review.', confidence: demoConfidence(0.81, 0.02, stale), tasks: 4 },
            { id: 'agent-sage', displayName: 'Sage', role: 'Sales', mode: 'auto', avatarGlyph: 'S', accentRgb: '168, 85, 247', learningLine: 'Qualifying the next accepted outcome.', confidence: demoConfidence(0.76, 0.01, stale), tasks: 3 }
          );
        }
        return {
          masthead: { kicker: 'OrgX · Daily brief' },
          skillsLens: {
            masthead: {
              headlineHtml: complete ? 'The loop is <em>closed</em>.' : blocked ? 'One gate needs your <em>call</em>.' : progressing ? 'Work is <em>moving</em>.' : stale ? 'Refresh before you <em>act</em>.' : 'Your operating loop, <em>in view</em>.',
              subtitle: complete ? 'Every completed task has a receipt.' : blocked ? 'Execution is paused until the evidence gate clears.' : progressing ? 'Live work is landing in the ledger now.' : stale ? 'The last readout is outside the live window.' : 'A calm readout of what changed and what is next.',
              metaLabel: complete ? 'Complete · verified' : blocked ? 'Blocked · needs you' : progressing ? 'Live · updating' : stale ? 'Stale · refresh' : 'Skills · live',
            },
            skills: skillRows,
          },
          agentsLens: {
            masthead: {
              headlineHtml: complete ? 'Agents are <em>clear</em>.' : blocked ? 'An agent is <em>waiting</em>.' : progressing ? 'Agents are <em>working</em>.' : stale ? 'Agent context is <em>stale</em>.' : 'Your agents, <em>in motion</em>.',
              subtitle: 'See the owner, confidence, and proof behind each move.',
              metaLabel: complete ? 'Complete · verified' : blocked ? 'Attention · 1 gate' : progressing ? 'Live · 2 active' : stale ? 'Stale · refresh' : 'Agents · live',
            },
            agents: agents,
            crossPollinationPrompt: null,
          },
          attention: complete ? null : {
            eyebrow: blocked ? 'Blocked · one decision' : stale ? 'Needs refresh' : progressing ? 'Live sync' : 'Next useful move',
            headlineHtml: blocked ? 'Resolve the evidence gate before dispatching more work.' : stale ? 'Refresh this brief to pull current agent state.' : progressing ? 'The latest receipt is still being assembled.' : 'Open today to review the one item that can move the loop forward.',
            deepLink: 'https://useorgx.com/live?view=mission-control',
          },
          proof: {
            timeSaved: { displayValue: complete ? '42m' : '31m', label: 'time saved', baseline: 'vs. manual review', value: complete ? 42 : 31, goalDelta: { pct: 0.08, displayDelta: '+8%' } },
            tokensSaved: { displayValue: complete ? '18.4k' : '14.2k', label: 'tokens saved', baseline: 'vs. full replay', value: complete ? 18400 : 14200 },
            deviationsCaught: { displayValue: complete ? '6' : blocked ? '2' : '4', label: 'deviations caught', baseline: 'before release', value: complete ? 6 : blocked ? 2 : 4 },
          },
          footer: {
            syncedAgo: complete ? 'Verified just now' : stale ? 'Last synced 14m ago' : 'Synced just now',
            machineCount: 2,
            deepLink: { href: 'https://useorgx.com/live?view=mission-control', label: complete ? 'Open proof' : 'Open today' },
          },
        };
      }

      if (galleryDemo && !isLoading && !demoError && demoState !== 'empty') {
        data = buildDemoData(demoState);
      }

      function escapeHtml(v) {
        if (v == null) return '';
        return String(v)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function escapeAttr(v) {
        return escapeHtml(v);
      }

      // Trusted HTML — projection builder controls these fields.
      function rawHtml(v) {
        return typeof v === 'string' ? v : '';
      }

      function sparkline(points, tone) {
        if (!Array.isArray(points) || points.length === 0) {
          return `<svg class="db-sparkline" viewBox="0 0 56 18" preserveAspectRatio="none"><line x1="0" y1="9" x2="56" y2="9" stroke="rgba(255,255,255,0.12)" stroke-dasharray="2 3" stroke-width="1"/></svg>`;
        }
        const stroke =
          tone === 'warning'
            ? 'rgb(251,191,36)'
            : tone === 'muted'
            ? 'rgba(255,255,255,0.35)'
            : 'rgb(var(--ox-primary-rgb))';
        const step = 56 / Math.max(1, points.length - 1);
        const coords = points
          .map((v, i) => {
            const y = 18 - Math.max(1, Math.min(17, v * 16 + 1));
            return `${(i * step).toFixed(1)},${y.toFixed(1)}`;
          })
          .join(' ');
        const last = points[points.length - 1] || 0;
        const lastY = (18 - Math.max(1, Math.min(17, last * 16 + 1))).toFixed(1);
        return `<svg class="db-sparkline" viewBox="0 0 56 18" preserveAspectRatio="none">
          <polyline points="${coords}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="56" cy="${lastY}" r="2" fill="${stroke}"/>
        </svg>`;
      }

      function renderSkillRow(row, index = 0) {
        const tone = row.isRegressed
          ? 'warning'
          : row.confidence && row.confidence.placeholder
          ? 'muted'
          : 'primary';
        const spark = sparkline(row.confidence?.points || [], tone);
        const value = row.confidence?.placeholder
          ? '—'
          : (row.confidence?.value ?? 0).toFixed(2);
        const delta = row.confidence?.placeholder
          ? ''
          : `<span class="db-confidence-delta ${
              tone === 'warning' ? 'is-warn' : ''
            }">${(row.confidence?.delta ?? 0) >= 0 ? '+' : ''}${(
              row.confidence?.delta ?? 0
            ).toFixed(2)}</span>`;
        const modeClass = row.mode === 'auto' ? 'is-auto' : '';
        return `
          <div class="db-row db-stagger" style="--i:${index};" data-row-id="${escapeAttr(row.id)}">
            <div>
              <div>
                <span class="db-row-name">${escapeHtml(row.name)}</span>
                <span class="db-mode-pill ${modeClass}">${
          row.mode === 'auto' ? 'Auto' : 'Manual'
        }</span>
              </div>
              <div class="db-row-learning">${rawHtml(row.learningLine)}</div>
            </div>
            <div class="db-confidence">
              ${spark}
              <div class="db-confidence-value" ${
                tone === 'warning'
                  ? 'style="color: var(--ox-warning)"'
                  : ''
              }>${value}${delta}</div>
            </div>
            <div class="db-runs">
              <div class="db-runs-value">${row.runs ?? 0}</div>
              <div class="db-runs-label">runs</div>
            </div>
          </div>
        `;
      }

      function renderAgentRow(row, index = 0) {
        const tone = row.isRegressed
          ? 'warning'
          : row.confidence && row.confidence.placeholder
          ? 'muted'
          : 'primary';
        const spark = sparkline(row.confidence?.points || [], tone);
        const value = row.confidence?.placeholder
          ? '—'
          : (row.confidence?.value ?? 0).toFixed(2);
        const delta = row.confidence?.placeholder
          ? ''
          : `<span class="db-confidence-delta ${
              tone === 'warning' ? 'is-warn' : ''
            }">${(row.confidence?.delta ?? 0) >= 0 ? '+' : ''}${(
              row.confidence?.delta ?? 0
            ).toFixed(2)}</span>`;
        const avatarStyle = row.accentRgb
          ? `--agent-rgb: ${escapeAttr(row.accentRgb)};`
          : '';
        return `
          <div class="db-row db-stagger" style="--i:${index};${avatarStyle}" data-row-id="${escapeAttr(row.id)}">
            <div>
              <div>
                <span class="db-agent-avatar">${escapeHtml(
                  row.avatarGlyph || '?'
                )}</span>
                <span class="db-row-name">${escapeHtml(
                  row.displayName
                )} · ${escapeHtml(row.role)}</span>
                <span class="db-mode-pill ${
                  row.mode === 'auto' ? 'is-auto' : ''
                }">${row.mode === 'auto' ? 'Auto' : 'Manual'}</span>
              </div>
              <div class="db-row-learning">${rawHtml(row.learningLine)}</div>
              ${
                row.sla?.displayLine
                  ? `<div class="db-row-learning">${rawHtml(
                      row.sla.displayLine
                    )}</div>`
                  : ''
              }
            </div>
            <div class="db-confidence">
              ${spark}
              <div class="db-confidence-value" ${
                tone === 'warning'
                  ? 'style="color: var(--ox-warning)"'
                  : ''
              }>${value}${delta}</div>
            </div>
            <div class="db-runs">
              <div class="db-runs-value">${row.tasks ?? 0}</div>
              <div class="db-runs-label">tasks</div>
            </div>
          </div>
        `;
      }

      function renderProof(stat) {
        const cls = stat.value == null ? 'is-empty' : '';
        const goal = stat.goalDelta
          ? `<div class="db-proof-goal ${
              stat.goalDelta.pct < 0 ? 'is-behind' : ''
            }">${escapeHtml(stat.goalDelta.displayDelta)}</div>`
          : '';
        return `
          <div class="db-proof-stat">
            <div class="db-proof-value ${cls}">${escapeHtml(
          stat.displayValue
        )}</div>
            <div class="db-proof-label">${escapeHtml(stat.label)}</div>
            <div class="db-proof-baseline">${escapeHtml(stat.baseline)}</div>
            ${goal}
          </div>
        `;
      }

      function renderLoadingState() {
        root.innerHTML = '<div class="db-card db-stagger" style="--i:0;"><div class="db-empty" role="status" aria-label="Loading daily brief"><div class="db-empty-title">Loading today’s brief</div><div class="db-empty-desc">Syncing completed work, active agents, and the latest proof.</div><div style="display:grid;gap:8px;margin-top:18px;"><span style="display:block;height:10px;border-radius:999px;background:var(--ox-well-bg);animation:dbPulse 1.3s ease-in-out infinite;"></span><span style="display:block;width:78%;height:10px;border-radius:999px;background:var(--ox-well-bg);animation:dbPulse 1.3s ease-in-out .12s infinite;"></span><span style="display:block;width:56%;height:10px;border-radius:999px;background:var(--ox-well-bg);animation:dbPulse 1.3s ease-in-out .24s infinite;"></span></div></div></div>';
      }

      function renderErrorState() {
        root.innerHTML = '<div class="db-card db-stagger" style="--i:0;"><div class="db-empty"><div class="db-empty-title">Daily brief unavailable</div><div class="db-empty-desc">The latest ledger readout could not be loaded. Retry from today when the workspace is reachable.</div><a class="db-footer-link" href="https://useorgx.com/live?view=mission-control" data-action-kind="open-today" data-deep-link="https://useorgx.com/live?view=mission-control">Open today →</a></div></div>';
        const link = root.querySelector('[data-action-kind]');
        if (link) link.addEventListener('click', (event) => {
          event.preventDefault();
          openWidgetLink(link.dataset.deepLink || 'https://useorgx.com/live?view=mission-control');
        });
      }

      function renderEmptyState() {
        root.innerHTML = '<div class="db-card db-stagger" style="--i:0;"><div class="db-empty"><div class="db-empty-title">Nothing needs you yet</div><div class="db-empty-desc">The ledger fills in as skills and agents run. Complete your first task in an editor and the daily readout will appear here.</div></div></div>';
      }

      function render() {
        if (isLoading) {
          renderLoadingState();
          return;
        }
        if (demoError) {
          renderErrorState();
          return;
        }
        if (!data) {
          renderEmptyState();
          return;
        }

        const activeLens =
          lens === 'skills' ? data.skillsLens : data.agentsLens;
        // A non-null payload is not the same as a usable one. Without this the
        // widget reached data.skillsLens.skills on a payload that had no lens,
        // threw, and rendered nothing at all — a blank surface rather than an
        // honest empty state.
        if (!activeLens) {
          renderEmptyState();
          return;
        }
        const rows =
          lens === 'skills'
            ? (activeLens.skills || [])
                .map((row, i) => renderSkillRow(row, i))
                .join('')
            : (activeLens.agents || [])
                .map((row, i) => renderAgentRow(row, i))
                .join('');

        const crossPrompt =
          lens === 'agents' && data.agentsLens.crossPollinationPrompt
            ? `<div class="db-cross-prompt">
                <div style="flex:1;">${rawHtml(
                  data.agentsLens.crossPollinationPrompt.textHtml
                )}</div>
                <button class="db-cross-prompt-btn" data-action-kind="promote" data-proposal-id="${escapeAttr(
                  data.agentsLens.crossPollinationPrompt.id
                )}">
                  ${escapeHtml(
                    data.agentsLens.crossPollinationPrompt.action.title
                  )}
                </button>
              </div>`
            : '';

        const attention = data.attention
          ? `<div class="db-attention" role="button" tabindex="0" data-action-kind="open-today" data-deep-link="${escapeAttr(
              data.attention.deepLink || '/today'
            )}">
              <div style="flex:1;">
                <div class="db-attention-eyebrow">${escapeHtml(
                  data.attention.eyebrow
                )}</div>
                <div class="db-attention-headline">${rawHtml(
                  data.attention.headlineHtml
                )}</div>
              </div>
            </div>`
          : '';

        const proof = data.proof
          ? `<div class="db-proof-strip">
              ${renderProof(data.proof.timeSaved)}
              ${renderProof(data.proof.tokensSaved)}
              ${renderProof(data.proof.deviationsCaught)}
            </div>`
          : '';

        root.innerHTML = `
          <div class="db-card db-stagger" style="--i:0;">
            <div class="db-masthead">
              <div style="flex:1;">
                <div class="db-kicker"><span class="db-kicker-dot"></span><span>${escapeHtml(
                  data.masthead?.kicker || ''
                )}</span></div>
                <div class="db-headline">${rawHtml(
                  activeLens.masthead?.headlineHtml || ''
                )}</div>
                <div class="db-subtitle">${escapeHtml(
                  activeLens.masthead?.subtitle || ''
                )}</div>
              </div>
            </div>
            ${attention}
            <div>
              <div class="db-ledger-header">
                <div class="db-lens-toggle" role="tablist">
                  <button class="db-lens-btn ${
                    lens === 'skills' ? 'is-active' : ''
                  }" data-lens="skills">Skills</button>
                  <button class="db-lens-btn ${
                    lens === 'agents' ? 'is-active' : ''
                  }" data-lens="agents">Agents</button>
                </div>
                <span class="db-lens-meta">${escapeHtml(
                  activeLens.masthead?.metaLabel || ''
                )}</span>
              </div>
              ${crossPrompt}
              ${rows}
            </div>
            ${proof}
            <div class="db-footer">
              <span>${escapeHtml(data.footer?.syncedAgo || '')} · ${
          data.footer?.machineCount ?? 1
        } machine${data.footer?.machineCount === 1 ? '' : 's'}</span>
              <a class="db-footer-link" href="${escapeAttr(
                data.footer?.deepLink?.href || '/today'
              )}" data-action-kind="open-today" data-deep-link="${escapeAttr(
                data.footer?.deepLink?.href || '/today'
              )}">
                ${escapeHtml(data.footer?.deepLink?.label || 'Open today')}
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
              </a>
            </div>
          </div>
        `;

        // Wire interactions
        root.querySelectorAll('.db-lens-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            lens = btn.dataset.lens || 'skills';
            render();
          });
        });

        root.querySelectorAll('[data-action-kind]').forEach((el) => {
          el.addEventListener('click', (event) => {
            event.preventDefault();
            const kind = el.dataset.actionKind;
            if (kind === 'open-today') {
              openWidgetLink(el.dataset.deepLink || '/today');
            } else if (kind === 'promote') {
              const proposalId = el.dataset.proposalId;
              if (!proposalId) return;
              callTool('cross_pollination_promote', {
                proposal_id: proposalId,
                idempotency_key: crypto.randomUUID(),
              });
            }
          });
        });
      }

      if (galleryDemo) {
        render();
      } else {
        initWidget({
          render: (d) => {
            if (d) data = d;
            if (data && data.defaultLens) lens = data.defaultLens;
            render();
          },
        });
      }
    </script>
  </body>
</html>
