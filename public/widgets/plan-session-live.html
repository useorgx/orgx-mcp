<!DOCTYPE html>
<html lang="en" data-widget-mode="creation" data-accent="iris">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Session — OrgX</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2302040a'/%3E%3Cpath d='M18 20h28M18 30h28M18 40h20' stroke='%236366f1' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <script src="shared/kit/ox-elements-core.js"></script>
  <script src="shared/kit/ox-elements-footer.js"></script>

  <script>
    (function syncPreviewContext() {
      var params = new URLSearchParams(window.location.search);
      var theme = params.get('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    /* Creation mode keeps its iris identity; canvas Q4 and Q5 supply the shape. */
    :root { --ox-primary: #6366f1; --ox-primary-rgb: 99, 102, 241; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 18px;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: var(--ox-font);
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 680px; margin: 0 auto; position: relative; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* The footer's primary is the kit's action lime, whatever the widget accent. */

    .wcard {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      --edge-rgb: 100, 116, 139;
    }
    .wcard::after {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), .7), transparent);
      pointer-events: none;
    }
    .wcard[data-edge="amber"] { --edge-rgb: 251, 191, 36; }
    .wcard[data-edge="teal"] { --edge-rgb: 0, 201, 167; }
    .wcard[data-edge="red"] { --edge-rgb: 244, 63, 94; }
    .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; min-width: 0; }
    .hd { min-height: 34px; }
    .hd > svg { flex: none; color: var(--ox-text-muted); }
    .hd[data-tone="amber"] > svg { color: var(--ox-warning); }
    .hd[data-tone="teal"] > svg { color: var(--ox-teal); }
    .hd[data-tone="red"] > svg { color: var(--ox-danger); }
    /* Sans type scale; weight and colour carry the hierarchy. */
    .kind { font-size: 13px; font-weight: 650; line-height: 1.2; color: var(--ox-text); white-space: nowrap; }
    .src { font-size: 12.5px; color: var(--ox-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sp { flex: 1; }
    .meta { font-size: 12.5px; line-height: 1.35; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
    .bd { padding: 10px 18px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .pk-q {
      margin: 0; font-size: 22px; font-weight: 700; line-height: 1.18;
      letter-spacing: -.025em; color: var(--ox-text);
      text-wrap: balance; overflow-wrap: anywhere;
    }
    .note { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ox-text-muted); text-wrap: pretty; }
    /* Q4: what you said last time, in one line above the work. */
    .last-note { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ox-text); }
    .last-note span { color: var(--ox-text-muted); }
    .plan-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -4px; flex-wrap: wrap; }
    .plan-toggle {
      min-height: 44px; padding: 0 10px; margin: -10px -10px -10px 0; border: 0; border-radius: 9px; background: none;
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ox-text-2); font-family: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
    }
    .plan-toggle:hover { background: var(--ox-hover); color: var(--ox-text); }
    .plan-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }

    .plan-lenses { display: flex; gap: 4px; border-bottom: 1px solid var(--ox-border); }
    .plan-lens {
      min-height: 44px; padding: 0 12px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent;
      background: none; color: var(--ox-text-muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .plan-lens[aria-selected="true"] { color: var(--ox-text); border-bottom-color: var(--ox-text); }
    .plan-lens:hover { color: var(--ox-text); }
    .plan-lens .count { margin-left: 6px; font-weight: 500; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }

    .plan-workbench { display: grid; grid-template-columns: minmax(150px, 190px) minmax(0, 1fr); gap: 14px; align-items: start; }
    .plan-map { display: flex; flex-direction: column; gap: 2px; }
    .plan-map__button {
      display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center;
      min-height: 44px; padding: 6px 8px; border: 0; border-radius: 9px; background: none; text-align: left;
      color: var(--ox-text-muted); font-family: inherit; font-size: 13px; cursor: pointer;
    }
    .plan-map__button:hover { background: var(--ox-hover); color: var(--ox-text); }
    .plan-map__button[aria-current="true"] { background: var(--ox-well-bg); color: var(--ox-text); font-weight: 600; }
    .plan-map__index { font-size: 12px; font-weight: 600; line-height: 1; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
    .plan-map__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-section-select-wrap { display: none; flex-direction: column; gap: 6px; }
    .sec-label { font-size: 12.5px; font-weight: 600; line-height: 1.2; color: var(--ox-text-muted); }
    .plan-section-select {
      min-height: 44px; width: 100%; padding: 0 10px; border-radius: 10px;
      border: 1px solid var(--ox-border-strong); background: var(--ox-panel); color: var(--ox-text);
      font-family: inherit; font-size: 14px;
    }

    /* Q4: the thing being read sits in one well; nothing nests inside it. */
    .plan-well { background: var(--ox-well-bg); border-radius: 12px; padding: 14px 16px 10px; min-width: 0; }
    .plan-section__title { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: var(--ox-text); letter-spacing: -.01em; }
    .plan-section__body-wrap { position: relative; max-height: 282px; overflow: hidden; }
    .plan-section__body-wrap.is-expanded { max-height: none; }
    .plan-section__body-wrap[data-clamped="true"]:not(.is-expanded)::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; pointer-events: none;
      background: linear-gradient(transparent, var(--ox-well-bg));
    }
    .plan-section__body { font-size: 14px; line-height: 1.6; color: var(--ox-text-2); overflow-wrap: anywhere; }
    .plan-section__body p { margin: 0 0 8px; }
    .plan-section__body ul, .plan-section__body ol { margin: 0 0 8px; padding-left: 20px; }
    .plan-section__body li { margin: 2px 0; }
    .plan-section__body code { font-family: var(--ox-font-code); font-size: .9em; }
    .plan-expand {
      display: none; min-height: 44px; padding: 0; border: 0; background: none;
      color: var(--ox-text-2); font-family: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
    }
    .plan-expand.is-visible { display: inline-flex; align-items: center; }

    .plan-activity { display: flex; flex-direction: column; }
    .plan-activity__item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--ox-border); }
    .plan-activity__item:first-child { border-top: 0; }
    /* Who wrote the guidance, by the shared fallback rule (OrgXAgentIdentity):
       a named person gets their initials; you (or an unnamed person) the
       person glyph; guidance with no author the note glyph. Never a "?". */
    .plan-author { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ox-well-bg); box-shadow: inset 0 0 0 1px var(--ox-border-strong); font-size: 11.5px; font-weight: 700; color: var(--ox-text-2); }
    .plan-author > svg { color: var(--ox-text-muted); }
    .plan-activity__note { font-size: 13.5px; line-height: 1.45; color: var(--ox-text); margin-bottom: 2px; }

    .plan-composer { display: flex; flex-direction: column; gap: 8px; }
    .plan-composer__title { font-size: 13px; font-weight: 650; color: var(--ox-text); }
    .plan-textarea {
      width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--ox-border-strong); background: var(--ox-panel);
      color: var(--ox-text); font-family: inherit; font-size: 14px; line-height: 1.5;
    }
    .plan-textarea:focus { outline: 2px solid var(--ox-focus); outline-offset: 1px; }
    .plan-feedback { min-height: 18px; font-size: 12.5px; color: var(--ox-text-muted); }
    .plan-feedback[data-tone="error"] { color: var(--ox-danger); }

    /* Empty: what a plan needs first, as starting points that open the composer. */
    .plan-empty { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 14px; align-items: start; padding: 16px; border-radius: 12px; background: var(--ox-well-bg); }
    .plan-empty__icon { grid-row: span 2; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: var(--ox-primary); background: rgba(var(--ox-primary-rgb), .12); }
    .plan-empty__title { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.3; color: var(--ox-text); }
    .plan-empty__text { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ox-text-2); }
    .plan-starters { grid-column: 1 / -1; display: flex; flex-direction: column; margin-top: 8px; }
    .plan-starter {
      display: grid; grid-template-columns: minmax(0, 1fr) 16px; align-items: center; gap: 10px; min-height: 48px; padding: 6px 2px;
      border: 0; border-top: 1px solid var(--ox-border); background: none; text-align: left; cursor: pointer;
      font: inherit; color: var(--ox-text);
    }
    .plan-starter b { display: block; font-size: 13.5px; font-weight: 600; }
    .plan-starter span { display: block; font-size: 12.5px; color: var(--ox-text-muted); }
    .plan-starter svg { color: var(--ox-text-muted); }
    .plan-starter:hover b { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ox-border-strong); }
    .plan-quiet { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 10px; padding: 12px 0 4px; }
    .plan-quiet > svg { grid-row: span 2; margin-top: 2px; color: var(--ox-text-muted); }
    .plan-quiet b { font-size: 13.5px; font-weight: 600; color: var(--ox-text); }
    .plan-quiet span { font-size: 13px; line-height: 1.45; color: var(--ox-text-muted); }

    .ft-link {
      min-height: 44px; margin: -4px 0; padding: 0 12px; border: 0; border-radius: 9px; background: none;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      color: var(--ox-text-2); font-family: inherit; font-size: 12.5px; font-weight: 650; line-height: 1; white-space: nowrap; cursor: pointer;
    }
    .ft-link:hover { background: var(--ox-hover); color: var(--ox-text); }

    /* Loading keeps the populated footprint so the card never jumps. */
    .sk { display: block; height: 10px; border-radius: 4px; background: var(--ox-skeleton, rgba(127, 127, 127, .12)); }

    @media (max-width: 560px) {
      .plan-workbench { grid-template-columns: 1fr; }
      .plan-map { display: none; }
      .plan-section-select-wrap { display: flex; }
    }
    @media (max-width: 420px) {
      .ft-link .ft-long { display: none; }
      .ft-link { padding: 0 8px; }
    }
    @media (max-width: 480px) {
      .hd { padding: 12px 14px 0; }
      .bd { padding: 10px 14px 14px; }
      .pk-q { font-size: 19px; }
      .plan-well { padding: 12px 12px 8px; }
    }
  </style>
  <link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
  <main class="container" aria-live="polite">
    <div class="widget-shell-card plan-shell" data-widget-root>
      <article class="wcard ox-surface" data-loading role="status" aria-live="polite">
        <span class="sr-only">Loading plan session…</span>
        <div class="hd"><span class="sk" style="width:30%"></span></div>
        <div class="bd">
          <span class="sk" style="width:72%;height:24px"></span>
          <span class="sk" style="width:40%"></span>
          <span class="sk" style="width:100%;height:150px;border-radius:12px"></span>
        </div>
        <ox-footer variant="reads" state="loading"></ox-footer>
      </article>
      <div data-content hidden></div>
    </div>
  </main>

  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/orgx-icons.js"></script>
  <script src="shared/live-machine.js"></script>
  <script src="shared/live-store.js"></script>
  <script src="shared/live-panel.js"></script>
  <script>
    (function installPlanWidget() {
      'use strict';

      var state = {
        plan: null,
        selectedSection: 0,
        lens: 'plan',
        composerOpen: false,
        completeExpanded: false,
        trigger: null,
      };

      function firstString(values) {
        for (var index = 0; index < values.length; index += 1) {
          var value = values[index];
          if (typeof value === 'string' && value.trim()) return value.trim();
        }
        return '';
      }

      function firstNumber(values, fallback) {
        for (var index = 0; index < values.length; index += 1) {
          var value = Number(values[index]);
          if (Number.isFinite(value)) return value;
        }
        return fallback;
      }

      function escapeHtml(value) {
        var node = document.createElement('div');
        node.textContent = value == null ? '' : String(value);
        return node.innerHTML;
      }

      function normalizeStatus(value) {
        var slug = String(value || 'active').toLowerCase().replace(/[^a-z0-9]+/g, '_');
        if (['complete', 'completed', 'done', 'accepted', 'approved'].indexOf(slug) >= 0) {
          return 'complete';
        }
        if (['error', 'failed', 'degraded', 'disconnected'].indexOf(slug) >= 0) {
          return 'error';
        }
        return 'active';
      }

      function parsePlanDocument(markdown, fallbackTitle) {
        var source = String(markdown || '').replace(/\r\n?/g, '\n').trim();
        if (!source) return { title: fallbackTitle || 'New plan', sections: [] };

        var lines = source.split('\n');
        var title = fallbackTitle || 'New plan';
        var sections = [];
        var current = null;
        var intro = [];

        lines.forEach(function parseLine(line) {
          var heading = line.match(/^(#{1,6})\s+(.+?)\s*$/);
          if (heading) {
            if (heading[1].length === 1 && title === (fallbackTitle || 'New plan')) {
              title = heading[2].trim();
              return;
            }
            if (heading[1].length >= 2) {
              if (current) sections.push(current);
              current = { heading: heading[2].trim(), bodyLines: [] };
              return;
            }
          }

          if (current) current.bodyLines.push(line);
          else if (line.trim()) intro.push(line);
        });

        if (current) sections.push(current);
        if (intro.length) {
          sections.unshift({ heading: 'Brief', bodyLines: intro });
        }
        if (!sections.length && source) {
          sections.push({ heading: 'Plan', bodyLines: lines.filter(function keep(line) {
            return !/^#\s+/.test(line);
          }) });
        }

        return {
          title: title,
          sections: sections.map(function finalize(section, index) {
            return {
              id: 'section-' + (index + 1),
              heading: section.heading || 'Section ' + (index + 1),
              body: section.bodyLines.join('\n').trim(),
              index: index,
            };
          }),
        };
      }

      function normalizeEdits(value) {
        if (!Array.isArray(value)) return [];
        return value.map(function normalizeEdit(edit, index) {
          var source = edit && typeof edit === 'object' ? edit : { note: edit };
          return {
            id: firstString([source.id, source.edit_id]) || 'edit-' + index,
            author: firstString([source.author, source.user_name, source.actor_name]) || 'Plan guidance',
            note: firstString([
              source.edit_summary,
              source.note,
              source.summary,
              source.user_reason,
              source.after_content,
            ]) || 'Plan updated',
            at: firstString([source.at, source.created_at, source.updated_at]),
          };
        });
      }

      function normalizeLegacySteps(steps) {
        if (!Array.isArray(steps)) return [];
        return steps.map(function normalizeStep(step, index) {
          var source = step && typeof step === 'object' ? step : { title: step };
          return {
            id: firstString([source.id]) || 'legacy-' + index,
            heading: firstString([source.title, source.name]) || 'Step ' + (index + 1),
            body: firstString([source.detail, source.description, source.content]),
            index: index,
          };
        });
      }

      function selectPayload(payload) {
        var source = payload && typeof payload === 'object' ? payload : {};
        if (source.structuredContent && typeof source.structuredContent === 'object') {
          source = source.structuredContent;
        }
        if (source.plan_session && typeof source.plan_session === 'object') {
          source = source.plan_session;
        } else if (source.selected_session && typeof source.selected_session === 'object') {
          source = source.selected_session;
        } else if (Array.isArray(source.sessions) && source.sessions.length) {
          source = source.sessions[0];
        } else if (Array.isArray(source.results) && source.results.length) {
          source = source.results[0];
        }
        return source && typeof source === 'object' ? source : {};
      }

      function normalizePlanPayload(payload) {
        var source = selectPayload(payload);
        var errorMessage = firstString([
          source.error && source.error.message,
          source.error,
          source.message,
        ]);
        if (source.ok === false || source.isError === true || normalizeStatus(source.status) === 'error') {
          return {
            error: errorMessage || 'The plan session could not be loaded.',
            title: firstString([source.feature_name, source.title, source.name]) || 'Plan unavailable',
          };
        }

        var fallbackTitle = firstString([source.feature_name, source.title, source.name]) || 'New plan';
        var markdown = firstString([
          source.current_plan,
          source.currentPlan,
          source.plan_content,
          source.planContent,
          source.initial_plan,
        ]);
        var documentModel = parsePlanDocument(markdown, fallbackTitle);
        var legacySections = normalizeLegacySteps(source.steps);
        var sections = documentModel.sections.length ? documentModel.sections : legacySections;
        var legacyEdits = [];
        if (Array.isArray(source.steps)) {
          source.steps.forEach(function collectStepEdits(step) {
            if (step && Array.isArray(step.edits)) legacyEdits = legacyEdits.concat(step.edits);
          });
        }

        return {
          id: firstString([source.session_id, source.id, source.uuid]),
          initiativeId: firstString([source.initiative_id, source.initiativeId, source.initiative && source.initiative.id]),
          uri: firstString([source.uri]),
          title: documentModel.title || fallbackTitle,
          status: normalizeStatus(source.status),
          version: Math.max(1, firstNumber([source.plan_version, source.version], 1)),
          sections: sections,
          edits: normalizeEdits(
            Array.isArray(source.edits) && source.edits.length ? source.edits : legacyEdits
          ),
          startedAt: firstString([source.started_at, source.created_at]),
          updatedAt: firstString([source.last_edit_at, source.updated_at, source.started_at]),
          domains: Array.isArray(source.domains_detected) ? source.domains_detected : [],
          demo: source.__demo === true,
          demoSendFails: source.__demo === true && source.__send_fails === true,
        };
      }

      // Shared formatter: "updated 2m ago", "updated yesterday", then the date in the viewer's locale.
      function formatRelative(value) {
        if (!value) return 'not yet updated';
        var label = window.OrgXTime.relative(value, { inline: true });
        return label ? 'updated ' + label : 'recently updated';
      }

      function renderInline(value) {
        return escapeHtml(value)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
      }

      function renderMarkdownBody(value) {
        var lines = String(value || '').split('\n');
        var html = [];
        var paragraph = [];
        var listType = '';
        var listItems = [];

        function flushParagraph() {
          if (!paragraph.length) return;
          html.push('<p>' + renderInline(paragraph.join(' ')) + '</p>');
          paragraph = [];
        }

        function flushList() {
          if (!listItems.length) return;
          html.push('<' + listType + '>' + listItems.map(function renderItem(item) {
            return '<li>' + renderInline(item) + '</li>';
          }).join('') + '</' + listType + '>');
          listItems = [];
          listType = '';
        }

        lines.forEach(function renderLine(line) {
          var unordered = line.match(/^\s*[-*]\s+(.+)$/);
          var ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (unordered || ordered) {
            flushParagraph();
            var nextType = unordered ? 'ul' : 'ol';
            if (listType && listType !== nextType) flushList();
            listType = nextType;
            listItems.push((unordered || ordered)[1]);
            return;
          }
          if (!line.trim()) {
            flushParagraph();
            flushList();
            return;
          }
          flushList();
          paragraph.push(line.trim());
        });

        flushParagraph();
        flushList();
        return html.join('') || '<p>Plan details are still being shaped.</p>';
      }

      function icon(name, size) {
        var paths = {
          ext: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/>',
          chevron: '<path d="m6 9 6 6 6-6"/>',
        };
        return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths[name] + '</svg>';
      }

      function plural(count, word) {
        return count + ' ' + word + (count === 1 ? '' : 's');
      }

      var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

      /* The footer is the state machine (SM3 finishes-here): needs you,
         sending, recorded, not sent. The note survives every failure. */
      var guidance = { phase: 'idle', message: '', draft: '', commandId: null, timer: null };

      function renderLoading() {
        document.querySelector('[data-loading]').hidden = false;
        document.querySelector('[data-content]').hidden = true;
        window.OrgXWidgetRuntime.reportSize();
      }

      function showContent() {
        document.querySelector('[data-loading]').hidden = true;
        var content = document.querySelector('[data-content]');
        content.hidden = false;
        return content;
      }

      function renderError(plan) {
        var content = showContent();
        content.innerHTML =
          '<article class="wcard ox-surface ox-enter" data-edge="red">' +
            '<div class="hd" data-tone="red">' + window.OrgXIcons.icon('plan', 18) + '<span class="kind">Plan</span></div>' +
            '<div class="bd">' +
              '<h1 class="pk-q">Couldn’t load this plan</h1>' +
              '<p class="note">OrgX didn’t return the plan just now. No guidance was sent and nothing changed. Try again in a moment.</p>' +
            '</div>' +
            '<ox-footer variant="reads" state="failed" heading="Not loaded" detail="nothing changed" action-label="Try again" data-retry></ox-footer>' +
          '</article>';
        content.querySelector('[data-retry]').addEventListener('ox-action', function retry() {
          window.location.reload();
        });
        window.OrgXWidgetRuntime.reportSize();
      }

      function renderMap(plan) {
        var options = plan.sections.map(function option(section, index) {
          return '<option value="' + index + '"' + (index === state.selectedSection ? ' selected' : '') + '>' +
            String(index + 1).padStart(2, '0') + ' · ' + escapeHtml(section.heading) +
          '</option>';
        }).join('');
        var buttons = plan.sections.map(function button(section, index) {
          return (
            '<button type="button" class="plan-map__button" data-section-index="' + index + '" aria-current="' + (index === state.selectedSection ? 'true' : 'false') + '">' +
              '<span class="plan-map__index">' + String(index + 1).padStart(2, '0') + '</span>' +
              '<span class="plan-map__title">' + escapeHtml(section.heading) + '</span>' +
            '</button>'
          );
        }).join('');
        return (
          '<nav class="plan-map" aria-label="Plan sections">' + buttons + '</nav>' +
          '<div class="plan-section-select-wrap">' +
            '<label class="sec-label" for="plan-section-select">Plan section</label>' +
            '<select class="plan-section-select" id="plan-section-select" data-section-select>' + options + '</select>' +
          '</div>'
        );
      }

      // What a first draft needs; each opens the composer with a starting phrase.
      var STARTERS = [
        { lead: 'Outcome: ', title: 'The outcome you want', hint: 'What is true when this plan is done' },
        { lead: 'Constraint: ', title: 'A constraint to respect', hint: 'Budget, deadline, or a line not to cross' },
        { lead: 'First move: ', title: 'The first move', hint: 'What should happen this week' },
      ];
      var CHEVRON_RIGHT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

      function renderSelectedSection(plan) {
        var section = plan.sections[state.selectedSection] || plan.sections[0];
        if (!section) {
          return (
            '<section class="plan-empty" aria-labelledby="plan-empty-title">' +
              '<span class="plan-empty__icon">' + window.OrgXIcons.icon('plan', 20) + '</span>' +
              '<h2 class="plan-empty__title" id="plan-empty-title">Nothing written yet</h2>' +
              '<p class="plan-empty__text">Start with one of these. OrgX writes the first draft from it.</p>' +
              '<div class="plan-starters">' + STARTERS.map(function starter(item, index) {
                return '<button type="button" class="plan-starter" data-starter="' + index + '"><span><b>' + escapeHtml(item.title) + '</b><span>' + escapeHtml(item.hint) + '</span></span>' + CHEVRON_RIGHT + '</button>';
              }).join('') + '</div>' +
            '</section>'
          );
        }
        return (
          '<section class="plan-well" aria-labelledby="selected-section-title">' +
            '<h2 class="plan-section__title" id="selected-section-title">' + escapeHtml(section.heading) + '</h2>' +
            '<div class="plan-section__body-wrap" data-section-body-wrap>' +
              '<div class="plan-section__body" data-section-body>' + renderMarkdownBody(section.body) + '</div>' +
            '</div>' +
            '<button type="button" class="plan-expand" data-expand-section aria-expanded="false">Show full section</button>' +
          '</section>'
        );
      }

      function initials(name) {
        var parts = String(name || '').replace(/[^\p{L}\p{N}\s'-]/gu, ' ').split(/[\s_-]+/).filter(Boolean);
        return parts.length ? parts.slice(0, 2).map(function (part) { return part[0].toUpperCase(); }).join('') : 'O';
      }

      function authorMark(author) {
        if (!author || author === 'Plan guidance') return window.OrgXIcons.icon('note', 16);
        if (author === 'You' || author === 'Preview') return window.OrgXIcons.icon('person', 16);
        return escapeHtml(initials(author));
      }

      function renderActivity(plan) {
        if (!plan.edits.length) {
          return (
            '<div class="plan-quiet" role="status">' + window.OrgXIcons.icon('note', 18) +
              '<b>No guidance yet</b>' +
              '<span>Corrections and constraints you add appear here, and OrgX folds them into the next version.</span>' +
            '</div>'
          );
        }
        return '<div class="plan-activity" role="list">' + plan.edits.map(function activity(edit) {
          var author = edit.author === 'Plan guidance' ? 'OrgX' : edit.author;
          return (
            '<div class="plan-activity__item" role="listitem">' +
              '<span class="plan-author" aria-hidden="true">' + authorMark(edit.author) + '</span>' +
              '<div>' +
                '<div class="plan-activity__note">' + escapeHtml(edit.note) + '</div>' +
                '<div class="meta">' + escapeHtml(author) + ' · ' + escapeHtml(formatRelative(edit.at).replace(/^updated /, '')) + '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('') + '</div>';
      }

      // OrgX has no plan-session page: the builder opens the plan's initiative,
      // or mission control carrying the session (was /planning/sessions/:id, a 404).
      function buildPlanUrl(plan) {
        return window.OrgXLinks.planSession(plan.id, { initiativeId: plan.initiativeId });
      }

      function renderComposer(plan) {
        if (!state.composerOpen) return '';
        var section = plan.sections[state.selectedSection] || null;
        var context = section ? 'Guide “' + section.heading + '”' : 'Guide this plan';
        return (
          '<section class="plan-composer" data-composer aria-label="Plan guidance">' +
            '<label class="plan-composer__title" for="plan-guidance-input">' + escapeHtml(context) + '</label>' +
            '<textarea class="plan-textarea" id="plan-guidance-input" data-guidance-input placeholder="Add one specific change, constraint, or correction. Your words become durable context for the next iteration.">' + escapeHtml(guidance.draft) + '</textarea>' +
            '<div class="plan-feedback" data-feedback role="status"' + (guidance.message ? ' data-tone="error"' : '') + '>' + escapeHtml(guidance.phase === 'idle' ? guidance.message : '') + '</div>' +
          '</section>'
        );
      }

      /* One footer for every state; the open-plan link stays in its action slot. */
      function footerView(plan) {
        var isComplete = plan.status === 'complete';
        if (guidance.phase === 'sending') {
          return { variant: 'finishes-here', state: 'sending', heading: 'Sending', detail: 'your guidance', primary: 'Sending…' };
        }
        if (guidance.phase === 'failed') {
          return { variant: 'finishes-here', state: 'failed', heading: 'Not sent', detail: 'your note is still here', primary: 'Retry', action: 'cancel' };
        }
        // Short heading and detail: at 375 the footer also holds Open and the primary.
        if (state.composerOpen) {
          return { variant: 'finishes-here', state: 'needs-you', heading: 'Your note', detail: 'shapes v' + (plan.version + 1), primary: 'Send', action: 'cancel' };
        }
        if (isComplete) {
          return { variant: 'confirms-in-orgx', state: 'confirmed', heading: 'Accepted v' + plan.version, detail: 'ready for work' };
        }
        if (guidance.phase === 'recorded') {
          return { variant: 'finishes-here', state: 'needs-you', heading: 'Guidance recorded', detail: guidance.message, primary: 'Guide this plan' };
        }
        return { variant: 'finishes-here', state: 'needs-you', heading: 'Draft v' + plan.version, detail: plan.sections.length ? 'add guidance' : 'start it', primary: 'Guide this plan' };
      }

      function renderFooter(plan) {
        var view = footerView(plan);
        var action = view.action === 'cancel'
          ? '<button type="button" slot="action" class="ft-link" data-cancel-guidance>Cancel</button>'
          : '<a slot="action" class="ft-link" data-open-plan href="' + escapeHtml(buildPlanUrl(plan)) + '" target="_blank" rel="noreferrer" aria-label="Open plan, opens OrgX"><span>Open</span><span class="ft-long"> plan</span>' + icon('ext', 12) + '</a>';
        return (
          '<ox-footer id="planFooter" variant="' + view.variant + '" state="' + view.state + '"' +
            ' heading="' + escapeHtml(view.heading) + '" detail="' + escapeHtml(view.detail || '') + '"' +
            (view.primary ? ' primary-label="' + escapeHtml(view.primary) + '"' : '') + '>' +
            action +
          '</ox-footer>'
        );
      }

      function renderPlan(plan) {
        state.plan = plan;
        if (state.selectedSection >= plan.sections.length) state.selectedSection = 0;
        var content = showContent();

        var isComplete = plan.status === 'complete';
        var lastEdit = plan.edits[0] || null;
        var meta = [plan.sections.length ? plural(plan.sections.length, 'section') : 'No sections yet'].concat(plan.domains.slice(0, 3).map(function (domain) {
          return String(domain).charAt(0).toUpperCase() + String(domain).slice(1);
        })).join(' · ');
        var hasWork = plan.sections.length > 0 || plan.edits.length > 0;
        var showWorkbench = !isComplete || state.completeExpanded;
        var edge = isComplete ? 'teal' : guidance.phase === 'failed' ? 'red' : 'amber';

        content.innerHTML =
          '<article class="wcard ox-surface' + (state.entered ? '' : ' ox-enter') + '" data-plan-status="' + plan.status + '" data-edge="' + edge + '">' +
            '<div class="hd" data-tone="' + (isComplete ? 'teal' : 'amber') + '">' +
              window.OrgXIcons.icon('plan', 18) +
              '<span class="kind">Plan</span>' +
              '<span class="src">v' + plan.version + (isComplete ? ' · accepted' : ' · draft') + '</span>' +
              '<span class="sp"></span>' +
              '<span class="meta">' + escapeHtml(formatRelative(plan.updatedAt)) + '</span>' +
            '</div>' +
            '<div class="bd">' +
              (lastEdit && !isComplete
                ? '<p class="last-note"><span>' + escapeHtml(lastEdit.author === 'Plan guidance' ? 'Latest guidance' : lastEdit.author === 'You' || lastEdit.author === 'Preview' ? 'Your note' : lastEdit.author + '’s note') + ', ' + escapeHtml(formatRelative(lastEdit.at).replace(/^updated /, '')) + ':</span> ' + escapeHtml(lastEdit.note) + '</p>'
                : '') +
              '<h1 class="pk-q">' + escapeHtml(plan.title) + '</h1>' +
              '<div class="plan-meta"><span class="meta">' + escapeHtml(meta) + '</span>' +
                (isComplete
                  ? '<button type="button" class="plan-toggle" data-toggle-complete aria-expanded="' + state.completeExpanded + '">' +
                      (state.completeExpanded ? 'Collapse accepted plan' : 'Review accepted plan') + icon('chevron', 14) +
                    '</button>'
                  : '') +
              '</div>' +
              (showWorkbench && !hasWork
                // Nothing written and no guidance: no tabs over nothing, just the starting points.
                ? renderSelectedSection(plan)
                : showWorkbench
                ? '<div class="plan-lenses" role="tablist" aria-label="Plan views">' +
                    '<button type="button" class="plan-lens" role="tab" data-lens="plan" aria-selected="' + (state.lens === 'plan') + '">Plan</button>' +
                    '<button type="button" class="plan-lens" role="tab" data-lens="activity" aria-selected="' + (state.lens === 'activity') + '">Guidance' + (plan.edits.length ? '<span class="count">' + plan.edits.length + '</span>' : '') + '</button>' +
                  '</div>' +
                  '<div class="plan-panel" role="tabpanel">' +
                    (state.lens === 'plan'
                      ? (plan.sections.length
                          ? '<div class="plan-workbench">' + renderMap(plan) + renderSelectedSection(plan) + '</div>'
                          : renderSelectedSection(plan))
                      : renderActivity(plan)) +
                  '</div>'
                : '') +
              (isComplete ? '' : renderComposer(plan)) +
            '</div>' +
            renderFooter(plan) +
          '</article>';

        state.entered = true;
        bindInteractions();
        window.OrgXWidgetRuntime.reportSize();
      }

      function updateSectionClamp() {
        var wrap = document.querySelector('[data-section-body-wrap]');
        var body = document.querySelector('[data-section-body]');
        var button = document.querySelector('[data-expand-section]');
        if (!wrap || !body || !button) return;
        var clamped = body.scrollHeight > 282;
        wrap.dataset.clamped = String(clamped);
        button.classList.toggle('is-visible', clamped);
      }

      function readDraft() {
        var input = document.querySelector('[data-guidance-input]');
        if (input) guidance.draft = input.value;
        return guidance.draft;
      }

      function focusComposer() {
        var input = document.querySelector('[data-guidance-input]');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }

      function openComposer(trigger) {
        state.composerOpen = true;
        state.trigger = trigger;
        guidance.phase = 'idle';
        guidance.message = '';
        renderPlan(state.plan);
        focusComposer();
      }

      function closeComposer(options) {
        var restoreFocus = !options || options.restoreFocus !== false;
        state.composerOpen = false;
        guidance.phase = 'idle';
        guidance.message = '';
        guidance.draft = '';
        renderPlan(state.plan);
        if (restoreFocus) {
          var footer = document.getElementById('planFooter');
          if (footer && footer.focus) footer.focus();
        }
      }

      function readResult(result) {
        var runtime = window.OrgXWidgetRuntime;
        if (runtime && typeof runtime.extractStructuredWidgetData === 'function') {
          return runtime.extractStructuredWidgetData(result, true);
        }
        return result && typeof result === 'object' && result.structuredContent ? result.structuredContent : result;
      }

      // When recording the edit is itself a queued command, follow it rather
      // than calling it recorded the moment the request returns.
      function followCommand(commandId) {
        return new Promise(function poll(resolve, reject) {
          function check() {
            Promise.resolve(window.OrgXWidgetRuntime.callTool('orgx_command_status', { kind: 'command', id: commandId }))
              .then(function settle(result) {
                var status = readResult(result) || {};
                if (status.state === 'failed' || status.state === 'cancelled') {
                  reject(new Error(status.outcome || 'guidance_not_recorded'));
                  return;
                }
                if (typeof status.next_poll_after_ms === 'number' && isFinite(status.next_poll_after_ms)) {
                  guidance.timer = window.setTimeout(check, Math.max(1000, status.next_poll_after_ms));
                  return;
                }
                resolve(status);
              })
              .catch(reject);
          }
          check();
        });
      }

      async function submitGuidance() {
        var note = readDraft().trim();
        var feedback = document.querySelector('[data-feedback]');
        if (!note) {
          if (feedback) {
            feedback.textContent = 'Add a specific correction or constraint first.';
            feedback.dataset.tone = 'error';
          }
          focusComposer();
          unlockFooter();
          return;
        }
        if (!state.plan.id && !state.plan.demo) {
          if (feedback) {
            feedback.textContent = 'This plan has no session ID, so guidance cannot be recorded yet.';
            feedback.dataset.tone = 'error';
          }
          unlockFooter();
          return;
        }

        var section = state.plan.sections[state.selectedSection] || null;
        var summary = (section ? section.heading + ': ' : '') + note.replace(/\s+/g, ' ');
        guidance.phase = 'sending';
        renderPlan(state.plan);

        try {
          if (state.plan.demoSendFails) throw new Error('guidance_not_recorded');
          if (!state.plan.demo) {
            var result = await window.OrgXWidgetRuntime.callTool('orgx_plan', {
              action: 'record_edit',
              session_id: state.plan.id,
              edit_summary: summary,
            });
            if (
              result == null ||
              (result && typeof result === 'object' &&
                (result.isError === true || result.ok === false))
            ) {
              throw new Error('guidance_not_recorded');
            }
            var out = readResult(result);
            var commandId = out && typeof out === 'object' ? (out.command_id || out.commandId) : null;
            if (typeof commandId === 'string' && UUID_RE.test(commandId)) await followCommand(commandId);
          }
          state.plan.edits.unshift({
            id: 'local-' + Date.now(),
            author: state.plan.demo ? 'Preview' : 'You',
            note: note,
            at: new Date().toISOString(),
          });
          state.composerOpen = false;
          state.lens = 'activity';
          guidance.phase = 'recorded';
          guidance.draft = '';
          guidance.message = state.plan.demo
            ? 'preview only · no production plan changed'
            : 'the next iteration has context';
          renderPlan(state.plan);
        } catch (_) {
          guidance.phase = 'failed';
          guidance.message = 'Guidance was not recorded. Your note is still here.';
          renderPlan(state.plan);
          focusComposer();
        }
      }

      function unlockFooter() {
        var footer = document.getElementById('planFooter');
        if (footer) footer.setAttribute('state', footer.getAttribute('state') || 'needs-you');
      }

      function onFooterPrimary() {
        if (guidance.phase === 'sending') return;
        if (state.composerOpen || guidance.phase === 'failed') {
          submitGuidance();
          return;
        }
        openComposer(document.getElementById('planFooter'));
      }

      function bindInteractions() {
        document.querySelectorAll('[data-lens]').forEach(function bindLens(button) {
          button.addEventListener('click', function changeLens() {
            readDraft();
            state.lens = button.dataset.lens;
            renderPlan(state.plan);
          });
        });

        document.querySelectorAll('[data-section-index]').forEach(function bindSection(button) {
          button.addEventListener('click', function selectSection() {
            readDraft();
            state.selectedSection = Number(button.dataset.sectionIndex) || 0;
            renderPlan(state.plan);
          });
        });

        var select = document.querySelector('[data-section-select]');
        if (select) {
          select.addEventListener('change', function selectSection() {
            readDraft();
            state.selectedSection = Number(select.value) || 0;
            renderPlan(state.plan);
          });
        }

        var expand = document.querySelector('[data-expand-section]');
        if (expand) {
          expand.addEventListener('click', function toggleSection() {
            var wrap = document.querySelector('[data-section-body-wrap]');
            var expanded = expand.getAttribute('aria-expanded') === 'true';
            expand.textContent = expanded ? 'Show full section' : 'Collapse section';
            // Height animates between the preview and the whole section (instant under reduced motion).
            window.OrgXWidgetRuntime.motion.setClamped(wrap, expanded, expand, { expandedClass: 'is-expanded' });
          });
        }

        var footer = document.getElementById('planFooter');
        if (footer) footer.addEventListener('ox-primary', onFooterPrimary);

        document.querySelectorAll('[data-starter]').forEach(function bindStarter(button) {
          button.addEventListener('click', function startWith() {
            var starter = STARTERS[Number(button.dataset.starter) || 0];
            if (!guidance.draft || !guidance.draft.trim()) guidance.draft = starter.lead;
            openComposer(button);
          });
        });

        var cancel = document.querySelector('[data-cancel-guidance]');
        if (cancel) cancel.addEventListener('click', function () { closeComposer(); });

        var completeToggle = document.querySelector('[data-toggle-complete]');
        if (completeToggle) {
          completeToggle.addEventListener('click', function toggleComplete() {
            state.completeExpanded = !state.completeExpanded;
            renderPlan(state.plan);
            document.querySelector('[data-toggle-complete]')?.focus();
          });
        }

        var input = document.querySelector('[data-guidance-input]');
        if (input) {
          input.addEventListener('input', function keepDraft() { guidance.draft = input.value; });
          input.addEventListener('keydown', function handleComposerKey(event) {
            if (event.key === 'Escape') {
              event.preventDefault();
              closeComposer();
            }
            if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
              event.preventDefault();
              submitGuidance();
            }
          });
        }

        var link = document.querySelector('[data-open-plan]');
        if (link) {
          link.addEventListener('click', function openPlan(event) {
            window.OrgXWidgetRuntime.openWidgetLink(link.href, event);
          });
        }

        window.requestAnimationFrame(updateSectionClamp);
      }

      function renderPayload(payload) {
        if (!payload) {
          renderLoading();
          return;
        }
        var plan = normalizePlanPayload(payload);
        if (plan.error) {
          renderError(plan);
          return;
        }
        if (
          state.plan &&
          plan.id &&
          plan.id === state.plan.id &&
          plan.sections.length === 0 &&
          state.plan.sections.length > 0
        ) {
          plan = {
            ...state.plan,
            ...plan,
            title: plan.title === 'New plan' ? state.plan.title : plan.title,
            sections: state.plan.sections,
            domains: plan.domains.length ? plan.domains : state.plan.domains,
            edits: plan.edits.length ? plan.edits : state.plan.edits,
          };
        }
        state.selectedSection = Math.max(
          0,
          plan.sections.findIndex(function findOutcome(section) {
            return /^outcome$/i.test(section.heading);
          })
        );
        state.lens = 'plan';
        state.composerOpen = false;
        state.completeExpanded = false;
        renderPlan(plan);
      }

      function fixture(name) {
        var base = {
          __demo: true,
          id: '06bc7c7d-2778-4e2f-ab10-28f4b3e16554',
          feature_name: 'Own the Agent Work Answer Layer',
          status: name === 'complete' || name === 'resolved' ? 'completed' : 'active',
          plan_version: name === 'complete' || name === 'resolved' ? 3 : 1,
          updated_at: new Date(Date.now() - 6 * 60000).toISOString(),
          domains_detected: ['product', 'engineering'],
          current_plan:
            '# Own the Agent Work Answer Layer\n\n' +
            '## Outcome\n' +
            'Make OrgX the canonical, proof-backed answer source for agent work continuity, authority, receipts, and infrastructure choices.\n\n' +
            '## Workstreams\n' +
            '1. Answer Room platform with durable routes, proof UI, accessibility, and crawler-visible HTML.\n' +
            '2. Buyer-answer corpus with 20 proof-backed launch answers before expansion.\n' +
            '3. Measurement with provider, run, citation, accuracy, and outcome provenance.\n\n' +
            '## Release discipline\n' +
            'Ship incremental slices. Keep code, tests, merge, deploy, and live proof as separate states.\n\n' +
            '## Gates\n' +
            '- Every public claim links to evidence or is labeled partial.\n' +
            '- Human approval remains explicit for recommendations.\n' +
            '- Each slice passes its focused contract and rendered-state checks.\n\n' +
            '## Non-goals\n' +
            'No invented customer proof, duplicate evidence ledgers, or claim that merged equals deployed.',
          edits: [
            {
              author: 'Hope',
              edit_summary: 'Gates: keep live proof separate from deployment status.',
              created_at: new Date(Date.now() - 4 * 60000).toISOString(),
            },
          ],
        };

        if (name === 'not-sent') base.__send_fails = true;
        if (name === 'no-guidance') base.edits = [];
        if (name === 'empty') {
          base.feature_name = 'New governed workflow';
          base.current_plan = '';
          base.edits = [];
        }
        if (name === 'error' || name === 'degraded') {
          return {
            __demo: true,
            status: 'error',
            title: 'Plan data unavailable',
            error: { message: 'fixture error' },
            ok: false,
          };
        }
        if (name === 'long') {
          base.current_plan +=
            '\n\n## Verification matrix\n' +
            Array.from({ length: 14 }, function (_, index) {
              return (index + 1) + '. Verify evidence boundary ' + (index + 1) + ' across local, CI, merge, deploy, and production usage without collapsing states.';
            }).join('\n');
        }
        return base;
      }

      window.OrgXPlanWidgetModel = {
        normalizePlanPayload: normalizePlanPayload,
        parsePlanDocument: parsePlanDocument,
        renderMarkdownBody: renderMarkdownBody,
      };

      var booted = false;
      document.addEventListener('DOMContentLoaded', function boot() {
        // Boot once: a second DOMContentLoaded must not reset an open composer.
        if (booted) return;
        booted = true;
        var params = new URLSearchParams(window.location.search);
        var previewState = params.get('state') || '';
        var loading = params.get('loading') === 'true' || previewState === 'loading';
        var demo = params.get('demo') === 'true';
        var protocol = window.OrgXWidgetRuntime.detectProtocol();

        if (protocol === 'standalone') {
          if (loading) renderLoading();
          else if (demo || ['long', 'complete', 'resolved', 'error', 'degraded', 'not-sent', 'no-guidance'].indexOf(previewState) >= 0) {
            renderPayload(fixture(previewState || 'populated'));
          } else {
            renderPayload(fixture('empty'));
          }
          return;
        }

        window.OrgXWidgetRuntime.initWidget({
          live: {
            anchor: '.widget-shell-card',
            widget: 'plan-session-live',
            emptyLabel: 'No agents running',
          },
          render: renderPayload,
        });
      });

      window.addEventListener('resize', function resize() {
        updateSectionClamp();
        window.OrgXWidgetRuntime.reportSize();
      });
    })();
  </script>
</body>
</html>
