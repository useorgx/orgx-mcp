<!DOCTYPE html>
<html lang="en" data-widget-mode="command" data-accent="neutral">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrgX Widget Gallery</title>
  <link rel="stylesheet" href="shared/tokens.css" />
  <link rel="stylesheet" href="shared/widget-foundation.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <script>
    (function () {
      const theme = new URLSearchParams(location.search).get('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeSource = 'url';
      }
    })();
  </script>
  <style>
    :root { --ox-primary: #111827; --ox-primary-rgb: 17, 24, 39; }
    body { padding: 20px; }
    .gallery {
      width: min(1400px, 100%);
      margin: 0 auto;
    }
    .gallery-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 6px 4px 18px;
    }
    .gallery-head__copy { min-width: 0; }
    .gallery-head h1 {
      margin: 5px 0 4px;
      color: var(--ox-text);
      font-size: clamp(1.45rem, 3vw, 2rem);
      letter-spacing: -.05em;
    }
    .gallery-head p {
      max-width: 68ch;
      margin: 0;
      color: var(--ox-text-muted);
      font-size: .86rem;
      line-height: 1.5;
    }
    .gallery-theme {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--ox-border);
      border-radius: 12px;
      background: var(--ox-panel);
      color: var(--ox-text);
      cursor: pointer;
    }
    .workbench {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      background: var(--ox-panel);
      box-shadow: var(--ox-shadow);
    }
    .workbench::after {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--ox-primary-rgb), .65), transparent);
    }
    .workbench-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(120px, auto)) auto;
      gap: 10px;
      align-items: end;
      padding: 14px 16px;
      border-bottom: 1px solid var(--ox-border);
    }
    .state-key {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--ox-border);
      background: color-mix(in srgb, var(--ox-well-bg) 46%, transparent);
      color: var(--ox-text-muted);
      font: 600 .62rem var(--ox-mono);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .state-key__label { color: var(--ox-text-dim); }
    .state-key__item { display: inline-flex; align-items: center; gap: 6px; }
    .state-key__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .state-key__item[data-state="loading"] { color: var(--ox-text-muted); }
    .state-key__item[data-state="progress"] { color: var(--ox-teal); }
    .state-key__item[data-state="complete"] { color: var(--ox-success, #22c55e); }
    .state-key__item[data-state="attention"] { color: var(--ox-warning, #fbbf24); }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .field label {
      color: var(--ox-text-muted);
      font: 700 .56rem var(--ox-mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .field input,
    .field select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--ox-border);
      border-radius: 10px;
      background: var(--ox-well-bg);
      color: var(--ox-text);
      padding: 0 12px;
      font: 600 .78rem var(--ox-font);
    }
    .field input:focus-visible,
    .field select:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid rgba(var(--ox-primary-rgb), .75);
      outline-offset: 2px;
    }
    .open-preview {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid rgba(var(--ox-primary-rgb), .26);
      background: rgba(var(--ox-primary-rgb), .1);
      color: var(--ox-text);
      text-decoration: none;
      font-size: .76rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .workbench-body {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 680px;
    }
    .catalog {
      min-width: 0;
      border-right: 1px solid var(--ox-border);
      background: color-mix(in srgb, var(--ox-well-bg) 55%, transparent);
    }
    .catalog-head {
      padding: 14px;
      border-bottom: 1px solid var(--ox-border);
    }
    .catalog-search {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--ox-border);
      border-radius: 10px;
      background: var(--ox-panel);
      color: var(--ox-text);
      font: 500 .78rem var(--ox-font);
    }
    .catalog-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      color: var(--ox-text-muted);
      font: 700 .56rem var(--ox-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .catalog-list {
      max-height: 620px;
      overflow: auto;
      padding: 6px 0;
    }
    .catalog-item {
      position: relative;
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 10px;
      align-items: center;
      padding: 9px 14px;
      border: 0;
      background: transparent;
      color: var(--ox-text);
      text-align: left;
      cursor: pointer;
    }
    .catalog-item::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: transparent;
    }
    .catalog-item:hover { background: rgba(var(--ox-primary-rgb), .05); }
    .catalog-item[aria-selected="true"] {
      background: rgba(var(--ox-primary-rgb), .09);
    }
    .catalog-item[aria-selected="true"]::before { background: var(--ox-primary); }
    .catalog-item__name {
      min-width: 0;
      font-size: .8rem;
      font-weight: 700;
    }
    .catalog-item__job {
      grid-column: 1 / -1;
      overflow: hidden;
      color: var(--ox-text-muted);
      font-size: .68rem;
      line-height: 1.3;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .catalog-item__mode {
      color: var(--ox-text-muted);
      font: 700 .54rem var(--ox-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .preview {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 58px;
      padding: 9px 16px;
      border-bottom: 1px solid var(--ox-border);
    }
    .preview-identity { min-width: 0; }
    .preview-title {
      color: var(--ox-text);
      font-size: .9rem;
      font-weight: 750;
    }
    .preview-question {
      margin-top: 2px;
      overflow: hidden;
      color: var(--ox-text-muted);
      font-size: .7rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .preview-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ox-teal);
      font: 700 .58rem var(--ox-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .preview-status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
    }
    .preview-stage {
      flex: 1;
      overflow: auto;
      padding: 20px;
      background:
        linear-gradient(var(--ox-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--ox-grid) 1px, transparent 1px),
        var(--ox-bg);
      background-size: 20px 20px;
    }
    .frame-shell {
      width: 100%;
      min-height: 600px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--ox-border);
      border-radius: 14px;
      background: var(--ox-bg);
      box-shadow: 0 16px 36px -28px rgba(0,0,0,.7);
      transition: width 220ms cubic-bezier(.16,1,.3,1);
    }
    .frame-shell[data-viewport="tablet"] { width: min(768px, 100%); }
    .frame-shell[data-viewport="phone"] { width: min(375px, 100%); }
    .frame-shell iframe {
      display: block;
      width: 100%;
      height: 680px;
      border: 0;
      background: var(--ox-bg);
    }
    .catalog-empty {
      padding: 28px 16px;
      color: var(--ox-text-muted);
      font-size: .78rem;
      text-align: center;
    }
    @media (max-width: 980px) {
      .workbench-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workbench-bar .field:first-child { grid-column: 1 / -1; }
      .open-preview { align-self: end; }
      .workbench-body { grid-template-columns: 220px minmax(0, 1fr); }
    }
    @media (max-width: 720px) {
      body { padding: 10px; }
      .gallery-head { align-items: center; }
      .gallery-head p { display: none; }
      .workbench-bar { grid-template-columns: 1fr 1fr; padding: 12px; }
      .workbench-body { display: flex; min-height: 0; flex-direction: column; }
      .catalog { border-right: 0; border-bottom: 1px solid var(--ox-border); }
      .catalog-list {
        display: flex;
        max-height: none;
        overflow-x: auto;
        padding: 6px;
      }
      .catalog-item {
        min-width: 168px;
        border-bottom: 3px solid transparent;
        border-radius: 8px;
      }
      .catalog-item::before { display: none; }
      .catalog-item[aria-selected="true"] { border-bottom-color: var(--ox-primary); }
      .catalog-head { padding: 10px; }
      .catalog-meta { display: none; }
      .preview-stage { padding: 10px; }
      .frame-shell,
      .frame-shell[data-viewport] { width: 100%; min-height: 540px; }
      .frame-shell iframe { height: 620px; }
    }
    @media (max-width: 430px) {
      .workbench-bar { grid-template-columns: 1fr; }
      .workbench-bar .field:first-child { grid-column: auto; }
      .open-preview { width: 100%; }
      .preview-head { align-items: flex-start; }
      .preview-status { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .frame-shell { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
  <main class="gallery">
    <header class="gallery-head">
      <div class="gallery-head__copy">
        <div class="widget-kicker">OrgX widget systems</div>
        <h1>Widget gallery</h1>
        <p>Find one widget, put it in a real operating state, and inspect the exact production HTML at the viewport and theme that matter.</p>
      </div>
      <button class="gallery-theme" type="button" id="galleryTheme" aria-label="Toggle gallery theme" title="Toggle gallery theme">◐</button>
    </header>

    <section class="workbench" aria-label="Widget QA workbench">
      <div class="workbench-bar">
        <div class="field">
          <label for="widgetSelect">Widget</label>
          <select id="widgetSelect"></select>
        </div>
        <div class="field">
          <label for="stateSelect">State</label>
          <select id="stateSelect">
            <option value="populated">Populated</option>
            <option value="loading">Loading</option>
            <option value="progressing">In progress</option>
            <option value="completed">Completed</option>
            <option value="blocked">Blocked</option>
            <option value="empty">Empty</option>
            <option value="long">Long content</option>
            <option value="error">Degraded</option>
            <option value="stale">Needs refresh</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
        <div class="field">
          <label for="previewTheme">Preview theme</label>
          <select id="previewTheme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <div class="field">
          <label for="viewportSelect">Viewport</label>
          <select id="viewportSelect">
            <option value="desktop">Fluid desktop</option>
            <option value="tablet">768px tablet</option>
            <option value="phone">375px phone</option>
          </select>
        </div>
        <a class="open-preview" id="openPreview" href="#" target="_blank" rel="noreferrer">Open preview ↗</a>
      </div>

      <div class="state-key" aria-label="Widget state legend">
        <span class="state-key__label">State contract</span>
        <span class="state-key__item" data-state="loading"><span class="state-key__dot"></span>Loading</span>
        <span class="state-key__item" data-state="progress"><span class="state-key__dot"></span>In progress</span>
        <span class="state-key__item" data-state="complete"><span class="state-key__dot"></span>Completed</span>
        <span class="state-key__item" data-state="attention"><span class="state-key__dot"></span>Blocked / needs refresh</span>
      </div>

      <div class="workbench-body">
        <aside class="catalog" aria-label="Widget catalog">
          <div class="catalog-head">
            <input class="catalog-search" id="catalogSearch" type="search" placeholder="Find a widget or job…" aria-label="Search widgets" />
            <div class="catalog-meta"><span id="catalogCount">0 widgets</span><span>↑↓ to move</span></div>
          </div>
          <div class="catalog-list" id="catalogList" role="listbox" aria-label="Available widgets"></div>
        </aside>

        <section class="preview" aria-live="polite">
          <div class="preview-head">
            <div class="preview-identity">
              <div class="preview-title" id="previewTitle"></div>
              <div class="preview-question" id="previewQuestion"></div>
            </div>
            <div class="preview-status" id="previewStatus">Fixture ready</div>
          </div>
          <div class="preview-stage">
            <div class="frame-shell" id="frameShell" data-viewport="desktop">
              <iframe id="previewFrame" title="OrgX widget preview"></iframe>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const widgets = [
        { id: 'artifact-review', name: 'Artifact Review', file: 'artifact-review.html', mode: 'Escalation', job: 'Judge evidence and sign off at the point of consequence.', advanced: true },
        { id: 'task-spawned', name: 'Task Spawned', file: 'task-spawned.html', mode: 'Command', job: 'Confirm dispatch, owner, execution surface, and proof.', advanced: true, supportsStates: ['populated', 'loading', 'progressing', 'completed', 'blocked', 'empty', 'long', 'error', 'stale', 'resolved'] },
        { id: 'search-results', name: 'Search Results', file: 'search-results.html', mode: 'Readout', job: 'Find the strongest organizational answer quickly.', advanced: true },
        { id: 'decisions', name: 'Decisions', file: 'decisions.html', mode: 'Escalation', job: 'Resolve the judgment currently blocking execution.', advanced: true },
        { id: 'plan-session-live', name: 'Plan Session Live', file: 'plan-session-live.html', mode: 'Creation', job: 'Watch a plan become owned and executable.' },
        { id: 'agent-status', name: 'Agent Status', file: 'agent-status.html', mode: 'Command', job: 'See which agent needs intervention now.', supportsStates: ['populated', 'loading', 'progressing', 'completed', 'blocked', 'empty', 'stale', 'resolved'] },
        { id: 'initiative-pulse', name: 'Initiative Pulse', file: 'initiative-pulse.html', mode: 'Command', job: 'Read initiative health and the exception changing it.' },
        { id: 'morning-brief', name: 'Morning Brief', file: 'morning-brief.html', mode: 'Readout', job: 'Orient to the day through exceptions and priorities.' },
        { id: 'daily-brief', name: 'Daily Brief', file: 'daily-brief.html', mode: 'Readout', job: 'Resume from the next useful operating move.' },
        { id: 'scaffolded-initiative', name: 'Scaffolded Initiative', file: 'scaffolded-initiative.html', mode: 'Creation', job: 'Inspect the hierarchy created from a goal.' },
        { id: 'scaffold-streaming', name: 'Scaffold Streaming', file: 'scaffold-streaming.html', mode: 'Creation', job: 'Observe entity creation as the scaffold builds.' }
      ];
      const byId = new Map(widgets.map(widget => [widget.id, widget]));
      const params = new URLSearchParams(location.search);
      let selectedId = byId.has(params.get('widget')) ? params.get('widget') : 'artifact-review';

      const elements = {
        widget: document.getElementById('widgetSelect'),
        state: document.getElementById('stateSelect'),
        theme: document.getElementById('previewTheme'),
        viewport: document.getElementById('viewportSelect'),
        search: document.getElementById('catalogSearch'),
        list: document.getElementById('catalogList'),
        count: document.getElementById('catalogCount'),
        frame: document.getElementById('previewFrame'),
        shell: document.getElementById('frameShell'),
        open: document.getElementById('openPreview'),
        title: document.getElementById('previewTitle'),
        question: document.getElementById('previewQuestion'),
        status: document.getElementById('previewStatus'),
        galleryTheme: document.getElementById('galleryTheme')
      };

      elements.state.value = params.get('state') || 'populated';
      elements.theme.value = params.get('previewTheme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      elements.viewport.value = params.get('viewport') || 'desktop';

      function stateQuery(widget, state) {
        const stateForWidget = state === 'completed' ? 'resolved' : state;
        if (widget.id === 'agent-status') {
          if (state === 'loading') return 'loading=true';
          if (state === 'empty') return '';
          return 'demo=true&state=' + encodeURIComponent(stateForWidget);
        }
        if (widget.advanced) {
          let normalized = stateForWidget;
          if (state === 'populated') normalized = widget.id === 'decisions' || widget.id === 'artifact-review' ? 'urgent' : 'populated';
          // A few readout widgets use their own fixture vocabulary. Keep the
          // gallery's state contract consistent while selecting the closest
          // honest fixture rather than silently rendering an empty frame.
          if (state === 'progressing' && widget.id !== 'task-spawned') normalized = widget.id === 'decisions' || widget.id === 'artifact-review' ? 'urgent' : 'populated';
          if (state === 'blocked' && widget.id !== 'task-spawned') normalized = 'error';
          if (state === 'stale' && widget.id !== 'task-spawned') normalized = 'degraded';
          return 'state=' + encodeURIComponent(normalized);
        }
        if (state === 'loading') return 'loading=true';
        if (state === 'empty' || state === 'error') return '';
        return 'demo=true' + (stateForWidget !== 'populated' ? '&state=' + encodeURIComponent(stateForWidget) : '');
      }

      function previewUrl() {
        const widget = byId.get(selectedId);
        // Mark embedded previews explicitly so widget runtime bypasses host
        // bridges and renders the selected deterministic fixture.
        const query = [stateQuery(widget, elements.state.value), 'theme=' + encodeURIComponent(elements.theme.value), 'gallery=true'].filter(Boolean).join('&');
        return widget.file + (query ? '?' + query : '');
      }

      function syncUrl() {
        const next = new URL(location.href);
        next.searchParams.set('widget', selectedId);
        next.searchParams.set('state', elements.state.value);
        next.searchParams.set('previewTheme', elements.theme.value);
        next.searchParams.set('viewport', elements.viewport.value);
        history.replaceState(null, '', next);
      }

      function renderCatalog() {
        const query = elements.search.value.trim().toLowerCase();
        const filtered = widgets.filter(widget => (widget.name + ' ' + widget.job + ' ' + widget.mode).toLowerCase().includes(query));
        elements.count.textContent = filtered.length + (filtered.length === 1 ? ' widget' : ' widgets');
        elements.list.innerHTML = filtered.length ? filtered.map(widget => (
          '<button type="button" class="catalog-item" role="option" data-widget="' + widget.id + '" aria-selected="' + String(widget.id === selectedId) + '">' +
          '<span class="catalog-item__name">' + widget.name + '</span>' +
          '<span class="catalog-item__mode">' + widget.mode + '</span>' +
          '<span class="catalog-item__job">' + widget.job + '</span>' +
          '</button>'
        )).join('') : '<div class="catalog-empty">No widget matches that operating job.</div>';
        elements.list.querySelectorAll('[data-widget]').forEach(button => {
          button.addEventListener('click', () => selectWidget(button.dataset.widget));
        });
      }

      function renderPreview() {
        const widget = byId.get(selectedId);
        const url = previewUrl();
        elements.widget.value = selectedId;
        elements.title.textContent = widget.name;
        elements.question.textContent = widget.job;
        elements.status.textContent = elements.state.options[elements.state.selectedIndex].text + ' ready';
        elements.shell.dataset.viewport = elements.viewport.value;
        elements.frame.title = widget.name + ' — ' + elements.state.value + ' — ' + elements.theme.value;
        elements.frame.src = url;
        elements.open.href = url;
        syncUrl();
        renderCatalog();
      }

      function selectWidget(id) {
        if (!byId.has(id)) return;
        selectedId = id;
        renderPreview();
      }

      elements.widget.innerHTML = widgets.map(widget => '<option value="' + widget.id + '">' + widget.name + '</option>').join('');
      elements.widget.addEventListener('change', event => selectWidget(event.target.value));
      elements.state.addEventListener('change', renderPreview);
      elements.theme.addEventListener('change', renderPreview);
      elements.viewport.addEventListener('change', renderPreview);
      elements.search.addEventListener('input', renderCatalog);
      elements.search.addEventListener('keydown', event => {
        if (event.key !== 'ArrowDown') return;
        const first = elements.list.querySelector('[data-widget]');
        if (first) { event.preventDefault(); first.focus(); }
      });
      elements.list.addEventListener('keydown', event => {
        if (!['ArrowDown', 'ArrowUp'].includes(event.key)) return;
        const buttons = Array.from(elements.list.querySelectorAll('[data-widget]'));
        const index = buttons.indexOf(document.activeElement);
        const next = buttons[index + (event.key === 'ArrowDown' ? 1 : -1)];
        if (next) { event.preventDefault(); next.focus(); }
      });
      elements.galleryTheme.addEventListener('click', () => {
        const current = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = current === 'dark' ? 'light' : 'dark';
      });

      renderPreview();
    })();
  </script>
</body>
</html>
