<!DOCTYPE html>
<html lang="en" data-accent="lime">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OrgX</title>
  <link rel="stylesheet" href="shared/kit/ox-tokens.css" />
  <link rel="stylesheet" href="shared/interaction-kit.css" />
  <script src="shared/kit/ox-elements.js"></script>
  <script src="shared/mcp-apps-sdk.umd.js"></script>
  <script src="shared/widget-runtime.js"></script>
  <script src="shared/openai-extensions.js"></script>
  <script src="shared/interaction-kit.js"></script>
  <style>
    /* Primaries are the kit's action lime; amber marks only what needs you
       (the attention line, the panel edge, urgency). */
    :root {
      --ox-primary-rgb: 191, 255, 0;
      --pn-gutter: 16px;
      --pn-ease: cubic-bezier(0.16, 1, 0.3, 1);
      --pn-edge: var(--ox-border);
    }
    body { background: var(--ox-bg); color: var(--ox-text); }
    .panel {
      position: relative;
      min-height: 120px;
      padding: 0 var(--pn-gutter) 12px;
      border-top: 1px solid var(--pn-edge);
      font-size: 14px;
      line-height: 1.5;
    }
    .panel[data-tone="amber"] { --pn-edge: rgba(var(--ox-edge-amber-rgb, 217, 154, 6), 0.9); }
    .panel[data-tone="red"] { --pn-edge: rgba(var(--ox-edge-red-rgb, 217, 45, 32), 0.9); }
    .panel[data-tone="teal"] { --pn-edge: rgba(var(--ox-edge-teal-rgb, 20, 163, 143), 0.7); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* Context line: workspace (global H1), sync time, refresh. */
    .top {
      display: flex; align-items: center; gap: 8px; min-height: 48px;
      margin: 0 calc(-1 * var(--pn-gutter)); padding: 0 var(--pn-gutter);
      border-bottom: 1px solid var(--ox-border);
    }
    .top-id { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 1; }
    .brand { font-weight: 700; letter-spacing: -0.01em; flex: none; }
    .top-id h1, .top-id .ws {
      margin: 0; font-size: 14px; font-weight: 500; color: var(--ox-text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .sync {
      font: 500 11.5px/1.3 var(--ox-mono, ui-monospace, monospace);
      color: var(--ox-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .quiet-btn, .text-btn {
      appearance: none; border: 0; background: none; color: var(--ox-text);
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      min-height: 44px; padding: 0 8px; border-radius: 10px;
    }
    .quiet-btn { color: var(--ox-text-muted); }
    .quiet-btn:hover, .text-btn:hover { background: var(--ox-hover, rgba(127, 127, 127, 0.08)); }
    button:focus-visible, a:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--ox-focus, rgba(191, 255, 0, 0.8)); outline-offset: 2px;
    }
    .text-btn { color: var(--ox-primary); padding: 0 4px; }
    .text-btn[aria-disabled="true"] { opacity: 0.6; cursor: default; }

    ox-attention-line { margin: 0 calc(-1 * var(--pn-gutter)); }

    /* Notices: degraded, stale, permission-limited, last ruling. */
    .notice {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      min-height: 44px; margin: 8px 0 0; padding: 6px 12px; border-radius: 12px;
      background: var(--ox-surface-subtle, rgba(127, 127, 127, 0.08));
      color: var(--ox-text); font-size: 13px;
    }
    .notice[data-tone="amber"] { background: var(--ox-warning-surface, rgba(161, 98, 7, 0.09)); }
    .notice[data-tone="red"] { background: var(--ox-danger-surface, rgba(190, 18, 60, 0.08)); }
    .notice p { margin: 0; flex: 1 1 200px; min-width: 0; }

    /* The review packet. */
    .packet { padding-top: 12px; }
    .meta {
      display: flex; align-items: center; gap: 6px; min-width: 0; margin: 0;
      font-size: 12px; color: var(--ox-text-muted);
    }
    .meta-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .urgency { font-weight: 650; flex: none; }
    .urgency[data-u="critical"], .urgency[data-u="high"] { color: var(--ox-warning); }
    .blocked-tag { color: var(--ox-danger); font-weight: 650; flex: none; }
    .open-link {
      flex: none; font-size: 12px; font-weight: 600; color: var(--ox-text-muted);
      min-height: 32px; padding: 0 6px;
    }
    .q {
      margin: 6px 0 10px; font-size: 17px; line-height: 1.3; font-weight: 650;
      letter-spacing: -0.015em; overflow-wrap: anywhere;
    }
    .facts { margin: 0; display: grid; gap: 8px; }
    .fact { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 2px 12px; }
    .fact dt { font-size: 12px; font-weight: 600; color: var(--ox-text-muted); padding-top: 2px; }
    .fact dd { margin: 0; overflow-wrap: anywhere; }
    .evidence { margin-top: 12px; }
    .evidence-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 12px; font-weight: 600; color: var(--ox-text-muted); margin: 0 0 2px;
    }
    .ev-list { list-style: none; margin: 0; padding: 0; }
    .ev-item {
      display: flex; align-items: flex-start; gap: 8px; min-height: 32px; padding: 6px 0;
      border-top: 1px solid var(--ox-border); font-size: 13.5px; overflow-wrap: anywhere;
    }
    .ev-item:first-child { border-top: 0; }
    .ev-mark { flex: none; width: 6px; height: 6px; margin-top: 8px; border-radius: 2px; background: var(--ox-text-muted); opacity: 0.6; }
    .ev-title { flex: 1; min-width: 0; }
    .ev-open {
      appearance: none; border: 0; background: none; flex: none; font: inherit; font-size: 13px; font-weight: 600;
      color: var(--ox-text-muted); min-height: 32px; min-width: 32px; padding: 0 6px; border-radius: 8px; cursor: pointer;
    }
    .ev-open:hover { background: var(--ox-hover, rgba(127, 127, 127, 0.08)); color: var(--ox-text); }

    .actions { margin-top: 14px; }
    /* The kit paints its primary with --ox-action (the homepage lime). */
    ox-footer { margin: 0 calc(-1 * var(--pn-gutter)); }
    .ft-action {
      appearance: none; border: 0; background: none; font: inherit; font-size: 13px;
      font-weight: 600; color: var(--ox-text); min-height: 44px; padding: 0 10px;
      border-radius: 10px; cursor: pointer;
    }
    .ft-action:hover { background: var(--ox-hover, rgba(127, 127, 127, 0.08)); }
    .primary-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
      min-height: 48px; border: 1px solid var(--ox-action-border, transparent); border-radius: 12px;
      background: var(--ox-action); color: var(--ox-action-fg);
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .primary-btn:hover { filter: brightness(0.97); }
    .handoff-detail { margin: 6px 0 0; font-size: 12px; color: var(--ox-text-muted); text-align: center; }
    .composer { display: grid; gap: 8px; }
    .composer label { font-size: 12px; font-weight: 600; color: var(--ox-text-muted); }
    .composer textarea {
      width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px;
      border: 1px solid var(--ox-border-strong); border-radius: 12px;
      background: var(--ox-panel-solid, transparent); color: var(--ox-text); font: inherit; font-size: 14px;
    }
    .composer-row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .secondary-btn {
      appearance: none; min-height: 44px; padding: 0 14px; border-radius: 12px;
      border: 1px solid var(--ox-border-strong); background: transparent; color: var(--ox-text);
      font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
    }
    .secondary-btn[disabled] { opacity: 0.5; cursor: default; }
    .error-line { margin: 8px 0 0; font-size: 12.5px; color: var(--ox-danger-text, var(--ox-danger)); }
    .share-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; min-height: 44px;
      font-size: 13px; color: var(--ox-text-muted);
    }

    /* Other items in the queue. */
    .queue-head { margin: 16px 0 0; font-size: 12px; font-weight: 600; color: var(--ox-text-muted); }
    .queue { list-style: none; margin: 4px 0 0; padding: 0; }
    .row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      border-top: 1px solid var(--ox-border); padding: 4px 0;
    }
    .row-main {
      appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: left;
      display: grid; gap: 1px; flex: 1 1 180px; min-width: 0; min-height: 48px; padding: 4px 8px;
      margin-left: -8px; border-radius: 10px; cursor: pointer;
    }
    .row-main:hover { background: var(--ox-hover, rgba(127, 127, 127, 0.08)); }
    .row-title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .row-meta { font-size: 12px; color: var(--ox-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-acts { display: flex; gap: 6px; flex: none; margin-left: auto; align-items: center; }
    .mini {
      appearance: none; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--ox-border-strong); background: transparent; color: var(--ox-text);
      font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
    }
    .mini:hover { background: var(--ox-hover, rgba(127, 127, 127, 0.08)); }
    .mini.approve { background: var(--ox-action); color: var(--ox-action-fg); border-color: var(--ox-action-border, transparent); }
    .mini.approve:hover { background: var(--ox-action); filter: brightness(0.97); }

    /* Options the server sent: one click records a choice; several are toggles plus Confirm. */
    .opts { display: grid; gap: 6px; margin-bottom: 10px; }
    .opts-label { margin: 0; font-size: 12px; font-weight: 600; color: var(--ox-text-muted); }
    .opt {
      appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px;
      padding: 8px 12px; border: 1px solid var(--ox-border-strong); border-radius: 12px;
      background: transparent; color: var(--ox-text); font: inherit; font-size: 14px; font-weight: 650;
      text-align: left; cursor: pointer; overflow-wrap: anywhere;
    }
    .opt:hover:not([disabled]) { background: var(--ox-hover, rgba(127, 127, 127, 0.08)); border-color: var(--ox-primary); }
    .opt[disabled] { cursor: default; opacity: 0.6; }
    .opt[aria-pressed="true"] { border-color: var(--ox-primary); background: rgba(var(--ox-action-rgb, 191, 255, 0), 0.1); }
    .opt-text { flex: 1; min-width: 0; }
    .opt-go { flex: none; color: var(--ox-text-muted); font-weight: 500; }
    .opt-box {
      flex: none; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
      border: 1.5px solid var(--ox-border-strong); color: transparent; font-size: 12px; line-height: 1;
    }
    .opt[aria-pressed="true"] .opt-box { background: var(--ox-action); border-color: var(--ox-action-border, transparent); color: var(--ox-action-fg); }
    .row .composer { flex: 1 1 100%; padding: 4px 0 8px; }

    /* Proof: one quiet line. */
    .proof { margin-top: 14px; border-top: 1px solid var(--ox-border); }
    .proof-quiet { margin: 0; padding: 10px 0; min-height: 44px; font-size: 13px; color: var(--ox-text-muted); display: flex; align-items: center; }
    .proof-sub { margin: 0; font-size: 12.5px; color: var(--ox-text-muted); padding-bottom: 6px; }

    .calm-copy { margin: 14px 0 4px; font-size: 15px; font-weight: 600; }
    .lede { margin: 14px 0 6px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .sub { margin: 0 0 10px; color: var(--ox-text-muted); font-size: 13px; }
    .thread-foot {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 8px;
      margin-top: 8px; border-top: 1px solid var(--ox-border);
    }
    .choose { font-weight: 600; color: var(--ox-text); }
    .foot-sync { display: flex; align-items: center; gap: 4px; min-width: 0; margin-left: auto; }
    .thread-foot .sync { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    /* Loading: placeholder rows shaped like the real content. */
    .sk { display: block; border-radius: 6px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.12)); }
    .sk-line { height: 12px; margin: 10px 0; }
    .sk-title { height: 18px; margin: 14px 0 12px; width: 82%; }
    .sk-btn { height: 48px; margin-top: 16px; border-radius: 12px; }
    @media (prefers-reduced-motion: no-preference) {
      .sk { animation: pn-pulse 1.4s ease-in-out infinite; }
      .enter { animation: pn-in 200ms var(--pn-ease) both; }
    }
    @keyframes pn-pulse { 50% { opacity: 0.55; } }
    @keyframes pn-in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

    @media (max-width: 420px) {
      .fact { grid-template-columns: minmax(0, 1fr); }
      .row-acts { flex: 1 1 100%; justify-content: flex-start; margin-left: 0; }
    }
  </style>
  <link rel="stylesheet" href="shared/widget-theme.css" />
</head>
<body>
  <main id="panel" class="panel" aria-busy="true"></main>
  <div id="pn-live" class="sr-only" role="status" aria-live="polite"></div>

  <script>
  (function orgxPanel() {
    'use strict';

    var R = window.OrgXWidgetRuntime;
    var X = window.OrgXOpenAIExtensions;
    var root = document.getElementById('panel');
    var params = new URLSearchParams(window.location.search);
    var isGallery = params.get('gallery') === 'true';
    var APPROVAL_META_KEY = 'orgx/widgetApproval';
    var ORGX_HOME = 'https://useorgx.com/command';
    var EVIDENCE_VISIBLE = 2;

    var ui = {
      snapshot: null,
      loading: true,
      auth: null,              // { code, message } when signed out
      fetchFailedAt: null,     // last refresh failed (degraded)
      syncedAt: null,
      tokens: {},
      mode: params.get('mode') === 'thread' ? 'thread' : 'global',
      listOpen: false,         // thread: "Choose another item"
      evidenceOpen: false,
      composer: null,          // { id, draft }
      selections: {},          // decisionId -> option ids toggled (multiselect)
      rulings: {},             // decisionId -> { action, phase, detail, title }
      lastRuling: null,        // { action, title } after a refresh removes it
      actionError: null,       // { id, message }
      changedSince: null,      // sync label when a refresh found a newer version
      limited: false,          // restored/deep-linked selection is not available
      caps: { modelContext: false, deepLink: false },
      generation: 0,
    };
    var ext = { deepLink: undefined, modelContext: undefined };
    var share = X.createShareController({ modelContext: undefined });
    var inflight = null;
    var pendingFocus = undefined;
    var timers = [];
    var lastFocusRequest = null;
    var handledHint = { deepLink: null, context: null };

    // ---------------------------------------------------------------- utils
    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function ago(iso) {
      var t = iso ? Date.parse(iso) : NaN;
      if (!isFinite(t)) return '';
      var s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm';
      if (s < 86400) return Math.floor(s / 3600) + 'h';
      return Math.floor(s / 86400) + 'd';
    }
    function agoLong(iso) {
      var a = ago(iso);
      return !a || a === 'just now' ? a : a + ' ago';
    }
    function clock(date) {
      var d = date instanceof Date ? date : new Date(date);
      if (!isFinite(d.getTime())) return '';
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function urgencyLabel(u) {
      return u === 'critical' ? 'Urgent' : u === 'high' ? 'High' : u === 'low' ? 'Low' : 'Normal';
    }
    function announce(text) {
      var kit = window.OrgXInteractionKit;
      if (kit && typeof kit.announce === 'function') {
        try { kit.announce(text); return; } catch (_) { /* fall through */ }
      }
      var live = document.getElementById('pn-live');
      if (live) { live.textContent = ''; live.textContent = text; }
    }
    function later(fn, ms) {
      var id = window.setTimeout(fn, ms);
      timers.push(id);
      return id;
    }
    function decideInOrgxDetail(reason) {
      switch (reason) {
        case 'critical': return 'Critical decisions are made in OrgX.';
        case 'choice_required': return 'Choose between the options in OrgX.';
        case 'agent_run_approval': return 'Agent run approvals are made in OrgX.';
        case 'protected_decision_type':
        case 'specialized_lifecycle':
        case 'artifact_review_lifecycle': return 'This one needs the full review in OrgX.';
        default: return 'Approval uses your signed-in OrgX session.';
      }
    }
    // What the person can do comes from the snapshot, never from the decision's type:
    // widget_actions when the server lists them, else options (two or more), else Approve.
    function choicesFor(f) {
      var actions = Array.isArray(f.widget_actions) && f.widget_actions.length ? f.widget_actions : null;
      var options;
      var approve = { label: 'Approve', option_id: null };
      var reject = { label: 'Send back' };
      if (actions) {
        options = actions.filter(function isOption(a) { return a.kind === 'option' && a.option_id; })
          .map(function toOption(a) { return { id: a.option_id, label: a.label }; });
        var approveAction = actions.filter(function isApprove(a) { return a.kind === 'approve'; })[0];
        var rejectAction = actions.filter(function isReject(a) { return a.kind === 'reject'; })[0];
        if (options.length === 1 && !approveAction) approve = { label: options[0].label, option_id: options[0].id };
        else if (approveAction) approve = { label: approveAction.label, option_id: null };
        reject = rejectAction ? { label: rejectAction.label } : null;
      } else {
        options = Array.isArray(f.options) ? f.options : [];
      }
      if (options.length >= 2) return { mode: 'options', options: options, multiselect: f.multiselect === true, reject: reject };
      return { mode: 'approve', options: [], multiselect: false, approve: approve, reject: reject };
    }
    function selectedFor(id) {
      return Array.isArray(ui.selections[id]) ? ui.selections[id] : [];
    }
    function optionLabel(f, optionId) {
      var match = choicesFor(f).options.filter(function byId(o) { return o.id === optionId; })[0];
      return match ? match.label : '';
    }
    function tokenFor(id) {
      var t = ui.tokens[id];
      return typeof t === 'string' && t ? t : null;
    }
    function adoptTokens(meta) {
      var approval = meta && meta[APPROVAL_META_KEY];
      var tokens = approval && approval.approval_tokens;
      ui.tokens = tokens && typeof tokens === 'object' ? Object.assign({}, tokens) : {};
    }
    function isSnapshot(data) {
      return Boolean(data && typeof data === 'object' && data.schema === 'orgx.panel.v1');
    }
    function workspaceId() {
      return ui.snapshot && ui.snapshot.workspace ? ui.snapshot.workspace.id : null;
    }
    function findItem(id) {
      var s = ui.snapshot;
      if (!s || !id) return null;
      if (s.focus && s.focus.id === id) return s.focus;
      for (var i = 0; i < s.queue.length; i += 1) if (s.queue[i].id === id) return s.queue[i];
      return null;
    }

    // ------------------------------------------------------------ rendering
    function header() {
      var s = ui.snapshot;
      var name = s && s.workspace && s.workspace.name ? s.workspace.name : (s && s.workspace ? 'Workspace' : '');
      var synced = ui.syncedAt ? 'Synced ' + clock(ui.syncedAt) : '';
      // The degraded notice carries its own Refresh; say it once.
      var refresh = ui.auth || ui.fetchFailedAt ? '' : '<button type="button" class="quiet-btn" data-action="refresh">Refresh</button>';
      var nameHtml = name
        ? (ui.mode === 'global' ? '<h1 class="ws" title="' + esc(name) + '">' + esc(name) + '</h1>' : '<span class="ws">' + esc(name) + '</span>')
        : (ui.mode === 'global' ? '<h1 class="sr-only">OrgX</h1>' : '');
      return '<header class="top"><div class="top-id"><span class="brand" aria-hidden="' + (name ? 'false' : 'true') + '">OrgX</span>' +
        (name ? '<span aria-hidden="true">·</span>' : '') + nameHtml + '</div>' +
        (synced ? '<span class="sync">' + esc(synced) + '</span>' : '') + refresh + '</header>';
    }

    function attentionLine(s) {
      var pending = s.attention.pending;
      if (!pending) return '<ox-attention-line tone="calm" count="0"></ox-attention-line>';
      var oldest = ago(s.attention.oldest_at);
      return '<ox-attention-line tone="' + (s.attention.blocking ? 'blocking' : 'needs-you') + '" count="' + pending + '"' +
        (oldest && oldest !== 'just now' ? ' oldest="' + esc(oldest) + '"' : '') + '></ox-attention-line>';
    }

    function noticeHtml() {
      var parts = [];
      if (ui.fetchFailedAt && ui.snapshot) {
        parts.push('<div class="notice" data-tone="amber" role="status"><p>Showing the snapshot from ' + esc(clock(ui.syncedAt)) +
          '. OrgX did not respond.</p><button type="button" class="text-btn" data-action="refresh">Refresh</button></div>');
      }
      if (ui.lastRuling) {
        parts.push('<div class="notice" data-tone="teal" role="status"><p>' +
          (ui.lastRuling.action === 'approve' ? 'Approved by you: ' : 'Sent back by you: ') + esc(ui.lastRuling.title) + '</p></div>');
      }
      return parts.join('');
    }

    function evidenceHtml(f) {
      if (!f.evidence.length) return '';
      var shown = ui.evidenceOpen ? f.evidence : f.evidence.slice(0, EVIDENCE_VISIBLE);
      var more = f.evidence.length > EVIDENCE_VISIBLE
        ? '<button type="button" class="text-btn" data-action="evidence" aria-expanded="' + (ui.evidenceOpen ? 'true' : 'false') + '" aria-controls="ev-list">' +
          (ui.evidenceOpen ? 'Show fewer' : 'All evidence (' + f.evidence_total + ')') + '</button>'
        : (f.evidence_total > f.evidence.length
          ? '<button type="button" class="text-btn" data-action="open" data-url="' + esc(f.url) + '">All evidence (' + f.evidence_total + ') ↗</button>'
          : '');
      var items = shown.map(function evidenceItem(e) {
        return '<li class="ev-item"><span class="ev-mark" aria-hidden="true"></span><span class="ev-title">' + esc(e.title) + '</span>' +
          (e.source_url ? '<button type="button" class="ev-open" data-action="open" data-url="' + esc(e.source_url) + '" aria-label="Open ' + esc(e.title) + ' (opens in a new tab)">↗</button>' : '') + '</li>';
      }).join('');
      var count = ui.evidenceOpen || f.evidence_total <= EVIDENCE_VISIBLE
        ? 'Evidence (' + f.evidence_total + ')'
        : 'Evidence (' + shown.length + ' of ' + f.evidence_total + ')';
      return '<div class="evidence"><p class="evidence-head"><span>' + count + '</span>' + more + '</p><ul class="ev-list" id="ev-list">' + items + '</ul></div>';
    }

    function composerHtml(id, compact) {
      var draft = ui.composer && ui.composer.id === id ? ui.composer.draft : '';
      return '<div class="composer" data-composer="' + esc(id) + '">' +
        '<label for="reason-' + esc(id) + '">What should change?</label>' +
        '<textarea id="reason-' + esc(id) + '" data-reason="' + esc(id) + '" maxlength="2000" placeholder="Tell the agent what to fix or do instead.">' + esc(draft) + '</textarea>' +
        '<div class="composer-row"><button type="button" class="secondary-btn" data-action="cancel-sendback" data-id="' + esc(id) + '">Cancel</button>' +
        '<button type="button" class="secondary-btn" data-action="submit-sendback" data-id="' + esc(id) + '"' + (draft.trim() ? '' : ' disabled') + '>Send back</button></div>' +
        (compact ? '' : '') + '</div>';
    }

    function footerFor(f) {
      var ruling = ui.rulings[f.id];
      if (ruling) {
        var frames = {
          saving: { state: 'saving', heading: ruling.action === 'approve' ? 'Recording your approval' : 'Sending it back', detail: 'nothing else changes yet' },
          waiting: { state: 'waiting', heading: 'Recorded', detail: 'checking status in OrgX', action: 'Check now' },
          confirmed: { state: 'confirmed', heading: ruling.choice ? 'You chose ' + ruling.choice : 'Approved by you', detail: ruling.detail || 'the agent can continue', action: 'Receipt ↗' },
          rejected: { state: 'rejected', heading: 'Sent back by you', detail: ruling.detail || 'the agent reworks it', action: 'Receipt ↗' },
        };
        var fr = frames[ruling.phase] || frames.saving;
        return '<ox-footer variant="confirms-in-orgx" state="' + fr.state + '" heading="' + esc(fr.heading) + '" detail="' + esc(fr.detail) + '"' +
          (fr.action ? ' action-label="' + esc(fr.action) + '"' : '') + ' data-id="' + esc(f.id) + '"></ox-footer>';
      }
      if (ui.composer && ui.composer.id === f.id) return composerHtml(f.id);
      if (tokenFor(f.id)) {
        var c = choicesFor(f);
        var sendBack = c.reject
          ? '<button type="button" slot="action" class="ft-action" data-action="sendback" data-id="' + esc(f.id) + '">' + esc(c.reject.label) + '</button>'
          : '';
        if (c.mode === 'options') {
          var picked = selectedFor(f.id);
          var opts = '<div class="opts" role="group" aria-labelledby="opts-' + esc(f.id) + '"><p class="opts-label" id="opts-' + esc(f.id) + '">' +
            (c.multiselect ? 'Choose the options to approve' : 'Choose one') + '</p>' +
            c.options.map(function optionButton(o) {
              if (c.multiselect) {
                var on = picked.indexOf(o.id) !== -1;
                return '<button type="button" class="opt" data-action="toggle-option" data-id="' + esc(f.id) + '" data-option="' + esc(o.id) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
                  '<span class="opt-box" aria-hidden="true">✓</span><span class="opt-text">' + esc(o.label) + '</span></button>';
              }
              return '<button type="button" class="opt" data-action="option" data-id="' + esc(f.id) + '" data-option="' + esc(o.id) + '">' +
                '<span class="opt-text">' + esc(o.label) + '</span><span class="opt-go" aria-hidden="true">›</span></button>';
            }).join('') + '</div>';
          if (c.multiselect) {
            var n = picked.length;
            return opts + '<ox-footer variant="confirms-in-orgx" state="needs-you" heading="' + esc(n ? n + ' chosen' : 'Choose one or more') +
              '" detail="recorded in OrgX" primary-label="' + esc(n ? 'Confirm ' + n : 'Confirm') + '"' + (n ? '' : ' disabled') + ' data-id="' + esc(f.id) + '">' + sendBack + '</ox-footer>';
          }
          // An empty primary-label keeps the kit from showing its default primary: the options are the actions.
          return opts + '<ox-footer variant="confirms-in-orgx" state="needs-you" heading="Choose one" detail="recorded in OrgX" primary-label="" data-id="' + esc(f.id) + '">' + sendBack + '</ox-footer>';
        }
        return '<ox-footer variant="confirms-in-orgx" state="needs-you" heading="Decide here" detail="recorded in OrgX" primary-label="' + esc(c.approve.label) + '" data-id="' + esc(f.id) + '">' +
          sendBack + '</ox-footer>';
      }
      return '<button type="button" class="primary-btn" data-action="open" data-url="' + esc(f.url) + '">Decide in OrgX <span aria-hidden="true">↗</span><span class="sr-only">(opens OrgX)</span></button>' +
        '<p class="handoff-detail">' + esc(decideInOrgxDetail(f.decide_in_orgx_reason)) + '</p>';
    }

    function shareHtml(f) {
      if (!ui.caps.modelContext || ui.rulings[f.id]) return '';
      var current = share.shared;
      if (current && current.id === f.id) {
        if (current.version && current.version !== f.version) {
          return '<div class="share-row"><span>Chat has an older version</span><span aria-hidden="true">·</span>' +
            '<button type="button" class="text-btn" data-action="share" data-id="' + esc(f.id) + '">Update chat</button>' +
            '<button type="button" class="text-btn" data-action="stop-share">Stop sharing</button></div>';
        }
        return '<div class="share-row"><span>Shared with chat</span><span aria-hidden="true">·</span>' +
          '<button type="button" class="text-btn" data-action="stop-share">Stop sharing</button></div>';
      }
      return '<div class="share-row"><button type="button" class="text-btn" data-action="share" data-id="' + esc(f.id) + '">Share with chat</button></div>';
    }

    function packetHtml(f, headingTag) {
      var metaBits = [ago(f.waiting_since), f.initiative_title].filter(Boolean);
      var error = ui.actionError && ui.actionError.id === f.id
        ? '<p class="error-line" role="alert">' + esc(ui.actionError.message) + '</p>' : '';
      var changed = ui.changedSince
        ? '<div class="notice" role="status"><p>Changed since ' + esc(ui.changedSince) + '</p></div>' : '';
      var facts = [];
      if (f.recommendation && f.recommendation.action) {
        facts.push('<div class="fact"><dt>Recommendation</dt><dd>' + esc(f.recommendation.action) +
          (f.recommendation.status === 'unverified' ? ' <span class="sub">(unverified)</span>' : '') + '</dd></div>');
      }
      if (f.consequence_if_approved) {
        facts.push('<div class="fact"><dt>If approved</dt><dd>' + esc(f.consequence_if_approved) + '</dd></div>');
      }
      return '<section class="packet enter" aria-labelledby="pk-q">' + changed +
        '<p class="meta"><span class="urgency" data-u="' + esc(f.urgency) + '">' + esc(urgencyLabel(f.urgency)) + '</span>' +
        (f.blocked ? '<span aria-hidden="true">·</span><span class="blocked-tag">Blocking work</span>' : '') +
        (metaBits.length ? '<span aria-hidden="true">·</span><span class="meta-text" title="' + esc(metaBits.join(' · ')) + '">' + esc(metaBits.join(' · ')) + '</span>' : '<span class="meta-text"></span>') +
        // "Decide in OrgX" already opens it when there is no in-place action.
        (tokenFor(f.id) || ui.rulings[f.id] ? '<button type="button" class="text-btn open-link" data-action="open" data-url="' + esc(f.url) + '" aria-label="Open this decision in OrgX">Open ↗</button>' : '') + '</p>' +
        '<' + headingTag + ' id="pk-q" class="q">' + esc(f.question) + '</' + headingTag + '>' +
        (facts.length ? '<dl class="facts">' + facts.join('') + '</dl>' : '') +
        evidenceHtml(f) +
        '<div class="actions">' + footerFor(f) + error + '</div>' +
        shareHtml(f) + '</section>';
    }

    function rowHtml(item) {
      var ruling = ui.rulings[item.id];
      var meta = [urgencyLabel(item.urgency), ago(item.waiting_since), item.initiative_title].filter(Boolean).join(' · ');
      var acts = '';
      if (ruling) {
        var chip = ruling.phase === 'confirmed' ? 'confirmed' : ruling.phase === 'rejected' ? 'rejected' : 'sending';
        var label = ruling.phase === 'confirmed' ? 'Approved' : ruling.phase === 'rejected' ? 'Sent back' : 'Recording';
        acts = '<div class="row-acts"><ox-state-chip state="' + chip + '" label="' + label + '"></ox-state-chip></div>';
      } else if (tokenFor(item.id) && item.option_count >= 2) {
        // Options are chosen in the packet, where they are listed.
        acts = '<div class="row-acts"><button type="button" class="mini approve" data-action="select" data-id="' + esc(item.id) + '" aria-label="Choose: ' + esc(item.title) + '">Choose</button></div>';
      } else if (tokenFor(item.id) && !(ui.composer && ui.composer.id === item.id)) {
        acts = '<div class="row-acts"><button type="button" class="mini approve" data-action="approve" data-id="' + esc(item.id) + '" aria-label="Approve: ' + esc(item.title) + '">Approve</button>' +
          '<button type="button" class="mini" data-action="sendback" data-id="' + esc(item.id) + '" aria-label="Send back: ' + esc(item.title) + '">Send back</button></div>';
      }
      var error = ui.actionError && ui.actionError.id === item.id
        ? '<p class="error-line" role="alert" style="flex:1 1 100%">' + esc(ui.actionError.message) + '</p>' : '';
      return '<li class="row" data-row="' + esc(item.id) + '"><button type="button" class="row-main" data-action="select" data-id="' + esc(item.id) + '" aria-label="' + esc(item.title + '. ' + meta) + '">' +
        '<span class="row-title">' + esc(item.title) + '</span><span class="row-meta">' + esc(meta) + '</span></button>' + acts +
        (ui.composer && ui.composer.id === item.id ? composerHtml(item.id, true) : '') + error + '</li>';
    }

    function proofHtml(s, calm) {
      var p = s.proof;
      var degradedProof = s.degraded.indexOf('proof_unavailable') !== -1;
      var html = '';
      if (p.last_accepted) {
        var who = p.last_accepted.accepted_by === 'you' ? 'accepted by you' : 'accepted by a workspace member';
        var when = agoLong(p.last_accepted.accepted_at);
        html += '<ox-receipt-row status="met" label="Last accepted: ' + esc(p.last_accepted.title) + '" detail="' + esc([who, when].filter(Boolean).join(' · ')) + '" href="' + esc(p.last_accepted.url) + '"></ox-receipt-row>';
      } else if (degradedProof) {
        html += '<p class="proof-quiet">Accepted work could not be read right now.</p>';
      } else if (calm) {
        html += '<p class="proof-quiet">No output has been accepted yet.</p>';
      }
      if (p.completed_unaccepted > 0) {
        html += '<p class="proof-sub">Completed, not yet accepted: ' + p.completed_unaccepted + '</p>';
      }
      return html ? '<div class="proof">' + html + '</div>' : '';
    }

    function skeletonHtml() {
      return (ui.mode === 'global' ? '<header class="top"><div class="top-id"><span class="brand">OrgX</span></div></header>' : '') +
        '<div aria-hidden="true"><span class="sk sk-line" style="width:56%;margin-top:16px"></span>' +
        '<span class="sk sk-title"></span><span class="sk sk-line" style="width:68%"></span>' +
        '<span class="sk sk-line" style="width:90%"></span><span class="sk sk-line" style="width:74%"></span>' +
        '<span class="sk sk-btn"></span><span class="sk sk-line" style="width:40%;margin-top:18px"></span></div>' +
        '<p class="sr-only">Loading your decisions.</p>';
    }

    function signedOutHtml() {
      return header() + '<p class="lede">Sign in to OrgX to see your workspace.</p>' +
        '<p class="sub">' + esc(ui.auth && ui.auth.code === 'insufficient_scope'
          ? 'Reconnect OrgX and allow it to read your initiatives.'
          : 'Connect OrgX in ChatGPT, then open this panel again.') + '</p>' +
        '<button type="button" class="secondary-btn" data-action="open" data-url="https://useorgx.com">Open OrgX ↗</button>';
    }

    function limitedHtml(tag) {
      return '<' + tag + ' class="lede">This item isn’t available here.</' + tag + '>' +
        '<p class="sub">It may be settled already, or it belongs to a workspace this account can’t open.</p>' +
        '<button type="button" class="secondary-btn" data-action="back">Back to decisions</button>';
    }

    function isFirstUse(s) {
      return s.attention.pending === 0 && !s.proof.last_accepted && !s.proof.completed_unaccepted &&
        s.degraded.indexOf('proof_unavailable') === -1;
    }

    function globalHtml(s) {
      var html = header() + noticeHtml();
      if (s.state === 'no_workspace') {
        return html + '<p class="lede">Choose a workspace in OrgX to see its decisions.</p>' +
          '<button type="button" class="secondary-btn" data-action="open" data-url="' + ORGX_HOME + '">Open OrgX ↗</button>';
      }
      if (s.state === 'degraded' && !s.queue.length) {
        return html + '<div class="notice" data-tone="amber" role="status"><p>OrgX did not respond. Nothing was changed.</p>' +
          '<button type="button" class="text-btn" data-action="refresh">Refresh</button></div>' + proofHtml(s, false);
      }
      if (ui.limited || s.selection.status === 'unavailable') {
        return html + limitedHtml('p');
      }
      var calm = s.attention.pending === 0;
      if (isFirstUse(s)) {
        return html + '<p class="lede">This workspace has no decisions or accepted work yet.</p>' +
          '<button type="button" class="secondary-btn" data-action="open" data-url="' + ORGX_HOME + '">Open OrgX ↗</button>';
      }
      html += attentionLine(s);
      if (calm) return html + proofHtml(s, true);
      if (s.focus) html += packetHtml(s.focus, 'h2');
      var others = s.queue.filter(function notFocus(item) { return !s.focus || item.id !== s.focus.id; }).slice(0, 2);
      if (others.length) {
        html += '<h2 class="queue-head">Also waiting</h2><ul class="queue">' + others.map(rowHtml).join('') + '</ul>';
      }
      return html + proofHtml(s, false);
    }

    function threadHtml(s) {
      var html = noticeHtml();
      var syncLabel = esc(ui.syncedAt ? 'OrgX · synced ' + clock(ui.syncedAt) : 'OrgX');
      var foot = '<div class="thread-foot"><span class="sync">' + syncLabel + '</span>' +
        '<button type="button" class="quiet-btn" data-action="refresh">Refresh</button></div>';
      if (s.state === 'no_workspace') {
        return html + '<h1 class="lede">Choose a workspace in OrgX to see its decisions.</h1>' + foot;
      }
      if (s.state === 'degraded' && !s.queue.length) {
        return html + '<h1 class="lede">OrgX did not respond.</h1><p class="sub">Nothing was changed.</p>' + foot;
      }
      if (ui.limited || s.selection.status === 'unavailable') {
        return html + limitedHtml('h1') + foot;
      }
      if (ui.listOpen) {
        var rows = s.queue.length
          ? '<ul class="queue">' + s.queue.map(rowHtml).join('') + '</ul>'
          : '<p class="sub">Nothing needs your decision.</p>';
        return '<h1 class="lede">Choose an item</h1>' + html + rows +
          '<div class="thread-foot"><button type="button" class="quiet-btn" data-action="back">Back</button></div>';
      }
      if (!s.focus && isFirstUse(s)) {
        return '<h1 class="lede">This workspace has no decisions or accepted work yet.</h1>' + html +
          '<button type="button" class="secondary-btn" data-action="open" data-url="' + ORGX_HOME + '">Open OrgX ↗</button>' + foot;
      }
      if (!s.focus) {
        return '<h1 class="lede">Nothing needs your decision.</h1>' + html + proofHtml(s, true) + foot;
      }
      html += packetHtml(s.focus, 'h1');
      if (s.queue.length > 1) {
        html += '<div class="thread-foot"><button type="button" class="text-btn choose" data-action="choose">Choose another item ›</button>' +
          '<span class="foot-sync"><span class="sync">' + syncLabel + '</span><button type="button" class="quiet-btn" data-action="refresh">Refresh</button></span></div>';
      } else {
        html += foot;
      }
      return html;
    }

    function toneFor(s) {
      if (!s || ui.auth || ui.limited || (s.selection && s.selection.status === 'unavailable')) return 'none';
      if (s.attention && s.attention.pending) return s.attention.blocking ? 'red' : 'amber';
      return s.state === 'ok' ? 'teal' : 'none';
    }

    function render() {
      var focusKey = document.activeElement && document.activeElement.getAttribute
        ? document.activeElement.getAttribute('data-action') + '|' + (document.activeElement.getAttribute('data-id') || '') +
          '|' + (document.activeElement.getAttribute('data-option') || '')
        : null;
      root.setAttribute('data-mode', ui.mode);
      if (ui.auth) {
        root.setAttribute('data-tone', 'none');
        root.innerHTML = signedOutHtml();
      } else if (!ui.snapshot) {
        root.setAttribute('data-tone', 'none');
        root.innerHTML = skeletonHtml();
      } else {
        root.setAttribute('data-tone', toneFor(ui.snapshot));
        root.innerHTML = ui.mode === 'thread' ? threadHtml(ui.snapshot) : globalHtml(ui.snapshot);
      }
      root.setAttribute('aria-busy', ui.snapshot || ui.auth ? 'false' : 'true');
      if (focusKey && focusKey !== 'null||') {
        var parts = focusKey.split('|');
        var selector = '[data-action="' + parts[0] + '"]' + (parts[1] ? '[data-id="' + parts[1] + '"]' : '') +
          (parts[2] ? '[data-option="' + (window.CSS && CSS.escape ? CSS.escape(parts[2]) : parts[2]) + '"]' : '');
        var again = root.querySelector(selector);
        if (again && again.focus) again.focus();
      }
      if (ui.composer) {
        var area = root.querySelector('textarea[data-reason="' + ui.composer.id + '"]');
        if (area && document.activeElement !== area && ui.composer.focus) {
          area.focus();
          ui.composer.focus = false;
        }
      }
      if (R && R.reportSize) R.reportSize();
    }

    // ------------------------------------------------------------- data flow
    function accept(snapshot, meta, source) {
      if (!isSnapshot(snapshot)) return false;
      var prev = ui.snapshot;
      if (prev && Date.parse(snapshot.generated_at) < Date.parse(prev.generated_at)) return false;
      if (prev && prev.focus && snapshot.focus && prev.focus.id === snapshot.focus.id &&
          prev.focus.version !== snapshot.focus.version && source === 'refresh') {
        ui.changedSince = clock(ui.syncedAt);
      } else if (source === 'refresh') {
        ui.changedSince = null;
      }
      ui.snapshot = snapshot;
      ui.syncedAt = new Date(snapshot.generated_at);
      ui.loading = false;
      ui.auth = null;
      ui.fetchFailedAt = null;
      ui.limited = false;
      if (meta !== undefined) adoptTokens(meta);
      // Drop rulings for decisions that are gone; keep a one-line receipt.
      Object.keys(ui.rulings).forEach(function prune(id) {
        if (!findItem(id) && (ui.rulings[id].phase === 'confirmed' || ui.rulings[id].phase === 'rejected')) {
          ui.lastRuling = { action: ui.rulings[id].action, title: ui.rulings[id].title };
          delete ui.rulings[id];
        }
      });
      evaluateHints();
      return true;
    }

    function authFailure(error) {
      var code = error && (error.code || (error.error && error.error.code));
      return code === 'authentication_required' || code === 'insufficient_scope' ? code : null;
    }

    function fetchSnapshot(focusId, reason) {
      if (inflight) {
        pendingFocus = focusId;
        return inflight;
      }
      var gen = ui.generation;
      var args = focusId ? { focus: { type: 'decision', id: focusId } } : {};
      lastFocusRequest = focusId || null;
      inflight = R.callToolResult('orgx_panel_snapshot', args).then(function onResult(result) {
        if (gen !== ui.generation) return;
        if (accept(result.data, result.meta || null, 'refresh')) {
          if (reason === 'refresh') announce('Refreshed. ' + summaryText());
        }
        render();
      }, function onError(error) {
        if (gen !== ui.generation) return;
        var auth = authFailure(error && error.result ? error.result : error);
        if (auth) {
          ui.auth = { code: auth };
        } else {
          ui.fetchFailedAt = new Date();
          announce('OrgX did not respond. Showing the last snapshot.');
        }
        render();
      }).then(function release() {
        inflight = null;
        if (pendingFocus !== undefined) {
          var next = pendingFocus;
          pendingFocus = undefined;
          if (next !== lastFocusRequest) fetchSnapshot(next, 'select');
        }
      });
      return inflight;
    }

    function summaryText() {
      var s = ui.snapshot;
      if (!s) return '';
      var n = s.attention.pending;
      return n ? n + (n === 1 ? ' needs' : ' need') + ' your decision.' : 'Nothing needs your decision.';
    }

    function selectDecision(id) {
      ui.listOpen = false;
      ui.evidenceOpen = false;
      ui.composer = null;
      ui.actionError = null;
      ui.limited = false;
      var s = ui.snapshot;
      if (s && s.focus && s.focus.id === id) { render(); return; }
      if (isGallery) {
        var item = findItem(id);
        if (item) s.focus = Object.assign({}, s.focus || {}, galleryFocus(item));
        render();
        return;
      }
      fetchSnapshot(id, 'select');
    }

    // Deep link and restored chat selection: hints only, evaluated once each.
    function evaluateHints() {
      var s = ui.snapshot;
      if (!s || !s.workspace || isGallery) return;
      if (ext.deepLink) {
        var link = ext.deepLink.getCurrent();
        var url = link && link.url;
        if (url && url !== handledHint.deepLink) {
          handledHint.deepLink = url;
          var target = X.parsePanelDeepLink(url);
          if (target && target.type === 'decision') {
            ui.mode = 'thread';
            if (!(s.focus && s.focus.id === target.id)) fetchSnapshot(target.id, 'deeplink');
          }
          // Anything else falls back to the default view, silently.
        }
      }
      if (ext.modelContext) {
        var current = ext.modelContext.getCurrent();
        var key = current && current.updateId ? current.updateId : null;
        if (key && key !== handledHint.context) {
          handledHint.context = key;
          var restored = X.readSharedSelection(current, s.workspace.id);
          share.restore(restored, s.workspace.id);
          if (restored && restored.status === 'mismatch') {
            ui.mode = 'thread';
            ui.limited = true;
          } else if (restored && restored.status === 'match') {
            ui.mode = 'thread';
            if (!(s.focus && s.focus.id === restored.entity.id)) fetchSnapshot(restored.entity.id, 'restore');
          }
        }
      }
    }

    function onHostContext(context, app) {
      if (!app) return;
      ext = X.createExtensions(app);
      ui.caps = { modelContext: Boolean(ext.modelContext), deepLink: Boolean(ext.deepLink) };
      var keep = share.shared;
      share = X.createShareController({ modelContext: ext.modelContext });
      if (keep) share.restore({ status: 'match', entity: { id: keep.id, version: keep.version } }, keep.workspaceId);
      evaluateHints();
      render();
    }

    // -------------------------------------------------------------- rulings
    function wait(ms) {
      return new Promise(function resolveLater(resolve) { later(resolve, ms); });
    }

    function pollStatus(id, gen) {
      var attempts = 0;
      function once() {
        return R.callTool('orgx_command_status', { kind: 'decision', id: id }).then(function onStatus(status) {
          if (gen !== ui.generation) return null;
          var next = status && status.next_poll_after_ms;
          if (typeof next === 'number' && attempts < 12) {
            attempts += 1;
            return wait(Math.min(Math.max(next, 400), 15000)).then(once);
          }
          return status;
        });
      }
      return once();
    }

    // choice: { option_id, label } or { option_ids, label } when the person picked options.
    function rule(id, action, reason, choice) {
      if (ui.rulings[id]) return;
      var token = tokenFor(id);
      var item = findItem(id);
      if (!token || !item) {
        ui.actionError = { id: id, message: 'This one has to be decided in OrgX.' };
        render();
        return;
      }
      var gen = ui.generation;
      var title = item.title || item.question || 'Decision';
      ui.actionError = null;
      ui.composer = null;
      ui.rulings[id] = { action: action, phase: 'saving', title: title, choice: choice && choice.label ? choice.label : null };
      delete ui.tokens[id]; // single use
      render();
      var args = { decision_id: id, action: action, approval_token: token };
      if (action === 'reject') args.reason = reason;
      if (action === 'approve' && choice && choice.option_id) args.option_id = choice.option_id;
      if (action === 'approve' && choice && choice.option_ids && choice.option_ids.length) args.option_ids = choice.option_ids.slice();
      function settle(status) {
        if (gen !== ui.generation || !ui.rulings[id]) return;
        if (status && status.state === 'failed') {
          delete ui.rulings[id];
          ui.actionError = { id: id, message: (status.message || 'OrgX reports this did not go through.') + ' Check it in OrgX.' };
          render();
          fetchSnapshot(null, 'refresh');
          return;
        }
        ui.rulings[id].phase = action === 'approve' ? 'confirmed' : 'rejected';
        ui.rulings[id].detail = status
          ? (action === 'approve' ? 'the agent can continue' : 'the agent reworks it')
          : 'recorded; status not available yet';
        announce((action === 'approve' ? 'Approved: ' : 'Sent back: ') + title);
        render();
        later(function refreshAfterRuling() { fetchSnapshot(null, 'ruling'); }, 900);
      }
      R.callTool('orgx_widget_decide', args).then(function onDecided() {
        if (gen !== ui.generation) return;
        ui.rulings[id].phase = 'waiting';
        render();
        // The ruling is recorded. A status read that fails does not undo it.
        pollStatus(id, gen).then(settle, function statusUnavailable() { settle(null); });
      }, function onFailed(error) {
        if (gen !== ui.generation) return;
        delete ui.rulings[id];
        ui.actionError = { id: id, message: (error && error.message ? error.message : 'Not recorded.') + '' };
        render();
        // The token was single-use; a fresh snapshot brings a new one.
        if (!isGallery) fetchSnapshot(ui.snapshot && ui.snapshot.selection.status === 'selected' && ui.snapshot.focus ? ui.snapshot.focus.id : null, 'refresh');
      });
    }

    function checkNow(id) {
      var gen = ui.generation;
      R.callTool('orgx_command_status', { kind: 'decision', id: id }).then(function onStatus(status) {
        if (gen !== ui.generation || !ui.rulings[id]) return;
        if (status && status.next_poll_after_ms === null) {
          ui.rulings[id].phase = ui.rulings[id].action === 'approve' ? 'confirmed' : 'rejected';
          render();
        }
      }, function ignore() { /* the poll keeps running */ });
    }

    // ---------------------------------------------------------------- share
    function doShare(id) {
      var item = findItem(id);
      var ws = workspaceId();
      if (!item || !ws) return;
      share.share({ id: item.id, version: item.version, title: item.title || item.question, urgency: item.urgency, url: item.url }, ws)
        .then(function shared() { announce('Shared with chat.'); render(); },
          function failed() { ui.actionError = { id: id, message: 'Could not share with chat.' }; render(); });
    }
    function stopShare() {
      share.stop(workspaceId()).then(function stopped() { announce('Stopped sharing.'); render(); },
        function failed() { render(); });
    }

    // --------------------------------------------------------------- events
    function openUrl(url, event) {
      if (!url) return;
      if (isGallery) return;
      R.openWidgetLink(url, event);
    }

    root.addEventListener('click', function onClick(event) {
      var el = event.target.closest('[data-action]');
      if (!el || !root.contains(el) || el.disabled) return;
      var action = el.getAttribute('data-action');
      var id = el.getAttribute('data-id');
      switch (action) {
        case 'refresh': fetchSnapshot(ui.snapshot && ui.snapshot.selection.status === 'selected' && ui.snapshot.focus ? ui.snapshot.focus.id : null, 'refresh'); break;
        case 'open': event.preventDefault(); openUrl(el.getAttribute('data-url'), event); break;
        case 'select': selectDecision(id); break;
        case 'approve': approve(id); break;
        case 'option': {
          var optionId = el.getAttribute('data-option');
          var holder = findItem(id);
          rule(id, 'approve', undefined, { option_id: optionId, label: holder ? optionLabel(holder, optionId) : '' });
          break;
        }
        case 'toggle-option': toggleOption(id, el.getAttribute('data-option')); break;
        case 'sendback': ui.composer = { id: id, draft: '', focus: true, opener: id }; ui.actionError = null; render(); break;
        case 'cancel-sendback': closeComposer(); break;
        case 'submit-sendback': {
          var area = root.querySelector('textarea[data-reason="' + id + '"]');
          var reason = area ? area.value.trim() : '';
          if (reason) rule(id, 'reject', reason);
          break;
        }
        case 'evidence': ui.evidenceOpen = !ui.evidenceOpen; render(); break;
        case 'choose': ui.listOpen = true; render(); focusFirst('.row-main'); break;
        case 'back':
          ui.listOpen = false;
          if (ui.limited || (ui.snapshot && ui.snapshot.selection.status === 'unavailable')) {
            ui.limited = false;
            if (!isGallery) fetchSnapshot(null, 'back');
            else if (ui.snapshot) { ui.snapshot.selection = { requested_id: null, status: 'default' }; render(); }
          } else {
            render();
          }
          break;
        case 'share': doShare(id); break;
        case 'stop-share': stopShare(); break;
        default: break;
      }
    });

    root.addEventListener('input', function onInput(event) {
      var area = event.target;
      if (!area || !area.matches || !area.matches('textarea[data-reason]')) return;
      if (ui.composer) ui.composer.draft = area.value;
      var submit = root.querySelector('[data-action="submit-sendback"][data-id="' + area.getAttribute('data-reason') + '"]');
      if (submit) submit.disabled = !area.value.trim();
    });

    root.addEventListener('ox-primary', function onPrimary(event) {
      var footer = event.target.closest('ox-footer');
      var id = footer && footer.getAttribute('data-id');
      if (!id || footer.getAttribute('state') !== 'needs-you') return;
      var item = findItem(id);
      var c = item ? choicesFor(item) : null;
      if (c && c.mode === 'options' && c.multiselect) confirmOptions(id);
      else if (!c || c.mode === 'approve') approve(id);
    });

    function approve(id) {
      var item = findItem(id);
      var c = item ? choicesFor(item) : null;
      var choice = c && c.mode === 'approve' && c.approve.option_id ? { option_id: c.approve.option_id, label: c.approve.label } : undefined;
      rule(id, 'approve', undefined, choice);
    }
    function toggleOption(id, optionId) {
      var item = findItem(id);
      if (!item || ui.rulings[id]) return;
      var current = selectedFor(id);
      var next = current.indexOf(optionId) === -1 ? current.concat(optionId) : current.filter(function keep(x) { return x !== optionId; });
      ui.selections[id] = choicesFor(item).options.map(function ids(o) { return o.id; })
        .filter(function picked(oid) { return next.indexOf(oid) !== -1; });
      render();
    }
    function confirmOptions(id) {
      var item = findItem(id);
      var ids = selectedFor(id);
      if (!item || !ids.length) return;
      var labels = ids.map(function label(oid) { return optionLabel(item, oid); }).filter(Boolean);
      rule(id, 'approve', undefined, { option_ids: ids, label: labels.join(', ') });
    }
    root.addEventListener('ox-action', function onFooterAction(event) {
      var footer = event.target.closest('ox-footer');
      var id = footer && footer.getAttribute('data-id');
      if (!id) return;
      var detail = event.detail || {};
      if (detail.action === 'check_now') checkNow(id);
      else if (detail.action === 'receipt') { var item = findItem(id); openUrl(item ? item.url : 'https://useorgx.com/decisions/' + id); }
    });
    root.addEventListener('ox-open', function onReceiptOpen(event) {
      event.preventDefault();
      openUrl(event.detail && event.detail.href);
    });

    function closeComposer() {
      var opener = ui.composer && ui.composer.opener;
      ui.composer = null;
      render();
      var back = opener ? root.querySelector('[data-action="sendback"][data-id="' + opener + '"]') : null;
      if (back) back.focus();
    }
    function focusFirst(selector) {
      var el = root.querySelector(selector);
      if (el) el.focus();
    }

    document.addEventListener('keydown', function onKey(event) {
      if (event.key !== 'Escape') return;
      if (ui.composer) { event.preventDefault(); closeComposer(); return; }
      if (ui.evidenceOpen) {
        event.preventDefault();
        ui.evidenceOpen = false;
        render();
        focusFirst('[data-action="evidence"]');
        return;
      }
      if (ui.listOpen) {
        event.preventDefault();
        ui.listOpen = false;
        render();
        focusFirst('[data-action="choose"]');
      }
    });

    function dispose() {
      ui.generation += 1;
      timers.forEach(function clear(id) { window.clearTimeout(id); });
      timers = [];
    }
    window.addEventListener('pagehide', dispose);

    // -------------------------------------------------------------- gallery
    var NOW = Date.now();
    function isoAgo(ms) { return new Date(NOW - ms).toISOString(); }
    var H = 3600 * 1000;
    var D = 24 * H;
    var IDS = {
      ws: '0a1b2c3d-4e5f-4a6b-9c7d-8e9f0a1b2c3d',
      init: 'c9d8e7f6-a5b4-4c3d-9e2f-1a0b9c8d7e6f',
      d1: '3f1c2a9e-6b7d-4c1e-9a2b-1d2e3f4a5b6c',
      d2: '7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d',
      d3: 'b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e',
      art: 'e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b',
    };
    function decisionUrl(id) { return 'https://useorgx.com/initiatives/' + IDS.init + '?focus=decisions&decision=' + id; }
    var FIXTURE_QUEUE = [
      { id: IDS.d1, version: isoAgo(2 * D), title: 'Ship release 4.2 to production?', urgency: 'critical', waiting_since: isoAgo(2 * D), initiative_title: 'Release initiative', blocked: false, decide_in_orgx_reason: null, option_count: 0, url: decisionUrl(IDS.d1) },
      { id: IDS.d2, version: isoAgo(5 * H), title: 'Rotate billing API keys?', urgency: 'high', waiting_since: isoAgo(5 * H), initiative_title: 'Billing hardening', blocked: false, decide_in_orgx_reason: null, option_count: 0, url: decisionUrl(IDS.d2) },
      { id: IDS.d3, version: isoAgo(26 * H), title: 'Publish the onboarding checklist v2?', urgency: 'medium', waiting_since: isoAgo(26 * H), initiative_title: 'Activation', blocked: false, decide_in_orgx_reason: null, option_count: 0, url: decisionUrl(IDS.d3) },
    ];
    function galleryFocus(item) {
      var packets = {};
      packets[IDS.d1] = {
        question: 'Ship release 4.2 to production?',
        recommendation: { status: 'ready', action: 'Approve' },
        evidence: [
          { title: 'CI run 1182 · passed', source_url: 'https://useorgx.com/artifacts/' + IDS.art },
          { title: 'Rollback plan · v3', source_url: null },
          { title: 'Load test · p95 212 ms', source_url: null },
          { title: 'Security review · no findings', source_url: null },
          { title: 'Changelog draft', source_url: null },
        ],
        evidence_total: 5,
        consequence_if_approved: 'The deploy job starts and release 4.2 reaches production within 15 minutes.',
      };
      packets[IDS.d2] = {
        question: 'Rotate billing API keys?',
        recommendation: { status: 'ready', action: 'Approve' },
        evidence: [{ title: 'Key age report · 212 days', source_url: null }],
        evidence_total: 1,
        consequence_if_approved: 'New keys are issued and the old ones stop working in 24 hours.',
      };
      packets[IDS.d3] = {
        question: 'Publish the onboarding checklist v2?',
        recommendation: { status: 'unverified', action: 'Approve with edits' },
        evidence: [],
        evidence_total: 0,
        consequence_if_approved: 'The checklist replaces v1 for new workspaces.',
      };
      var p = packets[item.id] || packets[IDS.d1];
      return {
        type: 'decision', id: item.id, version: item.version, question: p.question, urgency: item.urgency,
        waiting_since: item.waiting_since, initiative_title: item.initiative_title, recommendation: p.recommendation,
        evidence: p.evidence, evidence_total: p.evidence_total, consequence_if_approved: p.consequence_if_approved,
        consequence_if_rejected: null, blocked: item.blocked, decide_in_orgx_reason: item.decide_in_orgx_reason,
        options: [], multiselect: false, widget_actions: null, url: item.url,
      };
    }
    function baseSnapshot() {
      return {
        schema: 'orgx.panel.v1',
        generated_at: new Date(NOW - 4 * 60 * 1000).toISOString(),
        state: 'ok',
        workspace: { id: IDS.ws, name: 'Acme workspace' },
        attention: { pending: 3, oldest_at: FIXTURE_QUEUE[0].waiting_since, blocking: false },
        queue: FIXTURE_QUEUE.map(function copy(item) { return Object.assign({}, item); }),
        focus: galleryFocus(FIXTURE_QUEUE[0]),
        selection: { requested_id: null, status: 'default' },
        proof: {
          last_accepted: { artifact_id: IDS.art, title: 'Release checklist v3', accepted_at: isoAgo(2 * D), accepted_by: 'you', url: 'https://useorgx.com/artifacts/' + IDS.art },
          completed_unaccepted: 2,
        },
        degraded: [],
      };
    }
    function calmSnapshot() {
      var s = baseSnapshot();
      s.attention = { pending: 0, oldest_at: null, blocking: false };
      s.queue = [];
      s.focus = null;
      return s;
    }
    function allTokens(s) {
      var t = {};
      s.queue.forEach(function add(item) { t[item.id] = 'gallery-token'; });
      return t;
    }
    function runGallery() {
      var name = params.get('state') || 'needs-you';
      var s = baseSnapshot();
      var tokens = allTokens(s);
      var failed = false;
      switch (name) {
        case 'loading':
          render();
          return;
        case 'signed-out':
          ui.auth = { code: 'authentication_required' };
          render();
          return;
        case 'first-use':
          s = calmSnapshot();
          s.proof = { last_accepted: null, completed_unaccepted: 0 };
          tokens = {};
          break;
        case 'calm':
          s = calmSnapshot();
          s.proof.completed_unaccepted = 0;
          tokens = {};
          break;
        case 'completed-not-accepted':
          s = calmSnapshot();
          s.proof = { last_accepted: null, completed_unaccepted: 2 };
          tokens = {};
          break;
        case 'blocking':
          s.attention.blocking = true;
          s.queue[0].blocked = true;
          s.focus.blocked = true;
          break;
        case 'decide-in-orgx':
          s.queue[0].decide_in_orgx_reason = 'critical';
          s.focus.decide_in_orgx_reason = 'critical';
          tokens = {};
          break;
        case 'long': {
          var longTitle = 'Approve moving the entire EU customer base to the new billing provider before the quarter closes, including the 41 enterprise accounts on custom contracts and the legacy invoicing exports that finance still depends on?';
          s.workspace.name = 'Acme Holdings International · Operations and Finance Shared Workspace';
          s.queue[0].title = longTitle.slice(0, 159) + '…';
          s.queue[0].initiative_title = 'European billing consolidation and provider migration program';
          s.focus = galleryFocus(s.queue[0]);
          s.focus.question = longTitle;
          s.focus.initiative_title = s.queue[0].initiative_title;
          s.focus.consequence_if_approved = 'Migration jobs start for all 1,284 EU accounts tonight; enterprise contracts move after finance signs off on the export mapping, and the old provider is retired at the end of next month.';
          s.focus.evidence[0].title = 'Reconciliation dry run across 1,284 accounts · 3 mismatches, all explained and…';
          s.queue[1].title = 'Rotate the billing API keys for every regional integration, including the partner sandbox keys that are still shared with the reseller';
          break;
        }
        case 'degraded':
          failed = true;
          break;
        case 'stale':
          ui.changedSince = clock(new Date(NOW - 12 * 60 * 1000));
          break;
        case 'permission-limited':
          s.selection = { requested_id: '9e8d7c6b-5a49-4382-9716-a5b4c3d2e1f0', status: 'unavailable' };
          s.focus = null;
          break;
        case 'approved':
          ui.rulings[IDS.d1] = { action: 'approve', phase: 'confirmed', title: s.focus.question, detail: 'the agent can continue' };
          break;
        case 'options':
          // The server sends the options; each one is a single-click approval.
          s.queue[0].title = s.focus.question = 'When does release 4.2 go to production?';
          s.queue[0].option_count = 3;
          s.focus.recommendation = { status: 'ready', action: 'Tonight after the freeze' };
          s.focus.options = [
            { id: 'opt-tonight', label: 'Tonight, 22:00 UTC' },
            { id: 'opt-tomorrow', label: 'Tomorrow, 09:00 UTC' },
            { id: 'opt-monday', label: 'Monday, after the change review' },
          ];
          s.queue[1].option_count = 2;
          break;
        case 'multiselect':
          s.queue[0].title = s.focus.question = 'Which regions get release 4.2 first?';
          s.queue[0].option_count = 3;
          s.focus.recommendation = { status: 'ready', action: 'EU and US' };
          s.focus.multiselect = true;
          s.focus.options = [
            { id: 'eu', label: 'EU (Frankfurt)' },
            { id: 'us', label: 'US (Virginia)' },
            { id: 'apac', label: 'APAC (Singapore)' },
          ];
          ui.selections[IDS.d1] = ['eu', 'us'];
          break;
        default:
          break;
      }
      if (params.get('caps') === 'share') {
        ui.caps.modelContext = true;
        share = X.createShareController({ modelContext: { update: function noop() { return Promise.resolve(undefined); } } });
        if (name === 'stale') share.restore({ status: 'match', entity: { id: IDS.d1, version: 'older' } }, IDS.ws);
      }
      ui.tokens = tokens;
      accept(s, undefined, 'host');
      ui.syncedAt = new Date(NOW - 4 * 60 * 1000);
      if (failed) ui.fetchFailedAt = new Date();
      render();
    }

    // ----------------------------------------------------------------- boot
    if (isGallery) {
      runGallery();
      return;
    }

    render();
    R.initWidget({
      bridge: 'mcp-apps-sdk',
      dataAvailabilityNotice: false,
      onHostContext: onHostContext,
      onFailure: function onFailure(decoded) {
        var auth = authFailure(decoded);
        if (auth) ui.auth = { code: auth };
        else ui.fetchFailedAt = new Date();
        if (!ui.snapshot && !auth) {
          ui.snapshot = {
            schema: 'orgx.panel.v1', generated_at: new Date(0).toISOString(), state: 'degraded', workspace: null,
            attention: { pending: 0, oldest_at: null, blocking: false }, queue: [], focus: null,
            selection: { requested_id: null, status: 'default' }, proof: { last_accepted: null, completed_unaccepted: 0 },
            degraded: ['decisions_unavailable'],
          };
        }
        render();
        return true;
      },
      render: function onHostResult(data) {
        if (data === null || data === undefined) { render(); return; }
        if (accept(data, R.getToolResponseMetadata ? { 'orgx/widgetApproval': R.getToolResponseMetadata(APPROVAL_META_KEY) } : null, 'host')) {
          render();
        }
      },
    });
  })();
  </script>
</body>
</html>
