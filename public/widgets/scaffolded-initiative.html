      :root {
        --ox-lime: #a3e635; /* Will be overwritten by specific widgets */
        --ox-teal: #0d9488;
        --ox-danger: #e11d48;
        --ox-warning: #d97706;

        --ox-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }
      
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ox-lime: #D4ED31;
          --ox-teal: #00C9A7;
          --ox-danger: #F43F5E;
          --ox-warning: #FBBF24;

          --ox-shadow: 0 16px 40px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
      }
      
      :root[data-theme="dark"] {
          --ox-lime: #D4ED31;
          --ox-teal: #00C9A7;
          --ox-danger: #F43F5E;
          --ox-warning: #FBBF24;
          --ox-iris: #6366f1;
          --ox-grid: rgba(255, 255, 255, 0.02);
          --ox-shadow: 0 16px 40px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      }

      /* Smooth UX Transitions */
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(16px) scale(0.98); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      .animate-in { opacity: 0; animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .delay-1 { animation-delay: 0.1s; }
      .delay-2 { animation-delay: 0.2s; }
      .delay-3 { animation-delay: 0.3s; }
      .scaffold-state {
        --scaffold-ease: cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
        padding: 20px;
        border-radius: 22px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(var(--ox-primary-rgb), 0.05), transparent 48%),
          var(--scaffold-shell-surface);
        border: 1px solid rgba(var(--ox-primary-rgb), 0.11);
        box-shadow: var(--scaffold-shell-shadow);
      }

      .scaffold-state::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 0%, rgba(var(--ox-primary-rgb), 0.16), transparent 52%),
          linear-gradient(180deg, rgba(var(--ox-primary-rgb), 0.08), transparent 40%);
        opacity: 0.9;
        z-index: -2;
      }

      .scaffold-state::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: 21px;
        border: 1px solid var(--scaffold-shell-outline);
        pointer-events: none;
        z-index: -1;
      }

      .scaffold-state__chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .scaffold-state__eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--ox-mono);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ox-text-muted);
      }

      .scaffold-state__eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgb(var(--ox-primary-rgb)), rgba(var(--ox-primary-rgb), 0.18));
        box-shadow: 0 0 16px rgba(var(--ox-primary-rgb), 0.42);
        animation: scaffoldPulse 2.4s ease-in-out infinite;
      }

      .scaffold-state__status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        font-family: var(--ox-mono);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgb(var(--ox-primary-rgb));
        background: rgba(var(--ox-primary-rgb), 0.1);
        border: 1px solid rgba(var(--ox-primary-rgb), 0.16);
        box-shadow: inset 0 1px 0 var(--scaffold-control-highlight);
      }

      .scaffold-state--awaiting .scaffold-state__status {
        color: var(--ox-warning);
        background: rgba(217, 119, 6, 0.12);
        border-color: rgba(217, 119, 6, 0.2);
      }

      .scaffold-state__status-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
        box-shadow: 0 0 10px currentColor;
        animation: scaffoldPulse 1.6s ease-in-out infinite;
      }

      @keyframes scaffoldPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.65); opacity: 0.42; }
      }

      .scaffold-state__stage {
        position: relative;
        min-height: 214px;
        border-radius: 18px;
        overflow: hidden;
        background: var(--scaffold-stage-surface);
        border: 1px solid rgba(var(--ox-primary-rgb), 0.08);
      }

      .scaffold-state__stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(var(--ox-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--ox-grid) 1px, transparent 1px);
        background-size: 22px 22px;
        opacity: 0.52;
        mask-image: radial-gradient(ellipse 78% 74% at 50% 48%, black 28%, transparent 100%);
      }

      .scaffold-state__stage::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--scaffold-stage-sheen);
        pointer-events: none;
      }

      .scaffold-state__glow {
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
        filter: blur(12px);
        opacity: 0.88;
      }

      .scaffold-state__glow--one {
        top: 20px;
        left: 18px;
        width: 108px;
        height: 108px;
        background: radial-gradient(circle, rgba(var(--ox-primary-rgb), 0.18), transparent 72%);
        animation: scaffoldFloat 8.2s ease-in-out infinite;
      }

      .scaffold-state__glow--two {
        right: 30px;
        bottom: 26px;
        width: 134px;
        height: 134px;
        background: radial-gradient(circle, rgba(20, 184, 166, 0.12), transparent 74%);
        animation: scaffoldFloat 9.6s ease-in-out infinite reverse;
      }

      @keyframes scaffoldFloat {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(0, -12px, 0) scale(1.04); }
      }

      .scaffold-state__scene {
        position: absolute;
        inset: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: translate3d(0, 10px, 0) scale(0.975);
        filter: blur(3px);
        transition:
          opacity 0.55s var(--scaffold-ease),
          transform 0.55s var(--scaffold-ease),
          filter 0.55s var(--scaffold-ease);
        pointer-events: none;
      }

      .scaffold-state__scene.active {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
        filter: blur(0);
        pointer-events: auto;
      }

      .scaffold-state__icon-tile {
        --scene-rgb: var(--ox-primary-rgb);
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgb(var(--scene-rgb));
        background: rgba(var(--scene-rgb), 0.12);
        border: 1px solid rgba(var(--scene-rgb), 0.18);
        box-shadow:
          inset 0 1px 0 var(--scaffold-control-highlight),
          0 18px 28px -24px rgba(var(--scene-rgb), 0.6);
      }

      .scaffold-state__icon-tile::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 24px;
        background: radial-gradient(circle, rgba(var(--scene-rgb), 0.14), transparent 72%);
        opacity: 0;
        transition: opacity 0.45s ease;
      }

      .scaffold-state__scene.active .scaffold-state__icon-tile::after {
        opacity: 1;
      }

      .scaffold-state__icon-tile svg {
        position: relative;
        z-index: 1;
      }

      .scaffold-state__chip-group {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        max-width: 320px;
      }

      .scaffold-state__chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--scaffold-chip-surface);
        border: 1px solid rgba(var(--chip-rgb), 0.16);
        color: rgb(var(--chip-rgb));
        font-size: 0.68rem;
        font-weight: 650;
        letter-spacing: 0.04em;
        box-shadow: inset 0 1px 0 var(--scaffold-control-highlight);
        opacity: 0;
        transform: translateY(8px);
      }

      .scaffold-state__scene.active .scaffold-state__chip {
        animation: scaffoldLiftIn 0.48s var(--scaffold-ease) forwards;
        animation-delay: var(--chip-delay, 0ms);
      }

      @keyframes scaffoldLiftIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .scaffold-state__chip svg {
        flex: none;
      }

      .scaffold-state__lane-stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(280px, 100%);
      }

      .scaffold-state__lane {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
      }

      .scaffold-state__lane-marker {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        transform: rotate(45deg);
        background: rgb(var(--lane-rgb));
        box-shadow: 0 0 14px rgba(var(--lane-rgb), 0.2);
        opacity: 0;
      }

      .scaffold-state__scene.active .scaffold-state__lane-marker {
        animation: scaffoldMarkerIn 0.34s var(--scaffold-ease) forwards;
        animation-delay: var(--lane-delay, 0ms);
      }

      @keyframes scaffoldMarkerIn {
        to { opacity: 1; transform: rotate(45deg) scale(1); }
      }

      .scaffold-state__lane-track {
        position: relative;
        height: 7px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--scaffold-lane-track-surface);
      }

      .scaffold-state__lane-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(var(--lane-rgb), 0.88), rgba(var(--lane-rgb), 0.52));
        box-shadow: 0 0 18px rgba(var(--lane-rgb), 0.18);
      }

      .scaffold-state__scene.active .scaffold-state__lane-fill {
        animation: scaffoldLaneFill 1.6s var(--scaffold-ease) forwards;
        animation-delay: calc(var(--lane-delay, 0ms) + 100ms);
      }

      @keyframes scaffoldLaneFill {
        to { width: var(--lane-fill, 50%); }
      }

      .scaffold-state__lane-label {
        font-family: var(--ox-mono);
        font-size: 0.54rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--scaffold-lane-label);
      }

      .scaffold-state__task-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .scaffold-state__task-cell {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--scaffold-cell-surface);
        border: 1px solid rgba(var(--cell-rgb), 0.14);
        color: rgb(var(--cell-rgb));
        opacity: 0;
        transform: scale(0.82);
      }

      .scaffold-state__scene.active .scaffold-state__task-cell {
        animation: scaffoldCellIn 0.36s var(--scaffold-ease) forwards;
        animation-delay: var(--cell-delay, 0ms);
      }

      @keyframes scaffoldCellIn {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .scaffold-state__task-cell--pending svg {
        opacity: 0.54;
      }

      .scaffold-state__agent-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        max-width: 320px;
      }

      .scaffold-state__agent {
        width: 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: translateY(10px);
      }

      .scaffold-state__scene.active .scaffold-state__agent {
        animation: scaffoldLiftIn 0.42s var(--scaffold-ease) forwards;
        animation-delay: var(--agent-delay, 0ms);
      }

      .scaffold-state__agent-shell {
        position: relative;
        width: 42px;
        height: 42px;
      }

      .scaffold-state__agent-avatar {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        overflow: hidden;
        border: 1px solid rgba(var(--agent-rgb), 0.18);
        background: rgba(var(--agent-rgb), 0.1);
        color: rgb(var(--agent-rgb));
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--ox-mono);
        font-size: 0.74rem;
        font-weight: 700;
        box-shadow:
          0 12px 24px -22px rgba(var(--agent-rgb), 0.78),
          inset 0 1px 0 var(--scaffold-control-highlight);
      }

      .scaffold-state__agent-avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .scaffold-state__agent-shell .domain-badge {
        position: absolute;
        right: -3px;
        bottom: -2px;
      }

      .scaffold-state__agent-label {
        font-size: 0.54rem;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        color: var(--scaffold-agent-label);
      }

      .scaffold-state__tip-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(280px, 100%);
      }

      .scaffold-state__tip {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 10px;
        padding: 10px 13px;
        border-radius: 12px;
        background: var(--scaffold-tip-surface);
        border: 1px solid rgba(var(--tip-rgb), 0.1);
        opacity: 0;
        transform: translateX(-8px);
      }

      .scaffold-state__scene.active .scaffold-state__tip {
        animation: scaffoldTipIn 0.42s var(--scaffold-ease) forwards;
        animation-delay: var(--tip-delay, 0ms);
      }

      @keyframes scaffoldTipIn {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .scaffold-state__tip-icon {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(var(--tip-rgb), 0.1);
        color: rgb(var(--tip-rgb));
      }

      .scaffold-state__tip-copy {
        font-size: 0.66rem;
        line-height: 1.45;
        color: var(--scaffold-tip-copy);
      }

      .scaffold-state__tip-copy strong {
        color: var(--ox-text);
        font-weight: 650;
      }

      .scaffold-state__caption {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 76px;
        text-align: center;
      }

      .scaffold-state__caption-title {
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--ox-text);
        transition: opacity 0.24s ease, transform 0.24s ease;
      }

      .scaffold-state__caption-desc {
        max-width: 320px;
        margin: 0 auto;
        font-size: 0.7rem;
        line-height: 1.5;
        color: var(--scaffold-caption-copy);
        transition: opacity 0.24s ease, transform 0.24s ease;
      }

    .node-item.ms .node-icon { color: var(--ox-warning); }

    .tree-rail {

      top: 0;

    .node-item.ms .tree-rail {

    .node-item.tk .tree-rail {

    }

    .tree-line,
    .tree-elbow {
      position: absolute;
    }

    .tree-line {
      width: var(--tree-stroke);
      background: var(--ox-border-strong);
    }

    .tree-line--outer {
      left: calc(var(--tree-outer-x) - (var(--tree-stroke) / 2));
    }
    .tree-line--inner {
      left: calc(var(--tree-inner-x) - (var(--tree-stroke) / 2));
    }
    .tree-line--top {
      top: 0;
      bottom: calc(50% - var(--tree-elbow-rise));
    }
    .tree-line--bottom {
      top: 50%;
      bottom: calc(-1 * var(--tree-gap));
    }

    .tree-elbow {
      top: calc(50% - var(--tree-elbow-rise));
      height: var(--tree-elbow-rise);
    }

    .tree-elbow--outer {
      left: var(--tree-outer-x);
      width: var(--tree-elbow-run-outer);
    }

    .tree-elbow--inner {
      left: var(--tree-inner-x);
      width: var(--tree-elbow-run-inner);
    }

    .tree-elbow svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .tree-elbow path {
      fill: none;
      stroke: var(--ox-border-strong);
      stroke-width: var(--tree-stroke);
      stroke-linecap: butt;
      stroke-linejoin: round;
    }

    .tree-label {

    }

    
    .badge-id { font-family: var(--ox-mono); font-size: 0.53rem; padding: 2px 6px; border-radius: 999px; border: 1px solid var(--ox-border); color: var(--ox-text-muted); letter-spacing: 0.05em; line-height: 1; white-space: nowrap; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; background: rgba(var(--ox-primary-rgb), 0.1); color: var(--ox-primary); font-family: var(--ox-mono); font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid rgba(var(--ox-primary-rgb), 0.2); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  
    .node-toggle {
      width: 30px;
      min-width: 30px;
      height: 30px;
      margin-right: 0;
      color: var(--ox-text-muted);
      transition:
        color var(--widget-motion-fast) var(--widget-motion-curve),
        border-color var(--widget-motion-fast) var(--widget-motion-curve),
        background var(--widget-motion-fast) var(--widget-motion-curve);
    }

    .node-toggle[aria-expanded="true"] {
      color: rgb(var(--ws-rgb, var(--ox-primary-rgb)));
      background: rgba(var(--ws-rgb, var(--ox-primary-rgb)), 0.08);
      border-color: rgba(var(--ws-rgb, var(--ox-primary-rgb)), 0.18);
    }

    .node-toggle__glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--widget-motion-base) var(--widget-motion-curve);
    }

    .node-toggle[aria-expanded="false"] .node-toggle__glyph {
      transform: rotate(-90deg);
    }

    /* ─── launch-strip ────────────────────────────────────────
     * Single focal strip with four states: progressing → ready →
     * committing → launched. Replaces the prior three-element bay
     * (ring + body stack + boxy CTA) where each fought for attention.
     *
     * Hierarchy discipline:
     *   - progressing: quiet strip, thin progress bar, concise "awaiting" line
     *   - ready:       strip border picks up iris, full-width hold target
     *                  with progress-fill replacing separate "hold" hint
     *   - launching:   CTA dissolves back into the strip; one soft pulse
     *   - launched:    the element itself transforms — iris mutes, a single
     *                  next-step deep link replaces the CTA. Success is not
     *                  a text swap; it is a structural change.
     */
    .launch-strip {
      margin-top: 28px;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--ox-border);
      background: var(--ox-panel);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition:
        background 320ms var(--widget-motion-curve),
        border-color 320ms var(--widget-motion-curve);
    }
    .launch-strip__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 14px;
    }
    .launch-strip__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--ox-mono);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ox-text-muted);
      transition: color 240ms var(--widget-motion-curve);
    }
    .launch-strip__eyebrow svg { opacity: 0.85; }
    .launch-strip__count {
      font-size: 0.8rem;
      color: var(--ox-text);
      font-weight: 500;
    }
    .launch-strip__progress {
      position: relative;
      height: 3px;
      border-radius: 2px;
      background: var(--ox-well-bg);
      overflow: hidden;
    }
    .launch-strip__progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      height: 100%;
      background: rgba(var(--ox-primary-rgb), 0.55);
      border-radius: 2px;
      transition: width 420ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .launch-strip__missing {
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--ox-text-muted);
    }
    .launch-strip__missing strong {
      color: var(--ox-text);
      font-weight: 500;
    }

    /* Ready — border picks up iris, CTA emerges. */
    .launch-strip.is-ready {
      border-color: rgba(var(--ox-primary-rgb), 0.38);
      background:
        linear-gradient(180deg, rgba(var(--ox-primary-rgb), 0.04), transparent 70%),
        var(--ox-panel);
    }
    .launch-strip.is-ready .launch-strip__eyebrow { color: var(--ox-primary); }

    .launch-strip__cta {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      /* Card-height target: hold-to-launch is the primary decision on the
       * whole surface; give it thumb-comfortable height and touch hints.
       * touch-action: manipulation suppresses double-tap-zoom + scroll
       * conflict on mobile; user-select: none prevents the hold from
       * triggering the OS text-selection menu mid-press. */
      min-height: 64px;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(var(--ox-primary-rgb), 0.42);
      background: rgba(var(--ox-primary-rgb), 0.08);
      color: var(--ox-primary);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.005em;
      cursor: pointer;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        background 200ms var(--widget-motion-curve),
        border-color 200ms var(--widget-motion-curve),
        transform 120ms var(--widget-motion-curve);
    }
    .launch-strip__cta:hover { background: rgba(var(--ox-primary-rgb), 0.12); }
    .launch-strip__cta.is-holding { transform: scale(0.995); }
    .launch-strip__cta:focus-visible {
      outline: 2px solid rgba(var(--ox-primary-rgb), 0.55);
      outline-offset: 3px;
    }
    .launch-strip__cta-sub {
      display: block;
      margin-top: 2px;
      font-family: var(--ox-mono);
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(var(--ox-primary-rgb), 0.7);
    }
    .launch-strip__cta-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: rgba(var(--ox-primary-rgb), 0.22);
      pointer-events: none;
      transition: width 80ms linear;
    }
    .launch-strip__cta.is-holding .launch-strip__cta-fill {
      transition: width 820ms linear;
      width: 100%;
    }
    .launch-strip__cta-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      line-height: 1.2;
    }
    .launch-strip__cta-arrow {
      position: relative;
      z-index: 1;
      opacity: 0.65;
      transition: transform 200ms var(--widget-motion-curve), opacity 200ms;
    }
    .launch-strip__cta:hover .launch-strip__cta-arrow {
      opacity: 1;
      transform: translateX(2px);
    }

    /* Launching — CTA gone, strip hosts a single soft pulse. */
    .launch-strip.is-launching {
      border-color: rgba(var(--ox-primary-rgb), 0.28);
    }
    .launch-strip.is-launching .launch-strip__progress-fill {
      width: 100%;
      animation: launchStripPulse 1200ms ease-in-out infinite;
    }
    @keyframes launchStripPulse {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 0.9; }
    }

    /* Launched — element transforms: iris fades to quiet, a single
     * next-step link takes the commit slot. No residual CTA. */
    .launch-strip.is-launched {
      border-color: rgba(var(--ox-primary-rgb), 0.18);
      background: rgba(var(--ox-primary-rgb), 0.04);
    }
    .launch-strip.is-launched .launch-strip__eyebrow {
      color: rgba(var(--ox-primary-rgb), 0.85);
    }
    .launch-strip__detail {
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--ox-text-muted);
    }
    .launch-strip__next {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-end;
      padding: 6px 10px;
      margin: -6px -10px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--ox-primary);
      text-decoration: none;
      transition: background 160ms var(--widget-motion-curve);
    }
    .launch-strip__next:hover { background: rgba(var(--ox-primary-rgb), 0.08); }
    .launch-strip__next svg {
      opacity: 0.7;
      transition: transform 200ms var(--widget-motion-curve), opacity 200ms;
    }
    .launch-strip__next:hover svg { opacity: 1; transform: translateX(2px); }

    /* ─── Launched — Creation-mode emergence ───────────────────────
     *
     * This is the one place OrgX celebrates. Controlled emergence:
     * iris particles rise from below, the workstream rail pulses each
     * lane online in sequence, and the primary CTA expands to a
     * card-height button. No confetti. Signal coming online, not a
     * party popper. (per orgx-design/references/philosophy.md)
     * ─────────────────────────────────────────────────────────── */
    .launch-strip.is-launched {
      position: relative;
      overflow: hidden;
      padding-bottom: 18px;
    }
    .launch-strip__emergence {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 1;
    }
    .launch-strip__stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
      z-index: 0;
    }
    .launch-strip__stage::before {
      content: '';
      position: absolute;
      inset: -40% -20% auto -20%;
      height: 70%;
      background: radial-gradient(
          ellipse 60% 70% at 50% 100%,
          rgba(var(--ox-primary-rgb), 0.22),
          transparent 70%
        );
      opacity: 0;
      animation: launchStageGlow 6800ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes launchStageGlow {
      0%   { opacity: 0; transform: translateY(20%); }
      20%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0.35; transform: translateY(0); }
    }
    .launch-strip__particle {
      position: absolute;
      bottom: -14px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgb(var(--ox-primary-rgb));
      filter: blur(0.5px);
      box-shadow: 0 0 12px 2px rgba(var(--ox-primary-rgb), 0.55);
      opacity: 0;
      animation: launchParticleRise 7200ms cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes launchParticleRise {
      0%   { transform: translateY(0) scale(0.6); opacity: 0; }
      12%  { opacity: 0.9; }
      85%  { opacity: 0.4; }
      100% { transform: translateY(-140px) scale(1); opacity: 0; }
    }
    .launch-strip__horizon {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 24%;
      height: 1px;
      background: linear-gradient(
          90deg,
          transparent,
          rgba(var(--ox-primary-rgb), 0.45) 40%,
          rgba(var(--ox-primary-rgb), 0.45) 60%,
          transparent
        );
      opacity: 0;
      animation: launchHorizonDrift 7200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes launchHorizonDrift {
      0%   { opacity: 0; transform: translateY(6px); }
      22%  { opacity: 1; }
      100% { opacity: 0.55; transform: translateY(-2px); }
    }

    .launch-strip__streams {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px 12px;
      margin-top: 2px;
    }
    .launch-strip__stream {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(var(--ox-primary-rgb), 0.06);
      border: 1px solid rgba(var(--ox-primary-rgb), 0.12);
      font-size: 0.78rem;
      color: var(--ox-text);
      opacity: 0;
      transform: translateY(6px);
      animation: launchStreamActivate 560ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--stream-delay, 0ms);
    }
    @keyframes launchStreamActivate {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .launch-strip__stream-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgb(var(--ox-primary-rgb));
      box-shadow: 0 0 8px 1px rgba(var(--ox-primary-rgb), 0.6);
      animation: launchStreamPulse 2400ms cubic-bezier(0.16, 1, 0.3, 1) infinite;
      animation-delay: var(--stream-delay, 0ms);
      flex-shrink: 0;
    }
    @keyframes launchStreamPulse {
      0%, 100% { opacity: 0.6; transform: scale(0.85); }
      50%      { opacity: 1;   transform: scale(1.05); }
    }
    .launch-strip__stream-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .launch-strip__primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(var(--ox-primary-rgb), 0.35);
      background: rgba(var(--ox-primary-rgb), 0.1);
      color: var(--ox-primary);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 160ms var(--widget-motion-curve),
                  border-color 160ms var(--widget-motion-curve),
                  transform 160ms var(--widget-motion-curve);
      min-height: 64px;
      opacity: 0;
      transform: translateY(4px);
      animation: launchStreamActivate 560ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--stream-delay, 0ms);
    }
    .launch-strip__primary:hover {
      background: rgba(var(--ox-primary-rgb), 0.16);
      border-color: rgba(var(--ox-primary-rgb), 0.55);
      transform: translateY(-1px);
    }
    .launch-strip__primary:focus-visible {
      outline: 2px solid rgb(var(--ox-primary-rgb));
      outline-offset: 2px;
    }
    .launch-strip__primary-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .launch-strip__primary-title { font-size: 0.95rem; font-weight: 600; }
    .launch-strip__primary-sub {
      font-size: 0.74rem;
      font-weight: 400;
      color: rgba(var(--ox-primary-rgb), 0.75);
      letter-spacing: 0.01em;
    }
    .launch-strip__primary-arrow {
      flex-shrink: 0;
      transition: transform 200ms var(--widget-motion-curve);
    }
    .launch-strip__primary:hover .launch-strip__primary-arrow {
      transform: translateX(3px);
    }

    @media (prefers-reduced-motion: reduce) {
      .launch-strip__cta.is-holding .launch-strip__cta-fill { transition-duration: 300ms; }
      .launch-strip.is-launching .launch-strip__progress-fill {
        animation: none;
        opacity: 0.7;
      }
      .launch-strip__progress-fill { transition-duration: 160ms; }
      .launch-strip__stage::before,
      .launch-strip__particle,
      .launch-strip__horizon,
      .launch-strip__stream-dot { animation: none; opacity: 0.7; }
      .launch-strip__stream,
      .launch-strip__primary { animation: none; opacity: 1; transform: none; }
    }

    .widget-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--ox-border); gap: 12px; }
    .deep-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding-inline: 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ox-primary);
    }
    .deep-link svg { width: 14px; height: 14px; }

    @media (max-width: 560px) {
      .section-head {
        align-items: stretch;
        flex-direction: column;
      }

      .section-toggle-all {
        width: 100%;
        justify-content: center;
      }

      /* Launch strip: thumbable CTA + tight eyebrow row. The hold-to-launch
       * is the surface's primary decision and needs thumb-comfortable
       * height on mobile; 72px vertical is card-height at this width. */
      .launch-strip {
        margin-top: 22px;
        padding: 14px 14px 16px;
      }
      .launch-strip__cta {
        min-height: 72px;
        padding: 14px 16px;
        font-size: 1rem;
      }
      .launch-strip__cta-sub { font-size: 0.6rem; }
      .launch-strip__primary {
        min-height: 72px;
        padding: 16px 18px;
        font-size: 1rem;
      }
      /* Child counts (5 milestones · 12 tasks) hide on narrow width — the
       * row is already tight, and the toggle glyph telegraphs "more here". */
      .ws-child-count { display: none; }

      .node-list {
        --tree-gap: 11px;
        gap: 20px;
      }

      .widget-footer {
        flex-direction: column;
        align-items: stretch;
      }

      .deep-link {
        width: 100%;
      }

      .widget-build-marker {
        left: 8px;
        bottom: 6px;
        font-size: 0.42rem;
      }

      .node-item.ws {
        gap: 12px;
        padding: 14px 12px;
      }

      .ws-children-inner {
        padding-top: 12px;
        padding-bottom: 4px;
      }

      .ws-shell {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }

      .ws-topline {
        gap: 10px;
        align-items: start;
      }

      .ws-execution {
        justify-content: flex-start;
        padding-left: 30px;
        gap: 8px;
        flex-wrap: wrap;
      }

      .progress-ring {
        width: 32px;
        height: 32px;
      }

      .status-badge {
        min-height: 26px;
        padding-inline: 9px;
      }

      .scaffold-state {
        padding: 20px;
        border-radius: 20px;
        gap: 18px;
      }

      .scaffold-state__stage {
        min-height: 230px;
      }

      .scaffold-state__scene {
        inset: 14px;
      }

      .scaffold-state__icon-tile {
        width: 54px;
        height: 54px;
      }

      .scaffold-state__chip-group {
        gap: 10px;
      }

      .scaffold-state__chip {
        min-width: 0;
        padding: 8px 12px;
        font-size: 0.61rem;
      }

      .scaffold-state__lane-stack {
        width: min(236px, 100%);
        gap: 10px;
      }

      .scaffold-state__lane {
        gap: 10px;
      }

      .scaffold-state__lane-track {
        width: 146px;
      }

      .scaffold-state__task-grid {
        gap: 7px;
      }

      .scaffold-state__task-cell {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }

      .scaffold-state__agent-row {
        gap: 9px;
      }

      .scaffold-state__agent {
        width: 58px;
      }

      .scaffold-state__tip-list {
        width: 100%;
      }

      .scaffold-state__caption {
        min-height: 72px;
      }
    }

    @media (max-width: 420px) {
      .node-item.ws {
        padding-right: 12px;
      }

      .ws-topline {
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 9px;
      }

      .ws-title {
        font-size: 0.88rem;
        line-height: 1.22;
      }

      .agent-presence {
        width: 30px;
        height: 30px;
      }

      .agent-presence__tooltip {
        right: -4px;
        max-width: 160px;
        bottom: calc(100% + 10px);
      }

      .ws-execution {
        padding-left: 29px;
      }

      .scaffold-state {
        padding: 18px;
        gap: 16px;
      }

      .scaffold-state__stage {
        min-height: 212px;
      }

      .scaffold-state__scene {
        inset: 12px;
      }

      .scaffold-state__icon-tile {
        width: 50px;
        height: 50px;
        border-radius: 16px;
      }

      .scaffold-state__chip-group {
        gap: 8px;
      }

      .scaffold-state__chip {
        padding: 8px 11px;
        font-size: 0.58rem;
        gap: 7px;
      }

      .scaffold-state__lane {
        gap: 8px;
      }

      .scaffold-state__lane-marker {
        width: 20px;
        height: 20px;
      }

      .scaffold-state__lane-track {
        width: 132px;
      }

      .scaffold-state__lane-label {
        font-size: 0.5rem;
      }

      .scaffold-state__task-grid {
        gap: 6px;
      }

      .scaffold-state__task-cell {
        width: 31px;
        height: 31px;
        border-radius: 9px;
      }

      .scaffold-state__agent-row {
        gap: 8px;
        max-width: 280px;
      }

      .scaffold-state__agent {
        width: 54px;
      }

      .scaffold-state__agent-shell,
      .scaffold-state__agent-avatar {
        width: 38px;
        height: 38px;
      }

      .scaffold-state__agent-label {
        font-size: 0.51rem;
      }

      .scaffold-state__tip {
        padding: 9px 11px;
        gap: 9px;
      }

      .scaffold-state__tip-icon {
        width: 28px;
        height: 28px;
      }

      .scaffold-state__tip-copy {
        font-size: 0.63rem;
      }

      .scaffold-state__caption {
        min-height: 68px;
      }

      .scaffold-state__caption-title {
        font-size: 0.92rem;
      }

      .scaffold-state__caption-desc {
        font-size: 0.67rem;
      }
    }
  </style>

<body>
  <div class="container" id="content"></div>
  <script>
    var queryParams = new URLSearchParams(window.location.search);
    var widgetBuildVersion = (queryParams.get('v') || queryParams.get('version') || 'dev').trim() || 'dev';

    var escapeMarkerHtml = (str) => {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    };

    var renderWidgetBuildMarker = () => {
      var version = escapeMarkerHtml(widgetBuildVersion);
      return '<div class="widget-build-marker" aria-hidden="true" title="Widget build ' + version + '">w ' + version + '</div>';
    };

    var injectHtml = (html) => {
      const content = document.getElementById('content');
      content.innerHTML = html + renderWidgetBuildMarker();
    };

    function _detectProtocol(){if(typeof window.openai!=='undefined')return'chatgpt';if(window.parent&&window.parent!==window)return'mcp-apps';return'standalone';}
    // openWidgetLink: route external link clicks through the host API so
    // Claude Desktop / MCP hosts prompt the user to open externally instead

        scaffoldStateCaptionTimer = 0;
      }
    };

    var setScaffoldStateFrame = (root, nextIndex, options) => {
      if (!root) return;
      var scenes = Array.from(root.querySelectorAll('[data-scaffold-scene]'));
      if (!scenes.length) return;
      var safeIndex = Number(nextIndex);
      if (!Number.isFinite(safeIndex)) safeIndex = 0;
      safeIndex = ((safeIndex % scenes.length) + scenes.length) % scenes.length;
      var immediate = !!(options && options.immediate);
      var titleEl = root.querySelector('[data-scaffold-caption-title]');
      var descEl = root.querySelector('[data-scaffold-caption-desc]');
      var dots = Array.from(root.querySelectorAll('[data-scaffold-dot]'));
      var activeScene = scenes[safeIndex];
      var applyFrame = function() {
        scenes.forEach(function(scene, index) {
          scene.classList.toggle('active', index === safeIndex);
        });
        if (titleEl) {
          titleEl.textContent = activeScene.getAttribute('data-caption-title') || '';
          titleEl.classList.remove('is-fading');
        }
        if (descEl) {
          descEl.textContent = activeScene.getAttribute('data-caption-desc') || '';
          descEl.classList.remove('is-fading');
        }
        dots.forEach(function(dot, index) {
          dot.classList.toggle('active', index === safeIndex);
          dot.classList.toggle('done', index < safeIndex);
          dot.setAttribute('aria-pressed', String(index === safeIndex));
        });
        scaffoldStateCurrentIndex = safeIndex;
        root.dataset.currentScene = String(safeIndex);
        _scheduleSizeSync([0, 90, 220, 420]);
        _syncSizeDuringTransition(460);
      };
      if (immediate || !titleEl || !descEl) {
        applyFrame();
        return;
      }
      titleEl.classList.add('is-fading');
      descEl.classList.add('is-fading');
      if (scaffoldStateCaptionTimer) window.clearTimeout(scaffoldStateCaptionTimer);
      scaffoldStateCaptionTimer = window.setTimeout(applyFrame, 170);
    };

    var initScaffoldStateAnimation = () => {
      stopScaffoldStateAnimation();
      var root = document.querySelector('[data-scaffold-state]');
      if (!root) return;
      var scenes = Array.from(root.querySelectorAll('[data-scaffold-scene]'));
      if (!scenes.length) return;
      var interval = Math.max(3000, Number(root.getAttribute('data-scaffold-interval')) || 4200);
      var restartTimer = function() {
        if (scaffoldStateCycleTimer) window.clearInterval(scaffoldStateCycleTimer);
        scaffoldStateCycleTimer = window.setInterval(function() {
          setScaffoldStateFrame(root, scaffoldStateCurrentIndex + 1);
        }, interval);
      };
      Array.from(root.querySelectorAll('[data-scaffold-dot]')).forEach(function(dot) {
        dot.addEventListener('click', function() {
          var targetIndex = Number(dot.getAttribute('data-scaffold-index'));
          if (!Number.isFinite(targetIndex)) return;
          setScaffoldStateFrame(root, targetIndex);
          restartTimer();
        });
      });
      setScaffoldStateFrame(root, Number(root.dataset.currentScene) || 0, { immediate: true });
      restartTimer();
      _scheduleSizeSync([24, 180, 420, 760]);
      _syncSizeDuringTransition(520);
    };


    
    var syncToggleAllControl = () => {
      var control = document.querySelector('[data-toggle-all]');
      if (!control) return;
      var toggles = Array.from(document.querySelectorAll('.node-toggle'));
      var allExpanded = toggles.length > 0 && toggles.every((toggle) => toggle.getAttribute('data-expanded') === 'true');
      control.setAttribute('data-expanded', String(allExpanded));
      control.setAttribute('aria-label', allExpanded ? 'Collapse all workstreams' : 'Expand all workstreams');
      var label = control.querySelector('[data-toggle-all-label]');
      if (label) label.textContent = allExpanded ? 'Collapse all' : 'Expand all';
    };

    var setWorkstreamExpanded = (btn, nextExpanded, options) => {
       const opts = options || {};
       const block = btn.closest('[data-ws-block]');
       const children = block ? block.querySelector('[data-ws-children]') : null;
       if (!children) return;
       if (children.__collapseTimer) {
         window.clearTimeout(children.__collapseTimer);
         children.__collapseTimer = null;
       }
       btn.setAttribute('data-expanded', String(nextExpanded));
       btn.setAttribute('aria-expanded', String(nextExpanded));
       children.setAttribute('aria-hidden', String(!nextExpanded));
       block.classList.toggle('is-collapsed', !nextExpanded);
       if (nextExpanded) {
         children.hidden = false;
         window.requestAnimationFrame(() => {
           children.classList.remove('is-collapsed');
         });
       } else {
         children.classList.add('is-collapsed');
         children.__collapseTimer = window.setTimeout(() => {
           if (children.classList.contains('is-collapsed')) children.hidden = true;
         }, 260);
       }
       if (nextExpanded) animateHierarchyRows(children);
       if (!opts.skipLayoutSync) {
         queueTreeLayout(nextExpanded);
         window.setTimeout(() => queueTreeLayout(false), 620);
         _scheduleSizeSync([24, 160, 320, 640, 860]);
         _syncSizeDuringTransition(420);
       }
       if (!opts.skipToggleSync) syncToggleAllControl();
    };

    window.toggleNode = (btn) => {
       const isExpanded = btn.getAttribute('data-expanded') === 'true';
       setWorkstreamExpanded(btn, !isExpanded);
    };

    window.toggleAllWorkstreams = (btn) => {
       const toggles = Array.from(document.querySelectorAll('.node-toggle'));
       if (!toggles.length) return;
       const shouldExpand = toggles.some((toggle) => toggle.getAttribute('data-expanded') !== 'true');
       toggles.forEach((toggle) => setWorkstreamExpanded(toggle, shouldExpand, { skipLayoutSync: true, skipToggleSync: true }));
       syncToggleAllControl();
       queueTreeLayout(shouldExpand);
       window.setTimeout(() => queueTreeLayout(false), 620);
       _scheduleSizeSync([24, 120, 240, 520, 860]);
       _syncSizeDuringTransition(480);
    };

    /* ─── launch-readiness (Phase 3 cinematic) ───────────────────
     * Rendered after the tree whenever the scaffold is in a
     * pre-launch state (status draft/scaffolded). Computes 5 gates
     * from the scaffold data and composes a ring-driven CTA that
     * calls orgx_act launch via the MCP host when the user
     * holds the button.
     */
    var computeLaunchReadiness = (scaffold) => {
      const sections = (scaffold && scaffold.sections) || [];
      const initiative = (scaffold && scaffold.initiative) || {};
      const allMilestones = sections.flatMap(s => s.milestones || []);
      const allTasks = allMilestones.flatMap(m => m.tasks || []);

      const checks = [
        {
          id: 'workstreams',
          label: 'Workstreams',
          ok: sections.length >= 2,
          detail: sections.length + ' defined',
        },
        {
          id: 'milestones',
          label: 'Milestones',
          ok: allMilestones.length >= 1,
          detail: allMilestones.length + ' planned',
        },
        {
          id: 'tasks',
          label: 'Tasks',
          ok: allTasks.length >= 1,
          detail: allTasks.length + ' seeded',
        },
        {
          id: 'assignees',
          label: 'Owners',
          ok: sections.every(s => {
            const ex = s.execution || {};
            return (ex.agent_name || ex.primary_agent_name || ex.domain);
          }),
          detail: 'Per workstream',
        },
        {
          id: 'objective',
          label: 'Objective',
          ok: !!initiative.title,
          detail: initiative.title ? 'Named' : 'Missing',
        },
      ];
      const pass = checks.filter(c => c.ok).length;
      return { checks, pass, total: checks.length, ready: pass === checks.length };
    };

    var isDraftStatus = (status) => {
      const s = (status || '').toString().toLowerCase().trim();
      return s === '' || s === 'draft' || s === 'scaffolded' || s === 'awaiting_launch' || s === 'pending';
    };

    // SVG atoms reused by the strip in multiple states.
    var LAUNCH_STRIP_CHECK_SVG =
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
    var LAUNCH_STRIP_ARROW_SVG =
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

    var renderReadyStripBody = (r) => `
        <div class="launch-strip__head">
          <span class="launch-strip__eyebrow">${LAUNCH_STRIP_CHECK_SVG}Ready</span>
          <span class="launch-strip__count">All ${r.total} checks green</span>
        </div>
        <button type="button" class="launch-strip__cta" data-launch-cta aria-label="Hold to launch initiative — activates workstreams and agents">
          <span class="launch-strip__cta-fill" aria-hidden="true"></span>
          <span class="launch-strip__cta-label">
            <span>Hold to launch</span>
            <span class="launch-strip__cta-sub">Activates workstreams and agents</span>
          </span>
          <span class="launch-strip__cta-arrow">${LAUNCH_STRIP_ARROW_SVG}</span>
        </button>`;

    var renderLaunchBay = (scaffold) => {
      if (!scaffold || !scaffold.initiative) return '';
      if (!isDraftStatus(scaffold.initiative.status)) return '';

      const r = computeLaunchReadiness(scaffold);
      const pct = Math.round((r.pass / r.total) * 100);

      if (r.ready) {
        return `<div class="launch-strip is-ready" data-launch-strip aria-live="polite">${renderReadyStripBody(r)}</div>`;
      }

      // Progressing — show what's outstanding in one quiet line. No pills, no
      // ring, no kicker. The progress bar and the missing-check summary are
      // enough signal; the user doesn't need five shapes to understand state.
      const missingLabels = r.checks.filter(c => !c.ok).map(c => escapeHtml(c.label));
      const missingLine = missingLabels.length
        ? `<div class="launch-strip__missing">Awaiting: ${missingLabels.join(' · ')}</div>`
        : '';

      return `
        <div class="launch-strip" data-launch-strip aria-live="polite">
          <div class="launch-strip__head">
            <span class="launch-strip__eyebrow">Readiness</span>
            <span class="launch-strip__count">${r.pass} of ${r.total}</span>
          </div>
          <div class="launch-strip__progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
            <div class="launch-strip__progress-fill" style="width: ${pct}%"></div>
          </div>
          ${missingLine}
        </div>
      `;
    };

    var bindLaunchCta = (scaffold) => {
      const strip = document.querySelector('[data-launch-strip]');
      const cta = strip && strip.querySelector('[data-launch-cta]');
      if (!cta || cta.disabled) return;
      let timer = null;
      let committed = false;

      const transitionToLaunching = () => {
        if (!strip) return;
        strip.classList.remove('is-ready');
        strip.classList.add('is-launching');
        strip.innerHTML = `
          <div class="launch-strip__head">
            <span class="launch-strip__eyebrow">Committing…</span>
          </div>
          <div class="launch-strip__progress" role="progressbar" aria-valuetext="Committing">
            <div class="launch-strip__progress-fill"></div>
          </div>
        `;
      };

      const transitionToLaunched = () => {
        if (!strip) return;
        const initiativeId = (scaffold && scaffold.initiative && (scaffold.initiative.raw_id || scaffold.initiative.id)) || '';
        // Absolute URL. The widget runs inside claudemcpcontent.com in
        // MCP sandboxes, so a relative /live/… path resolves to the wrong
        // origin and the link silently 404s. Prefer server-provided live_url,
        // then construct one against the OrgX web origin.
        const liveUrl = (scaffold && scaffold.live_url) ||
          (initiativeId
            ? `https://useorgx.com/live/${encodeURIComponent(initiativeId)}`
            : 'https://useorgx.com/command');

        // Build the workstream rail for the emergence reveal. Each stream
        // activates on a 180ms stagger so the user sees parallel capacity
        // coming online, not a static "done" label.
        const sections = Array.isArray(scaffold && scaffold.sections) ? scaffold.sections : [];
        const streamCount = Math.min(sections.length, 6);
        const streams = sections.slice(0, streamCount).map((s, i) => {
          const label = (s && (s.title || s.name)) || ('Stream ' + (i + 1));
          const delay = 380 + (i * 180);
          return `
            <div class="launch-strip__stream" style="--stream-delay: ${delay}ms">
              <span class="launch-strip__stream-dot" aria-hidden="true"></span>
              <span class="launch-strip__stream-label">${escapeHtml(label)}</span>
            </div>`;
        }).join('');
        const ctaDelay = 380 + (streamCount * 180) + 140;

        strip.classList.remove('is-launching', 'is-ready');
        strip.classList.add('is-launched');
        strip.innerHTML = `
          <div class="launch-strip__stage" aria-hidden="true">
            <span class="launch-strip__particle" style="left:18%; animation-delay:0ms"></span>
            <span class="launch-strip__particle" style="left:36%; animation-delay:1200ms"></span>
            <span class="launch-strip__particle" style="left:58%; animation-delay:2400ms"></span>
            <span class="launch-strip__particle" style="left:78%; animation-delay:3600ms"></span>
            <span class="launch-strip__horizon"></span>
          </div>
          <div class="launch-strip__emergence">
            <div class="launch-strip__head">
              <span class="launch-strip__eyebrow">${LAUNCH_STRIP_CHECK_SVG}Launched · just now</span>
              <span class="launch-strip__count">${streamCount ? sections.length + ' workstreams activating' : 'Initiative live'}</span>
            </div>
            ${streams ? `<div class="launch-strip__streams">${streams}</div>` : ''}
            <a class="launch-strip__primary" href="${escapeHtml(liveUrl)}" target="_blank" rel="noreferrer" data-launch-next style="--stream-delay: ${ctaDelay}ms">
              <span class="launch-strip__primary-copy">
                <span class="launch-strip__primary-title">Open mission control</span>
                <span class="launch-strip__primary-sub">Live streams · agents · decisions</span>
              </span>
              <span class="launch-strip__primary-arrow" aria-hidden="true">${LAUNCH_STRIP_ARROW_SVG}</span>
            </a>
          </div>
        `;
        const next = strip.querySelector('[data-launch-next]');
        if (next) {
          next.addEventListener('click', (evt) => {
            evt.preventDefault();
            const target = next.getAttribute('href') || liveUrl;
            if (typeof openWidgetLink === 'function') {
              openWidgetLink(target, evt);
            } else if (typeof window !== 'undefined') {
              window.open(target, '_blank', 'noopener,noreferrer');
            }
          });
        }
      };

      const revertToReady = () => {
        if (!strip) return;
        strip.classList.remove('is-launching');
        strip.classList.add('is-ready');
        strip.innerHTML = renderReadyStripBody(computeLaunchReadiness(scaffold));
        bindLaunchCta(scaffold);
      };

      const start = (e) => {
        if (committed) return;
        if (e) e.preventDefault();
        cta.classList.add('is-holding');
        timer = setTimeout(async () => {
          committed = true;
          cta.classList.remove('is-holding');
          transitionToLaunching();
          try {
            if (window.openai && typeof window.openai.callTool === 'function') {
              await window.openai.callTool('orgx_act', {
                type: 'initiative',
                id: scaffold.initiative.raw_id || scaffold.initiative.id,
                action: 'launch',
              });
            }
            transitionToLaunched();
          } catch (err) {
            console.warn('[scaffold:launch] failed', err);
            committed = false;
            revertToReady();
          }
        }, 820);
      };

      const cancel = () => {
        if (timer) { clearTimeout(timer); timer = null; }
        if (!committed) cta.classList.remove('is-holding');
      };

      cta.addEventListener('pointerdown', start);
      cta.addEventListener('pointerup', cancel);
      cta.addEventListener('pointerleave', cancel);
      cta.addEventListener('pointercancel', cancel);
      cta.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ' ') && !committed) {
          e.preventDefault();
          start(e);
        }
      });
      cta.addEventListener('keyup', cancel);
    };

    var render = () => {
      stopScaffoldStateAnimation();
      if (isLoading) {
        injectHtml(renderScaffoldState('loading'));
        initScaffoldStateAnimation();
        return;
      }
      var scaffold = normalizeScaffoldData(data);
      if(!scaffold || !scaffold.initiative) {
        injectHtml(renderScaffoldState('awaiting'));
        initScaffoldStateAnimation();
        return;
      }

      const sections = scaffold.sections || [];
      const renderTask = (task) => {
        return `<div class="node-item tk" data-tk-row>
          <span class="node-icon" style="display:flex; align-items:center;">${icons.task(14)}</span>
          <span class="tree-label">${escapeHtml(readLabel(task, 'Untitled'))}</span>
          ${renderIdBadge(task.display_id, task.raw_id)}
        </div>`;
      };
      const renderMilestone = (milestone) => {
        const omittedTaskCount = typeof milestone.omitted_task_count === 'number' ? milestone.omitted_task_count : 0;
        const omittedTaskRow = omittedTaskCount > 0
          ? `<div class="node-item tk" data-tk-row>
              <span class="node-icon" style="display:flex; align-items:center;">${icons.chevronRight(14)}</span>
              <span class="tree-label">${escapeHtml(omittedTaskCount + ' more task' + (omittedTaskCount === 1 ? '' : 's') + ' in Live View')}</span>
            </div>`
          : '';
        return `<div class="ms-block" data-ms-block>
          <div class="node-item ms" data-ms-row>
            <span class="node-icon" style="display:flex; align-items:center;">${icons.milestone(14)}</span>
            <span class="tree-label">${escapeHtml(readLabel(milestone, 'Untitled'))}</span>
            ${renderIdBadge(milestone.display_id, milestone.raw_id)}
          </div>
          ${milestone.tasks && milestone.tasks.length || omittedTaskRow ? `<div class="ms-tasks">${(milestone.tasks || []).map(renderTask).join('')}${omittedTaskRow}</div>` : ''}
        </div>`;
      };
      const listHtml = sections.map((section) => {
          var execution = section.execution || {};
          var status = execution.status || classifyStatus('not_started');
          var progress = typeof execution.progress_pct === 'number' ? execution.progress_pct : 0;
          var domainKey = execution.domain || 'orchestrator';
          var domainRgb = getDomainRgb(domainKey);
        // Default-collapsed: on first render the workstream children are
        // hidden. Without this the launch CTA sits below 5+ expanded
        // workstream trees on mobile and the user has to scroll to find
        // the decision. The tree is there for structural reassurance, not
        // immediate inspection — users can expand individual rows or all
        // rows via the section-level toggle.
        var childMilestoneCount = Array.isArray(section.milestones) ? section.milestones.length : 0;
        var childTaskCount = typeof section.task_count === 'number'
          ? section.task_count
          : Array.isArray(section.milestones)
          ? section.milestones.reduce((n, m) => n + (typeof m.task_count === 'number' ? m.task_count : (Array.isArray(m.tasks) ? m.tasks.length : 0)), 0)
          : 0;
        var childSummaryBits = [];
        if (childMilestoneCount > 0) childSummaryBits.push(childMilestoneCount + ' milestone' + (childMilestoneCount === 1 ? '' : 's'));
        if (childTaskCount > 0) childSummaryBits.push(childTaskCount + ' task' + (childTaskCount === 1 ? '' : 's'));
        var childSummary = childSummaryBits.join(' · ');
        return `<div class="ws-block is-collapsed" data-ws-block>
        <div class="node-item ws" style="--ws-rgb: ${domainRgb};">
          <div class="ws-shell">
            <div class="ws-copy">
              <div class="ws-topline">
                <span class="ws-node-icon" aria-hidden="true">${icons.workstream(14)}</span>
                <div class="ws-title-stack">
                  <span class="ws-title">${escapeHtml(readLabel(section, 'Untitled'))}</span>
                  <span class="ws-meta">${renderIdBadge(section.display_id, section.raw_id)}${childSummary ? `<span class="ws-child-count" aria-hidden="true">${escapeHtml(childSummary)}</span>` : ''}</span>
                </div>
                ${renderAgentPresence(execution)}
              </div>
            </div>
            <div class="ws-execution">
              ${renderProgressRing(progress, domainRgb)}
              <span class="status-badge ${escapeHtml(status.tone)}" aria-label="${escapeHtml(status.label)}">${status.icon}<span>${escapeHtml(status.shortLabel || status.label)}</span></span>
              <button type="button" class="node-toggle ox-icon-btn ox-icon-btn--sm" onclick="toggleNode(this)" data-expanded="false" aria-expanded="false" aria-label="Expand workstream"><span class="node-toggle__glyph">${icons.chevronDown(12)}</span></button>
            </div>
          </div>
          <div class="ws-children is-collapsed" data-ws-children aria-hidden="true" hidden>
            <div class="ws-children-inner" data-ws-children-inner>
              <div class="tree-overlay" data-tree-overlay aria-hidden="true"></div>
              ${(section.milestones || []).map(renderMilestone).join('')}
            </div>
          </div>
        </div>
      </div>`;
      }).join('');

      const initiativeUrl = data.live_url || (data.initiative.id ? `https://useorgx.com/live/${encodeURIComponent(data.initiative.id)}` : 'https://useorgx.com/live?view=mission-control');

      injectHtml(`
        <div class="ox-card animate-in">
          <div class="ox-card-inner">
            <div class="h-header">
              <div class="h-icon">${icons.initiative(24)}</div>
              <div class="h-copy">
                <div class="ox-eyebrow" style="margin-bottom:4px;">Initiative Scaffolded</div>
                <div class="h-title-row">
                  <h2 class="ox-title" style="font-size:1.3rem;">${escapeHtml(scaffold.initiative.title)}</h2>
                  ${renderIdBadge(scaffold.initiative.display_id, scaffold.initiative.raw_id)}
                </div>
                <div class="status-pill">
                  <div class="status-dot"></div> ${escapeHtml(scaffold.initiative.status)}
                </div>
              </div>
            </div>
            
            <div class="section-head">
              <div class="ox-eyebrow section-kicker">Work Breakdown Structure</div>
              <button type="button" class="section-toggle-all" data-toggle-all data-expanded="false" onclick="toggleAllWorkstreams(this)" aria-label="Expand all workstreams">
                <span data-toggle-all-label>Expand all</span>
                <span class="section-toggle-all__glyph">${icons.chevronDown(12)}</span>
              </button>
            </div>
            <div class="node-list">
              ${listHtml}
            </div>
            ${renderLaunchBay(scaffold)}
            <div class="widget-footer">
              <span style="font-size:0.7rem; font-family:var(--ox-mono); color:var(--ox-text-muted); text-transform:uppercase; letter-spacing:0.05em;">Synced</span>
              <a href="${initiativeUrl}" target="_blank" rel="noreferrer" class="deep-link ox-link-btn ox-link-btn--quiet" data-open-live-view>
                Open Live View
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
              </a>
            </div>
</div>
        </div>
      `);
      const workstreamChildren = Array.from(document.querySelectorAll('[data-ws-children]'));
      workstreamChildren.forEach((children, index) => {
        const baseDelay = index * 210;
        children.dataset.drawBaseDelay = String(baseDelay);
        animateHierarchyRows(children, baseDelay);
      });
      syncToggleAllControl();
      queueTreeLayout(true);
      window.setTimeout(() => queueTreeLayout(false), 760 + Math.max(0, workstreamChildren.length - 1) * 210);
      _scheduleSizeSync([24, 240, 760, 1020]);
      bindLaunchCta(scaffold);

      // Route the footer "Open Live View" anchor through openWidgetLink —
      // inside the claude.ai MCP sandbox, plain `target="_blank"` is blocked
      // by iframe sandbox flags, so the click silently does nothing. The SDK
      // hook dispatches a ui/open-link postMessage to the host, which actually
      // opens the URL.
      const openLiveAnchor = document.querySelector('[data-open-live-view]');
      if (openLiveAnchor) {
        openLiveAnchor.addEventListener('click', (evt) => {
          evt.preventDefault();
          const target = openLiveAnchor.getAttribute('href');
          if (typeof openWidgetLink === 'function') {
            openWidgetLink(target, evt);
          } else if (typeof window !== 'undefined') {
            window.open(target, '_blank', 'noopener,noreferrer');
          }
        });
      }
    };

    window.addEventListener('resize', function(){ queueTreeLayout(false); _scheduleSizeSync([24, 180]); });

    if(isDemo) applyBootPayload();
    else initWidget({ render: d => { applyBootPayload(function(){ if(d) data = d; }); } });
  </script>
