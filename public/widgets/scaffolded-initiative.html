  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      const embed = params.get('embed');
      if (theme) document.documentElement.setAttribute('data-theme', theme);

  <style>
    /* Creation mode keeps its iris identity; canvas Q7 and Z1 supply the shape. */
    :root { --ox-primary: #6366f1; --ox-primary-rgb: 99, 102, 241; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 12px 18px;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: var(--ox-font);
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 640px; margin: 0 auto; position: relative; }

    /* The footer's primary is the kit's action lime, whatever the widget accent. */

    /* One card: header line, initiative, its workstreams, one footer. */
    .wcard.ox-card {
      position: relative;
      display: flex;
      flex-direction: column;
      margin: 0;
      overflow: visible;
      background: var(--ox-panel);
      border: 1px solid var(--ox-border);
      border-radius: 16px;
      box-shadow: var(--ox-shadow);
      --edge-rgb: 100, 116, 139;
    }
    .wcard.ox-card::after {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      opacity: 1;
      background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), .7), transparent);
      pointer-events: none;
    }
    .wcard[data-edge="amber"] { --edge-rgb: 251, 191, 36; }
    .wcard[data-edge="teal"] { --edge-rgb: 0, 201, 167; }
    .wcard[data-edge="red"] { --edge-rgb: 244, 63, 94; }
    .hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; min-width: 0; }
    .hd > ox-glyph { --ox-glyph-size: 18px; flex: none; }
    .kind {
      font-size: 11px; font-weight: 600; line-height: 1;
      letter-spacing: .04em; text-transform: uppercase;
      color: var(--ox-text-muted); white-space: nowrap;
    }
    .sp { flex: 1; }
    .meta { font-size: 11.5px; line-height: 1.3; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bd { padding: 12px 18px 6px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
    .pk-q {
      margin: 0; font-size: 22px; font-weight: 700; line-height: 1.18;
      letter-spacing: -.025em; color: var(--ox-text);
      text-wrap: balance; overflow-wrap: anywhere;
    }
    .badge-id {
      display: inline-flex; align-items: center; height: 20px; padding: 0 6px;
      border-radius: 6px; border: 1px solid var(--ox-border-strong);
      font: 500 10.5px/1 var(--ox-mono); color: var(--ox-text-muted);
      letter-spacing: .02em; white-space: nowrap;
    }
    .note { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ox-text-muted); text-wrap: pretty; }

    /* Z1: the status mix as one segmented bar, with its count beneath. */
    .mix { display: flex; flex-direction: column; gap: 6px; }
    .segbar { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; }
    .segbar i { display: block; height: 100%; min-width: 6px; border-radius: 2px; }
    .segbar .s-done { background: var(--ox-teal); }
    .segbar .s-run { background: rgba(var(--ox-teal-rgb, 0, 201, 167), .3); box-shadow: inset 0 0 0 1px var(--ox-teal); }
    .segbar .s-ready { background: rgba(148, 163, 184, .7); }
    .segbar .s-block { background: var(--ox-danger); }
    .segbar .s-idle { background: transparent; box-shadow: inset 0 0 0 1px var(--ox-border-strong); }

    .sec { display: flex; align-items: center; gap: 10px; min-height: 36px; border-bottom: 1px solid var(--ox-border); }
    .sec-label { font: 600 10.5px/1 var(--ox-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ox-text-muted); }
    .section-toggle-all {
      margin: -4px 0 -4px auto; min-height: 44px; padding: 0 10px; border: 0; border-radius: 9px;
      background: none; color: var(--ox-text-2); font-family: inherit; font-size: 12.5px; font-weight: 600; line-height: 1; cursor: pointer;
    }
    .section-toggle-all:hover { background: var(--ox-hover); color: var(--ox-text); }

    /* Workstream rows: the row is the unit; nothing inside it is a card. */
    .node-list { display: flex; flex-direction: column; margin-top: -12px; }
    .ws { border-bottom: 1px solid var(--ox-border); }
    .ws:last-child { border-bottom: 0; }
    .ws-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto auto 44px;
      grid-template-areas: "g c a s t";
      align-items: center;
      column-gap: 12px;
      min-height: 62px;
      padding: 8px 0;
    }
    .ws-row > ox-glyph { grid-area: g; --ox-glyph-size: 18px; }
    .ws-copy { grid-area: c; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .ws-title { font-size: 14.5px; font-weight: 650; color: var(--ox-text); line-height: 1.3; overflow-wrap: anywhere; }
    .ws-sub { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ox-text-muted); min-width: 0; flex-wrap: wrap; }
    .ws-agent { grid-area: a; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ox-text-muted); white-space: nowrap; }
    .ws-state { grid-area: s; display: inline-flex; align-items: center; gap: 8px; justify-self: end; }
    .ws-pct { width: 4ch; text-align: right; font: 500 11.5px/1 var(--ox-mono); color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
    .node-toggle {
      grid-area: t; width: 44px; height: 44px; display: grid; place-items: center;
      border: 0; border-radius: 10px; background: none; color: var(--ox-text-muted); cursor: pointer;
    }
    .node-toggle:hover { background: var(--ox-hover); color: var(--ox-text); }
    .node-toggle svg { transition: transform 160ms var(--ox-ease, ease); }
    .node-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
    .ws-children { padding: 0 0 12px 32px; display: flex; flex-direction: column; gap: 2px; }
    .ws-children[hidden] { display: none; }
    .node-item { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; min-height: 30px; font-size: 13px; color: var(--ox-text-2); }
    .node-item ox-glyph { --ox-glyph-size: 15px; }
    .node-item .tk-icon { display: grid; place-items: center; color: var(--ox-text-muted); }
    .node-item.ms { color: var(--ox-text); font-weight: 600; }
    .node-item.tk { padding-left: 22px; grid-template-columns: 14px minmax(0, 1fr) auto; }
    .node-item.more { color: var(--ox-text-muted); }
    .tree-label { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; line-height: 1.35; padding: 4px 0; }

    .gaps { display: flex; flex-direction: column; }

    /* The footer's text action: open the initiative in OrgX in every state. */
    .ft-link {
      min-height: 44px; margin: -4px 0; padding: 0 12px; border: 0; border-radius: 9px; background: none;
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ox-text-2); font-family: inherit; font-size: 12.5px; font-weight: 650; line-height: 1; white-space: nowrap; cursor: pointer;
    }
    .ft-link:hover { background: var(--ox-hover); color: var(--ox-text); }
    .ft-link svg { width: 12px; height: 12px; }

    /* Loading keeps the populated footprint so the card never jumps. */
    .sk { display: block; height: 10px; border-radius: 4px; background: var(--ox-skeleton, rgba(127, 127, 127, .12)); }

    :root[data-embed="og-wide-scaffold"] body { min-height: auto; min-width: 640px; padding: 20px 18px; }
    :root[data-embed="og-wide-scaffold"] .container { max-width: 640px; }

    @media (max-width: 480px) {
      .hd { padding: 12px 14px 0; }
      .bd { padding: 10px 14px 4px; }
      .pk-q { font-size: 19px; }
      .ws-row {
        grid-template-columns: 20px minmax(0, 1fr) auto 44px;
        grid-template-areas: "g c a t" ". s s t";
        row-gap: 6px;
      }
      .ws-state { justify-self: start; }
      .ws-agent b { display: none; }
      .ws-children { padding-left: 18px; }
      .hd .meta { display: none; }
    }
    @media (max-width: 420px) {
      .ft-link .ft-long { display: none; }
      .ft-link { padding: 0 8px; }
    }
  </style>

<body>
  <div class="container" id="content">
    <article class="wcard ox-card ox-surface" aria-busy="true" aria-label="Loading initiative">
      <div class="hd"><span class="sk" style="width:36%"></span></div>
      <div class="bd">
        <span class="sk" style="width:70%;height:24px"></span>
        <span class="sk" style="width:100%"></span>
        <span class="sk" style="width:100%;height:62px"></span>

      </div>
      <ox-footer variant="reads" state="loading"></ox-footer>
    </article>
  </div>
  <script>
    var queryParams = new URLSearchParams(window.location.search);
    var widgetBuildVersion = (queryParams.get('v') || queryParams.get('version') || 'dev').trim() || 'dev';
    // The build stays inspectable without printing engineering status on the card.
    document.documentElement.setAttribute('data-widget-build', widgetBuildVersion);

    var injectHtml = (html) => {
      const content = document.getElementById('content');
      content.innerHTML = html;
    };
    function _detectProtocol(){return window.OrgXWidgetRuntime.detectProtocol();}
    function _extractData(out){return _extractDataDepth(out,0);}
    function _extractDataDepth(out,depth){if(out==null||depth>4)return null;if(typeof out==='object'&&out.structuredContent)return out.structuredContent;if(typeof out==='object'&&out.result)return _extractDataDepth(out.result,depth+1);if(typeof out==='object'&&out.toolOutput)return _extractDataDepth(out.toolOutput,depth+1);if(typeof out==='object'&&out.output)return _extractDataDepth(out.output,depth+1);if(typeof out==='object'&&Array.isArray(out.content)){for(var i=0;i<out.content.length;i++){var item=out.content[i];if(item&&item.type==='text'&&item.text){try{return JSON.parse(item.text);}catch(e){continue;}}}}if(typeof out==='string'){try{return JSON.parse(out);}catch(e){return{text:out};}}return out;}
    function _sendSize(){window.OrgXWidgetRuntime.reportSize();}
    var _sizeSyncTimers=[];
    var _sizeTransitionRaf=0;
    var _sizeTransitionUntil=0;
    function _scheduleSizeSync(extraDelays){if(_detectProtocol()==='standalone')return;var delays=[0,160,320,720];if(Array.isArray(extraDelays)){delays=delays.concat(extraDelays);}var seen={};_sizeSyncTimers.forEach(function(timer){window.clearTimeout(timer);});_sizeSyncTimers=[];delays.forEach(function(delay){var safeDelay=Math.max(0,Number(delay)||0);if(seen[safeDelay])return;seen[safeDelay]=true;_sizeSyncTimers.push(window.setTimeout(function(){window.requestAnimationFrame(_sendSize);},safeDelay));});}
    function _syncSizeDuringTransition(duration){if(_detectProtocol()==='standalone')return;var span=Math.max(280,Number(duration)||0);var now=(window.performance&&typeof window.performance.now==='function')?window.performance.now():Date.now();_sizeTransitionUntil=Math.max(_sizeTransitionUntil,now+span);if(_sizeTransitionRaf)return;var tick=function(ts){_sendSize();if(ts<_sizeTransitionUntil){_sizeTransitionRaf=window.requestAnimationFrame(tick);return;}_sizeTransitionRaf=0;_sizeTransitionUntil=0;_sendSize();};_sizeTransitionRaf=window.requestAnimationFrame(tick);}
    var _svg = function(c,s){var sz=typeof s==='number'?s+'px':(s||'1em');return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+c+'</svg>';};
    var icons = {
      chevronDown: function(s){return _svg('<polyline points="6 9 12 15 18 9"></polyline>',s);},
      external: function(s){return _svg('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>',s);},
      clock: function(s){return _svg('<circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path>',s);},
      play: function(s){return _svg('<polygon points="10 8 17 12 10 16 10 8" fill="currentColor" stroke="none"></polygon>',s);},
      pause: function(s){return _svg('<rect x="8" y="7" width="3" height="10" rx="1" fill="currentColor" stroke="none"></rect><rect x="13" y="7" width="3" height="10" rx="1" fill="currentColor" stroke="none"></rect>',s);},
      alert: function(s){return _svg('<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>',s);},
      checkCircle: function(s){return _svg('<circle cx="12" cy="12" r="9"></circle><path d="m8.5 12.5 2.2 2.2 4.8-5"></path>',s);}
    };
    var escapeHtml = (str) => { if (str === null || str === undefined || str === '') return ''; const div = document.createElement('div'); div.textContent = String(str); return div.innerHTML; };
    var readLabel = (item, fallback) => {
      if (!item || typeof item !== 'object') return fallback || '';
      if (typeof item.title === 'string' && item.title.trim()) return item.title.trim();
      if (typeof item.name === 'string' && item.name.trim()) return item.name.trim();
      return fallback || '';
    };
    var flattenHierarchy = (hierarchy) => {
      if (Array.isArray(hierarchy)) return hierarchy;
      if (!hierarchy || typeof hierarchy !== 'object') return [];
      var flattened = [];
      var workstreams = Array.isArray(hierarchy.workstreams) ? hierarchy.workstreams : [];
      workstreams.forEach((workstream) => {
        flattened.push({
          type: 'workstream',
          title: readLabel(workstream, 'Untitled workstream'),
          id: workstream && typeof workstream.id === 'string' ? workstream.id : workstream && typeof workstream.ref === 'string' ? workstream.ref : '',
          ref: workstream && typeof workstream.ref === 'string' ? workstream.ref : '',
        });
        var milestones = workstream && Array.isArray(workstream.milestones) ? workstream.milestones : [];
        milestones.forEach((milestone, milestoneIndex) => {
          var tasks = milestone && Array.isArray(milestone.tasks) ? milestone.tasks : [];
          var milestoneIsLast = milestoneIndex === milestones.length - 1;
          var milestoneHasFollowingSibling = !milestoneIsLast;
          flattened.push({
            type: 'milestone',
            title: readLabel(milestone, 'Untitled milestone'),
            id: milestone && typeof milestone.id === 'string' ? milestone.id : milestone && typeof milestone.ref === 'string' ? milestone.ref : '',
            ref: milestone && typeof milestone.ref === 'string' ? milestone.ref : '',
            connector: {
              outerTop: true,
              outerBottom: milestoneHasFollowingSibling,
              outerElbow: true,
              innerBottom: tasks.length > 0,
            },
          });
          tasks.forEach((task, taskIndex) => {
            var taskIsLast = taskIndex === tasks.length - 1;
            flattened.push({
              type: 'task',
              title: readLabel(task, 'Untitled task'),
              id: task && typeof task.id === 'string' ? task.id : task && typeof task.ref === 'string' ? task.ref : '',
              ref: task && typeof task.ref === 'string' ? task.ref : '',
              connector: {
                outerTop: milestoneHasFollowingSibling,
                outerBottom: milestoneHasFollowingSibling,
                innerTop: true,
                innerBottom: !taskIsLast,
                innerElbow: true,
              },
            });
          });
        });
      });
      return flattened;
    };
    var normalizeTextKey = (value) => {
      return typeof value === 'string' ? value.trim().toLowerCase() : '';
    };
    var groupHierarchy = (items) => {
      var sections = [];
      var currentWorkstream = null;
      var currentMilestone = null;
      (items || []).forEach((item) => {
        if (!item || typeof item !== 'object') return;
        if (item.type === 'workstream') {
          currentWorkstream = Object.assign({}, item, { milestones: [] });
          currentMilestone = null;
          sections.push(currentWorkstream);
          return;
        }
        if (item.type === 'milestone' && currentWorkstream) {
          currentMilestone = Object.assign({}, item, { tasks: [] });
          currentWorkstream.milestones.push(currentMilestone);
          return;
        }
        if (item.type === 'task' && currentMilestone) {
          currentMilestone.tasks.push(item);
        }
      });
      return sections;
    };
    var titleCase = (value) => {
      if (typeof value !== 'string') return '';
      return value
        .replace(/[-_]+/g, ' ')
        .split(' ')
        .filter(Boolean)
        .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
        .join(' ');
    };
    var isFriendlyDisplayId = (value, prefix) => {
      if (typeof value !== 'string' || !value.trim()) return false;
      return new RegExp('^' + prefix + '-\\d+(?:-\\d+)*$', 'i').test(value.trim());
    };
    var makeDisplayId = (prefix, rawId, count) => {
      if (isFriendlyDisplayId(rawId, prefix)) return rawId.trim().toUpperCase();
      return prefix + '-' + count;
    };
    var renderIdBadge = (displayId, rawId) => {
      if (!displayId) return '';
      var title = rawId && rawId !== displayId
        ? ' title="' + escapeHtml('Internal ID: ' + rawId) + '"'
        : '';
      return '<span class="badge-id"' + title + '>' + escapeHtml(displayId) + '</span>';
    };
    var WIDGET_ASSET_BASE = 'https://mcp.useorgx.com/widgets/shared/';
    var classifyStatus = (status) => {
      var normalized = normalizeTextKey(status);
      if (!normalized || normalized === 'not_started' || normalized === 'not started') return { tone: 'not-started', label: 'Not started', shortLabel: 'Idle', icon: icons.clock(12) };
      if (['ready', 'queued', 'pending'].includes(normalized)) return { tone: normalized === 'ready' ? 'ready' : 'pending', label: titleCase(normalized), shortLabel: normalized === 'ready' ? 'Ready' : 'Queued', icon: icons.clock(12) };
      if (['active', 'in_progress', 'in progress', 'running', 'executing'].includes(normalized)) return { tone: 'active', label: normalized === 'in_progress' || normalized === 'in progress' ? 'In progress' : titleCase(normalized), shortLabel: 'Active', icon: icons.play(12) };
      if (['complete', 'completed', 'done', 'success', 'succeeded'].includes(normalized)) return { tone: 'complete', label: normalized === 'complete' ? 'Completed' : titleCase(normalized), shortLabel: 'Done', icon: icons.checkCircle(12) };
      if (['blocked', 'error', 'failed'].includes(normalized)) return { tone: normalized === 'failed' ? 'failed' : 'blocked', label: titleCase(normalized), shortLabel: normalized === 'failed' ? 'Failed' : 'Blocked', icon: icons.alert(12) };
      if (['paused', 'cancelled', 'canceled'].includes(normalized)) return { tone: 'paused', label: normalized === 'canceled' ? 'Cancelled' : titleCase(normalized), shortLabel: 'Paused', icon: icons.pause(12) };
      return { tone: 'pending', label: titleCase(normalized), shortLabel: 'Queued', icon: icons.clock(12) };
    };
    var readProgress = (stream) => {
      var raw = stream && typeof stream.progress_pct === 'number' ? stream.progress_pct : null;
      if (raw == null) {
        var statusKey = normalizeTextKey(stream && stream.status);
        return statusKey === 'complete' || statusKey === 'completed' || statusKey === 'done' ? 100 : 0;
      }
      return Math.max(0, Math.min(100, Math.round(raw)));
    };
    var enrichHierarchy = (hierarchy, raw) => {
      var assignments = raw && raw.agent_assignment && Array.isArray(raw.agent_assignment.assignments)
        ? raw.agent_assignment.assignments
        : [];
      var streams = raw && raw.streams && Array.isArray(raw.streams.items)
        ? raw.streams.items
        : [];
      var assignmentsByWorkstream = new Map();
      assignments.forEach((assignment) => {
        if (!assignment || typeof assignment !== 'object' || typeof assignment.workstream_id !== 'string') return;
        assignmentsByWorkstream.set(assignment.workstream_id, assignment);
      });
      var streamsByWorkstream = new Map();
      streams.forEach((stream) => {
        if (!stream || typeof stream !== 'object' || typeof stream.workstream_id !== 'string') return;
        streamsByWorkstream.set(stream.workstream_id, stream);
      });

      return flattenHierarchy(hierarchy).map((item) => {
        if (!item || item.type !== 'workstream') return item;
        var assignment = item.id ? assignmentsByWorkstream.get(item.id) : null;
        var stream = item.id ? streamsByWorkstream.get(item.id) : null;
        var domain = assignment && typeof assignment.domain === 'string' && assignment.domain.trim()
          ? assignment.domain.trim()
          : stream && typeof stream.agent_domain === 'string' && stream.agent_domain.trim()
          ? stream.agent_domain.trim()
          : item && typeof item.domain === 'string' && item.domain.trim()
          ? item.domain.trim()
          : item && typeof item.persona === 'string' && item.persona.trim()
          ? item.persona.trim()
          : null;
        var agentName = assignment && typeof assignment.agent_name === 'string' && assignment.agent_name.trim()
          ? assignment.agent_name.trim()
          : domain
          ? titleCase(domain)
          : 'Unassigned';
        var status = classifyStatus(stream && typeof stream.status === 'string' ? stream.status : 'not_started');
        return Object.assign({}, item, {
          execution: {
            domain: domain,
            agent_id: assignment && typeof assignment.agent_id === 'string' ? assignment.agent_id : null,
            agent_name: agentName,
            progress_pct: readProgress(stream),
            status: status,
          },
        });
      });
    };
    var normalizeScaffoldData = (raw) => {
      if (!raw || typeof raw !== 'object') return null;
      var initiative = raw.initiative || (raw.hierarchy && raw.hierarchy.initiative) || null;
      if (!initiative || typeof initiative !== 'object') return null;

      if (link) setOpenLabel(link, view.openLabel);
    };

    // "Open" always shows; the rest of the label yields under 420px.
    var openLabelHtml = (label) => {
      var rest = String(label).replace(/^Open\s*/, '');
      return '<span>Open</span>' + (rest ? '<span class="ft-long"> ' + escapeHtml(rest) + '</span>' : '');
    };
    var setOpenLabel = (link, label) => {
      var holder = link.querySelector('[data-open-label]');
      if (holder) holder.innerHTML = openLabelHtml(label);
      link.setAttribute('aria-label', label + ', opens OrgX');
    };

    var refreshChrome = () => {
      if (!currentScaffold) return;
      var view = describeScaffold(currentScaffold);
      var card = document.querySelector('[data-scaffold-card]');
      if (card) card.setAttribute('data-edge', view.edge);
      var kind = document.querySelector('[data-scaffold-kicker]');
      if (kind) kind.textContent = view.kind;
      var glyph = document.querySelector('[data-scaffold-glyph]');
      if (glyph) {
        if (view.edge === 'mute') glyph.removeAttribute('tone');
        else glyph.setAttribute('tone', view.edge);
      }
      applyFooter(document.getElementById('scaffoldFooter'), view);
      if (typeof document !== 'undefined') document.title = view.viewState.header + ' - OrgX';
      _scheduleSizeSync([24, 180]);
    };

    var syncToggleAllControl = () => {
      var control = document.querySelector('[data-toggle-all]');
      if (!control) return;
      var toggles = Array.from(document.querySelectorAll('.node-toggle'));
      var allExpanded = toggles.length > 0 && toggles.every((toggle) => toggle.getAttribute('aria-expanded') === 'true');
      control.setAttribute('data-expanded', String(allExpanded));
      control.setAttribute('aria-label', allExpanded ? 'Collapse all workstreams' : 'Expand all workstreams');
      control.textContent = allExpanded ? 'Collapse all' : 'Expand all';
    };

    var setWorkstreamExpanded = (btn, nextExpanded) => {
      var block = btn.closest('[data-ws-block]');
      var children = block ? block.querySelector('[data-ws-children]') : null;
      if (!children) return;
      btn.setAttribute('data-expanded', String(nextExpanded));
      btn.setAttribute('aria-expanded', String(nextExpanded));
      children.hidden = !nextExpanded;
      var key = block.getAttribute('data-ws-key');
      if (key) expandedWorkstreams[key] = nextExpanded;
    };

    window.toggleNode = (btn) => {
      setWorkstreamExpanded(btn, btn.getAttribute('aria-expanded') !== 'true');
      syncToggleAllControl();
      _scheduleSizeSync([24, 160]);
    };

    window.toggleAllWorkstreams = () => {
      var toggles = Array.from(document.querySelectorAll('.node-toggle'));
      if (!toggles.length) return;
      var shouldExpand = toggles.some((toggle) => toggle.getAttribute('aria-expanded') !== 'true');
      toggles.forEach((toggle) => setWorkstreamExpanded(toggle, shouldExpand));
      syncToggleAllControl();
      _scheduleSizeSync([24, 160, 320]);
    };

    var renderAgent = (execution, workTitle) => {
      var name = execution && execution.agent_name ? String(execution.agent_name).trim() : '';
      var identity = window.OrgXAgentIdentity;
      var chip = chipFor(execution && execution.status);
      var who = identity.profile(execution && execution.agent_id, name, execution && execution.domain);
      if (!who && (!name || /^unassigned$/i.test(name))) return '<span class="ws-agent"><b>Unassigned</b></span>';
      // Known agents get their headshot and the hover card; people their initials.
      return '<span class="ws-agent">' + identity.agentCard({
        agent: who ? who.key : '',
        name: who ? who.name : name,
        size: 24,
        state: chip.state,
        statusLabel: chip.label,
        task: (execution && (execution.current_task || execution.task_title)) || workTitle,
        updatedAt: execution && execution.updated_at,
        label: '<b>' + escapeHtml(who ? who.name : name) + '</b>',
      }) + '</span>';
    };

    var renderTask = (task) => {
      return `<div class="node-item tk" data-tk-row>
          <span class="tk-icon">${window.OrgXIcons.icon('task', 14)}</span>
          <span class="tree-label">${escapeHtml(readLabel(task, 'Untitled'))}</span>
          ${renderIdBadge(task.display_id, task.raw_id)}
        </div>`;
    };
    var renderMilestone = (milestone) => {
      var omittedTaskCount = typeof milestone.omitted_task_count === 'number' ? milestone.omitted_task_count : 0;
      var omittedTaskRow = omittedTaskCount > 0
        ? `<div class="node-item tk more" data-tk-row><span></span><span class="tree-label">${escapeHtml(plural(omittedTaskCount, 'more task') + ' in Live View')}</span></div>`
        : '';
      return `<div class="ms-block" data-ms-block>
          <div class="node-item ms" data-ms-row>
            <ox-glyph kind="milestone"></ox-glyph>
            <span class="tree-label">${escapeHtml(readLabel(milestone, 'Untitled'))}</span>
            ${renderIdBadge(milestone.display_id, milestone.raw_id)}
          </div>
          ${(milestone.tasks || []).map(renderTask).join('')}${omittedTaskRow}
        </div>`;
    };

    var renderWorkstream = (section, index) => {
      var execution = section.execution || {};
      var status = execution.status || classifyStatus('not_started');
      var chip = chipFor(status);
      var progress = typeof execution.progress_pct === 'number' ? execution.progress_pct : 0;
      var milestoneCount = Array.isArray(section.milestones) ? section.milestones.length : 0;
      var taskCount = countTasks(section);
      var summary = [milestoneCount ? plural(milestoneCount, 'milestone') : '', taskCount ? plural(taskCount, 'task') : ''].filter(Boolean).join(' · ');
      var key = section.raw_id || section.display_id || String(index);
      var open = !!expandedWorkstreams[key];
      var tone = chip.state === 'running' || chip.state === 'succeeded' ? 'teal' : chip.state === 'blocked' || chip.state === 'failed_step' ? 'red' : '';
      var childId = 'ws-children-' + index;
      var title = readLabel(section, 'Untitled');
      return `<div class="ws" data-ws-block data-ws-key="${escapeHtml(key)}">
          <div class="ws-row">
            <ox-glyph kind="workstream"${tone ? ' tone="' + tone + '"' : ''}></ox-glyph>
            <div class="ws-copy">
              <span class="ws-title">${escapeHtml(title)}</span>
              <span class="ws-sub">${renderIdBadge(section.display_id, section.raw_id)}${summary ? '<span>' + escapeHtml(summary) + '</span>' : ''}</span>
            </div>
            ${renderAgent(execution, title)}
            <span class="ws-state">
              <ox-state-chip state="${chip.state}"${chip.label ? ' label="' + escapeHtml(chip.label) + '"' : ''} reserve="running queued succeeded blocked"></ox-state-chip>
              <span class="ws-pct" aria-label="${escapeHtml(String(progress))}% complete">${escapeHtml(String(progress))}%</span>
            </span>
            <button type="button" class="node-toggle" data-expanded="${open}" aria-expanded="${open}" aria-controls="${childId}" aria-label="Show milestones and tasks in ${escapeHtml(title)}">${icons.chevronDown(16)}</button>
          </div>
          <div class="ws-children" id="${childId}" data-ws-children${open ? '' : ' hidden'}>
            ${(section.milestones || []).map(renderMilestone).join('')}
          </div>
        </div>`;
    };

    var renderMix = (sections) => {
      if (!sections.length) return '';
      var total = sections.reduce((n, s) => n + Math.max(1, countTasks(s)), 0);
      var counts = {};
      var segs = sections.map((s) => {
        var chip = chipFor(s.execution && s.execution.status);
        var label = (chip.label || (s.execution && s.execution.status && s.execution.status.label) || 'Queued').toLowerCase();
        counts[label] = (counts[label] || 0) + 1;
        var width = (Math.max(1, countTasks(s)) / total) * 100;
        return '<i class="' + chip.seg + '" style="flex:' + width.toFixed(2) + ' 1 0"></i>';
      }).join('');
      var tasks = sections.reduce((n, s) => n + countTasks(s), 0);
      var mixLine = Object.keys(counts).map((k) => counts[k] + ' ' + k).join(' · ');
      return `<div class="mix">
          <div class="segbar" role="img" aria-label="${escapeHtml(mixLine)}">${segs}</div>
          <span class="meta">${escapeHtml(plural(tasks, 'task') + ' · ' + mixLine)}</span>
        </div>`;
    };

    var READINESS_NEEDS = { workstreams: 'needs at least 1', milestones: 'needs at least 1', tasks: 'needs at least 1', assignees: 'every workstream needs an owner', objective: 'name the initiative' };
    var renderReadinessGaps = (view) => {
      if (!view.draft || view.readiness.ready || launch.phase !== 'idle') return '';
      var rows = view.readiness.checks.filter((c) => !c.ok).map((c) =>
        '<ox-receipt-row status="fail" label="' + escapeHtml(c.label) + '" detail="' + escapeHtml(c.detail + ' · ' + (READINESS_NEEDS[c.id] || 'needed to launch')) + '"></ox-receipt-row>'
      ).join('');
      return '<div class="gaps" role="list" aria-label="Launch readiness gaps">' + rows + '</div>';
    };

    var renderEmptyCard = (mode) => {
      var errored = mode === 'error';
      return `<article class="wcard ox-card ox-surface" data-scaffold-card data-edge="${errored ? 'red' : 'mute'}">
          <div class="hd"><ox-glyph kind="initiative"${errored ? ' tone="red"' : ''}></ox-glyph><span class="kind">Initiative</span></div>
          <div class="bd" style="padding-bottom:16px">
            <h2 class="pk-q">${errored ? 'The scaffold could not load' : 'Nothing scaffolded yet'}</h2>
            <p class="note">${errored
              ? 'OrgX did not return the initiative. Nothing was created from this view.'
              : 'OrgX has not returned an initiative for this request. The hierarchy appears here once it does.'}</p>
          </div>
          ${errored ? `<ox-footer variant="reads" state="failed" heading="Couldn’t load the scaffold" detail="nothing to show yet"><button type="button" slot="action" class="ft-link" data-open-live-view data-href="${escapeHtml(window.OrgXLinks.live())}" aria-label="Open OrgX, opens OrgX"><span data-open-label>${openLabelHtml('Open OrgX')}</span>${icons.external(12)}</button></ox-footer>` : ''}
        </article>`;
    };

    var render = () => {
      if (isLoading) {
        injectHtml(`<article class="wcard ox-card ox-surface" aria-busy="true" aria-label="Loading initiative">
            <div class="hd"><span class="sk" style="width:36%"></span></div>
            <div class="bd"><span class="sk" style="width:70%;height:24px"></span><span class="sk" style="width:100%"></span><span class="sk" style="width:100%;height:62px"></span><span class="sk" style="width:100%;height:62px"></span></div>
            <ox-footer variant="reads" state="loading"></ox-footer>
          </article>`);
        return;
      }
      var scaffold = normalizeScaffoldData(data);
      if (!scaffold || !scaffold.initiative) {
        currentScaffold = null;
        injectHtml(renderEmptyCard(demoState === 'error' ? 'error' : 'awaiting'));
        bindOpenLinks();
        _scheduleSizeSync([24, 240]);
        return;
      }
      currentScaffold = scaffold;
      var sections = scaffold.sections || [];
      var view = describeScaffold(scaffold);
      var initiativeUrl = liveUrlFor(scaffold);
      var milestoneTotal = sections.reduce((n, s) => n + ((s.milestones || []).length), 0);

      injectHtml(`
        <article class="wcard ox-card ox-surface" data-scaffold-card data-edge="${view.edge}" data-scaffold-header>
          <div class="hd">
            <ox-glyph kind="initiative" data-scaffold-glyph${view.edge !== 'mute' ? ' tone="' + view.edge + '"' : ''}></ox-glyph>
            <span class="kind" data-scaffold-kicker>${escapeHtml(view.kind)}</span>
            <span class="sp"></span>
            <span class="meta">${escapeHtml(plural(sections.length, 'workstream') + ' · ' + plural(milestoneTotal, 'milestone'))}</span>
          </div>
          <div class="bd">
            <div class="title-row">
              <h2 class="pk-q">${escapeHtml(scaffold.initiative.title)}</h2>
              ${renderIdBadge(scaffold.initiative.display_id, scaffold.initiative.raw_id)}
            </div>
            ${renderMix(sections)}
            ${renderReadinessGaps(view)}
            ${sections.length ? `<div class="sec">
              <span class="sec-label">Workstreams</span>
              <button type="button" class="section-toggle-all" data-toggle-all data-expanded="false" aria-label="Expand all workstreams">Expand all</button>
            </div>
            <div class="node-list">${sections.map(renderWorkstream).join('')}</div>` : '<p class="note">No workstreams yet.</p>'}
          </div>
          <ox-footer id="scaffoldFooter" variant="${view.footer.variant}" state="${view.footer.state}">
            <button type="button" slot="action" class="ft-link" data-open-live-view data-href="${escapeHtml(initiativeUrl)}" aria-label="${escapeHtml(view.openLabel)}, opens OrgX"><span data-open-label>${openLabelHtml(view.openLabel)}</span>${icons.external(12)}</button>
          </ox-footer>
        </article>
      `);
      var footer = document.getElementById('scaffoldFooter');
      applyFooter(footer, view);
      if (footer) {
        footer.addEventListener('ox-primary', () => {
          var state = footer.getAttribute('state');
          if (state === 'needs-you' || state === 'failed') launchInitiative();
        });
      }
      if (typeof document !== 'undefined') document.title = view.viewState.header + ' - OrgX';
      Array.from(document.querySelectorAll('.node-toggle')).forEach((btn) => {
        btn.addEventListener('click', () => window.toggleNode(btn));
      });
      var toggleAll = document.querySelector('[data-toggle-all]');
      if (toggleAll) toggleAll.addEventListener('click', () => window.toggleAllWorkstreams(toggleAll));
      syncToggleAllControl();
      bindOpenLinks();
      _scheduleSizeSync([24, 240, 760]);
      if (isDemo && launch.phase === 'idle' && (demoState === 'launched' || demoState === 'launch-failed') && !render.autoLaunched) {
        // Gallery only: play the launch so the footer's states can be seen.
        render.autoLaunched = true;
        window.setTimeout(launchInitiative, 400);
      }
    };

    // Route "Open Live View" through openWidgetLink: inside the MCP sandbox a
    // plain target="_blank" is blocked, so the host has to open the URL.
    var bindOpenLinks = () => {
      Array.from(document.querySelectorAll('[data-open-live-view]')).forEach((button) => {
        button.addEventListener('click', (evt) => {
          evt.preventDefault();
          var target = button.getAttribute('data-href');
          if (!target) return;
          var proceed = typeof openWidgetLink === 'function' ? openWidgetLink(target, evt) : true;
          if (proceed !== false && typeof window !== 'undefined') window.open(target, '_blank', 'noopener,noreferrer');
        });
      });
    };

    window.addEventListener('resize', function(){ _scheduleSizeSync([24, 180]); });

    if(isDemo) applyBootPayload();
    else initWidget({
      /* Scaffolding an initiative is the start of the work, not the end of it. */
      live: { anchor: '#content', widget: 'scaffolded-initiative', emptyLabel: 'No workstreams running' },
      getData: _extractData,
      render: d => { applyBootPayload(function(){ if(d) data = d; }); }
    });
  </script>
</body>
</html>
