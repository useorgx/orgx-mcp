      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2302040a'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%2300C9A7' stroke-width='6'/%3E%3Cpath d='M20 34l7-7 6 6 12-12' stroke='%2300C9A7' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      /* Canvas: Q6 (the whole population, drill to what needs you) and K3 (quality
         across an initiative). Surfaces, text and status colors come from the kit
         tokens and the widget theme; this sheet lays the pulse out. */
      :root { --ox-primary-rgb: 0, 201, 167; }

      /* The kit's primaries are its action lime (--ox-action) in every widget. */

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: var(--ox-font);
        background: var(--ox-bg);
        color: var(--ox-text);
        padding: 16px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      button { font: inherit; color: inherit; }
      a { color: inherit; }

      .container { max-width: 680px; margin: 0 auto; }

      @keyframes pulseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .animate-in { animation: pulseIn var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out) both; }

      .widget-shell-card { margin: 0; }
      .pulse-shell-card .ox-card {
        position: relative;
        background: var(--ox-panel);
        border: 1px solid var(--ox-border);
        border-radius: 16px;
        box-shadow: var(--ox-shadow);
        overflow: hidden;
        --edge-rgb: var(--ox-edge-teal-rgb);
      }
      .pulse-shell-card .ox-card::after {
        content: "";
        position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(var(--edge-rgb), 0.75), transparent);
      }
      .pulse-shell-card .ox-card[data-edge="amber"] { --edge-rgb: var(--ox-edge-amber-rgb); }
      .pulse-shell-card .ox-card[data-edge="red"] { --edge-rgb: var(--ox-edge-red-rgb); }
      .pulse-shell-card .ox-card[data-edge="mute"] { --edge-rgb: var(--ox-edge-mute-rgb); }

      .pulse-head { border-bottom: 1px solid var(--ox-border); --ox-attention-padding: 0 8px 0 20px; }
      .pulse-attention {
        display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: 0; padding: 0 12px;
        border-radius: 9px; border: 1px solid var(--ox-action-border); background: var(--ox-action); color: var(--ox-action-fg);
        font-size: 12.5px; font-weight: 650; white-space: nowrap; cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .pulse-attention svg { width: 13px; height: 13px; transition: transform 160ms ease; }
      .pulse-attention.is-open svg { transform: rotate(180deg); }

      .pulse-shell { padding: 18px 22px 8px; display: flex; flex-direction: column; gap: 14px; }

      /* The initiative itself: name, where it stands, and how far through it is. */
      .pulse-hero { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
      .pulse-tile {
        width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center;
        border: 1px solid var(--ox-border-strong); color: var(--ox-text-muted); --ox-glyph-size: 20px;
      }
      .pulse-tile[data-tone="amber"] { color: var(--ox-warning); border-color: rgba(var(--ox-edge-amber-rgb), 0.45); }
      .pulse-tile[data-tone="red"] { color: var(--ox-danger); border-color: rgba(var(--ox-edge-red-rgb), 0.45); }
      .pulse-tile[data-tone="teal"] { color: var(--ox-teal); border-color: rgba(var(--ox-edge-teal-rgb), 0.45); }
      .pulse-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
      /* Sans type scale: weight and colour carry the hierarchy, mono is for ids. */
      .pulse-kicker { font-size: 12.5px; font-weight: 500; line-height: 1.3; color: var(--ox-text-muted); }
      .pulse-kicker b { font-weight: 600; color: var(--ox-text-2); }
      .pulse-kicker b[data-tone="good"] { color: var(--ox-teal); }
      .pulse-kicker b[data-tone="warning"] { color: var(--ox-warning); }
      .pulse-kicker b[data-tone="danger"] { color: var(--ox-danger); }
      .pulse-title { font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em; overflow-wrap: anywhere; text-wrap: balance; }
      .tone-good { color: var(--ox-teal); }
      .tone-warning { color: var(--ox-warning); }
      .tone-danger { color: var(--ox-danger); }
      /* Health: one chip style in every render. */
      .pulse-health {
        display: inline-flex; align-items: center; flex: none; height: 22px; padding: 0 8px; border-radius: 999px;
        font-size: 12px; font-weight: 650; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums;
        --tone-rgb: var(--ox-mute-rgb, 100, 116, 139); color: var(--ox-text-muted);
        background: rgba(var(--tone-rgb), 0.08); box-shadow: inset 0 0 0 1px rgba(var(--tone-rgb), 0.32);
      }
      .pulse-health[data-tone="good"] { --tone-rgb: var(--ox-teal-rgb); color: var(--ox-teal); }
      .pulse-health[data-tone="warning"] { --tone-rgb: var(--ox-warning-rgb); color: var(--ox-warning); }
      .pulse-health[data-tone="danger"] { --tone-rgb: var(--ox-danger-rgb); color: var(--ox-danger); }

      /* Progress: one number, one bar, and what the workstreams are doing. */
      .pulse-progress { display: flex; flex-direction: column; gap: 8px; }
      .pulse-progress-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
      .pulse-progress-value { font-size: 13px; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .pulse-progress-value b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--ox-text); margin-right: 4px; }
      .pulse-progress-bar { position: relative; height: 8px; border-radius: 999px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.14)); overflow: hidden; }
      .pulse-progress-bar > span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--ox-teal); min-width: 0; transition: width var(--ox-dur-medium, 220ms) var(--ox-ease-out, ease-out); }
      .pulse-progress-bar[data-tone="warning"] > span { background: var(--ox-warning); }
      .pulse-progress-bar[data-tone="danger"] > span { background: var(--ox-danger); }
      .pulse-facts { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; line-height: 1.45; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }
      .pulse-facts span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .pulse-facts i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ox-text-muted); }
      .pulse-facts .f-done i { background: var(--ox-teal); }
      .pulse-facts .f-active i { background: var(--ox-text-2); }
      .pulse-facts .f-review i { background: var(--ox-warning); }
      .pulse-facts .f-blocked { color: var(--ox-danger); font-weight: 600; }
      .pulse-facts .f-blocked i { background: var(--ox-danger); }
      .pulse-facts .f-planned i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ox-border-strong); }
      .pulse-facts .f-total { color: var(--ox-text-2); font-weight: 600; }
      /* The reason work is blocked, said once, under the numbers. */
      .pulse-blocker { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; line-height: 1.45; color: var(--ox-text); }
      .pulse-blocker svg { margin-top: 2px; color: var(--ox-danger); }
      .pulse-blocker span { overflow-wrap: anywhere; }
      .pulse-blocker em { font-style: normal; color: var(--ox-text-muted); }

      /* Drill-down: the rail picks a list, the list opens items in OrgX. */
      .pulse-rail { display: flex; flex-wrap: wrap; gap: 0 4px; margin: 0 -8px; border-bottom: 1px solid var(--ox-border); }
      .pulse-rail-button {
        display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 8px;
        border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent;
        color: var(--ox-text-muted); font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .pulse-rail-button:hover { color: var(--ox-text); }
      .pulse-rail-button.is-active { color: var(--ox-text); border-bottom-color: var(--ox-text-2); }
      .pulse-rail-button.is-alert .pulse-rail-value { color: var(--ox-warning); }
      .pulse-rail-button.is-alert.is-active { border-bottom-color: var(--ox-warning); }
      .pulse-rail-button.is-warn .pulse-rail-value { color: var(--ox-warning); }
      .pulse-rail-value { order: 2; font-size: 12.5px; font-weight: 600; line-height: 1; color: var(--ox-text-muted); font-variant-numeric: tabular-nums; }

      .pulse-panel-host { transition: height 220ms var(--ox-ease-out, ease), opacity 160ms ease; }
      .pulse-panel { display: flex; flex-direction: column; }
      .pulse-panel-header { display: none; }
      .pulse-subsection + .pulse-subsection { margin-top: 10px; }
      .pulse-subsection-label { font-size: 12.5px; font-weight: 600; color: var(--ox-text-muted); padding: 10px 0 2px; }
      .pulse-list { display: flex; flex-direction: column; }
      /* A row is not a link: its title link stretches over the row, and the
         avatar (its own button, the agent's hover card) sits above that layer,
         so nothing interactive nests and both stay 44 px targets. */
      .pulse-list-row {
        position: relative;
        display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 12px;
        min-height: 56px; padding: 10px 2px; border-top: 1px solid var(--ox-border);
        color: var(--ox-text);
      }
      .pulse-list > .pulse-list-row:first-child { border-top: 0; }
      .pulse-row-link { color: inherit; text-decoration: none; outline: none; }
      .pulse-row-link::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
      .pulse-list-row .pulse-row-link:focus-visible { outline: none; }
      .pulse-row-link:focus-visible::after { outline: 2px solid var(--ox-focus, var(--ox-teal)); outline-offset: -2px; }
      @media (hover: hover) {
        .pulse-list-row:hover { background: linear-gradient(90deg, transparent, var(--ox-hover) 8%, var(--ox-hover) 92%, transparent); }
        .pulse-list-row:hover .pulse-list-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ox-border-strong); }
      }
      .pulse-list-leading { position: relative; z-index: 1; display: grid; place-items: center; width: 32px; min-height: 32px; color: var(--ox-text-muted); --ox-glyph-size: 18px; }
      .pulse-list-leading[data-tone="amber"] { color: var(--ox-warning); }
      .pulse-list-leading[data-tone="red"] { color: var(--ox-danger); }
      .pulse-list-leading[data-tone="teal"] { color: var(--ox-teal); }
      .pulse-list-copy { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; min-height: 44px; }
      .pulse-list-title { font-size: 14px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
      .pulse-list-meta {
        font-size: 12.5px; line-height: 1.4; color: var(--ox-text-muted); overflow-wrap: anywhere;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .pulse-list-meta b { font-weight: 600; color: var(--ox-text-2); }
      .pulse-list-trailing { display: flex; align-items: center; gap: 10px; color: var(--ox-text-muted); }
      .pulse-list-trailing > svg { width: 14px; height: 14px; }
      .pulse-meta-separator { padding: 0 5px; }
      .pulse-meta-pct, .pulse-meta-status { display: none; font-variant-numeric: tabular-nums; }
      .pulse-meta-status { font-weight: 600; color: var(--ox-text-2); }
      .pulse-meta-status .pulse-meta-separator { font-weight: 400; color: var(--ox-text-muted); }
      .pulse-meta-status[data-tone="good"] { color: var(--ox-teal); }
      .pulse-meta-status[data-tone="warning"] { color: var(--ox-warning); }
      .pulse-meta-status[data-tone="danger"] { color: var(--ox-danger); }
      .pulse-bar { width: 64px; height: 6px; border-radius: 3px; background: var(--ox-skeleton, rgba(127,127,127,0.14)); overflow: hidden; flex: none; }
      .pulse-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--ox-text-2); }
      .pulse-bar[data-tone="danger"] > span { background: var(--ox-danger); }
      .pulse-bar[data-tone="warning"] > span { background: var(--ox-warning); }
      .pulse-bar[data-tone="good"] > span { background: var(--ox-teal); }
      .pulse-pct { font-size: 12px; font-weight: 500; line-height: 1; color: var(--ox-text-muted); min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }

      /* K3: output quality in one strip. */
      .pulse-quality { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 10px; }
      .pulse-quality-strip { display: flex; gap: 2px; height: 8px; }
      .pulse-quality-strip i { display: block; border-radius: 2px; min-width: 4px; }
      .pulse-quality-strip .q-met { background: var(--ox-teal); }
      .pulse-quality-strip .q-you { background: var(--ox-warning); }
      .pulse-quality-strip .q-fail { background: var(--ox-danger); }
      .pulse-quality-strip .q-unv { background: repeating-linear-gradient(135deg, var(--ox-text-muted) 0 2px, transparent 2px 4px); }
      .pulse-quality .pulse-facts { gap: 2px 12px; }

      .pulse-empty { font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); padding: 10px 0 12px; }

      /* Empty, error and recovery: the same head as a loaded card, a plain sentence, a way on. */
      .pulse-calm { padding: 18px 22px 8px; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; align-items: start; }
      .pulse-calm .pulse-tile { grid-row: span 3; }
      .empty-title { font-size: 17px; font-weight: 650; line-height: 1.3; letter-spacing: -0.015em; padding-top: 2px; }
      .empty-desc { font-size: 13.5px; line-height: 1.5; color: var(--ox-text-2); margin-top: 4px; }
      .empty-actions { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 8px 0 0 -8px; }
      .deep-link {
        display: inline-flex; align-items: center; gap: 8px;
        min-height: 44px; border: 0; border-radius: 10px; background: none; cursor: pointer;
        padding: 0 8px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ox-text-2); text-decoration: none;
      }
      .deep-link:hover { color: var(--ox-text); background: var(--ox-hover); }
      .deep-link svg { width: 14px; height: 14px; }
      .deep-link.is-primary { color: var(--ox-text); box-shadow: inset 0 0 0 1px var(--ox-border-strong); }

      .sk { display: block; border-radius: 6px; background: var(--ox-skeleton, rgba(127, 127, 127, 0.12)); }

      .pulse-attention:focus-visible, .pulse-rail-button:focus-visible, .deep-link:focus-visible {
        outline: 2px solid var(--ox-focus, var(--ox-teal)); outline-offset: 2px; border-radius: 8px;
      }

      @media (max-width: 480px) {
        body { padding: 12px; }
        .pulse-shell { padding: 14px 16px 6px; }
        .pulse-head { --ox-attention-padding: 0 6px 0 16px; }
        .pulse-line-extra { display: none; }
        .pulse-title { font-size: 19px; }
        .pulse-tile { width: 34px; height: 34px; }
        .pulse-calm { grid-template-columns: 34px minmax(0, 1fr); padding: 16px 16px 6px; }
        .pulse-bar, .pulse-pct { display: none; }
        .pulse-meta-pct, .pulse-meta-status { display: inline; }
        .has-chip .pulse-list-trailing ox-state-chip { display: none; }
        .has-chip { grid-template-columns: 32px minmax(0, 1fr); }
        .pulse-list-row { gap: 10px; }
        .pulse-rail { gap: 0; margin: 0 -6px; }
        .pulse-rail-button { padding: 0 6px; gap: 5px; font-size: 12.5px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-in { animation: none; }
        .pulse-panel-host, .pulse-progress-bar > span { transition: none; }
      }
    </style>

  <body>
    <div class="container" role="region" aria-label="Initiative Status">
      <div id="content" aria-live="polite">
        <div class="pulse-shell-card"><div class="ox-card ox-surface" role="status" aria-label="Loading initiative pulse">
          <div class="pulse-head" style="height:44px;display:flex;align-items:center;gap:10px;padding:0 20px"><span class="sk" style="width:8px;height:8px;border-radius:50%"></span><span class="sk" style="width:36%;height:12px"></span></div>
          <div class="pulse-shell">
            <div class="pulse-hero"><span class="sk pulse-tile" style="border:0"></span><span style="display:flex;flex-direction:column;gap:8px;flex:1"><span class="sk" style="width:30%;height:11px"></span><span class="sk" style="width:62%;height:22px"></span></span></div>
            <span style="display:flex;flex-direction:column;gap:8px"><span style="display:flex;justify-content:space-between"><span class="sk" style="width:96px;height:20px"></span><span class="sk" style="width:76px;height:22px;border-radius:999px"></span></span><span class="sk" style="width:100%;height:8px;border-radius:999px"></span><span class="sk" style="width:58%;height:12px"></span></span>
            <span class="sk" style="width:100%;height:44px"></span>
            <span class="sk" style="width:100%;height:56px"></span>
            <span class="sk" style="width:100%;height:56px"></span>
          </div>
          <ox-footer variant="reads" state="loading"></ox-footer>
        </div></div>
      </div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const theme = params.get("theme");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
      })();

      var injectHtml = function (html) {
        var content = document.getElementById("content");
        if (!content) return;
        content.innerHTML = html;
      };

      function buildInitiativeRecoveryUrl(rawPulse) {
        var initiativeId =
          rawPulse &&
          (rawPulse.id ||
            rawPulse.initiative_id ||
            (rawPulse.initiative && rawPulse.initiative.id));
        return window.OrgXLinks.initiative(initiativeId);
      }

      function buildRecoveryCta(rawPulse, label) {
        var recoveryUrl = buildInitiativeRecoveryUrl(rawPulse);
        var resolvedLabel =
          label ||
          (recoveryUrl.indexOf("/initiatives/") !== -1
            ? "Open initiative in OrgX"
            : "Browse initiatives in OrgX");
        return (
          '<div class="empty-actions">' +
          '<a href="' +
          escapeHtml(recoveryUrl) +
          '" target="_blank" rel="noreferrer" onclick=\'return openWidgetLink(' +
          JSON.stringify(recoveryUrl) +
          ', event)\' class="deep-link">' +
          icons.external(14) +
          escapeHtml(resolvedLabel) +
          "</a>" +
          "</div>"
        );
      }

      var _svg = function (content, size) {
        var resolvedSize = typeof size === "number" ? size + "px" : size || "1em";
        return (
          '<svg width="' +
          resolvedSize +
          '" height="' +
          resolvedSize +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          content +
          "</svg>"
        );
      };

      var icons = {
        external: function (size) {
          return _svg(
            '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>',
            size
          );
        },
        chevronDown: function (size) {
          return _svg('<polyline points="6 9 12 15 18 9"></polyline>', size);
        },
      };

      var escapeHtml = function (value) {
        if (value === null || value === undefined) return "";
        var div = document.createElement("div");
        div.textContent = String(value);
        return div.innerHTML;
      };

      var params = new URLSearchParams(window.location.search);
      // Gallery previews (?gallery=true&state=…) read the same fixtures as ?demo=true.
      var isDemo = params.get("demo") === "true" || params.get("gallery") === "true";
      var isLoadingOverride = params.get("loading") === "true" || params.get("state") === "loading";
      // Previews served next to the widgets read avatars from the same origin;
      // host sandboxes use the kit default (mcp.useorgx.com).
      if (window.OrgXElements && window.OrgXWidgetRuntime && window.OrgXWidgetRuntime.detectProtocol() === "standalone") {
        window.OrgXElements.avatarConfig.baseUrl = new URL("shared/avatars", window.location.href).toString();
      }

      var uiState = { panel: null };
      var currentPulseData = null;
      var currentDashboardUrl = "";
      var currentAttentionItems = [];
      var currentSections = [];
      var panelTransitionToken = 0;
      var panelHydrated = false;
      // Source of truth for domain accent palette lives in
      // shared/components/domain-accent.js (window.OrgxDomain). Fall back
      // to the inline dictionary when the shared module hasn't loaded yet
      // (gallery, tests, or first paint).
      var DOMAIN_ACCENTS =
        (typeof window !== 'undefined' && window.OrgxDomain && window.OrgxDomain.DOMAIN_ACCENTS) || {
          product: "22, 163, 74",
          engineering: "6, 182, 212",
          marketing: "249, 115, 22",
          sales: "168, 85, 247",
          operations: "245, 158, 11",
          design: "236, 72, 153",
          orchestrator: "20, 184, 166"
        };

      var pulse = isDemo
        ? {
            id: "INI-402",
            name: "Q4 Product Launch",
            status: "active",
            health_score: 78,

          var scopePhrase = decisionScopePhrase(pulseData.pending_decisions_scope);
          items.push({
            id: "decision-summary",
            kind: "decision",
            label: decisionCountLabel(pulseData) + " waiting on you",
            meta: scopePhrase ? "Pending " + scopePhrase : "Pending decisions",
            url: dashboardUrl,
          });
        }

        (pulseData.recent_artifacts || []).filter(awaitsReview).forEach(function (artifact, index) {
          items.push({
            id: "artifact-review-" + index,
            kind: "review",
            label: artifact.title,
            meta: "Waiting for your review" + (artifact.created_by_name ? " · from " + artifact.created_by_name : ""),
            url: artifact.primary_url || artifact.live_url || dashboardUrl,
          });
        });

        return items.slice(0, 5);
      };

      var buildAttentionBanner = function (pulseData, items) {
        if (!items.length) return null;
        var reviewCount = (pulseData.recent_artifacts || []).filter(awaitsReview).length;
        if ((pulseData.blockers || []).length) {
          return {
            eyebrow:
              (pulseData.blockers || []).length +
              " blocker" +
              ((pulseData.blockers || []).length === 1 ? "" : "s") +
              " slowing momentum",
            headline: items[0].label,
          };
        }
        if (pulseData.pending_decisions > 0) {
          return {
            eyebrow:
              pulseData.pending_decisions +
              " decision" +
              (pulseData.pending_decisions === 1 ? "" : "s") +
              " waiting on you",
            headline: items[0].label,
          };
        }
        return {
          eyebrow:
            reviewCount +
            " output item" +
            (reviewCount === 1 ? "" : "s") +
            " waiting for review",
          headline: items[0].label,
        };
      };

      /* Who owns a stream. A named owner is matched by name only, so "Nova"
         never wears Eli's face because the domain says engineering; the domain
         names the agent only when the payload names no one. Known agents get
         their headshot as a hover card (name, role, state, task, Open in
         OrgX); a person gets initials, OrgX itself its mark. */
      var renderPulseAvatar = function (stream) {
        var identity = window.OrgXAgentIdentity;
        var name = stream.agent_name && String(stream.agent_name).trim();
        var key = name ? identity.resolveAgentKey(name) : identity.resolveAgentKey(stream.agent_domain);
        if (!key) return name ? identity.avatar({ agent: name, name: name, size: "row" }) : "";
        var chip = chipSpec(stream.status, stream.blocker_count, "stream");
        var pct = Math.max(0, Math.min(100, Math.round(Number(stream.progress_pct) || 0)));
        return identity.agentCard({
          agent: key,
          size: "row",
          state: chip.state,
          statusLabel: chip.label || undefined,
          detail: pct + "% through",
          task: stream.title,
        });
      };

      var toneForStatus = function (status, fallbackProgress, blockerCount) {
        var key = toStatusKey(status);
        if (
          blockerCount > 0 ||
          key === "blocked" ||
          key === "failed" ||
          key === "at_risk"
        ) {
          return "danger";
        }
        if (
          key === "ready" ||
          key === "pending" ||
          key === "in_review" ||
          key === "draft" ||
          key === "ramping_up"
        ) {
          return "warning";
        }
        if (key === "active" || key === "running" || key === "in_progress") {
          return "good";
        }
        if (key === "completed" || key === "approved") {
          return "good";
        }
        var progress = Number(fallbackProgress);
        if (Number.isFinite(progress) && progress < 40) return "warning";
        return "muted";
      };

      // Status words become kit chips; the chip reserves the widest label so rows hold still.
      var CHIP_RESERVE = "running succeeded queued blocked stale draft";
      var chipSpec = function (status, blockerCount, kind) {
        var key = toStatusKey(status);
        var state = "queued";
        var label = "";
        if (blockerCount > 0 || key === "blocked" || key === "at_risk") { state = "blocked"; label = "Blocked"; }
        else if (key === "failed") { state = "failed_step"; }
        else if (key === "in_review" || key === "review" || key === "needs_review") { state = "needs_you"; label = kind === "artifact" ? "Your review" : "Needs you"; }
        else if (key === "changes_requested") { state = "failed_step"; label = "Changes requested"; }
        else if (key === "draft") { state = "draft"; label = "Draft"; }
        else if (key === "completed" || key === "approved" || key === "done") { state = "succeeded"; label = kind === "artifact" ? "Accepted" : "Done"; }
        else if (key === "active" || key === "running" || key === "in_progress") { state = "running"; label = key === "active" ? "Active" : ""; }
        else if (key === "stale") { state = "stale"; }
        else if (key === "ready" || key === "planned" || key === "pending" || key === "not_started") { state = "queued"; label = key === "ready" ? "Ready" : "Planned"; }
        else if (key === "paused") { state = "handed_off"; label = "Paused"; }
        return { state: state, label: label };
      };
      // At phone width the chip column costs the title half its line; the
      // status moves into the meta line as one coloured word instead.
      var statusWord = function (status, blockerCount, kind) {
        var spec = chipSpec(status, blockerCount, kind);
        var tone = spec.state === "blocked" || spec.state === "failed_step" ? "danger" : spec.state === "needs_you" || spec.state === "stale" ? "warning" : spec.state === "running" || spec.state === "succeeded" ? "good" : "";
        return '<span class="pulse-meta-status"' + (tone ? ' data-tone="' + tone + '"' : "") + ">" + escapeHtml(spec.label || titleCase(status || "")) + '<span class="pulse-meta-separator">·</span></span>';
      };
      var chipFor = function (status, blockerCount, kind) {
        var spec = chipSpec(status, blockerCount, kind);
        var reserve = kind === "artifact" ? CHIP_RESERVE + " needs_you" : CHIP_RESERVE;
        return (
          '<ox-state-chip state="' + spec.state + '"' + (spec.label ? ' label="' + escapeHtml(spec.label) + '"' : "") +
          ' reserve="' + reserve + '">' + escapeHtml(spec.label || titleCase(status || "")) + "</ox-state-chip>"
        );
      };

      var renderProgressBar = function (progress, tone) {
        var safeProgress = Math.max(0, Math.min(100, Math.round(Number(progress) || 0)));
        return (
          '<span class="pulse-bar" data-tone="' + escapeHtml(tone) + '" aria-hidden="true"><span style="width:' + (safeProgress ? Math.max(4, safeProgress) : 0) + '%"></span></span>' +
          '<span class="pulse-pct">' + escapeHtml(String(safeProgress)) + "%</span>"
        );
      };

      // Where each workstream stands, in the words of the progress line.
      var segmentFor = function (status, blockerCount) {
        var key = toStatusKey(status);
        if (blockerCount > 0 || key === "blocked" || key === "at_risk" || key === "failed") return "blocked";
        if (key === "completed" || key === "approved" || key === "done") return "done";
        if (key === "in_review" || key === "review" || key === "needs_review") return "review";
        if (key === "active" || key === "running" || key === "in_progress" || key === "stale") return "active";
        return "planned";
      };
      var SEGMENT_WORDS = { done: "done", review: "in review", active: "active", blocked: "blocked", planned: "not started" };

      /* One number ("64% through"), one bar, the health chip, then what the
         workstreams are doing: "4 workstreams · 2 active · 1 blocked · 1 not started".
         The blocker reason, when there is one, is said once underneath. */
      var renderProgress = function (pulseData, healthHtml) {
        var pct = Math.max(0, Math.min(100, Math.round(Number(pulseData.progress_pct) || 0)));
        var source = pulseData.workstreams.length ? pulseData.workstreams : [];
        var counts = {};
        source.forEach(function (item) {
          var segment = segmentFor(item.status, item.blocker_count || 0);
          counts[segment] = (counts[segment] || 0) + 1;
        });
        var total = pulseData.total_workstreams || source.length || pulseData.active_workstreams || 0;
        if (!source.length) {
          if (pulseData.active_workstreams) counts.active = pulseData.active_workstreams;
          if (pulseData.blocked_workstreams) counts.blocked = pulseData.blocked_workstreams;
        }
        var facts = [];
        if (total) facts.push('<span class="f-total">' + escapeHtml(plural(total, "workstream")) + "</span>");
        ["blocked", "review", "active", "done", "planned"].forEach(function (segment) {
          if (!counts[segment]) return;
          if (segment === "done" && counts.done === total) return;
          facts.push('<span class="f-' + segment + '"><i aria-hidden="true"></i>' + counts[segment] + " " + SEGMENT_WORDS[segment] + "</span>");
        });
        if (total && counts.done === total) facts.push('<span class="f-done"><i aria-hidden="true"></i>all done</span>');
        var blockers = pulseData.blockers || [];
        return (
          '<div class="pulse-progress">' +
            '<div class="pulse-progress-head">' +
              '<span class="pulse-progress-value"><b>' + pct + "%</b>" + (pct >= 100 ? "complete" : "through") + "</span>" +
              healthHtml +
            "</div>" +
            '<div class="pulse-progress-bar" role="img" aria-label="' + escapeHtml(pct + "% through" + (counts.blocked ? ", " + counts.blocked + " blocked" : "")) + '"><span style="width:' + pct + '%"></span></div>' +
            (facts.length ? '<div class="pulse-facts">' + facts.join("") + "</div>" : "") +
            (blockers.length
              ? '<div class="pulse-blocker">' + window.OrgXIcons.icon("blocked", 16) + "<span>" + escapeHtml(blockers[0]) +
                (blockers.length > 1 ? " <em>and " + escapeHtml(plural(blockers.length - 1, "more blocker")) + "</em>" : "") + "</span></div>"
              : "") +
          "</div>"
        );
      };

      var renderMetrics = function (sections, activePanel) {
        if (!sections.length) return "";
        return (
          '<div class="pulse-rail" role="group" aria-label="Pulse lists">' +
          sections
            .map(function (section) {
              return (
                '<button type="button" class="pulse-rail-button' +
                (activePanel === section.key ? " is-active" : "") +
                (section.alert ? " is-alert" : "") +
                (section.warn ? " is-warn" : "") +
                '" onclick="togglePulsePanel(\'' +
                escapeHtml(section.key) +
                '\', this)" data-panel-key="' +
                escapeHtml(section.key) +
                '" aria-controls="pulse-panel-host" aria-expanded="' +
                escapeHtml(String(activePanel === section.key)) +
                '" aria-pressed="' +
                escapeHtml(String(activePanel === section.key)) +
                '">' +
                '<span class="pulse-rail-value">' +
                escapeHtml(String(section.value)) +
                "</span>" +
                '<span class="pulse-rail-label">' +
                escapeHtml(section.label) +
                "</span>" +
                "</button>"
              );
            })
            .join("") +
          "</div>"
        );
      };

      /* A list row. The title is the row's one link, stretched over the row;
         the leading slot (an agent's hover card, or an icon) sits above it. */
      var linkRow = function (url, leading, leadingTone, title, metaHtml, trailing, extraClass) {
        var href = window.OrgXLinks.normalize(url) || window.OrgXLinks.live(currentPulseData && currentPulseData.id);
        return (
          '<div class="pulse-list-row' + (extraClass ? " " + extraClass : "") + '">' +
            '<span class="pulse-list-leading"' + (leadingTone ? ' data-tone="' + leadingTone + '"' : "") + ">" + leading + "</span>" +
            '<a class="pulse-list-copy pulse-row-link" href="' + escapeHtml(href) + '" target="_blank" rel="noreferrer" onclick=\'return openWidgetLink(' +
              escapeHtml(JSON.stringify(href)).replace(/'/g, "&#39;") + ', event)\'>' +
              '<span class="pulse-list-title">' + escapeHtml(title) + "</span>" +
              (metaHtml ? '<span class="pulse-list-meta">' + metaHtml + "</span>" : "") +
            "</a>" +
            '<span class="pulse-list-trailing">' + trailing + "</span>" +
          "</div>"
        );
      };
      var icon = function (name, tone) {
        return window.OrgXIcons.icon(name, 20) || "";
      };
      var joinMeta = function (parts) {
        return parts.filter(Boolean).map(function (part, index) {
          return (index ? '<span class="pulse-meta-separator">·</span>' : "") + part;
        }).join("");
      };

      var renderActionsPanel = function (items) {
        if (!items.length) return '<div class="pulse-empty">No decisions, blockers, or reviews are waiting on you right now.</div>';
        return (
          '<div class="pulse-list">' +
          items
            .map(function (item) {
              var glyph = item.kind === "review" ? "artifact" : item.kind === "blocker" ? "blocked" : "decision";
              var tone = item.kind === "blocker" ? "red" : "amber";
              return linkRow(
                item.url,
                icon(glyph),
                tone,
                item.label,
                escapeHtml(item.meta),
                window.OrgXIcons.icon("open-external", 14),
                "pulse-action-row" + (item.kind === "blocker" ? " is-danger" : "")
              );
            })
            .join("") +
          "</div>"
        );
      };

      var renderWorkstreamFallback = function (pulseData, dashboardUrl) {
        var rows = [];
        var inMotion = pulseData.active_workstreams || pulseData.total_workstreams || 0;
        if (inMotion) {
          rows.push({
            title: plural(inMotion, "workstream") + (inMotion === 1 ? " is" : " are") + " in motion",
            meta: plural(pulseData.total_workstreams || inMotion, "workstream") + " in total",
            status: "active",
          });
        }
        if (pulseData.blocked_workstreams) {
          rows.push({
            title: plural(pulseData.blocked_workstreams, "workstream") + (pulseData.blocked_workstreams === 1 ? " is" : " are") + " blocked",
            meta: "Needs someone to clear it",
            status: "blocked",
          });
        }
        if (!rows.length) {
          return '<div class="pulse-empty">Workstreams appear here once OrgX sends them with the pulse.</div>';
        }
        return (
          '<div class="pulse-list">' +
          rows
            .map(function (row) {
              return linkRow(dashboardUrl, icon("workstream"), "", row.title, escapeHtml(row.meta), chipFor(row.status, 0, "stream"));
            })
            .join("") +
          "</div>"
        );
      };

      var renderStreamsPanel = function (pulseData, dashboardUrl) {
        if (!pulseData.workstreams.length) return renderWorkstreamFallback(pulseData, dashboardUrl);
        return (
          '<div class="pulse-list">' +
          pulseData.workstreams
            .slice(0, 8)
            .map(function (stream) {
              var tone = toneForStatus(stream.status, stream.progress_pct, stream.blocker_count);
              var pct = Math.max(0, Math.min(100, Math.round(Number(stream.progress_pct) || 0)));
              var meta = statusWord(stream.status, stream.blocker_count, "stream") + '<span class="pulse-meta-pct">' + pct + '%<span class="pulse-meta-separator">·</span></span>' + joinMeta([
                stream.agent_name ? "<b>" + escapeHtml(stream.agent_name) + "</b>" : "",
                stream.blocker_count ? '<span class="tone-danger">' + escapeHtml(plural(stream.blocker_count, "blocker")) + "</span>" : "",
                stream.summary ? escapeHtml(stream.summary) : "",
              ]);
              return linkRow(
                dashboardUrl,
                renderPulseAvatar(stream) || icon("workstream"),
                "",
                stream.title,
                meta,
                renderProgressBar(pct, tone) + chipFor(stream.status, stream.blocker_count, "stream"),
                "has-chip"
              );
            })
            .join("") +
          "</div>"
        );
      };

      var renderFocusPanel = function (pulseData, dashboardUrl) {
        var parts = [];

        if ((pulseData.next_steps || []).length) {
          parts.push(
            '<div class="pulse-subsection">' +
              '<div class="pulse-subsection-label">Next moves</div>' +
              '<div class="pulse-list">' +
                pulseData.next_steps
                  .slice(0, 4)
                  .map(function (step) {
                    return linkRow(dashboardUrl, icon("run"), "", step, "Pick it up or hand it off in the live view", window.OrgXIcons.icon("open-external", 14));
                  })
                  .join("") +
              "</div>" +
            "</div>"
          );
        }

        if ((pulseData.milestones || []).length) {
          parts.push(
            '<div class="pulse-subsection">' +
              '<div class="pulse-subsection-label">Milestones</div>' +
              '<div class="pulse-list">' +
                pulseData.milestones
                  .slice(0, 4)
                  .map(function (milestone) {
                    var tone = toneForStatus(milestone.status, milestone.progress, 0);
                    return linkRow(
                      dashboardUrl,
                      icon("milestone"),
                      "",
                      milestone.title,
                      escapeHtml(titleCase(milestone.status || "planned")),
                      renderProgressBar(milestone.progress, tone)
                    );
                  })
                  .join("") +
              "</div>" +
            "</div>"
          );
        }

        if (!parts.length) {
          return '<div class="pulse-empty">No next moves are set for this initiative yet.</div>';
        }

        return parts.join("");
      };

      // K3 in miniature: every output item, worst first, with one quality strip on top.
      var renderArtifactsPanel = function (pulseData, dashboardUrl) {
        if (!pulseData.recent_artifacts.length) {
          return '<div class="pulse-empty">Nothing has been delivered for this initiative yet.</div>';
        }
        var rank = function (artifact) {
          var key = toStatusKey(artifact.status);
          return key === "changes_requested" ? 0 : key === "in_review" || artifact.needs_review ? 1 : key === "draft" ? 2 : 3;
        };
        var counts = { fail: 0, you: 0, unv: 0, met: 0 };
        pulseData.recent_artifacts.forEach(function (artifact) {
          var key = toStatusKey(artifact.status);
          if (key === "changes_requested") counts.fail += 1;
          else if (key === "in_review" || artifact.needs_review) counts.you += 1;
          else if (key === "approved" || key === "completed") counts.met += 1;
          else counts.unv += 1;
        });
        var summary = pulseData.artifact_summary || {};
        var strip =
          '<div class="pulse-quality">' +
            '<div class="pulse-quality-strip" aria-hidden="true">' +
              (counts.fail ? '<i class="q-fail" style="flex:' + counts.fail + ' 0 0"></i>' : "") +
              (counts.you ? '<i class="q-you" style="flex:' + counts.you + ' 0 0"></i>' : "") +
              (counts.unv ? '<i class="q-unv" style="flex:' + counts.unv + ' 0 0"></i>' : "") +
              (counts.met ? '<i class="q-met" style="flex:' + counts.met + ' 0 0"></i>' : "") +
            "</div>" +
            '<div class="pulse-facts">' +
              (counts.fail ? '<span class="f-blocked"><i></i>' + counts.fail + " changes requested</span>" : "") +
              (counts.you ? '<span class="f-review"><i></i>' + counts.you + " waiting for your review</span>" : "") +
              (counts.unv ? '<span class="f-planned"><i></i>' + counts.unv + " draft</span>" : "") +
              (counts.met ? '<span class="f-done"><i></i>' + counts.met + " accepted</span>" : "") +
              (typeof summary.total === "number" && summary.total > pulseData.recent_artifacts.length
                ? "<span>" + (summary.total - pulseData.recent_artifacts.length) + " more in OrgX</span>"
                : "") +
            "</div>" +
          "</div>";

        return (
          strip +
          '<div class="pulse-list">' +
          pulseData.recent_artifacts
            .slice()
            .sort(function (a, b) { return rank(a) - rank(b); })
            .slice(0, 6)
            .map(function (artifact) {
              var key = toStatusKey(artifact.status);
              var age = formatRelative(artifact.created_at);
              var url = artifact.primary_url || artifact.live_url || dashboardUrl || "";
              var meta = joinMeta([
                artifact.artifact_type ? escapeHtml(titleCase(String(artifact.artifact_type).split(".").pop())) : "",
                artifact.created_by_name ? "<b>" + escapeHtml(artifact.created_by_name) + "</b>" : "",
                age ? escapeHtml(age) : "",
              ]);
              var tone = key === "changes_requested" ? "red" : key === "in_review" || artifact.needs_review ? "amber" : key === "approved" ? "teal" : "";
              return linkRow(
                url,
                icon("artifact"),
                tone,
                artifact.title,
                statusWord(artifact.status, 0, "artifact") + meta,
                chipFor(artifact.status, 0, "artifact"),
                "has-chip pulse-artifact-row" + (key === "in_review" || key === "draft" ? " is-review" : "")
              );
            })
            .join("") +
          "</div>"
        );
      };

      var renderPanel = function (panel, pulseData, dashboardUrl, attentionItems) {
        var body =
          panel === "actions" ? renderActionsPanel(attentionItems)
          : panel === "focus" ? renderFocusPanel(pulseData, dashboardUrl)
          : panel === "artifacts" ? renderArtifactsPanel(pulseData, dashboardUrl)
          : renderStreamsPanel(pulseData, dashboardUrl);
        return '<div class="pulse-panel is-active">' + body + "</div>";
      };

      var animatePanelHost = function (panelHost, html) {
        if (!panelHost) return;
        panelTransitionToken += 1;
        var token = panelTransitionToken;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          panelHost.innerHTML = html;
          panelHost.style.height = "";
          panelHost.style.opacity = "";
          return;
        }

        var startHeight = panelHost.offsetHeight;
        panelHost.style.overflow = "hidden";
        panelHost.style.opacity = html ? "1" : "0.96";
        panelHost.style.height = startHeight + "px";
        panelHost.innerHTML = html;
        var endHeight = panelHost.scrollHeight;

        requestAnimationFrame(function () {
          if (token !== panelTransitionToken) return;
          panelHost.style.height = endHeight + "px";
          panelHost.style.opacity = html ? "1" : "0";
        });

        var finalize = function (event) {
          if (token !== panelTransitionToken) return;
          if (event && event.propertyName !== "height") return;
          panelHost.style.height = "";
          panelHost.style.opacity = "";
          panelHost.style.overflow = "";
          panelHost.removeEventListener("transitionend", finalize);
        };

        if (startHeight === endHeight) {
          window.setTimeout(function () {
            finalize({ propertyName: "height" });
          }, 280);
          return;
        }

        panelHost.addEventListener("transitionend", finalize);
      };

      var syncPulsePanel = function () {
        var shell = document.querySelector(".pulse-shell");
        if (!shell || !currentSections.length) return;

        var activePanel = uiState.panel;
        var availableKeys = currentSections.map(function (section) {
          return section.key;
        });
        if (!panelHydrated && !activePanel && availableKeys.length) {
          activePanel = availableKeys[0];
          uiState.panel = activePanel;
          panelHydrated = true;
        }
        if (availableKeys.indexOf(activePanel) === -1) {
          activePanel = null;
          uiState.panel = null;
        }

        Array.prototype.forEach.call(
          shell.querySelectorAll(".pulse-rail-button[data-panel-key]"),
          function (button) {
            var panelKey = button.getAttribute("data-panel-key");
            var isActive = activePanel === panelKey;
            button.classList.toggle("is-active", isActive);
            button.setAttribute("aria-pressed", String(isActive));
            button.setAttribute("aria-expanded", String(isActive));
          }
        );

        var attentionBanner = document.querySelector(".pulse-attention");
        if (attentionBanner) {
          attentionBanner.classList.toggle("is-open", activePanel === "actions");
          attentionBanner.setAttribute("aria-expanded", String(activePanel === "actions"));
        }

        var panelHost = shell.querySelector("#pulse-panel-host");
        if (!panelHost) return;
        animatePanelHost(
          panelHost,
          activePanel
            ? renderPanel(activePanel, currentPulseData, currentDashboardUrl, currentAttentionItems)
            : ""
        );
      };

      window.togglePulsePanel = function (panel, trigger) {
        panelHydrated = true;
        uiState.panel = uiState.panel === panel ? null : panel;
        syncPulsePanel();
        if (trigger && typeof trigger.focus === "function") trigger.focus();
      };

      var renderSkeleton = function () {
        injectHtml('<div class="pulse-shell-card"><div class="ox-card ox-surface" role="status" aria-label="Loading initiative pulse"><div class="pulse-head" style="height:44px;display:flex;align-items:center;gap:10px;padding:0 20px"><span class="sk" style="width:8px;height:8px;border-radius:50%"></span><span class="sk" style="width:36%;height:12px"></span></div><div class="pulse-shell">  <div class="pulse-hero"><span class="sk pulse-tile" style="border:0"></span><span style="display:flex;flex-direction:column;gap:8px;flex:1"><span class="sk" style="width:30%;height:11px"></span><span class="sk" style="width:62%;height:22px"></span></span></div>  <span style="display:flex;flex-direction:column;gap:8px"><span style="display:flex;justify-content:space-between"><span class="sk" style="width:96px;height:20px"></span><span class="sk" style="width:76px;height:22px;border-radius:999px"></span></span><span class="sk" style="width:100%;height:8px;border-radius:999px"></span><span class="sk" style="width:58%;height:12px"></span></span>  <span class="sk" style="width:100%;height:44px"></span>  <span class="sk" style="width:100%;height:56px"></span>  <span class="sk" style="width:100%;height:56px"></span></div><ox-footer variant="reads" state="loading"></ox-footer>        </div></div>');
      };

      /* Empty and error keep the loaded card's head (tile, title) so the card
         changes content, not shape, and say in plain words what to do next. */
      var calmCard = function (edge, title, desc, cta, role) {
        var tone = edge === "red" ? "red" : edge === "amber" ? "amber" : "";
        return (
          '<div class="pulse-shell-card animate-in"><div class="ox-card ox-surface" data-edge="' + edge + '">' +
            '<div class="pulse-calm"' + (role ? ' role="' + role + '"' : "") + ">" +
              '<span class="pulse-tile"' + (tone ? ' data-tone="' + tone + '"' : "") + ">" + window.OrgXIcons.icon(edge === "red" ? "failed" : "initiative", 20) + "</span>" +
              '<div class="empty-title">' + escapeHtml(title) + "</div>" +
              '<div class="empty-desc">' + escapeHtml(desc) + "</div>" +
              cta +
            "</div>" +
          "</div></div>"
        );
      };

      // Retry asks the host to run the pulse again; the card cannot call it itself.
      window.retryPulse = function (button) {
        if (button) { button.disabled = true; button.textContent = "Asking again…"; }
        Promise.resolve(window.OrgXWidgetRuntime.sendFollowUpMessage("Show the initiative pulse again.")).catch(function () {
          if (button) { button.disabled = false; button.textContent = "Ask ChatGPT to retry"; }
        });
      };
      var retryButton = function () {
        return '<button type="button" class="deep-link is-primary" onclick="retryPulse(this)">' + window.OrgXIcons.icon("retry", 14) + "Try again</button>";
      };

      var render = function () {
        if (isLoading) {
          renderSkeleton();
          return;
        }

        if (pulse && pulse.error) {
          var errorMessage = window.OrgXWidgetRuntime.getErrorMessage(pulse.error, "");
          var ambiguous = /multiple initiatives match/i.test(errorMessage);
          var missing = !ambiguous && /not found/i.test(errorMessage);
          var errorTitle = ambiguous ? "More than one initiative matches" : missing ? "Initiative not found" : "Couldn’t load this initiative";
          var errorDesc = ambiguous
            ? "Several initiatives have that name. Ask again with its full name, or pick it in OrgX."
            : missing
            ? "OrgX has no initiative by that name in this workspace. Check the name, or browse your initiatives in OrgX."
            : "OrgX didn’t return the pulse just now. Nothing was changed. Try again in a moment.";
          var errorCta = ambiguous || missing
            ? buildRecoveryCta(null, "Browse initiatives in OrgX")
            : '<div class="empty-actions">' + retryButton() + buildRecoveryCta(pulse, "Open in OrgX").replace('<div class="empty-actions">', "").replace(/<\/div>$/, "") + "</div>";
          injectHtml(calmCard("red", errorTitle, errorDesc, errorCta, "alert"));
          return;
        }

        /* The pulse snapshot and the live panel are separate sources. When the
           panel above is already listing running workstreams, "no recent pulse
           data" is true of this card but reads as though nothing is happening,
           so the copy defers to what the reader can already see. */
        function emptyState(recoveryFor, recoveryLabel) {
          var liveRows =
            window.OrgXLiveStore && window.OrgXLiveStore.liveRowCount
              ? window.OrgXLiveStore.liveRowCount()
              : 0;
          var title = liveRows ? "Live work only" : "No pulse yet";
          var desc = liveRows
            ? "Current workstreams are shown above. OrgX hasn’t recorded a pulse for this initiative yet."
            : "OrgX hasn’t recorded progress for this initiative yet. It appears here once work starts reporting in.";
          return calmCard(
            "mute",
            title,
            desc,
            recoveryLabel ? buildRecoveryCta(recoveryFor, recoveryLabel) : buildRecoveryCta(recoveryFor)
          );
        }

        if (!pulse) {
          injectHtml(emptyState(null, "Browse initiatives in OrgX"));
          return;
        }

        var normalized = normalizePulse(pulse);
        if (!normalized) {
          injectHtml(emptyState(pulse));
          return;
        }

        pulse = normalized;

        var dashboardUrl = window.OrgXLinks.normalize(pulse.live_url) || window.OrgXLinks.live(pulse.id);

        var reviewCount = (pulse.recent_artifacts || []).filter(function (artifact) {
          return ["in_review", "draft", "changes_requested"].indexOf(toStatusKey(artifact.status)) >= 0;
        }).length;

        var attentionItems = buildAttentionItems(pulse, dashboardUrl);
        var attentionBanner = buildAttentionBanner(pulse, attentionItems);
        // One number for the header, the rail and the Review button.
        var needsCount = attentionItems.length ? countNeedsYou(pulse) : 0;

        // Economics and ETA move to the footer detail: proof, not a headline.
        var economics = "";
        if (pulse.roi_summary) {
          var roiValue =
            pulse.roi_summary.total_cost > 0
              ? (pulse.roi_summary.total_value - pulse.roi_summary.total_cost) /
                pulse.roi_summary.total_cost
              : pulse.roi_summary.total_value > 0
              ? 1
              : null;
          economics = [
            (formatUsdRounded(pulse.roi_summary.total_cost) || "N/A") + " cost",
            (formatUsdRounded(pulse.roi_summary.total_value) || "N/A") + " value",
            (formatRoi(roiValue) || "N/A") + " ROI",
          ].join(" · ");
        } else {
          var fallbackParts = [];
          if (formatEta(pulse.eta_seconds)) fallbackParts.push(formatEta(pulse.eta_seconds) + " ETA");
          if (formatUsdRounded(pulse.current_cost)) fallbackParts.push(formatUsdRounded(pulse.current_cost) + " cost so far");
          economics = fallbackParts.join(" · ");
        }

        var streamCount = pulse.total_workstreams || pulse.active_workstreams || pulse.workstreams.length;
        var healthHtml = "";
        if (typeof pulse.health_score === "number") {
          var healthTone = pulse.health_score >= 85 ? "good" : pulse.health_score >= 70 ? "warning" : "danger";
          healthHtml = '<span class="pulse-health" data-tone="' + healthTone + '" title="Health score out of 100">Health ' + escapeHtml(String(Math.round(pulse.health_score))) + "</span>";
        }
        var statusKey = toStatusKey(pulse.status || "active");
        var statusTone = statusKey === "blocked" || statusKey === "at_risk" ? "danger" : statusKey === "stale" || statusKey === "paused" ? "warning" : statusKey === "completed" || statusKey === "active" || statusKey === "running" ? "good" : "";

        var sections = [];
        if (streamCount || pulse.workstreams.length || pulse.milestones.length) {
          sections.push({
            key: "streams",
            value: streamCount || pulse.workstreams.length || pulse.milestones.length,
            label: "Streams",
            // The blocked child is already loud in the attention line and the
            // population bar. Keep the aggregate count neutral so red stays meaningful.
            alert: false,
          });
        }
        if (attentionItems.length) {
          sections.push({
            key: "actions",
            value: needsCount,
            label: "Needs you",
            alert: true,
          });
        }
        if ((pulse.next_steps || []).length || pulse.milestones.length) {
          sections.push({
            key: "focus",
            value: (pulse.next_steps || []).length || pulse.milestones.length,
            label: (pulse.next_steps || []).length ? "Next" : "Milestones",
            alert: false,
          });
        }
        if (pulse.recent_artifacts.length) {
          sections.push({
            key: "artifacts",
            value:
              (pulse.artifact_summary && pulse.artifact_summary.total) ||
              pulse.recent_artifacts.length,
            label: "Output",
            // Items awaiting review warrant attention, not alarm — amber, not red.
            warn: reviewCount > 0,
          });
        }

        var availableKeys = sections.map(function (section) {
          return section.key;
        });
        if (!panelHydrated && !uiState.panel && availableKeys.length) {
          uiState.panel = availableKeys[0];
          panelHydrated = true;
        }
        if (availableKeys.indexOf(uiState.panel) === -1) uiState.panel = null;
        currentPulseData = pulse;
        currentDashboardUrl = dashboardUrl;
        currentAttentionItems = attentionItems;
        currentSections = sections.slice();

        var syncLabel =
          formatRelative(pulse.updated_at) ||
          formatRelative(
            pulse.recent_artifacts.length ? pulse.recent_artifacts[0].created_at : null
          ) ||
          "now";
        var updatedAt = pulse.updated_at ? new Date(pulse.updated_at).getTime() : NaN;
        var isStale = toStatusKey(pulse.status) === "stale" || (Number.isFinite(updatedAt) && Date.now() - updatedAt > 10 * 60 * 1000);

        // The opening line: amber when something waits on you, red when work is blocked.
        var waiting = needsCount;
        var lineTone = !waiting ? "calm" : (pulse.blockers || []).length ? "blocking" : "needs-you";
        var blockerTotal = (pulse.blockers || []).length;
        var lineHtml = waiting
          ? escapeHtml(waiting + (waiting === 1 ? " needs" : " need") + " you") +
            (blockerTotal ? '<span class="pulse-line-extra"> · ' + escapeHtml(blockerTotal + " blocking") + "</span>" : "")
          : statusKey === "completed"
          ? "Complete · nothing needs you"
          : "Nothing needs you";
        var edge = !waiting ? "teal" : lineTone === "blocking" ? "red" : "amber";
        var tileTone = lineTone === "blocking" ? "red" : waiting ? "amber" : "teal";
        var actionsOpen = uiState.panel === "actions";

        var footerState = isStale ? "stale" : "fresh";
        var footerHeading = isStale ? "Out of date" : "Synced " + syncLabel;
        var footerDetail = isStale ? "as of " + syncLabel + " · refresh before deciding" : economics || "up to date";
        var footerAction = "Open live view ↗";

        injectHtml(
          '<div class="widget-shell-card pulse-shell-card animate-in">' +
            '<div class="ox-card ox-surface" data-edge="' + edge + '">' +
              '<div class="pulse-head">' +
                '<ox-attention-line tone="' + lineTone + '" count="' + waiting + '">' +
                  "<span>" + lineHtml + "</span>" +
                  (attentionBanner
                    ? '<button slot="action" type="button" class="pulse-attention' + (actionsOpen ? " is-open" : "") +
                      '" onclick="togglePulsePanel(\'actions\', this)" aria-controls="pulse-panel-host" aria-expanded="' + String(actionsOpen) +
                      '" title="' + escapeHtml(attentionBanner.headline) + '">Review ' + escapeHtml(String(waiting)) + " " + icons.chevronDown(13) + "</button>"
                    : "") +
                "</ox-attention-line>" +
              "</div>" +
              '<div class="pulse-shell">' +
                '<div class="pulse-hero">' +
                  '<span class="pulse-tile" data-tone="' + tileTone + '">' + window.OrgXIcons.icon("initiative", 20) + "</span>" +
                  '<div class="pulse-copy">' +
                    '<span class="pulse-kicker">Initiative · <b' + (statusTone ? ' data-tone="' + statusTone + '"' : "") + ">" + escapeHtml(titleCase(pulse.status || "active")) + "</b></span>" +
                    '<h1 class="pulse-title">' + escapeHtml(pulse.name) + "</h1>" +
                  "</div>" +
                "</div>" +
                renderProgress(pulse, healthHtml) +
                renderMetrics(sections, uiState.panel) +
                '<div class="pulse-panel-host" id="pulse-panel-host">' +
                  (uiState.panel ? renderPanel(uiState.panel, pulse, dashboardUrl, attentionItems) : "") +
                "</div>" +
              "</div>" +
              '<ox-footer variant="reads" class="pulse-footer" state="' + footerState + '" heading="' + escapeHtml(footerHeading) +
                '" detail="' + escapeHtml(footerDetail) + '" action-label="' + escapeHtml(footerAction) +
                '" data-url="' + escapeHtml(dashboardUrl) + '"></ox-footer>' +
            "</div>" +
          "</div>"
        );
      };

      // The footer's text action opens the live view through the host.
      document.addEventListener("ox-action", function (event) {
        var footer = event.target && event.target.closest ? event.target.closest("ox-footer[data-url]") : null;
        if (!footer) return;
        var url = footer.getAttribute("data-url");
        if (openWidgetLink(url, event) === false) return;
        try { window.open(url, "_blank", "noopener,noreferrer"); } catch (_) { /* host owns recovery */ }
      });

      if (isDemo) {
        applyBootPayload();
      } else {
        initWidget({
          live: {
            anchor: '#content',
            widget: 'initiative-pulse',
            emptyLabel: 'No workstreams running',
          },
          render: function (data) {
            applyBootPayload(function () {
              if (data) pulse = data;
            });
          },
        });
      }
    </script>
  </body>
</html>
