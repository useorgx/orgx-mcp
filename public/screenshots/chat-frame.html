<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OrgX MCP — ChatGPT App Screenshot</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 1600px;
        height: 1000px;
        background: #ffffff;
        color: #0d0d0d;
        display: grid;
        grid-template-rows: 56px 1fr;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Top bar */
      .topbar {
        display: flex;
        align-items: center;
        padding: 0 28px;
        border-bottom: 1px solid #ececec;
        background: #fafafa;
      }
      .topbar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
        color: #1a1a1a;
      }
      .topbar .brand svg { width: 22px; height: 22px; }
      .topbar .model {
        margin-left: 14px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
        color: #6b6b6b;
        background: #efefef;
        border-radius: 999px;
      }
      .topbar .right {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .topbar .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #d8d8d8;
      }

      /* Conversation column */
      .chat {
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
        padding: 36px 0 0;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .user-msg {
        align-self: flex-end;
        max-width: 560px;
        padding: 14px 18px;
        background: #f4f4f4;
        border-radius: 22px;
        border-bottom-right-radius: 6px;
        font-size: 15.5px;
        line-height: 1.45;
        color: #111111;
      }

      .using {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: #6b6b6b;
        padding-left: 4px;
      }
      .using .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        background: #f4f4f4;
        border-radius: 999px;
        color: #1a1a1a;
        font-weight: 500;
      }
      .using .badge .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #10a37f;
      }
      .using .tool {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Cascadia Mono", monospace;
        color: #4a4a4a;
        font-size: 12.5px;
      }

      .widget-frame {
        position: relative;
        width: 100%;
        background: transparent;
        border-radius: 16px;
        overflow: hidden;
      }

      .widget-frame iframe {
        width: 100%;
        border: 0;
        display: block;
        background: transparent;
      }

      /* Soft fade-out so the inline widget reads as 'more below' rather than clipped. */
      .widget-frame::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 96px;
        background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 60%, rgba(255,255,255,1) 100%);
        pointer-events: none;
      }

      /* Subtle ambient glow to lift the screenshot */
      body::before {
        content: "";
        position: fixed;
        inset: -10% -10% auto -10%;
        height: 380px;
        background:
          radial-gradient(60% 80% at 30% 0%, rgba(99,102,241,0.06), transparent 60%),
          radial-gradient(50% 70% at 80% 10%, rgba(16,163,127,0.05), transparent 60%);
        pointer-events: none;
        z-index: 0;
      }
      .topbar, .chat { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.985 5.985 0 0 0 .516 4.91 6.052 6.052 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073Z" fill="#0d0d0d"/>
        </svg>
        ChatGPT
      </div>
      <div class="model" id="model-label">GPT-5</div>
      <div class="right">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <div class="chat">
      <div class="user-msg" id="user-msg">Loading…</div>

      <div class="using">
        <span class="badge"><span class="dot"></span>Used <strong style="color:#0d0d0d">OrgX</strong></span>
        <span class="tool" id="tool-label">orgx.scaffold_initiative</span>
      </div>

      <div class="widget-frame">
        <iframe id="widget" src="about:blank" loading="eager"></iframe>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const prompt = params.get('prompt') || 'Show me the latest from OrgX';
      const widget = params.get('widget') || 'scaffolded-initiative';
      const tool = params.get('tool') || 'orgx.tool';
      const widgetHeight = parseInt(params.get('h') || '760', 10);

      document.getElementById('user-msg').textContent = prompt;
      document.getElementById('tool-label').textContent = tool;

      const iframe = document.getElementById('widget');
      iframe.style.height = widgetHeight + 'px';
      iframe.src = `/widgets/${widget}.html?demo=true&theme=light&embed=app-card`;
    </script>
  </body>
</html>
