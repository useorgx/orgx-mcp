<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Authorization Error — OrgX</title>
    <link rel="icon" type="image/png" href="/orgx-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth-surface.css" />
    <link rel="stylesheet" href="/widgets/shared/interaction-kit.css" />
    <script src="/widgets/shared/interaction-kit.js" defer></script>
    <style>
      /* Escalation: the surface primary shifts off lime so the page reads as a
         stop, not as routine execution. */
      :root {
        --ox-primary-rgb: 244, 63, 94;
      }

      /* The failure mark. Restrained — a ring and a glyph, not an illustration.
         The single ambient pulse says "still live, not frozen". */
      .fault {
        position: relative;
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ox-danger);
        border: 1px solid rgba(var(--ox-danger-rgb), 0.3);
        background: rgba(var(--ox-danger-rgb), 0.1);
      }

      .fault::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        border: 1px solid rgba(var(--ox-danger-rgb), 0.5);
        animation: fault-pulse 2.8s var(--ox-ease) infinite;
      }

      @keyframes fault-pulse {
        0% {
          opacity: 0.7;
          transform: scale(1);
        }
        70%,
        100% {
          opacity: 0;
          transform: scale(1.22);
        }
      }

      .fault svg {
        width: 24px;
        height: 24px;
      }

      /* Recovery guidance is the payload of this page, so it sits in the open
         at full contrast. Technical detail is what gets disclosed. */
      .recovery {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .recovery li {
        display: flex;
        gap: 10px;
        font-size: 0.82rem;
        line-height: 1.5;
        color: var(--ox-text-muted);
      }

      .recovery li::before {
        content: '';
        flex-shrink: 0;
        width: 5px;
        height: 5px;
        margin-top: 8px;
        border-radius: 999px;
        background: rgba(var(--ox-warning-rgb), 0.8);
      }

      .recovery b {
        color: rgba(255, 255, 255, 0.82);
        font-weight: 600;
      }

      /* ── Technical detail disclosure ──────────────────────────────────── */

      .detail-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.015);
        color: var(--ox-text-faint);
        font: inherit;
        cursor: pointer;
        transition:
          background 160ms var(--ox-ease),
          border-color 160ms var(--ox-ease),
          color 160ms var(--ox-ease);
      }

      .detail-toggle:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.1);
        color: var(--ox-text-muted);
      }

      .detail-toggle:focus-visible {
        outline: none;
        border-color: rgba(var(--ox-danger-rgb), 0.5);
        box-shadow: 0 0 0 3px rgba(var(--ox-danger-rgb), 0.18);
      }

      .detail-toggle svg {
        width: 14px;
        height: 14px;
        transition: transform 250ms var(--ox-ease);
      }

      .detail-toggle[aria-expanded='true'] svg {
        transform: rotate(180deg);
      }

      .detail-panel {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 280ms var(--ox-ease);
      }

      .detail-panel.is-open {
        grid-template-rows: 1fr;
      }

      .detail-panel > div {
        overflow: hidden;
      }

      .detail-grid {
        margin: 10px 0 0;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(0, 0, 0, 0.3);
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        font-family: var(--ox-mono);
        font-size: 0.71rem;
        line-height: 1.5;
      }

      .detail-grid dt {
        color: var(--ox-text-faint);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .detail-grid dd {
        margin: 0;
        color: rgba(255, 255, 255, 0.66);
        overflow-wrap: anywhere;
      }

      .detail-grid dd.is-code {
        color: var(--ox-danger);
      }

      /* display:contents lets the wrapper's dt/dd participate in the parent
         grid; the [hidden] guard must come after it to win. */
      .detail-row {
        display: contents;
      }

      .detail-row[hidden] {
        display: none;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      /* Rose owns the diagnosis — the grid bloom, the edge-light, the fault
         mark. It must not own the recovery: a red primary button reads as a
         destructive action when this is the safe way forward. The kit exposes
         a separate fill hook for exactly this. */
      /* The kit resolves --ox-primary-fill-rgb-effective on :root, so
         overriding --ox-primary-fill-rgb here would arrive too late — the
         button inherits the already-resolved value. Set what is consumed. */
      #retry-btn {
        --ox-primary-fill-rgb-effective: var(--ox-lime-rgb);
      }

      .actions__pair {
        display: flex;
        gap: 9px;
      }

      .actions__pair > * {
        flex: 1;
        min-width: 0;
      }

      @media (max-width: 400px) {
        .actions__pair {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-brand animate-in" style="--i: 0">
        <img src="/orgx-logo.png" alt="" />
        <span>OrgX</span>
      </div>

      <div class="auth-card animate-in" style="--i: 1">
        <div class="auth-section auth-section--head auth-center">
          <div class="fault" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
              />
            </svg>
          </div>
          <h1 class="auth-title" id="error-title">Authorization failed</h1>
          <p class="auth-sub" id="error-description">
            We couldn't complete the connection.
          </p>
        </div>

        <!-- Recovery is the component. -->
        <div class="auth-section">
          <p class="ox-eyebrow" style="margin-bottom: 11px">What to do</p>
          <ul class="recovery" id="recovery"></ul>
        </div>

        <!-- Diagnostics, disclosed. -->
        <div class="auth-section" id="detail-section">
          <button
            type="button"
            class="detail-toggle"
            id="detail-toggle"
            aria-expanded="false"
            aria-controls="detail-panel"
          >
            <span class="ox-eyebrow">Technical detail</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div class="detail-panel" id="detail-panel">
            <div>
              <dl class="detail-grid">
                <dt>Error</dt>
                <dd class="is-code" id="error-code">server_error</dd>
                <dt>Detail</dt>
                <dd id="error-message">—</dd>
                <div id="request-id-row" class="detail-row" hidden>
                  <dt>Request</dt>
                  <dd id="request-id"></dd>
                </div>
              </dl>
            </div>
          </div>
        </div>

        <div class="auth-section auth-section--foot">
          <div class="actions">
            <button
              type="button"
              id="retry-btn"
              class="ox-action-btn ox-action-btn--primary ox-action-btn--full"
            >
              Try again
            </button>
            <div class="actions__pair">
              <button
                type="button"
                id="home-btn"
                class="ox-action-btn ox-action-btn--ghost"
              >
                Open OrgX
              </button>
              <button
                type="button"
                id="support-btn"
                class="ox-action-btn ox-action-btn--ghost"
              >
                Get help
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-foot animate-in" style="--i: 2">
        <a href="https://useorgx.com/docs">Docs</a>
        <span class="auth-foot__dot">·</span>
        <a href="https://useorgx.com/support">Support</a>
        <span class="auth-foot__dot">·</span>
        <a href="https://useorgx.com/changelog">Status</a>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        // Every entry names what actually happened and what the operator does
        // next. A generic "something went wrong" with three generic bullets
        // leaves them guessing which of the three applies.
        var FAULTS = {
          access_denied: {
            title: 'Authorization declined',
            description:
              'The request was turned down, so nothing was connected and no access was granted.',
            recovery: [
              '<b>Start over from the app</b> that asked for access if this was not deliberate.',
              'Nothing changed in your workspace — there is nothing to undo.',
            ],
            retry: 'Start over',
          },
          invalid_request: {
            title: 'This authorization link expired',
            description:
              'Authorization sessions stay open for about 20 minutes, and this one has closed.',
            recovery: [
              '<b>Reconnect from the app</b> to get a fresh link.',
              'Links are single-use, so reopening an old tab will land here again.',
            ],
            retry: 'Start over',
          },
          session_expired: {
            title: 'Your session expired',
            description:
              'You were signed out of OrgX before the authorization finished.',
            recovery: [
              '<b>Sign in to OrgX</b>, then reconnect from the app.',
            ],
            retry: 'Start over',
          },
          invalid_client: {
            title: 'That application is not recognized',
            description:
              'OrgX has no registration for the app that requested access, so the request was refused.',
            recovery: [
              '<b>Check you launched the connection from the app itself</b>, not from a saved link.',
              'If the app is yours, confirm its client registration with OrgX.',
            ],
            retry: 'Try again',
          },
          invalid_scope: {
            title: 'Those permissions are not available',
            description:
              'The app asked for access OrgX does not grant over MCP.',
            recovery: [
              '<b>Update the app to request supported scopes</b> — decisions, agents, initiatives, or memory.',
              'Contact the app developer if you cannot change what it requests.',
            ],
            retry: 'Try again',
          },
          rate_limit_exceeded: {
            title: 'Too many attempts',
            description:
              'Authorization was tried too many times in a short window and is briefly locked.',
            recovery: [
              '<b>Wait about a minute</b>, then reconnect from the app.',
            ],
            retry: 'Wait, then retry',
          },
          temporarily_unavailable: {
            title: 'OrgX is temporarily unavailable',
            description:
              'The authorization service did not respond. This is on our side, not yours.',
            recovery: [
              '<b>Try again in a few moments.</b>',
              'Check status if it keeps failing.',
            ],
            retry: 'Try again',
          },
          server_error: {
            title: "OrgX couldn't finish the handshake",
            description:
              'Something failed partway through authorization. This is usually temporary.',
            recovery: [
              '<b>Try again</b> — most handshake failures clear on a second attempt.',
              'Confirm you are signed in to OrgX in this browser.',
              'Send us the technical detail below if it persists.',
            ],
            retry: 'Try again',
          },
        };

        var params = new URLSearchParams(window.location.search);
        var code = params.get('error') || 'server_error';
        var description = params.get('error_description') || '';
        var requestId = params.get('request_id') || '';
        var fault = FAULTS[code] || FAULTS.server_error;
        var retryUrl = params.get('retry_url') || document.referrer || null;

        function busy(id, label) {
          var button = document.getElementById(id);
          if (button && window.OrgXWidgetUX) {
            window.OrgXWidgetUX.setLoading(button, { loadingLabel: label });
          }
          return button;
        }

        function init() {
          document.getElementById('error-title').textContent = fault.title;
          // The server's own description is more specific than our generic
          // copy when it sends one, so it wins.
          document.getElementById('error-description').textContent =
            description || fault.description;
          document.title = fault.title + ' — OrgX';

          document.getElementById('recovery').innerHTML = fault.recovery
            .map(function (item) {
              return '<li><span>' + item + '</span></li>';
            })
            .join('');

          document.getElementById('error-code').textContent = code;
          document.getElementById('error-message').textContent =
            description || 'No additional detail reported';

          if (requestId) {
            document.getElementById('request-id-row').hidden = false;
            document.getElementById('request-id').textContent = requestId;
          }

          document.getElementById('retry-btn').textContent = fault.retry;

          var toggle = document.getElementById('detail-toggle');
          var panel = document.getElementById('detail-panel');
          toggle.addEventListener('click', function () {
            var open = panel.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          });

          document
            .getElementById('retry-btn')
            .addEventListener('click', function () {
              busy('retry-btn', 'Reopening…');
              document.body.classList.add('is-leaving');
              window.setTimeout(function () {
                if (retryUrl) {
                  window.location.href = retryUrl;
                } else {
                  window.history.back();
                }
              }, 200);
            });

          document
            .getElementById('home-btn')
            .addEventListener('click', function () {
              busy('home-btn', 'Opening…');
              window.location.href = 'https://useorgx.com';
            });

          document
            .getElementById('support-btn')
            .addEventListener('click', function () {
              busy('support-btn', 'Opening…');
              var subject = encodeURIComponent('OAuth error: ' + code);
              var body = encodeURIComponent(
                'Hi OrgX support,\n\nAuthorization failed.\n\nError: ' +
                  code +
                  '\nDetail: ' +
                  (description || 'none') +
                  (requestId ? '\nRequest: ' + requestId : '') +
                  '\n\nThanks'
              );
              window.location.href =
                'mailto:support@useorgx.com?subject=' + subject + '&body=' + body;
            });
        }

        init();
      })();
    </script>
  </body>
</html>
