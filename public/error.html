<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Authorization failed — OrgX</title>
    <link rel="icon" type="image/png" href="/orgx-logo.png" />
    <link rel="stylesheet" href="/auth-surface.css" />
    <style>
      /* The handshake stopped, so the lit path and the signal line carry the
         danger tone. The way forward stays signal-green: a red primary button
         reads as destructive when it is the safe path. */
      :root {
        --state-rgb: 251, 113, 133;
      }

      .recovery {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .recovery li {
        display: grid;
        grid-template-columns: 6px 1fr;
        gap: 11px;
        color: var(--secondary);
        font-size: 14px;
        line-height: 1.5;
      }

      .recovery li::before {
        content: '';
        width: 6px;
        height: 6px;
        margin-top: 8px;
        border-radius: 50%;
        background: var(--warning);
      }

      .recovery b {
        color: var(--text);
        font-weight: 650;
      }

      /* Diagnostics are for support, not for the operator, so they stay
         disclosed until asked for. */
      .detail-toggle {
        width: 100%;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: color 160ms var(--ease);
      }

      .detail-toggle:hover {
        color: var(--secondary);
      }

      .detail-toggle .eyebrow {
        margin: 0;
        color: inherit;
      }

      .detail-toggle svg {
        width: 14px;
        height: 14px;
        transition: transform 240ms var(--ease);
      }

      .detail-toggle[aria-expanded='true'] svg {
        transform: rotate(180deg);
      }

      .detail-panel {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 280ms var(--ease);
      }

      .detail-panel.is-open {
        grid-template-rows: 1fr;
      }

      .detail-panel > div {
        overflow: hidden;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        margin: 8px 0 2px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--muted-surface);
      }

      .detail-grid dt {
        color: var(--muted);
        font: 650 10px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-grid dd {
        margin: 0;
      }

      .detail-grid .is-code code {
        color: var(--danger);
      }

      .detail-row {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div class="orgx-field" aria-hidden="true">
      <svg viewBox="0 0 1440 960" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="orgx-grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0H0V24" fill="none" stroke="#17202a" stroke-width="1" />
          </pattern>
        </defs>
        <rect class="field-grid" width="1440" height="960" fill="url(#orgx-grid)" />
        <path class="field-path" d="M-80 720H190V584H370V394H580" />
        <path class="field-path state" d="M-80 816H290V670H400" />
        <path class="field-path" d="M400 670H485V504H720" />
        <path class="field-path" d="M1510 168H1260V296H1090V462H870V620H650" />
        <path class="field-path" d="M1510 84H1340V218H1170V386H980V548H760" />
        <circle class="field-node" cx="190" cy="584" r="5" />
        <circle class="field-node" cx="370" cy="394" r="5" />
        <circle class="field-node state" cx="400" cy="670" r="4" />
        <circle class="field-node" cx="1090" cy="462" r="5" />
        <circle class="field-node" cx="870" cy="620" r="5" />
        <text class="field-label" x="108" y="566">CLIENT</text>
        <text class="field-label" x="390" y="378">REQUEST</text>
        <text class="field-label" x="1112" y="446">POLICY</text>
        <text class="field-label" x="318" y="696">STOPPED</text>
      </svg>
    </div>
    <div class="signal-line" aria-hidden="true"></div>

    <main class="page">
      <div class="shell-col">
        <section class="card" aria-labelledby="error-title">
          <div class="card-head">
            <div class="brand">
              <img src="/orgx-logo.png" alt="" />
              <span>OrgX</span>
              <span class="brand-context">Authorization</span>
            </div>
            <h1 id="error-title">Authorization failed</h1>
            <p class="lede" id="error-description">
              The connection could not be completed.
            </p>
          </div>

          <div class="card-body">
            <span class="eyebrow">What to do</span>
            <ul class="recovery" id="recovery"></ul>
          </div>

          <div class="card-body" style="padding-top: 10px; padding-bottom: 14px">
            <button
              type="button"
              class="detail-toggle"
              id="detail-toggle"
              aria-expanded="false"
              aria-controls="detail-panel"
            >
              <span class="eyebrow">Technical detail</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
            <div class="detail-panel" id="detail-panel">
              <div>
                <dl class="detail-grid">
                  <dt>Error</dt>
                  <dd class="is-code"><code id="error-code">server_error</code></dd>
                  <dt>Detail</dt>
                  <dd><code id="error-message">—</code></dd>
                  <div class="detail-row" id="request-id-row" hidden>
                    <dt>Request</dt>
                    <dd><code id="request-id"></code></dd>
                  </div>
                </dl>
              </div>
            </div>
          </div>

          <div class="card-foot">
            <button type="button" class="button quiet" id="support-btn">
              Get help
            </button>
            <button type="button" class="button" id="home-btn">Open OrgX</button>
            <button type="button" class="button primary grow" id="retry-btn">
              Try again
            </button>
          </div>
        </section>

        <nav class="foot-links" aria-label="Help">
          <a href="https://useorgx.com/docs">Docs</a>
          <a href="https://useorgx.com/support">Support</a>
          <a href="https://useorgx.com/changelog">Status</a>
        </nav>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        // Each entry names what actually happened and the one thing to do
        // next. The worker emits access_denied, invalid_request and
        // server_error; the rest cover codes a client or proxy can send here.
        var FAULTS = {
          access_denied: {
            title: 'Authorization declined',
            description:
              'The request was turned down, so nothing was connected and no access was granted.',
            recovery: [
              '<b>Start over from your MCP client</b> if this was not deliberate.',
              'Nothing changed in your workspace, so there is nothing to undo.',
            ],
            retry: 'Start over',
          },
          invalid_request: {
            title: 'This authorization session ended',
            description:
              'Authorization sessions are single-use and expire after about 20 minutes.',
            recovery: [
              '<b>Reconnect from your MCP client</b> to open a fresh session.',
              'Reopening an old tab or link lands here again, because it has already been used.',
            ],
            retry: 'Start over',
          },
          authorization_session_expired: {
            title: 'This authorization session ended',
            description:
              'Authorization sessions are single-use and expire after about 20 minutes.',
            recovery: [
              '<b>Reconnect from your MCP client</b> to open a fresh session.',
            ],
            retry: 'Start over',
          },
          invalid_client: {
            title: 'That client is not recognized',
            description:
              'OrgX has no registration for the application that asked for access.',
            recovery: [
              '<b>Start the connection from the client itself</b>, not from a saved link.',
              'If you build this client, confirm its registration with OrgX.',
            ],
            retry: 'Try again',
          },
          invalid_scope: {
            title: 'That access is not available',
            description: 'The client asked for access OrgX does not grant over MCP.',
            recovery: [
              '<b>Update the client to request supported scopes</b>: decisions, agents, initiatives, or memory.',
            ],
            retry: 'Try again',
          },
          rate_limit_exceeded: {
            title: 'Too many attempts',
            description:
              'Authorization was tried too many times in a short window and is briefly paused.',
            recovery: ['<b>Wait about a minute</b>, then reconnect from your client.'],
            retry: 'Try again',
          },
          temporarily_unavailable: {
            title: 'OrgX is temporarily unavailable',
            description:
              'The authorization service did not respond. This is on our side, not yours.',
            recovery: [
              '<b>Try again in a few moments.</b>',
              'Check status if it keeps failing.',
            ],
            retry: 'Try again',
          },
          server_error: {
            title: "OrgX couldn't finish the handshake",
            description:
              'Something failed partway through authorization. This is usually temporary.',
            recovery: [
              '<b>Try again.</b> Most handshake failures clear on a second attempt.',
              'Confirm you are signed in to OrgX in this browser.',
              'Send us the technical detail below if it keeps happening.',
            ],
            retry: 'Try again',
          },
        };

        var params = new URLSearchParams(window.location.search);
        var code = params.get('error') || 'server_error';
        var description = params.get('error_description') || '';
        var requestId = params.get('request_id') || '';
        var fault = FAULTS[code] || FAULTS.server_error;

        function busy(button, label) {
          var spin = document.createElement('span');
          spin.className = 'spin';
          spin.setAttribute('aria-hidden', 'true');
          button.textContent = label;
          button.prepend(spin);
          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
        }

        function leave(button, label, go) {
          busy(button, label);
          document.body.classList.add('is-leaving');
          window.setTimeout(go, 200);
        }

        document.getElementById('error-title').textContent = fault.title;
        // The worker's own description is more specific than our generic copy
        // whenever it sends one, so it wins.
        document.getElementById('error-description').textContent =
          description || fault.description;
        document.title = fault.title + ' — OrgX';
        document.getElementById('recovery').innerHTML = fault.recovery
          .map(function (item) {
            return '<li><span>' + item + '</span></li>';
          })
          .join('');
        document.getElementById('error-code').textContent = code;
        document.getElementById('error-message').textContent =
          description || 'No additional detail reported';
        if (requestId) {
          document.getElementById('request-id').textContent = requestId;
          document.getElementById('request-id-row').hidden = false;
        }

        var retry = document.getElementById('retry-btn');
        retry.textContent = fault.retry;

        var toggle = document.getElementById('detail-toggle');
        var panel = document.getElementById('detail-panel');
        toggle.addEventListener('click', function () {
          var open = panel.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });

        retry.addEventListener('click', function () {
          var target = params.get('retry_url');
          leave(retry, 'Reopening…', function () {
            if (target) {
              window.location.href = target;
            } else {
              window.history.back();
            }
          });
        });

        document.getElementById('home-btn').addEventListener('click', function () {
          leave(this, 'Opening…', function () {
            window.location.href = 'https://useorgx.com';
          });
        });

        document.getElementById('support-btn').addEventListener('click', function () {
          var subject = encodeURIComponent('OAuth error: ' + code);
          var body = encodeURIComponent(
            'Hi OrgX support,\n\nAuthorization failed.\n\nError: ' +
              code +
              '\nDetail: ' +
              (description || 'none') +
              (requestId ? '\nRequest: ' + requestId : '') +
              '\n\nThanks'
          );
          window.location.href =
            'mailto:support@useorgx.com?subject=' + subject + '&body=' + body;
        });
      })();
    </script>
  </body>
</html>
