name = "orgx-mcp"
main = "src/index.ts"
compatibility_date = "2025-11-08"
compatibility_flags = ["nodejs_compat"]
account_id = "5e0f62b0acf89dd1493ff769187814c4"

# Static assets for landing page and widgets
# html_handling = "none" prevents the assets handler from mapping / to index.html,
# so POST / (MCP Streamable HTTP) passes through to the worker while
# GET /index.html still serves the landing page directly.
[assets]
directory = "./public"
html_handling = "none"
binding = "ASSETS"

# Non-secret variables (secrets like ORGX_SERVICE_KEY, MCP_JWT_SECRET,
# ORGX_INTERNAL_SECRET, OPENAI_APPS_CHALLENGE_TOKEN should be set via
# `wrangler secret put`)
# Canonical production API origin. Keep the fallback configured separately;
# reviewer traffic must not wait on the retired API origin.
[vars]
ORGX_API_URL = "https://useorgx.com"
ORGX_API_FALLBACK_URL = "https://orgx-api-fallback-brain-buffet.vercel.app"
MCP_SERVER_URL = "https://mcp.useorgx.com"
AUTH_SERVER_URL = "https://mcp.useorgx.com"
ORGX_WEB_URL = "https://useorgx.com"
SENTRY_ENVIRONMENT = "development"
SENTRY_TRACES_SAMPLE_RATE = "0.1"

[version_metadata]
binding = "CF_VERSION_METADATA"

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "OrgXMcp" },
  { name = "OAUTH_STATE", class_name = "OAuthState" },
  { name = "SCAFFOLD_SESSION", class_name = "ScaffoldSessionDO" },
  { name = "LIVE_FEED", class_name = "LiveFeedDO" }
]

# KV namespace for OAuth provider token/grant storage
# Create with: wrangler kv namespace create OAUTH_KV
#              wrangler kv namespace create OAUTH_KV --preview
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "5bff02959fa74d43ba6708d9746121e4"
preview_id = "8570c22420cf4cc1b287416cbe6bb7c6"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgXMcp"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OAuthState"]

[[migrations]]
tag = "v3"
new_classes = ["ScaffoldSessionDO"]

[[migrations]]
tag = "v4"
new_classes = ["LiveFeedDO"]

# Production environment
[env.production]
routes = [
  # Serve MCP Registry auth on the apex to avoid apex->www redirects breaking verification.
  { pattern = "useorgx.com/.well-known/mcp-registry-auth*", zone_name = "useorgx.com" },
  { pattern = "mcp.useorgx.com", custom_domain = true, zone_name = "useorgx.com" }
]

[env.production.durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "OrgXMcp" },
  { name = "OAUTH_STATE", class_name = "OAuthState" },
  { name = "SCAFFOLD_SESSION", class_name = "ScaffoldSessionDO" },
  { name = "LIVE_FEED", class_name = "LiveFeedDO" }
]

[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
id = "5bff02959fa74d43ba6708d9746121e4"

# Non-secret vars only; secrets (ORGX_SERVICE_KEY, MCP_JWT_SECRET,
# ORGX_INTERNAL_SECRET, COOKIE_ENCRYPTION_KEY) set via dashboard or
# `wrangler secret put --env production`
# Canonical production API origin. Keep the fallback configured separately;
# reviewer traffic must not wait on the retired API origin.
[env.production.vars]
ORGX_API_URL = "https://useorgx.com"
ORGX_API_FALLBACK_URL = "https://orgx-api-fallback-brain-buffet.vercel.app"
ORGX_WEB_URL = "https://useorgx.com"
MCP_SERVER_URL = "https://mcp.useorgx.com"
AUTH_SERVER_URL = "https://mcp.useorgx.com"
SENTRY_ENVIRONMENT = "production"
SENTRY_TRACES_SAMPLE_RATE = "0.1"

# Staging/Preview environment  
[env.preview]
routes = [
  { pattern = "mcp-staging.useorgx.com", custom_domain = true, zone_name = "useorgx.com" }
]

[env.preview.durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "OrgXMcp" },
  { name = "OAUTH_STATE", class_name = "OAuthState" },
  { name = "SCAFFOLD_SESSION", class_name = "ScaffoldSessionDO" },
  { name = "LIVE_FEED", class_name = "LiveFeedDO" }
]

[[env.preview.kv_namespaces]]
binding = "OAUTH_KV"
id = "8570c22420cf4cc1b287416cbe6bb7c6"

# Non-secret vars only; secrets (ORGX_SERVICE_KEY, MCP_JWT_SECRET,
# ORGX_INTERNAL_SECRET, COOKIE_ENCRYPTION_KEY) set via dashboard or
# `wrangler secret put --env preview`
[env.preview.vars]
ORGX_API_URL = "https://staging.useorgx.com"
ORGX_WEB_URL = "https://staging.useorgx.com"
MCP_SERVER_URL = "https://mcp-staging.useorgx.com"
AUTH_SERVER_URL = "https://mcp-staging.useorgx.com"
SENTRY_ENVIRONMENT = "preview"
SENTRY_TRACES_SAMPLE_RATE = "0.25"
